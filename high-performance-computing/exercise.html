<script>
const { m, c, esc, U, fmt, daysUntil, lec, exe, TYPES } = HPC;
const { key, leg, flag, hbar, num, pct, col, CHARTS, LINES, place, chart, lab, line, mountCharts, isNarrow } = HPCViz;
const q = new URLSearchParams(location.search).get("n");
const e = q === null ? null : c.exercises.find(x => x.n === Number(q));
const page = document.getElementById("page");
const back = `<a class="back" href="high-performance-computing.html">← All lectures and exercises</a>`;
const nn = n => String(n).padStart(2, "0");
const title = e => e.title ? `Exercise ${nn(e.n)} – ${esc(e.title)}` : `Exercise ${nn(e.n)}`;

function head(e) {
  const meta = `${e.published ? `In OPAL since ${fmt(e.published)} · ` : ""}discussed ${fmt(e.date)} · ${exe.start}–${exe.end} · ${esc(exe.room)} · your Wednesday group · ${TYPES.exercise}${e.points ? ` · ${e.points} points in the auto-checked parts` : ""}`;
  return `${back}<div class="big-icon">${e.icon}</div><h1>${title(e)}</h1><p class="meta">${meta}</p>`;
}
// A task of the sheet: its number and points on the left, the question in our own words, then the worked answer.
const task = (id, pts, t, body) => `<section class="task" id="t${id.replace(/\W/g, "")}"><div class="task-h"><span class="task-n">${id}</span><h2>${t}</h2>${pts ? `<span class="pts">${pts} pt</span>` : `<span class="pts open">discussed in the session</span>`}</div>${body}</section>`;
const ans = (items) => `<div class="ans">${items.map(([v, l]) => `<div class="a"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
const amdahl = (f, p) => 1 / ((1 - f) + f / p);
const fix = (v, d = 2) => v.toFixed(d), pct2 = v => fix(v * 100) + " %";
const lg2c = n => Math.ceil(Math.log2(n));

// ---------------- Task 1: a parallel sum, tree reduction ----------------
// Counting convention (see the box on the page): the serial loop costs 2U additions; a PE with n terms needs n pair
// additions and n − 1 accumulations; the partial sums of p' = min(p, U) PEs are reduced in ⌈log₂ p'⌉ rounds.
function treeSim(Uu, p) {
  const pp = Math.min(p, Uu), base = Math.floor(Uu / pp), rest = Uu % pp;
  const terms = Array.from({ length: pp }, (_, k) => base + (k < rest ? 1 : 0));
  const local = terms.map(n => 2 * n - 1), lmax = Math.max(...local), rounds = lg2c(pp);
  return { pp, terms, local, lmax, rounds, T1: 2 * Uu, Tp: lmax + rounds };
}
function treeGantt(Uu, p) {
  const s = treeSim(Uu, p), cols = s.Tp;
  const rows = s.terms.map((n, k) => {
    const row = Array(cols).fill("");
    let t = 0;
    for (let i = 0; i < n; i++) { row[t++] = `<span class="pc s1" title="pair sum a+b">a+b</span>`; if (i) row[t++] = `<span class="pc s2" title="add to the local sum">+</span>`; }
    for (let r = 1; r <= s.rounds; r++) { const st = 2 ** r, half = st / 2;
      if (k % st === 0 && k + half < s.pp) row[s.lmax + r - 1] = `<span class="pc s3" title="tree round ${r}: add the partner's partial sum">⊕</span>`;
      else if (k % st === half) row[s.lmax + r - 1] = `<span class="pc out" title="partial sum handed to PE ${k - half + 1}">→</span>`; }
    return `<div class="rl">PE ${k + 1}</div>${row.map(x => `<div class="gc">${x}</div>`).join("")}`;
  }).join("");
  return `<div class="gantt" style="--cols:${cols}"><div class="rl"></div>${Array.from({ length: cols }, (_, t) => `<div class="gh">${t + 1}</div>`).join("")}${rows}</div>`;
}
function treePhases(Uu, p) {
  const s = treeSim(Uu, p), W = s.Tp;
  const seg = (w, cls, t) => `<span class="seg ${cls}" style="flex:${w}" title="${t}">${w >= W / 8 ? w : ""}</span>`;
  const pairs = Math.max(...s.terms), acc = pairs - 1;
  return `<div class="phases"><div class="agrow"><span class="agl">slowest PE</span><span class="agtrack">${seg(pairs, "s1", `${pairs} pair sums`)}${acc ? seg(acc, "s2", `${acc} local accumulations`) : ""}${seg(s.rounds, "s3", `${s.rounds} tree rounds`)}</span><span class="agv">${s.Tp}</span></div></div>`;
}
const TR = { Uu: 6, k: Math.log2(6), inf: false };
const TR_PRESETS = [["the sheet: U = 6, p = 6", 6, 6, false], ["U = 600, p = 6", 600, 6, false], ["U = 600, unlimited PEs", 600, 600, true], ["U = 6, p = 2", 6, 2, false]];
function trOut() {
  const Uu = TR.Uu, p = TR.inf ? Uu : Math.min(Uu, Math.round(2 ** TR.k)), s = treeSim(Uu, p), S = s.T1 / s.Tp;
  const small = s.pp <= 8 && s.Tp <= 24;
  return `${small ? treeGantt(Uu, p) : treePhases(Uu, p)}
    ${leg([[1, "pair sum aᵢ + bᵢ"], [2, "add to the local sum"], [3, "tree round: add the partner's partial sum"]])}
    <dl class="ro">
      <dt>Serial</dt><dd>T₁ = 2 · ${Uu} = ${num(s.T1, 0)} additions (the loop adds each pair, then adds it to y)</dd>
      <dt>Parallel</dt><dd>T<sub>p</sub> = ${s.lmax} local ${s.lmax === 1 ? "step" : "steps"} on the slowest PE (${Math.max(...s.terms)} terms) + ⌈log₂ ${s.pp}⌉ = ${s.rounds} tree rounds = <b>${num(s.Tp, 0)}</b></dd>
      <dt>Result</dt><dd>S = ${num(s.T1, 0)} / ${num(s.Tp, 0)} = <b>${num(S, 3)}</b> · E = S / ${s.pp} = <b>${pct(S / s.pp)}</b>${p < s.pp ? "" : TR.inf ? ` · with unlimited PEs only ${s.pp} are useful` : ""}</dd>
    </dl>`;
}
function initTree(body) {
  body.innerHTML = `<div class="presets">${TR_PRESETS.map(([t], k) => `<button class="preset" data-p="${k}">${t}</button>`).join("")}</div>
    <div class="ctl"><label>Terms U <input type="range" min="2" max="12" step="0.1"> <output></output></label>
      <label>PEs p <input type="range" min="0" max="10" step="1"> <output></output></label>
      <label><input type="checkbox"> unlimited PEs</label></div>
    <p class="lab-note">Step by step: each PE adds its pairs and accumulates them, then the partial sums meet in a binary tree. Rows are PEs, columns are time steps; → marks a partial sum handed to a partner.</p><div class="out"></div>`;
  const [ru, rp, ci] = body.querySelectorAll("input"), [ou, op] = body.querySelectorAll("output"), out = body.querySelector(".out");
  const draw = () => { ru.value = Math.log2(TR.Uu); rp.value = TR.k; ci.checked = TR.inf; rp.disabled = TR.inf; ou.textContent = TR.Uu; op.textContent = TR.inf ? "∞" : Math.round(2 ** TR.k); out.innerHTML = trOut(); };
  ru.addEventListener("input", () => { TR.Uu = Math.round(2 ** +ru.value); draw(); });
  rp.addEventListener("input", () => { TR.k = +rp.value; draw(); });
  ci.addEventListener("change", () => { TR.inf = ci.checked; draw(); });
  body.addEventListener("click", ev => { const t = ev.target.closest("[data-p]"); if (!t) return; const [, u, p, inf] = TR_PRESETS[+t.dataset.p]; TR.Uu = u; TR.k = Math.log2(p); TR.inf = inf; draw(); });
  draw();
}
const treeS = (Uu, p) => { const s = treeSim(Uu, p); return s.T1 / s.Tp; };
line("treeS", {
  x: [1, 1024], y: [0, 128], yTicks: [0, 32, 64, 96, 128], xTicks: [1, 4, 16, 64, 256, 1024], xTicksN: [1, 8, 64, 512], yTitle: "speedup S",
  series: [{ name: "ideal, S = p", short: "ideal S = p", f: v => v, dash: true, labelAt: 90 }, { slot: 1, name: "U = 600 terms", short: "U = 600", f: v => treeS(600, v) }, { slot: 2, name: "U = 6 terms", short: "U = 6", f: v => treeS(6, v) }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => num(v, 1), focusAt: 64, labelW: 72,
  hitLabel: "Read the speedups: arrow keys double or halve the number of PEs",
  aria: "Line chart: speedup of the parallel sum versus number of PEs for 600 terms and for 6 terms, against the ideal line. The 600-term curve follows the ideal up to about 64 PEs and reaches 109 at 1024; the 6-term curve stops at 3.",
});

// ---------------- Task 3 and 4: Amdahl's law ----------------
const T3 = [[0.9, 4], [0.9, 32], [0.95, 32], [0.99, 32]];
line("t3", {
  x: [1, 64], y: [0, 40], yTicks: [0, 10, 20, 30, 40], xTicks: [1, 2, 4, 8, 16, 32, 64], xTicksN: [1, 4, 16, 64], yTitle: "speedup S",
  series: [{ slot: 1, name: "f = 0.90", short: "f = 0.90", f: v => amdahl(0.9, v) }, { slot: 2, name: "f = 0.95", short: "f = 0.95", f: v => amdahl(0.95, v) }, { slot: 3, name: "f = 0.99", short: "f = 0.99", f: v => amdahl(0.99, v) }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => num(v, 2), focusAt: 32, labelW: 64,
  hitLabel: "Read the speedups: arrow keys double or halve the number of PEs",
  aria: "Line chart of Amdahl's law from 1 to 64 PEs for parallel fractions 0.90, 0.95 and 0.99, with the four asked points marked: 3.08 at 4 PEs for 0.90, and 7.80, 12.55 and 24.43 at 32 PEs.",
  extra: (g, narrow) => T3.map(([f, p], i) => { const X = g.x(p), Y = g.y(amdahl(f, p)), s = [0.9, 0.95, 0.99].indexOf(f) + 1;
    return `<circle class="dot ring" style="fill:var(--vz-s${s})" cx="${X}" cy="${Y}" r="5"/>${narrow ? "" : `<text class="note" x="${X + (p === 32 ? 8 : 8)}" y="${Y + 4}">${num(amdahl(f, p), 2)}</text>`}`; }).join(""),
});
const effP = (f, p) => amdahl(f, p) / p;
line("t4", {
  x: [1, 1024], y: [0, 1], yTicks: [0, 0.25, 0.5, 0.75, 1], xTicks: [1, 4, 16, 64, 256, 1024], xTicksN: [1, 8, 64, 512], yTitle: "efficiency E",
  series: [{ slot: 1, name: "E for f = 0.998", short: "f = 0.998", f: v => effP(0.998, v) }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => pct(v), focusAt: 64, labelW: 72,
  hitLabel: "Read the efficiency: arrow keys double or halve the number of PEs",
  aria: "Line chart: parallel efficiency versus number of PEs for a 99.8 percent parallel program. It stays above 90 percent up to 56 PEs, crosses the 90 percent line between 56 and 57, and falls to 33 percent at 1024.",
  extra: (g, narrow) => `<rect class="band" x="${g.L}" y="${g.y(1)}" width="${g.PW}" height="${g.y(0.9) - g.y(1)}"/><line class="ann dash" x1="${g.L}" x2="${g.W - g.R}" y1="${g.y(0.9)}" y2="${g.y(0.9)}"/>${narrow ? "" : `<text class="note" x="${g.L + 4}" y="${g.y(0.9) + 13}">required: E ≥ 90 %</text>`}
    <circle class="dot ring" style="fill:var(--vz-s1)" cx="${g.x(56)}" cy="${g.y(effP(0.998, 56))}" r="5"/><text class="note" x="${g.x(56) + 8}" y="${g.y(effP(0.998, 56)) - 8}">p = 56: ${pct(effP(0.998, 56))}</text>`,
});

// ---------------- Task 5: the loop nest ----------------
// 1000 values of i, 10 of j, one multiplication and one addition each: 20,000 operations in 1,000 independent chains of 20.
const LN = { p: 100 };
function loopOut() {
  const p = LN.p, ops = 20000;
  let longest, how, gantt = "";
  if (p <= 1000) { const per = Math.ceil(1000 / p); longest = per * 20; how = `${per} value${per > 1 ? "s" : ""} of i per PE, each a chain of 10 multiplications and 10 additions run one after the other: ${per} × 20 = ${num(longest, 0)} operations.`; }
  else { const per = Math.min(10, Math.floor(p / 1000)), chunks = Math.ceil(10 / per), rounds = lg2c(chunks + 1);
    longest = chunks * 2 - 1 + rounds; how = `${per} PEs share one i: each multiplies ${chunks} product${chunks > 1 ? "s" : ""} b[j]·i and adds them locally (${chunks * 2 - 1} step${chunks * 2 - 1 > 1 ? "s" : ""}), then the ${chunks} partial sums and the old a[i] meet in a tree of ⌈log₂ ${chunks + 1}⌉ = ${rounds} rounds: ${longest} operations.`;
    const cols = longest, rows = Array.from({ length: per }, (_, k) => { const row = Array(cols).fill(""); let t = 0;
      for (let i = 0; i < chunks; i++) { row[t++] = `<span class="pc s1" title="b[j]·i">×</span>`; if (i) row[t++] = `<span class="pc s2" title="add to the local sum">+</span>`; }
      for (let r = 1; r <= rounds; r++) { const st = 2 ** r, half = st / 2; const nodes = per + 1;
        if (k % st === 0 && k + half < nodes) row[chunks * 2 - 1 + r - 1] = `<span class="pc s3" title="tree round ${r}">⊕</span>`; else if (k % st === half) row[chunks * 2 - 1 + r - 1] = `<span class="pc out">→</span>`; }
      return `<div class="rl">PE ${k + 1}</div>${row.map(x => `<div class="gc">${x}</div>`).join("")}`; }).join("");
    gantt = `<div class="gantt" style="--cols:${cols}"><div class="rl"></div>${Array.from({ length: cols }, (_, t) => `<div class="gh">${t + 1}</div>`).join("")}${rows}<div class="rl">a[i]</div>${Array(cols).fill("").map((_, t) => `<div class="gc">${t === chunks * 2 - 1 ? `<span class="pc out">→</span>` : ""}</div>`).join("")}</div><p class="lab-note">One value of i. The old a[i] joins the tree as the ${per + 1}th operand; PE 1 holds the result.</p>`; }
  const S = ops / longest;
  return `${gantt}<dl class="ro">
      <dt>Mapping</dt><dd>${how}</dd>
      <dt>Longest UE</dt><dd><b>${num(longest, 0)}</b> operations</dd>
      <dt>Speedup</dt><dd>S = ${num(ops, 0)} / ${num(longest, 0)} = <b>${num(S, 0)}</b> · E = ${pct(S / p)}</dd>
      <dt>Difficulty</dt><dd>${p <= 1000 ? (p === 1000 ? "None: one i per PE, every chain is independent, perfect speedup." : "None, as long as 1,000 divides evenly: the work is a thousand identical, independent chains.") : "a[i] is updated ten times in a row, so the ten PEs for one i must restructure the additions into a tree (which assumes associativity and changes floating-point rounding) and synchronize three or four times; most PEs idle during the tree, so efficiency falls to " + pct(S / p) + "."}</dd>
    </dl>`;
}
function initLoop(body) {
  body.innerHTML = `<div class="presets">${[100, 1000, 10000].map(p => `<button class="preset" data-p="${p}">${num(p, 0)} PEs</button>`).join("")}</div><div class="out"></div>`;
  const out = body.querySelector(".out"), draw = () => { out.innerHTML = loopOut(); body.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.p === LN.p)); };
  body.addEventListener("click", ev => { const t = ev.target.closest("[data-p]"); if (!t) return; LN.p = +t.dataset.p; draw(); });
  draw();
}

// ---------------- Task 6 and 7: fitting the parallel fraction, overhead ----------------
const T6 = [450, 227.03, 152.70, 115.54, 93.24, 78.38, 67.76];
const f6 = (1 - T6[1] / 450) / (1 - 1 / 2); // from the 2-core measurement
const T6model = p => 450 * ((1 - f6) + f6 / p);
line("t6", {
  x: [1, 16], y: [0, 450], yTicks: [0, 100, 200, 300, 400], xTicks: [1, 2, 4, 8, 16], xTicksN: [1, 2, 4, 8, 16], yTitle: "runtime in s",
  series: [{ slot: 1, name: `Amdahl model, f = ${pct(f6)}`, short: " ", f: T6model }],
  tipHead: v => `${v} core${v > 1 ? "s" : ""}`, fmtY: v => num(v, 1) + " s", focusAt: 4, labelW: 60,
  hitLabel: "Read the runtimes: arrow keys double or halve the number of cores",
  aria: "Line chart: measured runtime for 1 to 7 cores as dots on the fitted Amdahl curve for a 99.1 percent parallel program, extended to 16 cores where it predicts 31.9 seconds.",
  extra: (g, narrow) => T6.map((t, i) => `<circle class="dot" style="fill:var(--vz-s2)" cx="${g.x(i + 1)}" cy="${g.y(t)}" r="4.5"/>`).join("") +
    `<circle class="dot ring" style="fill:var(--vz-s1)" cx="${g.x(16)}" cy="${g.y(T6model(16))}" r="5"/>${narrow ? "" : `<text class="note" x="${g.x(16) - 8}" y="${g.y(T6model(16)) - 10}" text-anchor="end">16 cores: ${num(T6model(16), 1)} s</text>`}`,
});
const T7 = [450.9, 227.25, 153.30, 116.78, 95.22, 81.15, 71.36], f7 = 0.998;
const o7 = T7.map((t, i) => t / 450 - ((1 - f7) + f7 / (i + 1)));
const S7 = p => 1 / ((1 - f7) + f7 / p + 0.002 * p), S7free = p => amdahl(f7, p);
const best7 = (() => { let b = 1; for (let p = 1; p <= 256; p++) if (S7(p) > S7(b)) b = p; return b; })();
line("t7", {
  x: [1, 256], y: [0, 64], yTicks: [0, 16, 32, 48, 64], xTicks: [1, 2, 4, 8, 16, 32, 64, 128, 256], xTicksN: [1, 4, 16, 64, 256], yTitle: "speedup S",
  series: [{ slot: 1, name: "Amdahl without overhead, f = 0.998", short: "no overhead", f: S7free }, { slot: 2, name: "with o(p) = 0.002 · p", short: "with overhead", f: S7 }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => num(v, 2), focusAt: 22, labelW: 92,
  hitLabel: "Read the speedups: arrow keys double or halve the number of PEs",
  aria: "Line chart: speedup versus PEs for a 99.8 percent parallel program without overhead, rising towards 64 at 256 PEs, and with a linear overhead of 0.002 per PE, which peaks at 10.95 for 22 PEs and falls afterwards. The seven measured speedups sit on the overhead curve.",
  extra: (g, narrow) => T7.map((t, i) => `<circle class="dot" style="fill:var(--vz-s2)" cx="${g.x(i + 1)}" cy="${g.y(450 / t)}" r="4.5"/>`).join("") +
    `<circle class="dot ring" style="fill:var(--vz-s2)" cx="${g.x(best7)}" cy="${g.y(S7(best7))}" r="5"/><text class="note" x="${g.x(best7) + 8}" y="${g.y(S7(best7)) - 8}">max ${num(S7(best7), 2)} at p = ${best7}</text>`,
});

// ---------------- Part A: the 2D heat stencil, partitioned into row bands ----------------
CHARTS.stencil = narrow => {
  const n = 14, cs = narrow ? 20 : 26, G = 2, L = narrow ? 8 : 70, T = 8, W = L + n * (cs + G) + (narrow ? 8 : 150), H = T + n * (cs + G) + 8, bands = 4, per = (n - 2) / bands;
  const cell = (i, j) => { const x = L + j * (cs + G), y = T + i * (cs + G), edge = i === 0 || j === 0 || i === n - 1 || j === n - 1;
    const b = edge ? 0 : Math.floor((i - 1) / per) + 1;
    return `<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" class="${edge ? "edge" : `f${b}`}" opacity="${edge ? 1 : (i - 1) % per === 0 || (i - 1) % per === per - 1 ? 0.9 : 0.55}"/>`; };
  const cells = []; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) cells.push(cell(i, j));
  const ci = 6, cj = 7, sx = j => L + j * (cs + G) + cs / 2, sy = i => T + i * (cs + G) + cs / 2;
  const star = [[ci, cj], [ci - 1, cj], [ci + 1, cj], [ci, cj - 1], [ci, cj + 1]].map(([i, j], k) => `<circle cx="${sx(j)}" cy="${sy(i)}" r="${k ? 4 : 5.5}" class="${k ? "sdot" : "sdot c"}"/>`).join("") +
    `<line class="sl" x1="${sx(cj)}" x2="${sx(cj)}" y1="${sy(ci - 1)}" y2="${sy(ci + 1)}"/><line class="sl" x1="${sx(cj - 1)}" x2="${sx(cj + 1)}" y1="${sy(ci)}" y2="${sy(ci)}"/>`;
  const labels = narrow ? "" : Array.from({ length: bands }, (_, b) => `<text class="cat" x="${L - 10}" y="${T + (1 + b * per + per / 2) * (cs + G)}" text-anchor="end">PE ${b + 1}</text>`).join("") +
    `<text class="note" x="${L + n * (cs + G) + 12}" y="${T + 14}">boundary rows and columns:</text><text class="note" x="${L + n * (cs + G) + 12}" y="${T + 28}">fixed at 0, never computed</text>
     <text class="note" x="${L + n * (cs + G) + 12}" y="${T + 2.5 * (cs + G) + 4}">darker rows: a band's</text><text class="note" x="${L + n * (cs + G) + 12}" y="${T + 2.5 * (cs + G) + 18}">halo, needed by the</text><text class="note" x="${L + n * (cs + G) + 12}" y="${T + 2.5 * (cs + G) + 32}">neighbouring PE each step</text>
     <text class="note" x="${L + n * (cs + G) + 12}" y="${sy(ci) + 4}">the 5-point stencil</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A 14 by 14 grid of cells. The outer ring is the fixed boundary. The twelve interior rows are split into four bands of three rows, one per PE; the first and last row of each band are drawn darker because the neighbouring PE needs them every time step. A five-point stencil is drawn on one cell.">${cells.join("")}${star}${labels}</svg>`;
};

    ${task("2", 0, "Amdahl's law, in your own words", `
      <p>Two free-text answers: describe the law to a fellow student, and say why it matters for parallel computing. The sheet asks for your own words, so write them; this is a model answer to check against.</p>
      <div class="ex"><div class="kicker">a) The law</div>
        <p>Take a program that runs in time T₁ on one processor and split its work into a part that can be spread over p processors (a fraction f of T₁) and a part that cannot (1 − f): setup, I/O, anything inherently sequential. Only the first part gets faster, so T<sub>p</sub> = (1 − f) · T₁ + f · T₁ / p and the speedup is S<sub>p</sub> = 1 / ((1 − f) + f / p). As p grows, f / p vanishes and S approaches 1 / (1 − f): the serial fraction alone caps the speedup, no matter how many processors you add. The problem size is fixed; the law describes solving the same problem faster.</p></div>
      <div class="ex"><div class="kicker">b) Why it matters</div>
        <p>It sets expectations and priorities. A code with 5 % serial work can never run more than 20× faster, so buying 1,000 cores for it wastes 980; the useful first step is to shrink the serial part, not to add processors. It explains why efficiency falls as p grows, which is what computing centres bill and what task 4 asks about. And it tells you what to measure: the parallel fraction f, which task 6 fits from runtimes. Its blind spots matter too: it ignores synchronization overhead (task 7), and it is pessimistic when a bigger machine is used for a bigger problem, where Gustafson's fixed-time view applies instead.</p></div>`)}

      <div class="ex"><div class="kicker">Worked answer</div>
        <p><b>100 PEs.</b> Give each PE 10 values of i. It runs 10 chains of 20 operations one after the other: 200 operations, S = 20,000 / 200 = 100, perfect efficiency, no synchronization at all.</p>

        <p><b>10,000 PEs.</b> Now ten PEs must share one i. Each computes one product in step 1. The ten products and the old a[i] are eleven values to add; sequentially that is ten steps, so the only way to use the ten PEs is to add them as a tree: 11 → 6 → 3 → 2 → 1, four rounds. The longest UE does 1 + 4 = 5 operations, S = 20,000 / 5 = 4,000, E = 40 %. Difficulties: the additions must be reassociated (fine for integers, a different rounding for floating point), the ten PEs synchronize after every round, and from round two on most of them idle. If instead you keep the ten products in a tree and add the old a[i] only at the end, it is 1 + 4 + 1 = 6 operations and S = 3,333; the session will settle which the chair expects.</p></div>`)}

    <h2>The 2D heat solver</h2>
    <p>The last three parts share one program: an explicit finite-difference solver (forward in time, centred in space) for heat spreading over an N × N grid. Each time step replaces every interior temperature by itself plus a constant times the sum of its four neighbours minus four times itself, the <b>five-point stencil</b>; the edges stay at 0, and the new grid u_new is copied back into u before the next step. The sheet's first version holds two 1000 × 1000 arrays on the stack and copies them element by element; the second allocates them on the heap and swaps two pointers instead.</p>

    ${task("A", 0, "PCAM on the heat solver", `
      <p>Four questions to discuss: which tasks, how they synchronize, what that means for agglomeration, and whether load balance is a problem. (The textbox only asks whether you will do that.)</p>
      ${chart("stencil", "")}
        <figcaption>A 14 × 14 grid cut into four row bands of three rows, one per PE. Every interior cell needs its four neighbours from the previous time step; the darker rows at a band's edge are what the neighbouring PE must receive before it can compute its own edge row.</figcaption>
      </figure>
      <div class="ex"><div class="kicker">Worked discussion</div>
        <p><b>Partition.</b> The finest task is one cell update per time step: (N − 2)² tasks per step, all identical, all independent within a step. Data parallelism, like the weather grid in lecture 1.</p>
        <p><b>Communication.</b> A cell update reads the four neighbours' values from the previous step and writes one new value. So every task depends on five tasks of the previous step and feeds five of the next: no dependencies inside a step, a complete dependency wall between steps. The synchronization is a barrier after each step (and after the copy-back) plus the exchange of border values between neighbouring tasks.</p>
        <p><b>Agglomeration.</b> Single cells would communicate four values for one update. Merging a block of rows (or a 2D block) per PE keeps the communication to the block's border, the halo: a band of r rows exchanges 2 rows for r · N updates, so the ratio of computation to communication grows with r. One band per PE, as in the picture, turns the exchange into one message to each neighbour per step. Within a PE the stencil runs as plain loops.</p>
        <p><b>Load balance.</b> Every interior cell costs the same, so equal bands are balanced; the only imbalance is the boundary (the edge rows are not computed, and the top and bottom PEs have one halo neighbour instead of two). On 128 cores and a 128 × 128 grid that is one row per core: 126 cores computing, 2 holding fixed edges. Static partitioning is enough; nothing moves between PEs during the run.</p></div>`)}

    ${task("B", 2, "Parallelize the copy-back", `
      <p>128 × 128 field, 128 cores, no synchronization cost, equal shares, no hardware limit on throughput. Copying an element is one load and one store. What speedup does parallelizing the copy give, and what does double buffering give, where two pointers are swapped instead (two loads, two stores)?</p>
      ${chart("copy", "")}
        <figcaption>Operations for moving u_new into u, on a log axis. Hover or focus a bar for the breakdown.</figcaption>
      </figure>
      ${ans([["S = 128", "copy: 32,768 / 256"], ["S = 1", "pointer swap: 4 operations, serial or parallel"]])}
      <div class="ex"><div class="kicker">Worked answer</div>
        <p>The copy moves 16,384 elements with 2 operations each: 32,768 operations serially. 128 threads take 128 elements each, 256 operations: S = 32,768 / 256 = <b>128</b>, perfect, because there is nothing to synchronize.</p>
        <p>Double buffering does not copy at all. Swapping two pointers is 4 operations, and it cannot be split across threads, so parallelizing it gives <b>S = 1</b>. The speedup <i>from parallelization</i> is 1, but the swap is 8,192× faster than the serial copy and still 64× faster than the 128-thread copy. The lesson, in the chair's words on the sheet: changing the algorithm beats parallelizing a bad one. Real codes also save the memory bandwidth, which the “no hardware limit” assumption hides.</p></div>`)}

    ${task("C", 2, "Speedup of the mean temperature", `
      <p>A check that energy is conserved: sum all u[x][y] and divide by N². Same assumptions as in B, the division is free, and in the final phase one thread adds up the 128 local sums; then the same with a binary-tree reduction. Two decimals.</p>
      ${chart("mean", leg([[1, "local sum of 128 values per thread"], [2, "final reduction"]]))}
        <figcaption>Time steps of the two parallel versions of the sum of 16,384 values on 128 threads. The serial version needs 16,384 additions. Hover or focus a bar.</figcaption>
      </figure>
      ${ans([["S = 64.00", "one thread reduces: 16,384 / (128 + 128)"], ["S = 121.36", "binary tree: 16,384 / (128 + 7)"]])}
      <div class="ex"><div class="kicker">Worked answer</div>
        <p>Serially the sum loop does 16,384 additions. Each of the 128 threads adds its 128 values in 128 steps (the loop form, starting from 0). If one thread then adds the 128 local sums one after the other, that is another 128 steps: T = 256 and S = 16,384 / 256 = <b>64.00</b>, half of the 128 you paid for, because the whole machine waits while one thread reduces.</p>
        <p>A binary tree reduces 128 partial sums in log₂ 128 = 7 rounds: T = 135, S = 16,384 / 135 = <b>121.36</b>, E = 94.8 %. The 7 is task 1.2 again, and this is exactly what <code>reduction(+:sum)</code> in OpenMP or <code>MPI_Reduce</code> do for you in the later lectures.</p>
        <p class="muted">Alternative counts: without the 0 + … additions, 16,383 / (127 + 127) = 64.50 and 16,383 / (127 + 7) = 122.26; with the reducing thread starting from its own sum, 16,384 / 255 = 64.25. Try the loop-form answers first.</p></div>`)}

    </ul>

}
