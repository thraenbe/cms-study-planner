<script>
const { m, c, esc, U, fmt, daysUntil, lec, exe, TYPES } = HPC;
const { key, leg, flag, hbar, num, pct, col, CHARTS, LINES, place, chart, lab, line, mountCharts, isNarrow } = HPCViz;
const q = new URLSearchParams(location.search).get("n");
const e = q === null ? null : c.exercises.find(x => x.n === Number(q));
const page = document.getElementById("page");
const back = `<a class="back" href="high-performance-computing.html">← All lectures and exercises</a>`;
const nn = n => String(n).padStart(2, "0");
const title = e => e.title ? `Exercise ${nn(e.n)} – ${esc(e.title)}` : `Exercise ${nn(e.n)}`;

function head(e) {
  const meta = `${e.published ? `In OPAL since ${fmt(e.published)} · ` : ""}discussed ${fmt(e.date)} · ${exe.start}–${exe.end} · ${esc(exe.room)} · your Wednesday group · ${TYPES.exercise}${e.points ? ` · ${e.points} points in the auto-checked parts` : ""}`;
  return `${back}<div class="big-icon">${e.icon}</div><h1>${title(e)}</h1><p class="meta">${meta}</p>`;
}
// A task of the sheet: its number and points on the left, the question in our own words, then the worked answer.
const task = (id, pts, t, body) => `<section class="task" id="t${id.replace(/\W/g, "")}"><div class="task-h"><span class="task-n">${id}</span><h2>${t}</h2>${pts ? `<span class="pts">${pts} pt</span>` : `<span class="pts open">discussed in the session</span>`}</div>${body}</section>`;
const ans = (items) => `<div class="ans">${items.map(([v, l]) => `<div class="a"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
const amdahl = (f, p) => 1 / ((1 - f) + f / p);
const fix = (v, d = 2) => v.toFixed(d), pct2 = v => fix(v * 100) + " %";
const lg2c = n => Math.ceil(Math.log2(n));

// ---------------- Task 1: a parallel sum, tree reduction ----------------
// Counting convention (see the box on the page): the serial loop costs 2U additions; a PE with n terms needs n pair
// additions and n − 1 accumulations; the partial sums of p' = min(p, U) PEs are reduced in ⌈log₂ p'⌉ rounds.
function treeSim(Uu, p) {
  const pp = Math.min(p, Uu), base = Math.floor(Uu / pp), rest = Uu % pp;
  const terms = Array.from({ length: pp }, (_, k) => base + (k < rest ? 1 : 0));
  const local = terms.map(n => 2 * n - 1), lmax = Math.max(...local), rounds = lg2c(pp);
  return { pp, terms, local, lmax, rounds, T1: 2 * Uu, Tp: lmax + rounds };
}
function treeGantt(Uu, p) {
  const s = treeSim(Uu, p), cols = s.Tp;
  const rows = s.terms.map((n, k) => {
    const row = Array(cols).fill("");
    let t = 0;
    for (let i = 0; i < n; i++) { row[t++] = `<span class="pc s1" title="pair sum a+b">a+b</span>`; if (i) row[t++] = `<span class="pc s2" title="add to the local sum">+</span>`; }
    for (let r = 1; r <= s.rounds; r++) { const st = 2 ** r, half = st / 2;
      if (k % st === 0 && k + half < s.pp) row[s.lmax + r - 1] = `<span class="pc s3" title="tree round ${r}: add the partner's partial sum">⊕</span>`;
      else if (k % st === half) row[s.lmax + r - 1] = `<span class="pc out" title="partial sum handed to PE ${k - half + 1}">→</span>`; }
    return `<div class="rl">PE ${k + 1}</div>${row.map(x => `<div class="gc">${x}</div>`).join("")}`;
  }).join("");
  return `<div class="gantt" style="--cols:${cols}"><div class="rl"></div>${Array.from({ length: cols }, (_, t) => `<div class="gh">${t + 1}</div>`).join("")}${rows}</div>`;
}
function treePhases(Uu, p) {
  const s = treeSim(Uu, p), W = s.Tp;
  const seg = (w, cls, t) => `<span class="seg ${cls}" style="flex:${w}" title="${t}">${w >= W / 8 ? w : ""}</span>`;
  const pairs = Math.max(...s.terms), acc = pairs - 1;
  return `<div class="phases"><div class="agrow"><span class="agl">slowest PE</span><span class="agtrack">${seg(pairs, "s1", `${pairs} pair sums`)}${acc ? seg(acc, "s2", `${acc} local accumulations`) : ""}${seg(s.rounds, "s3", `${s.rounds} tree rounds`)}</span><span class="agv">${s.Tp}</span></div></div>`;
}
const TR = { Uu: 6, k: Math.log2(6), inf: false };
const TR_PRESETS = [["the sheet: U = 6, p = 6", 6, 6, false], ["U = 600, p = 6", 600, 6, false], ["U = 600, unlimited PEs", 600, 600, true], ["U = 6, p = 2", 6, 2, false]];
function trOut() {
  const Uu = TR.Uu, p = TR.inf ? Uu : Math.min(Uu, Math.round(2 ** TR.k)), s = treeSim(Uu, p), S = s.T1 / s.Tp;
  const small = s.pp <= 8 && s.Tp <= 24;
  return `${small ? treeGantt(Uu, p) : treePhases(Uu, p)}
    ${leg([[1, "pair sum aᵢ + bᵢ"], [2, "add to the local sum"], [3, "tree round: add the partner's partial sum"]])}
    <dl class="ro">
      <dt>Serial</dt><dd>T₁ = 2 · ${Uu} = ${num(s.T1, 0)} additions (the loop adds each pair, then adds it to y)</dd>
      <dt>Parallel</dt><dd>T<sub>p</sub> = ${s.lmax} local ${s.lmax === 1 ? "step" : "steps"} on the slowest PE (${Math.max(...s.terms)} terms) + ⌈log₂ ${s.pp}⌉ = ${s.rounds} tree rounds = <b>${num(s.Tp, 0)}</b></dd>
      <dt>Result</dt><dd>S = ${num(s.T1, 0)} / ${num(s.Tp, 0)} = <b>${num(S, 3)}</b> · E = S / ${s.pp} = <b>${pct(S / s.pp)}</b>${p < s.pp ? "" : TR.inf ? ` · with unlimited PEs only ${s.pp} are useful` : ""}</dd>
    </dl>`;
}
function initTree(body) {
  body.innerHTML = `<div class="presets">${TR_PRESETS.map(([t], k) => `<button class="preset" data-p="${k}">${t}</button>`).join("")}</div>
    <div class="ctl"><label>Terms U <input type="range" min="2" max="12" step="0.1"> <output></output></label>
      <label>PEs p <input type="range" min="0" max="10" step="1"> <output></output></label>
      <label><input type="checkbox"> unlimited PEs</label></div>
    <p class="lab-note">Step by step: each PE adds its pairs and accumulates them, then the partial sums meet in a binary tree. Rows are PEs, columns are time steps; → marks a partial sum handed to a partner.</p><div class="out"></div>`;
  const [ru, rp, ci] = body.querySelectorAll("input"), [ou, op] = body.querySelectorAll("output"), out = body.querySelector(".out");
  const draw = () => { ru.value = Math.log2(TR.Uu); rp.value = TR.k; ci.checked = TR.inf; rp.disabled = TR.inf; ou.textContent = TR.Uu; op.textContent = TR.inf ? "∞" : Math.round(2 ** TR.k); out.innerHTML = trOut(); };
  ru.addEventListener("input", () => { TR.Uu = Math.round(2 ** +ru.value); draw(); });
  rp.addEventListener("input", () => { TR.k = +rp.value; draw(); });
  ci.addEventListener("change", () => { TR.inf = ci.checked; draw(); });
  body.addEventListener("click", ev => { const t = ev.target.closest("[data-p]"); if (!t) return; const [, u, p, inf] = TR_PRESETS[+t.dataset.p]; TR.Uu = u; TR.k = Math.log2(p); TR.inf = inf; draw(); });
  draw();
}
const treeS = (Uu, p) => { const s = treeSim(Uu, p); return s.T1 / s.Tp; };
line("treeS", {
  x: [1, 1024], y: [0, 128], yTicks: [0, 32, 64, 96, 128], xTicks: [1, 4, 16, 64, 256, 1024], xTicksN: [1, 8, 64, 512], yTitle: "speedup S",
  series: [{ name: "ideal, S = p", short: "ideal S = p", f: v => v, dash: true, labelAt: 90 }, { slot: 1, name: "U = 600 terms", short: "U = 600", f: v => treeS(600, v) }, { slot: 2, name: "U = 6 terms", short: "U = 6", f: v => treeS(6, v) }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => num(v, 1), focusAt: 64, labelW: 72,
  hitLabel: "Read the speedups: arrow keys double or halve the number of PEs",
  aria: "Line chart: speedup of the parallel sum versus number of PEs for 600 terms and for 6 terms, against the ideal line. The 600-term curve follows the ideal up to about 64 PEs and reaches 109 at 1024; the 6-term curve stops at 3.",
});

// ---------------- Task 3 and 4: Amdahl's law ----------------
const T3 = [[0.9, 4], [0.9, 32], [0.95, 32], [0.99, 32]];
line("t3", {
  x: [1, 64], y: [0, 40], yTicks: [0, 10, 20, 30, 40], xTicks: [1, 2, 4, 8, 16, 32, 64], xTicksN: [1, 4, 16, 64], yTitle: "speedup S",
  series: [{ slot: 1, name: "f = 0.90", short: "f = 0.90", f: v => amdahl(0.9, v) }, { slot: 2, name: "f = 0.95", short: "f = 0.95", f: v => amdahl(0.95, v) }, { slot: 3, name: "f = 0.99", short: "f = 0.99", f: v => amdahl(0.99, v) }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => num(v, 2), focusAt: 32, labelW: 64,
  hitLabel: "Read the speedups: arrow keys double or halve the number of PEs",
  aria: "Line chart of Amdahl's law from 1 to 64 PEs for parallel fractions 0.90, 0.95 and 0.99, with the four asked points marked: 3.08 at 4 PEs for 0.90, and 7.80, 12.55 and 24.43 at 32 PEs.",
  extra: (g, narrow) => T3.map(([f, p], i) => { const X = g.x(p), Y = g.y(amdahl(f, p)), s = [0.9, 0.95, 0.99].indexOf(f) + 1;
    return `<circle class="dot ring" style="fill:var(--vz-s${s})" cx="${X}" cy="${Y}" r="5"/>${narrow ? "" : `<text class="note" x="${X + (p === 32 ? 8 : 8)}" y="${Y + 4}">${num(amdahl(f, p), 2)}</text>`}`; }).join(""),
});
const effP = (f, p) => amdahl(f, p) / p;
line("t4", {
  x: [1, 1024], y: [0, 1], yTicks: [0, 0.25, 0.5, 0.75, 1], xTicks: [1, 4, 16, 64, 256, 1024], xTicksN: [1, 8, 64, 512], yTitle: "efficiency E",
  series: [{ slot: 1, name: "E for f = 0.998", short: "f = 0.998", f: v => effP(0.998, v) }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => pct(v), focusAt: 64, labelW: 72,
  hitLabel: "Read the efficiency: arrow keys double or halve the number of PEs",
  aria: "Line chart: parallel efficiency versus number of PEs for a 99.8 percent parallel program. It stays above 90 percent up to 56 PEs, crosses the 90 percent line between 56 and 57, and falls to 33 percent at 1024.",
  extra: (g, narrow) => `<rect class="band" x="${g.L}" y="${g.y(1)}" width="${g.PW}" height="${g.y(0.9) - g.y(1)}"/><line class="ann dash" x1="${g.L}" x2="${g.W - g.R}" y1="${g.y(0.9)}" y2="${g.y(0.9)}"/>${narrow ? "" : `<text class="note" x="${g.L + 4}" y="${g.y(0.9) + 13}">required: E ≥ 90 %</text>`}
    <circle class="dot ring" style="fill:var(--vz-s1)" cx="${g.x(56)}" cy="${g.y(effP(0.998, 56))}" r="5"/><text class="note" x="${g.x(56) + 8}" y="${g.y(effP(0.998, 56)) - 8}">p = 56: ${pct(effP(0.998, 56))}</text>`,
});

// ---------------- Task 5: the loop nest ----------------
// 1000 values of i, 10 of j, one multiplication and one addition each: 20,000 operations in 1,000 independent chains of 20.
const LN = { p: 100 };
function loopOut() {
  const p = LN.p, ops = 20000;
  let longest, how, gantt = "";
  if (p <= 1000) { const per = Math.ceil(1000 / p); longest = per * 20; how = `${per} value${per > 1 ? "s" : ""} of i per PE, each a chain of 10 multiplications and 10 additions run one after the other: ${per} × 20 = ${num(longest, 0)} operations.`; }
  else { const per = Math.min(10, Math.floor(p / 1000)), chunks = Math.ceil(10 / per), rounds = lg2c(chunks + 1);
    longest = chunks * 2 - 1 + rounds; how = `${per} PEs share one i: each multiplies ${chunks} product${chunks > 1 ? "s" : ""} b[j]·i and adds them locally (${chunks * 2 - 1} step${chunks * 2 - 1 > 1 ? "s" : ""}), then the ${chunks} partial sums and the old a[i] meet in a tree of ⌈log₂ ${chunks + 1}⌉ = ${rounds} rounds: ${longest} operations.`;
    const cols = longest, rows = Array.from({ length: per }, (_, k) => { const row = Array(cols).fill(""); let t = 0;
      for (let i = 0; i < chunks; i++) { row[t++] = `<span class="pc s1" title="b[j]·i">×</span>`; if (i) row[t++] = `<span class="pc s2" title="add to the local sum">+</span>`; }
      for (let r = 1; r <= rounds; r++) { const st = 2 ** r, half = st / 2; const nodes = per + 1;
        if (k % st === 0 && k + half < nodes) row[chunks * 2 - 1 + r - 1] = `<span class="pc s3" title="tree round ${r}">⊕</span>`; else if (k % st === half) row[chunks * 2 - 1 + r - 1] = `<span class="pc out">→</span>`; }
      return `<div class="rl">PE ${k + 1}</div>${row.map(x => `<div class="gc">${x}</div>`).join("")}`; }).join("");
    gantt = `<div class="gantt" style="--cols:${cols}"><div class="rl"></div>${Array.from({ length: cols }, (_, t) => `<div class="gh">${t + 1}</div>`).join("")}${rows}<div class="rl">a[i]</div>${Array(cols).fill("").map((_, t) => `<div class="gc">${t === chunks * 2 - 1 ? `<span class="pc out">→</span>` : ""}</div>`).join("")}</div><p class="lab-note">One value of i. The old a[i] joins the tree as the ${per + 1}th operand; PE 1 holds the result.</p>`; }
  const S = ops / longest;
  return `${gantt}<dl class="ro">
      <dt>Mapping</dt><dd>${how}</dd>
      <dt>Longest UE</dt><dd><b>${num(longest, 0)}</b> operations</dd>
      <dt>Speedup</dt><dd>S = ${num(ops, 0)} / ${num(longest, 0)} = <b>${num(S, 0)}</b> · E = ${pct(S / p)}</dd>
      <dt>Difficulty</dt><dd>${p <= 1000 ? (p === 1000 ? "None: one i per PE, every chain is independent, perfect speedup." : "None, as long as 1,000 divides evenly: the work is a thousand identical, independent chains.") : "a[i] is updated ten times in a row, so the ten PEs for one i must restructure the additions into a tree (which assumes associativity and changes floating-point rounding) and synchronize three or four times; most PEs idle during the tree, so efficiency falls to " + pct(S / p) + "."}</dd>
    </dl>`;
}
function initLoop(body) {
  body.innerHTML = `<div class="presets">${[100, 1000, 10000].map(p => `<button class="preset" data-p="${p}">${num(p, 0)} PEs</button>`).join("")}</div><div class="out"></div>`;
  const out = body.querySelector(".out"), draw = () => { out.innerHTML = loopOut(); body.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.p === LN.p)); };
  body.addEventListener("click", ev => { const t = ev.target.closest("[data-p]"); if (!t) return; LN.p = +t.dataset.p; draw(); });
  draw();
}

// ---------------- Task 6 and 7: fitting the parallel fraction, overhead ----------------
const T6 = [450, 227.03, 152.70, 115.54, 93.24, 78.38, 67.76];
const f6 = (1 - T6[1] / 450) / (1 - 1 / 2); // from the 2-core measurement
const T6model = p => 450 * ((1 - f6) + f6 / p);
line("t6", {
  x: [1, 16], y: [0, 450], yTicks: [0, 100, 200, 300, 400], xTicks: [1, 2, 4, 8, 16], xTicksN: [1, 2, 4, 8, 16], yTitle: "runtime in s",
  series: [{ slot: 1, name: `Amdahl model, f = ${pct(f6)}`, short: " ", f: T6model }],
  tipHead: v => `${v} core${v > 1 ? "s" : ""}`, fmtY: v => num(v, 1) + " s", focusAt: 4, labelW: 60,
  hitLabel: "Read the runtimes: arrow keys double or halve the number of cores",
  aria: "Line chart: measured runtime for 1 to 7 cores as dots on the fitted Amdahl curve for a 99.1 percent parallel program, extended to 16 cores where it predicts 31.9 seconds.",
  extra: (g, narrow) => T6.map((t, i) => `<circle class="dot" style="fill:var(--vz-s2)" cx="${g.x(i + 1)}" cy="${g.y(t)}" r="4.5"/>`).join("") +
    `<circle class="dot ring" style="fill:var(--vz-s1)" cx="${g.x(16)}" cy="${g.y(T6model(16))}" r="5"/>${narrow ? "" : `<text class="note" x="${g.x(16) - 8}" y="${g.y(T6model(16)) - 10}" text-anchor="end">16 cores: ${num(T6model(16), 1)} s</text>`}`,
});
const T7 = [450.9, 227.25, 153.30, 116.78, 95.22, 81.15, 71.36], f7 = 0.998;
const o7 = T7.map((t, i) => t / 450 - ((1 - f7) + f7 / (i + 1)));
const S7 = p => 1 / ((1 - f7) + f7 / p + 0.002 * p), S7free = p => amdahl(f7, p);
const best7 = (() => { let b = 1; for (let p = 1; p <= 256; p++) if (S7(p) > S7(b)) b = p; return b; })();
line("t7", {
  x: [1, 256], y: [0, 64], yTicks: [0, 16, 32, 48, 64], xTicks: [1, 2, 4, 8, 16, 32, 64, 128, 256], xTicksN: [1, 4, 16, 64, 256], yTitle: "speedup S",
  series: [{ slot: 1, name: "Amdahl without overhead, f = 0.998", short: "no overhead", f: S7free }, { slot: 2, name: "with o(p) = 0.002 · p", short: "with overhead", f: S7 }],
  tipHead: v => `p = ${v} PE${v > 1 ? "s" : ""}`, fmtY: v => num(v, 2), focusAt: 22, labelW: 92,
  hitLabel: "Read the speedups: arrow keys double or halve the number of PEs",
  aria: "Line chart: speedup versus PEs for a 99.8 percent parallel program without overhead, rising towards 64 at 256 PEs, and with a linear overhead of 0.002 per PE, which peaks at 10.95 for 22 PEs and falls afterwards. The seven measured speedups sit on the overhead curve.",
  extra: (g, narrow) => T7.map((t, i) => `<circle class="dot" style="fill:var(--vz-s2)" cx="${g.x(i + 1)}" cy="${g.y(450 / t)}" r="4.5"/>`).join("") +
    `<circle class="dot ring" style="fill:var(--vz-s2)" cx="${g.x(best7)}" cy="${g.y(S7(best7))}" r="5"/><text class="note" x="${g.x(best7) + 8}" y="${g.y(S7(best7)) - 8}">max ${num(S7(best7), 2)} at p = ${best7}</text>`,
});

// ---------------- Part A: the 2D heat stencil, partitioned into row bands ----------------
CHARTS.stencil = narrow => {
  const n = 14, cs = narrow ? 20 : 26, G = 2, L = narrow ? 8 : 70, T = 8, W = L + n * (cs + G) + (narrow ? 8 : 150), H = T + n * (cs + G) + 8, bands = 4, per = (n - 2) / bands;
  const cell = (i, j) => { const x = L + j * (cs + G), y = T + i * (cs + G), edge = i === 0 || j === 0 || i === n - 1 || j === n - 1;
    const b = edge ? 0 : Math.floor((i - 1) / per) + 1;
    return `<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" class="${edge ? "edge" : `f${b}`}" opacity="${edge ? 1 : (i - 1) % per === 0 || (i - 1) % per === per - 1 ? 0.9 : 0.55}"/>`; };
  const cells = []; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) cells.push(cell(i, j));
  const ci = 6, cj = 7, sx = j => L + j * (cs + G) + cs / 2, sy = i => T + i * (cs + G) + cs / 2;
  const star = [[ci, cj], [ci - 1, cj], [ci + 1, cj], [ci, cj - 1], [ci, cj + 1]].map(([i, j], k) => `<circle cx="${sx(j)}" cy="${sy(i)}" r="${k ? 4 : 5.5}" class="${k ? "sdot" : "sdot c"}"/>`).join("") +
    `<line class="sl" x1="${sx(cj)}" x2="${sx(cj)}" y1="${sy(ci - 1)}" y2="${sy(ci + 1)}"/><line class="sl" x1="${sx(cj - 1)}" x2="${sx(cj + 1)}" y1="${sy(ci)}" y2="${sy(ci)}"/>`;
  const labels = narrow ? "" : Array.from({ length: bands }, (_, b) => `<text class="cat" x="${L - 10}" y="${T + (1 + b * per + per / 2) * (cs + G)}" text-anchor="end">PE ${b + 1}</text>`).join("") +
    `<text class="note" x="${L + n * (cs + G) + 12}" y="${T + 14}">boundary rows and columns:</text><text class="note" x="${L + n * (cs + G) + 12}" y="${T + 28}">fixed at 0, never computed</text>
     <text class="note" x="${L + n * (cs + G) + 12}" y="${T + 2.5 * (cs + G) + 4}">darker rows: a band's</text><text class="note" x="${L + n * (cs + G) + 12}" y="${T + 2.5 * (cs + G) + 18}">halo, needed by the</text><text class="note" x="${L + n * (cs + G) + 12}" y="${T + 2.5 * (cs + G) + 32}">neighbouring PE each step</text>
     <text class="note" x="${L + n * (cs + G) + 12}" y="${sy(ci) + 4}">the 5-point stencil</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A 14 by 14 grid of cells. The outer ring is the fixed boundary. The twelve interior rows are split into four bands of three rows, one per PE; the first and last row of each band are drawn darker because the neighbouring PE needs them every time step. A five-point stencil is drawn on one cell.">${cells.join("")}${star}${labels}</svg>`;
};

    ${task("2", 0, "Amdahl's law, in your own words", `
      <p>Two free-text answers: describe the law to a fellow student, and say why it matters for parallel computing. The sheet asks for your own words, so write them; this is a model answer to check against.</p>
      <div class="ex"><div class="kicker">a) The law</div>
        <p>Take a program that runs in time T₁ on one processor and split its work into a part that can be spread over p processors (a fraction f of T₁) and a part that cannot (1 − f): setup, I/O, anything inherently sequential. Only the first part gets faster, so T<sub>p</sub> = (1 − f) · T₁ + f · T₁ / p and the speedup is S<sub>p</sub> = 1 / ((1 − f) + f / p). As p grows, f / p vanishes and S approaches 1 / (1 − f): the serial fraction alone caps the speedup, no matter how many processors you add. The problem size is fixed; the law describes solving the same problem faster.</p></div>
      <div class="ex"><div class="kicker">b) Why it matters</div>
        <p>It sets expectations and priorities. A code with 5 % serial work can never run more than 20× faster, so buying 1,000 cores for it wastes 980; the useful first step is to shrink the serial part, not to add processors. It explains why efficiency falls as p grows, which is what computing centres bill and what task 4 asks about. And it tells you what to measure: the parallel fraction f, which task 6 fits from runtimes. Its blind spots matter too: it ignores synchronization overhead (task 7), and it is pessimistic when a bigger machine is used for a bigger problem, where Gustafson's fixed-time view applies instead.</p></div>`)}

      <div class="ex"><div class="kicker">Worked answer</div>
        <p><b>100 PEs.</b> Give each PE 10 values of i. It runs 10 chains of 20 operations one after the other: 200 operations, S = 20,000 / 200 = 100, perfect efficiency, no synchronization at all.</p>

        <p><b>10,000 PEs.</b> Now ten PEs must share one i. Each computes one product in step 1. The ten products and the old a[i] are eleven values to add; sequentially that is ten steps, so the only way to use the ten PEs is to add them as a tree: 11 → 6 → 3 → 2 → 1, four rounds. The longest UE does 1 + 4 = 5 operations, S = 20,000 / 5 = 4,000, E = 40 %. Difficulties: the additions must be reassociated (fine for integers, a different rounding for floating point), the ten PEs synchronize after every round, and from round two on most of them idle. If instead you keep the ten products in a tree and add the old a[i] only at the end, it is 1 + 4 + 1 = 6 operations and S = 3,333; the session will settle which the chair expects.</p></div>`)}

    <h2>The 2D heat solver</h2>
    <p>The last three parts share one program: an explicit finite-difference solver (forward in time, centred in space) for heat spreading over an N × N grid. Each time step replaces every interior temperature by itself plus a constant times the sum of its four neighbours minus four times itself, the <b>five-point stencil</b>; the edges stay at 0, and the new grid u_new is copied back into u before the next step. The sheet's first version holds two 1000 × 1000 arrays on the stack and copies them element by element; the second allocates them on the heap and swaps two pointers instead.</p>

    ${task("A", 0, "PCAM on the heat solver", `
      <p>Four questions to discuss: which tasks, how they synchronize, what that means for agglomeration, and whether load balance is a problem. (The textbox only asks whether you will do that.)</p>
      ${chart("stencil", "")}
        <figcaption>A 14 × 14 grid cut into four row bands of three rows, one per PE. Every interior cell needs its four neighbours from the previous time step; the darker rows at a band's edge are what the neighbouring PE must receive before it can compute its own edge row.</figcaption>
      </figure>
      <div class="ex"><div class="kicker">Worked discussion</div>
        <p><b>Partition.</b> The finest task is one cell update per time step: (N − 2)² tasks per step, all identical, all independent within a step. Data parallelism, like the weather grid in lecture 1.</p>
        <p><b>Communication.</b> A cell update reads the four neighbours' values from the previous step and writes one new value. So every task depends on five tasks of the previous step and feeds five of the next: no dependencies inside a step, a complete dependency wall between steps. The synchronization is a barrier after each step (and after the copy-back) plus the exchange of border values between neighbouring tasks.</p>
        <p><b>Agglomeration.</b> Single cells would communicate four values for one update. Merging a block of rows (or a 2D block) per PE keeps the communication to the block's border, the halo: a band of r rows exchanges 2 rows for r · N updates, so the ratio of computation to communication grows with r. One band per PE, as in the picture, turns the exchange into one message to each neighbour per step. Within a PE the stencil runs as plain loops.</p>
        <p><b>Load balance.</b> Every interior cell costs the same, so equal bands are balanced; the only imbalance is the boundary (the edge rows are not computed, and the top and bottom PEs have one halo neighbour instead of two). On 128 cores and a 128 × 128 grid that is one row per core: 126 cores computing, 2 holding fixed edges. Static partitioning is enough; nothing moves between PEs during the run.</p></div>`)}

    ${task("B", 2, "Parallelize the copy-back", `
      <p>128 × 128 field, 128 cores, no synchronization cost, equal shares, no hardware limit on throughput. Copying an element is one load and one store. What speedup does parallelizing the copy give, and what does double buffering give, where two pointers are swapped instead (two loads, two stores)?</p>
      ${chart("copy", "")}
        <figcaption>Operations for moving u_new into u, on a log axis. Hover or focus a bar for the breakdown.</figcaption>
      </figure>
      ${ans([["S = 128", "copy: 32,768 / 256"], ["S = 1", "pointer swap: 4 operations, serial or parallel"]])}
      <div class="ex"><div class="kicker">Worked answer</div>
        <p>The copy moves 16,384 elements with 2 operations each: 32,768 operations serially. 128 threads take 128 elements each, 256 operations: S = 32,768 / 256 = <b>128</b>, perfect, because there is nothing to synchronize.</p>
        <p>Double buffering does not copy at all. Swapping two pointers is 4 operations, and it cannot be split across threads, so parallelizing it gives <b>S = 1</b>. The speedup <i>from parallelization</i> is 1, but the swap is 8,192× faster than the serial copy and still 64× faster than the 128-thread copy. The lesson, in the chair's words on the sheet: changing the algorithm beats parallelizing a bad one. Real codes also save the memory bandwidth, which the “no hardware limit” assumption hides.</p></div>`)}

    ${task("C", 2, "Speedup of the mean temperature", `
      <p>A check that energy is conserved: sum all u[x][y] and divide by N². Same assumptions as in B, the division is free, and in the final phase one thread adds up the 128 local sums; then the same with a binary-tree reduction. Two decimals.</p>
      ${chart("mean", leg([[1, "local sum of 128 values per thread"], [2, "final reduction"]]))}
        <figcaption>Time steps of the two parallel versions of the sum of 16,384 values on 128 threads. The serial version needs 16,384 additions. Hover or focus a bar.</figcaption>
      </figure>
      ${ans([["S = 64.00", "one thread reduces: 16,384 / (128 + 128)"], ["S = 121.36", "binary tree: 16,384 / (128 + 7)"]])}
      <div class="ex"><div class="kicker">Worked answer</div>
        <p>Serially the sum loop does 16,384 additions. Each of the 128 threads adds its 128 values in 128 steps (the loop form, starting from 0). If one thread then adds the 128 local sums one after the other, that is another 128 steps: T = 256 and S = 16,384 / 256 = <b>64.00</b>, half of the 128 you paid for, because the whole machine waits while one thread reduces.</p>
        <p>A binary tree reduces 128 partial sums in log₂ 128 = 7 rounds: T = 135, S = 16,384 / 135 = <b>121.36</b>, E = 94.8 %. The 7 is task 1.2 again, and this is exactly what <code>reduction(+:sum)</code> in OpenMP or <code>MPI_Reduce</code> do for you in the later lectures.</p>
        <p class="muted">Alternative counts: without the 0 + … additions, 16,383 / (127 + 127) = 64.50 and 16,383 / (127 + 7) = 122.26; with the reducing thread starting from its own sum, 16,384 / 255 = 64.25. Try the loop-form answers first.</p></div>`)}

// ---------------- Exercise 03: scheduling and batch systems ----------------
// Six jobs on two processors, submitted at t = 0; the sheet's rule for simultaneous starts is "lowest job ID on the
// lowest processor ID". Schedules come from HPCViz.listSchedule (FIFO = by ID, SJN = by runtime) or are written out.
const { listSchedule, ganttHTML } = HPCViz;
const why = (t, body) => `<div class="why"><div class="kicker">${t}</div>${body}</div>`;
const ex = (t, body) => `<div class="ex"><div class="kicker">${t}</div>${body}</div>`;
const E3 = [[1, 5], [2, 7], [3, 8], [4, 6], [5, 1], [6, 3]];
const E3DEP = { 3: [1, 2], 4: [3], 6: [5, 1] };
const e3jobs = deps => E3.map(([id, t]) => ({ id, t, sub: 0, pre: deps ? (E3DEP[id] || []) : [] }));
// A schedule written out by hand: plan = { id: [cpu, start] }.
function fixed(jobs, plan) {
  const st = {}, fin = {}, cpuOf = {};
  jobs.forEach(j => { const [c, s] = plan[j.id]; st[j.id] = s; fin[j.id] = s + j.t; cpuOf[j.id] = c; });
  const ms = Math.max(...Object.values(fin)), turn = jobs.map(j => fin[j.id] - j.sub);
  return { st, fin, cpuOf, ms, turn, avg: turn.reduce((a, b) => a + b, 0) / jobs.length };
}
const SCHED = {
  fifo: { name: "FIFO", jobs: e3jobs(false), r: listSchedule(e3jobs(false), 2, "fifo") },
  sjn: { name: "SJN", jobs: e3jobs(false), r: listSchedule(e3jobs(false), 2, "sjn") },
  opt: { name: "optimal", jobs: e3jobs(false), r: fixed(e3jobs(false), { 5: [0, 0], 4: [0, 1], 3: [0, 7], 6: [1, 0], 1: [1, 3], 2: [1, 8] }) },
  dfifo: { name: "FIFO with dependencies", jobs: e3jobs(true), r: listSchedule(e3jobs(true), 2, "fifo") },
  dsjn: { name: "SJN with dependencies", jobs: e3jobs(true), r: listSchedule(e3jobs(true), 2, "sjn") },
  dopt: { name: "optimal with dependencies", jobs: e3jobs(true), r: fixed(e3jobs(true), { 2: [0, 0], 3: [0, 7], 4: [0, 15], 5: [1, 0], 1: [1, 1], 6: [1, 6] }) },
};
// The sheet's answer format: one row per processor, the job number per time slot, "-" where the processor idles.
function fillHTML(s, T) {
  const rows = [0, 1].map(c => { const cells = Array.from({ length: T }, (_, t) => { const j = s.jobs.find(j => s.r.cpuOf[j.id] === c && s.r.st[j.id] <= t && t < s.r.fin[j.id]); return j ? String(j.id) : "-"; });
    return `<b>P${c}</b>  ${cells.map(x => x.padStart(2)).join(" ")}`; }).join("\n");
  return `<div class="fill"><b>t </b>  ${Array.from({ length: T }, (_, t) => String(t + 1).padStart(2)).join(" ")}\n${rows}</div>`;
}
const turnList = s => s.jobs.map(j => `j${j.id} = ${s.r.fin[j.id]}`).join(", ");
const sumTurn = s => s.r.turn.reduce((a, b) => a + b, 0);
const schedBlock = (k, T) => `${ganttHTML(SCHED[k].jobs, 2, SCHED[k].r)}${fillHTML(SCHED[k], T)}`;

// Average turnaround and makespan of the six schedules, side by side.
CHARTS.cmp = narrow => {
  const rows = Object.values(SCHED), W = narrow ? 340 : 600, L = narrow ? 104 : 190, R = 36, T = 8, RH = 44, H = T + rows.length * RH + 26, PW = W - L - R, x = v => L + v / 24 * PW;
  const ticks = [0, 4, 8, 12, 16, 20, 24].map(v => `<line class="${v ? "grid" : "axis"}" x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - 22}"/><text class="tick" x="${x(v)}" y="${H - 6}" text-anchor="middle">${v}</text>`).join("");
  const bars = rows.map((s, i) => { const y0 = T + i * RH + 4, bh = 14;
    const tip = `<b>${s.name}</b><span class="ov">t</span> = ${sumTurn(s)} / 6 = ${num(s.r.avg, 2)}<br>makespan ${s.r.ms}`;
    return `<g class="pt" tabindex="0" data-tip="${esc(tip)}"><rect class="hit" x="0" y="${y0 - 4}" width="${W}" height="${RH}"/>
      <path class="bar s1" d="${hbar(x(0), x(s.r.avg), y0, bh)}"/><text class="val" x="${x(s.r.avg) + 5}" y="${y0 + 11}">${num(s.r.avg, 1)}</text>
      <path class="bar s2" d="${hbar(x(0), x(s.r.ms), y0 + bh + 2, bh)}"/><text class="val" x="${x(s.r.ms) + 5}" y="${y0 + bh + 13}">${s.r.ms}</text>
      <text class="cat" x="${L - 8}" y="${y0 + bh + 4}" text-anchor="end">${narrow ? s.name.replace(" with dependencies", " + deps") : s.name}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Paired bar chart of the six schedules. Average turnaround and makespan: FIFO 11.3 and 16, SJN 8.2 and 17, optimal 8.2 and 15; with dependencies FIFO 10.5 and 21, SJN 10.0 and 22, optimal 9.8 and 21.">${ticks}${bars}</svg>`;
};
// The dependency set as an activity-on-node and an activity-on-arrow network.
CHARTS.net = narrow => {
  const W = narrow ? 340 : 600, colW = narrow ? 70 : 110, rowH = narrow ? 40 : 46, L = 30, T = 24;
  // activity on node
  const pos = { 1: [0, 0], 2: [0, 2], 5: [0, 3], 3: [1, 1], 6: [1, 3], 4: [2, 1] };
  const px = c => L + 14 + c * colW, py = r => T + 14 + r * (rowH - 6);
  const edges = Object.entries(E3DEP).flatMap(([q, ps]) => ps.map(p => `<line class="ed" x1="${px(pos[p][0])}" y1="${py(pos[p][1])}" x2="${px(pos[q][0])}" y2="${py(pos[q][1])}" marker-end="url(#arrn)"/>`)).join("");
  const nodes = E3.map(([id, t]) => `<g class="pt" tabindex="0" data-tip="${esc(`<b>j${id}: ${t} units</b>${E3DEP[id] ? "after " + E3DEP[id].map(p => "j" + p).join(" and ") : "no predecessor"}`)}"><circle class="nd" cx="${px(pos[id][0])}" cy="${py(pos[id][1])}" r="7"/><text class="vl2" x="${px(pos[id][0]) + 10}" y="${py(pos[id][1]) - 8}">j${id}/${t}</text></g>`).join("");
  // activity on arrow: nodes are events, jobs are arrows, dashed arrows are dummies that only carry a precedence
  const oy = T + 4 * (rowH - 6) + 16, ax = c => L + 14 + c * colW, ay = r => oy + T + 10 + r * rowH;
  const N = { S: [0, 1], A: [1, 1], B: [2, 1], C: [3, 1], D: [4, 1], E: [2, 2], F: [3, 2] };
  const NL = { S: "start", A: "j1 done", B: "j1 and j2 done", C: "j3 done", D: "j4 done", E: "j1 and j5 done", F: "j6 done" };
  const above = { A: true };
  const seg = (a, b, cls, lbl, dy) => { const [x1, y1] = [ax(N[a][0]), ay(N[a][1])], [x2, y2] = [ax(N[b][0]), ay(N[b][1])];
    return `<line class="ed ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#arrn)"/>${lbl ? `<text class="vl2" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 + dy}" text-anchor="middle">${lbl}</text>` : ""}`; };
  const curve = `<path class="ed" d="M${ax(0)},${ay(1)} Q${ax(1)},${ay(1) - rowH * 1.4} ${ax(2)},${ay(1)}" marker-end="url(#arrn)"/><text class="vl2" x="${ax(1)}" y="${ay(1) - rowH * 0.7 - 4}" text-anchor="middle">j2</text>`;
  const aoa = [seg("S", "A", "", "j1", -6), curve, seg("A", "B", "dummy", "", 0), seg("B", "C", "", "j3", -6), seg("C", "D", "", "j4", -6), seg("S", "E", "", "j5", 16), seg("A", "E", "dummy", "", 0), seg("E", "F", "", "j6", -6)].join("")
    + Object.entries(N).map(([k, [c, r]]) => `<g class="pt" tabindex="0" data-tip="${esc(`<b>${NL[k]}</b>synchronisation point`)}"><circle class="nd sync" cx="${ax(c)}" cy="${ay(r)}" r="6"/>${narrow ? "" : `<text class="tick" x="${ax(c)}" y="${ay(r) + (above[k] ? -12 : 19)}" text-anchor="middle">${NL[k]}</text>`}</g>`).join("");
  const H = ay(2) + 30;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Top, activity on node: j1 and j2 point to j3, j3 to j4, j5 and j1 to j6. Below, activity on arrow: seven event nodes with the jobs as arrows and two dashed dummy arrows that carry j1's precedence to the events where j3 and j6 start.">
    <defs><marker id="arrn" viewBox="0 0 10 10" refX="15" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arr"/></marker></defs>
    <text class="cat" x="${L}" y="${T - 8}">${narrow ? "Activity on node" : "Activity on node (node = job, arrow = precedence)"}</text>${edges}${nodes}
    <text class="cat" x="${L}" y="${oy + T - 10}">${narrow ? "Activity on arrow (dashed = dummy)" : "Activity on arrow (node = event, arrow = job, dashed = dummy)"}</text>${aoa}</svg>`;
};

// SJN with and without aging on the sheet's seven jobs (submission times, preconditions, two CPUs).
const AG7 = [[1, null, 0, 7], [2, null, 1, 2], [3, null, 1, 1], [4, null, 2, 4], [5, 3, 2, 5], [6, 1, 3, 3], [7, 3, 3, 2]].map(([id, pre, sub, t]) => ({ id, t, sub, pre: pre ? [pre] : [] }));
const AGS = { aging: false };
function agOut7() {
  const r = listSchedule(AG7, 2, AGS.aging ? "aging" : "sjn"), g = ganttHTML(AG7, 2, r, "CPU", "J");
  const log = r.log.map(l => `<tr><td>${l.t}</td><td class="pick">J${l.pick}</td><td>${l.others.length ? l.others.map(o => `J${o.id} (${o.prio}${AGS.aging ? " → " + (o.prio + 1) : ""})`).join(", ") : "—"}</td></tr>`).join("");
  return `${g}<div class="tt-wrap"><table class="tt log"><tr><th>t</th><th>starts</th><th>runnable but passed over${AGS.aging ? " (priority before → after)" : " (priority)"}</th></tr>${log}</table></div>
    <dl class="ro"><dt>Makespan</dt><dd><b>${r.ms}</b></dd>
      <dt>Turnaround</dt><dd>${AG7.map(j => `J${j.id} = ${r.fin[j.id]} − ${j.sub} = ${r.fin[j.id] - j.sub}`).join(", ")} → ${r.turn.reduce((a, b) => a + b, 0)} / 7 = <b>${num(r.avg, 1)}</b></dd></dl>`;
}
function initAging(body) {
  body.innerHTML = `<div class="ctl"><label><input type="checkbox"${AGS.aging ? " checked" : ""}> aging: every runnable job that is passed over gains one priority point</label></div><div class="out"></div>`;
  const cb = body.querySelector("input"), out = body.querySelector(".out"), draw = () => { out.innerHTML = agOut7(); };
  cb.addEventListener("change", () => { AGS.aging = cb.checked; draw(); });
  draw();
}

function exercise3() {
  const s = SCHED;
  return `${head(e)}
    <p class="lead">The first exercise on <a href="high-performance-computing/lecture.html?n=2">lecture 2</a>: the same six jobs scheduled six ways by hand (FIFO, shortest job next and the optimum, each with and without dependencies), both precedence-network notations, a Slurm dependency chain, SJN with aging on seven jobs that arrive over time, and three batch scripts to run on ZIH's Romeo cluster. Fourteen parts with 42.9 points in total, plus a 2-point optional "another tip?" item; this page works every task in our own words and gives the Gantt rows in the sheet's fill-in format. Discussed on <b>${fmt(e.date)}, ${exe.start}</b>.</p>

      <p><b>Definitions the sheet gives up front.</b> <i>Utilisation</i> is the fraction of time a device is busy; <i>throughput</i> the completions per unit time; <i>service time</i> what a request needs on the device; <i>queueing time</i> what it waits; <i>residence time</i> = service + queueing; <i>response time</i> is used like residence time in this lecture; <i>makespan</i> is the time from submission until the last job is done. The jobs: j1/5, j2/7, j3/8, j4/6, j5/1, j6/3 on two processors, all submitted at t = 0, so turnaround = finishing time. Tie rule: when several jobs start at once, the lower job number takes the lower processor number.</p>

      ${schedBlock("dopt", 30)}
      ${ans([["t = 21", "the critical path j2 → j3 → j4"], ["<span class='ov'>t</span> = 9.8", "(6 + 7 + 15 + 21 + 1 + 9) / 6 = 59 / 6"]])}
      ${ex("Worked answer", `<p>The makespan cannot beat the critical path, 21, and the chain j2 → j3 → j4 has no slack at all: j2 must start at 0 and the three run back to back on one processor, finishing at 7, 15 and 21 (sum 43). The other processor gets j1, j5 and j6, where j6 needs both. Two orders respect that: j1, j5, j6 finishes at 5, 6, 9 (sum 20); j5, j1, j6 finishes at 1, 6, 9 (sum 16). The second wins: total 59, average <b>9.8</b>, makespan <b>21</b>. By the tie rule j2 (starting with j5 at t = 0) takes P0, so P0: j2, j3, j4 and P1: j5, j1, j6. Every other schedule with makespan 21 has a turnaround sum of 60 or more (checked by enumeration).</p>`)}`)}

    ${task("9", 1, "Slurm job submission", `
      <p>A shell script submits four batch jobs: initialize, foo, bar, finalize. Extend it so that foo runs if initialize succeeds, bar if it fails, and finalize after whichever of the two ran. The sheet reminds you that backticks capture a command's output and that <code>sbatch</code> prints "Submitted batch job &lt;id&gt;".</p>
      <div class="formula">#!/bin/sh<br>init=\`sbatch --parsable ./job_initialize\`<br>foo=\`sbatch --parsable --dependency=afterok:$init ./job_foo\`<br>bar=\`sbatch --parsable --dependency=afternotok:$init ./job_bar\`<br>sbatch --dependency=afterany:$foo?afterany:$bar ./job_finalize</div>
      ${ex("Worked answer", `<p><code>--parsable</code> makes sbatch print only the job ID, so the variable holds a number; without it, <code>\`sbatch ./job_initialize | awk '{print $4}'\`</code> cuts the fourth word out of "Submitted batch job 6072294". <code>afterok</code> waits for a zero exit code, <code>afternotok</code> for a non-zero one (lecture 2, slide 70). Exactly one of foo and bar will ever run; the other's dependency can never be satisfied and Slurm leaves it pending with that reason or cancels it, depending on the site's configuration. That is why finalize must not wait for <i>both</i>: the question mark between two dependency expressions means "any of these" (an OR), so finalize starts as soon as the one that ran has finished, whatever its exit code (<code>afterany</code>). A colon list, <code>afterany:$foo:$bar</code>, would be an AND and could wait forever.</p>`)}`)}

    ${task("10", 4, "SJN with aging", `
      <p>Seven sequential jobs arrive at a two-CPU scheduler at different times, some with a precondition: J1 at 0 (7 s), J2 at 1 (2 s), J3 at 1 (1 s), J4 at 2 (4 s), J5 at 2 (5 s, after J3), J6 at 3 (3 s, after J1), J7 at 3 (2 s, after J3). Priority is the negative estimated runtime; whenever a CPU is free the runnable job with the highest priority starts, ties to the earlier submission; with aging, every runnable job that is passed over gains one point. Events at the same time happen in the order: jobs join the queue, jobs finish, free CPUs are filled. Makespan and average turnaround with SJN, then with SJN and aging (one decimal; turnaround counts from each job's own submission time).</p>
      ${lab("aging", "the seven jobs with and without aging")}
      ${ans([["15", "makespan with SJN"], ["<span class='ov'>t</span> = 6.0", "SJN: 42 / 7"], ["13", "makespan with aging"], ["<span class='ov'>t</span> = 6.0", "aging: also 42 / 7"]])}
      ${ex("Worked answer, SJN", `<p>t = 0: only J1 is there → CPU0 (0–7). t = 1: J2 (−2) and J3 (−1) arrive; CPU1 takes J3 (1–2). t = 2: J4 (−4) and J5 (−5) arrive, J3 finishes so J5 is runnable; CPU1 picks the best of J2 (−2), J4, J5 → J2 (2–4). t = 3: J6 (needs J1, not runnable) and J7 (−2, J3 is done) arrive; no CPU is free. t = 4: J2 ends; J7 (−2) beats J4 (−4) and J5 (−5) → J7 (4–6). t = 6: J4 (6–10). t = 7: J1 ends, J6 becomes runnable (−3) and beats J5 (−5) → J6 on CPU0 (7–10). t = 10: J5 at last (10–15). Makespan <b>15</b>. Turnarounds: J1 7, J2 3, J3 1, J4 8, J5 13, J6 7, J7 3 → 42 / 7 = <b>6.0</b>.</p>`)}
      ${ex("Worked answer, SJN with aging", `<p>Same start. t = 1: J3 picked, J2 passed over → −1. t = 2: J2 (−1) picked; J4 → −3, J5 → −4. t = 4: J7 picked; J4 → −2, J5 → −3. t = 6: J4 (−2) picked; J5 → −2. t = 7: CPU0 is free, J5 (−2) now beats the fresh J6 (−3) → J5 (7–12); J6 → −2. t = 10: J4 ends, J6 (10–13). Makespan <b>13</b>. Turnarounds: J1 7, J2 3, J3 1, J4 8, J5 10, J6 10, J7 3 → again 42 / 7 = <b>6.0</b>: J5 gains three units, J6 loses three, and the machine finishes two units earlier because the long J5 no longer runs alone at the end.</p>`)}
      ${why("Context, not on the sheet: which aging convention the auto-check assumes", `<p>The explorer raises priorities once per <i>selection</i>, which is the lecture's algorithm on slide 23 (pick, remove, raise the rest). Raising them once per scheduling <i>time</i> instead gives the same schedule here, since no decision point ever selects two jobs at once while a third waits. If the checker disagrees with 13 / 6.0, the other reading to try is counting turnaround from t = 0 rather than from submission: that would give 54 / 7 = 7.7, with and without aging.</p>`)}`)}

// Task 1: multiply (7 stages) then add (5 stages) on a 32-entry vector register, pipelined SIMD, IF/ID/WB one cycle each.

const codeBlock = s => `<div class="formula">${esc(s).replace(/\n/g, "<br>").replace(/ {2}/g, "&nbsp;&nbsp;")}</div>`;

// Task 2: 32 elements as 8 instructions on 4-wide registers (concurrent), multiply 7 stages, add 4 stages.
function t2Gantt() {
  const n = 8, total = 22, rows = [];
  for (let i = 1; i <= n; i++) {
    const r = Array(total).fill(""), put = (t, s, txt, tip) => { r[t - 1] = `<span class="pc s${s}" title="${tip}">${txt}</span>`; };
    put(i, 4, "IF", `fetch multiply ${i}`); put(i + 1, 4, "ID", `decode multiply ${i}`);
    for (let k = 1; k <= 7; k++) put(i + 1 + k, 1, "×" + k, `elements ${4 * i - 3}–${4 * i}: multiply stage ${k}`);
    put(i + 9, 4, "WB", `products ${4 * i - 3}–${4 * i} written back`);
    for (let k = 1; k <= 4; k++) put(i + 9 + k, 2, "+" + k, `elements ${4 * i - 3}–${4 * i}: add stage ${k}`);
    put(i + 14, 4, "WB", `sums ${4 * i - 3}–${4 * i} written back`);
    rows.push(`<div class="rl">${4 * i - 3}–${4 * i}</div>${r.map(x => `<div class="gc">${x}</div>`).join("")}`);
  }
  return `<div class="gantt" style="--cols:${total}"><div class="rl"></div>${Array.from({ length: total }, (_, t) => `<div class="gh">${t + 1}</div>`).join("")}${rows.join("")}</div>
    ${leg([[1, "multiply stages ×1–×7"], [2, "add stages +1–+4"], [4, "fetch, decode, write-back"]])}`;
}

// Tasks 6–7: the Romeo node (2 × AMD EPYC 7702) as lstopo shows it. Core L#k holds PU L#2k and L#2k+1.
const ROMEO_OPTS = [
  { pus: [0, 1, 2, 3, 4, 5, 6, 7], t: "PU 0, 1, 2, …, 7", fit: "threads that use the core poorly and communicate a lot", why: "two hardware threads per core on 4 cores of one L3: they share L1 and L2, so communication is cheapest, and SMT fills the units that each thread leaves idle." },
  { pus: [0, 2, 4, 6, 8, 10, 12, 14], t: "PU 0, 2, 4, …, 14", fit: "threads that use their cores efficiently and communicate", why: "8 full cores, but packed into 2 neighbouring L3 blocks of one NUMA domain: no core is shared, and communication stays inside one CCX or crosses only to the next one." },
  { pus: [0, 8, 16, 24, 32, 40, 48, 56], t: "PU 0, 8, 16, …, 56", fit: "threads that profit from more cache and communicate somewhat", why: "one core in each of 8 L3 blocks: every thread has a whole 16 MB L3 to itself (128 MB in total), and all 8 sit in 2 NUMA domains of the same package." },
  { pus: [0, 32, 64, 96, 128, 160, 192, 224], t: "PU 0, 32, 64, …, 224", fit: "threads that need memory bandwidth and hardly communicate", why: "one core in each of the 8 NUMA domains, both packages: 8 memory controllers' bandwidth, but any communication crosses NUMA domains or even sockets." },
];
const RM = { k: 1 };
function romeoOut() {
  const narrow = isNarrow(), opt = ROMEO_OPTS[RM.k], on = new Set(opt.pus);
  const cs = narrow ? 16 : 14, cg = 2, l3w = 4 * cs + 3 * cg + 8, l3h = cs + 22, nw = 2 * l3w + 3 * 6, nh = 2 * l3h + 3 * 6 + 14, pw = 2 * nw + 3 * 8, ph = 2 * nh + 3 * 8 + 16;
  const W = narrow ? pw : 2 * pw + 12, H = narrow ? 2 * ph + 12 : ph;
  let s = "";
  for (let pk = 0; pk < 2; pk++) {
    const px = narrow ? 0 : pk * (pw + 12), py = narrow ? pk * (ph + 12) : 0;
    s += `<rect class="pkg" x="${px}" y="${py}" width="${pw}" height="${ph}" rx="6"/><text class="note" x="${px + 8}" y="${py + 13}">Package ${pk}</text>`;
    for (let nd = 0; nd < 4; nd++) {
      const numa = pk * 4 + nd, nx = px + 8 + (nd % 2) * (nw + 8), ny = py + 20 + Math.floor(nd / 2) * (nh + 8), used = [...on].some(p => Math.floor(p / 32) === numa);
      s += `<rect class="numa${used ? " on" : ""}" x="${nx}" y="${ny}" width="${nw}" height="${nh}" rx="4"/><text class="note" x="${nx + 5}" y="${ny + 11}">NUMA ${numa} · ${numa ? 63 : 62} GB</text>`;
      for (let l = 0; l < 4; l++) {
        const l3 = numa * 4 + l, lx = nx + 6 + (l % 2) * (l3w + 6), ly = ny + 16 + Math.floor(l / 2) * (l3h + 6);
        s += `<rect class="l3box" x="${lx}" y="${ly}" width="${l3w}" height="${l3h}" rx="3"/><text class="tick" x="${lx + 4}" y="${ly + 11}">L3 16 MB</text>`;
        for (let cI = 0; cI < 4; cI++) {
          const core = l3 * 4 + cI, cx = lx + 4 + cI * (cs + cg), cy = ly + 15, a = on.has(2 * core), b = on.has(2 * core + 1);
          s += `<rect class="pu${a ? " on" : ""}" x="${cx}" y="${cy}" width="${cs / 2 - 0.5}" height="${cs - 2}" rx="1.5"><title>core ${core}: PU L#${2 * core} (P#${core})</title></rect><rect class="pu${b ? " on" : ""}" x="${cx + cs / 2 + 0.5}" y="${cy}" width="${cs / 2 - 0.5}" height="${cs - 2}" rx="1.5"><title>core ${core}: PU L#${2 * core + 1} (P#${core + 128})</title></rect>`;
        }
      }
    }
  }
  const cores = new Set(opt.pus.map(p => p >> 1)), l3s = new Set(opt.pus.map(p => p >> 3)), numas = new Set(opt.pus.map(p => p >> 5)), pkgs = new Set(opt.pus.map(p => p >> 7));
  return `<div class="viz lab-viz romeo"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of one Romeo node: 2 packages, each with 4 NUMA domains of 4 L3 blocks with 4 cores of 2 hardware threads. Highlighted: ${opt.t}, on ${cores.size} cores, ${l3s.size} L3 blocks, ${numas.size} NUMA domains and ${pkgs.size} package${pkgs.size > 1 ? "s" : ""}.">${s}</svg></div>
    ${leg([[1, "hardware thread (PU) used by one of the 8 threads"], ["g", "NUMA domain in use"]])}
    <dl class="ro">
      <dt>Spread</dt><dd>${cores.size} cores · ${l3s.size} L3 block${l3s.size > 1 ? "s" : ""} (${16 * l3s.size} MB of L3) · ${numas.size} NUMA domain${numas.size > 1 ? "s" : ""} · ${pkgs.size} package${pkgs.size > 1 ? "s" : ""}</dd>
      <dt>Fits</dt><dd><b>${opt.fit}</b>: ${opt.why}</dd>
    </dl>`;
}
function initRomeo(body) {
  body.innerHTML = `<div class="presets">${ROMEO_OPTS.map((o, k) => `<button class="preset" data-k="${k}">${o.t}</button>`).join("")}</div><div class="out"></div>`;
  const out = body.querySelector(".out"), draw = () => { out.innerHTML = romeoOut(); body.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.k === RM.k)); };
  body.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; RM.k = +b.dataset.k; draw(); });
  addEventListener("resize", draw);
  draw();
}

function exercise4() {
  const st = (ok, t, why) => `<tr><td>${ok ? flag("ok", "true") : flag("bad", "false")}</td><td>${t}</td><td>${why}</td></tr>`;
  return `${head(e)}
    <p class="lead">The exercise on <a href="high-performance-computing/lecture.html?n=3">lecture 3</a>: cycle counts for pipelined vector units with and without chaining, the peak performance of two current desktop processors, the <b>roofline model</b> applied to the heat stencil from Exercise 02, and the topology of one node of ZIH's Romeo cluster, read from an <code>lstopo</code> picture. Seven auto-checked tasks, 18 points. The sheet in OPAL is a printout of the online test, so everything below comes from it; the answers are our own.</p>
    <div class="tiles" aria-label="The results at a glance">
      <div class="tile"><div class="v">78 → 46</div><div class="l">cycles for a 32-element multiply-add without / with chaining</div></div>
      <div class="tile"><div class="v">2,560</div><div class="l">Gflop/s single-precision peak, Ryzen 9 9955HX</div></div>
      <div class="tile"><div class="v">7 / 16</div><div class="l">flop per byte of the heat stencil</div></div>
      <div class="tile"><div class="v">42 vs 612.5</div><div class="l">Gflop/s from DRAM vs from a large L3</div></div>
    </div>

    ${task("1", 5, "Arithmetic pipelining and chaining", `
      <p>A core has a 7-stage floating-point multiplier and a 5-stage adder, one pipe each, so vector instructions run as pipelined SIMD (one element enters per cycle), not concurrently. Vector registers hold 32 entries. Instructions are pipelined too: IF, ID, the execute stages, WB, one cycle each. How long does the execute phase of a 32-element multiply take, and the whole instruction? A dependent 32-element add follows: total cycles without and with chaining, and the speedup to one decimal.</p>
      ${chart("chain", leg([[1, "multiply executing"], [2, "add executing"], ["g", "fetch, decode, write-back"]]))}
        <figcaption>The two instruction pairs on one cycle axis. The dashed line is the add waiting: for the write-back of all 32 products without chaining, only for the first product with chaining. Hover a row.</figcaption>
      </figure>
      ${ans([["38", "execute cycles: 7 + 31"], ["41", "cycles for the whole multiply: 1 + 1 + 38 + 1"], ["78", "multiply-add without chaining"], ["46", "multiply-add with chaining"], ["1.7", "speedup 78 / 46 = 1.696"]])}
      ${ex("Worked answer", `<p><b>Execute phase.</b> The first element needs all 7 stages; each further element leaves the pipeline one cycle later: 7 + (32 − 1) = <b>38</b> cycles. The multiply is fetched in cycle 1, decoded in 2, executes in 3–40 and writes back in 41: <b>41</b> cycles.</p>
        <p><b>Without chaining.</b> The add is fetched in cycle 2 and decoded in 3, but it needs the products in the vector register, which are complete only after the write-back in cycle 41. It executes in 42 to 42 + 5 + 31 − 1 = 77 and writes back in <b>78</b>. This is lecture 3's formula 14 + 2n with n = 32.</p>
        <p><b>With chaining.</b> The first product leaves the multiplier at the end of cycle 9 and goes straight into the adder in cycle 10; the 32nd product enters it in cycle 41 and leaves stage 5 at the end of cycle 45; write-back in <b>46</b> = 14 + n. Speedup 78 / 46 = 1.696, rounded <b>1.7</b>.</p>`)}
      ${why("Context, not on the sheet: why the speedup stays below 2", `<p>Chaining hides the add behind the multiply, but both instructions still have their own fill time and the fixed IF/ID/WB overhead. For long vectors the cycle counts approach 2n versus n, so the speedup tends to 2 (two units busy at once instead of one after the other); with n = 32 the 14 fixed cycles still weigh in. Lecture 3's explorer draws the same pair element by element.</p>`)}`)}

    ${task("2", 2, "Calculation: concurrent SIMD on short registers", `
      <p>Now a 7-stage multiplier and a 4-stage adder, vector registers of 4 entries processed concurrently, execution units pipelined, and the same 4-stage instruction pipeline. How many cycles to multiply 32 elements? And to multiply-add them, if the add of a chunk may run alongside the multiplies (superscalar) but only after that chunk's product has been written back?</p>
      ${t2Gantt()}
      ${ans([["17", "cycles for 32 multiplies: 8 instructions, 10 + 7"], ["22", "cycles for 32 multiply-adds"]])}
      ${ex("Worked answer", `<p>32 elements in 4-entry registers are 8 multiply instructions. Each takes IF, ID, 7 execute stages and WB = 10 cycles; with instruction and execution pipelining a new one starts every cycle, so instruction i writes back in cycle i + 9 and the last one, i = 8, in cycle <b>17</b>.</p>
        <p>The add of chunk i can enter the adder in the cycle after that write-back, i + 10, runs 4 stages and writes back in i + 14. The last chunk finishes in 8 + 14 = <b>22</b>. Equivalently: the last product is written in 17, and one more 4-stage add plus write-back takes 5 more cycles. The add instructions' fetch and decode happen in parallel earlier on and are not drawn.</p>`)}`)}

    ${task("3", 1, "Peak performance: AMD Ryzen 9 9955HX", `
      <p>16 cores at 2.5 GHz; per cycle each core can do either 2 multiplies and 2 adds or 2 FMAs on 512-bit registers, fully pipelined. Single-precision peak, rounded to whole Gflop/s.</p>
      ${ans([["2,560 Gflop/s", "16 × 2.5 GHz × 64 flop per cycle"]])}
      ${ex("Worked answer", `<p>A 512-bit register holds 512 / 32 = 16 single-precision values. Both alternatives give the same count per cycle: 2 FMAs × 16 values × 2 flop = 64, or (2 + 2) instructions × 16 values × 1 flop = 64. Per core 64 × 2.5 · 10⁹ = 160 Gflop/s; for 16 cores <b>2,560 Gflop/s</b>. In double precision (8 values per register) it is half: 1,280 Gflop/s, which task 5 needs.</p>`)}`)}

    ${task("4", 2, "Peak performance: Intel Core Ultra 9 285K", `
      <p>8 P-cores at 3.7 GHz with 2 FMA-capable SIMD units of 256 bit each; then 16 E-cores at 3.2 GHz with 2 FMA units of 128 bit. Single-precision peak of each group, rounded.</p>
      ${chart("peak")}
        <figcaption>The three answers of tasks 3 and 4, plus the Ryzen's double-precision peak (gray) that task 5 builds on. Despite having 24 cores, the Intel chip's two groups together (1,766 Gflop/s) stay below the 16-core Ryzen, whose AVX-512 units are twice as wide.</figcaption>
      </figure>
      ${ans([["947 Gflop/s", "P-cores: 8 × 3.7 × 2 × 8 × 2 = 947.2"], ["819 Gflop/s", "E-cores: 16 × 3.2 × 2 × 4 × 2 = 819.2"]])}
      ${ex("Worked answer", `<p>P-core: 256 / 32 = 8 floats per register, 2 units, 2 flop per FMA: 32 flop per cycle; × 3.7 GHz = 118.4 Gflop/s per core; × 8 = 947.2, rounded <b>947</b>. E-core: 128 / 32 = 4 floats, 2 units, 2 flop: 16 flop per cycle; × 3.2 = 51.2 per core; × 16 = 819.2, rounded <b>819</b>. The formula is lecture 3's: values per register × instructions per cycle × flop per value × clock × cores.</p>`)}`)}

    ${task("5", 6, "The roofline model", `
      <p>The roofline bounds achievable performance by P = min(P<sub>peak</sub>, I × BW<sub>memory</sub>), where I is the arithmetic intensity in flop per byte moved from memory. Apply it to the double-buffered heat stencil of Exercise 02: flop per step on an N × N grid (the constant ALPHA·DT/(DX·DX) is computed once, before the loop), the minimum data moved per step when values are reused between neighbouring iterations, the intensity for large N, half the Ryzen's peak as the realistic compute roof (adds and multiplies are not balanced), and the expected performance for 2,500 × 2,500 grids (two of them, 100 MB) from DRAM at 96 GB/s, and from the 128 MB L3 of a Ryzen 9 9955HX3D at 1.4 TB/s.</p>
      ${codeBlock("u_new[i][j] = u[i][j] + C * (u[i+1][j] + u[i-1][j] + u[i][j+1] + u[i][j-1] - 4*u[i][j]);")}
      ${chart("roof", leg([[1, "DRAM roof, 96 GB/s"], [2, "L3 roof, 1.4 TB/s"], ["g", "double-precision peak"]]))}
        <figcaption>Both axes logarithmic. Each memory roof rises with slope 1 until it meets the compute roof of 640 Gflop/s at its ridge point (6.67 flop/B for DRAM, 0.46 for L3). The stencil's intensity of 0.4375 lies left of both ridges: memory-bound either way, but the large cache moves the bound up almost to the compute roof. Hover a dot.</figcaption>
      </figure>
      ${ans([["7 N²", "flop per step (7 per point; 7 (N − 2)² for the interior exactly)"], ["16 N²", "bytes per step: read u, write u_new, 8 B each"], ["0.4375", "flop/B = 7 / 16"], ["640 Gflop/s", "50 % of the 1,280 double-precision peak"], ["42 Gflop/s", "from DRAM: 0.4375 × 96"], ["612.5 Gflop/s", "from L3: 0.4375 × 1,400"]])}
      ${ex("Worked answer", `<p><b>Flop.</b> Per grid point: three additions for the four neighbours, one multiplication 4·u[i][j], one subtraction, one multiplication by the constant, one addition of u[i][j]: 5 add/sub + 2 mul = <b>7</b>. Per step 7 N² (strictly 7 (N − 2)² interior points; for large N the same).</p>
        <p><b>Bytes.</b> If every value of u that is read is reused from cache by the neighbouring iterations (u[i][j] becomes u[i][j−1] in the next j, the rows i ± 1 stay in cache), each element of u is loaded from memory once and each element of u_new stored once: 8 + 8 = <b>16 N²</b> bytes. Intensity 7 / 16 = <b>0.4375</b> flop/B.</p>
        <p><b>Compute roof.</b> Double precision, since the data are doubles: peak 1,280 Gflop/s; the code has 5 additions per 2 multiplications, so the add units are the bottleneck and about half the peak is usable: <b>640 Gflop/s</b>. <b>DRAM:</b> 100 MB do not fit the 9955HX's L3, so P = min(640, 0.4375 × 96) = <b>42 Gflop/s</b>, 6.6 % of the compute roof. <b>L3:</b> the 9955HX3D holds both grids in its 128 MB L3, so P = min(640, 0.4375 × 1,400) = <b>612.5 Gflop/s</b>, 14.6 times more, still just below the ridge.</p>`)}
      ${why("Context, not on the sheet: which numbers the checker might want instead", `<p>Two conventions could differ. If the 50 % is taken of the single-precision peak (2,560 → 1,280), the compute roof doubles, but neither result changes, since both cases are memory-bound. If a write to u_new first loads its cache line (write-allocate, the default on x86 without streaming stores), the traffic is 24 N² bytes, I = 0.29 and the bounds become 28 and 408 Gflop/s; the sheet's “at least” points to 16. For the flop count, try 7N² first; if a numeric field wants a number, the grid size from the next part is meant.</p>`)}`)}

    <h2>A Romeo node, as <code>lstopo</code> draws it</h2>
    <p>The last two tasks show the output of <code>lstopo --merge --no-io --of svg</code> (from the hwloc module) for one Romeo compute node. Reading it from the outside in: Machine 503 GB in total; two <b>packages</b> (sockets; AMD EPYC 7702 processors according to ZIH's public documentation); each package has 4 <b>NUMA nodes</b> of 62 or 63 GB; each NUMA node has 4 <b>L3 caches of 16 MB</b>; each L3 is shared by 4 <b>cores</b>; each core has 2 <b>PUs</b> (hardware threads). The logical numbers count through the tree: core L#k holds PU L#2k and L#2k+1, whose physical (OS) numbers are P#k and P#k+128. So the node has 2 × 4 × 4 × 4 = 128 cores and 256 hardware threads.</p>
    ${lab("romeo", "where do 8 threads land? (the four options of task 7)")}

    ${task("6", 1, "Understanding the picture", `
      <p>Mark the correct parts of a description of the node.</p>
      <div class="tt-wrap"><table class="tt syn" aria-label="Statements about the node">
        <tr><th></th><th>Statement</th><th>Why</th></tr>
        ${st(true, "one of Romeo's compute nodes", "the picture's caption says so")}
        ${st(true, "a total of 503 GB of accessible memory", "“Machine (503GB total)”")}
        ${st(true, "two processors (packages)", "Package L#0 and L#1")}
        ${st(false, "each with eight NUMA domains", "four per package, eight in the whole node")}
        ${st(false, "eight cores share one L3 cache", "four cores per L3")}
        ${st(false, "of 8 MB size", "16 MB per L3")}
        ${st(false, "two core blocks (L3 groups) per NUMA domain", "four L3 groups per NUMA domain, 16 cores")}
        ${st(true, "each domain has 62 or 63 GB of memory attached", "NUMANode L#0 62 GB, the others 63 GB")}
        ${st(false, "Hyper-Threading (hardware multithreading) is not activated", "every core shows two PUs, so SMT is on")}
        ${st(false, "256 cores in total", "128 cores; 256 is the number of hardware threads")}
      </table></div>
      ${why("Context, not on the sheet: the trap in the last line", `<p>Linux tools such as <code>nproc</code> or <code>htop</code> count PUs, not cores, so they report 256 “CPUs” here. Slurm on Romeo also schedules by hardware thread unless told otherwise; lecture 3's vocabulary slide (a hardware thread, not a core, is the processing element) is exactly about this.</p>`)}`)}

    ${task("7", 1, "Scheduling decision", `
      <p>A thread-parallel program with 8 threads: match four placements (lists of logical PU numbers) to four kinds of program behaviour.</p>
      <div class="tt-wrap"><table class="tt syn" aria-label="Placement answers">
        <tr><th>Program</th><th>PUs</th><th>Placement</th></tr>
        ${ROMEO_OPTS.map(o => `<tr><td>${o.fit}</td><td><b>${o.t.replace("PU ", "")}</b></td><td>${o.why}</td></tr>`).join("")}
      </table></div>
      ${ex("How to derive it", `<p>Divide the PU number by 2 for the core, by 8 for the L3 block, by 32 for the NUMA domain, by 128 for the package. 0–7 → cores 0–3, two threads each. 0, 2, …, 14 → cores 0–7 in L3 blocks 0 and 1. 0, 8, …, 56 → cores 0, 4, …, 28, one per L3 block 0–7 (NUMA 0 and 1). 0, 32, …, 224 → one core in each NUMA domain 0–7. Then match: the tighter the placement, the cheaper the communication; the wider, the more cache and memory bandwidth per thread. SMT siblings only pay off when a thread leaves the core's units idle.</p>`)}`)}

    <h2>Before and after the session</h2>
    <ul>
      <li><b>Enter the answers in the OPAL test</b> (it accepts the numbers above; the speedup with one decimal, peaks as whole Gflop/s).</li>
      <li><b>Reread</b> the SIMD and peak-performance sections of <a href="high-performance-computing/lecture.html?n=3">lecture 3</a>; its D = C + A·B explorer is task 1 at n ≤ 8.</li>
      <li><b>On Romeo</b>, <code>module load hwloc</code> and <code>lstopo --merge --no-io</code> inside a job show the same tree; <code>OMP_PLACES</code> and <code>OMP_PROC_BIND</code> (lecture 4) pin OpenMP threads to exactly such PU lists.</li>
      <li><b>Context, not on the sheet.</b> Peak-performance arithmetic and a roofline bound from flop and byte counts are standard written-exam material for a course like this; both fit on one line once the per-cycle flop count is right.</li>
    </ul>
    <p class="muted">Next: Exercise 05 on <a href="high-performance-computing/lecture.html?n=4">lecture 4</a> (threads, OpenMP, loop scheduling), <a href="high-performance-computing/exercise.html?n=5">25 Nov</a>. Sheet and test: OPAL → Exercises / Übungen and Exercise Sheets and Tutorials; they may not be republished, so the tasks above are restated in our own words.</p>`;
}
