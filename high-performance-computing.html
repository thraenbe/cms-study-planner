<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High-Performance Computing · CMS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖧</text></svg>">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="high-performance-computing/hpc.css">
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="high-performance-computing/hpc.js"></script>
</head>
<body class="hpc">
<header class="sitebar" data-page="course"></header>
<div class="wrap" id="page"></div>
<script>
// Main page: header, status bar (OPAL course, exercise group, Selma), then one card per lecture plus the Orga card, and one card per exercise (SML-games grid).
const { m, c, esc, U, CODE, fmt, TYPES, exe } = HPC;
const when = l => l.date ? `${fmt(l.date)} · ${TYPES[l.type]}` : "Self-study before the first lecture";
const nn = n => String(n).padStart(2, "0");
const lectures = c.lectures.map(l => `<a class="game-card lec" href="high-performance-computing/lecture.html?n=${l.n}">
    <div class="game-icon">${l.icon}</div>
    <h2>${l.n ? `Lecture ${l.n} – ` : ""}${esc(l.title)}</h2>
    <p class="when">${when(l)}</p>
    <p>${esc(l.blurb)}</p>
  </a>`).join("") + `<a class="game-card" href="high-performance-computing/orga.html">
    <div class="game-icon">🗂️</div>
    <h2>Orga</h2>
    <p>Next session, your exercise group, exam and Selma, the full schedule with rooms, how the online exercises work, and contacts.</p>
  </a>`;
// Exercise cards: one per session of your Wednesday group; OPAL numbers the online exercises by course week.
const exercises = c.exercises.map(x => `<a class="game-card exe ${x.covered ? "" : "soon"}" href="high-performance-computing/exercise.html?n=${x.n}">
    <div class="game-icon">${x.icon}</div>
    <h2>Exercise ${nn(x.n)}${x.title ? ` – ${esc(x.title)}` : ""}</h2>
    <p class="when">${fmt(x.date)} · ${exe.start} · ${TYPES.exercise}${x.published ? ` · in OPAL since ${fmt(x.published)}` : " · not published yet"}</p>
    <p>${esc(x.blurb)}</p>
  </a>`).join("");
const nDone = c.exercises.filter(x => x.covered).length;
document.getElementById("page").innerHTML = `
  <p class="crumbs"><a href="index.html">Dashboard</a> / ${esc(m.name)}</p>
  <header class="hero">
    <h1>🖧 ${esc(m.name)}</h1>
    <p class="subtitle">${CODE} · ${esc(CMS.semester)} · Prof. Wolfgang E. Nagel, Dr. Robert Schöne · Chair of Computer Architecture and ZIH · TU Dresden</p>
  </header>
  ${HPC.topbar()}
  <main>
    <div class="board-h"><h2>Lectures</h2><span class="muted">Wednesdays ${HPC.lec.start} · ${esc(HPC.lec.room)}</span></div>
    <div class="game-cards">${lectures}</div>
    <div class="board-h"><h2>Exercises</h2><span class="muted">your Wednesday group, ${exe.start} · ${nDone} of ${c.exercises.length} published</span></div>
    <p class="muted board-note">${esc(c.exerciseNote)}</p>
    <div class="game-cards">${exercises}</div>
  </main>`;
</script>
</body>
</html>
