const { key, leg, flag, hbar, vbar, num, pct, col, CHARTS, LINES, place, chart, lab, line, mountCharts, isNarrow, dgm, seq } = DPFViz;

// ======================= Exercise 1: Variability Patterns (held 28 Oct; sheet and official solution read) =======================
const ROLES = leg([[1, "template role"], [2, "hook role"]]);
// Task 1a: Composite file system with add() as template and canAdd() as hook.
CHARTS.fs = narrow => {
  const D = dgm(narrow, { cols: narrow ? 2 : 4, rowH: narrow ? 84 : 90 });
  const res = D.box(narrow ? 0.5 : 1.3, 0, { name: "Resource", role: "g", abstract: true, h: 24, span: narrow ? 1 : 1.4 });
  const file = D.box(0, narrow ? 1.2 : 1.1, { name: "File", role: "g", h: 24, dy: narrow ? 0 : 10 });
  const fold = D.box(narrow ? 1 : 2, narrow ? 1.2 : 1.1, { name: "Folder", ops: ["add(Resource r)   ◂ template", "canAdd(Resource r) ◂ hook"], role: "t", abstract: true, span: narrow ? 1 : 1.6 });
  const unt = D.box(narrow ? 0 : 1.6, narrow ? 2.5 : 2.3, { name: "UntypedFolder", ops: ["canAdd(r): true"], role: "h", span: narrow ? 1 : 1.1 });
  const col = D.box(narrow ? 1 : 2.8, narrow ? 2.5 : 2.3, { name: "CollectionFolder", ops: ["containedClass: Class", "canAdd(r)"], role: "h", span: narrow ? 1 : 1.2 });
  D.inh(file, res); D.inh(fold, res); D.inh(unt, fold); D.inh(col, fold);
  if (!narrow) { const img = D.box(0, 2.1, { name: "ImageFile", role: "g", h: 22 }), doc = D.box(0, 2.5, { name: "DocumentFile", role: "g", h: 22 }), mus = D.box(0, 2.9, { name: "MusicFile", role: "g", h: 22 }); D.inh(img, file); D.inh(doc, file); D.inh(mus, file); }
  D.ref(fold, res, { kind: "agg", label: "res *" });
  if (!narrow) D.note(2.1, 3.35, ["canAdd(r) { return r instanceof File", "  && r.getClass() == containedClass; }"], col, { span: 1.9 });
  if (!narrow) D.note(0, 3.35, ["add(r) {", "  if (canAdd(r)) res.add(r); }"], fold, { span: 1.8 });
  return D.svg("Class diagram of the file system: Resource is the Composite root with File and Folder below it; Folder owns resources and has the template method add(r) that calls the hook canAdd(r); UntypedFolder always accepts, CollectionFolder accepts only files of its containedClass; ImageFile, DocumentFile and MusicFile are the file types.");
};
// Task 1b: render() as template, renderChildren() as hook.
CHARTS.render = narrow => {
  const D = dgm(narrow, { cols: narrow ? 2 : 4, rowH: narrow ? 96 : 96 });
  const res = D.box(narrow ? 0.5 : 1.3, 0, { name: "Resource", ops: ["name: String", "render()        ◂ template"], role: "t", abstract: true, span: narrow ? 1 : 1.4 });
  const file = D.box(0, narrow ? 1.3 : 1.2, { name: "File", ops: ["render(): show content"], role: "h", span: narrow ? 1 : 1.2 });
  const fold = D.box(narrow ? 1 : 2, narrow ? 1.3 : 1.2, { name: "Folder", ops: ["render(): name +", "  renderChildren()", "renderChildren() ◂ hook"], role: "t", abstract: true, span: narrow ? 1 : 1.9 });
  const unt = D.box(narrow ? 0 : 1.6, narrow ? 2.6 : 2.4, { name: "UntypedFolder", ops: ["renderChildren():", "  list, recurse"], role: "h", span: narrow ? 1 : 1.3 });
  const col = D.box(narrow ? 1 : 3, narrow ? 2.6 : 2.4, { name: "CollectionFolder", ops: ["renderChildren(): player /", "slideshow / viewer by class"], role: "h", span: narrow ? 1 : 1 });
  D.inh(file, res); D.inh(fold, res); D.inh(unt, fold); D.inh(col, fold);
  return D.svg("Class diagram of rendering: Resource declares render(); File shows its content; Folder's render() prints the name and calls the hook renderChildren(); UntypedFolder lists and recurses into its children, CollectionFolder opens a player, slideshow or viewer depending on its contained class.");
};
// Task 1c: hooks zipped out into a ResourceRenderer hierarchy (Template Class / Strategy).
CHARTS.renderer = narrow => {
  const D = dgm(narrow, { cols: narrow ? 2 : 4, rowH: narrow ? 92 : 96 });
  const res = D.box(0, 0, { name: "Resource", ops: ["render()   ◂ template", "  renderer.render(this)"], role: "t", abstract: true, span: narrow ? 1 : 1.3 });
  const rr = D.box(narrow ? 1 : 2.4, 0, { name: "ResourceRenderer", ops: ["render(Resource r) ◂ hook"], role: "h", abstract: true, span: narrow ? 1 : 1.5 });
  const a = D.box(0, 1.25, { name: "FileRenderer", ops: ["render(r)"], role: "h", span: narrow ? 1 : 1.3 });
  const b = D.box(narrow ? 1 : 1.35, 1.25, { name: "UntypedFolderRenderer", ops: ["render(r)"], role: "h", span: narrow ? 1 : 1.3 });
  const c = D.box(narrow ? 0.5 : 2.7, narrow ? 2.4 : 1.25, { name: "CollectionFolderRenderer", ops: ["render(r)"], role: "h", span: narrow ? 1 : 1.3 });
  D.ref(res, rr, { label: "renderer" }); D.inh(a, rr); D.inh(b, rr); D.inh(c, rr);
  return D.svg("Class diagram with the hooks reified: Resource keeps a renderer reference to the abstract ResourceRenderer; FileRenderer, UntypedFolderRenderer and CollectionFolderRenderer implement render(Resource), one per kind of resource.");
};
// Task 2a: transmitData reified into a DataTransmitter hierarchy.
CHARTS.sensor = narrow => {
  const D = dgm(narrow, { cols: narrow ? 2 : 4, rowH: narrow ? 100 : 100 });
  const su = D.box(narrow ? 0.5 : 0, 0, { name: "SensorUnit", ops: ["dataSinkAddress: String", "samplingIntervalInMs: int", "transmitData()  → transmitter", "sampleData()"], role: "t", abstract: true, span: narrow ? 1 : 1.4 });
  const dt = D.box(narrow ? 0.5 : 2.4, narrow ? 2.3 : 0, { name: "DataTransmitter", ops: ["transmitData(SensorUnit u)"], role: "h", abstract: true, span: narrow ? 1 : 1.5 });
  const tx = ["Raw", "Preprocessed", "Encrypted", "Unencrypted"].map((n, i) => narrow ? D.box(0, 3.3, { name: n, role: "h", h: 22, w: 76, dx: i * 82, sm: true }) : D.box(1.5 + i * 0.6, 1.3, { name: n, role: "h", h: 22, w: 86 }));
  const th = D.box(0, narrow ? 1.4 : 2.1, { name: "ThermalSensor", role: "g", h: 22, span: narrow ? 1 : 0.8 });
  const me = D.box(narrow ? 1 : 0.85, narrow ? 1.4 : 2.1, { name: "MechanicalSensor", role: "g", h: 22, span: narrow ? 1 : 0.9 });
  D.ref(su, dt, { label: narrow ? "" : "transmitter" }); tx.forEach(t => D.inh(t, dt)); D.inh(th, su); D.inh(me, su);
  return D.svg("Class diagram: SensorUnit keeps a transmitter reference to the abstract DataTransmitter with transmitData(SensorUnit); the four concrete transmitters Raw, Preprocessed, Encrypted and Unencrypted (each a …Transmitter) sit side by side, which is the smell task 2c asks about; the sensor subclasses stay below SensorUnit.");
};
// Task 2d/2e: the facets split into bridges around the SensorUnit core.
CHARTS.multi = narrow => {
  const D = dgm(narrow, { cols: narrow ? 2 : 3, rowH: narrow ? 92 : 96 });
  const su = D.box(narrow ? 0.5 : 1, 0, { name: "SensorUnit (core)", ops: ["sampleData()  → sensor", "transmitData() → transmitter"], role: "t", span: 1 });
  const se = D.box(0, 1.3, { name: "Sensor", ops: ["sampleData()"], role: "h", abstract: true });
  const tr = D.box(1, 1.3, { name: "DataTransmitter", ops: ["transmitData(u)"], role: "h", abstract: true });
  const dh = D.box(narrow ? 0.5 : 2, narrow ? 2.9 : 1.3, { name: "DataHandler", ops: ["handleData(u)"], role: "h", abstract: true });
  const s1 = D.box(0, 2.2, { name: "ThermalSensor …", role: "g", h: 22 });
  const t1 = D.box(1, 2.2, { name: "Raw / Preprocessed", role: "g", h: 22 });
  const d1 = D.box(narrow ? 0.5 : 2, narrow ? 3.8 : 2.2, { name: "Encrypted / Plain", role: "g", h: 22 });
  D.ref(su, se, { label: "sensor" }); D.ref(su, tr, { label: "transmitter" }); D.ref(su, dh, { label: "dataHandler" });
  D.inh(s1, se); D.inh(t1, tr); D.inh(d1, dh);
  return D.svg("Multi-bridge with SensorUnit as the core: the core delegates sampleData() to a Sensor facet and transmitData() to a DataTransmitter facet (raw or preprocessed) which in turn uses a DataHandler facet (encrypted or plain); no facet is primary.");
};
// Leaf classes for the sensor unit: one hierarchy versus facets with bridges, with the sheet's numbers.
CHARTS.leaves = narrow => {
  const W = narrow ? 340 : 600, L = narrow ? 110 : 190, R = narrow ? 40 : 60, T = 8, RH = 40, rows = [["one hierarchy", 16, "gray", "4 sensor types × 2 payloads × 2 channels"], ["bridges (2e)", 8, "s1", "4 sensors + 2 transmitters + 2 handlers"]];
  const H = T + rows.length * RH + 24, max = 16, x = v => L + v / max * (W - L - R);
  const ticks = [0, 4, 8, 12, 16].map(v => `<line class="${v ? "grid" : "axis"}" x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - 22}"/><text class="tick" x="${x(v)}" y="${H - 8}" text-anchor="middle">${v}</text>`).join("");
  const bars = rows.map(([k, v, s, d], i) => { const y0 = T + i * RH + 6; return `<g class="pt row" tabindex="0" data-tip="<b>${k}: ${v} leaf classes</b>${d}"><text class="cat" x="${L - 8}" y="${y0 + 18}" text-anchor="end">${k}</text><path class="bar ${s}" d="${hbar(x(0), x(v), y0, 26)}"/><text class="val" x="${x(v) + 6}" y="${y0 + 18}">${v}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart: concrete classes for the sensor unit with four sensor types, two payload kinds and two channel kinds. One combined hierarchy needs 16 leaf classes; the bridges of task 2e need 8.">${ticks}${bars}</svg>`;
};
function exercise1() {
  return `${head(e)}
    <p class="lead">The first sheet makes you draw the variability patterns of <a href="design-patterns/lecture.html?n=2">lecture 2</a>: Template Method and Composite on a small file system, Objectifier and Bridge on a family of sensors, then the comparisons the lecture keeps coming back to, and a homework on a real search framework. The session on 28 Oct discussed the solutions; the official solution has been published in OPAL since. Below each task is restated in our own words, followed by the worked answer (our drawing, checked against the published solution where it exists) and what the task trains. The sheet carries no points.</p>
    <div class="box status"><p style="margin:0"><b>Status:</b> session held on ${fmt(e.date)}; task 4 is homework for the next exercise (<a href="design-patterns/exercise.html?n=2">exercise 2</a>, 4 Nov) and is not optional for DSE submissions.</p></div>

    ${task("1", 0, "Template Method versus Template Class on a file system", `
      <p>A file system has resources; a resource is a file or a folder, and folders hold resources. There are several file types (text, image, music). Untyped folders accept anything; collection folders (like the Pictures or Music folder of a home directory) accept exactly one file type and no subfolders.</p>
      <h3>a) Structure with Composite, constraints with Template Method</h3>
      <p>The structure is a Composite: Resource is the component, File the leaf, Folder the composite that aggregates resources. The constraint sits in Folder: <code>add(r)</code> is the <b>template method</b> and calls the <b>hook</b> <code>canAdd(r)</code> before it stores anything; the hook is what the two folder kinds bind differently. A collection folder records the one class it may contain in a field and tests the candidate against it; an untyped folder answers true.</p>
      ${chart("fs", ROLES)}<figcaption>Our class diagram of the solution. The pseudo-code notes carry the template and the hook; only Folder subclasses may bind canAdd, nobody overrides add.</figcaption></figure>
      ${ans([["add() / canAdd()", "template / hook pair in Folder"], ["containedClass", "encodes the allowed file type of a collection folder"], ["Composite", "Resource, File, Folder with res *"]])}
      <h3>b) Rendering with Template Method</h3>
      <p>Rendering a resource on screen: a file on its own shows its content; a folder prints its name and renders its children; an untyped folder just lists them; a collection folder renders according to its contents (a music folder as a player, an image folder as a slideshow, a document folder in a viewer).</p>
      <p>Same technique, one level up: <code>render()</code> in Folder is the template (print the name, then call the hook), <code>renderChildren()</code> is the hook. UntypedFolder's hook iterates the children and calls their render(), which is the recursion of the Composite; CollectionFolder's hook branches on its contained class to build the player, slideshow or viewer and adds the children to it.</p>
      ${chart("render", ROLES)}<figcaption>Our class diagram of the rendering solution: render() is the template in Resource and Folder, renderChildren() the hook bound by the two folder kinds.</figcaption></figure>
      <h3>c) Turn it into a Template Class (or Strategy)</h3>
      <p>Zip every hook out of the resource classes into a separate hierarchy: Resource keeps a reference to an abstract ResourceRenderer and its render() simply delegates <code>renderer.render(this)</code>; FileRenderer, UntypedFolderRenderer and CollectionFolderRenderer are the hook values, one per kind of resource.</p>
      ${chart("renderer", ROLES)}<figcaption>Our class diagram of the Template Class version: the Objectifier applied to renderChildren, which makes Resource the template class and ResourceRenderer the hook class.</figcaption></figure>
      <ul class="cmp">
        <li><b>advantages</b><span class="v">renderers can be exchanged at run time (a folder can switch from list to slideshow without becoming another object)</span><span class="v">rendering code is separate from the data structure and can be reused and tested on its own</span></li>
        <li><b>disadvantages</b><span class="v">two objects per rendered resource: more allocation time and memory</span><span class="v">two polymorphic dispatches when both template and hook vary, so slower; and nothing stops a FileRenderer being attached to a folder, so type safety must be secured, for which the creational patterns of lecture 3 (Abstract Factory) help</span></li>
      </ul>
      ${why("What the task trains", "<p>Recognising that “the constraint must hold on every add” is a template method with the check as hook, and that “render differently per folder kind” is the same shape one level up. Part c is the lecture's slide 24 to 29 in your own hands: the mechanical move from Template Method to Template Class, and its costs. In the oral exam this is the kind of design you may be asked to sketch and defend.</p>")}`)}

    ${task("2", 0, "Objectifier: reifying methods on a sensor unit", `
      <p>A SensorUnit (with a data sink address and a sampling interval, and the methods sampleData() and transmitData()) has subclasses ThermalSensor (temperature, heat flux) and MechanicalSensor (velocity, acceleration). Units buffer data and transmit it to a sink on demand.</p>
      <h3>a) Reify transmitData into an Objectifier</h3>
      <p>SensorUnit gets a reference <code>transmitter</code> to a new abstract class DataTransmitter with the reified method <code>transmitData(SensorUnit u)</code>; the unit's own transmitData() delegates to it. Four concrete transmitters are asked for: raw data, compressed and preprocessed data, unencrypted, encrypted.</p>
      ${chart("sensor", leg([[1, "template: the sensor unit"], [2, "hook: the reified transmit method"], ["g", "sensor subclasses, unchanged"]]))}<figcaption>Our class diagram of 2a (the four boxes are RawTransmitter, PreprocessedTransmitter and so on). Four siblings under one abstract class is what the sheet wants here; it is also the smell that part c names.</figcaption></figure>
      <h3>b) How the wording changes</h3>
      <p>A verb becomes a noun: the method <i>transmit data</i> turns into the reference <i>transmitter</i> (the object that transmits). That is the general tell of an Objectifier or Strategy: LearningStyle for learn(), Exporter for export(), Renderer for render().</p>
      ${ans([["verb → noun", "transmitData() becomes a transmitter object"]])}
      <h3>c) What is wrong with one hierarchy of four transmitters</h3>
      <p>The four classes do not partition DataTransmitter: whether data goes out encrypted or in the clear is independent of whether it is raw or preprocessed. They are two <b>facets</b> (lecture 2, slide 71: a class whose heirs do not partition it is a facet model in disguise), so "EncryptedTransmitter" and "RawTransmitter" are not comparable alternatives, and a unit that needs encrypted preprocessed transmission has no class to pick.</p>
      <h3>d) Split with a simple Bridge</h3>
      <p>Keep DataTransmitter with the payload facet (RawTransmitter, PreprocessedTransmitter) and bridge it to a second hierarchy DataHandler with the channel facet (EncryptedTransfer, UnencryptedTransfer): the transmitter first asks its handler to prepare the data (<code>dataToTransmit = dataHandler.handleData(u)</code>) and then sends it. The published solution calls this a sequenced double bridge, since the unit bridges to the transmitter and the transmitter bridges on to the handler; in the lecture's terms it is a 2-chain bridge, a layered object (slide 82).</p>
      <h3>e) All facets as bridges around SensorUnit</h3>
      <p>Now the sensor kind becomes a facet too: SensorUnit stops being the root of the sensor hierarchy and instead aggregates a Sensor object (ThermalSensor, MechanicalSensor and their subclasses move under Sensor), a DataTransmitter and a DataHandler, all directly referenced by the core. Every call is delegated to the facet object.</p>
      ${chart("multi", leg([[1, "core"], [2, "facet hook classes"], ["g", "facet values"]]))}<figcaption>Our drawing of 2e, a multi-bridge with core (lecture 2, slide 69). The inheritance hierarchy of the sensor unit has been reified into aggregation.</figcaption></figure>
      ${chart("leaves", leg([["g", "one combined hierarchy"], [1, "facets with bridges"]]))}<figcaption>Our count of concrete classes for the sheet's sensor unit: four sensor types times two payload kinds times two channel kinds in one hierarchy against the sum of the facets with bridges. Hover a bar.</figcaption></figure>
      ${tbl(["Design", "Leaf classes", "How counted"], [["one hierarchy", 16, "4 × 2 × 2"], ["bridges", 8, "4 + 2 + 2"]])}
      <p><b>Implications</b> of reifying the inheritance hierarchy: no facet gets special attention as the primary one, all can be varied independently and at run time (a unit can switch to encryption without being recreated), and the sensor types no longer multiply with the transmission options. The price is the lecture's slide 73 list: no type check on the combinations, object schizophrenia (one logical unit is four objects), memory and dispatch costs. The published solution adds a pragmatic note: for performance it may be useful to make one facet primary, but that is an implementation decision based on measured usage, not a design decision taken for no reason.</p>
      ${why("What the task trains", "<p>The move from a method to an object (a), the vocabulary that signals it (b), recognising non-partitioning subclasses as hidden facets (c), and the two ways of wiring facets, chained and around a core (d, e). Lectures 6 to 8 return to this with roles, which are the course's answer to the object schizophrenia the multi-bridge causes.</p>")}`)}

    ${task("3", 0, "Comparing the variability patterns", `
      <ul class="cmp">
        <li><b>a) Bridge vs Template Method</b><span class="v"><b>Common:</b> both declare abstract methods in a superclass that subclasses implement; both are template-and-hook.</span><span class="v"><b>Different:</b> in a Template Method the subclass of the same class implements the hook, so interface and implementation stay in one hierarchy; a Bridge hides how the abstract methods are implemented behind a second hierarchy, so abstraction and implementation can be refined separately and exchanged at run time, which a Template Method cannot do.</span></li>
        <li><b>b) Template Method vs Strategy</b><span class="v"><b>Common:</b> both vary behaviour behind an abstract method; Strategy has the Objectifier structure, Template Method the single-class structure.</span><span class="v"><b>Different:</b> Template Method varies <i>parts</i> of an algorithm, Strategy exchanges the <i>whole</i> algorithm. Template Method is checked by the compiler, which finds inconsistencies in the inheritance and the typing statically; with Strategy, problems (a missing or wrong strategy object) show up at run time only.</span></li>
        <li><b>c) Template Class vs Generic Template Class</b><span class="v"><b>Common:</b> template and hook in separate classes, hook values as subclasses of the hook class.</span><span class="v"><b>Different:</b> Template Class dispatches polymorphically to the hook object at run time; the generic version expands the binding at compile time, so there is more type safety and no dispatch, but no run-time exchange. Generic expansion also flattens the hook hierarchy: deep inheritance structures can be flattened in parts by generics.</span></li>
      </ul>
      ${why("What the task trains", "<p>Slide 31 of lecture 2 in three instances: same structure or similar structure, different incentive and different guarantees. The exam-grade answer always names what is common, what differs, and when you would choose which; the compile-time versus run-time axis appears in all three.</p>")}`)}

    ${task("4", 0, "Homework: variability patterns in the Search framework", `

// Explorer: a maze builder that enforces the structural rules; the director's calls become buttons.
function initMazeLab(body) {
  const S = { rooms: [], doors: [], log: [], built: null, enchanted: false };
  const act = (k) => {
    if (k === "room") { if (S.rooms.length >= 5) return S.log.push(`<span class="bad">✗ addRoom(${S.rooms.length + 1})</span> this little maze stops at 5 rooms`); const n = S.rooms.length + 1; S.rooms.push(n); S.log.push(`<span class="ok">✓ addRoom(${n})</span> ${S.enchanted ? "MagicRoom" : "Room"} ${n} created with 4 ${S.enchanted ? "" : ""}walls`); }
    if (k === "door") { const n = S.rooms.length; if (n < 2) return S.log.push(`<span class="bad">✗ addDoor(${n}, ${n + 1})</span> rejected: both rooms must exist first`); const a = n - 1, b = n;
      if (S.doors.some(d => d[0] === a && d[1] === b)) return S.log.push(`<span class="bad">✗ addDoor(${a}, ${b})</span> rejected: these rooms already share a door`);
      S.doors.push([a, b]); S.log.push(`<span class="ok">✓ addDoor(${a}, ${b}, EAST)</span> one ${S.enchanted ? "SpellDoorWall" : "DoorWall"} replaces room ${a}'s east wall and room ${b}'s west wall`); }
    if (k === "get") { if (!S.rooms.length) return S.log.push(`<span class="bad">✗ getMaze()</span> rejected: a maze needs at least one room`); S.built = { rooms: S.rooms.length, doors: S.doors.length }; S.log.push(`<span class="ok">✓ getMaze()</span> Maze with ${S.rooms.length} room${S.rooms.length > 1 ? "s" : ""}, ${S.doors.length} door${S.doors.length === 1 ? "" : "s"}, ${S.rooms.length * 4 - S.doors.length * 2} plain walls; every room has exactly 4 sides`); }
  };
  const render = () => {
    const n = S.rooms.length, W = 340, rw = 56, svg = `<svg viewBox="0 0 ${W} 70" role="img" aria-label="${n} rooms in a row with ${S.doors.length} doors between neighbours">${S.rooms.map((r, i) => `<g class="cls ${S.enchanted ? "h" : "p"}"><rect x="${10 + i * 66}" y="10" width="${rw}" height="${rw}" rx="4"/><text class="cn" x="${10 + i * 66 + rw / 2}" y="42" text-anchor="middle">${r}</text></g>`).join("")}${S.doors.map(([a, b]) => `<rect x="${10 + (a - 1) * 66 + rw - 3}" y="26" width="16" height="24" rx="3" fill="var(--vz-s3)"/>`).join("")}</svg>`;
    body.innerHTML = `<p class="lab-note">The director's three calls as buttons. The builder refuses what the structural rules forbid (a door before its rooms exist, a second door between the same rooms, a maze without rooms) and does the bookkeeping the hand-written createMaze of the sheet gets wrong easily: every room gets four sides, a door is set on both rooms at once.</p>
      <div class="ctl"><label><input type="checkbox" data-k="ench" ${S.enchanted ? "checked" : ""}> EnchantedMazeBuilder (magic rooms, spell doors)</label></div>
      <div class="proto"><button data-k="room">addRoom(${n + 1})</button><button data-k="door">addDoor(${Math.max(1, n - 1)}, ${Math.max(2, n)})</button><button data-k="get">getMaze()</button><button data-k="reset">reset</button></div>
      <figure class="viz" style="margin-top:0;max-width:420px">${svg}</figure>
      <div class="trace">${S.log.slice(-4).map(l => `<div>${l}</div>`).join("") || "<span class='muted'>start with addRoom(1)</span>"}</div>`;
    body.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { if (b.dataset.k === "reset") Object.assign(S, { rooms: [], doors: [], log: [], built: null }); else act(b.dataset.k); render(); }));
    body.querySelector("[data-k=ench]").addEventListener("change", e => { S.enchanted = e.target.checked; S.rooms = []; S.doors = []; S.log = [`builder exchanged: ${S.enchanted ? "EnchantedMazeBuilder" : "StandardMazeBuilder"}, same director code`]; render(); });
  };
  render();
}
function exercise2() {
  return `${head(e)}
    <p class="lead">The second sheet applies the three creational patterns of <a href="design-patterns/lecture.html?n=3">lecture 3</a> to the maze game the lecture itself uses: Abstract Factory, Factory Method and Prototype to get a standard and an enchanted game from one construction routine, Builder to make that routine safe, and factory methods in parallel hierarchies for read-only and editable views of UML diagrams. The sheet has been in OPAL since 30 Oct and was discussed on 4 Nov. Every answer below is our own worked solution, written before the official one; the official solution (in OPAL since 5 Nov) uses the same patterns and structures, and the box below lists where it is more specific or differs. The sheet carries no points.</p>
    <div class="box status"><p style="margin:0"><b>Status:</b> own solutions drafted; session on ${fmt(e.date)}, ${exe.start}, ${esc(exe.room)}. The homework of <a href="design-patterns/exercise.html?n=1">exercise 1, task 4</a> (three patterns in the Search framework) is due in the same session.</p></div>
    ${why("Compared with the official solution (5 Nov)", `<ul style="margin:0;padding-left:1.1rem">
      <li><b>1a</b>: the official MazeFactory is a concrete class with the standard products as defaults, and MagicMazeFactory subclasses it (makeRoom, makeDoorWall); the game holds the factory in a static field chosen once by an initFactory() step (old or new version) instead of receiving it as a parameter. That settles our open question: held, not passed. Spells are picked by the factory for every room and door.</li>
      <li><b>1b</b>: MazeGame owns the factory methods with the standard products, MagicMazeGame overrides two of them; same as ours.</li>
      <li><b>1c</b>: one PrototypeMazeFactory initialised with a prototype maze, room, wall and door; every make method clones and then sets the room number or the two rooms of a door. Same structure as ours.</li>
      <li><b>1d</b>: the official comparison adds two points we did not make: prototypes do not pay off when the prototype objects are large (memory, e.g. embedded systems) or when copying is slower than constructing (profile it), and an Abstract Factory pays off when several clients use the same set of factory methods, since the factory object can be handed to all of them.</li>
      <li><b>2a</b>: a concrete MazeBuilder (buildMaze, buildRoom(n), buildDoor(n1, direction, n2), getMaze) that creates the Maze itself, plus a MagicMazeBuilder subclass; it remarks that the builder could use factory methods for its parts. Ours differs only in names and in an abstract base class.</li>
      <li><b>2b</b>: the builder encapsulates the product and checks the rules inside its operations, throwing an exception for a missing room or a side that already has a door; a further step would keep the rooms on a grid so that doors can only join neighbours.</li>
      <li><b>3a–3b</b>: the official answer names Model-View-Controller for 3a and uses <b>three</b> parallel hierarchies, the model elements (Class, State, Activity and their relations), the read-only figures and the manipulators, with the constraint that a ClassManipulator always belongs to a ClassFigure, which belongs to a Class model object. Our two hierarchies merged model and figure.</li>
      <li><b>3c–3d</b>: createManipulator() on the top figure class, as ours. The official Abstract Factory has a single method createManipulatorFor(figure) on a singleton factory, which inspects the figure's class (reflection and a switch); its advantage is that one figure can get different kinds of manipulators (resize, delete), its drawback that type dispatch is done by hand, which the polymorphic factory method does better.</li>
    </ul>`)}

    ${task("1", 0, "Amazing creation: two games from one plan of rooms", `
      <p>The sheet gives a maze game: a Maze holds Rooms by number; a Room has four sides, each a Wall or a DoorWall that joins two rooms and can be open; MazeGame.createMaze() builds two rooms, one door between them and plain walls elsewhere, all with explicit <code>new</code> calls. Now a second game needs the same plan of rooms but <b>magic rooms</b> (with booby traps survivable only with a spell) and <b>spell doors</b> that open only while the right spell, invoked in the player's room, is in effect. The construction code must not be duplicated: one program creates both games.</p>
      <h3>a) Abstract Factory</h3>
      <p>Take every <code>new</code> out of createMaze and put it behind a factory interface with one factory method per product: makeMaze, makeRoom(n), makeWall, makeDoor(r1, r2). createMaze receives a MazeFactory and only ever calls it. StandardMazeFactory returns the old classes; EnchantedMazeFactory returns MagicRoom and SpellDoorWall, both subclasses of the standard products so the rest of the game keeps working on Room and Wall. A Spell object is handed to the enchanted factory once and copied into every magic room and spell door it makes.</p>
      ${chart("mazeAF", CROLES)}<figcaption>Our class diagram for 1a with the factory pseudo-code of createMaze. Choosing the factory object at start-up chooses the whole family: rooms and doors always match.</figcaption></figure>
      <h3>b) Factory Method</h3>
      <p>Alternatively keep the construction inside MazeGame and make the <code>new</code> calls into overridable methods of the game itself: makeRoom(n), makeWall(), makeDoor(r1, r2) with the standard products as default implementations, called from the template method createMaze(). EnchantedGame subclasses MazeGame and overrides the two factory methods that differ. The factory method's job is to decide <i>which class</i> is allocated while createMaze decides <i>when</i> and how the parts are wired (lecture 3, slide 11).</p>
      ${chart("mazeFM", CROLES)}<figcaption>Our class diagram for 1b: lecture 3's slide 6 with the maze of the sheet. No factory object exists; the game subclass is the variation point.</figcaption></figure>
      <h3>c) One concrete factory with Prototype</h3>
      <p>The two factories of (a) differ only in which class they allocate. Replace them by one MazeFactory that holds a prototype room, wall and door and implements each makeX by cloning the prototype (with the arguments applied after the copy: the room number, the two rooms of a door). The standard game configures the factory with a Room, a Wall and a DoorWall; the enchanted game with a MagicRoom and a SpellDoorWall carrying the spell. Products must implement a proper <code>clone()</code>; a door's clone must not copy the room references of the prototype but take fresh ones.</p>
      ${chart("mazeProto", leg([[2, "the single factory"], [4, "products as prototypes"]]))}<figcaption>Our class diagram for 1c, the prototyping factory of lecture 3, slide 21. A third game is a third configuration line, not a third class.</figcaption></figure>
      <h3>d) Which solution for which context</h3>
      <ul class="cmp">
        <li><b>Abstract Factory</b><span class="v">best when the products form a family that must stay consistent and the family is chosen once (game type at start-up); adding a game is one factory class, adding a product type touches every factory</span><span class="v">cost: one more hierarchy to maintain in parallel with the products</span></li>
        <li><b>Factory Method</b><span class="v">best when there is one natural creator class already (the game) and few products vary; the smallest change to the sheet's code and checked by the compiler</span><span class="v">cost: variation is tied to subclassing the game, so a game cannot switch families at run time and combinations of variations multiply subclasses</span></li>
        <li><b>Prototype factory</b><span class="v">best when products have complex default state (a spell, trap settings) or many near-identical variants, and when families should be assembled at run time or from configuration</span><span class="v">cost: clone semantics (deep versus shallow) must be right for every product; no compile-time check that a configuration is a sensible family</span></li>
      </ul>
      ${why("What the task trains", "<p>The three structures of lecture 3 on one example, and the two change axes of the context box there: new family versus new product type. In the session the question to settle is whether the chair prefers the factory passed into createMaze (as drawn) or held in a field of the game; both are Abstract Factory.</p>")}`)}

    ${task("2", 0, "Building mazes", `
      <p>Exchanging classes is solved, but createMaze is still long and error-prone: nothing stops a room with three sides or a door set on only one of its two rooms. The task: hide the construction behind a Builder, for the original game and the extension, and explain how the builder enforces the structural rules.</p>
      <h3>a) A MazeBuilder</h3>
      <p>The director is createMaze(builder); its protocol is newMaze, then addRoom(n) for every room, then addDoor(from, to, direction) for every connection, then getMaze. The abstract MazeBuilder declares those four calls; StandardMazeBuilder implements them with Room, Wall and DoorWall and keeps the rooms in a map by number; EnchantedMazeBuilder, configured with a spell, creates MagicRoom and SpellDoorWall instead. The director never sees a Wall: the builder fills all four sides of a new room with plain walls and replaces two of them, consistently, when a door is added.</p>
      ${chart("mazeBuilder", CROLES)}<figcaption>Our class diagram for 2a. Compared with 1a the interface is no longer "make me a part" but "add this to the structure", which is where the rules can live.</figcaption></figure>
      ${lab("maze", "a MazeBuilder that enforces the rules")}
      <h3>b) How the Builder enforces structural rules</h3>
      <ul>
        <li><b>Invariants in the part methods:</b> addRoom always creates a room with four walls, so no room is ever half-built; addDoor sets the door on both rooms (east of one, west of the other) in one step, so a door is never one-sided.</li>
        <li><b>The protocol as a state machine:</b> addDoor before both rooms exist, a second door between the same two rooms, or getMaze on an empty maze are refused, exactly as lecture 3's slide 30 says: the builder keeps the state of the construction and accepts only calls the protocol allows at that point.</li>
        <li><b>Information hiding:</b> the director cannot reach walls or sides at all (slide 31), so the only way to produce a maze is through the checked calls; the hand-written createMaze of the sheet could call setSide in any order.</li>
      </ul>
      ${why("What the task trains", "<p>The difference between a factory (which part?) and a builder (which structure?), and the lecture's claim that a structure defined by a grammar yields a builder: rooms*, doors* over existing rooms is a tiny grammar, and the lab above is its acceptor.</p>")}`)}

    ${task("3", 0, "Creation in parallel hierarchies: views of UML models", `
      <p>A company builds graphical UML editors. A model can be shown in several views (class diagrams, statecharts, activity diagrams), and views differ in what manipulation they allow, above all read-only versus mutable. Class hierarchies are wanted for classes and inheritance arrows, states and transitions, activities and their transitions.</p>
      <h3>a) Which pattern fits</h3>
      <p>Several views on one data structure is Observer in the MVC sense (lecture 1): views register at the model and are updated. The read-only versus mutable split of each view is a second dimension of the same elements, which is a <b>dimensional class hierarchy</b> (Bridge) whose two sides are not independent: every element kind needs its own manipulator kind, so they are <b>parallel class hierarchies</b> with a parallelism constraint, created by factory methods (lecture 3, slide 10).</p>
      <h3>b) The two facets and their link</h3>
      <p>One hierarchy ReadOnlyElement with ClassElement, InheritanceArrow, StateElement, TransitionArrow, ActivityElement, ActivityTransition (and the diagrams above them), all able to draw themselves; a parallel hierarchy Manipulator with one subclass per element kind, holding a reference to the read-only element it edits (move, rename, change attributes). The facets are linked by that reference, optionally in both directions (a read-only element may hold its manipulator, 0..1, so a read-only view simply never creates one). The constraint to enforce: the hierarchies are <b>isomorphic</b>, same classes at the same height, and an element is only ever paired with the manipulator of its own kind.</p>
      ${chart("views", leg([[1, "read-only facet (template side)"], [2, "its factory methods"], [4, "mutable facet (manipulators)"]]))}<figcaption>Our class diagram for 3b and 3c: two parallel hierarchies, linked by the manipulator reference and the factory method that keeps the pairing right.</figcaption></figure>
      <h3>c) Factory methods for the writable side</h3>
      <p>Each read-only class gets <code>createManipulator()</code>, implemented at every level by the class at the same level: ClassElement returns <code>new ClassManipulator(this)</code>, StateElement a StateManipulator, and a ClassDiagram's createManipulator builds a ClassDiagramManipulator that in turn asks each element for its manipulator. A mutable view is then "the read-only view plus, for every element, the manipulator its factory method returns"; the parallelism constraint is enforced by construction because no other code allocates manipulators.</p>
      <h3>d) An Abstract Factory for manipulators</h3>
      <p>Alternatively collect the factory methods into a ManipulatorFactory with createClassManipulator(e), createStateManipulator(e) and so on, and give the view one factory object. Concrete factories are families of manipulation behaviour: a FullEditFactory, a ReviewFactory that only allows comments, a ReadOnlyFactory that returns null manipulators.</p>
      <ul class="cmp">
        <li><b>advantages</b><span class="v">the manipulation policy is one exchangeable object, chosen per view or per user role at run time; the element classes no longer know about manipulators at all</span><span class="v">new families (review mode) cost one factory class, no element changes</span></li>
        <li><b>disadvantages</b><span class="v">the factory must know every element kind, so a new element type touches the abstract factory and every concrete factory (the interpretive variant of lecture 3 trades that for a string)</span><span class="v">the pairing is now checked by the factory's method names rather than by the element's own class, and the dispatch on the element kind has to happen somewhere (a Visitor over elements, or a type switch), which the factory-method version got for free</span></li>
      </ul>
      ${why("What the task trains", "<p>The parallel hierarchies of lecture 2 meeting the creational patterns of lecture 3, and the recurring trade-off: a factory method per class keeps the pairing local and compile-checked, an abstract factory makes the family a run-time choice. Exercise 1's task 1c ended with exactly this hint, that an Abstract Factory can secure the type safety of reified hooks.</p>")}`)}

  const notify = (s, depth) => { for (const o of obs[s]) { if (n >= CAP) { overflow = true; return; } n++;
      const nv = val[s], changed = nv !== val[o]; val[o] = nv;
      if (OB.strat === "guard" && !changed) { log.push(`${"· ".repeat(depth)}${o}.update(): ${o} is already ${nv}, nothing changed, no notify`); continue; }
      log.push(`${"· ".repeat(depth)}${o}.update(): reads ${s} = ${nv}, ${o}.notify()`); notify(o, depth + 1); if (overflow) return; } };
  notify("C", 1);
  return { log, ok: !overflow, n };
}

function exercise3() {
  return `${head(e)}
    <p class="lead">The third sheet is about extensibility: a polynomial represented as an object tree that new operations (count the minus signs, compute the degree, evaluate at x) and new node kinds (sine, cosine, tangent) can be added to, and an Observer chain that turns into an endless loop once it is closed into a cycle. It belongs to <a href="design-patterns/lecture.html?n=4">lecture 4, Simple Patterns for Extensibility</a> (10 Nov), which comes the day before the session, and it reuses Composite and Observer from <a href="design-patterns/lecture.html?n=1">lecture 1</a>'s MVC and Visitor from <a href="design-patterns/lecture.html?n=2">lecture 2</a>. <b>Every answer below is our own</b>; the official solution has been in OPAL since 19 Nov and is not compared here yet. The sheet carries no points.</p>
    <div class="box status"><p style="margin:0"><b>Status:</b> sheet in OPAL since ${fmt(e.published)} (2 pages, three tasks); session on ${fmt(e.date)}, ${exe.start}, ${esc(exe.room)}. Lecture 4's slides are not written up yet, so the links to it lead to the lecture's placeholder until then.</p></div>

    ${task("1", 0, "The degree of polynomials", `
      <p>Polynomials in one variable x and their degree, with three examples: 2x² − 5 (degree 2), x(177x − 15x) (degree 2) and (x − 2x²)(2 + 4x) (degree 3). (a) Which extensibility pattern represents polynomials? Draw the class diagram. (b) What is the smallest reasonable number of classes, and why? (c) A function countSigns() counts the minus signs of a polynomial: which patterns fit, with which advantages and disadvantages? (d) Which pattern computes the degree, and how? (e) Explain how degree() works in the classes of the diagram, in pseudocode or words.</p>
      <h3>a) Composite</h3>
      <p>The examples are not lists of terms but nested expressions: a product of two sums, a product of x and a difference. The structure that represents "a whole made of parts of the same kind, to any depth" is <b>Composite</b> (object recursion): an abstract Expression, leaves that end the recursion (a constant, the variable x) and composites that hold sub-expressions (sum and product). A client treats a single constant and a whole product of sums the same way, through Expression. Extensibility comes from both directions: a new node kind is one new subclass, and every operation is a recursive method over the tree.</p>
      ${chart("polyComp", PROLES)}<figcaption>Our class diagram for 1a with the five classes of 1b. Powers are products (x² = x · x), subtraction is a Sum with a flag on its right operand.</figcaption></figure>
      <h3>b) The smallest reasonable number of classes</h3>
      <p><b>Five</b>: Expression (abstract), Constant, Variable, Sum, Product. Fewer is possible but not reasonable: a single "Operation" class with an operator field would replace subclassing by a type switch inside every method, which is exactly what Composite avoids; and a list-of-monomials representation (a Polynomial holding coefficient/exponent pairs) cannot keep (x − 2x²)(2 + 4x) as written, it would have to multiply it out. More classes are optional: a Difference class instead of the sign flag makes countSigns a type test, a Power class makes x<sup>100</sup> one node instead of 99 products, a Negation class covers a leading minus. Each of them adds a class without changing the others, which is the extensibility the pattern promises.</p>
      ${ans([["5 classes", "Expression, Constant, Variable, Sum, Product"], ["2 leaves + 2 composites", "everything else is built from them: x² = x · x, a − b = Sum with the sign flag"]])}
      <h3>c) countSigns(): three ways</h3>
      <ul class="cmp">
        <li><b>Object recursion</b><span class="v">Pro: add countSigns() to Expression and implement it in every class: leaves return 0, a Sum returns (its own minus ? 1 : 0) + left.countSigns() + right.countSigns(). Simple, no extra classes, polymorphism does the dispatch</span><span class="v">Con: every new operation (degree, evaluate, print …) touches all node classes; the node classes collect unrelated functionality</span></li>
        <li><b>Visitor</b><span class="v">Pro: one SignCounter class with a visit method per node class; nodes only offer accept(v). New operations are new visitors, the node classes stay closed (lecture 2, slides 47–59)</span><span class="v">Con: a new node class (Power, Sine) forces a new visit method in every visitor; the visitor needs access to the nodes' fields (the sign flag), which weakens encapsulation</span></li>
        <li><b>Iterator + type test</b><span class="v">Pro: walk the tree with an iterator and count the nodes that are subtractions; the counting code stays outside and is short</span><span class="v">Con: an instanceof or flag test per node: the dispatch the patterns provide is done by hand, and it breaks silently when a new minus-carrying node kind is added</span></li>
      </ul>
      ${chart("polyVis", leg([[2, "visitor (operation interface)"], [3, "concrete operations"]]))}<figcaption>Our class diagram of the Visitor variant: the three operations of this sheet become three visitor classes; the five node classes of 1a only get accept(v).</figcaption></figure>
      <h3>d) and e) degree()</h3>
      <p>The degree is another recursive operation over the Composite, so either a method in every class (object recursion, the Interpreter view: the degree is one more interpretation of the expression) or a DegreeVisitor. Its rules follow from the algebra of degrees:</p>
      <div class="formula">Constant.degree() = 0 &nbsp;&nbsp; Variable.degree() = 1<br>Sum.degree() = max(left.degree(), right.degree())<br>Product.degree() = left.degree() + right.degree()</div>
      ${ex("Worked example: the three polynomials of the sheet", `<p>(1) 2x² − 5 = Sum(Product(2, Product(x, x)), 5 with minus): max(0 + (1 + 1), 0) = <b>2</b>. (2) x(177x − 15x) = Product(x, Sum(Product(177, x), Product(15, x))): 1 + max(1, 1) = <b>2</b>. (3) (x − 2x²)(2 + 4x) = Product(Sum(x, Product(2, Product(x, x))), Sum(2, Product(4, x))): max(1, 2) + max(0, 1) = <b>3</b>. countSigns gives 1, 1 and 1.</p>`)}
      <p>The Sum rule is an upper bound: in x² + 1 − x² the leading terms cancel and the true degree is 0, while the structural rule says 2 (try it below). For the sheet's examples nothing cancels (177x − 15x = 162x), so the rules give the exact degree. An exact degree() has to compute the coefficients (a Product multiplies coefficient lists, a Sum adds them) and take the highest non-zero one; the explorer does both and flags the difference.</p>
      ${lab("poly", "polynomials as a Composite: degree, minus signs, evaluate, secant")}
      ${ans([["2 · 2 · 3", "degrees of the three examples, by the structural rules"], ["max / +", "Sum takes the maximum, Product the sum of the children's degrees"], ["Visitor or recursion", "both are fine; Visitor if more operations are expected than node kinds"]])}
      ${why("What the task trains", "<p>Recognising a recursive structure in a domain (an expression grammar) and the classic trade-off of lecture 2: object recursion makes new node kinds cheap and new operations expensive, Visitor the other way round. The question in (b) is the usual exam question about a minimal design: name the classes and justify why none can be dropped without losing the pattern.</p>")}`)}

    ${task("2", 0, "Secant method for polynomials", `
      <p>The secant method finds a zero of a function numerically and evaluates it at a new x in every step. (a) What is the Interpreter pattern: its intent and its structure? (b) Design evaluate(double x) in the Polynomial class of task 1 with Interpreter, in pseudocode or words. (c) Optional: implement the secant method and test the class and evaluate. (d) The class is to be extended to trigonometric functions (sine, cosine, tangent) of polynomials: which pattern fits, and how is it used?</p>
      <h3>a) Interpreter</h3>
      <p><b>Intent</b> (GoF): for a simple language, represent its grammar as classes, one per rule, and interpret sentences by evaluating their syntax tree. It fits when sentences are evaluated often and the grammar is small and stable: expressions, queries, rules. <b>Structure</b>: an abstract expression with interpret(context); terminal expressions for the grammar's tokens; nonterminal expressions holding their sub-expressions and combining their results; a context with the global input (here the value of x); a client that builds the tree (by hand or with a parser) and calls interpret on its root. Structurally it is Composite plus one recursive operation, which is why the polynomial classes of task 1 already are an interpreter for the grammar p ::= c | x | p + p | p − p | p · p.</p>
      ${chart("polyInterp", leg([[3, "client"], [1, "abstract expression"], [4, "terminals"], [2, "nonterminals, decorator"]]))}<figcaption>Our class diagram for 2a and 2d: the Interpreter roles on the polynomial classes, with the trigonometric functions as one decorating node kind.</figcaption></figure>
      <h3>b) evaluate(double x)</h3>
      <div class="formula">Constant.evaluate(ctx) = value<br>Variable.evaluate(ctx) = ctx.x<br>Sum.evaluate(ctx) = left.evaluate(ctx) ± right.evaluate(ctx) &nbsp;(− if the sign flag is set)<br>Product.evaluate(ctx) = left.evaluate(ctx) · right.evaluate(ctx)<br>Polynomial.evaluate(x) = root.evaluate(new Context(x))</div>
      <p>One pass over the tree, one multiplication or addition per inner node. Example: (x − 2x²)(2 + 4x) at x = 1 is (1 − 2)(2 + 4) = −6.</p>
      <h3>c) The secant method (optional)</h3>
      <p>From two start values the method replaces the function by the straight line through (x<sub>n−1</sub>, p(x<sub>n−1</sub>)) and (x<sub>n</sub>, p(x<sub>n</sub>)) and takes its zero as the next point; it needs only evaluate(), no derivative:</p>
      <div class="formula">x<sub>n+1</sub> = x<sub>n</sub> − p(x<sub>n</sub>) · (x<sub>n</sub> − x<sub>n−1</sub>) / (p(x<sub>n</sub>) − p(x<sub>n−1</sub>)) &nbsp;&nbsp; stop when |p(x<sub>n</sub>)| &lt; ε</div>
      <p>For (x − 2x²)(2 + 4x) the zeros are 0, ½ and −½. Starting at 0.4 and 0.6 the iterates reach ½ to nine digits in seven steps; from 0.2 and 0.8 the first secants overshoot (one lands at 1.73) and it takes twelve. The explorer above runs it on whatever you type. Convergence is superlinear (order about 1.62) near a simple zero, and the method fails where the secant is flat (p(x<sub>n</sub>) = p(x<sub>n−1</sub>)), which a test should cover.</p>
      <h3>d) sin, cos, tan of polynomials</h3>
      <p>A sine of a polynomial is again an expression that can be evaluated, so the extension is one new node kind with one child: <b>Function</b> (or Sine, Cosine, Tangent) holding an inner Expression and evaluating to f(inner.evaluate(ctx)). It has the same interface as what it wraps and adds behaviour around the inner call, which is the <b>Decorator</b> pattern on the Composite; in Interpreter terms it is one new nonterminal rule p ::= sin(p) | cos(p) | tan(p). No existing class changes. What does change is every operation that is only defined for polynomials: degree() has no meaning for sin(x²), so Function.degree() must throw or the type hierarchy must distinguish polynomial expressions from general ones, and with the Visitor variant of task 1 every visitor needs a new visitFunction method, the price of Visitor named in 1c.</p>
      ${ans([["Composite + interpret()", "Interpreter is a Composite with one recursive evaluation"], ["sin(p(x))", "the trigonometric node: f(inner.evaluate(x)), a Decorator of an Expression"], ["≈ 1.62", "order of convergence of the secant method at a simple zero"]])}
      ${why("What the task trains", "<p>Seeing Composite, Interpreter, Visitor and Decorator as variations of one object tree: what differs is whether the operation lives in the nodes (Interpreter), outside them (Visitor) or in a wrapping node (Decorator). The secant method is the client that shows why evaluate must be cheap: it is called once per step.</p>")}`)}

    ${task("3", 0, "Chained Observer", `
      <p>Three agents A, B and C in a chained Observer: A observes B and B observes C. (a) Draw a sequence diagram for C notifying its observers. (b) Now C also observes A: which problem occurs, and how can it be fixed? (c) Draw a sequence diagram of the solution. (d) Does the solution apply the Mediator pattern?</p>
      <h3>a) The chain</h3>
      ${chart("obsChain", leg([[1, "subject only"], [2, "observer (and subject)"]]))}<figcaption>Our sequence diagram for 3a in the pull variant: an update only says "something changed", the observer asks its subject for the state. B is observer of C and subject for A at the same time, which is what makes the chain.</figcaption></figure>
      <h3>b) The cycle</h3>
      <p>With C observing A the dependency graph is the cycle C → B → A → C. Every update makes the observer recompute and notify its own observers, so C's change reaches A, A's notification reaches C, C notifies B again, and the calls nest without end: an infinite update loop that ends in a stack overflow (or, with asynchronous events, a flood that never settles). Even where it terminates, observers may see inconsistent intermediate states and be updated several times per change.</p>
      ${chart("obsCycle")}<figcaption>The cycle drawn for three rounds: nothing in the plain Observer protocol stops it.</figcaption></figure>
      <p>Fixes, from local to structural: (1) <b>notify only on a real change</b>: an observer compares the new state with the old one and only notifies if it differs; this terminates when the values reach a fixed point (copying a value), but not when every update changes the value again (incrementing a counter). (2) A <b>re-entrance guard</b>: a flag "I am notifying" that ignores updates arriving during one's own notification. (3) A <b>change manager</b> (GOF's ChangeManager in the Observer chapter) that owns the subject–observer relation, runs each change as one round, and updates every object at most once per round, in a consistent order.</p>
      ${lab("obs", "the Observer cycle under three strategies")}
      <h3>c) The solution</h3>
      ${chart("obsCM", leg([[1, "subject C"], [3, "change manager"], [2, "observers"]]))}<figcaption>Our sequence diagram for 3c: changes are reported to the manager instead of being pushed along the chain; the manager marks every object it has updated in the current round and skips C when A's change comes back to it.</figcaption></figure>
      <h3>d) Mediator?</h3>
      <p>With the change manager: <b>yes</b>. The objects no longer call each other; they only talk to the manager, which encapsulates how they interact (who is updated, in which order, how often). That is Mediator's intent, and GOF name the ChangeManager explicitly as an instance of Mediator. With fix (1) or (2) alone: no, the objects still notify each other directly and only guard themselves.</p>
      ${ans([["C → B → A → C", "the cycle of 3b: an endless update loop"], ["≤ 1 update per round", "what the change manager guarantees"], ["yes, Mediator", "the ChangeManager encapsulates the subject–observer interaction"]])}
      ${why("What the task trains", "<p>Observer's known liabilities (unexpected update cascades, cycles, update order) and the step from a pattern that couples objects directly to one that routes their interaction through a third object. The sequence diagram is the exam's way of asking for the protocol: who calls whom, and in which order.</p>")}`)}

    <h2>Before the session</h2>
    <ul>
      <li>Draw the Composite of 1a and the two sequence diagrams of task 3 by hand; the class names are free, the roles are not.</li>
      <li>Reread the Visitor part of <a href="design-patterns/lecture.html?n=2">lecture 2</a> (slides 47–59) and MVC with Observer and Composite in <a href="design-patterns/lecture.html?n=1">lecture 1</a> (slides 18–20); lecture 4 on 10 Nov brings the extensibility patterns themselves.</li>
      <li>Open questions for the session: whether 1b expects five classes (with a sign flag) or six (with a Difference class); whether 2d is meant as Decorator or as one more Interpreter rule; whether the chair counts the pull or the push variant as the standard Observer in 3a.</li>
    </ul>`;

// Task 2b, worked example: a two-day trip under our assumptions.
const TRIP = { drive: 800, perDay: 480, meal: 240, mealLen: 60, start: 8 * 60, sight: 120 };
function tripPlan(T) {
  const days = []; let left = T.drive, d = 0;
  while (left > 0) {
    const segs = []; let t = T.start, today = Math.min(T.perDay, left), driven = 0;
    if (d > 0 && T.sight) { segs.push(["sight", t, T.sight]); t += T.sight; }
    while (driven < today) { const leg = Math.min(T.meal, today - driven); segs.push(["drive", t, leg]); t += leg; driven += leg; if (driven < today) { segs.push(["meal", t, T.mealLen]); t += T.mealLen; } }
    left -= today; if (left > 0) segs.push(["hotel", t, 20 * 60 - t]);
    days.push(segs); d++;
  }
  return days;
}

function exercise4() {
  return `${head(e)}
    <p class="lead">The fourth sheet practises the glue patterns of <a href="design-patterns/lecture.html?n=5">lecture 5</a>. Two route services with incompatible interfaces are adapted to one interface of our own and then queried together. A travel planner hides five services behind one facade and keeps several planned trips with Memento. The last task looks back at all patterns so far and asks how they are related. There is no official solution yet: <b>every answer below is our own</b>. The sheet carries no points.</p>
    <div class="box status"><p style="margin:0"><b>Status:</b> sheet in OPAL since ${fmt(e.published)} (6 pages, three tasks); session on ${fmt(e.date)}, ${exe.start}, ${esc(exe.room)}. Task 3 is optional homework for in-person attendants. DSE students submit 3a and 3b; 3c is optional for everyone but recommended for the exam.</p></div>

    ${task("1", 0, "Adapting maps and routes", `
      <p>Our application wants the fastest car route between two places from several map providers, through one interface of its own: <code>FastestRouteProvider</code> with <code>getFastestRoute(from, to): Route</code> and <code>buyTollTicket(route, creditCardInfo): String</code>. A Route only carries its time in minutes, a Coordinate is an x/y pair of doubles. The ticket method buys a toll ticket for a route if one is needed and the user agrees in a prompt, and returns a token or throws an exception. (a) Adapt the <b>Revenant Framework</b>, which works offline on a local map database. (b) Adapt the small <b>Network Maps</b> library, which asks a remote server. For both: class or object adapter, why, a class diagram, and how the adapter works. (c) Combine both adapters so that users can query both subsystems transparently.</p>
      <h3>a) Revenant Framework: only an object adapter works</h3>
      <p>The framework's three classes are all <b>final</b>, and the map component's constructor is protected and needs the maps database. The component is obtained from <code>RevenantFramework.getInitializedMappingComponent()</code>. A <b>class adapter</b> would have to inherit from RevenantMapComponent, which a final class forbids. Java has no multiple class inheritance either, so the slide 18 variant would only work if it could extend the component and implement the interface. That leaves the <b>object adapter</b>: a class <code>RevenantRouteAdapter implements FastestRouteProvider</code> that creates the framework once (port, user, password from the configuration), keeps the map component and delegates to it.</p>
      ${chart("revenant", AROLES)}<figcaption>Our class diagram for 1a. The note shows the two methods; Location and Coordinate both have x and y, so <code>loc(c)</code> is a field-by-field copy.</figcaption></figure>
      <p>The adapter does more than rename methods. It bridges four mismatches of the kinds lecture 5 lists (slides 8–10 and 16):</p>
      <ul>
        <li><b>Data format</b>: Coordinate becomes Location; the driving time comes in hours and must become whole minutes.</li>
        <li><b>Data model</b>: our Route is just a time, while Revenant works on a <code>List&lt;Location&gt;</code>. Buying a ticket later needs that list again, so the adapter keeps a map from each Route it returned to its locations. An alternative is a subclass <code>RevenantRoute extends Route</code> that carries the list, if Route is not final.</li>
        <li><b>Protocol</b>: our interface asks the user before buying. Revenant just buys, so the prompt happens in the adapter (through a callback to the UI) before <code>purchaseTollToken</code>.</li>
        <li><b>Errors</b>: Revenant throws its own exception when a purchase fails; the adapter catches it and throws the exception type our interface declares, so callers never see a Revenant type.</li>
      </ul>
      ${ex("Worked example: one call through the Revenant adapter", `<p>Our numbers. <code>getFastestRoute((13.73, 51.05), (12.37, 51.34))</code>: the two Coordinates become <code>Location(13.73, 51.05)</code> and <code>Location(12.37, 51.34)</code>. The component returns a list of, say, 37 locations, and <code>computeTimeForRouteDrivingInHours</code> gives 1.35 h. 1.35 × 60 = <b>81 min</b>, so the client gets <code>Route(81)</code>, and the adapter stores Route(81) → the 37 locations. Later <code>buyTollTicket(route, cc)</code>: the user is asked; on yes the adapter calls <code>purchaseTollToken(list, cc)</code> and returns its token string.</p>`)}
      <h3>b) Network Maps: both are possible; we take the object adapter</h3>
      <p>NetworkMaps is an ordinary public class, not final, and our target is an <b>interface</b>. So a <b>class adapter</b> is possible in Java: <code>class NetworkMapsRouteAdapter extends NetworkMaps implements FastestRouteProvider</code>, one object, the inherited methods called on <code>this</code>. An <b>object adapter</b> works as well. The case for the object adapter: the class adapter would also expose <code>computeRoutes</code> and <code>buyTollTicketForRoute</code> to every client that holds the adapter; it is fixed to NetworkMaps at compile time, so a subclass or a test double cannot be swapped in; and NetworkMaps' constructor, which we do not know, would become part of ours. Either answer counts if it is justified; we use the object adapter, as in 1a, which also makes 1c uniform.</p>
      ${chart("netmaps", AROLES)}<figcaption>Our class diagram for 1b. The library returns a list of routes for several means of transport; the adapter keeps the car routes and picks the fastest.</figcaption></figure>
      <p>The mapping here, in our words. Our Coordinate is split into four doubles, and we have to fix which of x and y is the longitude: an assumption to write down, since a mix-up still compiles and gives nonsense routes. <code>RouteType.FASTEST_ROUTE</code> is chosen. The result list is filtered for <code>DRIVING_BY_CAR</code> and the route with the smallest <code>approximateTimeTakenInMinutes</code> wins; that value is already in minutes and goes into the Route unchanged. For the ticket, the card number is wrapped in a <code>Payment</code> with <code>PaymentMethod.CREDIT_CARD</code>. As in 1a, the adapter remembers which NetworkMapsRoute stands behind which Route. A failed network call is turned into our exception as well.</p>
      ${ans([["object adapter", "1a: forced, the Revenant classes are final"], ["object or class adapter", "1b: both legal (NetworkMaps is not final, the target is an interface); object adapter preferred"], ["Route → original route", "both adapters must remember it, or the ticket cannot be bought"]])}
      <h3>c) Both adapters behind one provider</h3>
      <p>A <code>CombinedRouteProvider</code> that itself <b>implements FastestRouteProvider</b> and holds a list of providers, the two adapters. For the client nothing changes: it still calls one FastestRouteProvider (transparency). <code>getFastestRoute</code> asks every provider, ignores the ones that fail (Network Maps without network) and returns the fastest Route, remembering which provider produced it; <code>buyTollTicket</code> forwards to exactly that provider. Structurally this is Composite in its simplest form: one composite and leaves behind the same interface, a 1:n delegation as in the *-Bridge of lecture 4. In intent it is close to the broker of lecture 5 (slide 29): clients query a service without knowing which one answers. A third provider is one more adapter in the list.</p>
      ${chart("combined", AROLES)}<figcaption>Our class diagram for 1c: the client only knows the interface; the combining provider and both adapters implement it.</figcaption></figure>
      ${lab("agg", "the combined provider, step by step")}
      ${why("Context, not on the sheet: 'shortest' or 'fastest'?", "<p>Task 1c asks for the <i>shortest</i> route, but our interface only knows the fastest one, and a Route only carries time. Revenant could report a distance (<code>computeDistanceForRouteInKilometers</code>), Network Maps cannot. So either 'shortest' means shortest in time, which our design does, or Route gets a distance field that only one adapter can fill. The second is a small data-model mismatch of its own; worth asking in the session which one is meant.</p>")}`)}

    ${task("2", 0, "Managing complexity", `
      <p>The idea of FastestRouteProvider is spread to other domains of a travel planner: interfaces for restaurants near a place and time, sightseeing trips, hikes and hotels with free rooms. Each query returns a <code>PartOfTravel</code> that says how long an activity takes, where and when, and can book it if its provider is a booking provider (restaurants and hotels). (a) The planner should propose combinations of restaurants, sights, hikes and hotels without the client juggling all these APIs: which pattern simplifies access, with its goals and structure? (b) Design the integrated application: ask for the fastest route at a given time and get recommendations for every aspect of the trip, with reasonable assumptions about the user interaction and the trip (for example one hotel per night). (c) Users want to store several planned trips, compare them and book the chosen one: explain intent and structure of Memento.</p>
      <h3>a) Facade</h3>
      <p><b>Goals</b>: one simple, task-oriented interface for a subsystem of many classes; clients depend on one class instead of five services; the subsystem can change behind the facade; layering, so the UI layer does not reach into the service layer. Clients that need the details can still use the services directly. <b>Structure</b>: a Facade class that knows the subsystem classes and delegates each of its operations to several of them in the right order; the subsystem classes do their own work and know nothing of the facade. In lecture 5 (slides 21–23) the Facade is an object adapter that hides a whole set of objects. Unlike an adapter it usually <i>invents</i> its interface (<code>planTrip</code>) instead of matching an existing one.</p>
      <h3>b) The travel planner</h3>
      ${chart("facade4", AROLES)}<figcaption>Our class diagram for 2b. The route service behind the facade is the combined provider of task 1c.</figcaption></figure>
      <p>Our assumptions, as the sheet asks: the user gives start, destination and departure time; at most 8 hours of driving per day; a restaurant stop after every 4 hours of driving, looked up near the position and time reached at that point; one hotel per night near the day's end point; on every following morning, sightseeing or a hike near the hotel. The facade's <code>planTrip</code> asks the route provider, cuts the route into days and stops, and asks the matching provider at each stop for the top three proposals. The UI shows them; the user picks one per stop (<code>choose</code>); since a chosen restaurant or hotel can lie off the route, the facade recomputes the route through the chosen stops. <code>book(cc)</code> calls <code>bookActivity</code> on every part whose provider books.</p>
      ${chart("trip", leg(Object.values(TK).map(([s, n]) => [s, n])))}<figcaption>Worked example under our assumptions: 800 minutes of driving, at most 480 per day, a meal after every 240 minutes, departure at 8:00 both days.</figcaption></figure>
      ${tbl(["Day", "From", "To", "What"], tripPlan(TRIP).flatMap((segs, i) => segs.map(([k, s, len]) => [`Day ${i + 1}`, `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`, `${Math.floor((s + len) / 60)}:${String((s + len) % 60).padStart(2, "0")}`, TK[k][1]])))}
      ${ex("Worked example: the calls behind one planTrip", `<p>800 min of driving with at most 480 per day gives 2 days and <b>1 hotel night</b>. Day 1: 240 min, a meal, 240 min, arrival at 17:00: one <code>getRestaurants</code> call near the 240-minute point around 12:00, one <code>getHotels</code> call near the day's end for that night. Day 2: <code>getSightseeingObjects</code> (or <code>getHikingTrips</code>) near the hotel at 8:00, then 240 min, a meal (another <code>getRestaurants</code>), 80 min, arrival at 16:20. In total 1 route call, 2 restaurant calls, 1 hotel call and 1 sightseeing call, each returning three proposals. Without the facade the UI would make these five calls itself and also know the cutting rules; with it, the UI makes <b>one</b> call.</p>`)}
      <h3>c) Memento</h3>
      <p><b>Intent</b> (GOF): capture and externalise an object's internal state, without violating its encapsulation, so that the object can be restored to that state later. <b>Structure</b>: the <b>Originator</b> creates a memento of its current state (<code>save()</code>) and can restore itself from one (<code>restore(m)</code>). The <b>Memento</b> stores the state and offers a wide interface to the originator only, a narrow one (or none) to everybody else. The <b>Caretaker</b> keeps mementos and never looks inside. Here the trip planner is the originator, a TripMemento holds one planned trip (route, chosen parts, times), and SavedTrips is the caretaker. To compare, the caretaker may only use the narrow interface, so the memento offers a summary (total time, price) and nothing more; for booking, the planner restores the chosen memento and books its parts.</p>
      ${chart("memento", leg([[1, "originator"], [4, "memento"], [2, "caretaker"], [3, "client (UI)"]]))}<figcaption>Our class diagram for 2c. The dashed arrow: the planner creates mementos and reads them back; only it sees their state.</figcaption></figure>
      ${why("What the task trains", "<p>The difference between Adapter and Facade (match an existing interface versus invent a simpler one), and the habit of writing assumptions down before designing, which the sheet asks for explicitly. Memento is not in the lecture; it is a GOF pattern with a tension worth being able to explain: the caretaker must keep and compare snapshots without breaking the originator's encapsulation, hence the narrow summary interface.</p>")}`)}

    ${task("3", 0, "Relations between patterns", `
      <p>(a) Compare the extensibility patterns Decorator, Composite, Observer and Chain of Responsibility: which mechanism makes them extensible, and how do they relate to TemplateClass and ObjectRecursion? (b) Compare the glue patterns Adapter, Facade and Mediator: how do they address architectural mismatch, and how do they relate to the variability and extensibility patterns? (c) Sketch a chart of the relations between sixteen patterns of the course, with arrows for specialisation (by class structure, behaviour or intent) and helper concepts where a shared idea has no pattern name yet.</p>
      <h3>a) Extensibility</h3>
      <p>The mechanism is a <b>hook object whose type is the template's own supertype</b>. A class both inherits from and holds a reference to the common superclass (ObjectRecursion, lecture 4 slide 9). New behaviour comes from adding objects at run time, not from changing classes. All four are TemplateClass at heart (a template method calling a hook object); they differ in what the hook is and how many there are.</p>
      <ul class="cmp">
        <li><b>Decorator</b><span class="v">1-ObjectRecursion: one wrapped object of the same type, ending in a core; adds behaviour before or after the forwarded call</span></li>
        <li><b>Composite</b><span class="v">n-ObjectRecursion: any number of children of the same type; operations fold over the tree</span></li>
        <li><b>Chain</b><span class="v">1-ObjectRecursion through the successor link; the request goes on until someone handles it, no core needed</span></li>
        <li><b>Observer</b><span class="v">not recursive: a *-Bridge from the subject to observers of a separate hierarchy; extended by registering more observers</span></li>
      </ul>
      <h3>b) Glue</h3>
      <p>All three put one more object between parts that do not fit, so that neither part has to change. <b>Adapter</b> maps one interface (or protocol, or data format) to another for one object: a Proxy with a different interface. <b>Facade</b> hides a whole subsystem behind one new interface: an object adapter for many objects. <b>Mediator</b> takes over the communication of n partners, which only know the mediator: an n-way Proxy plus a Bridge (lecture 5, slides 16, 22, 25). Like the variability patterns they are built on delegation to a hook object (TemplateClass and Objectifier). The extensibility patterns can serve as glue too: Decorator and Proxy for data mismatch, Chain as a filter, Observer to listen in (lecture 5, slide 14).</p>
      <h3>c) The map</h3>
      ${chart("relmap", leg([[1, RFAM[1]], [2, RFAM[2]], [3, RFAM[3]], ["g", RFAM.x, "dash"]]))}<figcaption>Our answer for 3c, built from the statements of lectures 2, 4 and 5. Hover or focus a pattern for the relation and where the course says so. The narrow form is a tree; a second parent is named next to the box.</figcaption></figure>
      ${why("What the task trains", "<p>The sheet calls 3c highly recommended for the exam, and the <a href=\"design-patterns/exam.html\">mock exam</a> has cross-cutting questions of the same kind. What it trains: not the sixteen diagrams one by one, but the few ideas they are built from. Template and hook, a hook object, recursion on the hook's type, 1:n hooks, and delegation to a sister. Being able to derive Facade from Adapter from Proxy from TemplateClass in four sentences is worth more than memorising any single structure.</p>")}`)}

    <h2>Before the session</h2>
    <ul>
      <li>Draw the two adapters of task 1 by hand and decide which of x and y is the longitude; reread slides 15–23 of <a href="design-patterns/lecture.html?n=5">lecture 5</a> (Adapter, Facade).</li>
      <li>Write down your own assumptions for 2b before reading ours; the sheet asks for assumptions, so the reasoning counts more than one right design.</li>
      <li>Open questions for the session: whether 1c's "shortest" means shortest in time; whether the combined provider of 1c is meant as Composite, Mediator or Facade; whether the user prompt of <code>buyTollTicket</code> belongs into the adapter or into the client.</li>
    </ul>`;
}
