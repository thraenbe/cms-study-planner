function lecture3() {
  return `${head(l)}
    <p class="lead">The second arithmetic lecture goes from adding two numbers to adding many, which is what a multiplier does: carry-save addition, the bit-product matrix, Wallace and Dadda reduction trees, signed and multiply-accumulate variants, sequential multiplication, and finally division by restoring steps or by Newton's method. Five charts and six explorers; written from the chair's 2022/23 deck (28 pages in the file; the footer counts to 31, slides 28 to 30 are missing, which is where the deck 4 list says division continues).</p>
    <p class="muted">Slides 3–5 recap the end of lecture 2 (number representations, addition and subtraction) before the new material starts; the structure of all three arithmetic lectures is representations → add/subtract → multiply → divide.</p>

    <h2>Adding multiple operands</h2>
    <h3>The naive way and why it is slow (slide 3)</h3>
    <ul>
      <li><b>Chain of adders.</b> a<sub>1</sub> + a<sub>2</sub> + a<sub>3</sub> is computed as (a<sub>1</sub> + a<sub>2</sub>) + a<sub>3</sub> with two ordinary adders. With ripple-carry adders the first sum costs about n carry delays and the second only one more, because the carry path of the second adder runs one carry delay behind the first: its bit i is ready as soon as the first adder's bit i is. For m operands that is about n + m carry delays.</li>
      <li><b>Lookahead does not help as much as expected.</b> A carry-lookahead adder needs about log<sub>2</sub> n carry delays for most bits, but the second adder cannot start before the first is done, so two stages cost 2·log<sub>2</sub> n and m operands cost about m·log<sub>2</sub> n. The chain of fast adders grows linearly in m.</li>
    </ul>
    <h3>Carry-save addition (slides 4–5)</h3>
    <ul>
      <li><b>Idea.</b> Addition is associative and commutative, so the bits may be summed in any order. Add the three bits of the same position with one full adder: a<sub>1,i</sub> + a<sub>2,i</sub> + a<sub>3,i</sub> = 2·c<sub>i</sub> + s<sub>i</sub>. All n full adders work in parallel, nothing ripples, and after a single full-adder delay the three operands have become two: the sum word s and the carry word c shifted one position left.</li>
      <li><b>Generalisation.</b> For m operands, form groups of three, reduce every group to two numbers in one full-adder delay, and repeat until two numbers remain. Each stage removes about a third of the operands. The last pair is in carry-save form; one fast adder (carry-lookahead) turns it into the result.</li>
      <li><b>Accumulators.</b> If very many numbers are summed over many cycles, the running total can stay in carry-save form (two words) and is only resolved into one number in the last cycle: one full-adder delay per cycle instead of a whole carry chain.</li>
    </ul>
    ${lab("csa", "carry-save addition of three numbers")}
    <p class="muted">Click the bits of a<sub>1</sub>, a<sub>2</sub>, a<sub>3</sub>. Every column is one full adder: its sum bit stays in the column, its carry bit moves one column left. The carries never travel further than that, so stage 1 is exactly one full-adder delay for any width.</p>
    ${chart("multi", leg([[1, "Chain of ripple-carry adders"], [2, "Chain of lookahead adders"], [3, "Carry-save tree + one lookahead adder"]]))}
      <figcaption>Carry delays to add m operands of 16 bits. The ripple chain costs 16 + (m − 2), the lookahead chain (m − 1)·4, and the carry-save tree one full-adder delay per reduction stage (Dadda's sequence, below) plus one final 4-level lookahead add. The slides round the first two to n + m and m·log<sub>2</sub> n. Hover a column to read all three.</figcaption>
    </figure>
    <details class="tbl"><summary>Table view</summary><table><tr><th>Operands</th><th>Ripple chain</th><th>Lookahead chain</th><th>Carry-save tree</th></tr>${MULTI.map(d => `<tr><td class="n">${d.m}</td><td class="n">${d.rc}</td><td class="n">${d.cla}</td><td class="n">${d.csa}</td></tr>`).join("")}</table></details>
    <div class="ex"><div class="kicker">Worked example: 11 + 7 + 13 in carry-save form</div>
      <p>Column by column (LSB first): 1+1+1 = 11<sub>2</sub> → s = 1, c = 1; 1+1+0 = 10<sub>2</sub> → s = 0, c = 1; 0+1+1 = 10<sub>2</sub> → s = 0, c = 1; 1+0+1 = 10<sub>2</sub> → s = 0, c = 1. So s = 0001 = 1 and c = 1111 shifted left = 11110 = 30, and 1 + 30 = 31 = 11 + 7 + 13. Only the final 1 + 30 needs a carry-propagating adder. This is the default setting of the explorer above.</p></div>

    <h2>Multipliers</h2>
    <h3>The multiplication matrix (slides 6–7)</h3>
    <ul>
      <li><b>Bit products.</b> Multiplying out (Σ a<sub>j</sub>2<sup>j</sup>)·(Σ b<sub>k</sub>2<sup>k</sup>) gives Σ<sub>i</sub> 2<sup>i</sup>·Σ<sub>j+k=i</sub> a<sub>j</sub>b<sub>k</sub>: every pair of bits contributes a<sub>j</sub>·b<sub>k</sub> (a single AND gate) at weight 2<sup>j+k</sup>. All n<sup>2</sup> AND gates work at once, so the whole matrix exists after one AND delay.</li>
      <li><b>Shape.</b> Row i is a·b<sub>i</sub>·2<sup>i</sup>, the multiplicand shifted by i positions, so the matrix is a parallelogram: columns in the middle hold up to n bits, the outer columns only one. The product has 2n bits.</li>
      <li><b>Reduction.</b> The matrix is just a multi-operand addition with a particular shape, so the carry-save idea applies, with the columns of different height taken into account.</li>
    </ul>
    ${lab("mmx", "4 × 4 bit-product matrix, unsigned or two's complement")}
    <p class="muted">Cells show which bit product sits at which weight (orange ones are inverted in the signed form, green ones are the two constant 1s). Switch to two's complement and try a = 1101 (−3) × b = 0101 (5): the same matrix shape, only the sign-row and sign-column products are inverted and two 1s added, and it sums to −15 in 8-bit two's complement.</p>

    <h3>Wallace tree (slide 8)</h3>
    <ul>
      <li>Reduce the matrix in stages, column by column: wherever a column holds three bits, a full adder turns them into one sum bit in the same column and one carry bit in the next; if two bits remain (or a carry would make a third), a half adder does the same; a single leftover bit is passed to the next stage untouched.</li>
      <li>Repeat until no column holds more than two bits, then a fast adder sums the two remaining rows. "Tree" because a tree of half and full adders leads to every bit of the final two rows.</li>
      <li>The greedy rule reduces as much as possible in every stage, which costs more adders than necessary, especially half adders.</li>
    </ul>
    <h3>Dadda tree (slides 9–12)</h3>
    <ul>
      <li><b>Goal.</b> Minimise the number of full and half adders. The trick is to reduce no further than needed: fix a target height per stage and only use adders where a column exceeds it.</li>
      <li><b>Target heights.</b> The final adder takes 2 bits per column. A full adder reduces 3 to 2, so a stage that ends at n<sub>k</sub> bits may start from n<sub>k−1</sub> = ⌊3n<sub>k</sub>/2⌋: the sequence 2, 3, 4, 6, 9, 13, 19, 28, 42, 63, 94, … Start from the smallest entry that is at least the tallest column, and in every stage reduce each column exactly to the next target with full adders and at most one half adder.</li>
      <li><b>Example 6 × 6</b> (slide 11). Tallest column 6, so the targets are 6 → 4 → 3 → 2: three stages with 15 full adders and 5 half adders; the Wallace tree takes 17 and 9. The price is a slightly wider final adder, which needs about 2.5 more inputs, the equivalent of two full adders and one half adder.</li>
      <li><b>Complexity</b> (slide 12). The number of stages grows with log<sub>1.5</sub> of the column height, so the delay is logarithmic in the operand width, and so is the final adder if it is a carry-lookahead type. The area of the reduction stages is minimal (no redundant operations); the final adder decides between small (ripple-carry) and fast (lookahead).</li>
    </ul>
    ${lab("dadda", "Dadda reduction of an n × n matrix")}
    <p class="muted">Each band is one stage: blue dots are bits still above the target, green columns already fit. The counting rule is the slide's (full adders freely, at most one half adder per column and stage); for 6 × 6 it reproduces the 15 + 5 of slide 11.</p>
    ${chart("cost", leg([[1, "Wallace tree"], [2, "Dadda tree"]]))}
      <figcaption>Adders in the reduction of a 6 × 6 multiplier, from slide 11. Dadda saves two full adders and four half adders and pays with a final adder that is about 2.5 inputs wider.</figcaption>
    </figure>
    ${chart("dadda", leg([[1, "n × n multiplier"], [2, "n-bit multiply-accumulate (one more row)"]]))}
      <figcaption>Reduction stages versus the tallest column of the matrix. The staircase is Dadda's sequence: every step at 3, 4, 6, 9, 13, 19, 28, 42, 63, 94 adds one stage. The multiply-accumulate markers (one bit taller) sit on the same step as the plain multiplier for 8, 16, 32 and 64 bits.</figcaption>
    </figure>
    <details class="tbl"><summary>Table view</summary><table><tr><th>Tallest column</th><th>Stages</th><th>Tallest column</th><th>Stages</th></tr>${[8, 9, 16, 17, 32, 33, 64, 65].reduce((acc, h, i, a) => i % 2 ? acc : [...acc, [h, a[i + 1]]], []).map(([h1, h2]) => `<tr><td class="n">${h1}</td><td class="n">${stagesFor(h1)}</td><td class="n">${h2}</td><td class="n">${stagesFor(h2)}</td></tr>`).join("")}</table></details>
    <div class="why"><div class="kicker">Context, not on the slides: why reduce "as little as possible"</div>
      <p>Every adder in a reduction tree costs area and switching energy, but the delay is set by the number of stages, not by how much each stage reduces. Dadda's observation is that the heights 2, 3, 4, 6, 9, … are the latest moments at which a column may still be brought down to 2 in time, so reducing a column earlier than that wastes adders without saving a stage. The slide's 6 × 6 numbers are small, but in a 64 × 64 multiplier the difference is hundreds of cells.</p></div>

    <h3>Signed multiplication (slides 13–15)</h3>
    <ul>
      <li><b>Expand the two's-complement values.</b> With a = −a<sub>n−1</sub>2<sup>n−1</sup> + Σ a<sub>i</sub>2<sup>i</sup> and the same for b, the product has four parts: a<sub>n−1</sub>b<sub>n−1</sub>2<sup>2n−2</sup> (positive), the unsigned (n−1) × (n−1) matrix of the lower bits (positive), and two negative sums −Σ a<sub>n−1</sub>b<sub>i</sub>2<sup>i+n−1</sup> and −Σ b<sub>n−1</sub>a<sub>i</sub>2<sup>i+n−1</sup>.</li>
      <li><b>Rearranged matrix</b> (slide 14). A subtracted bit −p·2<sup>w</sup> equals (1 − p)·2<sup>w</sup> − 2<sup>w</sup>, so the negative terms become inverted bit products plus a constant. Summing the constants modulo 2<sup>2n</sup> leaves a single 1 at weight 2<sup>n</sup> and a single 1 at weight 2<sup>2n−1</sup>. The result is a matrix of the same height as the unsigned one, which the Wallace or Dadda reduction handles unchanged.</li>
      <li><b>Notes</b> (slide 15). Complexity is the same as unsigned. The literature has other, equivalent rearrangements. A combined signed/unsigned multiplier extends both operands by one bit (a 0 for unsigned, a copy of the sign bit for signed) and always multiplies signed.</li>
    </ul>
    <div class="formula">a·b = a<sub>n−1</sub>b<sub>n−1</sub>2<sup>2n−2</sup> − Σ<sub>i=0…n−2</sub> a<sub>n−1</sub>b<sub>i</sub>2<sup>i+n−1</sup> − Σ<sub>i=0…n−2</sub> b<sub>n−1</sub>a<sub>i</sub>2<sup>i+n−1</sup> + Σ<sub>i=0…2n−4</sub> 2<sup>i</sup> Σ<sub>j+k=i, j,k≤n−2</sub> a<sub>j</sub>b<sub>k</sub></div>
    <div class="ex"><div class="kicker">Worked example: −3 × 5 in 4 bits through the rearranged matrix</div>
      <p>a = 1101 (−3), b = 0101 (5). The nine products of the low three bits of each are the plain unsigned part: 101 × 101 = 25. The products with the sign bit of a (a<sub>3</sub>b<sub>0</sub>, a<sub>3</sub>b<sub>1</sub>, a<sub>3</sub>b<sub>2</sub> at weights 8, 16, 32) are 1, 0, 1 and appear inverted: 0, 1, 0 → 16. The products with b<sub>3</sub> = 0 are all 0 and appear inverted as 1, 1, 1 at weights 8, 16, 32 → 56. a<sub>3</sub>b<sub>3</sub> = 0 at weight 64. The constants add 16 + 128 = 144. Total 25 + 16 + 56 + 0 + 144 = 241 = 11110001<sub>2</sub>, which in 8-bit two's complement is 241 − 256 = −15. Select "two's complement" in the matrix explorer and set these bits to see each cell.</p></div>

    <h3>Multiply-accumulate (slides 16–17)</h3>
    <ul>
      <li><b>Why.</b> Sums of products Σ a<sub>i</sub>b<sub>i</sub> are everywhere: FIR and IIR filters, matrix multiplication (every element c<sub>ij</sub> = Σ<sub>k</sub> a<sub>ik</sub>b<sub>kj</sub>, which is the fully-connected layer of a neural network and also every coordinate transformation), and 2-D convolution in convolutional networks. An instruction that computes a + b·c in one cycle gives software a large speedup.</li>
      <li><b>How.</b> Put the extra summand into the matrix as one more row and reduce as before. Dadda's sequence has gaps: 9 ≥ 8 + 1, 19 ≥ 16 + 1, 42 ≥ 32 + 1, 94 ≥ 64 + 1, so an 8-, 16-, 32- or 64-bit multiply-accumulate needs no extra stage. The area overhead is comparable to one ripple-carry adder, the delay overhead is roughly zero (chart above).</li>
    </ul>
    <div class="why"><div class="kicker">Context, not on the slides: where this course goes with it</div>
      <p>The multiply-accumulate unit is the atom of every AI accelerator: a systolic array or a GPU tensor core is a grid of them, and their energy per operation (a few picojoules in current nodes) sets the energy of inference. Lecture 14 on hardware for deep neural networks picks this up; the exercise sheets of the chair count adders and delays exactly as on slides 11 and 17.</p></div>

    <h3>Sequential multiplication (slides 18–19)</h3>
    <ul>
      <li><b>One row per cycle.</b> Instead of building the whole tree, sum the matrix over several clock cycles: add one matrix row (a·b<sub>i</sub>) to the intermediate result and shift the window of the result by one position. An n-bit adder suffices (the ALU's adder can be reused); strictly n − 1 additions are needed, but the implementation starts from 0 and runs n identical iterations.</li>
      <li><b>Unrolling.</b> Several rows per step is possible. The design space (slide 19): a single carry-propagate adder reused every cycle gives homogeneous steps suited to iterative multi-cycle multiplication; a mix of carry-save stages and one final carry-propagate adder gives heterogeneous steps suited to pipelining, where every stage works on a different multiplication at the same time.</li>
    </ul>
    ${lab("seq", "shift-and-add multiplication, one cycle per row")}
    <div class="tiles">
      <div class="tile"><div class="v">1 FA</div><div class="l">delay to reduce three operands to two in carry-save form</div></div>
      <div class="tile"><div class="v">15 + 5</div><div class="l">full and half adders of a 6 × 6 Dadda tree (Wallace: 17 + 9)</div></div>
      <div class="tile"><div class="v">10</div><div class="l">Dadda stages for a 64 × 64 multiplier, with or without accumulate</div></div>
      <div class="tile"><div class="v">n</div><div class="l">cycles of a sequential n-bit multiplier on one adder</div></div>
    </div>

    <h2>Division</h2>
    <h3>Definition (slide 20)</h3>
    <ul>
      <li>Division reverses multiplication: x = q·d + rem with dividend x, divisor d, quotient q and remainder rem, where |rem| &lt; |d|·ulp and the remainder takes the sign of the dividend. The unit in the last position ulp is 1 for an integer quotient and r<sup>−n</sup> for an n-digit fractional quotient in radix r.</li>
      <li>Examples: 1000 / 7 = 142 remainder 6 (1000 = 142·7 + 6); 446.6 / 5.5 = 81 remainder 1.1. The lecture focuses on unsigned integer division.</li>
    </ul>
    <h3>Slow and fast algorithms (slide 21)</h3>
    <ul class="cmp" aria-label="Slow versus fast division">
      <li><b>Digits per step</b><span class="v"><span class="sw t"></span>Slow: a fixed number of quotient digits per iteration</span><span class="v"><span class="sw v"></span>Fast: start from a close approximation and double the correct digits every iteration</span></li>
      <li><b>Algorithms</b><span class="v"><span class="sw t"></span>Restoring division; non-restoring division, e.g. the SRT algorithm</span><span class="v"><span class="sw v"></span>Newton-Raphson division; Goldschmidt division</span></li>
      <li><b>Hardware</b><span class="v"><span class="sw t"></span>One subtractor, one shift register, n cycles</span><span class="v"><span class="sw v"></span>Multipliers (or MAC units) reused per iteration, a few iterations</span></li>
    </ul>
    <h3>Restoring division (slides 22–24)</h3>
    <ul>
      <li><b>Algorithm.</b> Used for fixed-point numbers, n cycles for n-bit numbers, written for any base B but practical only for B = 2 (for B &gt; 2 the "how many times does d fit" loop becomes expensive). Registers hold the partial remainder r and the quotient q; start with r = x and q = 0. In each of the n iterations: shift r left by one digit, subtract B<sup>n</sup>·d while r stays non-negative and count the subtractions k, then restore by adding B<sup>n</sup>·d back once, and append k − 1 as the next quotient digit. At the end q holds the quotient and r the remainder.</li>
      <li><b>Hardware for B = 2</b> (slide 23). A multiplexer loads x into the r register at the start; afterwards the register takes the shifted r each cycle. One subtractor computes r − 2<sup>n</sup>·d; its sign decides, via a second multiplexer, whether the difference or the unchanged r is written back, and the inverted sign is shifted into the q register (one flip-flop per quotient bit). Every iteration maps to one clock cycle.</li>
      <li><b>Optimisation</b> (slide 24). For B = 2 the inner loop runs at most once, so "subtract, test, restore" collapses: compute the difference, and let the sign choose between it and the old value. The adder that restored r is gone and only the multiplexer remains, which is what the right-hand schematic shows.</li>
    </ul>
    ${lab("div", "restoring division, 5-bit registers")}
    <div class="ex"><div class="kicker">Worked example: 27 / 5 in five cycles</div>
      <p>n = 5, so d is aligned at 2<sup>5</sup>·5 = 160 and r starts as 27. Cycle 1: 54 &lt; 160, quotient bit 0. Cycle 2: 108 &lt; 160, bit 0. Cycle 3: 216 ≥ 160, keep 56, bit 1. Cycle 4: 112 &lt; 160, bit 0. Cycle 5: 224 ≥ 160, keep 64, bit 1. q = 00101 = 5, and the upper half of r = 64 is 64/32 = 2: 27 = 5·5 + 2. The explorer above shows the same run bit by bit.</p></div>
    <div class="why"><div class="kicker">Context, not on the slides: non-restoring and SRT</div>
      <p>Non-restoring division goes one step further than slide 24: instead of restoring a negative remainder it keeps it and adds d in the next cycle rather than subtracting, which removes the multiplexer from the critical path; the quotient is corrected at the end. SRT division (named after Sweeney, Robertson and Tocher) chooses quotient digits from a redundant set such as {−1, 0, 1} by looking at only a few leading bits of the remainder, which is what hardware dividers in processors use; a wrong lookup table in this unit was the Pentium FDIV bug of 1994. The 2022 deck lists these under "slow algorithms" and continues the topic in lecture 4.</p></div>

    <h3>Newton-Raphson division (slides 25–27)</h3>
    <ul>
      <li><b>Concept.</b> Compute the reciprocal 1/d with Newton's method and multiply: q = x·(1/d). Choose a function with a zero at X = 1/d, f(X) = 1/X − d; Newton's step X<sub>i+1</sub> = X<sub>i</sub> − f(X<sub>i</sub>)/f′(X<sub>i</sub>) simplifies to X<sub>i+1</sub> = X<sub>i</sub>·(2 − d·X<sub>i</sub>) = X<sub>i</sub> + X<sub>i</sub>·(1 − d·X<sub>i</sub>): only multiplications and a subtraction, or two multiply-accumulate operations.</li>
      <li><b>Quadratic convergence</b> (slide 26). With the error ε<sub>i</sub> = 1 − d·X<sub>i</sub>, one step gives ε<sub>i+1</sub> = (1 − d·X<sub>i</sub>)<sup>2</sup> = ε<sub>i</sub><sup>2</sup>. The error squares every iteration, so the number of correct digits roughly doubles, which is valuable for wide numbers, but the whole thing depends on a good X<sub>0</sub>. The form X<sub>i</sub> + X<sub>i</sub>(1 − dX<sub>i</sub>) is cheaper in precision than X<sub>i</sub>(2 − dX<sub>i</sub>), because 2 − dX<sub>i</sub> must be computed with 2n bits while 1 − dX<sub>i</sub> is small.</li>
      <li><b>Starting value</b> (slide 27). Scale d into 0.5 ≤ d ≤ 1 by shifting (and shift x the same way), then use a straight line X<sub>0</sub> = T<sub>1</sub> + T<sub>2</sub>·d. Minimising the maximum of |ε<sub>0</sub>| = |1 − d(T<sub>1</sub> + T<sub>2</sub>d)| over the interval is a minimax problem: by the equioscillation theorem the error at the two endpoints and at the interior extremum d = −T<sub>1</sub>/(2T<sub>2</sub>) must be equal and opposite, F(½) = F(1) = −F(−T<sub>1</sub>/2T<sub>2</sub>), which has the unique solution T<sub>1</sub> = 48/17, T<sub>2</sub> = −32/17 and |ε<sub>0</sub>| ≤ 1/17 ≈ 0.059. Other coefficients work too, just less well.</li>
    </ul>
    <div class="formula">X<sub>i+1</sub> = X<sub>i</sub>·(2 − d·X<sub>i</sub>) &nbsp;&nbsp;&nbsp; ε<sub>i+1</sub> = ε<sub>i</sub><sup>2</sup> &nbsp;&nbsp;&nbsp; X<sub>0</sub> = 48/17 − 32/17·d &nbsp;for ½ ≤ d ≤ 1, &nbsp;|ε<sub>0</sub>| ≤ 1/17</div>
    ${chart("nr0")}
      <figcaption>Starting error ε<sub>0</sub> = 1 − d·X<sub>0</sub> of the slide-27 line over the scaled divisor. The curve touches +1/17 at d = 0.5 and d = 1 and −1/17 at d = 0.75: three equal extremes with alternating sign, the signature of the best possible straight line. Hover a point for X<sub>0</sub> and 1/d.</figcaption>
    </figure>
    ${chart("conv")}
      <figcaption>Correct bits of the reciprocal after each Newton-Raphson iteration from the worst-case start 1/17 (log<sub>2</sub> 17 ≈ 4.1 bits). Doubling per step: a float32 mantissa (24 bits) is reached after 3 iterations, a double (53 bits) after 4. Each iteration is two multiplications, so a 64-bit divide costs about eight multiplications plus the final x·X<sub>n</sub>.</figcaption>
    </figure>
    <details class="tbl"><summary>Table view</summary><table><tr><th>Iteration</th><th>|ε| at most</th><th>Correct bits</th></tr>${NR_BITS.map(d => `<tr><td class="n">${d.i}</td><td class="n">(1/17)<sup>${2 ** d.i}</sup></td><td class="n">${d.bits.toFixed(1)}</td></tr>`).join("")}</table></details>
    ${lab("nr", "Newton-Raphson reciprocal")}
    <div class="ex"><div class="kicker">Worked example: 1/0.75 by hand</div>
      <p>X<sub>0</sub> = 48/17 − 32/17·0.75 = 48/17 − 24/17 = 24/17 ≈ 1.4118; the true value is 4/3 ≈ 1.3333, and ε<sub>0</sub> = 1 − 0.75·24/17 = 1 − 18/17 = −1/17. First step: X<sub>1</sub> = X<sub>0</sub>(2 − 0.75·X<sub>0</sub>) = 1.4118·(2 − 1.0588) = 1.4118·0.9412 = 1.3287, ε<sub>1</sub> = (1/17)<sup>2</sup> = 1/289 ≈ 0.0035. Second step: X<sub>2</sub> ≈ 1.33333 with ε<sub>2</sub> = 1/83521 ≈ 1.2·10<sup>−5</sup>; third: ε<sub>3</sub> ≈ 1.4·10<sup>−10</sup>. For 1000/7 one would first scale 7 to 0.875 (shift by 3), compute 1/0.875 this way, and multiply by 1000·2<sup>−3</sup>.</p></div>
    <div class="why"><div class="kicker">Context, not on the slides: why the derivation on slide 27 is worth following</div>
      <p>Slide 27 is the only place in the three arithmetic lectures where a design parameter is derived rather than stated, and it is a typical exam-style question: given f(X) = 1/X − d, derive the iteration; given a linear start, show where its error is extreme and why the extremes must alternate. The computation only needs F′(d) = −T<sub>1</sub> − 2T<sub>2</sub>d = 0 and the three equalities, and the "wrong" sign-free answer X<sub>0</sub> = 1 would give |ε<sub>0</sub>| up to 0.5 and need two extra iterations.</p></div>

    <h2>Take-home message (slide 31)</h2>
    <ul>
      <li>Numbers have several digital representations, chosen by use case: unsigned or signed, integer or decimal, fixed or floating point.</li>
      <li>Arithmetic circuits have several implementations, chosen by constraints: combinational, iterative or pipelined; size against speed; power consumption.</li>
      <li>For this lecture specifically: carry-save form postpones the carry chain to the very end; a multiplier is a shaped multi-operand addition whose reduction tree is logarithmic in depth; a divider is either n slow steps of subtract-and-shift or a few fast steps of multiply-and-square-the-error.</li>
    </ul>
    <p class="muted">Previous: <a href="digital-circuit-design/lecture.html?n=2">lecture 2, Arithmetic circuits 1</a>. Next: Arithmetic circuits 3 (<a href="digital-circuit-design/lecture.html?n=4">lecture 4</a>), which starts again at division and continues with filters, the ALU and floating-point operations. Slides: <a href="${c.materials}" target="_blank" rel="noopener">materials page ↗</a>.</p>`;
}
