    </figure>
    ${l5box("ex", "Worked example: slide 18 misses, slide 19 meets", `<p><b>Slide 18</b>, four BUFX1, maximum values throughout (the worst case for setup): clock edge 0, clock-to-Q 0.3 → 0.3; each BUFX1 adds 0.4 → 0.7, 1.1, 1.5, <b>1.9 ns</b> arrival. Required: next clock edge 2.0 minus setup 0.4 = <b>1.6 ns</b>. Slack 1.6 − 1.9 = <b>−0.3 ns</b>: missed. <b>Slide 19</b> replaces the buffers by one BUFX4 (0.2) and three BUFX2 (0.3 each): 0.3 + 0.2 + 0.9 = <b>1.4 ns</b>, slack 1.6 − 1.4 = <b>+0.2 ns</b>: met. Turned around: the first path needs a period of at least 1.9 + 0.4 = 2.3 ns (435 MHz), the second 1.8 ns (556 MHz). The hold check of the first path with the minimum values: 0.2 + 4 · 0.3 = 1.4 ns earliest arrival against a hold limit of 0.3 ns, slack +1.1 ns.</p>`)}
    ${l5box("why", "Context, not on the slides: why bigger buffers are faster here, and the catch", "<p>The slide's table gives every cell one fixed delay. In a real library the delay of each cell depends on the load it drives and the transition time at its input (the 2-D tables of lecture 5). An X4 buffer is faster because its resistance is a quarter, but its input capacitance is four times larger, so it slows down whatever drives it: here the flip-flop's clock-to-Q. That is slide 6's trade-off again, and the reason a timing tool recomputes every delay from the tables with the actual loads instead of using one number per cell.</p>")}

    <h2>The critical path (slide 20)</h2>
    <p>A real design contains many such paths between its flip-flops. In a given block, one of them is the <b>critical path</b>: the one with the longest delay, the largest sum of delays from input to output. It determines the speed of the whole block, its clock frequency. There are far too many paths to check by hand. The intuitive guess, the path through the most gates, is not always right: a path through fewer gates can be slower, for example because one of its gates has a bad fan-out.</p>
    ${lab("cp", "which path is critical?")}
    ${chart("cp", leg([[2, "path through most gates (G1–G4)", "ln"], [1, "path through the high fan-out gate G5", "ln"], [0, "<span class=\"key ln\" style=\"--c:var(--ink)\"></span> shared by both; thick = critical"]]))}
      <figcaption>Gate delays are ours, in ns; G5's delay grows with its fan-out (0.04 + 0.04 per driven input). The number under each gate is when its output settles: the latest input arrival plus the gate's delay. Hover a gate for the calculation.</figcaption>
    </figure>
    ${l5box("ex", "Worked example: four gates against three", `<p>Path through most gates: G1 → G2 → G3 → G4 = 0.10 + 0.12 + 0.10 + 0.15 = <b>0.47 ns</b>. Path through G5 with a fan-out of 6: G5 = 0.04 + 0.04 · 6 = 0.28 ns, then G3 and G4: 0.28 + 0.10 + 0.15 = <b>0.53 ns</b>. Three gates, and still the critical path. At G3 the two paths meet: one input arrives at 0.22 ns (from G2), the other at 0.28 ns (from G5); G3 can only switch after the later one, so its output settles at 0.28 + 0.10 = 0.38 ns. With a fan-out of 4, G5 takes 0.20 ns, its path 0.45 ns, and the four-gate path is critical again. The usual fixes for the fan-out case: split the load over a buffer tree (slides 7–11) or upsize G5.</p>`)}
    ${l5box("why", "Context, not on the slides: how a timing tool avoids counting paths", "<p>The number of paths grows exponentially with the size of the logic, but static timing analysis never lists them. It walks through the gates once in signal order and keeps one number per node: the arrival time, the latest input arrival plus the gate's delay, exactly what the numbers under the gates show. The critical path is then traced backwards from the worst endpoint by following, at each gate, the input that arrived last. The work grows only linearly with the number of gates, which is how a tool checks a chip with billions of transistors in hours.</p>")}

    <div class="tiles">
      ${sw("2.2 · RC", "10–90 % transition time of an RC edge (slide 4)")}
      ${sw("ln 2 · RC", "50 % propagation delay, the factor in slides 9–10")}
      ${sw("A ≈ e … 4", "size step per stage of a fast inverter chain; CBUFX8 uses 3")}
      ${sw("slack ≥ 0", "t<sub>required</sub> − t<sub>arrival</sub>, checked for every path (slide 17)")}
    </div>
    <h2>Take-home message (slide 21)</h2>
    <ul>
      <li><b>What decides how fast a gate switches?</b> The resistance of its conducting network times the capacitance it has to charge, mostly C<sub>load</sub>: wires and the next inputs. Edges take about 2.2 RC (10–90 %), delays ln 2 · RC.</li>
      <li><b>What is the maximum frequency of a cell, and the minimum delay across it?</b> f<sub>max</sub> = 1/(t<sub>f</sub> + t<sub>r</sub>) for one gate; the delay grows with the load it drives.</li>
      <li><b>How is a large load driven quickly?</b> Through a chain of inverters that grow by about e to 4 per stage: 226 ps instead of 5.6 ns on slide 10. That is how clock trees and output drivers are built, and why standard cells come in several drive strengths.</li>
      <li><b>What must the data at a flip-flop respect?</b> Setup before and hold after the clock edge; the hold time is the closing time of the master's input transfer gate.</li>
      <li><b>What sets the clock of a block?</b> Its critical path, the largest arrival over all paths, checked as slack = required − arrival; with clock distribution counted in through t<sub>clknet</sub>.</li>
      <li><b>Hand model or simulation?</b> Coarse RC and switch models for understanding and comparing; finer, realistic numbers from circuit simulation with compact models and extracted parasitics.</li>
    </ul>
    <p class="muted">Exercise: <a href="digital-circuit-design/exercise.html?n=4">exercise 4 on 3 Dec</a> reads standard-cell layouts back into circuits (lectures 5–6); its part a) asks for the W/L ratio that sets R<sub>n</sub> and R<sub>p</sub> here. Previous: <a href="digital-circuit-design/lecture.html?n=6">lecture 6, CMOS logic 1</a>. Next: <a href="digital-circuit-design/lecture.html?n=8">lecture 8, power and energy</a> (30 Nov). Background: <a href="digital-circuit-design/basics.html">basics page</a>. Slides: <a href="${c.materials}" target="_blank" rel="noopener">materials page ↗</a> (2022/23 deck, password from lecture 1; the slides may not be republished).</p>`;
}

function placeholder() {
  const d = daysUntil(l.date);
  return `${head(l)}
    <div class="box placeholder">
      <div class="big-icon">${l.icon}</div>
      <h2 style="margin-top:.4rem">Material not yet covered</h2>
      <p class="muted">This lecture is ${d > 0 ? `in ${d} day${d > 1 ? "s" : ""}` : d === 0 ? "today" : "over, but its slides are not read yet"}: ${fmt(l.date)}, ${lec.start}–${lec.end}, ${esc(lec.room)}.<br>Planned topic from the chair's slide list: ${esc(l.blurb)}<br>The summary appears here once the lecture has been held.</p>
    </div>`;
}
const WRITEUPS = { 1: lecture1, 2: lecture2, 3: lecture3, 4: lecture4, 5: lecture5, 6: lecture6, 7: lecture7 };
if (!l) {
  page.innerHTML = `${back}<h1>Lecture not found</h1><p>There is no lecture ${esc(n)}.</p>`;
} else {
  document.title = `Lecture ${l.n} – ${l.title} · Digital Circuit Design`;
  page.innerHTML = (WRITEUPS[l.n] || placeholder)();
  wireChart();
  mountCharts();
  mountLabs();
}
addEventListener("resize", () => {
  const el = document.getElementById("scaling-chart");
  if (el && el.dataset.narrow !== String(isNarrow())) { el.dataset.narrow = String(isNarrow()); el.innerHTML = scalingSVG(isNarrow()); wireChart(); }
  if ([...document.querySelectorAll("[data-chart]")].some(d => d.dataset.narrow !== String(isNarrow()))) mountCharts();
});
</script>
