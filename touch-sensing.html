<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Sensing · CMS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖐️</text></svg>">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="touch-sensing/tsp.css">
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="touch-sensing/tsp.js"></script>
</head>
<body class="tsp">
<header class="sitebar" data-page="course"></header>
<div class="wrap" id="page"></div>
<script>
// Main page: header, status bar (OPAL/Selma), then one card per lecture plus the Orga card (SML-games grid).
const { m, c, esc, U, CODE } = TSP;
const cards = c.lectures.map(l => `<a class="game-card" href="touch-sensing/lecture.html?n=${l.n}">
    <div class="game-icon">${l.icon}</div>
    <h2>Lecture ${l.n} – ${esc(l.title)}</h2>
    <p>${esc(l.blurb)}</p>
  </a>`).join("") + `<a class="game-card" href="touch-sensing/orga.html">
    <div class="game-icon">🗂️</div>
    <h2>Orga</h2>
    <p>Next session, exam variants and Selma dates, the full schedule, material, reading list and contacts.</p>
  </a>`;
document.getElementById("page").innerHTML = `
  <p class="crumbs"><a href="index.html">Dashboard</a> / ${esc(m.name)}</p>
  <header class="hero">
    <h1>🖐️ ${esc(m.name)}</h1>
    <p class="subtitle">${CODE} · ${esc(CMS.semester)} · Prof. Roberto Calandra &amp; Robin Koch · TU Dresden</p>
  </header>
  ${TSP.topbar()}
  <main class="game-cards">${cards}</main>`;
</script>
</body>
</html>
