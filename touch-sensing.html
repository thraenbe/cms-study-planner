<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Sensing · CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖐️</text></svg>">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<style>
/* Course dashboard: one card per lecture, in the card style of thraenbe.github.io/sml-games
   (14px radius, icon, chip, h2, muted text, lift on hover) on the organizer's tokens. */
:root {
  --vz-s1: #2a78d6;   /* chart accent (validated light step) */
  --vz-gray: #898781; /* de-emphasis series */
  --vz-grid: #e1e0d9;
  --vz-axis: #c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --vz-s1: #3987e5; --vz-gray: #898781; --vz-grid: #2c2c2a; --vz-axis: #383835; }
}
:root[data-theme="dark"] { --vz-s1: #3987e5; --vz-gray: #898781; --vz-grid: #2c2c2a; --vz-axis: #383835; }

.wrap { max-width: 1000px; }
.crumbs { font-size: 13px; color: var(--ink-3); margin-bottom: 4px; }
.crumbs a { color: var(--ink-2); }

/* Header like the SML site: centered title with icon, subtitle, pill nav */
.hero { text-align: center; padding: 26px 0 10px; }
.hero h1 { font-size: 32px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -.015em; }
.hero .subtitle { color: var(--ink-2); margin: 0 auto 16px; max-width: 70ch; font-size: 15px; }
.pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
.pills a { font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 17px; }
.pills a:hover { border-color: var(--ink-3); }
.pills a.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Top bar: status buttons + key dates */
.topbar { display: grid; gap: 14px; padding: 16px 18px; margin-bottom: 26px; }
.status { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-right: 4px; }
.st { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid; cursor: default; }
.st .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
.st.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.st.off { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.st small { font-weight: 500; color: var(--ink-2); }
.dates { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.kd { flex: 0 0 auto; min-width: 150px; max-width: 200px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); border-top: 3px solid var(--c); background: var(--surface); scroll-snap-align: start; }
.kd .d { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-2); }
.kd .l { font-size: 13px; font-weight: 600; line-height: 1.3; margin-top: 2px; }
.kd .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
.kd.past { opacity: .55; }
.kd.next { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
.kd.next .k::after { content: " · next"; color: var(--c); font-weight: 700; }

/* Sections */
h2.sec { font-size: 20px; margin: 30px 0 4px; letter-spacing: -.005em; }
.sec-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 14px; }

/* Cards (SML game-card) */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); transition: transform .12s ease; min-width: 0; }
.card:hover { transform: translateY(-3px); }
.card.full { grid-column: 1 / -1; }
.card .ico { font-size: 2.2rem; line-height: 1.1; }
.card .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.card-chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.card-chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.card-chip.next { color: var(--focus); border-color: color-mix(in srgb, var(--focus) 40%, var(--line)); background: color-mix(in srgb, var(--focus) 10%, var(--surface)); }
.card h2 { font-size: 20px; margin: 6px 0 6px; line-height: 1.25; }
.card h3 { font-size: 14.5px; margin: 14px 0 6px; }
.card p { color: var(--ink-2); font-size: 14.5px; line-height: 1.5; margin: 0 0 6px; }
.card p.lead { color: var(--ink); }
.card ul { margin: 0 0 6px; padding-left: 18px; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.card ul li { margin: 2px 0; }
.card .meta { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.card.todo { border-style: dashed; box-shadow: none; }
.card.todo .ico { opacity: .55; }

/* Lecture 1 visualization */
.viz { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 6px; margin: 10px 0; }
.viz figcaption { font-size: 12.5px; color: var(--ink-2); margin: 4px 2px 6px; line-height: 1.4; }
.viz svg { display: block; width: 100%; height: auto; font-family: "IBM Plex Sans", system-ui, sans-serif; }
.viz .grid { stroke: var(--vz-grid); stroke-width: 1; }
.viz .axis { stroke: var(--vz-axis); stroke-width: 1; }
.viz .tick { fill: var(--ink-3); font-size: 11px; }
.viz .cat { fill: var(--ink); font-size: 13px; font-weight: 500; }
.viz .val { fill: var(--ink); font-size: 13px; font-weight: 600; }
.viz .bar.s1 { fill: var(--vz-s1); }
.viz .bar.gray { fill: var(--vz-gray); }
.viz .hit { fill: transparent; }
.viz .row:hover .bar, .viz .row:focus .bar { filter: brightness(1.12); }
.viz .delta { fill: var(--ink-2); font-size: 12px; }
.viz .delta-line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 6px 0 10px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.tile .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; line-height: 1.3; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin: 6px 0 10px; padding: 0; list-style: none; }
.cmp li { display: grid; gap: 1px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.cmp b { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.cmp .v { display: flex; align-items: center; gap: 6px; color: var(--ink); }
.cmp .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.cmp .sw.t { background: var(--vz-s1); }
.cmp .sw.v { background: var(--vz-gray); }
details.tbl { font-size: 13px; margin-top: 6px; }
details.tbl summary { cursor: pointer; color: var(--ink-2); }
details.tbl table { border-collapse: collapse; margin-top: 6px; }
details.tbl td, details.tbl th { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
details.tbl td.n { font-variant-numeric: tabular-nums; }
.refs { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; margin-top: 10px; }

/* Organisation cards */
.next-big { font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; margin: 6px 0 4px; }
.grades { display: grid; gap: 8px; margin: 6px 0; }
.grade { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 13.5px; }
.grade.mine { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
.grade b { display: block; }
.grade .s { font-size: 12.5px; color: var(--ink-2); }
.links { display: grid; gap: 8px; margin: 6px 0 10px; }
.links a { font-size: 14px; }
ul.reading { font-size: 13px; }
ul.reading b { color: var(--ink); font-weight: 500; }
.foot { text-align: center; margin: 32px auto 0; }

@media (max-width: 760px) {
  .hero h1 { font-size: 26px; }
  .card { padding: 18px; }
  .two, .cmp { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="sitebar" data-page="course"></header>
<div class="wrap" id="page"></div>

<script>
const U = CMSUtil, esc = U.esc;
const CODE = "CMS-TRK-TSP";
const m = CMS.modules[CODE], c = m.course, st = m.status || {};
const page = document.getElementById("page");
const today = new Date().toISOString().slice(0, 10);
const fmt = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const daysUntil = iso => Math.round((new Date(iso + "T12:00:00") - new Date(today + "T12:00:00")) / 864e5);
const kindOf = topic => /^Exercise/.test(topic) ? "exe" : "lec";
const KIND_COLOR = { lecture: "var(--c-core)", exercise: "var(--c-trk)", deadline: "var(--warn)" };
const roomOn = date => date === "2026-10-13" ? "BEY/0137/U" : CMS.sessions.find(s => s.code === CODE && s.day === 1).room;

function topbar() {
  const nextDate = c.keyDates.find(k => k.date >= today)?.date;
  const dates = c.keyDates.map(k => `<div class="kd ${k.date < today ? "past" : ""} ${k.date === nextDate ? "next" : ""}" style="--c:${KIND_COLOR[k.kind]}">
      <div class="d">${fmt(k.date)}</div><div class="l">${esc(k.label)}</div><div class="k">${k.kind}</div></div>`).join("");
  const btn = (on, label, note) => `<span class="st ${on ? "on" : "off"}"><span class="dot"></span>${label}${note ? ` <small>· ${esc(note)}</small>` : ""}</span>`;
  const selmaOpen = c.keyDates.find(k => /Selma.*opens/.test(k.label));
  return `<section class="panel topbar" id="orga" aria-label="Organisation">
    <div class="status"><span class="lbl">Status</span>
      ${btn(st.opal, "Enrolled in OPAL", st.opal ? "WiSe 26/27 group" : "not yet")}
      ${btn(st.selma, "Registered in Selma", st.selma ? "" : selmaOpen && selmaOpen.date > today ? `not yet · registration opens ${U.fmtDate(selmaOpen.date)}` : "not yet confirmed")}
    </div>
    <div class="dates" aria-label="Key dates">${dates}</div>
  </section>`;
}

// ---- Lecture cards -------------------------------------------------------------
// Status chip: covered (slides read), next (first lecture from today on), upcoming.
function lectureChips(l, nextN) {
  const status = l.covered ? `<span class="card-chip ok">Covered</span>` : l.n === nextN ? `<span class="card-chip next">Next</span>` : l.date < today ? `<span class="card-chip">Held · slides pending</span>` : `<span class="card-chip">Upcoming</span>`;
  return `<div class="chips"><span class="card-chip">Lecture ${l.n} · ${U.fmtDate(l.date)}</span>${status}</div>`;
}
function placeholderCard(l, nextN) {
  const n = daysUntil(l.date);
  return `<section class="card todo" id="lecture${l.n}">
    <div class="ico">${l.icon}</div>${lectureChips(l, nextN)}
    <h2>${esc(l.title)}</h2>
    <p>Material not yet covered. The summary and figures are added once the lecture has been held and its slides are on OPAL.</p>
    <div class="meta">${fmt(l.date)} · 09:20–10:50 · ${esc(roomOn(l.date))}${n > 0 ? ` · in ${n} day${n > 1 ? "s" : ""}` : n === 0 ? " · today" : ""}</div>
  </section>`;
}
function lecture0Card(l, nextN) {
  return `<section class="card" id="lecture0">
    <div class="ico">${l.icon}</div>${lectureChips(l, nextN)}
    <h2>${esc(l.title)}</h2>
    <p>The organisational lecture, held together with Lecture 1: a first-of-its-kind, interdisciplinary course on touch digitalisation with a strong emphasis on vision-based tactile sensors and robotics. The lecturers' pitch: audio was digitised around 1890, vision around 1990, touch is the breakthrough of the 2020s.</p>
    <p>12 lectures and 12 practices in English, 3 home exercises; Python/PyTorch and Machine Learning 1 strongly recommended. Grading and Selma dates are on the exam card below.</p>
    <div class="meta">${fmt(l.date)} · 09:20–10:50 · ${esc(roomOn(l.date))} · Roberto Calandra, Robin Koch</div>
  </section>`;
}

// Lecture 1: "The importance of touch in humans and robots" — the one quantitative result of the lecture,
// from Calandra et al. 2017 (The Feeling of Success): grasp success on 22 unseen objects, vision only vs vision + touch.
const GRASP = [{ k: "Vision only", v: 56.6, cls: "gray" }, { k: "Vision + touch", v: 83.8, cls: "s1" }];
// Horizontal bars; on narrow screens the category label sits above its bar so the text stays readable.
function graspSVG(narrow) {
  const data = GRASP;
  const W = narrow ? 340 : 560, L = narrow ? 8 : 118, R = narrow ? 50 : 40, T = narrow ? 24 : 14, BH = 22, GAP = narrow ? 34 : 18, PW = W - L - R;
  const x = v => L + v / 100 * PW;
  const H = T + data.length * (BH + GAP) + 26;
  const grid = [0, 25, 50, 75, 100].map(v => `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${T - 4}" y2="${H - 24}"/><text class="tick" x="${x(v)}" y="${H - 8}" text-anchor="middle">${v}%</text>`).join("");
  const bars = data.map((d, i) => {
    const y = T + i * (BH + GAP), w = x(d.v) - L, r = 4;
    // 4px rounded data end, square at the baseline
    const path = `M${L},${y} h${w - r} a${r},${r} 0 0 1 ${r},${r} v${BH - 2 * r} a${r},${r} 0 0 1 -${r},${r} h-${w - r} z`;
    const label = narrow ? `<text class="cat" x="${L}" y="${y - 7}">${d.k}</text>` : `<text class="cat" x="${L - 10}" y="${y + BH / 2 + 4}" text-anchor="end">${d.k}</text>`;
    return `<g class="row" tabindex="0"><title>${d.k}: ${d.v}% grasp success on 22 unseen objects</title>
      <rect class="hit" x="0" y="${y - GAP / 2}" width="${W}" height="${BH + GAP}"/>${label}
      <path class="bar ${d.cls}" d="${path}"/>
      <text class="val" x="${x(d.v) + 8}" y="${y + BH / 2 + 4}">${d.v}%</text></g>`;
  }).join("");
  const y0 = T + BH / 2, y1 = T + BH + GAP + BH / 2;
  const delta = narrow ? "" : `<line class="delta-line" x1="${x(56.6)}" x2="${x(56.6)}" y1="${y0 + BH / 2 + 2}" y2="${y1 - BH / 2 - 2}"/>
    <text class="delta" x="${x(56.6) + 6}" y="${(y0 + y1) / 2 + 4}">+27.2 points with touch</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grasp success on unseen objects: vision only 56.6 percent, vision plus touch 83.8 percent">
        ${grid}<line class="axis" x1="${L}" x2="${L}" y1="${T - 4}" y2="${H - 24}"/>${bars}${delta}
      </svg>`;
}
const isNarrow = () => matchMedia("(max-width: 600px)").matches;

function lecture1Card(l, nextN) {
  return `<section class="card full" id="lecture1">
    <div class="ico">${l.icon}</div>${lectureChips(l, nextN)}
    <h2>${esc(l.title)}</h2>
    <p class="lead">Why give machines a sense of touch at all? The lecture answers in two halves: touch is indispensable for humans, and the first hard evidence says the same for robots, even though robotics has been slow to adopt it.</p>
    <div class="two">
      <div>
        <h3>Touch in humans</h3>
        <ul>
          <li><b>Johansson's experiment</b> (Umeå): with the fingertips anaesthetised, people fail at simple manipulation like striking a match. They adapt surprisingly fast, which raises the question whether that is possible only because touch representations already exist.</li>
          <li><b>Evolution:</b> touch is the first sense that evolved and sits deep in the brain (sensory cortex). It is impossible to be born without it; only a couple of medical cases of losing it are known.</li>
          <li><b>Social sense:</b> touch is deeply social and emotional. Infants need human touch, and C-tactile nerve fibres are tied to social development (Dunbar 2010; Croy, Fairhurst &amp; McGlone 2022).</li>
        </ul>
      </div>
      <div>
        <h3>Touch in robots</h3>
        <ul>
          <li><b>Complementary to vision:</b> vision is global, touch local; vision can be occluded, touch hardly; vision gives a noisy estimate, touch is virtually noiseless; and people are more confident in touch than vision under perceptual ambiguity (Fairhurst et al. 2018).</li>
          <li><b>Forces:</b> manipulation is about controlling forces, and only touch measures them. Contact position and intensity together give the torque (Del Prete et al. 2012).</li>
          <li><b>Adoption:</b> most manipulation roboticists accept that touch is essential for human-level manipulation, but parts of the computer-vision and RL communities still do not, partly for lack of flashy demonstrations.</li>
        </ul>
      </div>
    </div>
    <ul class="cmp" aria-label="Touch versus vision">
      <li><b>Coverage</b><span class="v"><span class="sw t"></span>Touch: local contact patch</span><span class="v"><span class="sw v"></span>Vision: global scene</span></li>
      <li><b>Occlusion</b><span class="v"><span class="sw t"></span>Touch: hardly ever occluded</span><span class="v"><span class="sw v"></span>Vision: easily occluded</span></li>
      <li><b>Noise</b><span class="v"><span class="sw t"></span>Touch: virtually noiseless</span><span class="v"><span class="sw v"></span>Vision: noisy estimate</span></li>
      <li><b>Forces</b><span class="v"><span class="sw t"></span>Touch: contact position + intensity, hence torque</span><span class="v"><span class="sw v"></span>Vision: does not measure forces</span></li>
    </ul>
    <h3>Example 1 · Learning grasp stability (Calandra et al., CoRL 2017)</h3>
    <p>A 7-DOF Sawyer arm with a Weiss WSG-50 gripper, one GelSight sensor per finger and two RGB-D cameras collected grasps almost autonomously: estimate the object position from depth, grasp at random, label the attempt by whether contact persists after lifting. A network then predicts from the tactile and visual readings whether a grasp will succeed.</p>
    <div class="two">
      <figure class="viz">
        <div id="grasp-chart" data-narrow="${isNarrow()}">${graspSVG(isNarrow())}</div>
        <figcaption>Grasp success on 22 unseen objects when the policy uses the outcome predictor, vision only vs vision + touch (as shown in the lecture).</figcaption>
      </figure>
      <div>
        <div class="tiles">
          <div class="tile"><div class="v">6,450</div><div class="l">grasps collected, ~2 weeks</div></div>
          <div class="tile"><div class="v">60+</div><div class="l">training objects</div></div>
          <div class="tile"><div class="v">2</div><div class="l">GelSight sensors, one per finger</div></div>
          <div class="tile"><div class="v">22</div><div class="l">unseen test objects</div></div>
        </div>
        <details class="tbl"><summary>Table view of the chart</summary>
          <table><tr><th>Input</th><th>Grasp success (22 unseen objects)</th></tr>${GRASP.map(d => `<tr><td>${d.k}</td><td class="n">${d.v} %</td></tr>`).join("")}</table>
        </details>
      </div>
    </div>
    <h3>Example 2 · General in-hand object rotation with vision and touch (Qi et al., CoRL 2023)</h3>
    <p>A multi-fingered hand rotates unseen objects in-hand around arbitrary axes; the policy fuses vision and touch, and touch is what makes the rotation robust when the object is occluded by the hand itself.</p>
    <h3>Summary</h3>
    <ul>
      <li>Touch is a crucial sensing modality in humans.</li>
      <li>The first proofs that this holds for robots too are here (grasp-outcome prediction, in-hand rotation).</li>
      <li>Touch is still not widely adopted in robotics.</li>
    </ul>
    <p class="refs">Readings named in the lecture: Dunbar 2010 (social role of touch); Croy, Fairhurst &amp; McGlone 2022 (C-tactile fibres); Fairhurst et al. 2018 (confidence in touch vs vision); Del Prete et al., IROS 2012 (contact forces and tactile feedback); Lambeta et al., RA-L 2020 (DIGIT sensor); Calandra et al., CoRL 2017 (The Feeling of Success); Qi et al., CoRL 2023 (in-hand rotation). Slides are on OPAL.</p>
    <div class="meta">${fmt(l.date)} · 09:20–10:50 · ${esc(roomOn(l.date))} · Roberto Calandra</div>
  </section>`;
}

function lectureCards() {
  const nextN = c.lectures.find(l => !l.covered && l.date >= today)?.n;
  // The filled lecture-1 card spans the full row, so it leads; the rest follow in lecture order.
  const sorted = [...c.lectures].sort((a, b) => (a.n === 1 ? -1 : b.n === 1 ? 1 : a.n - b.n));
  return sorted.map(l => l.n === 1 ? lecture1Card(l, nextN) : l.n === 0 ? lecture0Card(l, nextN) : placeholderCard(l, nextN)).join("");
}

// ---- Organisation cards -------------------------------------------------------
function nextCard() {
  const rows = m.schedule.rows;
  const nx = rows.find(r => r[0] >= today);
  if (!nx) return `<section class="card"><div class="ico">🏁</div><h2>Course finished</h2><p>All ${rows.length} sessions are in the past.</p></section>`;
  const kind = kindOf(nx[1]);
  const sess = CMS.sessions.find(s => s.code === CODE && s.day === (kind === "exe" ? 2 : 1));
  const n = daysUntil(nx[0]);
  return `<section class="card">
    <div class="ico">⏭️</div>
    <div class="chips"><span class="card-chip">Next session</span><span class="card-chip next">${n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`}</span></div>
    <div class="next-big">${esc(nx[1])}</div>
    <p>${fmt(nx[0])} · ${sess.start}–${sess.end} · ${esc(roomOn(nx[0]))}</p>
    <p>${kind === "exe" ? "Exercises are on Tuesdays with Robin Koch." : "Lectures are on Mondays with Prof. Calandra."}</p>
  </section>`;
}
function examCard() {
  const mine = /TRK-TSP/;
  return `<section class="card" id="exam">
    <div class="ico">🎓</div>
    <h2>Exam &amp; grading</h2>
    <p>From Lecture 0. Which variant applies depends on the module the course is registered under; Bela's study plan lists it as CMS-TRK-TSP (portfolio). Selma registration is required in addition to OPAL; the dates are the lecturers' and not legally binding.</p>
    <div class="grades">${c.grading.map(g => `<div class="grade ${mine.test(g.variant) ? "mine" : ""}"><b>${esc(g.variant)}</b>${esc(g.how)}<div class="s">Selma registration ${esc(g.selma)}</div></div>`).join("")}</div>
    <p>${c.homeExercises} home exercises during the semester (20 % for the oral-exam variant). Feedback form after every session: <a href="${c.feedback}" target="_blank" rel="noopener">forms.gle ↗</a></p>
  </section>`;
}
function materialCard() {
  return `<section class="card" id="material">
    <div class="ico">📚</div>
    <h2>Material &amp; contact</h2>
    <div class="links">
      <a href="${m.links.opal}" target="_blank" rel="noopener">OPAL course (slides, PDFs, feedback links) ↗</a>
      <a href="${m.links.web}" target="_blank" rel="noopener">LASR Lab teaching page ↗</a>
      <a href="${U.moduleUrl(CODE)}">Module description in the organizer →</a>
    </div>
    <p>Questions: ${esc(c.contact)}.</p>
    <h3>Reading list (OPAL bibliography)</h3>
    <ul class="reading">${c.reading.map(r => `<li><b>${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">${esc(r.t)}</a>` : esc(r.t)}</b> — ${esc(r.a)}, ${esc(r.v)} ${r.y}</li>`).join("")}</ul>
  </section>`;
}

page.innerHTML = `
  <p class="crumbs"><a href="index.html">Dashboard</a> / <a href="${U.moduleUrl(CODE)}">${esc(m.name)}</a> / Course dashboard</p>
  <header class="hero">
    <h1>🖐️ ${esc(m.name)}</h1>
    <p class="subtitle">${CODE} · ${esc(CMS.semester)} · Prof. Roberto Calandra &amp; Robin Koch · LASR Lab, TU Dresden</p>
    <nav class="pills" aria-label="Sections"><a class="active" href="#lectures">📖 Lectures</a><a href="#exam">🎓 Exam</a><a href="#material">📚 Material</a></nav>
  </header>
  ${topbar()}
  <h2 class="sec" id="lectures">Lectures</h2>
  <p class="sec-sub">One card per lecture from the OPAL list, Lecture 1 first because it is the one filled in so far. The other cards are completed once their lecture has been held and the slides are on OPAL.</p>
  <main class="cards">${lectureCards()}</main>
  <h2 class="sec" id="organisation">Organisation</h2>
  <p class="sec-sub">Next session, exam variants and where the material lives. The full session list is in Bela's Google Calendar and on the module page.</p>
  <div class="cards">${nextCard()}${examCard()}${materialCard()}</div>
  <p class="foot">Dates, rooms and organisational facts from the course's OPAL page and Lecture 0 as of ${CMS.updated}; check OPAL announcements for changes. Lecture summaries are written from the lecture slides; the chart shows the result as presented there.</p>`;

// Re-render the lecture-1 chart when the viewport crosses the narrow breakpoint.
addEventListener("resize", () => {
  const el = document.getElementById("grasp-chart");
  if (el && el.dataset.narrow !== String(isNarrow())) { el.dataset.narrow = String(isNarrow()); el.innerHTML = graspSVG(isNarrow()); }
});
</script>
</body>
