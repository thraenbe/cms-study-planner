<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Sensing · CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖐️</text></svg>">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<style>
/* Course dashboard: the card-grid feel of thraenbe.github.io/sml-games on the organizer's tokens. */
:root {
  --vz-s1: #2a78d6;   /* chart accent (validated light step) */
  --vz-gray: #898781; /* de-emphasis series */
  --vz-grid: #e1e0d9;
  --vz-axis: #c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --vz-s1: #3987e5; --vz-gray: #898781; --vz-grid: #2c2c2a; --vz-axis: #383835; }
}
:root[data-theme="dark"] { --vz-s1: #3987e5; --vz-gray: #898781; --vz-grid: #2c2c2a; --vz-axis: #383835; }

.wrap { max-width: 1040px; }
.crumbs { font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
.crumbs a { color: var(--ink-2); }
.hero { text-align: center; padding: 18px 0 8px; }
.hero .icon { font-size: 44px; line-height: 1; }
.hero h1 { font-size: 32px; line-height: 1.15; margin: 8px 0 6px; letter-spacing: -.015em; }
.hero .subtitle { color: var(--ink-2); margin: 0 auto 16px; max-width: 70ch; font-size: 14.5px; }
.pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
.pills a { font-size: 13.5px; font-weight: 500; color: var(--ink); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
.pills a:hover { border-color: var(--ink-3); }

/* Top bar: status buttons + key dates */
.topbar { display: grid; gap: 14px; padding: 16px 18px; margin-bottom: 18px; }
.status { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-right: 4px; }
.st { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid; cursor: default; text-decoration: none; }
.st .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
.st.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.st.off { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.st small { font-weight: 500; color: var(--ink-2); }
.dates { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.kd { flex: 0 0 auto; min-width: 150px; max-width: 200px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); border-top: 3px solid var(--c); background: var(--surface); scroll-snap-align: start; }
.kd .d { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-2); }
.kd .l { font-size: 13px; font-weight: 600; line-height: 1.3; margin-top: 2px; }
.kd .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
.kd.past { opacity: .55; }
.kd.next { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
.kd.next .k::after { content: " · next"; color: var(--c); font-weight: 700; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card .ico { font-size: 30px; line-height: 1; }
.card h2 { font-size: 18px; margin: 0; line-height: 1.25; }
.card p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.card p.lead { color: var(--ink); }
.card .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
@media (min-width: 720px) { .card.wide { grid-column: span 2; } }

/* Next-up card */
.next-big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.next-meta { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--ink-2); }
.next-in { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }

/* Lecture 1 visualization */
.viz { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 6px; }
.viz figcaption { font-size: 12.5px; color: var(--ink-2); margin: 4px 2px 6px; line-height: 1.4; }
.viz svg { display: block; width: 100%; height: auto; font-family: "IBM Plex Sans", system-ui, sans-serif; }
.viz .grid { stroke: var(--vz-grid); stroke-width: 1; }
.viz .axis { stroke: var(--vz-axis); stroke-width: 1; }
.viz .tick { fill: var(--ink-3); font-size: 11px; }
.viz .cat { fill: var(--ink); font-size: 13px; font-weight: 500; }
.viz .val { fill: var(--ink); font-size: 13px; font-weight: 600; }
.viz .bar.s1 { fill: var(--vz-s1); }
.viz .bar.gray { fill: var(--vz-gray); }
.viz .hit { fill: transparent; }
.viz .row:hover .bar, .viz .row:focus .bar { filter: brightness(1.12); }
.viz .delta { fill: var(--ink-2); font-size: 12px; }
.viz .delta-line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.tile .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; line-height: 1.3; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13px; margin: 0; padding: 0; list-style: none; }
.cmp li { display: grid; gap: 1px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.cmp b { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.cmp .v { display: flex; align-items: center; gap: 6px; }
.cmp .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.cmp .sw.t { background: var(--vz-s1); }
.cmp .sw.v { background: var(--vz-gray); }
details.tbl { font-size: 13px; }
details.tbl summary { cursor: pointer; color: var(--ink-2); }
details.tbl table { border-collapse: collapse; margin-top: 6px; }
details.tbl td, details.tbl th { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
details.tbl td.n { font-variant-numeric: tabular-nums; }

/* Schedule */
table.plan { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.plan td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.plan tr:last-child td { border-bottom: 0; }
.plan td.d { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; white-space: nowrap; color: var(--ink-2); width: 84px; }
.plan td.k { width: 22px; }
.plan .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; }
.plan .sw.lec { background: var(--c-core); }
.plan .sw.exe { background: var(--c-trk); }
.plan tr.past td { color: var(--ink-3); }
.plan tr.next td { background: color-mix(in srgb, var(--focus) 9%, transparent); }
.plan tr.next td.d::after { content: " ←"; color: var(--focus); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Exam, material */
.grades { display: grid; gap: 8px; }
.grade { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 13.5px; }
.grade.mine { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
.grade b { display: block; }
.grade .s { font-size: 12.5px; color: var(--ink-2); }
.links { display: grid; gap: 8px; }
.links a { font-size: 14px; }
ul.reading { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); display: grid; gap: 6px; }
ul.reading b { color: var(--ink); font-weight: 500; }
ol.topics { margin: 0; padding-left: 20px; font-size: 13.5px; display: grid; gap: 3px; }
.foot { text-align: center; margin: 32px auto 0; }

@media (max-width: 760px) {
  .hero h1 { font-size: 26px; }
  .card { padding: 16px; }
  .cmp { grid-template-columns: 1fr; }
  .plan td.d { width: 70px; }
}
</style>
</head>
<body>
<header class="sitebar" data-page="course"></header>
<div class="wrap" id="page"></div>

<script>
const U = CMSUtil, esc = U.esc;
const CODE = "CMS-TRK-TSP";
const m = CMS.modules[CODE], c = m.course, st = m.status || {};
const page = document.getElementById("page");
const today = new Date().toISOString().slice(0, 10);
const fmt = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const daysUntil = iso => Math.round((new Date(iso + "T12:00:00") - new Date(today + "T12:00:00")) / 864e5);
const kindOf = topic => /^Exercise/.test(topic) ? "exe" : "lec";
const KIND_COLOR = { lecture: "var(--c-core)", exercise: "var(--c-trk)", deadline: "var(--warn)" };

function topbar() {
  const nextDate = c.keyDates.find(k => k.date >= today)?.date;
  const dates = c.keyDates.map(k => `<div class="kd ${k.date < today ? "past" : ""} ${k.date === nextDate ? "next" : ""}" style="--c:${KIND_COLOR[k.kind]}">
      <div class="d">${fmt(k.date)}</div><div class="l">${esc(k.label)}</div><div class="k">${k.kind}</div></div>`).join("");
  const btn = (on, label, note) => `<span class="st ${on ? "on" : "off"}" title="${esc(note || "")}"><span class="dot"></span>${label}${note ? ` <small>· ${esc(note)}</small>` : ""}</span>`;
  const selmaOpen = c.keyDates.find(k => /Selma.*opens/.test(k.label));
  return `<section class="panel topbar" id="overview" aria-label="Organisation">
    <div class="status"><span class="lbl">Status</span>
      ${btn(st.opal, "Enrolled in OPAL", st.opal ? "WiSe 26/27 group" : "not yet")}
      ${btn(st.selma, "Registered in Selma", st.selma ? "" : selmaOpen && selmaOpen.date > today ? `not yet · registration opens ${U.fmtDate(selmaOpen.date)}` : "not yet confirmed")}
    </div>
    <div class="dates" aria-label="Key dates">${dates}</div>
  </section>`;
}

function nextCard() {
  const rows = m.schedule.rows;
  const nx = rows.find(r => r[0] >= today);
  if (!nx) return `<section class="card"><div class="ico">🏁</div><h2>Course finished</h2><p>All ${rows.length} sessions are in the past.</p></section>`;
  const kind = kindOf(nx[1]);
  const sess = CMS.sessions.find(s => s.code === CODE && s.day === (kind === "exe" ? 2 : 1));
  const n = daysUntil(nx[0]);
  const room = nx[0] === "2026-10-13" ? "BEY/0137/U" : sess.room;
  return `<section class="card" style="--c:${kind === "exe" ? "var(--c-trk)" : "var(--c-core)"}">
    <div class="tag">Next up</div>
    <div class="next-big">${esc(nx[1])}</div>
    <div class="next-meta">${fmt(nx[0])} · ${sess.start}–${sess.end} · ${esc(room)}</div>
    <span class="next-in">${n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`}</span>
    <p>${kind === "exe" ? "Exercises are on Tuesdays with Robin Koch." : "Lectures are on Mondays with Prof. Calandra."} Slides are linked on the course's OPAL page after each session.</p>
  </section>`;
}

// Lecture 1: "The importance of touch in humans and robots" — the one quantitative result of the lecture,
// from Calandra et al. 2017 (The Feeling of Success): grasp success on 22 unseen objects, vision only vs vision + touch.
// Lecture 1: "The importance of touch in humans and robots" — the one quantitative result of the lecture,
// from Calandra et al. 2017 (The Feeling of Success): grasp success on 22 unseen objects, vision only vs vision + touch.
const GRASP = [{ k: "Vision only", v: 56.6, cls: "gray" }, { k: "Vision + touch", v: 83.8, cls: "s1" }];
// Horizontal bars; on narrow screens the category label sits above its bar so the text stays readable.
function graspSVG(narrow) {
  const data = GRASP;
  const W = narrow ? 340 : 560, L = narrow ? 8 : 118, R = narrow ? 50 : 40, T = narrow ? 24 : 14, BH = 22, GAP = narrow ? 34 : 18, PW = W - L - R;
  const x = v => L + v / 100 * PW;
  const H = T + data.length * (BH + GAP) + 26;
  const grid = [0, 25, 50, 75, 100].map(v => `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${T - 4}" y2="${H - 24}"/><text class="tick" x="${x(v)}" y="${H - 8}" text-anchor="middle">${v}%</text>`).join("");
  const bars = data.map((d, i) => {
    const y = T + i * (BH + GAP), w = x(d.v) - L, r = 4;
    // 4px rounded data end, square at the baseline
    const path = `M${L},${y} h${w - r} a${r},${r} 0 0 1 ${r},${r} v${BH - 2 * r} a${r},${r} 0 0 1 -${r},${r} h-${w - r} z`;
    const label = narrow ? `<text class="cat" x="${L}" y="${y - 7}">${d.k}</text>` : `<text class="cat" x="${L - 10}" y="${y + BH / 2 + 4}" text-anchor="end">${d.k}</text>`;
    return `<g class="row" tabindex="0"><title>${d.k}: ${d.v}% grasp success on 22 unseen objects</title>
      <rect class="hit" x="0" y="${y - GAP / 2}" width="${W}" height="${BH + GAP}"/>${label}
      <path class="bar ${d.cls}" d="${path}"/>
      <text class="val" x="${x(d.v) + 8}" y="${y + BH / 2 + 4}">${d.v}%</text></g>`;
  }).join("");
  const y0 = T + BH / 2, y1 = T + BH + GAP + BH / 2;
  const delta = narrow ? "" : `<line class="delta-line" x1="${x(56.6)}" x2="${x(56.6)}" y1="${y0 + BH / 2 + 2}" y2="${y1 - BH / 2 - 2}"/>
    <text class="delta" x="${x(56.6) + 6}" y="${(y0 + y1) / 2 + 4}">+27.2 points with touch</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grasp success on unseen objects: vision only 56.6 percent, vision plus touch 83.8 percent">
        ${grid}<line class="axis" x1="${L}" x2="${L}" y1="${T - 4}" y2="${H - 24}"/>${bars}${delta}
      </svg>`;
}
const isNarrow = () => matchMedia("(max-width: 600px)").matches;
function lecture1Card() {
  const data = GRASP;
  return `<section class="card wide" id="lecture1">
    <div class="ico">🤖</div>
    <div class="tag">Lecture 1 · 12 Oct</div>
    <h2>The importance of touch in humans and robots</h2>
    <p class="lead">Touch is the first sense to evolve and sits deep in the sensory cortex; nobody is born without it. Humans deprived of fingertip feedback fail at everyday manipulation (Johansson's anaesthetised-finger experiment), and touch is a social sense too (C-tactile fibres, infant development). For robots, touch complements vision: local, hard to occlude, almost noise-free, and it measures forces directly, which is what manipulation is about.</p>
    <figure class="viz">
      <div id="grasp-chart" data-narrow="${isNarrow()}">${graspSVG(isNarrow())}</div>
      <figcaption>Predicting grasp outcomes from touch: success rate on 22 unseen objects after self-supervised data collection. Calandra et al., <i>The Feeling of Success</i>, CoRL 2017 (as shown in the lecture).</figcaption>
    </figure>
    <div class="tiles">
      <div class="tile"><div class="v">6,450</div><div class="l">grasps collected, almost fully autonomously</div></div>
      <div class="tile"><div class="v">60+</div><div class="l">training objects, ~2 weeks of data</div></div>
      <div class="tile"><div class="v">2</div><div class="l">GelSight sensors, one per gripper finger</div></div>
      <div class="tile"><div class="v">22</div><div class="l">unseen test objects</div></div>
    </div>
    <ul class="cmp" aria-label="Touch versus vision">
      <li><b>Coverage</b><span class="v"><span class="sw t"></span>Touch: local contact patch</span><span class="v"><span class="sw v"></span>Vision: global scene</span></li>
      <li><b>Occlusion</b><span class="v"><span class="sw t"></span>Touch: hardly ever occluded</span><span class="v"><span class="sw v"></span>Vision: easily occluded</span></li>
      <li><b>Noise</b><span class="v"><span class="sw t"></span>Touch: virtually noiseless</span><span class="v"><span class="sw v"></span>Vision: noisy estimate</span></li>
      <li><b>Forces</b><span class="v"><span class="sw t"></span>Touch: measures contact position and intensity, hence torque</span><span class="v"><span class="sw v"></span>Vision: does not</span></li>
    </ul>
    <p>Second example from the lecture: general in-hand object rotation with vision and touch (Qi et al., CoRL 2023). Take-away: touch is crucial for humans, the proofs for robots are arriving, but touch is still not widely adopted in robotics, partly for lack of flashy demonstrations.</p>
    <details class="tbl"><summary>Table view of the chart</summary>
      <table><tr><th>Input</th><th>Grasp success (22 unseen objects)</th></tr>${data.map(d => `<tr><td>${d.k}</td><td class="n">${d.v} %</td></tr>`).join("")}</table>
    </details>
  </section>`;
}

function examCard() {
  const mine = /TRK-TSP/;
  return `<section class="card" id="exam">
    <div class="ico">🎓</div>
    <h2>Exam &amp; grading</h2>
    <p>From Lecture 0. Which variant applies depends on the module you register the course under; Bela's study plan lists it as CMS-TRK-TSP (portfolio). Exam registration in Selma is required in addition to OPAL; the dates are the lecturers' and not legally binding.</p>
    <div class="grades">${c.grading.map(g => `<div class="grade ${mine.test(g.variant) ? "mine" : ""}"><b>${esc(g.variant)}</b>${esc(g.how)}<div class="s">Selma registration ${esc(g.selma)}</div></div>`).join("")}</div>
    <p>${c.homeExercises} home exercises during the semester (they count 20 % for the oral-exam variant). Feedback form after every session: <a href="${c.feedback}" target="_blank" rel="noopener">forms.gle ↗</a></p>
  </section>`;
}

function scheduleCard() {
  const rows = m.schedule.rows;
  const next = rows.find(r => r[0] >= today)?.[0];
  const tr = rows.map(([d, topic]) => {
    const k = kindOf(topic);
    return `<tr class="${d < today ? "past" : ""} ${d === next ? "next" : ""}"><td class="d">${U.fmtDate(d)}</td><td class="k"><span class="sw ${k}" title="${k === "exe" ? "Exercise" : "Lecture"}"></span></td><td>${esc(topic)}</td></tr>`;
  }).join("");
  return `<section class="card wide" id="schedule">
    <div class="ico">📅</div>
    <h2>Schedule · ${rows.length} sessions</h2>
    <div class="legend"><span><span class="sw lec" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c-core)"></span>Lecture · Mon 9:20–10:50 · ${esc(c.rooms.lecture)}</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c-trk)"></span>Exercise · Tue 9:20–10:50 · ${esc(c.rooms.exercise)}</span></div>
    <table class="plan"><tbody>${tr}</tbody></table>
    <p>Source: ${esc(m.schedule.src)}. All sessions are in Bela's Google Calendar (lectures yellow, exercises orange).</p>
  </section>`;
}

function materialCard() {
  return `<section class="card" id="material">
    <div class="ico">📚</div>
    <h2>Material &amp; contact</h2>
    <div class="links">
      <a href="${m.links.opal}" target="_blank" rel="noopener">OPAL course (slides, PDFs, feedback links) ↗</a>
      <a href="${m.links.web}" target="_blank" rel="noopener">LASR Lab teaching page ↗</a>
      <a href="${U.moduleUrl(CODE)}">Module description in the organizer →</a>
    </div>
    <p>Questions: ${esc(c.contact)}.</p>
    <div class="tag">Reading list (OPAL bibliography)</div>
    <ul class="reading">${c.reading.map(r => `<li><b>${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">${esc(r.t)}</a>` : esc(r.t)}</b> — ${esc(r.a)}, ${esc(r.v)} ${r.y}</li>`).join("")}</ul>
  </section>`;
}

function glanceCard() {
  const topics = ["The importance of touch in humans and robots", "Physiology of touch", "Touch sensing hardware", "Simulating touch", "Perception with touch", "Machine learning for touch processing", "Robot manipulation from touch", "Real-world applications of touch"];
  return `<section class="card">
    <div class="ico">🖐️</div>
    <h2>Course at a glance</h2>
    <p>${esc(c.format)} ${m.lp} LP, ${esc(m.sws)} SWS, taught by Prof. Roberto Calandra and Robin Koch (LASR Lab). The lecturers' pitch: audio was digitised around 1890, vision around 1990, and touch is the next breakthrough of the 2020s.</p>
    <ol class="topics">${topics.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
  </section>`;
}

document.title = "Touch Sensing · CMS";
page.innerHTML = `
  <p class="crumbs"><a href="index.html">Dashboard</a> / <a href="${U.moduleUrl(CODE)}">${esc(m.name)}</a> / Course dashboard</p>
  <header class="hero">
    <div class="icon">🖐️</div>
    <h1>${esc(m.name)}</h1>
    <p class="subtitle">${CODE} · ${esc(CMS.semester)} · Prof. Roberto Calandra &amp; Robin Koch · LASR Lab, TU Dresden</p>
