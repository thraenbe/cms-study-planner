function lecture5() {
  return `${head(l)}
    <p class="lead">Lecture 4 closed with the limitations of vision-based tactile sensors. This lecture turns them into a design brief: <b>design an improved version of the DIGIT</b>. It is half interactive (the room proposes fixes) and half a tour of three newer sensors from the lab and its collaborators, each attacking one limitation: Evetac for speed and bandwidth, DIGIT Pinky for size, Digit360 for multimodality.</p>

    <h2>Recap and goal (slides 2–3)</h2>
    <p>Last time: the basic principle (a camera filming a lit elastomer from inside), relative advantages and limitations, and the existing sensors from Kappl to GelSight and DIGIT. Today: an interactive design session to understand how a touch sensor gets designed, then a deeper dive into advanced VBTS. Full write-up of the previous lecture: <a href="touch-sensing/lecture.html?n=4">Lecture 4</a>.</p>

    <h2>The brief: DIGIT's limitations (slides 4–6)</h2>
    <p>The starting point is a hand full of DIGITs, one on every fingertip (slide 4). Four things are wrong with it; the deck comes back to this list three times and highlights one or two items each time before showing a sensor that answers them:</p>
    <div class="levels">${LIMITS.map(([t, d, a, s]) => `<div class="lv" style="border-top-color:var(--vz-s${s})"><div class="t">${t}</div><div class="d">${d}</div><div class="d"><b>→ ${a}</b></div></div>`).join("")}</div>
    ${why("how to run the design session yourself", `<p>The slides carry only the brief, so the session's ideas are not written down here. A useful way to replay it: for each limitation, ask which of Lecture 4's five design axes it lives on (form factor, substrate, lighting, optics, electronics) and what you would have to give up to fix it. Speed and bandwidth live in the electronics (the image sensor), bulk in the optics (the focal distance), multimodality in the substrate and electronics (other transducers next to the camera). The three sensors below are one answer each.</p>`)}

    <h2>Evetac: an event-based VBTS (slides 7–9)</h2>
    <p>Highlighted limitations: <b>sampling rate</b> and <b>data bandwidth</b>. Evetac (Funk, Helmut, Chalvatzaki, Calandra &amp; Peters, T-RO 2024) replaces the frame camera with an <b>event-based camera</b>. Every pixel reports on its own, and only when its brightness changes; nothing is sent while the gel is still. That gives readings at up to <b>1 kHz</b>, fast enough to capture dynamic touch such as slip and vibration. The design is modular and built from off-the-shelf parts (inspired by Nathan Lepora's DigiTac); the slide's exploded view shows camera, housing, holder and gel. It is not the first event-based tactile sensor: the slide credits pioneer work by Benjamin Ward-Cherrier. The photo shows two Evetacs as the fingertips of a parallel gripper holding a pencil, each with its dot pattern.</p>
    ${lab("sample", "frames versus events")}
    <p>The lab is a timing cartoon ${ctx}: a frame camera only notices the slip at its next frame, so on average half a frame period late; an event pixel fires as soon as its brightness changes, so the reaction time is bounded by the event rate, not by a frame clock.</p>
    <h3>Data bandwidth (slide 9)</h3>
    <p>The slide plots the sensor output in bytes over one 20-second grasp of a can: no contact with the gripper open, making contact as it closes, a perturbation, and slippage as the gripper opens. An RGB optical tactile sensor sends a constant amount, roughly 780 kB per step on the slide's axis, from start to finish. Evetac sends almost nothing while nothing happens and short bursts at the four events; its largest burst, at the slip, reaches <b>12 %</b> of the RGB output, and over the whole trajectory it sends <b>1.7 %</b>.</p>
    ${chart("evShare", leg([["g", "frame-based RGB sensor"], [1, "Evetac"]]))}<figcaption>Evetac's output as a share of an RGB optical tactile sensor's, the two percentages printed on slide 9. Hover or focus a bar.</figcaption></figure>
    ${tbl(["Sensor and moment", "Share of the RGB output"], EVSHARE.map(d => [d.k, `${num(d.v, 1)} %`]))}
    ${ex("Worked example · the hand of Lecture 4 with event cameras", `<p>Lecture 4 computed 111 Mb/s for one DIGIT at QVGA and 60 fps, so 553 Mb/s for five fingertips, more than USB 2.0 carries. If an event sensor sent the same 1.7 % of that on average, one fingertip would need about 111 · 0.017 ≈ <b>1.9 Mb/s</b>, five about 9.4 Mb/s; even all five fingertips peaking at 12 % at once would be 5 · 13.3 ≈ 67 Mb/s. This transfers the slide's ratios to the DIGIT's numbers ${ctx}; the ratio depends on how much happens in the scene, so a vibrating or sliding contact sends far more.</p>`)}
    ${why("what you give up with events", `<p>An event camera sees change, not state: a finger pressing steadily on an object stops producing events, so the static shape (what GelSight-style photometric stereo reconstructs) has to be integrated from the events or kept from another channel. That is why the dot pattern matters on Evetac: moving dots produce clean events, and their tracked positions carry the shear and force.</p>`)}

    <h2>DIGIT Pinky: miniaturisation with fibre bundles (slides 10–14)</h2>
    <p>Highlighted limitation: <b>bulky</b>. The camera of a VBTS needs a focal distance and its electronics need room, so the fingertip cannot shrink below the optics. DIGIT Pinky (Di, Dugonjic, … Lambeta &amp; Calandra, T-RO 2024, "Using fiber optic bundles to miniaturize vision-based tactile sensors") moves the optics out of the finger. At the fingertip sits only a small <b>distal sensing element</b>: a dome-shaped gel and the polished ends of fibres. <b>Illumination fibres</b> bring red, green and blue light from LEDs far away; an <b>imaging fibre bundle</b> carries the picture of the gel back to lenses and a camera in a box at the other end. The output is a round image (the bundle's cross-section) of the fingerprint pressed against the dome.</p>
    <figure class="viz">${pinkySVG()}<figcaption>Schematic of the split design after slide 12: everything bulky (LEDs, lenses, camera) sits proximally, the fingertip only holds gel and fibre ends. Drawn here, not to scale.</figcaption></figure>
    <ul>
      <li><b>Size</b> (slide 11): the Pinky's dome next to the elastomer of a standard DIGIT, with a 10 mm scale bar; the dome is far smaller, small enough for a little finger, hence the name.</li>
      <li><b>On a hand</b> (slide 13): mounted as the fingertip of an anthropomorphic robot hand that pinches a coin between thumb and finger.</li>
      <li><b>Cancer detection in prostate tissue</b> (slide 14): a sample of removed prostate tissue with two marked spots, one with cancer and one without, is palpated with the Pinky; the tactile images of the two spots differ visibly (two videos on the slide). A sensor this small can go where a surgeon's finger palpates.</li>
    </ul>
    ${why("why palpation works", `<p>Tumours are usually stiffer than the surrounding tissue; pressing the same way on both gives a different deformation pattern of the gel. Doctors use the same cue with their fingers (Lecture 2's slowly adapting receptors), but in minimally invasive surgery the finger is not there, so a sensor at the tip of an instrument restores the sense.</p>`)}
    ${ex("Worked example · what the fibres cost", `<p>${ctx} An imaging bundle transports one pixel per fibre core, so the image resolution is capped by the number of cores, not by the camera; and the bundle is only as flexible as its diameter allows. The trade is therefore spatial resolution and some light for a much smaller fingertip: the opposite corner of Lecture 3's criteria table from the DIGIT, which optimises cost and resolution and accepts bulk.</p>`)}

    <h2>Digit360: a superhuman multimodal fingertip (slides 15–19)</h2>
    <p>Highlighted limitation: <b>no multimodality</b>. Human skin has very heterogeneous receptors (Lecture 2); a camera sees only shape. Digit360 (Lambeta et al., "Digitizing touch with an artificial multimodal fingertip", arXiv 2024, with the files public on GitHub) packs many sensors into one finger-like tip. The cut-away on slide 16 names five headline features: <b>multimodal sensing</b>, an <b>omnidirectional</b> dome, <b>edge AI</b> in the finger, a <b>finger-like form factor</b> and a USB 3.0 link.</p>
    <h3>Resolution (slide 17)</h3>
    <p>The chart of Lectures 2–4 once more, now with Digit360 as a star in the far bottom-left: about 7 µm spatial and about 1.5 mN force resolution on the slide's axes: about 20 times finer than the DIGIT in space and 4 times in force, and roughly 140 and 40 times finer than the human finger.</p>
    ${chart("res5", leg([["g", "non-vision sensors and the finger"], [1, "DIGIT ▲ and Digit360 ★"], [2, "Insight"], [3, "GelSlim"], [4, "GelSight"]]))}<figcaption>Spatial against normal-force resolution, log-log, bottom-left is better. Values read off slide 17 and rounded; the slide marks Digit360 as "both" (vision-based and non-vision). Hover or focus a mark.</figcaption></figure>
    ${tbl(["Sensor", "≈ force resolution", "≈ spatial resolution"], RES5.map(r => [r.k + (r.star ? " (both)" : r.tri ? " (VBTS)" : ""), `${r.f} N`, `${r.s} mm`]))}
    <h3>Multimodality (slide 18)</h3>
    <p>The exploded view lists the layers from the tip down: a silicone fingertip; a sensing and illumination board with directional lighting, inertial measurement and surface vibration; static and dynamic pressure, surface audio and temperature at the tip; a hyperfisheye lens on a lens mount; the image capture system (visuotactile); an image signal processor; gas sensing with an air intake fan; a processing system with on-device AI; a data serializer and a USB-C port. The demonstration: a robot hand taps a metal bottle that is full, half full or empty, and the audio spectrograms of the taps differ clearly; the camera alone could not tell them apart.</p>
    <div class="tt-wrap"><table class="tt fam"><tr><th>channel</th><th>where in the finger</th><th>what it adds</th><th>human analogue</th></tr>${MODES.map(([a, b, cc, d, s]) => `<tr><td>${key(s)} ${a}</td><td>${b}</td><td>${cc}</td><td>${d}</td></tr>`).join("")}</table></div>
    <p class="muted" style="font-size:.85rem">The channels and their places are from slide 18; the last two columns, and the colour groups (image, pressure, other senses of the skin, beyond touch), are our reading with Lecture 2 ${ctx}.</p>
    <h3>In-finger processing with edge AI (slide 19)</h3>
    <p>With so many channels, sending everything to a host computer is the bandwidth problem again. Digit360 runs models in the finger itself. The slide measures the event-to-action latency, from a touch event to a resulting action command, split into event capture and the action command:</p>
    ${chart("latency", leg([[2, "action command"], [1, "event capture"]]))}<figcaption>Event-to-action latency in milliseconds, read off slide 19 and rounded. The DIGIT bar has a large spread (about 3.5 to 8.7 ms); the Digit360 bars are tight. Hover or focus a bar.</figcaption></figure>
    ${tbl(["Configuration", "Action command", "Event capture", "Total"], LAT.map(d => [d.k, `${num(d.act, 1)} ms`, `${num(d.cap, 1)} ms`, `${num(d.cap + d.act, 1)} ms`]))}
    ${ex("Worked example · what 5 ms mean for a slip", `<p>${ctx} A grasped object that starts to slide at 0.1 m/s moves 0.1 mm per millisecond. With the DIGIT via a host (about 6.1 ms) it has slipped about 0.6 mm before the action command leaves; with Digit360 on-device (about 1.0 ms) about 0.1 mm, below the DIGIT's spatial resolution on slide 17. Human reflexes to slip take tens of milliseconds, so both beat us, but only the on-device path reacts within a single frame period of a 60 fps camera (16.7 ms) with room to spare.</p>`)}

    <div class="tiles">
      <div class="tile"><div class="v">1 kHz</div><div class="l">Evetac's event rate, against 30–60 fps for a frame camera</div></div>
      <div class="tile"><div class="v">1.7 %</div><div class="l">Evetac's data over a whole grasp, relative to an RGB sensor</div></div>
      <div class="tile"><div class="v">≈ 7 µm</div><div class="l">Digit360's spatial resolution on the slide chart</div></div>
      <div class="tile"><div class="v">≈ 1 ms</div><div class="l">Digit360 event-to-action latency with on-device AI</div></div>
    </div>

    <h2>Take-home</h2>
    <ul>
      <li><b>What limits the DIGIT?</b> Slow sampling, high bandwidth, bulk, a single modality.</li>
      <li><b>Speed and bandwidth:</b> an event camera sends only changes, up to 1 kHz, and a small fraction of the data (Evetac: 12 % at the peak, 1.7 % on average).</li>
      <li><b>Bulk:</b> fibre bundles carry light in and the image out, so only gel and fibre ends sit in the fingertip (DIGIT Pinky); small enough for palpating tissue.</li>
      <li><b>Multimodality:</b> put other transducers next to the camera: pressure, vibration, audio, temperature, gas, IMU (Digit360).</li>
      <li><b>Bandwidth again:</b> many channels call for processing in the finger; on-device AI cuts the event-to-action latency to about 1 ms.</li>
      <li><b>Design is a trade:</b> each fix moves the sensor along one of Lecture 4's design axes and costs something on another.</li>
    </ul>
    <h2>Summary (slide 20)</h2>
    <ul><li>Interactive design session to understand the process of designing a touch sensor.</li><li>Explored a few more VBTS sensors.</li></ul>
    ${ex("Likely exam questions", `<p>Name the four limitations of the DIGIT and one sensor that addresses each. Explain how an event camera differs from a frame camera and why that helps for slip. Sketch how fibre bundles shrink a VBTS and what that costs. List the modalities of Digit360 and match them to human receptors. Why process tactile data in the finger? This list is our guess ${ctx}.</p>`)}
    <h2>References named in the lecture</h2>
    <ul class="refs">
      <li>Funk, Helmut, Chalvatzaki, Calandra &amp; Peters (2024). Evetac: an event-based optical tactile sensor for robotic manipulation. IEEE T-RO. arXiv 2312.01236.</li>
      <li>Di, Dugonjic, Fu, Wu, Mercado, Sawyer, Most, Kammerer, Speidel, Fan, Sonn, Cutkosky, Lambeta &amp; Calandra (2024). Using fiber optic bundles to miniaturize vision-based tactile sensors. IEEE T-RO. arXiv 2403.05500.</li>
      <li>Lambeta et al. (2024). Digitizing touch with an artificial multimodal fingertip. arXiv 2411.02479.</li>
      <li>Lambeta et al. (2020). DIGIT: a novel design for a low-cost compact high-resolution tactile sensor with application to in-hand manipulation. RA-L 5.</li>
      <li>Shimonomura (2019). Tactile image sensors employing camera: a review. Sensors 19.</li>
      <li>Abad &amp; Ranasinghe (2020). Visuotactile sensors with emphasis on GelSight sensor: a review. IEEE Sensors Journal 20.</li>
    </ul>
    <p class="muted">Next: <a href="touch-sensing/lecture.html?n=6">Lecture 6, Simulating Touch</a> (16 Nov). The practice to this lecture's topic is <a href="touch-sensing/exercise.html?n=4">Practice 4</a> (background subtraction and photometric stereo on DIGIT images). Slides and the feedback form are on the <a href="${m.links.opal}" target="_blank" rel="noopener">OPAL course page ↗</a>.</p>`;
}

// Slide 12 draws one convex curve: accuracy against computational cost. The four modelling options of slides 7–10 are
// placed on it here as our qualitative reading (the slide shows the bare curve); the axes carry no units.
const TRADE = [
  { k: "single rigid body", x: 0.08, slot: 3, t: "one contact force for the whole sensor: almost free, but no image-level detail (slide 7; detail ours)" },
  { k: "learned model", x: 0.3, slot: 4, t: "cheap at run time once trained, accuracy limited by the training data; underexplored for touch (slide 10)" },
  { k: "many rigid bodies", x: 0.55, slot: 1, t: "one rigid contact point per taxel: fine for low-dimensional skins, impractical beyond 1000+ points (slide 8)" },
  { k: "compliant contact (FEM, particles)", x: 0.88, slot: 2, t: "the elastomer as a real deformable body: most faithful, very time-consuming, needs the compliance characterised (slide 9)" },
];
const tradeY = x => 0.06 + 0.86 * x ** 2.2;
CHARTS.tradeoff = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 250 : 270, L = 34, R = narrow ? 14 : 150, T = 14, B = 34, PW = W - L - R, PH = H - T - B;
  const X = v => L + v * PW, Y = v => T + PH - v * PH;
  const d = "M" + Array.from({ length: 61 }, (_, k) => k / 60).map(v => `${X(v).toFixed(1)},${Y(tradeY(v)).toFixed(1)}`).join(" L");
  const pts = TRADE.map(p => `<g class="pt" tabindex="0" data-tip="${esc(`<b>${p.k}</b>${p.t}`)}"><circle class="hit" cx="${X(p.x)}" cy="${Y(tradeY(p.x))}" r="16"/>
    <circle class="dot" cx="${X(p.x)}" cy="${Y(tradeY(p.x))}" r="6.5" style="fill:var(--vz-s${p.slot});stroke:var(--surface);stroke-width:2"/>
    ${narrow ? "" : `<text class="lbl" x="${X(p.x) + (p.x > 0.8 ? 12 : 10)}" y="${Y(tradeY(p.x)) + (p.x > 0.8 ? 4 : 16)}">${p.k}</text>`}</g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trade-off curve after slide 12: accuracy rises with computational cost, slowly at first and steeply at the expensive end. Placed on it from cheap to expensive: single rigid body, learned model, many rigid bodies, truly compliant contact with FEM or particles.">
    <line class="axis" x1="${L}" x2="${L + PW}" y1="${T + PH}" y2="${T + PH}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${T + PH}"/>
    <text class="note" x="${L + PW}" y="${H - 8}" text-anchor="end">computational cost →</text>
    <text class="note" x="${L - 8}" y="${T + PH / 2}" text-anchor="middle" transform="rotate(-90 ${L - 14} ${T + PH / 2})">accuracy →</text>
    <path class="line" style="stroke:var(--vz-gray)" d="${d}"/>${pts}</svg>`;
};

// TACTO lab: a toy version of the pipeline and of slide 17's realism trick, on 128×96 canvases.
// Contact dynamics: a Hertz-like toy law, penetration ∝ F^(2/3) (1.5 mm at 3 N); sensor response: TSPViz.gelRender.
// The "real" no-contact frame is a stand-in drawn here (other tint, vignette, a stray reflection, noise), not sensor data.
const TC = { shape: "dome", F: 1.2, real: true };
const TC_SHAPES = [["sphere", "dome"], ["edge", "ridge"], ["washer", "ring"], ["screw head", "screw"]];
const tcHeight = (shape, u, v) => { const r = Math.hypot(u, v);
  return shape === "dome" ? Math.exp(-(r * r) / 0.09) : shape === "ridge" ? Math.exp(-(u * u) / 0.025) : shape === "ring" ? Math.exp(-((r - 0.5) ** 2) / 0.01)
    : Math.exp(-(r * r) / 0.26) * (1 - 0.7 * Math.exp(-(Math.min(Math.abs(u), Math.abs(v)) ** 2) / 0.004) * (r < 0.45 ? 1 : 0)); };
const tcDepth = F => 1.5 * Math.pow(F / 3, 2 / 3);
function tcPixels(opts) { const cv = document.createElement("canvas"); gelRender(cv, opts); return cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; }
let TC_REAL = null;
function tcReal() {
  if (TC_REAL) return TC_REAL;
  const base = tcPixels({ shape: "flat" }), w = 128, h = 96, out = new Uint8ClampedArray(base.length); let s = 11;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647 - 0.5; };
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = (j * w + i) * 4, u = i / w, v = j / h, vig = 1 - 0.35 * ((u - 0.5) ** 2 + (v - 0.5) ** 2) * 2.4;
    const streak = Math.exp(-(((u - 0.72) - (v - 0.5) * 0.45) ** 2) / 0.002) * 0.6;
    const tint = [0.55 + 0.45 * v + 0.5 * streak, 0.95 - 0.35 * v + 0.1 * streak, 0.7 - 0.2 * u + 0.25 * streak];
    for (let c = 0; c < 3; c++) out[k + c] = base[k + c] * tint[c] * vig + rnd() * 14;
    out[k + 3] = 255;
  }
  return (TC_REAL = out);
}
function tcPut(cv, data) { cv.width = 128; cv.height = 96; const ctx = cv.getContext("2d"), img = ctx.createImageData(128, 96); img.data.set(data); ctx.putImageData(img, 0, 0); }
LABS.tacto = body => {
  const caps = ["① penetration map (contact dynamics, white = deeper)", "② rendered: in contact", "③ rendered: no contact", "④ difference ② − ③ (grey = 0)", "⑤ real frame, no contact (stand-in)", "⑥ result: ⑤ + ④"];
  body.innerHTML = `<div class="presets">${TC_SHAPES.map(([t, p]) => `<button class="preset" type="button" data-p="${p}" aria-pressed="${p === TC.shape}">${t}</button>`).join("")}</div>
    <div class="ctl"><label>contact force <input type="range" min="0.1" max="3" step="0.1" value="${TC.F}"><output>${TC.F}</output> N</label></div>
    <div class="p4grid three">${caps.map(t => `<figure><canvas aria-label="${t}"></canvas><figcaption>${t}</figcaption></figure>`).join("")}</div><div class="ro-out"></div>`;
  const cvs = body.querySelectorAll("canvas"), out = body.querySelector(".ro-out"), rg = body.querySelector("input");
  const draw = () => {
    const dmm = tcDepth(TC.F), depth = Math.min(1, dmm / 1.5), w = 128, h = 96;
    const map = new Uint8ClampedArray(w * h * 4); let area = 0;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const z = tcHeight(TC.shape, (i / w) * 2 - 1, (j / w) * 2 - h / w) * depth, k = (j * w + i) * 4, g = 255 * z;
      map[k] = map[k + 1] = map[k + 2] = g; map[k + 3] = 255; if (z > 0.1 * depth && z > 0.03) area++; }
    const con = tcPixels({ shape: TC.shape, depth }), flat = tcPixels({ shape: "flat" }), real = tcReal();
    const diff = new Uint8ClampedArray(con.length), res = new Uint8ClampedArray(con.length); let sum = 0;
    for (let k = 0; k < con.length; k += 4) { for (let c = 0; c < 3; c++) { const dv = con[k + c] - flat[k + c]; sum += Math.abs(dv); diff[k + c] = 128 + dv; res[k + c] = real[k + c] + dv; } diff[k + 3] = res[k + 3] = 255; }
    [map, con, flat, diff, real, res].forEach((dt, i) => tcPut(cvs[i], dt));
    out.innerHTML = ro([["penetration depth (toy law)", `${num(dmm, 2)} mm at ${num(TC.F, 1)} N; doubling the force multiplies it by 2^(2/3) ≈ 1.59`],
      ["contact area", `${area} of ${w * h} pixels (${pct(area / (w * h))}) are pressed in by more than 10 % of the depth`],
      ["mean |difference|", `${num(sum / (w * h * 3), 1)} grey levels per channel: the signal the rendering adds to the real frame`]]);
  };
  body.querySelectorAll(".preset").forEach(b => b.addEventListener("click", () => { TC.shape = b.dataset.p; body.querySelectorAll(".preset").forEach(o => o.setAttribute("aria-pressed", o === b)); draw(); }));
  rg.addEventListener("input", () => { TC.F = +rg.value; rg.nextElementSibling.value = rg.value; draw(); });
  draw();
};

function lecture6() {
  const p16 = s2rRow("Sim+Real, 16 real"), mPos = s2rMatch(1), mRot = s2rMatch(3);
  return `${head(l)}
    <p class="lead">Lectures 4 and 5 built vision-based tactile sensors. This lecture asks how to get their output <b>without the hardware</b>: how to simulate a touch sensor, with the emphasis on VBTS. It splits the problem into two halves, <b>contact dynamics</b> (how the gel and the object deform each other) and <b>sensor response</b> (what the camera makes of that deformation), lays out the options for the hard half along a cost–accuracy trade-off, and then takes apart one simulator in detail: <b>TACTO</b>, from the lecturer's own group.</p>

    <h2>Recap and goal (slides 2–3)</h2>
    <p>Recap of the VBTS lectures: a bit of history, how they work, advantages and limitations, notable variants, open challenges (full write-ups: <a href="touch-sensing/lecture.html?n=4">Lecture 4</a>, <a href="touch-sensing/lecture.html?n=5">Lecture 5</a>). Today's goal: how do we simulate touch sensors, with particular emphasis on VBTS, and which simulators are in common use.</p>

    <h2>Why simulators? (slide 4)</h2>
    <ul>
      <li><b>Prototyping, debugging, benchmarking:</b> a new algorithm or a new sensor design can be tried before anything is built.</li>
      <li><b>Data:</b> simulators produce large amounts of data quickly and cheaply, to train and evaluate ML models.</li>
      <li><b>Speed:</b> they can run orders of magnitude faster than the real world.</li>
      <li><b>Sim2Real:</b> train in simulation, deploy in the real world (the slide promises more on this later in the course).</li>
    </ul>
    ${ex("Worked example · a data budget for one hour", `<p>${ctx} The terminal in the TACTO screenshots on slide 15 prints a render time of about <b>0.0094 s</b> per step for four simulated fingertips. At that rate one hour gives 3600 / 0.0094 ≈ <b>383 000</b> steps, or about 1.5 million tactile images for the four sensors, before any physics overhead. A real robot that presses an object, records, lifts and resets might manage one sample every 10 s (our assumption): 360 samples an hour, and someone has to swap the gel when it wears out. Even if the full simulation were ten times slower than the render alone, it would still be about a hundred times faster than the robot.</p>`)}

    <h2>The two sides of touch simulation (slides 5, 11)</h2>
    <p>Every touch simulator has to answer two questions in a row. <b>Contact dynamics:</b> given the objects, their poses and the forces, how do the sensor surface and the object deform where they meet? <b>Sensor response:</b> given that deformation, what does the sensor output? For a VBTS the second question is an optics problem: how the lit, deformed gel looks to the camera.</p>
    ${chart("twoSides")}<figcaption>The two halves of slide 5 as a pipeline, drawn here. The braces anticipate the case study: TACTO's first two steps answer the contact-dynamics question, its last two the sensor-response question.</figcaption></figure>
    <p>The <b>sensor response</b> is usually the easier half to model and compute (slide 11): it is a fixed mapping from deformation to output, so it can be measured once. That measurement is the catch: each sensor has to be <b>characterised</b>, its lights, gel colour, camera and lens, before its simulated output looks like the real one.</p>

    <h2>Contact dynamics: why it is hard (slide 6)</h2>
    <p>Rigid-body dynamics is well understood and every physics engine does it: two boxes collide, a contact point and a normal force come out. A tactile sensor is not rigid. Simulating a <b>soft contact</b> between the environment and the sensor is generally a very challenging problem, and VBTS make it harder twice over: their output is <b>high-dimensional</b> (an image, not a handful of taxels), and the elastomer is <b>highly compliant</b>, so the contact patch spreads, wraps around edges and changes with every gram of force.</p>
    ${why("what “soft contact” adds to the problem", `<p>For two rigid bodies the solver only has to stop them interpenetrating: the contact is a point (or a few) and the answer is a force. For a soft body the contact is an area whose shape depends on the force, the object's geometry and the material's stiffness, and friction varies over that area, which is what produces shear and incipient slip. Getting that right needs the material model (how stiff, how incompressible the gel is) and a fine discretisation of the surface, and both make it slow.</p>`)}

    <h2>Four ways to model the dynamics (slides 7–10)</h2>
    <div class="levels">
      <div class="lv" style="border-top-color:var(--vz-s3)"><div class="t">Single rigid body</div><div class="d">The sensor is one rigid body; the engine reports one contact force. Not detailed on the slides (our reading): enough for "is there contact, how hard", nothing about the shape.</div></div>
      <div class="lv" style="border-top-color:var(--vz-s1)"><div class="t">Many rigid bodies</div><div class="d">One small rigid body or contact point per taxel. Most rigid-body engines ship such low-dimensional tactile sensors (slide 8 shows a simulated robot torso covered in skin patches). They get slower as contact points are added; at the 1000+ points of a VBTS, impractical.</div></div>
      <div class="lv" style="border-top-color:var(--vz-s2)"><div class="t">Truly compliant contact</div><div class="d">Finite element modelling (FEM) or particles (the slide cites an elastic-gel FEM work and Tacchi). Very time-consuming, and the compliance of the gel has to be characterised.</div></div>
      <div class="lv" style="border-top-color:var(--vz-s4)"><div class="t">Learned model</div><div class="d">Learn the dynamics from data. Learning dynamics is well explored in ML in general, but quite underexplored for touch sensing.</div></div>
    </div>
    ${ex("Worked example · how many contact points a VBTS implies", `<p>${ctx} A DIGIT image at QVGA has 320 × 240 = <b>76 800</b> pixels. Treating every 10 × 10 pixel block as one contact point gives 32 × 24 = <b>768</b> points per fingertip; a 4 × 4 block gives 80 × 60 = <b>4 800</b>. Five fingertips at the coarse grid are already 3 840 points, every physics step. That is the jump slide 8 means by "1000+ contact points provided by vision-based tactile sensors".</p>`)}
    ${why("FEM in one paragraph", `<p>Finite element modelling cuts the gel into small elements (tetrahedra, say) and writes the elastic law for each one; assembling them gives a large system <span class="formula" style="display:inline;padding:1px 6px">K u = f</span> in which <i>K</i> is the stiffness matrix, <i>u</i> the displacement of every node and <i>f</i> the forces. The stiffness comes from material parameters such as Young's modulus and Poisson's ratio, which is what "need characterization of the compliance" means: they have to be measured for the actual gel. Contact makes the system nonlinear (which nodes touch changes as it deforms), so it is solved iteratively, many times per step. Particle methods (Tacchi uses one) trade the mesh for many material points but share the cost.</p>`)}

    <h2>The trade-off (slide 12)</h2>
    <p>Slide 12 summarises the choice in one curve: <b>accuracy against computational cost</b>. It rises slowly at the cheap end and steeply at the expensive end, so small gains in accuracy at the top cost a great deal of compute.</p>
    ${chart("tradeoff", leg([[3, "single rigid body"], [4, "learned model"], [1, "many rigid bodies"], [2, "compliant (FEM, particles)"]]))}<figcaption>The curve of slide 12 (no units on either axis). The four modelling options are placed on it here as our qualitative reading ${ctx}; the slide shows only the curve. Hover or focus a point.</figcaption></figure>
    ${tbl(["Option (cheap → expensive)", "What it gives, what it costs"], TRADE.map(p => [p.k, p.t]))}
    ${why("where the learned model really sits", `<p>A learned model breaks the single curve: its cost is paid up front (data from FEM runs or a real sensor, then training) and is small at run time. Its accuracy is bounded by the data it was trained on and degrades on objects unlike those. That is why it is drawn low on cost here, with the caveat that the true picture is two numbers (training cost, run-time cost), not one.</p>`)}

    <h2>Case study: TACTO (slides 13–16)</h2>
    <p><b>TACTO</b> (Wang, Lambeta, Chou &amp; Calandra, "TACTO: A Fast, Flexible and Open-source Simulator for High-Resolution Vision-based Tactile Sensors", RA-L 2022) is open source on GitHub; the slides open with a demo video of the simulator.</p>
    <h3>Architecture (slide 15)</h3>
    ${chart("tactoArch")}<figcaption>TACTO's software architecture, redrawn after slide 15. Everything runs in Python; the physics simulator is replaceable ("e.g. PyBullet"), and so is the sensor, through its configuration.</figcaption></figure>
    <p>Two screenshots on the slide show it running: a scene with five rendered tactile frames next to five depth frames (black while nothing touches), and a four-fingered robot hand with four rendered frames, each with the per-step render times printed in the terminal (around 0.022 s and 0.009 s).</p>
    <h3>Basic principle (slide 16)</h3>
    <div class="steps">
      <div class="step"><span class="n">1</span><div><b>Compute forces from the physics engine.</b> The rigid-body engine resolves the contact between object and sensor and reports the force. <span class="tag">${key(1)} contact dynamics</span></div></div>
      <div class="step"><span class="n">2</span><div><b>Compute the mesh penetration inside the elastomer.</b> Instead of simulating a soft gel, the object's mesh is allowed to sink into the sensor surface; how far it sinks stands in for the deformation. <span class="tag">${key(1)} contact dynamics</span></div></div>
      <div class="step"><span class="n">3</span><div><b>Render the structured light on the deformed elastomer.</b> Pyrender draws the indented gel lit the way the configured sensor lights it, seen from its camera. <span class="tag">${key(2)} sensor response</span></div></div>
      <div class="step"><span class="n">4</span><div><b>Post-processing.</b> Make the rendering look like the real sensor (next section). <span class="tag">${key(2)} sensor response</span></div></div>
    </div>
    ${why("the trick that makes it fast", `<p>Step 2 is the important simplification. TACTO does not solve the elastomer's mechanics; it treats the gel as a surface the object can sink into, with the depth set by the contact force. That keeps the expensive part (contact) in a standard rigid-body engine and turns the rest into rendering, which GPUs do very fast. The price is physical accuracy: no bulging of the gel around the contact, no shear, no spreading of the patch beyond the object's shape. On slide 12's curve, it sits at the cheap end and buys its realism in steps 3 and 4.</p>`)}
    ${lab("tacto", "TACTO's pipeline and the realism trick, in miniature")}
    <p>The lab is a toy version ${ctx}: ① stands in for steps 1–2 (a Hertz-like law turns the force into a penetration depth), ②–③ for step 3 (the same three-LED renderer used in Lecture 4's gel lab), ④–⑥ for the post-processing of slide 17. Frame ⑤ is a drawn stand-in for a real sensor's empty frame, not data.</p>

    <h2>Improving realism (slides 17–18)</h2>
    <p>A rendered gel looks too clean: perfectly smooth lighting, none of the sensor's own quirks. Slide 17's fix is pixel arithmetic: take the simulated frame <b>in contact</b>, subtract the simulated frame with <b>no contact</b>, and add the result to a <b>real</b> frame from the sensor. The difference holds only what the contact changed; the real frame supplies everything the simulator gets wrong about the background (uneven LEDs, gel colour, scratches, stray reflections). The result is the "fine-tuned" simulation.</p>
    <div class="formula">fine-tuned = real<sub>no contact</sub> + (sim<sub>contact</sub> − sim<sub>no contact</sub>)</div>
    ${ex("Worked example · one pixel through the formula", `<p>${ctx} At one pixel on the slope of the contact: simulated in contact (R, G, B) = (180, 120, 90), simulated without contact (128, 128, 128), real empty frame (90, 140, 110). The difference is (+52, −8, −38); added to the real frame it gives <b>(142, 132, 72)</b>. Two pitfalls, both from <a href="touch-sensing/exercise.html?n=4">Practice 4</a>: compute the difference in a signed type (in <code>uint8</code>, 120 − 128 wraps round to 248), and clip the final sum to 0–255.</p>`)}
    <div class="q"><div class="kicker">Slide 17 asks: there is a mistake in this slide. Can you find it?</div>
      <p>The slides do not give the answer. Things worth checking, our own candidates ${ctx}:</p>
      <ul><li>Which real frame is added? For the formula to hold it has to be a real frame <i>without</i> contact; a real frame with a contact in it would add a second imprint.</li>
      <li>Do the colours of the simulated difference fit the real sensor? The simulated frames are lit blue from the left, red from the top right and green from the bottom right, the real frame is not; a difference rendered with the wrong LED layout adds the contact in the wrong colours.</li>
      <li>Is the contact in the result where it was in the simulation, and as large?</li></ul>
      <p>Compare the four images on the slide with these three questions in mind.</p></div>
    <p><b>Shadows</b> (slide 18): three images of the same sphere contact, simulated without shadows, simulated with shadows enabled, and real. In the real frame the object blocks part of each LED's light, so coloured shadows reach out beyond the contact on the side away from each LED; with shadow rendering switched on, the simulation shows the same lobes and comes much closer to the real image than the shadow-free version.</p>

    <h2>Simulated DIGIT next to the real one (slide 19)</h2>
    <p>Four objects (a pyramid tip, a sphere, a cylinder and a cube), each pressed with a small and a larger force, in simulation (top row) and on a real DIGIT (bottom row). The shapes, their sizes and how the imprint grows with force agree; the real frames are softer, with blurrier edges and less saturated colours. That residual difference is the <b>reality gap</b> the next slide measures.</p>

    <h2>Sim2Real (slide 20)</h2>
    <p>The test: a model predicts the <b>position</b> (in mm) and <b>rotation</b> (in degrees) of the contact object from the tactile image, trained on different mixes of data and evaluated on the real sensor. The table on the slide compares a random guess, training and testing in simulation (Sim2Sim), training on real data only (Real2Real) with 16 to 128 samples, training in simulation only (Sim2Real, with and without augmentation), and pre-training in simulation plus 16 to 128 real samples (Sim+Real).</p>
    ${chart("s2rPos", leg([[2, "Real2Real"], [1, "Sim+Real"], [3, "Sim2Real, augmented", "dash"], ["g", "Sim2Sim", "dash"]]))}<figcaption>Position error against the number of real training samples (log scale), from the table on slide 20; lines between the four measured points are drawn straight. Off the chart: the random guess at 11.75 mm and Sim2Real without augmentation at 4.56 mm. Hover the chart or use the arrow keys.</figcaption></figure>
    ${chart("s2rRot", leg([[2, "Real2Real"], [1, "Sim+Real"], [3, "Sim2Real, augmented", "dash"], ["g", "Sim2Sim", "dash"]]))}<figcaption>Rotation error against the number of real training samples, same table. Off the chart: the random guess at 46.56°; Sim2Real without augmentation is at 17.64°. Sim+Real is not monotonic here (7.95° at 32, 8.25° at 64), within the spread of ± 0.8–1.6°.</figcaption></figure>
    ${tbl(["Training data", "Position error (mm)", "Rotation error (°)"], S2R.map(r => [r[0], `${num(r[1], 2)} ± ${num(r[2], 2)}`, `${num(r[3], 2)} ± ${num(r[4], 2)}`]))}
    <p>Read the table in four steps:</p>
    <ul>
      <li><b>The task is learnable:</b> trained and tested in simulation, the model reaches 0.41 mm and 3.5°, against 11.75 mm and 46.6° for guessing.</li>
      <li><b>The reality gap is large:</b> the same simulation-trained model without augmentation lands at 4.56 mm on the real sensor, about <b>11 times</b> worse than in simulation and no better than 16 real samples.</li>
      <li><b>Augmentation closes much of it:</b> with augmentation, simulation alone gets 1.66 mm and 11.6°, better than 64 real samples on position (2.01 mm).</li>
      <li><b>Sim plus a little real data wins:</b> pre-training in simulation and adding real samples beats real data alone at every size, and the best result of the table is Sim+Real with 128 samples (0.52 mm, 4.1°).</li>
    </ul>
    ${ex("Worked example · how much real data the simulator is worth", `<p>${ctx} Sim+Real with 16 real samples reaches ${num(p16[1], 2)} mm. Real data alone reaches 2.01 mm at 64 and 0.76 mm at 128 samples; interpolating on the log₂ scale, it gets to ${num(p16[1], 2)} mm at 64 · 2<sup>(2.01 − 1.55)/(2.01 − 0.76)</sup> = 64 · 2<sup>0.37</sup> ≈ <b>${num(mPos, 0)}</b> samples. The rotation error tells the same story: Sim+Real 16 is at ${num(p16[3], 2)}°, which real data alone reaches at about <b>${num(mRot, 0)}</b> samples. So on this task the simulator replaces roughly ${num(mPos - 16, 0)} of every ${num(mPos, 0)} real samples, about four in five. The straight-line interpolation between two measured points is ours.</p>`)}
    ${why("what “augmentation” usually means here", `<p>The slide does not list the augmentations. In sim-to-real work for images they are typically random changes the real world will throw at the model anyway: brightness and colour shifts, blur, noise, small shifts of the image, different backgrounds. Training on many such variants teaches the model to ignore what differs between simulation and reality and to look at the imprint. Slide 17's real-background trick attacks the same gap from the other side, by making the simulated images more real instead of the model more tolerant.</p>`)}

    <div class="tiles">
      <div class="tile"><div class="v">2 sides</div><div class="l">contact dynamics (hard) and sensor response (easier, needs characterisation)</div></div>
      <div class="tile"><div class="v">0.41 → 4.56 mm</div><div class="l">the reality gap: Sim2Sim against Sim2Real without augmentation</div></div>

    <h2>Open challenges and further reading (slides 21–22)</h2>
    <ul>
      <li><b>The sweet spot</b> of the trade-off curve: higher accuracy at lower computational cost.</li>
      <li><b>Multimodality:</b> vibration, temperature and the other channels of Lecture 5's Digit360, which a renderer of gel images does not cover.</li>
      <li><b>Ease of use:</b> integration of tactile simulation into the simulators robotics already uses.</li>
    </ul>
    <p>To read at home: <b>Taxim</b> (Si &amp; Yuan, RA-L 2022), an example-based simulation model for GelSight sensors, and <b>Tacchi</b> (Chen et al., RA-L 2023), a pluggable, low-cost elastomer deformation simulator for optical tactile sensors.</p>
    ${why("where Taxim and Tacchi sit next to TACTO", `<p>From their titles and abstracts: Taxim attacks the sensor-response side with data, calibrating the optical response of a real GelSight from example images instead of rendering lights and materials, so a new sensor needs a calibration set, not a hand-made light model. Tacchi attacks the contact-dynamics side with a particle method (the "particles" of slide 9), so the gel really deforms, at a cost the authors keep low enough to plug into existing simulators. TACTO, Taxim and Tacchi are three different points on slide 12's curve.</p>`)}

    <h2>Take-home</h2>
    <ul>
      <li><b>Why simulate touch?</b> Prototyping, debugging and benchmarking; cheap data at scale for ML; much faster than real time; Sim2Real.</li>
      <li><b>What are the two sides?</b> Contact dynamics (how gel and object deform) and sensor response (what the sensor outputs for that deformation).</li>
      <li><b>Why is contact dynamics hard for VBTS?</b> Soft contact is hard in general; VBTS are high-dimensional and highly compliant.</li>
      <li><b>Which options exist?</b> One rigid body, many rigid bodies (impractical at 1000+ contacts), truly compliant contact with FEM or particles (slow, needs the gel characterised), learned models (underexplored).</li>
      <li><b>What is the trade-off?</b> Accuracy against computational cost, with steeply rising cost at the accurate end.</li>
      <li><b>How does TACTO work?</b> Forces from a physics engine, mesh penetration as the deformation, Pyrender for the lit gel, post-processing; configurable for GelSight, OmniTact, DIGIT.</li>
      <li><b>How is realism improved?</b> Add the simulated difference to a real no-contact frame; render shadows.</li>
      <li><b>Does it transfer?</b> Partly: simulation alone with augmentation beats small real datasets, and simulation plus a few real samples beats real data alone.</li>
    </ul>
    <h2>Summary (slide 23)</h2>
    <ul><li>Touch simulation is challenging.</li><li>It is a trade-off between accuracy and computational cost.</li><li>It is conceptually divided into contact dynamics and sensor response.</li><li>There are several ways to compute the contact dynamics.</li><li>Case study: TACTO.</li></ul>
    ${ex("Likely exam questions", `<p>Name the two sides of touch simulation and explain which is harder for a VBTS and why. Compare the four ways of modelling the contact dynamics by cost and accuracy. Describe TACTO's four steps and the simplification that makes it fast. Explain the background trick of slide 17 and what can go wrong with it. Read the Sim2Real table: what is the reality gap, what does augmentation do, what does adding real data do? This list is our guess ${ctx}.</p>`)}

      <li>Si &amp; Yuan (2022). Taxim: an example-based simulation model for GelSight tactile sensors. IEEE RA-L 7(2), 2361–2368.</li>
      <li>Chen, Zhang, Luo, Sun &amp; Fang (2023). Tacchi: a pluggable and low computational cost elastomer deformation simulator for optical tactile sensors. IEEE RA-L 8(3), 1239–1246.</li>
      <li>Cui, Wang, Wang, Li, Wang &amp; Zhang (2023). Tactile imprint simulation of GelStereo visuotactile sensors. ICMA, 650–656.</li>
      <li>Narang, Sundaralingam, Macklin, Mousavian &amp; Fox (2021). Sim-to-real for robotic tactile sensing via physics-based simulation and learned latent projections. ICRA, 6444–6451.</li>

// Marker lab: a 13 × 10 grid of markers (3 mm pitch) on the gel, a round contact of radius 7 mm in the middle.
// Toy displacement fields (ours, not from the slides): a press pushes the surface outwards and towards the camera,
// a shear drags the contact patch sideways, a twist turns it. Arrows are drawn 8× longer than the displacement.
const MK = { load: "press", m: 0.7, mode: "2d" };
const MK_LOADS = [["press", "press"], ["shear →", "shear"], ["twist", "twist"], ["press + shear", "ps"]];
const MK_MODES = [["2D: position", "2d"], ["2.5D: position + size", "25d"], ["3D: position, size + shape", "3d"]];
const MK_A = 7, MK_S = 400 / 42, MK_E = 8;
function mkField(load, m) {
  const a = MK_A, press = load === "press" || load === "ps", out = [];
  const Z = (press ? 1 : 0.15) * m;                                   // indentation depth at the centre, mm
  for (let j = 0; j < 10; j++) for (let i = 0; i < 13; i++) {
    const x = (i - 6) * 3, y = (j - 4.5) * 3, r = Math.hypot(x, y), q = r / a, bump = Math.exp((1 - q * q) / 2);
    let ux = 0, uy = 0;
    if (press && r) { const ur = 0.45 * m * q * bump; ux += ur * x / r; uy += ur * y / r; }
    if (load === "shear" || load === "ps") ux += 0.6 * m * Math.exp(-(r * r) / (2 * (1.2 * a) ** 2));
    if (load === "twist" && r) { const ut = 0.45 * m * q * bump; ux += -ut * y / r; uy += ut * x / r; }
    const z = Z * Math.exp(-(r * r) / (a * a)), gx = -2 * x / (a * a) * z, gy = -2 * y / (a * a) * z;
    out.push({ x, y, r, ux, uy, z, gx, gy });
  }
  return out;
}
function mkSVG(F) {
  const X = x => 200 + x * MK_S, Y = y => 150 - y * MK_S, zmax = Math.max(...F.map(p => p.z));
  const disc = `<circle cx="200" cy="150" r="${MK_A * MK_S}" style="fill:var(--vz-s1);opacity:${(0.06 + 0.22 * zmax).toFixed(2)}"/>`;
  const marks = F.map(p => {
    const x0 = X(p.x), y0 = Y(p.y), x1 = X(p.x + p.ux * MK_E), y1 = Y(p.y + p.uy * MK_E), len = Math.hypot(x1 - x0, y1 - y0), ang = Math.atan2(y1 - y0, x1 - x0);
    const head = len > 5 ? `<path d="M${x1} ${y1} l${(-6 * Math.cos(ang - 0.45)).toFixed(1)} ${(-6 * Math.sin(ang - 0.45)).toFixed(1)} M${x1} ${y1} l${(-6 * Math.cos(ang + 0.45)).toFixed(1)} ${(-6 * Math.sin(ang + 0.45)).toFixed(1)}" style="stroke:var(--vz-s2);stroke-width:1.6;fill:none;stroke-linecap:round"/>` : "";
    const arrow = len > 1 ? `<path d="M${x0} ${y0} L${x1} ${y1}" style="stroke:var(--vz-s2);stroke-width:1.6;stroke-linecap:round"/>${head}` : "";
    const xd = X(p.x + p.ux), yd = Y(p.y + p.uy), rad = MK.mode === "2d" ? 2.6 : 2.6 * (1 + 1.2 * p.z);
    let dot = `<circle cx="${xd.toFixed(1)}" cy="${yd.toFixed(1)}" r="${rad.toFixed(2)}" style="fill:var(--ink)"/>`;
    if (MK.mode === "3d") { const g = Math.hypot(p.gx, p.gy), th = Math.atan(4 * g), rot = Math.atan2(-p.gy, p.gx) * 180 / Math.PI;
      dot = `<ellipse cx="${xd.toFixed(1)}" cy="${yd.toFixed(1)}" rx="${(rad * Math.cos(th)).toFixed(2)}" ry="${rad.toFixed(2)}" transform="rotate(${rot.toFixed(1)} ${xd.toFixed(1)} ${yd.toFixed(1)})" style="fill:var(--ink)"/>`; }
    return dot + arrow;
  }).join("");
  const bar = 0.5 * MK_S * MK_E;
  return `<svg class="mk-svg" viewBox="0 0 400 324" role="img" aria-label="Marker field for a ${MK.load === "ps" ? "press plus shear" : MK.load} load: ${F.length} markers on the gel, each with an arrow from its rest position to where it moved${MK.mode === "2d" ? "" : ", marker size growing where the gel is pressed towards the camera"}${MK.mode === "3d" ? ", and markers squeezed into ellipses on the slopes" : ""}.">
    <rect x="1" y="1" width="398" height="298" rx="14" style="fill:var(--surface);stroke:var(--line)"/>${disc}${marks}
    <path d="M14 314 H${14 + bar}" style="stroke:var(--vz-s2);stroke-width:2"/><text class="tick" x="${20 + bar}" y="318">arrow for 0.5 mm of marker motion (drawn 8× longer)</text></svg>`;
}
function mkStats(F) {
  const n = F.length, inner = F.filter(p => p.r > 0);
  const mx = F.reduce((s, p) => s + p.ux, 0) / n, my = F.reduce((s, p) => s + p.uy, 0) / n;
  const outw = inner.reduce((s, p) => s + (p.ux * p.x + p.uy * p.y) / p.r, 0) / inner.length;
  const rot = inner.reduce((s, p) => s + (p.x * p.uy - p.y * p.ux) / p.r, 0) / inner.length;
  const zmax = Math.max(...F.map(p => p.z)), tilt = Math.max(...F.map(p => Math.atan(Math.hypot(p.gx, p.gy)))) * 180 / Math.PI;
  return { mx, my, mean: Math.hypot(mx, my), outw, rot, zmax, tilt };
}

// Calibration with a ball of known radius R pressed d deep: inside the imprint (|x| < a) the gel takes the ball's
// shape, so the gradient at every pixel is known from geometry. Surface height z(x) = R − d − √(R² − x²) (mm).
const BALL = { R: 2, d: 0.5 };
const ballA = () => Math.sqrt(2 * BALL.R * BALL.d - BALL.d ** 2);
const ballZ = x => Math.abs(x) < ballA() ? BALL.R - BALL.d - Math.sqrt(BALL.R ** 2 - x * x) : 0;
const ballG = x => Math.abs(x) < ballA() ? x / Math.sqrt(BALL.R ** 2 - x * x) : 0;
CHARTS.ball = narrow => {
  const W = narrow ? 340 : 600, L = narrow ? 40 : 52, R = narrow ? 12 : 28, PW = W - L - R, k = PW / 5;   // px per mm, x from −2.5 to 2.5 mm
  const T1 = 22, z0 = 0.25, z1 = -1.05, H1 = (z0 - z1) * k, T2 = T1 + H1 + 40, H2 = narrow ? 110 : 130, H = T2 + H2 + 34;
  const X = x => L + (x + 2.5) * k, Y1 = z => T1 + (z0 - z) * k, Y2 = g => T2 + H2 / 2 - g / 1.2 * (H2 / 2);
  const a = ballA(), xs = Array.from({ length: 501 }, (_, i) => -2.5 + i * 0.01);
  const surf = xs.map(x => `${X(x).toFixed(1)},${Y1(ballZ(x)).toFixed(1)}`).join(" L");
  const gel = `<path d="M${X(-2.5)},${Y1(z1)} L${surf} L${X(2.5)},${Y1(z1)} Z" style="fill:color-mix(in srgb, var(--vz-s1) 13%, var(--surface))"/>`, gline = `<path class="line" d="M${surf}"/>`;
  const ball = `<clipPath id="ballclip"><rect x="${L}" y="${T1}" width="${PW}" height="${H1}"/></clipPath><circle clip-path="url(#ballclip)" cx="${X(0)}" cy="${Y1(BALL.R - BALL.d)}" r="${BALL.R * k}" style="fill:color-mix(in srgb, var(--ink-3) 22%, var(--surface));stroke:var(--ink-3);stroke-width:1.2"/>`;

// Integration lab: a 1-D slice through two imprints. The gradient is "measured" with noise and a calibration bias,
// then summed up from the left edge (naive) or with the height pinned to 0 at both edges (the 1-D analogue of
// solving Poisson's equation with a flat border). The noise sequence is fixed (seeded) so sliders do not flicker.
const IG = { sigma: 0.04, bias: 0.01 };
const IG_N = 161, IG_DX = 0.05, IG_X = Array.from({ length: IG_N }, (_, k) => -4 + k * IG_DX);
const igImp = (x, c, R, d) => { const a = Math.sqrt(2 * R * d - d * d), u = x - c; return Math.abs(u) < a ? [R - d - Math.sqrt(R * R - u * u), u / Math.sqrt(R * R - u * u)] : [0, 0]; };
const igTrue = x => { const p = igImp(x, -1.2, 2, 0.5), q = igImp(x, 1.9, 1, 0.25); return [p[0] + q[0], p[1] + q[1]]; };
const IG_NOISE = (() => { let s = 20261123; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  return Array.from({ length: IG_N }, () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r())); })();
function igSolve() {
  const t = IG_X.map(x => igTrue(x)[0]), g = IG_X.map((x, k) => igTrue(x)[1] + IG.bias + IG.sigma * IG_NOISE[k]);
  const nv = [0]; for (let k = 1; k < IG_N; k++) nv.push(nv[k - 1] + IG_DX * (g[k - 1] + g[k]) / 2);
  const cr = nv.map((v, k) => v - k / (IG_N - 1) * nv[IG_N - 1]);
  const rms = h => Math.sqrt(h.reduce((s, v, k) => s + (v - t[k]) ** 2, 0) / IG_N);
  return { t, nv, cr, drift: nv[IG_N - 1], rN: rms(nv), rC: rms(cr) };
}
let IGS = igSolve();
const IG_SER = [["true surface", "true", "var(--vz-gray)", "true surface"], ["summed from the left", "nv", "var(--vz-s2)", "summed from left"], ["pinned at both edges", "cr", "var(--vz-s1)", "pinned at edges"]];
CHARTS.integ = narrow => {

  const xt = [-4, -2, 0, 2, 4].map(x => `<text class="tick" x="${X(x)}" y="${T + PH + 16}" text-anchor="middle">${x}</text>`).join("");
  const path = arr => "M" + arr.map((v, k) => `${X(IG_X[k]).toFixed(1)},${Y(v).toFixed(1)}`).join(" L");
  const S = { true: IGS.t, nv: IGS.nv, cr: IGS.cr };
  const lines = IG_SER.map(([, k, c]) => `<path class="line" style="stroke:${c}${k === "true" ? ";stroke-width:3;opacity:.7" : ""}" d="${path(S[k])}"/>`).join("");
  const ends = IG_SER.map(([n, k]) => [n, S[k][IG_N - 1]]), order = ends.map((e, i) => i).sort((a, b) => ends[b][1] - ends[a][1]);
  let lastY = -99; const lbls = narrow ? "" : order.map(i => { let yy = Y(ends[i][1]) + 4; if (yy - lastY < 14) yy = lastY + 14; lastY = yy; return `<text class="lbl" x="${L + PW + 6}" y="${yy}">${IG_SER[i][3]}</text>`; }).join("");
  const cols = Array.from({ length: 17 }, (_, i) => i * 10).map(k => `<g class="pt" tabindex="0" data-tip="${esc(`<b>x = ${num(IG_X[k], 1)} mm</b>${IG_SER.map(([n, kk, c]) => `<span class="trow"><i style="--c:${c}"></i><strong>${num(S[kk][k], 3)} mm</strong> ${n}</span>`).join("")}`)}"><rect class="hit" x="${X(IG_X[k]) - PW / 34}" y="${T}" width="${PW / 17}" height="${PH}"/>${IG_SER.map(([, kk, c]) => `<circle class="dot hov" cx="${X(IG_X[k])}" cy="${Y(S[kk][k])}" r="4" style="fill:${c}"/>`).join("")}</g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of the surface height in millimetres across an 8 millimetre slice with two imprints. The true surface dips to minus 0.5 and minus 0.25. Summing the noisy gradient from the left ends ${num(IGS.drift, 3)} millimetres off at the right edge; pinning both edges to zero removes that drift and leaves a root-mean-square error of ${num(IGS.rC, 3)} millimetres.">
    <defs><clipPath id="clip-integ"><rect x="${L}" y="${T - 2}" width="${PW}" height="${PH + 4}"/></clipPath></defs>
    <text class="note" x="${L - 34}" y="12">surface height z (mm)</text>${yt}${xt}<g clip-path="url(#clip-integ)">${lines}</g>${lbls}<text class="note" x="${L + PW}" y="${H - 2}" text-anchor="end">x (mm)</text>${cols}</svg>`;
};

// Delta images over time (slide 6 asks how to bring time in). A synthetic press–hold–slide–release at 30 fps, read
// two ways: against the frame without touch (the slide's delta image) and against the previous frame (our addition).
// Signals in mean |difference| per pixel (grey levels); the floor 3.4 is the noise of two frames with σ = 3 each.
const DT_PH = [[0, 0.5, "no contact", "none"], [0.5, 0.9, "press", "press"], [0.9, 1.6, "hold", "hold"], [1.6, 2.2, "slide", "slide"], [2.2, 2.5, "release", "rel."], [2.5, 3, "no contact", "none"]];
const dtC = t => t < 0.5 ? 0 : t < 0.9 ? (t - 0.5) / 0.4 : t < 2.2 ? 1 : t < 2.5 ? 1 - (t - 2.2) / 0.3 : 0;
const dtJ = k => 0.18 * Math.sin(k * 1.7) + 0.12 * Math.sin(k * 4.3);
const dtRef = k => 3.4 + 17 * dtC(k / 30) + dtJ(k);
const dtPrev = k => 3.4 + 68 * Math.abs(dtC(k / 30) - dtC((k - 1) / 30)) + (k / 30 >= 1.6 && k / 30 < 2.2 ? 6 : 0) + dtJ(k + 7);
const dtPhase = k => DT_PH.find(p => k / 30 >= p[0] && k / 30 < p[1] + 1e-9)[2];
CHARTS.delta = narrow => {
  const W = narrow ? 340 : 600, L = 34, R = narrow ? 12 : 72, T = 42, PH = narrow ? 170 : 190, B = 30, H = T + PH + B, PW = W - L - R;
  const X = t => L + t / 3 * PW, Y = v => T + PH - v / 24 * PH, K = Array.from({ length: 91 }, (_, k) => k);
  const bands = DT_PH.map(([a, b, n, s], i) => `${i % 2 && i < 5 ? `<rect class="band" x="${X(a)}" y="${T}" width="${X(b) - X(a)}" height="${PH}"/>` : ""}<text class="note" x="${(X(a) + X(b)) / 2}" y="${T - 8}" text-anchor="middle"${narrow ? ' style="font-size:9.5px"' : ""}>${narrow ? s : n}</text>`).join("");
  const yt = [0, 6, 12, 18, 24].map(v => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${L + PW}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const xt = [0, 0.5, 1, 1.5, 2, 2.5, 3].map(t => `<text class="tick" x="${X(t)}" y="${T + PH + 16}" text-anchor="middle">${t}</text>`).join("");
  const path = f => "M" + K.map(k => `${X(k / 30).toFixed(1)},${Y(f(k)).toFixed(1)}`).join(" L");
  const thr = `<line class="ann dash" x1="${L}" x2="${L + PW}" y1="${Y(8)}" y2="${Y(8)}"/>${narrow ? "" : `<text class="note" x="${L + PW + 6}" y="${Y(8) + 4}">threshold 8</text>`}`;
  const lbl = narrow ? "" : `<text class="lbl" x="${X(0.94)}" y="${Y(20.6) - 8}">vs no-touch frame</text><text class="lbl" x="${X(0.94)}" y="${Y(3.6) - 8}">vs previous frame</text>`;
  const cols = K.filter(k => k % 2 === 0).map(k => `<g class="pt" tabindex="0" data-tip="${esc(`<b>t = ${num(k / 30, 2)} s · ${dtPhase(k)}</b><span class="trow"><i style="--c:var(--vz-s1)"></i><strong>${num(dtRef(k), 1)}</strong> vs no-touch frame</span><span class="trow"><i style="--c:var(--vz-s2)"></i><strong>${num(dtPrev(k), 1)}</strong> vs previous frame</span>`)}"><rect class="hit" x="${X(k / 30) - PW / 92}" y="${T}" width="${PW / 46}" height="${PH}"/><circle class="dot hov" cx="${X(k / 30)}" cy="${Y(dtRef(k))}" r="4" style="fill:var(--vz-s1)"/><circle class="dot hov" cx="${X(k / 30)}" cy="${Y(dtPrev(k))}" r="4" style="fill:var(--vz-s2)"/></g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart over 3 seconds of a press, hold, slide and release, in mean absolute difference per pixel. Against the no-touch frame the signal rises from the noise floor of 3.4 to about 20 during the press and stays there through hold and slide, then falls back after the release. Against the previous frame it spikes to about 9 during the press and 11 during the release, sits at the floor during the hold and at about 9 during the slide.">
    ${bands}${yt}${xt}${thr}<path class="line" style="stroke:var(--vz-s1)" d="${path(dtRef)}"/><path class="line" style="stroke:var(--vz-s2)" d="${path(dtPrev)}"/>${lbl}
    <text class="note" x="${L + PW}" y="${H - 2}" text-anchor="end">time (s), 30 frames per second</text><text class="note" x="${L - 30}" y="12">mean |difference| per pixel (grey levels)</text>${cols}</svg>`;
};

function lecture7() {
  const sd = 3 * Math.SQRT2, fp = 0.0027 * 76800;
  return `${head(l)}
    <p class="lead">Lectures 4 to 6 were about getting tactile images, from a real sensor or a simulator. This lecture asks what to do with them: <b>how do we process the raw data of a vision-based tactile sensor?</b> There are two routes, analytical methods and learning-based ones. Today is the analytical route, and it is a short deck (8 slides) with a live demo: <b>markers</b> that show how the gel moves sideways, <b>depth estimation</b> that turns the shading into a height map, and <b>delta images</b> that bring time into the picture. The learning-based route starts with Lecture 8.</p>

    <h2>Two routes from a raw image (slide 2)</h2>
    <p>A VBTS delivers an RGB image of its lit gel, many times a second. Between that image and anything a robot can use (where is the contact, how deep, is it slipping, how hard is it pushed) sits a processing step. <b>Analytical methods</b> write that step down from physics and geometry: track these dots, invert this lighting model, subtract that frame. <b>Learning-based methods</b> (AI/ML) learn it from data, which is the subject of the next lectures.</p>
    ${chart("perceive", leg([[1, "analytical methods (today)"], ["g", "learning-based methods (next lectures)"]]))}<figcaption>Slide 2's two routes, drawn as a tree. The three analytical leaves are the three topics of slides 3–6 and the summary on slide 7.</figcaption></figure>
    ${why("why learn the analytical route first", `<p>Analytical methods need no training data, run in a few milliseconds, and fail in ways one can explain: a marker the tracker lost, a pixel outside the calibrated range. They also produce the quantities that learning methods are often trained to predict or are given as extra inputs (a depth map, a displacement field, a difference image). Their weakness is the assumptions they rest on, which slide 5 names outright: a flat sensor and a calibration procedure.</p>`)}

    <h2>Markers (slides 3–4)</h2>
    <p>Many gels carry a regular grid of small dark dots on or just under their surface. With no contact the camera sees the grid at rest; when an object presses or drags the gel, the dots move with the material under them. Finding every dot in the current frame and pairing it with its rest position gives one <b>displacement vector per marker</b>: a sparse vector field of how the gel surface moved.</p>
    <p>Slide 3 shows such fields from the GelSight work on shear and slip (Yuan et al., ICRA 2015): three photographs of a marked gel with a yellow arrow from each dot, and a scale bar for 0.5 mm of motion under each. In the first, a round contact pushes the markers outwards from its centre in every direction; in the second the arrows also point outwards and grow towards the image border; in the third a long, straight contact runs down the middle and the markers on either side are pushed away from it, to the left and to the right.</p>
    ${lab("markers", "a marker field under four loads")}
    <p class="muted" style="font-size:.9rem">The lab's fields are a toy model ${ctx}: smooth bumps around a round contact of 7 mm radius, a 3 mm marker pitch, arrows drawn 8 times longer than the motion. Real fields are noisier and depend on the gel's thickness and stiffness.</p>
    ${why("what markers add to the shading", `<p>The coloured shading of a GelSight-style image encodes the <b>shape</b> of the pressed surface. A force parallel to the surface (shear) hardly changes that shape: the gel is dragged sideways, its relief stays almost the same, and the image barely changes. The markers make that sideways motion visible. From the field one can read a few global numbers, as the lab does: the mean displacement (a net drag, so shear), the outward spreading (a normal press), the rotation about the centre (a torque). <b>Slip</b> shows up in the same field: while the object sticks, the markers under it move with it; when the rim of the contact starts to slide, the markers there lag behind the ones in the middle, which is the kind of signal the cited paper's title (measuring shear and slip) refers to. TacTip, one of Lecture 4's sensor families, is built entirely around tracking such markers.</p>`)}
    <h3>Three levels of marker processing (slide 4)</h3>
    <p>Slide 4 sorts marker methods, after a 2023 review (Li, Li &amp; Jiang, IEEE Sensors Journal), into three approaches of increasing complexity:</p>
    <div class="levels">
      <div class="lv" style="border-top-color:var(--vz-s1)"><div class="n">2D</div><div class="t">position of each marker</div><div class="d">In-plane displacement only: the sideways field of the lab's 2D view. Enough for shear, torque and slip.</div></div><span class="x" aria-hidden="true">→</span>
      <div class="lv" style="border-top-color:var(--vz-s1)"><div class="n">2.5D</div><div class="t">position and size</div><div class="d">A marker that comes closer to the camera looks bigger, so its size change adds an estimate of the motion along the camera axis: how far the gel is pressed in at that dot.</div></div><span class="x" aria-hidden="true">→</span>
      <div class="lv" style="border-top-color:var(--vz-s1)"><div class="n">3D</div><div class="t">position, size and shape</div><div class="d">A round dot on a tilted patch is seen at an angle and looks like an ellipse; its shape adds the local tilt of the surface. Together: a 3D displacement per marker.</div></div>
    </div>
    <p class="muted" style="font-size:.9rem">The slide gives the three labels; the explanations of what size and shape reveal are ours ${ctx}. The lab's 2.5D and 3D buttons show both effects, exaggerated so they are visible.</p>
    ${ex("Worked example · how much a pressed marker grows", `<p>${ctx} The image of a dot scales with 1 / distance to the camera. Take a marker 15 mm in front of the lens (a round number of the right order for a fingertip-sized sensor; our assumption) and press it 0.3 mm towards the camera: it now sits at 14.7 mm, and its image grows by 15 / 14.7 = 1.020, so by <b>2 %</b>. A dot 20 pixels across becomes 20.4 pixels wide: 0.4 pixels of signal, measurable only by fitting each blob to sub-pixel precision, and easily swamped by noise or by the dot being squeezed. That is the price of 2.5D. The other way round, a measured growth g gives the depth change 15 · (1 − 1 / g) mm: for g = 1.020, 15 · 0.0196 = 0.29 mm. With markers 3 mm apart, that is one depth sample every 3 mm, coarse next to the per-pixel depth of the next section.</p>`)}

    <h2>Depth estimation (slide 5)</h2>
    <p>The second tool skips the dots and uses the shading itself. The slide states the model in one line: the intensity at each pixel is a function of the local slope of the gel surface,</p>
    <div class="formula">I(x, y) = R( ∂H/∂x , ∂H/∂y )</div>
    <p>where <b>H</b> is the height map of the deformed surface and <b>R</b> the <b>reflectance map</b>, the fixed relation between a slope and the colour it produces under the sensor's lights. The task is the inverse: <b>given an image I(x, y), estimate the deformation of the height map H</b>. The slide points to section 5 of Johnson &amp; Adelson's retrographic-sensing paper (CVPR 2009) and to sections 3.3 and 3.5 of the GelSight paper by Yuan, Dong &amp; Adelson (Sensors 2017), and it names the catch: <b>strong assumptions, a flat sensor and a calibration procedure</b>.</p>
    ${why("the recipe behind the one-line formula", `<p>In outline, the GelSight line of work does it in two steps. <b>Invert R:</b> R has no simple closed form on a real sensor (the LEDs are close, the coating is not perfectly matte), so it is <b>measured</b>. A ball of known radius is pressed into the gel; inside its imprint the surface has the ball's shape, so the true gradient at every pixel follows from geometry. Each pixel gives one pair "this colour ↔ this gradient", and the pairs are stored in a lookup table (or fitted with a small model) that maps any colour back to (∂H/∂x, ∂H/∂y). <b>Integrate:</b> a gradient field is not yet a height map; it is integrated, usually by solving a Poisson equation ∇²H = ∂gₓ/∂x + ∂g_y/∂y with H = 0 on the flat border. Practice 4's n = L⁻¹ I was the textbook version of step one with known light directions; the lookup table replaces L⁻¹ with a measured mapping. The two assumptions of the slide come from exactly these steps: the table only fits a flat gel under fixed lights, and it only exists after calibration.</p>`)}
    ${lab("ball", "the calibration ball")}
    ${ex("Worked example · one press of a 2 mm ball", `<p>${ctx} Radius R = 2 mm, pressed d = 0.5 mm deep. The contact radius is a = √(2Rd − d²) = √(2 − 0.25) = <b>1.32 mm</b>. At x = 1 mm from the centre the surface follows the sphere, z = R − d − √(R² − x²) = 1.5 − √3 = −0.232 mm (0.268 mm below the flat gel), and its gradient is x / √(R² − x²) = 1 / √3 = <b>0.577</b>, a 30° slope. At the rim the gradient reaches a / (R − d) = 1.32 / 1.5 = <b>0.88</b> (41.4°). In 2D the imprint covers every slope direction from 0 to 0.88, so one press fills the table for all gradients up to that size; steeper contacts later fall outside it, which is one reason to press a little deeper during calibration than the objects you expect.</p>`)}
    <h3>From gradients to a height map</h3>
    <p>Integrating sums up small errors: a gradient that is slightly wrong everywhere (a calibration bias) makes the height drift linearly across the image, and random noise makes it wander. Knowing that the gel is flat outside the contact pins the height at the border and removes the drift.</p>
    ${lab("integ", "integrating noisy gradients")}
    ${tbl(["x (mm)", "true z (mm)", "summed from the left (mm)", "pinned at both edges (mm)"], Array.from({ length: 9 }, (_, i) => i * 20).map(k => [num(IG_X[k], 1), num(IGS.t[k], 3), num(IGS.nv[k], 3), num(IGS.cr[k], 3)]))}
    <p class="muted" style="font-size:.9rem">The table lists the default setting (σ = 0.04, bias 0.01); the chart follows the sliders.</p>

    <h2>From images to videos: the delta image (slide 6)</h2>
    <p>A single tactile image can be <b>ambiguous</b>. It shows the gel at one instant: whether the contact is growing or shrinking, whether the object is about to slip, or whether a colour shift comes from a contact or from the gel and LEDs themselves cannot be read from one frame. <b>Several images over time</b> show how things change. The slide's simplest way to bring time in is the delta image:</p>
    <div class="formula">Δ(t) = I(t) − I<sub>no touch</sub></div>
    <p>It removes everything that is the same in every frame (uneven lighting, the gel's colour, marks on the coating) and leaves what the contact changed, frame after frame. The slide announces a live demo at this point. It is Practice 4's background subtraction, now applied to every frame of a stream.</p>
    ${chart("delta", leg([[1, "difference to the no-touch frame (slide 6)", "ln"], [2, "difference to the previous frame (our addition)", "ln"], ["g", "contact threshold", "ln"]]))}<figcaption>A synthetic press, hold, slide and release at 30 frames per second, read two ways ${ctx}: the mean absolute difference per pixel to the no-touch frame and to the previous frame. The floor of 3.4 grey levels is what two frames with a noise of σ = 3 differ by on average. Hover or focus the chart.</figcaption></figure>
    ${tbl(["phase", "vs no-touch frame", "vs previous frame"], [[0, "no contact"], [20, "press"], [38, "hold"], [56, "slide"], [70, "release"], [86, "no contact"]].map(([k, p]) => [`${p} (t = ${num(k / 30, 2)} s)`, num(dtRef(k), 1), num(dtPrev(k), 1)]))}
    ${why("two kinds of difference, two questions", `<p>The difference to the no-touch frame answers <b>is there contact, and where?</b> It stays high for as long as something presses, including the hold, so a fixed threshold on it detects contact. The difference to the previous frame answers <b>what is changing right now?</b> It is quiet during a steady hold and lights up at the onset, during sliding and at the release, which is the information a grasp controller needs to react to slip. An event camera such as Lecture 5's Evetac produces the second kind in hardware, per pixel and only where something changes.</p>`)}
    ${ex("Worked example · a per-pixel contact mask", `<p>${ctx} Each pixel of a 320 × 240 frame (76 800 pixels) carries noise of σ = 3 grey levels. The difference of two such frames has σ√2 = ${num(sd, 2)}; a threshold at three times that, <b>${num(3 * sd, 1)}</b> grey levels, is crossed by pure noise at about 0.27 % of pixels, so roughly <b>${num(fp, 0)}</b> false pixels per frame. A contact covering 5 % of the image (3 840 pixels) that changes them by ±40 grey levels clears the threshold almost everywhere, so the mask holds about 3 840 true pixels against about 200 false ones. Averaging 16 empty frames for the reference lowers the noise of the difference to 3 · √(1 + 1/16) = 3.09 and the threshold to 9.3, so weaker contacts become detectable (the same √(1 + 1/N) as in <a href="touch-sensing/exercise.html?n=4">Practice 4</a>).</p>`)}

    <div class="tiles">
      <div class="tile"><div class="v">2D → 2.5D → 3D</div><div class="l">marker processing: position, then size, then shape</div></div>
      <div class="tile"><div class="v">I = R(∂H/∂x, ∂H/∂y)</div><div class="l">the image as a function of the surface slope; invert R, then integrate</div></div>
      <div class="tile"><div class="v">flat + calibrated</div><div class="l">the two strong assumptions of analytical depth estimation</div></div>
      <div class="tile"><div class="v">Δ = I(t) − I<sub>no touch</sub></div><div class="l">the delta image that brings time in</div></div>
    </div>

    <h2>Take-home (summary, slide 7)</h2>
    <ul>
      <li><b>Which two routes process VBTS data?</b> Analytical methods (today) and learning-based AI/ML methods (next lectures).</li>
      <li><b>What do markers measure?</b> The displacement of the gel surface at each dot; the field shows shear, normal pressing, torque and the onset of slip, which the shading alone hardly shows.</li>
      <li><b>What are 2D, 2.5D and 3D marker methods?</b> Using the markers' position; position and size; position, size and shape. Each adds information about the motion out of the image plane.</li>
      <li><b>What does depth estimation solve?</b> Given I(x, y) = R(∂H/∂x, ∂H/∂y), recover the height map H: map colours to gradients (calibrated, e.g. with a ball of known size), then integrate the gradients.</li>
      <li><b>What does it assume?</b> A flat sensor and a calibration procedure.</li>
      <li><b>Why go from images to videos?</b> One image is ambiguous; changes over time carry the information. The delta image, current frame minus the frame without touch, is the simplest way in.</li>
    </ul>
    ${ex("Likely exam questions", `<p>Name the analytical tools for VBTS images and what each one gives. Explain the difference between 2D, 2.5D and 3D marker methods. Why do markers reveal shear when the shading does not? Write down the reflectance-map equation, say what is known and what is sought, and describe how R is obtained and how the height map follows. Which assumptions does that rest on? What is a delta image and why are single frames ambiguous? This list is our guess ${ctx}.</p>`)}
    <h2>References named in the lecture (slides 3–5, 8)</h2>
    <ul class="refs">
      <li>Yuan, Li, Srinivasan &amp; Adelson (2015). Measurement of shear and slip with a GelSight tactile sensor. ICRA, 304–311.</li>
      <li>Li, Li &amp; Jiang (2023). Marker displacement method used in vision-based tactile sensors: from 2-D to 3-D, a review. IEEE Sensors Journal 23(8), 8042–8059.</li>
      <li>Johnson &amp; Adelson (2009). Retrographic sensing for the measurement of surface texture and shape. CVPR (section 5).</li>
      <li>Yuan, Dong &amp; Adelson (2017). GelSight: high-resolution robot tactile sensors for estimating geometry and force. Sensors 17(12), 2762 (sections 3.3 and 3.5).</li>
    </ul>
    <p class="muted">Next: <a href="touch-sensing/lecture.html?n=8">Lecture 8, ML for Touch 1</a> (30 Nov), the learning-based route. The practice to this lecture's topic is <a href="touch-sensing/exercise.html?n=7">Practice 7, Perception with Touch</a> (1 Dec); the practice the day after this lecture was <a href="touch-sensing/exercise.html?n=6">Practice 6</a> (Simulating Touch, with TACTO). Home Exercise 2 opens on 1 Dec. Previous: <a href="touch-sensing/lecture.html?n=6">Lecture 6</a>. Slides and the feedback form are on the <a href="${m.links.opal}" target="_blank" rel="noopener">OPAL course page ↗</a>.</p>`;
}
