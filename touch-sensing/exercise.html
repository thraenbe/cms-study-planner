// Exercise 1 – Practice 1: the importance of touch
// ======================================================================================
const USES = [
  ["Measuring mechanical properties", "material, inertia, softness, roughness, temperature of an object", 1],
  ["Mapping and localisation", "where am I touching, what shape is this, where is the object in the hand", 2],
  ["Force and slip control", "how hard to squeeze, is it slipping, is the contact stable", 3],
  ["Human interaction", "handshakes, hugs, guiding a hand; the social side of Lecture 1", 4],
];
const SENSES = [["weight / inertia", "✓", "~", "✗"], ["softness", "✓", "~", "✗"], ["roughness / texture", "✓", "~", "~"], ["temperature", "✓", "✗", "✗"], ["global shape", "✓", "✓", "✗"], ["colour", "✗", "✓", "✗"], ["slip onset", "✓", "~", "~"], ["contact force", "✓", "✗", "✗"]];
LABS.jar = body => {
  const render = () => { const h = +body.querySelector("#t-hand").value || 0, t = +body.querySelector("#t-tw").value || 0, mx = Math.max(h, t, 1);

      + (h && t ? `<p class="lab-note" style="margin:8px 0 0">Tweezers took ${num(t / h, 1)}× as long${t / h > 1.5 ? ": the loss of tactile feedback and compliance costs more than the loss of dexterity alone" : ""}.</p>` : ""); };
  body.innerHTML = `<div class="ctl"><label>hands <input id="t-hand" type="number" min="0" step="1" value="45" style="width:5em"> s</label><label>tweezers <input id="t-tw" type="number" min="0" step="1" value="150" style="width:5em"> s</label></div><div class="ag"></div>`;
  body.querySelectorAll("input").forEach(i => i.addEventListener("input", render)); render();
};
function exercise1() {
  return `${head(e)}
    <p class="lead">The first real practice: groups of three to five introduce themselves and say what they want from the course, then two questions turn Lecture 1 into something you can feel: what is touch actually useful for, and what happens when you take it away.</p>
    <h2>Recap of Lecture 1</h2>
    <ul class="cmp" aria-label="Touch versus vision">
      <li><b>Scope</b><span class="v"><span class="sw t"></span>touch: local</span><span class="v"><span class="sw v"></span>vision: global</span></li>
      <li><b>Occlusion</b><span class="v"><span class="sw t"></span>touch: not really</span><span class="v"><span class="sw v"></span>vision: can be occluded</span></li>
      <li><b>Noise</b><span class="v"><span class="sw t"></span>touch: noiseless</span><span class="v"><span class="sw v"></span>vision: can be noisy</span></li>
    </ul>
    <p>Touch in robotics gives simultaneous contact and force estimation, and is still not accepted as necessary for manipulation in all communities.</p>
    <h2>Question 1 · What is touch useful for?</h2>
    ${qbox("Discussed in the groups", ["Think of everyday tasks where you use touch. Can you list some?", "How is touch used in each of them? Is it always used in the same way?", "Can the information that touch provides be collected by other senses?"])}
    <p>The slides' own answer groups the everyday tasks into four uses:</p>
    <div class="levels">${USES.map(([t, d, s]) => `<div class="lv" style="border-top-color:var(--vz-s${s})"><div class="t">${t}</div><div class="d">${d}</div></div>`).join("")}</div>
    <p>Touch is used in different ways in each (a fingertip sliding over a surface, a whole hand squeezing, a static hold), and the information overlaps only partly with other senses: geometry and softness can be guessed from vision, most of the rest cannot.</p>
    ${ex("Worked example · which sense can deliver which property", `<div class="tt-wrap"><table class="tt"><tr><th>property</th><th>${key(1)} touch</th><th>${key("g")} vision</th><th>${key(4)} hearing</th></tr>${SENSES.map(r => `<tr><td style="text-align:left">${r[0]}</td>${r.slice(1).map(v => `<td class="${v === "✓" ? "one" : ""}">${v}</td>`).join("")}</tr>`).join("")}</table></div><p>✓ measured, ~ guessed from cues (a shiny surface looks smooth, a thud sounds heavy), ✗ not available. Our filling of the slides' statement "some overlap, but mostly complementary" ${ctx}.</p>`)}
    <h2>Question 2 · Do we need touch?</h2>
    ${qbox("The experiment", ["Open a jar, remove the string inside, close the jar, tie the string around the jar.", "First with your hands, then with two tweezers. Time both runs with your phone.", "Share the results and your takeaway."])}
    <p>The tweezers keep the vision and most of the dexterity but remove the sense of touch: no force feedback, no slip detection, no conformance of the fingertip to the object. Log your two times to see the ratio:</p>
    ${lab("jar", "the jar-and-string times")}
    ${why("What the experiment models", `<p>Two tweezers are a fair model of a rigid two-finger robot gripper without tactile sensing: hard contacts, no compliance, no feedback except what the eyes see. The tasks that get slow or fail, tying the knot and regrasping the lid, are exactly the ones where the contact is occluded or where force matters, the two arguments of Lecture 1. The time ratio you measured is a one-number summary of what touch is worth for that task.</p>`)}
    <h2>Readings</h2>
    <ul class="refs">
      <li>Li, Kroemer, Su, Veiga, Kaboli &amp; Ritter (2020). A review of tactile information: perception and action through touch. IEEE Transactions on Robotics 36(6).</li>
      <li>Johansson &amp; Flanagan (2009). Coding and use of tactile signals from the fingertips in object manipulation tasks. Nature Reviews Neuroscience 10(5).</li>
    </ul>
    <p class="muted">Slides are on the <a href="${m.links.opal}" target="_blank" rel="noopener">OPAL course page ↗</a>; the lecture behind this practice is <a href="touch-sensing/lecture.html?n=1">Lecture 1</a>.</p>`;
}

// Exercise 2 – Practice 2: physiology of touch
// ======================================================================================
const EPS = [
  ["lateral motion", "texture, roughness", "rub the fingertip sideways", 1],
  ["pressure", "hardness, compliance", "press into the surface", 2],
  ["static contact", "temperature, thermal conductivity", "rest the hand on it", 3],
  ["unsupported holding", "weight", "lift it", 4],
  ["enclosure", "global shape, volume", "wrap the hand around it", 1],
  ["contour following", "exact shape", "trace the edges", 2],
];
const WORDS = ["smooth", "rough", "gritty", "silky", "sticky", "slippery", "cold", "warm", "soft", "hard", "rubbery", "brittle", "fuzzy", "ridged", "waxy", "damp", "heavy", "hollow", "sharp", "spongy"];
function aristotleSVG() {
  return `<svg viewBox="0 0 240 170" role="img" aria-label="Two crossed fingers touching one small object with their outer sides">
    <path d="M40,165 C60,120 110,95 150,58" stroke="var(--vz-s1)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M200,165 C180,120 130,95 90,58" stroke="var(--vz-s2)" stroke-width="22" fill="none" stroke-linecap="round" opacity=".92"/>
    <circle cx="120" cy="36" r="9" fill="var(--ink)"/>

    <text x="30" y="150" class="tick">index</text><text x="190" y="150" class="tick" text-anchor="end">middle</text>
    <text x="172" y="50" class="tick" style="fill:var(--vz-s1)">outer side</text><text x="68" y="50" class="tick" text-anchor="end" style="fill:var(--vz-s2)">outer side</text></svg>`;
}
function exercise2() {
  return `${head(e)}
    <p class="lead">A practice without code: after a recap of the receptors you explore objects with closed eyes, compare touching with and without moving, fool your own somatotopic map with the Aristotle illusion, and receive Home Exercise 1. Held on a Monday in the lecture hall because the Tuesday slot was given to the extra PyTorch session.</p>
    <h2>Recap of Lecture 2</h2>
    <p>Five receptor families in the skin (mechano-, thermo-, noci-, proprio- and chemoreceptors), and for the mechanoreceptors the split into rapidly adapting (Meissner, Pacinian: capture changes, dynamic stimuli) and slowly adapting (Merkel, Ruffini: capture static stimuli). The receptor figure is from Clark, Choi &amp; Douglas, <i>Biology 2e</i> (2020). Full write-up: <a href="touch-sensing/lecture.html?n=2">Lecture 2</a>.</p>
    <h2>Question 1 · What do we sense?</h2>
    ${qbox("Collect a few objects with different tactile properties, close your eyes, sense them carefully with a finger", ["Which properties can you sense? Which one dominates (weight, material, geometric features, …)?", "How would you describe it? Write down every word you can think of.", "How easy is it to distinguish the objects?"])}
    <p>The slides link a list of 400 texture words; a sample of the vocabulary, grouped by the receptor channel that most likely carries it ${ctx}:</p>
    <div class="words">${WORDS.map((w, i) => `<span class="${i < 6 ? "hi" : ""}" style="--c:var(--vz-s${i < 6 ? 2 : i < 8 ? 3 : i < 12 ? 1 : 4})">${w}</span>`).join("")}</div>
    ${leg([[2, "texture: rapidly adapting, from sliding"], [3, "thermal: thermoreceptors"], [1, "compliance: slowly adapting pressure"], [4, "shape, weight: proprioception + skin stretch"]])}
    <h2>Task 2 · Active vs passive touch</h2>
    ${qbox("Now a third party presents the objects, so you do not know which is which", ["Touch the objects without moving your fingers.", "Touch the objects while moving your fingers around."])}
    <p>The contrast is Gibson's (1962) distinction between passive touch, being touched, and active touch, touching: the same skin yields far more with movement, because sliding excites the rapidly adapting channels and because the brain can choose what to measure.</p>
    ${ex("Worked example · exploratory procedures", `<p>Lederman &amp; Klatzky (1987) found that people use a small, stereotyped set of hand movements, each tuned to one property. If a tactile property is hard to get at, the procedure is probably missing ${ctx}:</p>
      <div class="tt-wrap"><table class="tt syn"><tr><th>procedure</th><th>property</th><th>movement</th></tr>${EPS.map(([p, pr, mv, s]) => `<tr><td>${key(s)} ${p}</td><td>${pr}</td><td>${mv}</td></tr>`).join("")}</table></div>
      <p>For a robot this is the design argument for active perception: a tactile sensor on a finger that cannot move is a passive sensor, and the controller has to supply the exploratory procedure.</p>`)}
    <h2>The Aristotle illusion</h2>
    ${qbox("Try it", ["Cross your index and middle finger.", "Close your eyes and touch your nose (or a pea) with the crossing point.", "How many objects are you touching?"])}
    <div class="hands">
      <div class="hand"><b>What the skin reports</b>${aristotleSVG()}The object presses on the outer side of the index finger and the outer side of the middle finger at the same time.</div>
      <div class="hand"><b>What the brain concludes</b><p>In the normal, uncrossed hand those two outer sides face away from each other and can never touch the same object. The somatotopic map (Lecture 2: spatial adjacency is preserved in the brain) interprets the two contacts in skin coordinates and reports two objects.</p><p>The illusion shows that touch is computed in body coordinates and that the posture signal (proprioception) is not used to correct it here ${ctx}.</p></div>
    </div>
    <h2>Home Exercise 1 handed out</h2>
    <p><b>Benchmarking Digital Touch:</b> as a touch-sensing expert you help NIST design their next standard for benchmarking tactile sensors; write a short technical document (2–4 pages) that defines the experiments and their protocol, what and how for each experiment. Due 13 November. Full page: <a href="touch-sensing/exercise.html?n=h1">Home Exercise 1</a>.</p>
    <h2>Logistics for the next practices</h2>
    <p>If possible, bring a laptop with Linux. From Practice 3 on the sessions work with the sensors.</p>
    <p class="muted">Slides are on the <a href="${m.links.opal}" target="_blank" rel="noopener">OPAL course page ↗</a>.</p>`;
}

const A11 = [[3.28749502, 2.02109447], [2.96351597, 2.67578113], [2.74616036, 2.81257467], [3.6001338, 2.2393872], [3.18944582, 4.04328521], [3.40064454, 3.60451965], [2.80375306, 1.63133047]];

function exerciseX() {
  const cm = [colMean(A11, 0), colMean(A11, 1)];

    <p class="lead">A Colab notebook to get everyone to the same PyTorch level before the sensor practices: tensor manipulation and broadcasting, a LeNet-5 on MNIST, transfer learning with a pre-trained ResNet-18 on rock-paper-scissors, and finally augmentation and a validation split. The notebook is linked from the OPAL structure page (<a href="${c.colab}" target="_blank" rel="noopener">open in Colab ↗</a>).</p>
    <h2>Task 1 · Tensor manipulation</h2>
    <h3>1.1 Column means</h3>
    <p>Build the 7×2 matrix A as a tensor and take the mean of each column: the mean over dimension 0.</p>
    <div class="code"><span class="kw">import</span> torch
A = torch.tensor([[3.2875, 2.0211], [2.9635, 2.6758], [2.7462, 2.8126], [3.6001, 2.2394], [3.1894, 4.0433], [3.4006, 3.6045], [2.8038, 1.6313]])
A.mean(dim=<span class="nb">0</span>)   <span class="cm"># → tensor([${num(cm[0], 4)}, ${num(cm[1], 4)}])</span></div>
    ${ex("Worked answer", `<p>Column 1: ${A11.map(r => num(r[0], 3)).join(" + ")} = ${num(A11.reduce((a, r) => a + r[0], 0), 4)}, divided by 7 gives <b>${num(cm[0], 4)}</b>. Column 2: the sum is ${num(A11.reduce((a, r) => a + r[1], 0), 4)}, so the mean is <b>${num(cm[1], 4)}</b>. The pitfall: dim=0 means "collapse the rows", i.e. one number per column; dim=1 would give one mean per row.</p>`)}
    <h3>1.2 Broadcasting</h3>
    <p>Sum a 3×2 matrix, a 1×2 row vector and a scalar. The row vector is stretched over the three rows, the scalar over everything:</p>
    <div class="matrow">${mw(A, "A (3×2)", "t1")}<span class="op">+</span>${mw(B, "B (1×2)", "t2")}<span class="op">=</span>${mw(C, "C")}<span class="op">;</span>${mw(C, "C", "")}<span class="op">+</span>${mw([[1]], "d", "t3")}<span class="op">=</span>${mw(E, "E")}</div>
    <p>The second case is the one to remember: a row vector X (1×3) plus a column vector Y (4×1). Nothing is "wrong", PyTorch stretches both and returns a 4×3 matrix of all pairwise sums, which is rarely what a beginner expects.</p>
    <div class="matrow">${mw([X], "X (1×3)", "t1")}<span class="op">+</span>${mw(Y.map(v => [v]), "Y (4×1)", "t2")}<span class="op">=</span>${mw(XY, "X + Y (4×3)")}</div>
    ${lab("bcast", "the broadcasting rule")}
    ${why("Why this matters later in the course", `<p>Tactile images come in batches of shape (batch, channels, height, width); normalising them with a per-channel mean of shape (3, 1, 1) or subtracting a reference frame of shape (1, 3, H, W) is broadcasting. A silent 4×3 instead of an error is the kind of bug that costs an afternoon.</p>`)}
    <h2>Task 2 · LeNet on MNIST</h2>
    <p>Code a LeNet-5-like network and train it on the digits. The notebook gives the layers and asks you to put them in the right order in <code>forward</code>; the shapes tell you whether you did.</p>
    <div class="net">${LENET.map(r => `<div class="ly" style="--c:${r[4] === "g" ? "var(--vz-gray)" : `var(--vz-s${r[4]})`}"><b>${r[0]}</b><span class="sh">${r[1]}</span><span class="pr">${r[2]}</span></div>`).join("")}</div>
    ${leg([[1, "convolution"], [2, "fully connected"], ["g", "no parameters"]])}
    ${ex("Worked example · where the 256 comes from", `<p>A 5×5 convolution without padding shrinks each side by 4: 28 → 24, then max-pooling halves it to 12; the second convolution gives 8, pooling 4. Sixteen channels of 4×4 flatten to 16·4·4 = 256, which is why the first linear layer is <code>nn.Linear(256, 120)</code>. Change the kernel or add padding and that number moves; the "mat1 and mat2 shapes cannot be multiplied" error is PyTorch telling you to recompute it.</p>`)}
    ${chart("lenet")}<figcaption>Trainable parameters per layer: almost everything sits in the first fully connected layer, the convolutions are cheap. 44,426 parameters in total.</figcaption></figure>
    ${tbl(["Layer", "Output shape", "Parameters"], LENET.map(r => [r[0], r[1], r[3] ? r[3].toLocaleString("en-GB") : "0"]))}
    <h3>2b · Train it</h3>
    <p>The training loop of the notebook, step by step, with early stopping after five epochs without improvement:</p>
    <div class="steps">${["<code>optimizer.zero_grad()</code>: forget the gradients of the previous batch", "<code>outputs = net(inputs)</code>: the forward pass", "<code>loss = CrossEntropyLoss(outputs, targets)</code>: softmax and negative log-likelihood in one", "<code>loss.backward()</code>: backpropagation fills <code>.grad</code>", "<code>optimizer.step()</code>: Adam moves the weights", "after each epoch: average loss, compare with the best, stop after 5 epochs without improvement"].map((s, i) => `<div class="step"><span class="n">${i + 1}</span><span>${s}</span></div>`).join("")}</div>
    <p>The notebook's guide for picking parameters: if the loss does not decrease, play with the learning rate and the batch size; if training is too slow, fewer epochs, smaller batches or a larger learning rate; the loss is better the smaller it is. The sliders default to batch size 16, 100 epochs, learning rate 0.001. Validation accuracy is computed on the 10,000 MNIST test images with <code>argmax</code> over the ten outputs.</p>
    ${why("Two things the notebook quietly does wrong", `<p>The MNIST loader has <code>shuffle=True</code> commented out, so every epoch sees the batches in the same order; and the early stopping watches the <i>training</i> loss, which only tells you that the optimiser got stuck, not that the model generalises. Both are fixed in the last part of the notebook, where augmentation and a validation split appear ${ctx}.</p>`)}
    <h2>Task 3 · Transfer learning: rock, paper, scissors</h2>
    <p>Load <code>resnet18(weights=ResNet18_Weights.DEFAULT)</code>, pre-trained on ImageNet, download the rock-paper-scissors image set, resize everything to 224×224 and normalise with the ImageNet mean and standard deviation, replace the last layer by <code>nn.Linear(model.fc.in_features, 3)</code>, move the model and every batch to the GPU, and train with the same loop. The blanks to fill are the number of classes, the learning rate and the epochs.</p>
    ${ex("Worked example · what is actually being learned", `<p>ResNet-18 has about 11.7 million parameters; the new head has 512·3 + 3 = 1,539. The notebook fine-tunes all of them (the optimiser gets <code>model.parameters()</code>), which works with a small learning rate such as 1e-4 and a few epochs; freezing the backbone and training only the head is the cheaper alternative when data are scarce. The ImageNet normalisation is not optional: the pre-trained filters expect inputs in that range ${ctx}.</p>`)}
    <h2>Data augmentation and a validation split</h2>
    <p>The last part adds <code>RandomHorizontalFlip</code>, <code>RandomRotation(15)</code> and <code>ColorJitter</code> to the training transform, splits the training set 80/20 with <code>random_split</code>, and uses the <b>validation</b> loss for early stopping, while the test set is touched only once at the end. Three random test images are shown with the predicted and the true label, green if they match.</p>
    ${why("Why three sets", `<p>Training data fit the weights, validation data pick the stopping point and the hyper-parameters, test data estimate how the result will do on new data. If the early stopping looked at the test loss, the reported accuracy would be optimistic. Note one wrinkle in the notebook: the validation subset inherits the augmented transform of the training set, so validation images are flipped and rotated too; harmless here, but not what one usually wants ${ctx}.</p>`)}
    <p class="muted">The notebook is linked from the <a href="${m.links.opal}" target="_blank" rel="noopener">OPAL structure page ↗</a>. The session was announced as "Extra Exercise" in the calendar.</p>`;

const PROTO = [
  ["Spatial resolution", "the smallest distance between two contacts the sensor still separates", "press a two-point probe at decreasing spacings, or indent on a grid with a 1 mm pitch and report the smallest resolved pitch", 1],
  ["Force resolution and range", "the smallest force change the sensor reports, and the largest before saturation", "indent with a calibrated probe on a force-torque reference, increasing in steps; report the step at which the reading changes and the saturation level", 2],
  ["Sensitivity threshold", "the lightest touch that is detected at all", "lower the probe until the reading leaves the noise floor; repeat at several points of the surface", 2],
  ["Linearity and hysteresis", "whether loading and unloading give the same reading", "run loading-unloading cycles to the same peak force; report the maximum difference between the two branches", 3],
  ["Repeatability", "whether the same contact gives the same reading every time", "repeat one indentation N times; report the standard deviation relative to the mean", 3],
  ["Temporal response", "how fast the sensor follows a change (bandwidth, latency)", "apply a step and a frequency sweep; report rise time and the -3 dB frequency", 4],
  ["Localisation accuracy", "how far the reported contact position is from the true one", "indent at known positions on a grid; report the mean position error", 1],
  ["Durability and drift", "how the readings change over use and time", "repeat a fixed indentation for thousands of cycles and log the drift; also at several temperatures", 4],

function hystSVG(narrow) {

  const x = f => L + f / 5 * PW, y = v => T + PH - v * PH;
  const up = [], dn = []; for (let i = 0; i <= 40; i++) { const f = i / 40 * 5, s = f / 5; up.push([x(f), y(Math.pow(s, 1.4))]); dn.push([x(f), y(Math.min(1, Math.pow(s, 0.75) * 1.0))]); }
  const d = pts => "M" + pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" L");
  const xt = [0, 1, 2, 3, 4, 5].map(f => `<line class="${f ? "grid" : "axis"}" x1="${x(f)}" x2="${x(f)}" y1="${T}" y2="${T + PH}"/><text class="tick" x="${x(f)}" y="${T + PH + 16}" text-anchor="middle">${f} N</text>`).join("");
  const yt = [0, .5, 1].map(v => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Illustrative hysteresis loop: sensor reading against applied force, loading branch below the unloading branch">${xt}${yt}
    <path class="line" style="stroke:var(--vz-s1)" d="${d(up)}"/><path class="line" style="stroke:var(--vz-s2)" d="${d(dn)}"/>${gap}
    <text class="note" x="${L + PW / 2}" y="${H - 4}" text-anchor="middle">applied force (reference sensor)</text><text class="note" transform="translate(12,${T + PH / 2}) rotate(-90)" text-anchor="middle">normalised reading</text></svg>`;
}
