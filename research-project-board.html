<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Project · CMS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="research-project/rp.css">
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="research-project/rp.js"></script>
</head>
<body class="rp">
<header class="sitebar" data-page="course"></header>
<div class="wrap" id="page"></div>
<script>
// Board: header, status bar, sprints, one card per paper (the reading list of the project), proposals, slide decks and the Orga card.
const { m, c, esc, U, CODE, fmt, cite, paperUrl } = RP;
const papers = c.papers.map(p => `<a class="game-card paper ${p.covered ? "" : "soon"}" href="${paperUrl(p)}">
    <div class="game-icon">${p.icon}</div>
    <h2>${esc(p.title)}</h2>
    <p class="cite">${esc(p.authors.map(a => a.split(" ").slice(-1)[0]).join(", "))} · ${p.year}${p.date ? ` · shared ${fmt(p.date)}` : ""}</p>
    <p>${esc(p.blurb)}</p>
    ${U.doneBox(`${CODE}:paper:${p.n}`, "read")}
  </a>`).join("");
const proposals = (c.proposals || []).map(p => `<a class="game-card paper" href="research-project/${p.slug}.html">
    <div class="game-icon">${p.icon}</div>
    <h2>${esc(p.title)}</h2>
    <p class="cite">Proposal · drafted ${fmt(p.date)}</p>
    <p>${esc(p.blurb)}</p>
    ${U.doneBox(`${CODE}:proposal:${p.n}`, "discussed")}
  </a>`).join("");
const decks = (c.decks || []).map(d => `<div class="game-card paper deck">
    <a class="deck-main" href="research-project/${d.slug}.html">
      <div class="game-icon">${d.icon}</div>
      <h2>${esc(d.title)}</h2>
      <p class="cite">Slides · ${d.slides} slides · ${fmt(d.date)}</p>
      <p>${esc(d.blurb)}</p>
    </a>
    ${d.artifact ? `<p class="deck-alt"><a href="${esc(d.artifact)}" target="_blank" rel="noopener">Slides artifact on claude.ai ↗</a> <span class="muted">(opens only for you until shared)</span></p>` : ""}
    ${U.doneBox(`${CODE}:deck:${d.n}`, "seen")}
  </div>`).join("");
const sprints = (c.sprints || []).map(s => `<section class="game-card sprint">
    <div class="game-icon">${s.icon}</div>
    <h2>${esc(s.title)}</h2>
    <p class="cite">${esc(s.project)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cwe)}</a> in <a href="${esc(s.view)}" target="_blank" rel="noopener">CWE-699</a></p>
    <p>${esc(s.focus)}</p>
    <div class="sprint-grid">
      <div><h3>Task</h3><ol>${s.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ol></div>
      <div><h3>Notes</h3><ul>${s.notes.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
        <dl>${s.setup.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
    </div>
    ${U.doneBox(`${CODE}:sprint:${s.n}`)}
  </section>`).join("");
const orga = `<a class="game-card" href="research-project/orga.html">
    <div class="game-icon">🗂️</div>
    <h2>Orga</h2>
    <p>The project brief, your team and supervisor, the timeline so far, how the group works, the deliverable and the module's grading.</p>
  </a>`;
document.getElementById("page").innerHTML = `
  <p class="crumbs"><a href="index.html">Dashboard</a> / ${esc(m.name)}</p>
  <header class="hero">
    <h1>🔬 ${esc(c.project)}</h1>
    <p class="subtitle">${CODE} · ${esc(m.name)} · ${esc(CMS.semester)} · ${esc(c.group)}</p>
  </header>
  ${RP.topbar()}
  <main>
    ${sprints ? `<div class="board-h"><h2>Sprints</h2><span class="muted">your assigned work · tick “done” once the sprint is finished</span></div>
    <div class="game-cards">${sprints}</div>` : ""}
    <div class="board-h"><h2>Papers</h2><span class="muted">${c.papers.length} ${c.papers.length === 1 ? "paper" : "papers"} so far · tick “read” once you have worked through one</span></div>
    <p class="muted board-note">${esc(c.paperNote)}</p>
    <div class="game-cards">${papers}</div>
    ${proposals ? `<div class="board-h"><h2>Proposals</h2><span class="muted">tick “discussed” once it went through a supervisor meeting</span></div>
    <p class="muted board-note">${esc(c.proposalNote)}</p>
    <div class="game-cards">${proposals}</div>` : ""}
    ${decks ? `<div class="board-h"><h2>Slides</h2><span class="muted">tick “seen” once you have gone through a deck</span></div>
    <p class="muted board-note">${esc(c.deckNote)}</p>
    <div class="game-cards">${decks}</div>` : ""}
    <div class="board-h"><h2>Project</h2><span class="muted">no timetabled sessions; meetings and milestones go into Orga</span></div>
    <div class="game-cards">${orga}</div>
  </main>`;
U.wireDone();
</script>
</body>
</html>
