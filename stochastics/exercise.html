const ans = items => `<div class="ans">${items.map(([v, l]) => `<div class="a"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
const why = (t, body) => `<div class="why"><div class="kicker">${t}</div>${body}</div>`;

// ---------------- Write-ups: one function per exercise, registered in WRITEUPS below ----------------
// function exercise1() { return `${head(e)}<p class="lead">…</p>${task("1", 4, "…", `<p>…</p>${ans([["42", "answer"]])}`)}<h2>Before the session</h2><ul>…</ul>`; }

function placeholder() {

  return `${head(e)}
    <div class="box placeholder">

// ---------------- Shared helpers ----------------
const mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const tiles = items => `<div class="tiles">${items.map(([v, l]) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
const cap = t => `<figcaption>${t}</figcaption></figure>`;
const lecLink = (n, t) => `<a href="stochastics/lecture.html?n=${n}">${t || `lecture ${n}`}</a>`;
const before = (t, items) => `<div class="before"><div class="kicker">${t}</div><ol>${items.map(i => `<li>${i}</li>`).join("")}</ol></div>`;
const frac36 = k => `${k}/36`;

// ================= Tutorial 1 · Probability refresher 2 (Pluto notebook SMS_T01, 29 Oct) =================
// Screening test of section 1.1: 1000 people as one segmented bar (ill/healthy × positive/negative).
const SCR = [["ill, test positive", 45, 1], ["ill, test negative", 5, 3], ["healthy, test positive", 95, 2], ["healthy, test negative", 855, 4]];
CHARTS.screen = narrow => {
  const W = narrow ? 340 : 600, H = 76, L = 4, R = 4, PW = W - L - R, gap = 2; let x = L;
  const segs = SCR.map(([k, n, s]) => { const w = n / 1000 * PW - gap, x0 = x; x += n / 1000 * PW;
    return `<g class="pt" tabindex="0" data-tip="${esc(`<b>${k}</b>${n} of 1000 people (${pct(n / 1000)})`)}"><rect class="seg s${s}" x="${x0}" y="12" width="${Math.max(w, 1)}" height="34" rx="3"/>${w > 40 ? `<text class="val" x="${x0 + w / 2}" y="${34}" text-anchor="middle" style="fill:#fff">${n}</text>` : ""}</g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Segmented bar of 1000 people: 45 ill and positive, 5 ill and negative, 95 healthy and positive, 855 healthy and negative. Of the 140 positives only 45 are ill.">${segs}<text class="note" x="${L}" y="${H - 10}">← 140 test positive: 45 ill, 95 healthy</text><text class="note" x="${W - R}" y="${H - 10}" text-anchor="end">860 test negative →</text></svg>`;
};
// Weather tree of section 1.2: two days, four sequences.
CHARTS.tree = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 250 : 240, x0 = narrow ? 24 : 60, x1 = narrow ? 150 : 250, x2 = narrow ? 268 : 440, cy = H / 2;
  const d1 = [["sun", 0.7, cy - 58], ["rain", 0.3, cy + 58]], leaves = [["sun", "sun", 0.8, cy - 90], ["sun", "rain", 0.2, cy - 30], ["rain", "sun", 0.4, cy + 30], ["rain", "rain", 0.6, cy + 90]];
  const p1 = Object.fromEntries(d1.map(([w, p]) => [w, p])), y1 = Object.fromEntries(d1.map(([w, , y]) => [w, y]));
  const nodes = d1.map(([w, p, y]) => `<line class="edge" x1="${x0}" y1="${cy}" x2="${x1}" y2="${y}"/><text class="tick" x="${(x0 + x1) / 2 - 6}" y="${(cy + y) / 2 - 6}" text-anchor="middle">${p}</text><circle class="node ${w}" cx="${x1}" cy="${y}" r="7"/><text class="cat" x="${x1}" y="${y + (w === "sun" ? -12 : 20)}" text-anchor="middle">day 1: ${w}</text>`).join("");
  const lv = leaves.map(([a, b, p, y]) => { const pr = p1[a] * p;
    return `<g class="pt" tabindex="0" data-tip="${esc(`<b>${a} then ${b}</b>P(X₁ = ${a}) · P(X₂ = ${b} | X₁ = ${a}) = ${p1[a]} · ${p} = ${num(pr, 2)}`)}"><line class="edge" x1="${x1}" y1="${y1[a]}" x2="${x2}" y2="${y}"/><text class="tick" x="${(x1 + x2) / 2}" y="${(y1[a] + y) / 2 - 5}" text-anchor="middle">${p}</text><rect class="leaf" x="${x2 - 4}" y="${y - 13}" width="${narrow ? 72 : 120}" height="26" rx="6"/><circle class="node ${b}" cx="${x2 + 8}" cy="${y}" r="5"/><text class="cat" x="${x2 + 18}" y="${y + 4}">${narrow ? "" : `${a}, ${b}: `}${num(pr, 2)}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Probability tree for two days of weather. Day 1 is sun with 0.7 or rain with 0.3; given sun, day 2 is sun with 0.8 or rain with 0.2; given rain, sun with 0.4 or rain with 0.6. The four sequences have probabilities 0.56, 0.14, 0.12 and 0.18, which sum to 1.">
    <circle class="node" cx="${x0}" cy="${cy}" r="7" style="fill:var(--vz-gray)"/><text class="cat" x="${x0}" y="${cy + 22}" text-anchor="middle">start</text>${nodes}${lv}</svg>`;
};
// Sum of two dice (section 3): PMF bars and the CDF as a step line.
const SP = Array.from({ length: 11 }, (_, i) => 6 - Math.abs(i + 2 - 7)), SF = SP.map((_, i) => SP.slice(0, i + 1).reduce((a, b) => a + b, 0));
CHARTS.dice = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 220 : 250, L = narrow ? 34 : 44, R = narrow ? 34 : 44, T = 16, B = 32, PW = W - L - R, PH = H - T - B, bw = PW / 11;
  const yp = v => T + PH - v / 36 * PH * 6, yf = v => T + PH - v / 36 * PH;
  const bars = SP.map((k, i) => { const x0 = L + i * bw + bw * 0.22, w = bw * 0.56, s = i + 2;
    return `<g class="pt" tabindex="0" data-tip="${esc(`<b>sum ${s}</b>p(${s}) = ${frac36(k)} = ${num(k / 36, 3)}<br>F(${s}) = P(X ≤ ${s}) = ${frac36(SF[i])} = ${num(SF[i] / 36, 3)}`)}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${PH}"/><path class="bar s1" d="${vbar(x0, w, yp(k), T + PH)}"/><text class="cat" x="${x0 + w / 2}" y="${H - 12}" text-anchor="middle">${s}</text></g>`; }).join("");
  const step = "M" + SF.map((f, i) => `${L + i * bw},${yf(i ? SF[i - 1] : 0)} L${L + i * bw},${yf(f)} L${L + (i + 1) * bw},${yf(f)}`).join(" L");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of the probability of each sum of two dice, from 1/36 at 2 and 12 to 6/36 at 7, with the cumulative distribution as a staircase from 0 to 1 overlaid.">
    ${[0, 1, 2, 3, 4, 5, 6].map(k => `<line class="${k ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${yp(k)}" y2="${yp(k)}"/><text class="tick" x="${L - 5}" y="${yp(k) + 4}" text-anchor="end">${k}/36</text>`).join("")}
    ${[0, 0.5, 1].map(f => `<text class="tick" x="${W - R + 5}" y="${yf(f * 36) + 4}">${f}</text>`).join("")}
    <text class="note" x="${L - 30}" y="10">p(x)</text><text class="note" x="${W - R + 2}" y="10">F(x)</text>${bars}<path class="step" d="${step}"/></svg>`;
};
// Density f(x) = 2x on [0, 1] (section 4): the shaded area is P(0.2 ≤ X ≤ 0.5) = 0.21; the CDF x² beside it.
CHARTS.dens = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 300 : 200, two = !narrow, pw = two ? (W - 70) / 2 : W - 50, ph = two ? H - 44 : (H - 70) / 2;
  const panel = (ox, oy, f, fmax, title, area) => { const x = v => ox + 34 + v * (pw - 40), y = v => oy + 14 + (ph - 36) * (1 - v / fmax);
    const pts = Array.from({ length: 51 }, (_, k) => k / 50), path = "M" + pts.map(v => `${x(v).toFixed(1)},${y(f(v)).toFixed(1)}`).join(" L");
    const ar = area ? `<path class="area" d="M${x(0.2)},${y(0)} L${x(0.2)},${y(f(0.2))} L${x(0.5)},${y(f(0.5))} L${x(0.5)},${y(0)} Z"/>` : `<line class="ann" x1="${x(0.2)}" x2="${x(0.2)}" y1="${y(0)}" y2="${y(0.04)}" stroke-dasharray="3 2"/><line class="ann" x1="${x(0.5)}" x2="${x(0.5)}" y1="${y(0)}" y2="${y(0.25)}" stroke-dasharray="3 2"/><line class="ann" x1="${x(0)}" x2="${x(0.5)}" y1="${y(0.25)}" y2="${y(0.25)}" stroke-dasharray="3 2"/><line class="ann" x1="${x(0)}" x2="${x(0.2)}" y1="${y(0.04)}" y2="${y(0.04)}" stroke-dasharray="3 2"/>`;
    return `<text class="note" x="${ox + 34}" y="${oy + 8}">${title}</text><line class="axis" x1="${x(0)}" x2="${x(1)}" y1="${y(0)}" y2="${y(0)}"/><line class="axis" x1="${x(0)}" x2="${x(0)}" y1="${y(0)}" y2="${y(fmax)}"/>
      ${[0, 0.5, 1].map(v => `<text class="tick" x="${x(v)}" y="${y(0) + 14}" text-anchor="middle">${v}</text>`).join("")}<text class="tick" x="${x(0) - 5}" y="${y(fmax) + 4}" text-anchor="end">${fmax}</text>${ar}<path class="line" d="${path}"/>`; };
  const tipA = esc("<b>P(0.2 ≤ X ≤ 0.5)</b>area under 2x from 0.2 to 0.5<br>= 0.5² − 0.2² = 0.21"), tipB = esc("<b>Same probability on the CDF</b>F(0.5) − F(0.2) = 0.25 − 0.04 = 0.21");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Two panels. Left: the density f(x) = 2x on 0 to 1, a straight line from 0 to 2, with the area between 0.2 and 0.5 shaded, 0.21. Right: the cumulative distribution x squared, where the same probability is the rise from 0.04 to 0.25.">
    <g class="pt" tabindex="0" data-tip="${tipA}"><rect class="hit" x="0" y="0" width="${two ? W / 2 : W}" height="${two ? H : H / 2}"/>${panel(0, 0, v => 2 * v, 2, "density f(x) = 2x, shaded: P(0.2 ≤ X ≤ 0.5) = 0.21", true)}</g>
    <g class="pt" tabindex="0" data-tip="${tipB}"><rect class="hit" x="${two ? W / 2 : 0}" y="${two ? 0 : H / 2}" width="${two ? W / 2 : W}" height="${two ? H : H / 2}"/>${panel(two ? W / 2 + 10 : 0, two ? 0 : H / 2, v => v * v, 1, "CDF F(x) = x²: F(0.5) − F(0.2) = 0.21", false)}</g></svg>`;
};
// Explorer: running mean of die rolls against E[X] = 3.5 (section 5.5, law of large numbers).
const LLN = { seed: 1, N: 500 };
function initLln(body) {
  body.innerHTML = `<div class="ctl"><label>Rolls <select>${[20, 100, 500, 2000].map(n => `<option value="${n}"${n === LLN.N ? " selected" : ""}>${n}</option>`).join("")}</select></label><button class="preset" type="button">New rolls</button></div><div class="out"></div>`;
  const sel = body.querySelector("select"), btn = body.querySelector("button"), out = body.querySelector(".out");
  const draw = () => { const W = 560, H = 200, L = 30, R = 10, T = 10, B = 24, PW = W - L - R, PH = H - T - B, rng = mulberry(LLN.seed * 131);
    const x = i => L + i / LLN.N * PW, y = v => T + PH - (v - 1) / 5 * PH; let sum = 0; const runs = [];
    for (let s = 0; s < 4; s++) { sum = 0; const pts = []; for (let i = 1; i <= LLN.N; i++) { sum += 1 + Math.floor(rng() * 6); pts.push([i, sum / i]); } runs.push(pts); }
    const last = runs.map(p => p[p.length - 1][1]);
    out.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="Running means of four sequences of ${LLN.N} die rolls, converging towards 3.5.">
        ${[1, 2, 3, 3.5, 4, 5, 6].map(v => `<line class="${v === 3.5 ? "ann" : "grid"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"${v === 3.5 ? ' stroke-dasharray="4 3"' : ""}/><text class="tick" x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
        ${[0, 0.25, 0.5, 0.75, 1].map(f => `<text class="tick" x="${x(f * LLN.N)}" y="${H - 8}" text-anchor="middle">${Math.round(f * LLN.N)}</text>`).join("")}
        ${runs.map(p => `<path class="line" style="opacity:.75" d="M${p.map(([i, v]) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" L")}"/>`).join("")}<text class="note" x="${W - R}" y="${y(3.5) - 5}" text-anchor="end">E[X] = 3.5</text></svg>
      <dl class="ro"><dt>After ${LLN.N} rolls</dt><dd>means ${last.map(v => num(v, 3)).join(", ")} · the spread of the mean shrinks like σ/√N = 1.71/√${LLN.N} ≈ ${num(Math.sqrt(35 / 12 / LLN.N), 3)}</dd></dl>`; };
  sel.addEventListener("change", () => { LLN.N = +sel.value; draw(); }); btn.addEventListener("click", () => { LLN.seed++; draw(); }); draw();
}
// Explorer: the sum of k uniform numbers, standardised, against the normal density (section 6.1 and exercise 9).
const CLT = { k: 2, seed: 1 };
function initClt(body) {
  body.innerHTML = `<div class="ctl"><label>Terms k <select>${[1, 2, 3, 5, 12].map(k => `<option value="${k}"${k === CLT.k ? " selected" : ""}>${k}</option>`).join("")}</select></label><button class="preset" type="button">New sums</button></div><div class="out"></div>`;
  const sel = body.querySelector("select"), btn = body.querySelector("button"), out = body.querySelector(".out");
  const draw = () => { const k = CLT.k, rng = mulberry(CLT.seed * 977 + k), M = 8000, bins = 32, lo = -4, hi = 4, bw = (hi - lo) / bins, cnt = new Array(bins).fill(0), sd = Math.sqrt(k / 12), mu = k / 2;
    for (let i = 0; i < M; i++) { let s = 0; for (let j = 0; j < k; j++) s += rng(); const z = (s - mu) / sd, b = Math.floor((z - lo) / bw); if (b >= 0 && b < bins) cnt[b]++; }
    const W = 560, H = 200, L = 30, R = 10, T = 10, B = 24, PW = W - L - R, PH = H - T - B, x = z => L + (z - lo) / (hi - lo) * PW, y = d => T + PH - d / 0.5 * PH;
    const bars = cnt.map((n, b) => `<rect class="hbar" x="${x(lo + b * bw) + 1}" y="${y(n / M / bw)}" width="${PW / bins - 2}" height="${T + PH - y(n / M / bw)}"/>`).join("");
    const pdf = "M" + Array.from({ length: 161 }, (_, i) => { const z = lo + i / 160 * (hi - lo); return `${x(z).toFixed(1)},${y(Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI)).toFixed(1)}`; }).join(" L");
    out.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="Histogram of 8000 standardised sums of ${k} uniform numbers against the standard normal density.">
        ${[0, 0.2, 0.4].map(d => `<line class="${d ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(d)}" y2="${y(d)}"/><text class="tick" x="${L - 5}" y="${y(d) + 4}" text-anchor="end">${d}</text>`).join("")}
        ${[-4, -2, 0, 2, 4].map(z => `<text class="tick" x="${x(z)}" y="${H - 8}" text-anchor="middle">${z}</text>`).join("")}${bars}<path class="line k2" d="${pdf}"/><text class="note" x="${W - R}" y="${T + 10}" text-anchor="end">N(0, 1) density</text></svg>
      <dl class="ro"><dt>S<sub>${k}</sub></dt><dd>mean k/2 = ${num(mu, 1)}, variance k/12 = ${num(k / 12, 3)}; plotted is (S − ${num(mu, 1)}) / ${num(sd, 3)}</dd><dt>Shape</dt><dd>${k === 1 ? "flat: one uniform is not normal at all" : k === 2 ? "a triangle: the sum of two uniforms" : k < 5 ? "already bell-shaped, with slightly short tails" : "close to the normal curve; for k = 12 the scaling is exactly exercise 9's Z = ΣU − 6"}</dd></dl>`; };
  sel.addEventListener("change", () => { CLT.k = +sel.value; draw(); }); btn.addEventListener("click", () => { CLT.seed++; draw(); }); draw();
}

function exercise1() {
  const fam = [["Binomial Bin(n, p)", "number of successes in n independent two-outcome trials", "n p", "n p (1 − p)"], ["Uniform U(a, b)", "every value in [a, b] equally likely", "(a + b)/2", "(b − a)²/12"], ["Normal N(μ, σ²)", "symmetric bell curve around μ", "μ", "σ²"], ["Poisson Poiss(λ)", "number of events at a constant rate", "λ", "λ"], ["Exponential Exp(λ)", "waiting time until the next event", "1/λ", "1/λ²"]];
  return `${head(e)}
    <p class="lead">The first tutorial is a Pluto notebook (Julia) rather than a sheet: "Probability Refresher 2: Random Variables and Distributions", dated 29 October. It picks up where ${lecLink(1, "lecture 1")} stops, with the formulas from the lecture in a box at the top, and then builds the second half of the refresher out of interactive figures and quick checks: sequences and the chain rule, the three types of random variables, PMF and CDF, densities, joint distributions, moments, the common families and the central limit theorem. A block of nine exercises closes it. The notebook reached OPAL (Exercises2026) on 1 November, after the session; the numbers below follow its own questions and reveal cells, recomputed here.</p>

    <h2>1 · Several events: the screening test, sequences, the chain rule</h2>
    <p>A screening test is applied to 1000 people: 50 are ill, of whom 45 test positive; 950 are healthy, of whom 95 test positive. The notebook lets you condition on "everybody", "ill", "healthy", "positive" or "negative" and watch the table shrink to the condition: that is what P(A | B) means.</p>
    ${chart("screen", leg([[1, "ill, positive"], [3, "ill, negative"], [2, "healthy, positive"], [4, "healthy, negative"]]))}${cap("The notebook's table as one bar. P(ill ∩ positive) = 45/1000 = 0.045 in whichever order it is written; P(positive | ill) = 45/50 = 0.9, but P(ill | positive) = 45/140 = 0.321; P(positive) = 0.9 · 0.05 + 0.1 · 0.95 = 0.14 by total probability. Ill and positive are not independent, because 0.9 ≠ 0.14.")}
    <p><b>Sequences.</b> The weather on two days, each sun or rain: P(X₁ = sun) = 0.7, and given sun, day 2 is sun with 0.8; given rain, day 2 is sun with 0.4. A comma lists values in time order, so P(X₁ = rain, X₂ = sun) = 0.3 · 0.4 = 0.12 is not P(X₁ = sun, X₂ = rain) = 0.7 · 0.2 = 0.14. Three things that look alike and are not: P(A ∩ B) = P(B ∩ A) always; P(A | B) ≠ P(B | A) in general; a sequence changes when its values are swapped.</p>
    ${chart("tree")}${cap("All sequences of two days; hover a leaf for its product. The four probabilities add up to 1. Reading the tree backwards: P(X₁ = rain | X₂ = sun) = 0.12 / (0.56 + 0.12) = 0.176, not the 0.4 of the forward branch.")}
    <p><b>The chain rule</b> is the tree with more levels: P(A₁ ∩ … ∩ A<sub>n</sub>) = P(A₁) P(A₂ | A₁) ⋯ P(A<sub>n</sub> | A₁ ∩ … ∩ A<sub>n−1</sub>), one factor per event, each conditioned on everything before. With three days the third factor is conditioned on both earlier days (0.7 · 0.8 · 0.15 = 0.084 for sun, sun, rain in the notebook's figure). <b>Memory</b> is how far back the conditioning reaches: no memory means P(X₃), memory of the last day means P(X₃ | X₂), full memory means P(X₃ | X₁, X₂). With memory of the last day a ten-day model needs only three conditional distributions (day 1, and one per possible previous weather); with no memory the chain rule collapses to a product of marginals, which is independence. The birthday problem is section 1.5, with a one-room animation and a many-rooms histogram; its curve is in ${lecLink(1, "lecture 1")}.</p>

    <h2>2 · Random variables</h2>
    <p>One die roll, three questions: was it a six (an indicator I with values 0 and 1), which number is on top (a discrete X with values 1 … 6), how long did the die roll before stopping (a continuous T in an interval of times). A random variable is a fixed function X: Ω → ℝ, ω ↦ X(ω); the randomness is in the outcome ω. Capital X is the variable, small x one of its values, and {X = x} is an event. The number of cars in a 500-place car park is discrete (501 listable values); a body temperature is continuous even when the thermometer rounds it. Rolling the die many times gives three different pictures of the same rolls, one per variable.</p>

    <h2>3 · Discrete distributions: the sum of two dice</h2>
    <p>The 36 ordered pairs of faces are equally likely; the sum x occurs in 6 − |x − 7| of them. The probability mass function is p<sub>X</sub>(x) = P(X = x), between 0 and 1 and summing to 1. The cumulative distribution function F<sub>X</sub>(x) = P(X ≤ x) adds the bars up to x: never decreasing, 0 below the smallest value, 1 above the largest, a jump of p<sub>X</sub>(x<sub>i</sub>) at each value and flat in between, so F(4.5) = F(4) = 6/36.</p>
    ${chart("dice", leg([[1, "PMF p(x), left axis"], [2, "CDF F(x), right axis"]]))}${cap("Figure 3.1 and 3.2 of the notebook in one chart, computed here. Intervals come from differences of the CDF: P(3 < X ≤ 6) = F(6) − F(3) = 15/36 − 3/36 = 12/36; P(3 ≤ X < 6) = F(5) − F(2) = 9/36; P(X > 9) = 1 − F(9) = 6/36; P(4 ≤ X ≤ 7) = F(7) − F(3), not F(7) − F(4).")}
    <p><b>Two discrete variables</b> of the same roll, the first die X and the sum Y, are described by a joint table P<sub>X,Y</sub>(x, y). Marginals are row and column sums, conditionals are rescaled rows: P<sub>Y|X</sub>(y | x) = P<sub>X,Y</sub>(x, y) / P<sub>X</sub>(x). Given X = 4 the sum is 9 only if the second die shows 5, so P(Y = 9 | X = 4) = 1/6, while the marginal P<sub>Y</sub>(9) = 4/36 = 1/9: the first die and the sum are not independent, although the two dice are.</p>

    <h2>4 · Continuous distributions</h2>
    <p>Tomorrow's noon temperature takes a different value every day, so values cannot be counted one by one; they are grouped into bins. The notebook's task: with counts the tallest bar changes with the bin width, with relative frequencies it still does, and only "fraction per °C" (count / (N · width)) settles down as the days pile up, towards a curve. That curve is the density: for a narrow bin around x the fraction of days is f<sub>X</sub>(x) Δx. Formally, P(a ≤ X ≤ b) = ∫<sub>a</sub><sup>b</sup> f<sub>X</sub>(x) dx, f ≥ 0, the total area is 1, F<sub>X</sub>(x) = ∫<sub>−∞</sub><sup>x</sup> f, and f = dF/dx.</p>
    ${chart("dens")}${cap("Question 4.2 and 4.3 of the notebook: f(x) = 2x on [0, 1] has total area 1, P(0.2 ≤ X ≤ 0.5) = 0.5² − 0.2² = 0.21, and the CDF is x². Hover a panel for the computation.")}
    <p><b>Height or area.</b> For a discrete variable the height of a bar is a probability. For a continuous one the height f(x) is not: f(1) = 2 for this density, and nothing is wrong, because only areas are probabilities. A single value has width 0, so P(X = 0.5) = 0, which does not mean 0.5 is impossible. The CDF is steepest where the density is largest. <b>Reading the CDF backwards</b>, x = F<sub>X</sub><sup>−1</sup>(u), turns a uniform height u into a value with the distribution of X: random heights land densely where the CDF is steep. This inverse-transform idea is the first sampling algorithm of ${lecLink(2, "lecture 2")}.</p>
    <p><b>Two continuous variables.</b> A penalty kick crosses the goal line at (X, Y); where kicks are dense the joint density f<sub>X,Y</sub> is high, a mountain over the goal. Marginals squash the mountain onto one axis, f<sub>X</sub>(x) = ∫ f<sub>X,Y</sub>(x, y) dy; a conditional density is a slice at height y divided by the slice's area f<sub>Y</sub>(y); the joint CDF F<sub>X,Y</sub>(x, y) is the volume below and to the left of (x, y), and F<sub>X</sub>(x) = F<sub>X,Y</sub>(x, ∞). Independence means f<sub>X,Y</sub> = f<sub>X</sub> f<sub>Y</sub>. For f(x, y) = x + y on the unit square: total volume 1, f<sub>X</sub>(x) = x + ½, and P(X ≤ ½, Y ≤ ½) = 1/8.</p>

    <h2>5 · Moments</h2>
    <p>To compare two distributions, each is summarised by numbers: location, spread, then shape. The moment of order μ is M<sub>μ</sub>[X] = Σ x<sup>μ</sup> p<sub>X</sub>(x) (discrete) or ∫ x<sup>μ</sup> f<sub>X</sub>(x) dx (continuous). M₀ = 1 is the area; M₁ = E[X] is the centroid, where the distribution balances; Var(X) = M₂ − M₁² = E[(X − E[X])²] is the spread, the moment of inertia in mechanics; order 3 (skewness) measures asymmetry and order 4 (kurtosis) the tails. Two distributions with the same mean and variance can still differ, in asymmetry or in the tails; only for families like the normal do the first two moments fix everything.</p>
    ${tiles([["3.5", "E[X] of a fair die"], ["91/6 ≈ 15.17", "M₂ of a fair die"], ["35/12 ≈ 2.92", "Var of a fair die"], ["5 · 100/12", "mean · variance of U(0, 10)"]])}
    <p><b>Covariance</b> Cov(X, Y) = E[(X − E[X])(Y − E[Y])] is positive when X above its mean goes with Y above its mean (temperature and ice-cream sales), negative when one is high while the other is low (temperature and hot-drink sales, sunshine and umbrellas), and zero for two separate dice; independent variables have zero covariance. It enters the variance of a sum: Var(X + Y) = Var(X) + Var(Y) + 2 Cov(X, Y). <b>Distribution versus data:</b> E[X] and Var(X) belong to the distribution and are fixed numbers; x̄ = Σ x<sub>i</sub>/n and s² = Σ (x<sub>i</sub> − x̄)² / (n − 1) are estimates from data. The law of large numbers says the sample mean of i.i.d. variables converges to E[X].</p>
    ${lab("lln", "running means of die rolls, the law of large numbers")}

    <h2>6 · Common distributions and the central limit theorem</h2>
    <div class="tt-wrap"><table class="tt fs"><tr><th>Family</th><th>What it counts or measures</th><th>Mean</th><th>Variance</th></tr>${fam.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div>
    <p>The notebook's quick checks: ten students each choose tea with probability 0.6, so P(exactly 7 tea) = C(10, 7) 0.6⁷ 0.4³ = 0.215 and 6 are expected; four coin tosses give exactly two heads with probability 6/16; five die rolls show no six with probability (5/6)⁵ = 0.402; a machine failing once per 10 hours on average runs more than 20 hours with probability e<sup>−2</sup> = 0.135.</p>
    <p>A Galton board drops balls through n rows of pins; the slot is the sum of n Bernoulli bounces, Bin(n, p), and the pile looks like a bell. The <b>central limit theorem</b> says why: the sum S<sub>k</sub> of k independent variables with the same distribution, mean μ and finite variance σ², is approximately N(kμ, kσ²) for large k, whatever the distribution of each term. Many measured quantities are sums of many small random parts, hence the normal distribution everywhere.</p>
    ${lab("clt", "sum of k uniform numbers against the normal curve")}
    <p><b>Distributions without a scale.</b> Zoom out on a density through the windows [1, 10], [10, 100], [100, 1000], each rescaled to the same axes. A power law f(x) ∝ x<sup>−2.5</sup> looks the same in all three: it has no characteristic scale. The exponential and the normal do not survive the zoom. Scale-free distributions are the last item of ${lecLink(1, "lecture 1")}'s topic list in the OPAL overview.</p>

    <h2>7 and 8 · Why sampling, and a notation check</h2>
    <p>Section 7 previews the course: uniform numbers pushed through the CDF produce simulated temperatures that follow the model, and a hiker's position known only as a probability landscape is explored by sampling. Section 8 is a card deck of notation: P(A ∩ B) versus P(A | B) versus the sequence P(X₁ = a, X₂ = b); X versus x; p<sub>X</sub>(x), F<sub>X</sub>(x), f<sub>X</sub>(x). Worth a minute before the exercises.</p>

const fx = (tex, plain) => `<span class="tex" data-tex="${esc(tex)}">${plain}</span>`;
function typeset(root) {

  });

}
const exeLink = (n, t) => `<a href="stochastics/exercise.html?n=${n}">${t || `tutorial ${n}`}</a>`;
const fl = (tex, plain, note) => `<span class="fl">${fx(tex, plain)}${note ? `<span class="fn">${note}</span>` : ""}</span>`;
const gauss = r => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
const halton = (k, b) => { let f = 1, v = 0; while (k > 0) { f /= b; v += f * (k % b); k = Math.floor(k / b); } return v; };
// Axis helpers for the fixed-width explorer SVGs (viewBox 560 wide, scaled down on phones).
const yAxis = (L, W, R, y, vals, f = v => v) => vals.map(v => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${f(v)}</text>`).join("");
const xTicks = (x, yb, vals, f = v => v) => vals.map(v => `<text class="tick" x="${x(v)}" y="${yb}" text-anchor="middle">${f(v)}</text>`).join("");
const pathOf = (pts, x, y) => "M" + pts.map(([a, b]) => `${x(a).toFixed(1)},${y(b).toFixed(1)}`).join(" L");

// Explorer: the linear congruential generator as jumps on a clock with m positions (section 1.1, Figure 1.1).
const LCG = { m: 31, a: 3, c: 0, z0: 1 };
function lcgRun({ m, a, c, z0 }) {
  const zs = [z0 % m], seen = new Map([[z0 % m, 0]]);
  for (;;) { const z = (a * zs[zs.length - 1] + c) % m; if (seen.has(z)) return { zs, start: seen.get(z), T: zs.length - seen.get(z) }; seen.set(z, zs.length); zs.push(z); }
}
function lcgOut() {
  const { m } = LCG, { zs, start, T } = lcgRun(LCG), S = 240, cx = S / 2, cy = S / 2, r = 96;
  const pos = z => { const t = Math.PI / 2 - 2 * Math.PI * z / m; return [cx + r * Math.cos(t), cy - r * Math.sin(t)]; };
  const dots = Array.from({ length: m }, (_, z) => { const [px, py] = pos(z), on = zs.includes(z), [lx, ly] = [cx + (r + 14) * (px - cx) / r, cy + (r + 14) * (py - cy) / r];
    return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${on ? 3.6 : 2.4}" class="${on ? "on" : "off"}"/>${m <= 16 || z % 5 === 0 ? `<text class="tick" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${z}</text>` : ""}`; }).join("");
  const seg = (i, cls) => { const [x1, y1] = pos(zs[i]), [x2, y2] = pos(i + 1 < zs.length ? zs[i + 1] : zs[start]); return `<line class="${cls}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; };
  const jumps = zs.map((_, i) => seg(i, i < start ? "tail" : "cyc")).join("");
  const [sx, sy] = pos(zs[0]), seq = zs.slice(0, 14).join(", ") + (zs.length > 14 ? ", …" : ""), full = T === m, best0 = LCG.c === 0 && T === m - 1 && !zs.includes(0);
  return `<div class="pi-wrap"><svg viewBox="0 0 ${S} ${S}" class="pi t2-clock" role="img" aria-label="LCG with m = ${m}, a = ${LCG.a}, c = ${LCG.c}, seed ${LCG.z0}: the states jump around a clock of ${m} positions and repeat after a period of ${T}; ${new Set(zs).size} positions are visited.">
      ${jumps}${dots}<circle class="start" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6.5"/></svg>
    <dl class="ro"><dt>States</dt><dd>z = ${seq}</dd>
      <dt>Numbers</dt><dd>u = z/${m}: ${zs.slice(0, 5).map(z => num(z / m, 3)).join(", ")}${zs.length > 5 ? ", …" : ""}</dd>
      <dt>Period</dt><dd><b>T = ${T}</b>${start ? ` after a run-in of ${start} state${start > 1 ? "s" : ""} that never come back` : ""} · ${new Set(zs).size} of ${m} positions visited ${flag(full || best0 ? "ok" : "bad", full ? "full period" : best0 ? "best possible for c = 0" : `only ${T} of ${m} in the cycle`)}</dd></dl></div>`;
}
function initLcg(body) {
  const sl = (k, lab, min, max) => `<label>${lab} <input type="range" data-k="${k}" min="${min}" max="${max}" step="1" value="${LCG[k]}"> <output>${LCG[k]}</output></label>`;
  const pre = [[31, 3, 0, 1, "task 1: m 31, a 3"], [31, 5, 0, 1, "task 2: a 5"], [32, 5, 1, 1, "task 3: m 32, a 5, c 1"], [32, 4, 0, 1, "a 4 on m 32"]];
  body.innerHTML = `<div class="presets">${pre.map((p, i) => `<button class="preset" type="button" data-p="${i}">${p[4]}</button>`).join("")}</div>

    return `<g class="pt" tabindex="0" data-tip="${esc(tip)}"><rect class="hit" x="0" y="${y0 - 15}" width="${W}" height="${RH}"/><line class="ann" x1="${L}" x2="${x(v)}" y1="${y0}" y2="${y0}" stroke-dasharray="2 3"/><circle class="dot" cx="${x(v)}" cy="${y0}" r="5"/>
      <text class="cat" x="${L - 8}" y="${y0 + 4}" text-anchor="end">d = ${d}</text><text class="val" x="${x(v) + 9}" y="${y0 + 4}">${lab}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dot chart on a logarithmic axis: the fraction of the cube that lies inside the ball falls from 100 % in one dimension to 78.5 % in two, 52.4 % in three, 0.25 % in ten, 2.5 times 10 to the minus 8 in twenty and 2 times 10 to the minus 14 in thirty dimensions.">${ticks}${rows}</svg>`;
};

function exercise2() {
  const tool = [["Uniform numbers", "a modern pseudo-random generator (<code>rand()</code>); record the seed; one stream per parallel task"], ["Covering a space evenly", "quasi-random points; never for simulating chance"], ["F⁻¹ known or computable", "inversion, X = F⁻¹(U); in Julia <code>quantile.(D, rand(n))</code>"], ["Normal numbers", "Box–Muller; in practice <code>randn()</code>"], ["Only the shape f known, few dimensions", "accept–reject with an envelope that stays above f"], ["Sharp peak, many samples of one density", "composition–rejection"], ["Many dimensions", "Markov chain Monte Carlo, later in the course"]];
  const fails = [["A", "a very narrow normal peak, Normal(0.4, 0.01), in the box [0, 1] × [0, 40.7]", "correct but wasteful: the box has area ≈ 41 and the curve area 1, so about <b>41 darts per kept sample</b>"], ["B", "f(x) = 1/(1 + x)² on [0, ∞) in a box over [0, 5]", "wrong: no value above 5 can ever come out, although P(X > 5) = 1 − F(5) = 1/(1 + 5) = <b>1/6</b>"], ["C", "Laplace(0, 1) under the envelope 1.6 × Normal(0, 1)", "wrong in the tails: the Laplace density e<sup>−|x|</sup>/2 decays more slowly than any normal, so the envelope drops below f for |x| > 2.22 (computed here), where every proposal is kept and the tails come out too thin"]];
  return `${head(e)}
    <p class="lead">The second tutorial is again a Pluto notebook (Julia), "Tutorial 02: Random Variate Generation", dated 5 November and uploaded to OPAL just after midnight on the day of the session. It is the hands-on version of ${lecLink(2, "lecture 2")} (2 Nov), whose deck is not in OPAL yet: how a deterministic computer produces numbers that behave like random ones, why quasi-random points are something else, what a function does to a distribution, and the three ways from uniform numbers to any distribution (inversion, Box–Muller for the normal, accept–reject with its refinement composition–rejection). Six sections of interactive figures and quick questions, seven calculation problems, three programming exercises and two optional bonuses; the reference is chapter 2 of the lecture notes. As before: no sheet, no points, nothing to hand in.</p>
    ${tiles([["T = 30", "period of the LCG with m = 31, a = 3"], [fx(String.raw`F^{-1}(U)`, "F⁻¹(U)"), "inversion: one uniform per sample"], ["1 : 1", "Box–Muller: uniforms per normal number"], ["2 · 10⁻¹⁴", "darts kept for a ball in 30 dimensions"]])}

    <h2>1 · Random numbers from a deterministic machine</h2>
    <p>Run <code>rand()</code> twice and you get two different numbers; run <code>Random.seed!(42); rand(3)</code> twice and you get the same three numbers both times; a generator object <code>Xoshiro(7)</code> carries its own state. Computers do not produce randomness, they compute sequences that statistics cannot tell apart from random ones. The notebook contrasts the two sources: <b>measured</b> randomness (electronic noise) is unpredictable, slow and not reproducible, used in cryptography; <b>computed</b> randomness is fast and reproducible. A pseudo-random number generator has a state z, an update rule for the next state and an output map to a number u ∈ [0, 1); the first state is the seed, so the seed fixes the whole sequence (question 1.1).</p>
    <h3>1.1 The linear congruential generator</h3>
    <div class="formula">${fl(String.raw`z_i = (a\,z_{i-1} + c) \bmod m, \qquad u_i = \frac{z_i}{m} \in [0, 1)`, "z<sub>i</sub> = (a z<sub>i−1</sub> + c) mod m, u<sub>i</sub> = z<sub>i</sub>/m", "modulus m, multiplier a, increment c, seed z₀")}</div>
    <p>"mod m" keeps the remainder, so the state walks around a clock with m positions. It can take only m values, so as soon as one comes back the sequence repeats: the number of steps of the cycle is the <b>period</b> T ≤ m. The explorer redraws the notebook's Figure 1.1.</p>
    ${lab("lcg", "the LCG as jumps on a clock")}
    ${ex("The three tasks, worked", `<p><b>m = 31, a = 3, c = 0:</b> from z₀ = 1 the states are the powers of 3 modulo 31, and 3 first returns to 1 at the 30th power (3¹⁵ ≡ −1), so <b>T = 30</b>: every position except 0. Position 0 can never be reached with c = 0, because 3 · z ≡ 0 only for z = 0.</p>
      <p><b>a = 5:</b> 5³ = 125 = 4 · 31 + 1 ≡ 1, so the sequence 1, 5, 25, 1, … has <b>T = 3</b>. Same modulus, same formula, a useless generator.</p>
      <p><b>m = 32, a = 5, c = 1:</b> 1, 6, 31, 28, 13, 2, 11, 24, … visits all <b>32</b> positions before repeating: the full period.</p>`)}
    ${why("Context, not in the notebook: when an LCG has the full period", `<p>The Hull–Dobell theorem gives the rule for c ≠ 0: the period is m exactly when c and m share no factor, a − 1 is divisible by every prime factor of m, and a − 1 is divisible by 4 if m is. For m = 32, a = 5, c = 1 all three hold (c odd, 4 divisible by 2 and by 4). With c = 0 (a "multiplicative" generator) 0 is a trap and the best possible is m − 1 for a prime m, reached when a is a primitive root, as 3 is for 31. The preset "a 4 on m 32" shows the other failure: 1, 4, 16, 0, 0, … runs into 0 and stays there.</p>`)}
    <p>Real generators use the same idea with large numbers: the classic a = 48,271 with m = 2³¹ − 1 has a period of about 2.1 · 10⁹; Julia's default <b>Xoshiro256++</b> has a 256-bit state and the period 2²⁵⁶ − 1 ≈ 10⁷⁷. Question 1.2 is the trap of uniformity: an LCG with period 65,536 used for 10⁶ draws hits every value equally often, but replays the same 65,536 numbers about 15 times in the same order, which is not 10⁶ independent numbers. The period has to be far larger than the number of draws.</p>
    <h3>1.2 Many processors</h3>
    <p>Picture one cycle of the generator as a ring of T numbers. A seed picks a starting point, and a processor then uses a stretch of n numbers. Different seeds give different starting points, but stretches can <b>overlap</b>, and then two processors compute with the same numbers. Together, P processors can use at most T numbers, about T/P each. Question 1.3: 1000 cluster jobs, an LCG with period 2³¹ ≈ 2.1 · 10⁹, 10⁷ numbers per job, seeded with the job number. Not safe: 1000 · 10⁷ = 10¹⁰ numbers exceed the period, so overlaps are certain, and consecutive seeds of an LCG can also produce related sequences. Julia mixes the seed thoroughly, so <code>Xoshiro(1)</code>, <code>Xoshiro(2)</code>, … are unrelated streams.</p>
    ${why("Context, not in the notebook: the birthday problem again", `<p>How likely is an overlap when the stretches are well below the period? Two stretches of length n starting at random on a ring of T overlap with probability about 2n/T, and P processors form P(P − 1)/2 pairs, so the expected number of overlapping pairs is about P(P − 1) n / T. The notebook's default, 100 processors with 10⁷ numbers each on a period of 2³¹: 9900 · 10⁷ / 2.15 · 10⁹ ≈ <b>46 overlapping pairs</b>. With Xoshiro's 2²⁵⁶ the same number is about 10⁻⁶⁶. It is the birthday effect of ${lecLink(1, "lecture 1")}: the danger grows with the number of pairs, P², not with P.</p>`)}

    <h2>2 · Pseudo-random or quasi-random?</h2>
    <p>Throw 200 random points into a square: they do not cover it evenly. Independent points do not avoid each other, so a new point can land right next to an old one, and random points always form <b>clumps</b> and leave <b>holes</b>. That is a consequence of independence, not a flaw. Quasi-random points are built to cover the space evenly. The simplest is the additive recurrence with an irrational step, each new point landing in one of the largest gaps; Halton and Sobol sequences fill gaps the same way using the digits of the index k in bases 2 and 3.</p>
    <div class="formula">${fl(String.raw`u_{k+1} = (u_k + \alpha) \bmod 1`, "u<sub>k+1</sub> = (u<sub>k</sub> + α) mod 1", "additive recurrence")}${fl(String.raw`\alpha = \frac{\sqrt 5 - 1}{2} \approx 0.618`, "α = (√5 − 1)/2 ≈ 0.618", "an irrational step")}</div>
    ${lab("pq", "pseudo-random against Halton points, with the empty cells of a 10 × 10 grid")}
    <ul class="cmp two">
      <li><b>Pseudo-random</b><span class="v">behaves like independent uniform draws; clumps and holes; changes with the seed. Use it to <em>simulate chance</em>: arrivals, decays, mutations, moving molecules (question 2.3: customer arrivals).</span></li>
      <li><b>Quasi-random</b><span class="v">covers the space evenly, but its points are <em>not independent</em>. Use it to <em>cover a space</em>: a parameter scan, points for an integral (question 2.4: 100 test points in a square of parameters).</span></li>
    </ul>
    <p>The notebook's firework shows the price of dependence: each spark needs a direction and a speed. With quasi-random numbers the speed is the next number after the direction, u + 0.618 mod 1, so each direction gets exactly one speed and the sparks lie on a spiral instead of a round burst (question 2.2). Question 2.5 is the realistic version: synthetic microscope images with molecules placed quasi-randomly "to cover the cell evenly" look more regular than independent molecules ever are, and a cluster-detection program tested on them reports that molecules avoid each other: a wrong biological conclusion, with no error message.</p>

    <h2>3 · From uniform to any distribution</h2>
    <h3>3.1 What a function does to a random variable</h3>
    <p>Square uniform numbers, Y = X²: the values pile up near 0. Count with the CDF and then differentiate, for 0 &lt; y &lt; 1:</p>
    <div class="formula">${fl(String.raw`F_Y(y) = P(X^2 \le y) = P(X \le \sqrt{y}) = \sqrt{y}`, "F<sub>Y</sub>(y) = P(X² ≤ y) = P(X ≤ √y) = √y", "count")}${fl(String.raw`f_Y(y) = \frac{d}{dy}\sqrt{y} = \frac{1}{2\sqrt{y}}`, "f<sub>Y</sub>(y) = 1/(2√y)", "differentiate")}</div>
    <p>Question 3.2: f<sub>Y</sub>(0.25) = 1/(2 · 0.5) = 1. Question 3.3: the area ∫₀¹ 1/(2√y) dy = [√y]₀¹ = 1, the quick test for any transformation. Why the values pile up (Figure 3.1): equally likely x values go up to the curve g and across to the y axis; where g is flat they bunch together and the density of Y is high, where g is steep they spread out. For any increasing g the same two steps give the general rule, and the factor dx/dy says how the spacing changes: the probability between two neighbouring lines is the same before and after, f<sub>Y</sub>(y) dy = f<sub>X</sub>(x) dx.</p>
    <div class="formula">${fl(String.raw`F_Y(y) = F_X\big(g^{-1}(y)\big)`, "F<sub>Y</sub>(y) = F<sub>X</sub>(g⁻¹(y))", "g increasing: count")}${fl(String.raw`f_Y(y) = f_X\big(g^{-1}(y)\big)\,\frac{d}{dy}g^{-1}(y)`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) · d g⁻¹(y)/dy", "differentiate")}</div>
    <p>Question 3.4: for Y = 2X the density is not 1 on (0, 2), because then the area would be 2; the factor dx/dy = ½ is missing, and Y is uniform with density ½.</p>
    <h3>3.2 Decreasing functions</h3>
    <p>For a decreasing g such as Y = 1/X, large x give small y, so the inequality turns around: F<sub>Y</sub>(y) = P(X ≥ 1/y) = 1 − F<sub>X</sub>(1/y). Differentiating brings a minus sign, and since g⁻¹ is decreasing its derivative is negative too; the two cancel. One formula with an absolute value covers both cases:</p>
    <div class="formula">${fl(String.raw`f_Y(y) = f_X\big(g^{-1}(y)\big)\,\left|\frac{d}{dy}\,g^{-1}(y)\right|`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) · |d g⁻¹(y)/dy|", "g strictly monotone, increasing or decreasing")}</div>
    <p>Question 3.5: for Y = 1/X, x = 1/y and |d(1/y)/dy| = 1/y², so f<sub>Y</sub>(y) = 1/y² for y &gt; 1 and f<sub>Y</sub>(2) = 0.25. Question 3.6: forgetting the absolute value gives −1/y², and a density can never be negative.</p>
    ${lab("tr", "five transformations of a uniform X: samples against the formula")}
    <h3>3.3 The CDF itself, and 3.4 inversion</h3>
    <p>Take g = F<sub>X</sub>, the CDF of X itself. It is steep exactly where the density is high (F′ = f), so it spreads the crowded values apart and pushes the sparse ones together, and with dy = f<sub>X</sub>(x) dx the transformation rule gives f<sub>Y</sub> = f<sub>X</sub>/f<sub>X</sub> = 1 on (0, 1): <b>the values of the CDF are uniform</b>, for every continuous distribution. Uniform numbers are in this sense the common raw material of all distributions. Going the other way is the first sampling method:</p>
    <div class="formula">${fl(String.raw`X = F^{-1}(U)`, "X = F⁻¹(U)", "inversion, for a continuous, strictly increasing F")}${fl(String.raw`P\big(F^{-1}(U) \le x\big) = P\big(U \le F(x)\big) = F(x)`, "P(F⁻¹(U) ≤ x) = P(U ≤ F(x)) = F(x)", "why X has the CDF F")}${fl(String.raw`u = 1 - e^{-\lambda x} \;\Rightarrow\; x = F^{-1}(u) = -\frac{\ln(1 - u)}{\lambda}`, "x = −ln(1 − u)/λ", "the exponential distribution")}</div>
    ${lab("inv", "inversion: carry a uniform height across the CDF")}
    <p>One uniform number gives one exact exponential number. When F⁻¹ has no formula it can be computed numerically; in Julia <code>quantile(D, u)</code> does that for every distribution of Distributions.jl, and <code>rand(Exponential(2.0), 5)</code> does the whole job. Question 3.8 is a real bug: a simulation computes exponentials as <code>-log(rand())</code> and after 10⁹ samples one value is <code>Inf</code>. <code>rand()</code> returns values in [0, 1), so 0 is possible and −ln 0 = ∞; <code>-log(1 - rand())</code> uses 1 − U ∈ (0, 1], or <code>randexp()</code> avoids the issue.</p>
    ${ex("Worked example: an exponential waiting time by hand", `<p>Rate λ = 2 per hour, uniform draw u = 0.7. Then x = −ln(1 − 0.7)/2 = −ln(0.3)/2 = 1.204/2 = <b>0.602 hours</b>, about 36 minutes. Check: F(0.602) = 1 − e<sup>−1.204</sup> = 1 − 0.3 = 0.7. With the buggy <code>-log(u)</code> the same u would give −ln(0.7)/2 = 0.178: still a correct exponential sample, because U and 1 − U have the same distribution, but one that breaks at u = 0.</p>`)}

    <h2>4 · Normal random numbers</h2>
    <p>The normal CDF Φ has no formula, and neither does Φ⁻¹. <b>Adding uniform numbers</b> (section 4.1) uses the central limit theorem, as in ${exeLink(1, "tutorial 1")}'s exercise 9: the histogram of the sum of 12 uniforms looks normal, but on a logarithmic density axis the tails disagree (question 4.1). The sum is less likely than a normal number far from the middle, and it can never leave [0, 12], so after subtracting 6 it never exceeds ±6, while rare extreme values are exactly what the tails describe.</p>
    <p><b>The Box–Muller transform</b> (section 4.2) inverts after all, in two dimensions. A pair of independent standard normals has the density e<sup>−(x₁² + x₂²)/2</sup>/(2π), which depends only on the distance r from the centre: the cloud is round. So describe the point by an angle and a distance. The angle is uniform, θ = 2πU₂. The distance has the CDF F<sub>R</sub>(r) = 1 − e<sup>−r²/2</sup>, which unlike Φ can be inverted: R = √(−2 ln(1 − U₁)), and since 1 − U₁ is uniform too, √(−2 ln U₁). Back in the plane, X₁ = R cos θ and X₂ = R sin θ.</p>
    <div class="formula">${fl(String.raw`X_1 = \sqrt{-2\ln U_1}\,\cos(2\pi U_2)`, "X₁ = √(−2 ln U₁) cos(2πU₂)", "U₁, U₂ independent uniform on (0, 1)")}${fl(String.raw`X_2 = \sqrt{-2\ln U_1}\,\sin(2\pi U_2)`, "X₂ = √(−2 ln U₁) sin(2πU₂)", "X₁, X₂ independent standard normal")}</div>
    ${lab("bm", "Box–Muller: choose the two uniform numbers yourself")}
    <p>Question 4.4: the angle and the distance may be drawn separately because the density depends only on the distance, so the angle carries no information about it; that turns one two-dimensional problem into two one-dimensional ones, and it works only for a round cloud. Question 4.5: two uniforms give two normals, so 10⁶ normal numbers need <b>10⁶</b> uniform numbers. In practice <code>randn()</code> and <code>rand(Normal(μ, σ))</code>.</p>
    ${why("Context, not in the notebook: why the distance has that CDF", `<p>The probability that a standard normal pair lies within distance r is the integral of the density over the disc. In polar coordinates the area element is ρ dρ dθ, so</p><div class="formula">${fl(String.raw`\begin{aligned} F_R(r) &= \int_0^{2\pi}\!\!\int_0^r \tfrac{1}{2\pi} e^{-\rho^2/2}\,\rho\,d\rho\,d\theta \\ &= 1 - e^{-r^2/2} \end{aligned}`, "F<sub>R</sub>(r) = ∫∫ e<sup>−ρ²/2</sup> ρ dρ dθ / (2π) = 1 − e<sup>−r²/2</sup>")}</div><p>The extra factor ρ, the circumference growing with the radius, is what makes the integral solvable, and it is missing in one dimension, which is why Φ has no closed form. R² = −2 ln U₁ is an exponential with mean 2, the chi-squared distribution with two degrees of freedom.</p>`)}

    <h2>5 · Accept–reject</h2>
    <h3>5.1 Darts under a curve</h3>
    <p>Sometimes only the shape of a density is known: a measured curve, or a formula without a usable F⁻¹. Throw darts uniformly into a box around the curve and keep the darts below it. More darts are kept where the curve is high, so the x values of the kept darts have exactly the density of the curve. Because the darts fill the box evenly, the fraction kept is a ratio of areas, and the area under a density is 1.</p>
    <div class="formula">${fl(String.raw`\text{fraction kept} = \frac{\text{area under the curve}}{\text{area of the box}}`, "fraction kept = area under the curve / area of the box")}${fl(String.raw`= \frac{1}{\text{area of the box}}`, "= 1 / area of the box", "the area under a density is 1")}</div>
    ${chart("darts", leg([[1, "kept"], ["g", "thrown away"], [2, "density f"]]))}${cap("Beta(2, 5), f(x) = 30 x (1 − x)⁴, drawn here with a fixed set of darts; hover the box for the count. Question 5.1: the maximum is f(0.2) = 2.4576, so the box has area 2.4576 and 1/2.4576 = 40.7 % of the darts are kept, about 2.46 darts per sample. Question 5.2: the semicircle density (2/π)√(1 − x²) on [−1, 1] in a box of area 2 · 2/π = 4/π keeps π/4 = 78.5 %.")}
    <h3>5.2 A proposal instead of a box</h3>
    <p>The notebook's drawing pad lets you sketch any density and fit either a box or a hill μ g(x) built from a normal density over it. The general method:</p>
    <div class="formula">${fl(String.raw`\mu\,g(x) \ge f(x) \text{ for all } x`, "μ g(x) ≥ f(x) for all x", "envelope: g easy to sample (the proposal), μ a constant")}${fl(String.raw`x \sim g, \quad u \sim U(0, 1)`, "x from g, u uniform on (0, 1)", "draw a proposal and a uniform height")}${fl(String.raw`\text{keep } x \text{ if } u\,\mu\,g(x) \le f(x)`, "keep x if u μ g(x) ≤ f(x)", "on average a fraction 1/μ is kept")}</div>
    <p>The closer μ g fits f, the less is wasted. Question 5.3: if the envelope dips below the density somewhere, nothing in the algorithm notices; on that interval every dart is kept, so the samples follow the envelope there instead of f. Checking μ g ≥ f is the programmer's job. Section 5.3 tries three harder densities:</p>
    <div class="tt-wrap"><table class="tt prose"><tr><th>Case</th><th>Density and envelope</th><th>What happens</th></tr>${fails.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>
    <p><b>More dimensions.</b> For uniform points in a ball, throw darts into the surrounding cube and keep those inside. The kept fraction is the volume ratio: π/4 = 0.785 in two dimensions, (4π/3)/8 = π/6 = 0.524 in three (question 5.7), and then it collapses.</p>
    ${chart("dims")}${cap("Volume of the unit ball over the volume of the cube [−1, 1]<sup>d</sup>, π<sup>d/2</sup> / (Γ(d/2 + 1) 2<sup>d</sup>), computed here; hover a row for the number of darts per kept point. Question 5.8: in 30 dimensions only about 2 · 10⁻¹⁴ of the darts land in the ball, about 5 · 10¹³ darts per point, so accept–reject is hopeless there and Markov chain Monte Carlo takes over later in the course.")}
    <h3>5.4 Composition–rejection</h3>
    <p>Case A wastes most of the box. Composition–rejection replaces the one big box by small boxes that follow the curve: cut the x axis into blocks, give the block heights from a ladder of levels a, 2a, 4a, …, each block taking the lowest level that still lies above the curve there. To sample, choose a level with probability proportional to its total area, then one block of that level, then throw a dart into that block and accept or reject it as before. Since no block is more than one level step above the curve's highest point in it, far less of the area is empty than in the one big box of case A. The set-up pays off when many samples are drawn from the same density.</p>

    <h2>6 · Which method when</h2>
    <div class="tt-wrap"><table class="tt fs"><tr><th>Situation</th><th>Method</th></tr>${tool.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table></div>

    <h2>Calculation problems</h2>
    ${task("1", 0, "A linear map", `<p>X uniform on (0, 1), Y = 3X + 2: Y is uniform on (2, 5), the axis is stretched by 3, so the density is 1/3 there.</p>${ans([["1/3", "f<sub>Y</sub>(3)"]])}`)}
    ${task("2", 0, "Minus the logarithm", `<p>Y = −ln X: x = e<sup>−y</sup> and |dx/dy| = e<sup>−y</sup>, so f<sub>Y</sub>(y) = 1 · e<sup>−y</sup> for y &gt; 0: Y is Exponential(1), the inversion recipe in disguise.</p>${ans([["e⁻¹ ≈ 0.368", "f<sub>Y</sub>(1)"]])}`)}
    ${task("3", 0, "The cube", `<p>Y = X³ at y = 0.125: x = 0.125<sup>1/3</sup> = 0.5 and g′(0.5) = 3 · 0.25 = 0.75; the density is 1/g′ = 1/0.75. Equivalently, dx/dy = (1/3) y<sup>−2/3</sup> = (1/3) · 4 = 4/3.</p>${ans([["4/3 ≈ 1.333", "f<sub>Y</sub>(0.125)"]])}`)}
    ${task("4", 0, "Normalising a density", `<p>f(x) = c x on [0, 2]: ∫₀² c x dx = 2c = 1. With c = ½ the CDF is F(x) = x²/4, and inversion would give x = 2√u.</p>${ans([["½", "c"], ["2√u", "F⁻¹(u), for inversion"]])}`)}
    ${task("6", 0, "Darts for 3x²", `<p>f(x) = 3x² on [0, 1] in the box [0, 1] × [0, 3]: area under f is 1, box area 3.</p>${ans([["1/3", "fraction kept"], ["3", "darts per sample on average"]])}`)}
    ${task("7", 0, "Which is not uniform?", `<p>1 − U is uniform (a reflection), and F(X) for an exponential X is uniform (section 3.3). U² is not: squaring squeezes the axis near 0, with density 1/(2√y).</p>${ans([["U²", "the odd one out"]])}`)}
    <p class="muted">The notebook numbers its problems 1–4, 6 and 7; there is no problem 5.</p>

    <h2>Programming exercises</h2>
    ${task("P1", 0, "Inversion", `<p>Complete <code>tri_inv(u)</code>. Density f(x) = 2(1 − x) on [0, 1], CDF F(x) = 1 − (1 − x)². Solve u = 1 − (1 − x)² for x: (1 − x)² = 1 − u, and the root in [0, 1] is x = 1 − √(1 − u). The notebook checks five values (u = 0, 0.19, 0.36, 0.75, 0.99 give 0, 0.1, 0.2, 0.5, 0.9) and then plots a histogram of 20,000 samples against the density; the explorer above shows the same density under "exercise 1".</p>${ans([["1 − √(1 − u)", "tri_inv(u)"]])}`)}
    ${task("P2", 0, "Box–Muller", `<p>Complete <code>boxmuller(u1, u2)</code>: return the pair (R cos θ, R sin θ) with R = √(−2 ln u₁) and θ = 2π u₂. The check draws 20,000 pairs and wants mean ≈ 0, variance ≈ 1 and correlation of X₁ and X₂ ≈ 0, plus the exact identity x₁² + x₂² = −2 ln u₁ at (0.3, 0.2), which pins down that u₁ sets the distance.</p>${ans([["(R cos θ, R sin θ)", "R = √(−2 ln u₁), θ = 2πu₂"]])}`)}
    ${task("P3", 0, "Accept–reject", `<p>Complete <code>accept_reject(f, fmax, n)</code>: repeat until n values are kept: x = <code>rand()</code>, a height y = fmax · <code>rand()</code>, keep x if y ≤ f(x). The check uses f(x) = 6x(1 − x) with fmax = 1.5 and wants exactly 20,000 values in [0, 1] with mean 0.5 and variance 0.05. That needs about 1.5 · 20,000 = 30,000 darts, since the box has area 1.5.</p>${ans([["1/1.5 = 2/3", "fraction kept"], ["0.5 · 0.05", "mean · variance of Beta(2, 2)"]])}`)}

    <h2>Optional bonuses</h2>
    <p><b>A · A galaxy from <code>rand()</code>.</b> Every star is built from uniform numbers pushed through this tutorial's methods: its distance from the centre is exponential by inversion, its spiral arm a discrete uniform choice among K arms, the scatter around the arm and the round central bulge are normal numbers by Box–Muller, a Bernoulli draw with 15 % sends a star to the bulge, and the brightness follows a Pareto law by inversion. <b>B · Randomness in music.</b> The Karplus–Strong plucked string starts from about a hundred uniform random numbers per period of the tone and repeatedly averages neighbours, which smooths the noise into a string-like sound; the musical dice game printed in 1792 under Mozart's name composes a waltz bar by bar from the sum of two dice, so the bars for 7 are six times as likely as those for 2 (the two-dice PMF of ${exeLink(1, "tutorial 1")}); and a rāga can be recognised from its note probabilities with Bayes' theorem, updating the belief in each rāga after every note.</p>

    ${why("Context, not in the notebook: what this tutorial sets up", `<p>Every later method consumes uniform numbers through one of these doors. Markov chains (${lecLink(3, "lecture 3")}) need a discrete draw per step, which is inversion on a staircase CDF; Monte Carlo integration (${lecLink(4, "lecture 4")}) is where quasi-random points earn their keep and pseudo-random ones give honest error bars; Metropolis–Hastings keeps an accept-or-reject step but moves a chain instead of throwing independent darts, the answer to the 30-dimensional ball; Brownian motion and the SDE schemes eat one normal number per step, Box–Muller's job.</p>`)}
