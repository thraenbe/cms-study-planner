      `<b>Independence</b> (knowing one number tells nothing about the other): ${sec("cond")}.`,
      `<b>Mean, variance, the normal distribution and the central limit theorem</b>: ${exeLink(1, "tutorial 1")}, <a href="stochastics/exercise.html?n=1#t1-s5">section 5</a> and <a href="stochastics/exercise.html?n=1#t1-s6">section 6</a>.`,
      `<b>School maths</b>: division with remainder (17 ÷ 5 = 3 remainder 2), inverse functions (undoing √ by squaring), derivatives including the chain rule, the natural logarithm ln and e<sup>x</sup> (ln e<sup>x</sup> = x, ln 1 = 0, ln of a number below 1 is negative), sine and cosine of an angle, and the area of a circle and volume of a ball.`,
      `<b>The lecture</b>: ${lecLink(2, "lecture 2")} covers the same ground in slide form; each section below names the lecture part it needs.`])}
    <div id="gloss"></div>

    ${h2("s-pluto", "0 · How to read a Pluto notebook")}
    ${pw(`The tutorial is a program you open in the browser, not a PDF. You do not need to run it to follow this page, but the words below appear in every section.`)}
    <p>A ${d("pluto")} consists of ${d("cell", "cells")}: boxes that hold either text or ${d("julia")} code, with the result of each code cell printed just above it. Shift + Enter runs a cell. Pluto is a ${d("reactive")}: when one cell changes, every cell that uses its result re-runs by itself. That is what makes the sliders work: ${d("bind")} ties a slider or a menu to a variable, and each figure that uses the variable redraws when you move it. The first cell loads ${d("package", "packages")} with <code>using</code>, libraries of ready-made functions. Values often come as a ${d("vector")}, a list in square brackets. Lines after a <code>#</code> are comments for the human reader and are not executed. Installing Julia and Pluto is covered by the installation guide on the ${exeLink(1, "tutorial 1")} page.</p>
    ${ex("Worked example: reading one line of Julia", `<p><code>quantile.(Weibull(1.5, 1.0), rand(5))</code> reads from the inside out. <code>rand(5)</code> makes a vector of five random numbers between 0 and 1. <code>Weibull(1.5, 1.0)</code> is a distribution object from the Distributions.jl package. The dot after <code>quantile</code> is ${d("broadcast")}: the function is applied to each of the five numbers separately, giving five results. Without the dot Julia would try to feed the whole vector into one call and stop with an error.</p>`)}

    ${h2("s-1", "1 · Random numbers from a deterministic machine")}
    ${pw(`A computer cannot roll dice; it computes. The trick is a recipe whose output <em>looks</em> random to every statistical test. You use it every time a simulation calls for “a random number”, and you need to know its limits, because a bad recipe quietly gives wrong simulation results.`)}
    <p>The section opens with four code cells. Their results, run here with Julia 1.13 (other Julia versions can print other numbers, but the pattern is the same):</p>
    ${jl(`rand()
rand(5)`, `<p>${d("rand")} returns one number between 0 and 1; <code>rand(5)</code> returns a ${d("vector")} of five. Run the cell again and the numbers change.</p>`)}
    ${jl(`begin
	Random.seed!(42)
	rand(3)
end`, `<p><code>begin … end</code> groups several lines into one cell. <code>Random.seed!(42)</code> resets the generator to a fixed starting point, then <code>rand(3)</code> draws three numbers: <b>0.629, 0.450, 0.477</b>. The notebook has this cell twice, and both print exactly the same three numbers, every time. The <code>!</code> in the name marks a function that changes something (here the generator), see ${d("push", "push! and the exclamation mark")} later.</p>`)}
    ${jl(`begin
	rng = Xoshiro(7)
	rand(rng, 3)
end`, `<p><code>Xoshiro(7)</code> creates a separate generator object started from 7, and <code>rand(rng, 3)</code> draws from that one only: <b>0.244, 0.719, 0.811</b>. Two generator objects do not disturb each other, which matters for parallel work (section 1.2).</p>`)}
    <p>So <code>rand()</code> is not random at all: it is a ${d("prng")}. Such a generator keeps a ${d("state")}, a number in memory; each call computes the next state from the current one with a fixed rule and turns the state into an output u between 0 and 1. The very first state is the ${d("seed")}: same seed, same sequence. The alternative is ${d("truerand")}, measured from electronic noise or radioactive decay: unpredictable, therefore useful for cryptographic keys, but slow and impossible to replay. Simulations want the computed kind: fast, and reproducible when you hunt a bug. This is ${sec("fake")}.</p>
    ${nq("Question 1.1", "What does rand() do?", { ask: "Three options: it measures noise in the processor; it computes each number from the previous state with a fixed recipe, so the seed fixes the whole sequence; it reads the clock for every number.", idea: `pseudo- versus true randomness, ${sec("fake")}.`, sol: `<p><b>The second.</b> The seeded cell printing the same three numbers twice proves it: measured noise could never be replayed. A clock can be used <em>once</em> to choose a seed, but reading it for every number would be slow and consecutive numbers (microseconds apart) would be strongly related.</p>` })}

    ${h3("s-1-1", "1.1 The linear congruential generator")}
    ${pw(`The oldest and simplest generator recipe: multiply, add, keep the remainder. It shows in a few lines everything that can go wrong with generators, above all that the sequence eventually repeats.`)}
    <p>First the one operation it needs: ${d("mod")}. “a mod m” is the remainder of a divided by m. Examples: 17 mod 5 = 2 (17 = 3 · 5 + 2); 81 mod 31 = 19 (81 = 2 · 31 + 19); 62 mod 31 = 0. The result is always one of 0, 1, …, m − 1, like the hour on a clock with m positions: going past the top starts again at 0. The ${d("lcg")} is</p>
    <div class="formula">${fl(String.raw`z_i = (a\,z_{i-1} + c) \bmod m, \qquad u_i = \frac{z_i}{m} \in [0, 1)`, "z<sub>i</sub> = (a z<sub>i−1</sub> + c) mod m, u<sub>i</sub> = z<sub>i</sub>/m", "z: state, i: step number, u: output")}</div>
    <p>with the ${d("mac")}: m the number of positions, a the multiplier, c the increment, and the seed z₀. The symbol ∈ reads “is an element of”: u lies in [0, 1), the square bracket meaning 0 is included, the round one meaning 1 is not.</p>
    ${ex("Worked example: the first six steps of m = 31, a = 3, c = 0, seed z₀ = 1", `<p>z₁ = 3 · 1 mod 31 = <b>3</b>; z₂ = 3 · 3 = <b>9</b>; z₃ = 3 · 9 = <b>27</b>; z₄ = 3 · 27 = 81 = 2 · 31 + 19, so <b>19</b>; z₅ = 3 · 19 = 57 = 31 + 26, so <b>26</b>; z₆ = 3 · 26 = 78 = 2 · 31 + 16, so <b>16</b>.</p>
      <p>Outputs u = z/31: 3/31 = 0.097, 9/31 = 0.290, 27/31 = 0.871, 19/31 = 0.613, 26/31 = 0.839, 16/31 = 0.516. They jump around without an obvious pattern, which is the whole point.</p>`)}
    <p>The state can take only m values. As soon as one of them comes back, everything after it repeats, because each state determines the next. The number of steps in that cycle is the ${d("period")}, at most m.</p>
    ${labN("lcg", "the LCG as jumps on a clock", "The circle has one dot per possible state 0 … m − 1, numbered clockwise from the top; the ring marks the seed. Each line is one step of the generator. Use the four buttons for the notebook's three tasks (and one failure case), or set m, a, c and the seed with the sliders. Below the clock: the states, the outputs u, and the period, with a green tick when the cycle uses every position it can.")}
    ${nq("Tasks 1–3", "Follow the jumps: when does the sequence repeat, and how many positions are visited?", { ask: "(1) With the defaults m = 31, a = 3, c = 0, seed 1, find when the sequence starts to repeat. (2) Keep m = 31, c = 0 and compare a = 3 with a = 5. (3) Choose m = 32, a = 5, c = 1: is every position visited?", idea: `the LCG and its period, ${sec("lcg")}.`, sol: `<p><b>(1) a = 3:</b> continuing the worked example, the states are 1, 3, 9, 27, 19, 26, 16, 17, 20, 29, 25, 13, 8, 24, 10, 30, 28, 22, 4, 12, 5, 15, 14, 11, 2, 6, 18, 23, 7, 21 and then 3 · 21 = 63 = 2 · 31 + 1, back to <b>1</b>. That is 30 different states, so <b>T = 30</b>: every position except 0. Position 0 can never be reached with c = 0, since 3 · z mod 31 = 0 only when z = 0 itself.</p>
      <p><b>(2) a = 5:</b> 1 → 5 → 25 → 5 · 25 = 125 = 4 · 31 + 1 → <b>1</b>. Period <b>T = 3</b>, only 3 of 31 positions: same modulus, same formula, a useless generator. The choice of a decides everything.</p>
      <p><b>(3) m = 32, a = 5, c = 1:</b> 1 → 5 + 1 = 6 → 31 → 5 · 31 + 1 = 156 = 4 · 32 + 28 → 28 → 141 mod 32 = 13 → 66 mod 32 = 2 → 11 → 56 mod 32 = 24 → … The full list is 1, 6, 31, 28, 13, 2, 11, 24, 25, 30, 23, 20, 5, 26, 3, 16, 17, 22, 15, 12, 29, 18, 27, 8, 9, 14, 7, 4, 21, 10, 19, 0 and then 5 · 0 + 1 = 1. <b>All 32 positions</b>, the full period T = m.</p>`, code: "<p>The cell <code>fig_lcg(s1_m, s1_a, s1_c, s1_z0)</code> draws Figure 1.1 from the four number fields above it (tied to the variables with @bind). Inside, it applies the formula until a state appears for the second time, then counts the steps of the cycle.</p>" })}
    ${oops(`Thinking the period is always m. It is <em>at most</em> m, and with a bad multiplier it can be tiny (3 for a = 5 above), or the sequence can fall into 0 and stay there (the preset “a 4 on m 32”: 1, 4, 16, 64 mod 32 = 0, then 0 forever).`)}
    ${why("Context, not in the notebook: when an LCG has the full period", `<p>The Hull–Dobell theorem gives the rule for c ≠ 0: the period is m exactly when (i) c and m share no common factor, (ii) a − 1 is divisible by every prime factor of m, and (iii) a − 1 is divisible by 4 if m is. For m = 32 = 2⁵, a = 5, c = 1: c = 1 shares no factor with 32; a − 1 = 4 is divisible by 2, the only prime factor; and 4 is divisible by 4. All three hold, hence the full period. With c = 0 (a “multiplicative” generator) 0 is a trap, and the best possible is m − 1 for a prime m, reached when a is a ${d("primroot")}, as 3 is for 31.</p>`)}
    <p>Real generators use the same idea with huge numbers. A classic choice is a = 48,271 with m = 2³¹ − 1, period about 2.1 · 10⁹ (2.1 billion). Julia's default, ${d("xoshiro")}, keeps a 256-bit state (256 binary digits, so 2²⁵⁶ possible states) and has the period 2²⁵⁶ − 1 ≈ 10⁷⁷ (≈ reads “approximately equal to”).</p>
    ${nq("Question 1.2", "Uniform enough?", { ask: "A simulation needs 10⁶ numbers and uses an LCG with period 65,536. A student argues: every value appears exactly once per period, so the numbers are perfectly uniform. What is wrong?", idea: "the period, as above.", sol: `<p>10⁶ / 65,536 = <b>15.26</b>: the simulation runs through the cycle about 15 times and replays the same 65,536 numbers in the same order each time. Every value is equally frequent, yes, but the numbers are not independent: once you have seen 65,536 of them you can predict all the rest. The result is that of 65,536 numbers, not 10⁶ independent ones. Rule: the period must be <em>far</em> larger than the number of draws. (An LCG with m = 2¹⁶ = 65,536 and good a, c can indeed have this period, so that is not the flaw.)</p>` })}

    ${h3("s-1-2", "1.2 Many processors")}
    ${pw(`A big simulation runs on many processors at once, and each needs its own random numbers. Different seeds alone do not guarantee that they get different numbers.`)}
    <p>Picture the whole cycle of a generator as a ring of T numbers. A seed only picks where on the ring a processor starts; the processor then uses the next n numbers, a stretch of the ring, called its ${d("stream")}. Two stretches can <b>overlap</b>, and then two processors compute with the same numbers and their results are not independent. Together, P processors can use at most T numbers, about T/P each, before stretches must meet.</p>
    ${nq("Tasks 1 and 2", "100 processors, 10⁷ numbers each", { ask: "(1) In Figure 1.2 choose the classic LCG (period 2³¹), 100 processors and 10⁷ numbers each: what happens? (2) Keep everything and switch to Julia's generator.", idea: `the period and seeds, ${sec("lcg")}.`, sol: `<p><b>(1)</b> Total demand 100 · 10⁷ = 10⁹ numbers on a ring of 2³¹ = 2,147,483,648 ≈ 2.1 · 10⁹: the processors use 10⁹ / 2.1 · 10⁹ = <b>47 %</b> of the whole ring, so with random starting points many stretches overlap (the figure marks them red; the box below estimates about 46 overlapping pairs).</p><p><b>(2)</b> With the period ≈ 1.16 · 10⁷⁷ the same 10⁹ numbers are a fraction 10⁹ / 10⁷⁷ ≈ 10⁻⁶⁸ of the ring: overlaps practically never happen.</p>`, code: "<p><code>fig_streams</code> draws random starting points on the ring, gives each processor a stretch of length n/T (as a fraction of the ring), and colours a stretch red if the next start comes before it ends.</p>" })}
    ${jl(`begin
	streams = [Xoshiro(i) for i in 1:4]    # one generator per processor
	[rand(s) for s in streams]
end`, `<p>A ${d("comprehension")}: <code>[Xoshiro(i) for i in 1:4]</code> builds a vector of four generators, seeded 1, 2, 3, 4 (<code>1:4</code> is a ${d("range")}, the numbers 1 to 4). The second line draws one number from each: here <b>0.073, 0.002, 0.340, 0.854</b>. Julia mixes the seed thoroughly before use, so consecutive seeds give unrelated streams; with a plain LCG, seeds 1, 2, 3 would start at neighbouring states and produce related sequences.</p>`)}
    ${nq("Question 1.3", "1000 cluster jobs", { ask: "A research group runs 1000 jobs, each using an LCG with period 2³¹ ≈ 2.1 · 10⁹, seeded with its job number, each drawing 10⁷ numbers. Is that safe?", idea: "period versus demand, as above.", sol: `<p><b>No.</b> Together the jobs draw 1000 · 10⁷ = 10¹⁰ numbers, and 10¹⁰ / 2.1 · 10⁹ = <b>4.7 times the period</b>: the jobs must reuse each other's numbers, whatever the seeds. On top of that, consecutive seeds of an LCG give related sequences. That 1000 jobs might not run at the same time is irrelevant; what matters is which numbers they use.</p>` })}
    ${why("Context, not in the notebook: how many overlaps to expect", `<p>Two stretches of length n starting at random on a ring of T overlap with probability about 2n/T (the second start must fall within n before or after the first). P processors form P(P − 1)/2 pairs, so the expected number of overlapping pairs is about P(P − 1)/2 · 2n/T = P(P − 1) n / T. For the notebook's default: 100 · 99 · 10⁷ / 2.15 · 10⁹ = 9.9 · 10¹⁰ / 2.15 · 10⁹ ≈ <b>46 overlapping pairs</b>. With Xoshiro's 2²⁵⁶ the same formula gives about 10⁻⁶⁶. This is the birthday effect of ${sec("chain", "lecture 1's birthday problem")}: the danger grows with the number of pairs, roughly P², not with P.</p>`)}
    ${tryit([
      ["Run the LCG with m = 10, a = 7, c = 0, seed 1 by hand. What is the period, and what are the outputs u?", "<p>z₁ = 7 · 1 mod 10 = 7; z₂ = 49 mod 10 = 9; z₃ = 63 mod 10 = 3; z₄ = 21 mod 10 = 1, back to the seed. Period <b>T = 4</b> (of 10 possible positions). Outputs 0.7, 0.9, 0.3, 0.1, then the same again.</p>"],
      ["Compute 100 mod 7 and 3 · 30 mod 31.", "<p>100 = 14 · 7 + 2, so <b>2</b>. 3 · 30 = 90 = 2 · 31 + 28, so <b>28</b> (check against the list in task 1: after 30 comes 28).</p>"],
      ["Eight processors each draw 10⁹ numbers from a generator with period 2³² ≈ 4.3 · 10⁹. Safe?", "<p>Total demand 8 · 10⁹ numbers &gt; 4.3 · 10⁹: the demand is almost twice the period, so the streams must overlap. <b>Not safe</b>; use a generator with a far larger period.</p>"]])}

    ${h2("s-2", "2 · Pseudo-random or quasi-random?")}
    ${pw(`Random points do not spread out evenly; they clump and leave gaps. Sometimes that is exactly right (when you simulate chance), sometimes it is wasteful (when you only want to cover a region evenly). This section separates the two jobs.`)}
    <p>Throw 200 random points into a square divided into a 10 × 10 grid of cells. ${d("indep", "Independent")} points do not avoid each other: each new point can land right next to an earlier one. So random points always form <b>clumps</b> and leave <b>holes</b>. That is a consequence of independence, not a flaw of the generator.</p>
    ${ex("Worked example: how many empty cells to expect", `<p>One point misses a given cell with probability 99/100 = 0.99. N independent points all miss it with probability 0.99<sup>N</sup> (multiply, because they are independent). Over the 100 cells the expected number of empty cells is 100 · 0.99<sup>N</sup>:</p>
      <p>N = 50: 100 · 0.605 = <b>60.5</b> empty cells; N = 200: 100 · 0.134 = <b>13.4</b>; N = 1000: 100 · 0.0000432 = <b>0.004</b>. With 200 points there would be room for two per cell, yet about 13 cells stay empty.</p>`)}
    <p>${d("quasi", "Quasi-random points")} are built to cover a space evenly instead. The simplest is the additive recurrence: add the same step α (read alpha) each time and keep only the part after the decimal point (mod 1). With an ${d("irr")} step such as α = (√5 − 1)/2 ≈ 0.618 the points never repeat, and each new point lands in one of the largest gaps left. The ${d("halton")} and the Sobol sequence (a related construction from base-2 digits) fill gaps in a similar way using the digits of the index k in bases 2 and 3. This is ${sec("disc")}.</p>
    <div class="formula">${fl(String.raw`u_{k+1} = (u_k + \alpha) \bmod 1`, "u<sub>k+1</sub> = (u<sub>k</sub> + α) mod 1", "additive recurrence")}${fl(String.raw`\alpha = \frac{\sqrt 5 - 1}{2} \approx 0.618`, "α = (√5 − 1)/2 ≈ 0.618", "an irrational step")}</div>
    ${ex("Worked example: the additive recurrence and the Halton digits", `<p>From u₀ = 0: 0.618; 1.236 → 0.236; 0.854; 1.472 → 0.472; 1.090 → 0.090; 0.708; 1.326 → 0.326. Sorted, 0, 0.090, 0.236, 0.326, 0.472, 0.618, 0.708, 0.854: eight points with gaps between 0.09 and 0.15, never two close together.</p>
      <p>Halton in base 2: write k in binary and mirror it behind the point. k = 1 = 1₂ → 0.1₂ = <b>0.5</b>; k = 2 = 10₂ → 0.01₂ = <b>0.25</b>; k = 3 = 11₂ → 0.11₂ = <b>0.75</b>; k = 4 = 100₂ → 0.001₂ = <b>0.125</b>. Each new value halves an existing gap. In base 3: 1/3, 2/3, 1/9, 4/9, … The 2-D Halton points are the pairs (0.5, 0.333), (0.25, 0.667), (0.75, 0.111), (0.125, 0.444), …</p>`)}
    ${labN("pq", "pseudo-random against Halton points, with the empty cells of a 10 × 10 grid", "Left square: pseudo-random points (a good generator with 2³² states, or a deliberately small LCG with m = 2048); right square: the same number of Halton points. Shaded cells are empty. Change the number of points, press “New points” and watch which picture changes. The read-out compares the empty cells with the 100 · 0.99<sup>N</sup> expected for independent points.")}
    ${nq("Tasks of Figure 2.1", "Which methods leave empty cells, which pictures change, what does the small LCG do?", { ask: "(1) Which point sets leave empty cells, which never do? (2) Press “New points”: which pictures change? (3) Choose the small LCG: what do you notice?", idea: `clustering and low discrepancy, ${sec("disc")}.`, sol: `<p><b>(1)</b> The pseudo-random sets leave holes, about 13 empty cells for 200 points as computed above; the quasi-random sets (additive recurrence, Halton, Sobol) leave none or almost none. <b>(2)</b> Only the pseudo-random pictures change: a new seed gives new points, while a quasi-random sequence is a fixed list with no seed at all. <b>(3)</b> The small LCG (m = 2048, a = 65, c = 1) makes points from consecutive pairs of its outputs, and those pairs fall on a few parallel lines, a lattice: with only 2048 states there are only 2048 possible pairs. This is the aliasing problem of ${sec("disc", "lecture 2")}: a hidden regular pattern in the generator that shows up as structure (lines) in the points.</p>` })}
    <ul class="cmp two">
      <li><b>Pseudo-random</b><span class="v">behaves like independent uniform draws; clumps and holes; changes with the seed. Use it to <em>simulate chance</em>: arrivals, decays, mutations, moving molecules.</span></li>
      <li><b>Quasi-random</b><span class="v">covers the space evenly, but its points are <em>not independent</em>. Use it to <em>cover a space</em>: a parameter scan, points for computing an integral.</span></li>
    </ul>
    ${nq("Question 2.2", "The firework", { ask: "Each spark of a firework gets a random direction and a random speed, taken as two consecutive numbers. With quasi-random numbers the sparks lie on a spiral instead of a round burst. Why?", idea: "independence, as above.", sol: `<p>With the additive recurrence the speed is always the direction number plus 0.618 (mod 1). Direction 0.1 always comes with speed 0.718, direction 0.5 always with 0.118, and so on: <b>each direction has exactly one speed</b>, so all sparks lie on one curve. All directions do appear, and more sparks would only sharpen the spiral. Direction and speed must be independent, and consecutive quasi-random numbers are not.</p>` })}
    ${nq("Questions 2.3 and 2.4", "Which numbers for which job?", { ask: "(2.3) You simulate the arrival times of customers in a shop. (2.4) You test a model at 100 parameter combinations spread over a square of possible values.", sol: `<p><b>2.3: pseudo-random.</b> Real arrivals are independent and do clump (three customers in one minute, then nobody for ten); quasi-random arrivals would be far too regular. <b>2.4: quasi-random.</b> The goal is even coverage, not chance; pseudo-random points would leave some regions untested (about 37 of 100 grid cells for 100 points, by 100 · 0.99¹⁰⁰ = 36.6).</p>` })}
    ${nq("Question 2.5", "Synthetic microscope images", { ask: "A colleague makes synthetic microscope images of molecules in a cell and places them with a quasi-random sequence “to cover the cell evenly”. She uses them to test a program that detects whether molecules form clusters. What will the test show?", sol: `<p>The quasi-random molecules are <b>more regular than independent molecules ever are</b>, so the program reports that they avoid each other: a wrong conclusion about biology, and the program runs normally without any error message. Evenly spread is not the same as random.</p>` })}
    ${oops(`Using quasi-random numbers to “improve” a simulation of chance. They make integrals and parameter scans better; they make simulations of random events wrong.`)}
    ${tryit([
      ["Continue the additive recurrence from u = 0.326 for three more steps.", "<p>0.326 + 0.618 = 0.944; 0.944 + 0.618 = 1.562 → 0.562; 0.562 + 0.618 = 1.180 → 0.180.</p>"],
      ["What are the base-2 Halton values for k = 5 and k = 6?", "<p>5 = 101₂ → 0.101₂ = 0.5 + 0.125 = <b>0.625</b>; 6 = 110₂ → 0.011₂ = 0.25 + 0.125 = <b>0.375</b>. Both fall into the middle of the largest gaps left by 0.5, 0.25, 0.75, 0.125.</p>"],
      ["How many of 100 grid cells stay empty on average with 300 independent random points?", "<p>100 · 0.99³⁰⁰ = 100 · 0.049 = <b>4.9</b> cells.</p>"]])}

    ${h2("s-3", "3 · From uniform to any distribution")}
    ${pw(`A generator gives uniform numbers between 0 and 1. Simulations need waiting times, bell curves and many other shapes. The way there is to push the uniform numbers through a function; this section works out what a function does to a distribution and then picks the one function that produces any distribution you want.`)}
    ${h3("s-3-1", "3.1 What a function does to a random variable")}
    <p>A ${d("transform")} is simply a new ${d("rv")} made by putting X into a function g. The function must accept every value X can take, its ${d("support")}. ${sec("pre", "Lecture 2 (slides 4–5)")} starts with the discrete case: the probability of a value y is the total probability of all x that g sends to y, its ${d("preimage")}.</p>
    ${ex("Worked example: a die through g(x) = |x − 3|", `<p>X is a fair die, each face 1/6. Y = |X − 3| (distance from 3) maps 1 → 2, 2 → 1, 3 → 0, 4 → 1, 5 → 2, 6 → 3. Pre-images: Y = 0 comes from {3}, Y = 1 from {2, 4}, Y = 2 from {1, 5}, Y = 3 from {6}. So P(Y = 0) = 1/6, P(Y = 1) = 2/6, P(Y = 2) = 2/6, P(Y = 3) = 1/6, which sums to 1. A shift Y = X + a has a single x per y and stays uniform, the lecture's example.</p>`)}
    <p>The notebook's question is continuous: take a ${d("uniform")} X and square it, Y = X². Is Y still uniform?</p>
    ${jl(`begin
	x = rand(10_000)
	y = x .^ 2
	quick_hist(y)
end`, `<p><code>rand(10_000)</code> draws 10,000 uniform numbers (the underscore only separates digits, like a thousands comma). <code>x .^ 2</code> squares each of them: <code>^</code> is the power, and the dot is ${d("broadcast")}. <code>quick_hist</code> is a helper defined at the bottom of the notebook that draws a ${d("hist")}. The bars pile up steeply near 0: Y is not uniform.</p>`)}
    <p>How much they pile up follows from two steps, <b>count with the CDF, then differentiate</b>. For 0 &lt; y &lt; 1:</p>
    <div class="formula">${fl(String.raw`F_Y(y) = P(X^2 \le y) = P(X \le \sqrt{y}) = \sqrt{y}`, "F<sub>Y</sub>(y) = P(X² ≤ y) = P(X ≤ √y) = √y", "count: X² ≤ y is the same event as X ≤ √y")}${fl(String.raw`f_Y(y) = \frac{d}{dy}\sqrt{y} = \frac{1}{2\sqrt{y}}`, "f<sub>Y</sub>(y) = 1/(2√y)", "differentiate")}</div>
    <p>The last step of the count uses that P(X ≤ t) = t for a uniform X. Numbers: F<sub>Y</sub>(0.25) = √0.25 = 0.5, so half of all squared values lie below 0.25; F<sub>Y</sub>(0.01) = 0.1, so 10 % lie below 0.01. The density is f<sub>Y</sub>(0.01) = 1/(2 · 0.1) = 5, f<sub>Y</sub>(0.25) = 1/(2 · 0.5) = 1 and f<sub>Y</sub>(0.81) = 1/(2 · 0.9) = 0.556: high near 0, low near 1.</p>
    ${nq("Questions 3.2 and 3.3", "f_Y(0.25), and does the area come out as 1?", { ask: "(3.2) Compute f<sub>Y</sub>(0.25) for Y = X². (3.3) Check the result: compute the area under 1/(2√y) from 0 to 1.", idea: `transformed distributions, ${sec("cont")}.`, sol: `<p><b>3.2:</b> f<sub>Y</sub>(0.25) = 1/(2√0.25) = 1/(2 · 0.5) = <b>1</b>.</p><p><b>3.3:</b> 1/(2√y) is the derivative of √y, so the area is [√y] from 0 to 1 = √1 − √0 = <b>1</b>. Every density has area 1; this is the quick test of any transformation result.</p>` })}
    <p><b>Why the values pile up</b> (Figure 3.1 of the notebook): take 25 equally likely values of X, go up to the curve g and across to the y axis. Where g is <b>flat</b> the 25 lines arrive close together, so the density of Y is high; where g is <b>steep</b> they spread out and the density is low. For g(x) = x² the curve is flat near 0, hence the pile-up there.</p>
    <p>The same two steps work for every <b>increasing</b> g. Write ${d("inverse")} for the function that undoes g:</p>
    <div class="formula">${fl(String.raw`F_Y(y) = P(g(X) \le y) = P\big(X \le g^{-1}(y)\big) = F_X\big(g^{-1}(y)\big)`, "F<sub>Y</sub>(y) = F<sub>X</sub>(g⁻¹(y))", "count")}${fl(String.raw`f_Y(y) = f_X\big(g^{-1}(y)\big)\,\frac{d}{dy}g^{-1}(y)`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) · d g⁻¹(y)/dy", "differentiate (chain rule)")}</div>
    <p>f<sub>X</sub> is the density of X, f<sub>Y</sub> the one of Y, and d g⁻¹(y)/dy = dx/dy says how much the spacing of the lines changes. The probability between two neighbouring lines is the same before and after: f<sub>Y</sub>(y) dy = f<sub>X</sub>(x) dx.</p>
    ${ex("Worked example: Y = √X", `<p>g(x) = √x is increasing, g⁻¹(y) = y², d(y²)/dy = 2y, f<sub>X</sub> = 1. So f<sub>Y</sub>(y) = 1 · 2y = <b>2y</b> on (0, 1). Check the area: [y²] from 0 to 1 = 1. At y = 0.5: f<sub>Y</sub> = 1; at y = 0.9: 1.8. The square root is steep near 0, so values are thin there and pile up near 1, the opposite of X².</p>`)}
    ${nq("Question 3.4", "Y = 2X has density 1 on (0, 2)?", { ask: "A student transforms a uniform X with Y = 2X and writes: the density of Y is 1 on (0, 2). What is wrong?", idea: "the general rule above.", sol: `<p>Then the total area would be 1 · 2 = 2, impossible. The factor dx/dy is missing: x = y/2, so dx/dy = ½ and f<sub>Y</sub>(y) = 1 · ½ = <b>½ on (0, 2)</b>. Y is uniform, just on a twice as long interval and therefore half as high.</p>` })}
    ${oops(`Plugging g⁻¹(y) into the density and forgetting the factor dx/dy. The area test (does it integrate to 1?) catches it in one line.`)}

    ${h3("s-3-2", "3.2 Decreasing functions")}
    ${pw(`When g turns the axis around, large x become small y, so the inequality in the counting step flips. One absolute value repairs the formula for both directions.`)}
    <p>For a decreasing g such as Y = 1/X: F<sub>Y</sub>(y) = P(1/X ≤ y) = P(X ≥ 1/y) = 1 − F<sub>X</sub>(1/y). Differentiating this brings a minus sign, and since g⁻¹ is decreasing its derivative is negative too: the two minus signs cancel. For any ${d("monotone")} g:</p>
    <div class="formula">${fl(String.raw`f_Y(y) = f_X\big(g^{-1}(y)\big)\,\left|\frac{d}{dy}\,g^{-1}(y)\right|`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) · |d g⁻¹(y)/dy|", "|…|: absolute value, the number without its sign")}</div>
    ${ex("Worked example: Y = 1 − X and Y = 1/X", `<p><b>1 − X:</b> g⁻¹(y) = 1 − y, derivative −1, absolute value 1, so f<sub>Y</sub> = 1 on (0, 1): <b>still uniform</b>. This is used in section 3.4.</p>
      <p><b>1/X:</b> X in (0, 1) gives Y in (1, ∞) (∞ reads “infinity”). Count: F<sub>Y</sub>(2) = P(X ≥ 0.5) = 0.5, so half the values are below 2; F<sub>Y</sub>(10) = P(X ≥ 0.1) = 0.9. Density: g⁻¹(y) = 1/y, |d(1/y)/dy| = 1/y², so f<sub>Y</sub>(y) = 1/y² for y &gt; 1. Area: [−1/y] from 1 to ∞ = 0 − (−1) = 1 ✓.</p>`)}
    ${nq("Questions 3.5 and 3.6", "1/X: the density at 2, and the forgotten absolute value", { ask: "(3.5) X uniform, Y = 1/X: compute f<sub>Y</sub>(2). (3.6) A student forgets the absolute value and gets f<sub>Y</sub>(y) = −1/y². What went wrong?", idea: `the decreasing case, ${sec("cont")}.`, sol: `<p><b>3.5:</b> f<sub>Y</sub>(2) = 1/2² = <b>0.25</b>.</p><p><b>3.6:</b> g is decreasing, so the counting step gives F<sub>Y</sub> = 1 − F<sub>X</sub>(g⁻¹(y)), whose minus sign cancels the negative derivative of g⁻¹. Without the absolute value only one of the two signs is kept. A density can never be negative, so −1/y² is wrong on sight. (1/X does have a density, and the formula holds for every continuous X, not only uniform ones.)</p>` })}
    ${labN("tr", "five transformations of a uniform X: samples against the formula", "Pick a function with the buttons. The bars are a histogram of 6000 values g(U) for uniform U; the orange line is the density from the formula. When the formula is right, the line runs along the tops of the bars. The read-out gives the counting step, the derivative, and the density at one point.")}

    ${h3("s-3-3", "3.3 A special function: the CDF itself")}
    ${pw(`Feed a random variable into its own CDF and the result is always uniform. That fact is the key to the next section: reversed, it turns uniform numbers into any distribution.`)}
    <p>The CDF F<sub>X</sub> is steep exactly where the density is high (its slope is f<sub>X</sub>). So as g it pulls crowded values apart and pushes sparse ones together, and with dy = f<sub>X</sub>(x) dx the rule gives f<sub>Y</sub>(y) = f<sub>X</sub>(x) · dx/dy = f<sub>X</sub>(x)/f<sub>X</sub>(x) = 1 on (0, 1).</p>
    <div class="formula">${fl(String.raw`X \text{ continuous with CDF } F_X \;\Rightarrow\; F_X(X) \sim U(0, 1)`, "F<sub>X</sub>(X) is uniform on (0, 1)", "∼ reads “is distributed as”; ⇒ reads “implies”")}</div>
    ${ex("Worked example: an exponential waiting time through its own CDF", `<p>X ∼ Exp(1), F(x) = 1 − e<sup>−x</sup>. A value x = 1 becomes F(1) = 1 − 0.368 = 0.632; x = 0.1 becomes 0.095; x = 3 becomes 0.950. Check uniformity: P(F(X) ≤ 0.632) = P(X ≤ 1) = F(1) = 0.632, exactly as for a uniform number. The same works for every height u: P(F(X) ≤ u) = u.</p>`)}
    <p>The notebook shows it twice: Figure 3.2 with the exponential and the normal CDF as g, and Figure 3.3 with five distributions (exponential, normal, Gamma (another waiting-time shape), Beta(2, 5) and a two-hump mixture of two normals): left the samples, middle each sample carried through the CDF, right the histogram of F(X), flat every time. In the lecture this is ${sec("inv", "lecture 2, slide 7")}. Uniform numbers are in this sense the common raw material of all distributions.</p>

    ${h3("s-3-4", "3.4 Inversion: from uniform to any distribution")}
    ${pw(`Run the last fact backwards: take a uniform number u and find the x whose CDF value is u. That x has exactly the distribution you wanted. Use it whenever the CDF can be inverted, by a formula or numerically.`)}
    <div class="formula">${fl(String.raw`X = F^{-1}(U)`, "X = F⁻¹(U)", "the inversion method, for a continuous, strictly increasing F")}${fl(String.raw`P\big(F^{-1}(U) \le x\big) = P\big(U \le F(x)\big) = F(x)`, "P(F⁻¹(U) ≤ x) = P(U ≤ F(x)) = F(x)", "why X has the CDF F")}</div>
    <p>This is the ${d("inversion")}; F⁻¹ is also called the ${d("quantile")}. In the picture: put the height u on the vertical axis of the CDF, go across to the curve and down to x. Where the CDF is steep a whole band of heights lands on a short piece of the x axis, so values pile up where the density is high. ${sec("invp")} does the same.</p>
    <p><b>The exponential distribution.</b> The ${d("expo")} has F(x) = 1 − e<sup>−λx</sup> for x ≥ 0. Solve u = 1 − e<sup>−λx</sup> for x: e<sup>−λx</sup> = 1 − u, take ln of both sides, −λx = ln(1 − u), so</p>
    <div class="formula">${fl(String.raw`x = F^{-1}(u) = -\frac{\ln(1 - u)}{\lambda}`, "x = −ln(1 − u)/λ", "λ (lambda): events per unit time; ln: natural logarithm")}</div>
    ${ex("Worked example: four waiting times at λ = 2 per hour", `<p>u = 0.1: −ln(0.9)/2 = 0.105/2 = <b>0.053 h</b> (3 min). u = 0.5: −ln(0.5)/2 = 0.693/2 = <b>0.347 h</b>, the median waiting time (half of all waits are shorter). u = 0.7: −ln(0.3)/2 = 1.204/2 = <b>0.602 h</b> (36 min). u = 0.9: −ln(0.1)/2 = 2.303/2 = <b>1.151 h</b>. Check one: F(0.602) = 1 − e<sup>−1.204</sup> = 1 − 0.300 = 0.7 ✓. Large u (rare) give long waits; the mean is 1/λ = 0.5 h.</p>`)}
    ${labN("inv", "inversion: carry a uniform height across the CDF", "Top: the CDF of the chosen distribution. Move the slider “height u”: the dashed path goes across from u to the curve and down to x = F⁻¹(u), shown in the read-out with a check F(x) = u. The 40 short ticks on the left are uniform heights and the ticks on the x axis are where they land: dense where the CDF is steep. Bottom: a histogram of 4000 such values against the density.")}
    <p>When F⁻¹ has no formula it can be computed numerically. Julia's Distributions.jl does that for every distribution it knows:</p>
    ${jl(`quantile.(Weibull(1.5, 1.0), rand(5))       # five Weibull(1.5, 1) numbers by inversion
rand(Exponential(2.0), 5)                    # the same idea, done for you`, `<p>The first line draws five uniforms and pushes each through the quantile function of the ${d("weibull")} with shape 1.5 and scale 1 (the dot is broadcasting again). Its inverse is x = (−ln(1 − u))<sup>1/1.5</sup>; for u = 0.7: (1.204)<sup>0.667</sup> = 1.132. The second line asks for five exponential numbers directly; <code>rand</code> uses an equivalent method internally.</p>`)}
    ${oops(`<code>Exponential(2.0)</code> in Distributions.jl is given by its <em>mean</em> (scale θ = 2), not its rate: these numbers have λ = 1/2 and mean 2, not λ = 2. Likewise <code>Normal(μ, σ)</code> takes the standard deviation σ, not the variance.`)}
    ${nq("Question 3.8", "An Inf after a billion samples", { ask: "A simulation computes exponential numbers as <code>-log(rand())</code>. After 10⁹ samples one value is <code>Inf</code> (infinity) and ruins the average. What happened?", idea: "inversion with 1 − U, and U versus 1 − U from section 3.2.", sol: `<p><code>rand()</code> returns values in [0, 1): 0 is possible, 1 is not. When it returned exactly 0, −ln 0 = ∞. The formula itself is fine, because U and 1 − U have the same distribution (section 3.2), but it must use the one that can never be 0: <code>-log(1 - rand())</code>, where 1 − U lies in (0, 1], or Julia's <code>randexp()</code>. (<code>log</code> is the natural logarithm ln in Julia. Negative values cannot come from <code>rand()</code>, and an exponential number is always finite.)</p>` })}
    ${ex("Worked example: the same u through both formulas", `<p>λ = 2, u = 0.7. Correct form: −ln(1 − 0.7)/2 = 0.602. The <code>-log(u)</code> form: −ln(0.7)/2 = 0.357/2 = 0.178. Both are valid exponential samples, since u and 1 − u are equally likely, but only the first survives u = 0.</p>`)}
    ${tryit([
      ["The CDF F(x) = x³ on [0, 1]. Give the inversion formula and the sample for u = 0.125.", "<p>Solve u = x³: x = u<sup>1/3</sup>. For u = 0.125: x = 0.5 (since 0.5³ = 0.125).</p>"],
      ["X uniform, Y = X². What is f<sub>Y</sub>(0.04), and what fraction of Y lies below 0.04?", "<p>f<sub>Y</sub>(0.04) = 1/(2√0.04) = 1/(2 · 0.2) = <b>2.5</b>. F<sub>Y</sub>(0.04) = √0.04 = <b>0.2</b>: 20 % of the squared values.</p>"],
      ["X uniform, Y = 4X + 1. Give the interval and the density of Y.", "<p>Y runs from 1 to 5; x = (y − 1)/4, dx/dy = ¼, so f<sub>Y</sub> = <b>¼ on (1, 5)</b>; area 4 · ¼ = 1 ✓.</p>"]])}

    ${h2("s-4", "4 · Normal random numbers")}
    ${pw(`The ${d("normal", "normal distribution")} is the most used distribution of all, but the inversion method fails for it: its CDF has no formula to invert. This section shows a rough fix (add uniforms) and the exact one (Box–Muller).`)}
    <p>The standard normal has mean 0 and standard deviation 1, written N(0, 1); its CDF is ${d("phi", "Φ")}. There is no formula for Φ in terms of powers, exponentials and logarithms, and none for Φ⁻¹ either.</p>
    ${h3("s-4-1", "4.1 Adding uniform numbers")}
    <p>By the ${d("clt")}, a sum of many independent numbers is approximately normal. Each uniform number has ${d("mean", "mean")} ½ and ${d("variance")} 1/12, and for independent terms both add up: the sum of k uniforms has mean k/2 and variance k/12. For k = 12: mean 6 and variance 1, so Z = U₁ + … + U₁₂ − 6 has mean 0 and variance 1, the recipe of ${exeLink(1, "tutorial 1")}'s exercise 9. ${sec("bm")} explains why this is not good enough.</p>
    ${nq("Tasks of Figure 4.1 and Question 4.1", "From which k does the sum look normal, and what differs in the tails?", { ask: "Change k (the number of uniforms added: 1, 2, 3, 6, 12, 48). (1) From which k does the histogram look normal? (2) The right panel shows both densities on a logarithmic axis: where do they agree? Question 4.1: what is different there for k = 12?", idea: `the central limit theorem, ${exeLink(1, "tutorial 1, section 6")}; why the CLT is not enough, ${sec("bm")}.`, sol: `<p><b>(1)</b> k = 1 is flat, k = 2 a triangle; from about k = 3 the histogram is bell-shaped and at k = 12 it looks perfect. <b>(2)</b> A ${d("logaxis")} stretches the small values so the ${d("tail", "tails")} become visible. The curves agree in the middle (within about two standard deviations) and part ways further out. <b>4.1:</b> in the tails the sum is <em>less likely</em> than a normal number, and it can never be smaller than 0 or larger than 12 (after subtracting 6: never beyond ±6). Rare, extreme values are exactly what the tails describe, so a simulation of rare events gets them wrong.</p>
      <div class="tt-wrap"><table class="tt"><tr><th>z</th><th>P(Z &gt; z), sum of 12 uniforms − 6</th><th>P(Z &gt; z), normal</th></tr>${tails.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>
      <p class="muted">Computed here (the exact distribution of a sum of uniforms has a name, the Irwin–Hall distribution, and a piecewise-polynomial formula): at z = 3 the sum has 25 % fewer extreme values, at z = 5 about 140 times fewer.</p>`, code: "<p><code>fig_clt(k, seed)</code> draws 50,000 sums of k uniforms, histograms them against the normal density with the same mean and variance, and plots both densities on a logarithmic axis.</p>" })}
    ${h3("s-4-2", "4.2 The Box–Muller transform")}
    ${pw(`A trick: although one normal number cannot be produced by inversion, a <em>pair</em> of them can, if you describe the pair as a point in the plane by its distance and angle. Two uniforms in, two independent normals out.`)}
    <p>Two independent standard normals (X₁, X₂) form a point in the plane with the density e<sup>−(x₁² + x₂²)/2</sup>/(2π). It depends only on the distance r = √(x₁² + x₂²) from the centre, so the cloud of points is round. Describe the point in ${d("polar")}: the angle θ and the distance R.</p>
    <ul><li><b>Angle:</b> the cloud is round, so all directions are equally likely: θ = 2πU₂ (π ≈ 3.1416; 2π is a full turn, 360°).</li><li><b>Distance:</b> R has the CDF F<sub>R</sub>(r) = 1 − e<sup>−r²/2</sup>. Unlike Φ, this can be inverted: u = 1 − e<sup>−r²/2</sup> gives r = √(−2 ln(1 − u)), and since 1 − U₁ is uniform too, R = √(−2 ln U₁).</li><li><b>Back to the plane:</b> X₁ = R cos θ, X₂ = R sin θ.</li></ul>
    <div class="formula">${fl(String.raw`X_1 = \sqrt{-2\ln U_1}\,\cos(2\pi U_2)`, "X₁ = √(−2 ln U₁) cos(2πU₂)", "U₁, U₂ independent uniform on (0, 1)")}${fl(String.raw`X_2 = \sqrt{-2\ln U_1}\,\sin(2\pi U_2)`, "X₂ = √(−2 ln U₁) sin(2πU₂)", "X₁, X₂ independent standard normal")}</div>
    <p>This is the ${d("bm")}.</p>
    ${ex("Worked example: u₁ = 0.6, u₂ = 0.3 (the notebook's default sliders)", `<p>Distance: ln 0.6 = −0.511, −2 · (−0.511) = 1.022, R = √1.022 = <b>1.011</b>. Angle: θ = 2π · 0.3 = 1.885 rad = 0.3 · 360° = <b>108°</b>. Point: X₁ = 1.011 · cos 108° = 1.011 · (−0.309) = <b>−0.312</b>; X₂ = 1.011 · sin 108° = 1.011 · 0.951 = <b>0.961</b>. Two standard normal numbers from two uniform ones.</p>`)}
    ${labN("bm", "Box–Muller: choose the two uniform numbers yourself", "Move u₁ and u₂. The ring has the radius R set by u₁, the ray points in the direction θ set by u₂, and the big dot is the resulting pair (X₁, X₂). The grey cloud is 1500 points made the same way: round, densest in the middle. The read-out repeats the arithmetic of the worked example for your values.")}
    ${nq("Tasks of Figure 4.2", "Move one slider at a time", { ask: "(1) Keep u₁ fixed and move u₂: what changes? (2) Keep u₂ fixed and move u₁ from 0.01 to 0.99: which u₁ give points far from the centre?", sol: `<p><b>(1)</b> Only the angle: the point travels around a circle of fixed radius. <b>(2)</b> Small u₁ give large distances: u₁ = 0.01 gives R = √(−2 ln 0.01) = √9.21 = 3.03, u₁ = 0.5 gives 1.18, u₁ = 0.99 gives 0.14. Since P(R &gt; r) = e<sup>−r²/2</sup> = u₁, only a fraction u₁ of all pairs lies farther out than the R that u₁ produces: far-out points are rare, as they should be.</p>` })}
    ${nq("Questions 4.4 and 4.5", "Why separately, and how many uniforms?", { ask: "(4.4) Why may the angle and the distance each come from their own uniform number? (4.5) How many uniform numbers does Box–Muller need for 10⁶ normal numbers?", idea: `Box–Muller, ${sec("bm")}.`, sol: `<p><b>4.4:</b> the density depends only on the distance, so the angle tells nothing about the distance: they are independent. That splits one hard two-dimensional problem into two easy one-dimensional ones. Only a round cloud allows this; it is not true for any pair of random numbers, and X₁, X₂ are normal, not uniform.</p><p><b>4.5:</b> two uniforms give two normals, one uniform per normal number: <b>10⁶</b>.</p>` })}
    ${jl(`randn()               # one standard normal number
rand(Normal(μ, σ))    # one number from N(μ, σ²)`, `<p>In practice nobody codes Box–Muller: <code>randn()</code> gives standard normal numbers, and <code>rand(Normal(μ, σ))</code> any normal distribution. Julia allows Greek letters as variable names; type <code>\\mu</code> and Tab in Pluto to get μ.</p>`)}
    ${why("Context, not in the notebook: why the distance has that CDF", `<p>The probability that a standard normal pair lies within distance r is the integral (∫, the area or volume under a curve) of the density over the disc of radius r. In polar coordinates the area element is ρ dρ dθ (ρ, read rho, runs from 0 to r), so</p><div class="formula">${fl(String.raw`\begin{aligned} F_R(r) &= \int_0^{2\pi}\!\!\int_0^r \tfrac{1}{2\pi} e^{-\rho^2/2}\,\rho\,d\rho\,d\theta \\ &= 1 - e^{-r^2/2} \end{aligned}`, "F<sub>R</sub>(r) = ∫∫ e<sup>−ρ²/2</sup> ρ dρ dθ / (2π) = 1 − e<sup>−r²/2</sup>")}</div><p>The extra factor ρ, the circumference growing with the radius, makes the integral solvable (ρ e<sup>−ρ²/2</sup> is the derivative of −e<sup>−ρ²/2</sup>), and it is missing in one dimension, which is why Φ has no closed form. R² = −2 ln U₁ is an exponential number with mean 2 (statisticians call this distribution chi-squared with two degrees of freedom: the sum of two squared standard normals).</p>`)}
    ${oops(`Using the same uniform number for both u₁ and u₂, or reusing u₂ as the next u₁. The two inputs must be independent, exactly as in the firework of section 2.`)}
    ${tryit([
      ["Box–Muller with u₁ = 0.5, u₂ = 0.25.", "<p>R = √(−2 ln 0.5) = √1.386 = 1.177; θ = 2π · 0.25 = π/2 = 90°. X₁ = 1.177 · cos 90° = <b>0</b>, X₂ = 1.177 · sin 90° = <b>1.177</b>.</p>"],
      ["You have a standard normal Z = −0.312. Turn it into a sample of N(10, 2²) (mean 10, standard deviation 2).", "<p>X = 10 + 2Z = 10 − 0.624 = <b>9.376</b>. Shifting by μ and stretching by σ turns N(0, 1) into N(μ, σ²).</p>"],
      ["Why does adding 12 uniforms never give a value above 6 after subtracting 6, and why does that matter?", "<p>Each uniform is at most 1, so the sum is at most 12 and Z at most 6. A real normal exceeds 6 with probability about 10⁻⁹: rare, but a simulation of a billion events would need them.</p>"]])}

    ${h2("s-5", "5 · Accept–reject")}
    ${pw(`Sometimes you only know the <em>shape</em> of a density, a measured curve or a formula without a usable inverse CDF. Throw random points under a lid that covers the curve and keep only those below the curve: the kept x values follow the curve exactly. The price is the wasted points.`)}
    ${h3("s-5-1", "5.1 Darts under a curve")}
    <p>The ${d("ar")} method: throw darts uniformly into a box around the curve, keep the darts below it, use their x values. More darts are kept where the curve is high, so the kept x values have exactly the density of the curve. Because the darts fill the box evenly, the fraction kept is a ratio of areas, and the area under a density is 1. This is ${sec("ar")}.</p>
    <div class="formula">${fl(String.raw`\text{fraction kept} = \frac{\text{area under the curve}}{\text{area of the box}}`, "fraction kept = area under the curve / area of the box")}${fl(String.raw`= \frac{1}{\text{area of the box}}`, "= 1 / area of the box", "the area under a density is 1")}</div>
    ${ex("Worked example: two darts under Beta(2, 5)", `<p>The ${d("beta", "Beta(2, 5) density")} is f(x) = 30 x (1 − x)⁴ on [0, 1], highest at x = 0.2 with f(0.2) = 30 · 0.2 · 0.8⁴ = 6 · 0.4096 = 2.4576, so the box is [0, 1] × [0, 2.4576]. Dart 1 at x = 0.5 with height 0.3 · 2.4576 = 0.737: f(0.5) = 30 · 0.5 · 0.5⁴ = 0.9375, and 0.737 ≤ 0.9375, so <b>keep x = 0.5</b>. Dart 2 at x = 0.5 with height 0.5 · 2.4576 = 1.229 &gt; 0.9375: <b>reject</b>, throw another.</p>`)}
    ${chart("darts", leg([[1, "kept"], ["g", "thrown away"], [2, "density f"]]))}${cap("800 darts (500 on a phone) in the box around Beta(2, 5); blue dots under the orange curve are kept, grey ones above it are thrown away. Hover or tap the box for the count against the expected 40.7 %. Look at where the kept dots are dense: around x = 0.2, where the curve is highest.")}
    ${nq("Questions 5.1 and 5.2", "What fraction is kept?", { ask: "(5.1) Beta(2, 5) in the box [0, 1] × [0, 2.4576]. (5.2) The semicircle density (2/π)√(1 − x²) on [−1, 1], maximum 2/π at 0, in the box [−1, 1] × [0, 2/π].", idea: "the area ratio above.", sol: `<p><b>5.1:</b> box area 1 · 2.4576 = 2.4576, so 1/2.4576 = <b>0.407</b>: 40.7 % kept, 2.46 darts per sample on average.</p><p><b>5.2:</b> box area 2 · 2/π = 4/π = 1.273, so the fraction is π/4 = <b>0.785</b>.</p>` })}
    ${h3("s-5-2", "5.2 Your own density: a proposal instead of a box")}
    <p>A box is the crudest lid. In general the darts come from a ${d("proposal")}, any density that is easy to sample, stretched by a constant μ until the ${d("envelope")} lies above the target density f everywhere (here μ is just a number ≥ 1, not a mean):</p>
    <div class="formula">${fl(String.raw`\mu\,g(x) \ge f(x) \text{ for all } x`, "μ g(x) ≥ f(x) for all x", "the envelope covers f")}${fl(String.raw`x \sim g, \quad u \sim U(0, 1)`, "x from g, u uniform on (0, 1)", "draw a proposal and a uniform height")}${fl(String.raw`\text{keep } x \text{ if } u\,\mu\,g(x) \le f(x)`, "keep x if u μ g(x) ≤ f(x)", "on average a fraction 1/μ is kept")}</div>
    ${ex("Worked example: f(x) = 6x(1 − x) with a flat proposal", `<p>g = 1 on [0, 1] (uniform) and μ = 1.5, the maximum of f at x = 0.5 (6 · 0.5 · 0.5 = 1.5). Proposal x = 0.2: f(0.2) = 6 · 0.2 · 0.8 = 0.96, envelope μ g = 1.5. With u = 0.5: 0.5 · 1.5 = 0.75 ≤ 0.96, <b>keep</b>. With u = 0.7: 1.05 &gt; 0.96, <b>reject</b>. Fraction kept 1/μ = 2/3. This is programming exercise 3.</p>`)}
    ${nq("Tasks of Figure 5.2", "The drawing pad", { ask: "Draw a density in the pad (it starts with two hills) and choose a box or a hill-shaped envelope μ g from a normal density. (1) How many darts are kept with a box? (2) Lower the box below the highest point: what goes wrong, does the program warn you? (3) Fit the hill as closely as possible while staying above: how many are kept now? (4) Draw a narrow spike: why is the box so wasteful?", sol: `<p>The numbers depend on your drawing; the pattern does not. <b>(1)</b> The fraction is 1 / (area of the box), well below 1 for two hills because the valley between them is empty box. <b>(2)</b> Where the box is below the curve, every dart is kept, so the histogram follows the flat box top there instead of the curve (the notebook marks such intervals red); there is no warning. <b>(3)</b> A well-fitting hill has a smaller area, so 1/μ is larger: more darts kept. <b>(4)</b> A spike is tall and narrow: the box must be as tall as the spike over the whole width, so almost all of it is empty (case A below).</p>` })}
    ${nq("Question 5.3", "Envelope below the density", { ask: "The envelope is below the density on some interval. What happens?", sol: `<p>On that interval every dart is kept, so the samples follow the envelope there instead of f. The program runs normally, it does not stop and it is not merely slower: the <b>samples are wrong</b>. Checking μ g ≥ f is the programmer's job.</p>` })}
    ${oops(`Choosing the box height by eye. If the true maximum is higher than the box, the samples are silently wrong; compute the maximum (here f(0.2) = 2.4576 by setting the derivative to 0) or add a safety margin, as the notebook does with 1.02 × max.`)}
    ${h3("s-5-3", "5.3 Three more densities, and more dimensions")}
    <p>Does throwing darts work equally well for every density? The notebook tries three cases (Figure 5.3):</p>
    <div class="tt-wrap"><table class="tt prose"><tr><th>Case</th><th>Density and envelope</th><th>What happens</th></tr>${fails.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>
    ${nq("Questions 5.4 and 5.5, and case C", "Darts per sample, and what goes wrong", { ask: "(5.4, case A) About how many darts are thrown per kept sample? (5.5, case B) Compare the histogram of the kept values with the density: what is wrong? (Case C has no question; worked out here.)", sol: `<p><b>5.4:</b> the peak of Normal(0.4, 0.01) is 1/(0.01 · √(2π)) = 1/0.02507 = 39.9; the box is 2 % higher, 40.7, and 1 wide, area 40.7. The curve's area is 1, so about <b>41 darts</b> per sample; almost all of the box is empty.</p>
      <p><b>5.5:</b> f(x) = 1/(1 + x)² has the CDF F(x) = 1 − 1/(1 + x), so P(X &gt; 5) = 1/(1 + 5) = <b>1/6</b>. A box over [0, 5] can never produce a value above 5: a sixth of the distribution is missing, and every finite box loses part of a density that goes on forever.</p>
      <p><b>Case C:</b> the ${d("laplace")} density e<sup>−|x|</sup>/2 against 1.6 times the normal density. At 0: 0.5 against 1.6 · 0.399 = 0.638, covered. At x = 3: 0.0249 against 1.6 · 0.0044 = 0.0071, <em>not</em> covered. The two cross at |x| = 2.22 (computed here), and P(|X| &gt; 2.22) = e<sup>−2.22</sup> = 0.109 of the Laplace distribution lies out there, where the samples follow the envelope and come out far too rare.</p>` })}
    <p><b>More dimensions.</b> For uniform points in a ball, throw darts into the cube around it and keep those inside. The kept fraction is the volume ratio, which collapses as the dimension d grows.</p>
    ${nq("Questions 5.7 and 5.8", "The ball in 3 and in 30 dimensions", { ask: "(5.7) What fraction of uniform darts in the cube [−1, 1]³ lands in the ball of radius 1? (5.8) A student needs uniform points in a ball in 30 dimensions and throws darts into [−1, 1]³⁰. Good plan?", sol: `<p><b>5.7:</b> ball volume (4/3)π = 4.189, cube volume 2³ = 8, fraction 4.189/8 = π/6 = <b>0.524</b>. In 2 dimensions it was π/4 = 0.785 (circle area π, square area 4).</p><p><b>5.8: no.</b> In d dimensions the ratio is π<sup>d/2</sup> / (${d("gammaf")}(d/2 + 1) · 2<sup>d</sup>). For d = 30: π¹⁵ = 2.87 · 10⁷, Γ(16) = 15! = 1.31 · 10¹², 2³⁰ = 1.07 · 10⁹, so the ratio is 2.87 · 10⁷ / (1.31 · 10¹² · 1.07 · 10⁹) ≈ <b>2 · 10⁻¹⁴</b>: about 5 · 10¹³ darts per point. Almost all of a high-dimensional cube lies in its corners, outside the ball. Accept–reject “works in principle” but never finishes; ${d("mcmc")} is the method for this, later in the course.</p>` })}
    ${chart("dims")}${cap("Fraction of the cube [−1, 1]<sup>d</sup> that lies inside the unit ball, on a logarithmic axis (each grid step is a factor 10⁴), computed here from π<sup>d/2</sup> / (Γ(d/2 + 1) 2<sup>d</sup>). Hover or tap a row for the number of darts per kept point: 1.27 in 2 dimensions, 402 in 10, about 5 · 10¹³ in 30.")}
    ${h3("s-5-4", "5.4 Composition–rejection")}
    ${pw(`Case A wastes most of the box. Instead of one big box, use many small boxes that hug the curve, choose a box first and throw the dart only into it. Worth the set-up when many samples come from the same density.`)}
    <p>${d("comp")}: cut the x axis into blocks. The block heights come from a ladder of levels a, 2a, 4a, … up to the maximum; each block takes the lowest level that still lies above the curve there. To sample: choose a level with probability proportional to its total area, then one block of that level at random, then a dart in that block, kept or rejected as before. No block is more than twice as high as needed, so far less area is empty.</p>
    ${ex("Worked example: f(x) = 2x with four blocks and two levels", `<p>f rises from 0 to 2. Blocks of width ¼; the highest point of f in each block: 0.5, 1, 1.5, 2. Levels: a = 1 and 2a = 2. Blocks 1 and 2 (tops 0.5 and 1) take level 1, blocks 3 and 4 take level 2. Total area: 2 · ¼ · 1 + 2 · ¼ · 2 = 0.5 + 1 = 1.5, against 2 for one box [0, 1] × [0, 2]. Fraction kept: 1/1.5 = <b>67 %</b> instead of 50 %. Level 1 is chosen with probability 0.5/1.5 = ⅓, level 2 with ⅔.</p>
      <p>For the notebook's “sharp peak on a flat background” (height 18.9 at the peak, 20 blocks), the same recipe gives kept fractions of 5.3 % with 1 level (one box), 16 % with 3, 34 % with 5 and 41 % with 7 levels (computed here).</p>`)}
    ${tryit([
      ["What fraction of darts is kept for f(x) = 2x in the box [0, 1] × [0, 2]?", "<p>Box area 2, curve area 1: <b>½</b>, two darts per sample.</p>"],
      ["Same box, a dart at x = 0.5 with height u · 2 for u = 0.6. Keep or reject?", "<p>Height 1.2, f(0.5) = 1. 1.2 &gt; 1: <b>reject</b>.</p>"],
      ["How many darts on average for 1000 Beta(2, 5) samples with the box of 5.1?", "<p>2.4576 darts per sample, so about <b>2458</b>.</p>"]])}

    ${h2("s-6", "6 · Which method when")}
    <div class="tt-wrap"><table class="tt fs"><tr><th>Situation</th><th>Method</th></tr>${tool.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table></div>

    ${h2("s-calc", "Calculation problems")}
    <p>Each problem is a short check of section 3 or 5; the notebook accepts a number within 1 % of the answer. It numbers them 1–4, 6 and 7; there is no problem 5.</p>
    ${task("1", 0, "A linear map", `<p><b>Task.</b> X is uniform on (0, 1) and Y = 3X + 2. Compute f<sub>Y</sub>(3). <b>Needs:</b> the transformation rule, section 3.1.</p><p><b>Solution.</b> Y runs from 3 · 0 + 2 = 2 to 3 · 1 + 2 = 5. Inverse x = (y − 2)/3, derivative dx/dy = 1/3, f<sub>X</sub> = 1, so f<sub>Y</sub>(y) = 1/3 on (2, 5): the axis is stretched by 3, so the density is a third as high. 3 lies inside, so f<sub>Y</sub>(3) = 1/3. Area check: 3 · 1/3 = 1.</p>${ans([["1/3", "f<sub>Y</sub>(3)"]])}`)}
    ${task("2", 0, "Minus the logarithm", `<p><b>Task.</b> X uniform on (0, 1), Y = −ln X. Compute f<sub>Y</sub>(1). <b>Needs:</b> the decreasing case, section 3.2.</p><p><b>Solution.</b> −ln is decreasing and maps (0, 1) onto (0, ∞). Inverse: y = −ln x ⇔ x = e<sup>−y</sup>. Derivative dx/dy = −e<sup>−y</sup>, absolute value e<sup>−y</sup>. So f<sub>Y</sub>(y) = 1 · e<sup>−y</sup> for y &gt; 0: Y is Exponential(1), the inversion recipe in disguise. f<sub>Y</sub>(1) = e<sup>−1</sup> = 0.368.</p>${ans([["e⁻¹ ≈ 0.368", "f<sub>Y</sub>(1)"]])}`)}
    ${task("3", 0, "The cube", `<p><b>Task.</b> X uniform on (0, 1), Y = X³. Compute f<sub>Y</sub>(0.125). <b>Needs:</b> section 3.1.</p><p><b>Solution.</b> Inverse x = y<sup>1/3</sup>; at y = 0.125: x = 0.5. Derivative dx/dy = (1/3) y<sup>−2/3</sup> = (1/3) · 0.125<sup>−2/3</sup> = (1/3) · 4 = 4/3 (0.125<sup>1/3</sup> = 0.5, squared 0.25, inverted 4). Equivalently 1/g′(x) with g′(x) = 3x² = 3 · 0.25 = 0.75: 1/0.75 = 4/3.</p>${ans([["4/3 ≈ 1.333", "f<sub>Y</sub>(0.125)"]])}`)}
    ${task("4", 0, "Normalising a density", `<p><b>Task.</b> f(x) = c x on [0, 2] is a density; find c. <b>Needs:</b> area 1, tutorial 1.</p><p><b>Solution.</b> ∫₀² c x dx = c · [x²/2]₀² = c · 2 = 1, so c = ½. Going further for inversion: F(x) = x²/4 on [0, 2]; u = x²/4 gives x = 2√u (u = 0.25 → x = 1).</p>${ans([["½", "c"], ["2√u", "F⁻¹(u), for inversion"]])}`)}
    ${task("6", 0, "Darts for 3x²", `<p><b>Task.</b> f(x) = 3x² on [0, 1] is sampled by darts in the box [0, 1] × [0, 3]. What fraction is kept? <b>Needs:</b> section 5.1.</p><p><b>Solution.</b> Area under f: [x³]₀¹ = 1. Box area 1 · 3 = 3. Fraction 1/3: three darts per sample on average.</p>${ans([["1/3", "fraction kept"], ["3", "darts per sample on average"]])}`)}
    ${task("7", 0, "Which is not uniform?", `<p><b>Task.</b> U is uniform on (0, 1). Which of 1 − U, U², F(X) for an exponential X is <em>not</em> uniform? <b>Needs:</b> sections 3.2 and 3.3.</p><p><b>Solution.</b> 1 − U is a reflection, uniform (section 3.2). F(X) is uniform for every continuous X (section 3.3). U² piles up near 0 with density 1/(2√y) (section 3.1).</p>${ans([["U²", "the odd one out"]])}`)}

    ${h2("s-prog", "Programming exercises")}
    <p>Each exercise gives a function with <code>return missing</code> (${d("missing")} is Julia's “no value yet”) and a check cell below it that tests the function and, when it passes, plots a histogram of its samples against the right density.</p>
    ${task("P1", 0, "Inversion", `<p><b>Task.</b> The density f(x) = 2(1 − x) on [0, 1] has the CDF F(x) = 1 − (1 − x)². Complete <code>tri_inv(u)</code> so that it returns F⁻¹(u). <b>Needs:</b> inversion, section 3.4.</p>
      <p><b>Solution.</b> Solve u = 1 − (1 − x)²: (1 − x)² = 1 − u, so 1 − x = √(1 − u) (the positive root, since 1 − x ≥ 0 on [0, 1]) and x = 1 − √(1 − u). The check's five values: u = 0 → 1 − 1 = 0; u = 0.19 → 1 − √0.81 = 1 − 0.9 = 0.1; u = 0.36 → 1 − 0.8 = 0.2; u = 0.75 → 1 − 0.5 = 0.5; u = 0.99 → 1 − 0.1 = 0.9.</p>
      ${jl(`function tri_inv(u)
	return 1 - sqrt(1 - u)
end`, `<p><code>function … end</code> defines a function; <code>sqrt</code> is the square root. The check computes <code>tri_inv.(us)</code> (broadcast over the five test values) and compares with <code>≈</code> (“approximately equal”, which tolerates rounding), then draws 20,000 samples <code>tri_inv(rand())</code> as a histogram over the density. The explorer in section 3.4 shows the same density under “exercise 1”.</p>`)}${ans([["1 − √(1 − u)", "tri_inv(u)"]])}`)}
    ${task("P2", 0, "Box–Muller", `<p><b>Task.</b> Complete <code>boxmuller(u1, u2)</code> so that it returns the pair (x₁, x₂). <b>Needs:</b> section 4.2.</p>
      <p><b>Solution.</b> R = √(−2 ln u₁), θ = 2π u₂, return (R cos θ, R sin θ). The check's exact test at (0.3, 0.2): R² = −2 ln 0.3 = 2.408, R = 1.552, θ = 0.4π = 72°, so (x₁, x₂) = (1.552 · 0.309, 1.552 · 0.951) = (0.480, 1.476), and indeed x₁² + x₂² = 0.230 + 2.178 = 2.408 = −2 ln 0.3. That identity pins down that u₁, not u₂, sets the distance.</p>
      ${jl(`function boxmuller(u1, u2)
	R = sqrt(-2log(u1)); θ = 2π * u2
	return (R * cos(θ), R * sin(θ))
end`, `<p><code>log</code> is the natural logarithm; <code>2log(u1)</code> means 2 · log(u1) (Julia lets a number stand directly before a name), and <code>π</code> is built in. Round brackets with a comma make a <em>tuple</em>, a fixed pair of values. The check draws 20,000 pairs and wants mean ≈ 0, variance ≈ 1 and a correlation of x₁ and x₂ near 0 (correlation measures how strongly two quantities move together; 0 means no linear relation), then plots the histogram over the normal density.</p>`)}${ans([["(R cos θ, R sin θ)", "R = √(−2 ln u₁), θ = 2πu₂"]])}`)}
    ${task("P3", 0, "Accept–reject", `<p><b>Task.</b> Complete <code>accept_reject(f, fmax, n)</code>: return n samples from a density f on [0, 1] with f ≤ fmax, using darts in the box [0, 1] × [0, fmax]. <b>Needs:</b> section 5.1.</p>
      <p><b>Solution.</b> Repeat until n values are kept: x = a uniform number, a height y = fmax times another uniform number, keep x if y ≤ f(x). The check uses f(x) = 6x(1 − x) (Beta(2, 2)) with fmax = 1.5: box area 1.5, so 2/3 of the darts are kept and 20,000 samples need about 1.5 · 20,000 = 30,000 darts. Exact mean 0.5 (the density is symmetric about 0.5) and variance E[X²] − 0.25 = 0.3 − 0.25 = 0.05 (E[X²] = ∫ 6x³(1 − x) dx = 6(¼ − ⅕) = 0.3).</p>
      ${jl(`function accept_reject(f, fmax, n)
	out = Float64[]
	while length(out) < n
		x = rand(); y = fmax * rand()
		y <= f(x) && push!(out, x)
	end
	return out
end`, `<p><code>Float64[]</code> is an empty vector for 64-bit decimal numbers. <code>while … end</code> repeats as long as fewer than n values are kept. <code>a &amp;&amp; b</code> runs b only if a is true, so the line keeps x exactly when the dart is under the curve; ${d("push")} appends it to <code>out</code>. The check wants exactly 20,000 values in [0, 1], mean within 0.01 of 0.5 and variance within 0.004 of 0.05.</p>`)}${ans([["2/3", "fraction kept"], ["0.5 · 0.05", "mean · variance of Beta(2, 2)"]])}`)}

    ${h2("s-bonus", "Optional bonuses")}
    <p><b>A · A galaxy from <code>rand()</code>.</b> Each of 12,000 stars is built from a few uniform numbers pushed through this tutorial's methods. <b>Distance</b> from the centre: exponential by inversion, r = −ln(1 − U) (U = 0.5 gives r = 0.69; most stars are near the centre). <b>Spiral arm</b>: a discrete uniform choice among K arms, the ${d("floor")} ⌊K U⌋, so each arm has probability 1/K (K = 2, U = 0.7: ⌊1.4⌋ = arm 1); along the arm the angle winds as θ = 2π · arm/K + w ln r. <b>Scatter</b> around the arm and the round central bulge: normal numbers by Box–Muller. <b>Bulge or arm</b>: a ${d("bern")} draw, bulge if U &lt; 0.15 (15 % of the stars). <b>Brightness</b>: a ${d("pareto")}, by inversion L = (1 − U)<sup>−1/2</sup> (U = 0.75 gives L = 0.25<sup>−1/2</sup> = 2, U = 0.99 gives 10: most stars faint, a few very bright). Switching to quasi-random numbers spoils the picture, because each star uses several <em>consecutive</em> numbers, which must be independent: the firework of section 2 again.</p>
    <p><b>B · Randomness in music.</b> (1) The Karplus–Strong plucked string (1983): start with about 100 uniform random numbers, one period of the tone (22,050 samples per second / 220 Hz = 100.2; Hz, hertz, means vibrations per second), play them over and over, and at each repetition replace every number by the average of itself and its neighbour. Repetition makes a tone of pitch 220 Hz; the averaging smooths the noise, and the result sounds like a plucked string, slightly different for each random start. (2) The musical dice game printed in 1792 under Mozart's name composes a 16-bar waltz: for each bar roll two dice, and the sum 2 … 12 picks one of eleven prepared bars. The sums are not equally likely: P(7) = 6/36 against P(2) = 1/36, so the bars for 7 are six times as frequent (the two-dice distribution of ${exeLink(1, "tutorial 1")}). (3) A computer recognises a rāga (a melodic framework of Indian classical music with its own note probabilities) by ${d("bayes")}: after each note it multiplies its belief in each of four rāgas by the probability that this rāga plays that note, and rescales; all four start at 25 %.</p>
    ${ex("Context, not in the notebook: one Bayes update with toy numbers", `<p>Two rāgas, A and B, each believed with 50 %. The note heard is played by A with probability 0.2 and by B with 0.05. Multiply: 0.5 · 0.2 = 0.10 and 0.5 · 0.05 = 0.025; rescale by the total 0.125: A 0.10/0.125 = <b>80 %</b>, B 20 %. A second such note: 0.8 · 0.2 = 0.16 and 0.2 · 0.05 = 0.01, total 0.17, A now 94 %. The numbers are made up for the illustration; the method is ${sec("bayes")}.</p>`)}

    ${why("Context, not in the notebook: what this tutorial sets up", `<p>Every later method consumes uniform numbers through one of these doors. Markov chains (${lecLink(3, "lecture 3")}: random processes that remember only their current state) need a discrete draw per step, which is inversion on a staircase CDF; Monte Carlo integration (lecture 4: computing an integral as an average over random points) is where quasi-random points earn their keep and pseudo-random ones give honest error bars; Metropolis–Hastings (the standard MCMC algorithm) keeps an accept-or-reject step but moves a chain instead of throwing independent darts, the answer to the 30-dimensional ball; Brownian motion (the random jitter of a particle) and the schemes for stochastic differential equations (SDEs, equations of motion with a random push) eat one normal number per step, Box–Muller's job.</p>`)}
    <h2>Take-home</h2>
    <ul>
      <li><b>Where do random numbers come from?</b> From a deterministic recipe (state, update, output) started at a seed: fast and reproducible, and repeating after its period.</li>
      <li><b>When is a generator unsafe?</b> When the number of draws, summed over all parallel jobs, comes anywhere near the period, or the parameters give a short cycle.</li>
      <li><b>Pseudo or quasi?</b> Pseudo-random to simulate chance (clumps are real), quasi-random to cover a space evenly (not independent).</li>
      <li><b>Density of g(X)?</b> Count with the CDF, then differentiate: f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) |dg⁻¹(y)/dy|; check that the area is 1.</li>
      <li><b>Any distribution from uniforms?</b> Inversion, X = F⁻¹(U); e.g. −ln(1 − U)/λ for an exponential.</li>
      <li><b>Normal numbers?</b> Box–Muller: distance √(−2 ln U₁), angle 2πU₂; not a sum of uniforms, whose tails are wrong.</li>
      <li><b>Only the shape known?</b> Accept–reject: fraction kept = 1 / area of the envelope; the envelope must cover f everywhere; hopeless in many dimensions.</li>
    </ul>
    <p class="muted">Material: OPAL → Exercises2026 → SMS_T02.jl (notebook dated 5 Nov). Lecture it belongs to: ${lecLink(2, "lecture 2")}. Previous: ${exeLink(1, "tutorial 1")}. Next tutorial: ${exeLink(3, "tutorial 3")} (12 Nov).</p>`;
}
