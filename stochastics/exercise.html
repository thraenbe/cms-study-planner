<script>
const { m, c, esc, U, fmt, daysUntil, lec, exe, today, EX } = SAP;
const { key, leg, flag, hbar, vbar, num, pct, col, CHARTS, LINES, place, chart, lab, line, mountCharts, isNarrow } = SAPViz;
const q = new URLSearchParams(location.search).get("n");
const e = q === null ? null : c.exercises.find(x => String(x.n) === q);
const page = document.getElementById("page");
const back = `<a class="back" href="stochastics.html">← All lectures and exercises</a>`;
const title = e => `${EX} ${e.n}${e.title ? ` – ${esc(e.title)}` : ""}`;
function head(e) {
  const meta = `${e.published ? `Sheet in OPAL since ${fmt(e.published)} · ` : ""}discussed ${fmt(e.date)}${exe ? ` · ${exe.start}–${exe.end} · ${esc(exe.room)} · ${esc(exe.who || "")}` : ""}${e.points ? ` · ${e.points} points` : ""}`;
  return `${back}<div class="big-icon">${e.icon}</div><h1>${title(e)}</h1><p class="meta">${meta}</p>`;
}
// A task of the sheet (its number and points on the left, the question restated in our own words, then the worked
// answer), the answer tiles, and the context / worked-example boxes.
const task = (id, pts, t, body) => `<section class="task" id="t${String(id).replace(/\W/g, "")}"><div class="task-h"><span class="task-n">${id}</span><h2>${t}</h2>${pts ? `<span class="pts">${pts} pt</span>` : `<span class="pts open">discussed in the session</span>`}</div>${body}</section>`;
const ans = items => `<div class="ans">${items.map(([v, l]) => `<div class="a"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
const why = (t, body) => `<div class="why"><div class="kicker">${t}</div>${body}</div>`;
const ex = (t, body) => `<div class="ex"><div class="kicker">${t}</div>${body}</div>`;
const tbl = (head, rows) => `<details class="tbl"><summary>Table view of the chart</summary><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map((v, i) => `<td class="${i ? "n" : ""}">${v}</td>`).join("")}</tr>`).join("")}</table></details>`;

// ---------------- Write-ups: one function per exercise, registered in WRITEUPS below ----------------
// function exercise1() { return `${head(e)}<p class="lead">…</p>${task("1", 4, "…", `<p>…</p>${ans([["42", "answer"]])}`)}<h2>Before the session</h2><ul>…</ul>`; }

function placeholder() {
  const d = daysUntil(e.date), prev = e.lecture != null ? c.lectures.find(x => x.n === e.lecture) : null;
  return `${head(e)}
    <div class="box placeholder">
      <div class="big-icon">${e.icon}</div>
      <h2 style="margin-top:.4rem">${e.published ? "Sheet online, write-up pending" : "Not published yet"}</h2>
      <p class="muted">This session is ${d > 0 ? `in ${d} day${d > 1 ? "s" : ""}` : d === 0 ? "today" : "over, but its sheet is not worked through here yet"}: ${fmt(e.date)}${exe ? `, ${exe.start}–${exe.end}, ${esc(exe.room)}` : ""}.<br>${esc(e.blurb)}${prev ? ` <a href="stochastics/lecture.html?n=${prev.n}">Lecture ${prev.n}</a> is the material it draws on.` : ""}<br>The write-up appears here once the sheet is available.</p>
    </div>`;
}
// ---------------- Shared helpers ----------------
const mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const tiles = items => `<div class="tiles">${items.map(([v, l]) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
const cap = t => `<figcaption>${t}</figcaption></figure>`;
const lecLink = (n, t) => `<a href="stochastics/lecture.html?n=${n}">${t || `lecture ${n}`}</a>`;
const before = (t, items) => `<div class="before"><div class="kicker">${t}</div><ol>${items.map(i => `<li>${i}</li>`).join("")}</ol></div>`;
const frac36 = k => `${k}/36`;

// ---------------- Study helpers: the page has to work for someone who was not in the room ----------------
// Headings with ids (the glossary and the "Before you start" links point at them).
const h2 = (id, t) => `<h2 id="${id}">${t}</h2>`, h3 = (id, t) => `<h3 id="${id}">${t}</h3>`;
// "In plain words" opener, "Common mistake" line, a symbol with how to read it.
const pw = t => `<p class="pw"><b>In plain words.</b> ${t}</p>`;
const oops = t => `<p class="oops"><b>Common mistake.</b> ${t}</p>`;
// A term at its first use: marked, and collected in the glossary at the top (GLOSS[key] = [label, definition]).
let GLOSS = {};
const d = (k, text) => `<dfn data-g="${k}">${text || (GLOSS[k] ? GLOSS[k][0] : k)}</dfn>`;
function buildGloss(root) {
  const box = root.querySelector("#gloss"); if (!box) return;
  const seen = new Map(); let where = null;
  root.querySelectorAll("h2[id], h3[id], dfn[data-g]").forEach(el => {
    if (el.tagName !== "DFN") { where = el; return; }
    const k = el.dataset.g; if (!seen.has(k) && GLOSS[k]) seen.set(k, where);
  });
  const rows = [...seen].map(([k, h]) => [GLOSS[k][0], GLOSS[k][1], h]).sort((a, b) => a[0].replace(/[^\p{L}\d]/gu, "").localeCompare(b[0].replace(/[^\p{L}\d]/gu, ""), "en", { sensitivity: "base" }));
  box.innerHTML = `<details class="gloss"><summary>Terms used on this page <span class="muted">(${rows.length}, alphabetical; each with the section where it is first explained)</span></summary><dl>${rows.map(([t, def, h]) =>
    `<div class="ge"><dt>${t}</dt><dd>${def}${h ? ` <a class="where" href="stochastics/exercise.html?n=${e.n}#${h.id}">first in: ${h.textContent.replace(/\s*\(.*\)$/, "")}</a>` : ""}</dd></div>`).join("")}</dl></details>`;
}
// A question or task of the notebook: restated, the lecture idea it needs, the full solution, what the code does.
const nq = (id, title, o) => `<div class="nq" id="q-${String(id).toLowerCase().replace(/[^a-z0-9]+/g, "-")}"><div class="nq-h"><span class="nq-n">${id}</span><b>${title}</b></div>
    <p class="nq-ask">${o.ask}</p>${o.idea ? `<p class="nq-idea"><span>Needs</span> ${o.idea}</p>` : ""}
    <div class="nq-sol"><span>Solution</span>${o.sol}</div>${o.code ? `<div class="nq-code"><span>In the notebook</span>${o.code}</div>` : ""}</div>`;
// Julia code and what it does, in words (the reader may never run it).
const jl = (code, words) => `<div class="jl"><pre><code>${esc(code)}</code></pre><div class="jl-w">${words}</div></div>`;
// "Try it yourself": short questions, each with a hidden full solution.
const tryit = items => `<div class="try"><div class="kicker">Try it yourself</div><ol>${items.map(([qq, a]) => `<li><div class="try-q">${qq}</div><details><summary>Show the solution</summary><div class="try-a">${a}</div></details></li>`).join("")}</ol></div>`;
// Lecture sections (ids follow the agreed scheme "s-" + slug of the heading; a missing id just opens the page top).
const SEC = {
  fake: [2, "s-faking-randomness", "Faking randomness"], pre: [2, "s-transformations-and-pre-images", "Transformations and pre-images"],
  cont: [2, "s-continuous-transforms-through-the-cdf", "Continuous transforms: through the CDF"], inv: [2, "s-the-inversion-transform", "The inversion transform"],
  lcg: [2, "s-uniform-generators-the-lcg", "Uniform generators: the LCG"], disc: [2, "s-clustering-low-discrepancy-and-aliasing", "Clustering, low discrepancy and aliasing"],
  invp: [2, "s-non-uniform-numbers-inversion-in-practice", "Non-uniform numbers: inversion in practice"], bm: [2, "s-gaussian-numbers-why-not-the-clt-and-box-muller", "Gaussian numbers: why not the CLT, and Box–Muller"],
  ar: [2, "s-accept-reject-sampling", "Accept–reject sampling"],
  rv: [1, "s-part-8-random-variables", "Random variables"], cond: [1, "s-part-5-conditional-probability-and-independence", "Conditional probability and independence"],
  bayes: [1, "s-part-6-bayes-theorem", "Bayes' theorem"], chain: [1, "s-part-7-total-probability-the-chain-rule-and-the-birthday-problem", "Total probability, the chain rule, and the birthday problem"],
  axioms: [1, "s-part-3-kolmogorov-s-axioms-and-the-rules-that-follow", "Kolmogorov's axioms"], comb: [1, "s-part-4-combinatorics-and-the-probability-space", "Combinatorics and the probability space"],
  space: [1, "s-part-2-the-chain-of-definitions", "The chain of definitions"], sheet: [1, "s-formula-sheet", "Formula sheet"],
  markov: [3, "s-from-i-i-d-steps-to-the-markov-property", "From i.i.d. steps to the Markov property"],
};
const sec = (k, t) => { const [n, id, name] = SEC[k]; return `<a href="stochastics/lecture.html?n=${n}#${id}">${t || `lecture ${n}, “${name}”`}</a>`; };
const labN = (name, title, how) => lab(name, title).replace('<div class="lab-body">', `<p class="lab-note">${how}</p><div class="lab-body">`);

// ================= Tutorial 1 · Probability refresher 2 (Pluto notebook SMS_T01, 29 Oct) =================
// Screening test of section 1.1: 1000 people as one segmented bar (ill/healthy × positive/negative).
const SCR = [["ill, test positive", 45, 1], ["ill, test negative", 5, 3], ["healthy, test positive", 95, 2], ["healthy, test negative", 855, 4]];
CHARTS.screen = narrow => {
  const W = narrow ? 340 : 600, H = 76, L = 4, R = 4, PW = W - L - R, gap = 2; let x = L;
  const segs = SCR.map(([k, n, s]) => { const w = n / 1000 * PW - gap, x0 = x; x += n / 1000 * PW;
    return `<g class="pt" tabindex="0" data-tip="${esc(`<b>${k}</b>${n} of 1000 people (${pct(n / 1000)})`)}"><rect class="seg s${s}" x="${x0}" y="12" width="${Math.max(w, 1)}" height="34" rx="3"/>${w > 40 ? `<text class="val" x="${x0 + w / 2}" y="${34}" text-anchor="middle" style="fill:#fff">${n}</text>` : ""}</g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Segmented bar of 1000 people: 45 ill and positive, 5 ill and negative, 95 healthy and positive, 855 healthy and negative. Of the 140 positives only 45 are ill.">${segs}<text class="note" x="${L}" y="${H - 10}">← 140 test positive: 45 ill, 95 healthy</text><text class="note" x="${W - R}" y="${H - 10}" text-anchor="end">860 test negative →</text></svg>`;
};
// Weather tree of section 1.2: two days, four sequences.
CHARTS.tree = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 250 : 240, x0 = narrow ? 24 : 60, x1 = narrow ? 150 : 250, x2 = narrow ? 268 : 440, cy = H / 2;
  const d1 = [["sun", 0.7, cy - 58], ["rain", 0.3, cy + 58]], leaves = [["sun", "sun", 0.8, cy - 90], ["sun", "rain", 0.2, cy - 30], ["rain", "sun", 0.4, cy + 30], ["rain", "rain", 0.6, cy + 90]];
  const p1 = Object.fromEntries(d1.map(([w, p]) => [w, p])), y1 = Object.fromEntries(d1.map(([w, , y]) => [w, y]));
  const nodes = d1.map(([w, p, y]) => `<line class="edge" x1="${x0}" y1="${cy}" x2="${x1}" y2="${y}"/><text class="tick" x="${(x0 + x1) / 2 - 6}" y="${(cy + y) / 2 - 6}" text-anchor="middle">${p}</text><circle class="node ${w}" cx="${x1}" cy="${y}" r="7"/><text class="cat" x="${x1}" y="${y + (w === "sun" ? -12 : 20)}" text-anchor="middle">day 1: ${w}</text>`).join("");
  const lv = leaves.map(([a, b, p, y]) => { const pr = p1[a] * p;
    return `<g class="pt" tabindex="0" data-tip="${esc(`<b>${a} then ${b}</b>P(X₁ = ${a}) · P(X₂ = ${b} | X₁ = ${a}) = ${p1[a]} · ${p} = ${num(pr, 2)}`)}"><line class="edge" x1="${x1}" y1="${y1[a]}" x2="${x2}" y2="${y}"/><text class="tick" x="${(x1 + x2) / 2}" y="${(y1[a] + y) / 2 - 5}" text-anchor="middle">${p}</text><rect class="leaf" x="${x2 - 4}" y="${y - 13}" width="${narrow ? 72 : 120}" height="26" rx="6"/><circle class="node ${b}" cx="${x2 + 8}" cy="${y}" r="5"/><text class="cat" x="${x2 + 18}" y="${y + 4}">${narrow ? "" : `${a}, ${b}: `}${num(pr, 2)}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Probability tree for two days of weather. Day 1 is sun with 0.7 or rain with 0.3; given sun, day 2 is sun with 0.8 or rain with 0.2; given rain, sun with 0.4 or rain with 0.6. The four sequences have probabilities 0.56, 0.14, 0.12 and 0.18, which sum to 1.">
    <circle class="node" cx="${x0}" cy="${cy}" r="7" style="fill:var(--vz-gray)"/><text class="cat" x="${x0}" y="${cy + 22}" text-anchor="middle">start</text>${nodes}${lv}</svg>`;
};
// Sum of two dice (section 3): PMF bars and the CDF as a step line.
const SP = Array.from({ length: 11 }, (_, i) => 6 - Math.abs(i + 2 - 7)), SF = SP.map((_, i) => SP.slice(0, i + 1).reduce((a, b) => a + b, 0));
CHARTS.dice = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 220 : 250, L = narrow ? 34 : 44, R = narrow ? 34 : 44, T = 16, B = 32, PW = W - L - R, PH = H - T - B, bw = PW / 11;
  const yp = v => T + PH - v / 36 * PH * 6, yf = v => T + PH - v / 36 * PH;
  const bars = SP.map((k, i) => { const x0 = L + i * bw + bw * 0.22, w = bw * 0.56, s = i + 2;
    return `<g class="pt" tabindex="0" data-tip="${esc(`<b>sum ${s}</b>p(${s}) = ${frac36(k)} = ${num(k / 36, 3)}<br>F(${s}) = P(X ≤ ${s}) = ${frac36(SF[i])} = ${num(SF[i] / 36, 3)}`)}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${PH}"/><path class="bar s1" d="${vbar(x0, w, yp(k), T + PH)}"/><text class="cat" x="${x0 + w / 2}" y="${H - 12}" text-anchor="middle">${s}</text></g>`; }).join("");
  const step = "M" + SF.map((f, i) => `${L + i * bw},${yf(i ? SF[i - 1] : 0)} L${L + i * bw},${yf(f)} L${L + (i + 1) * bw},${yf(f)}`).join(" L");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of the probability of each sum of two dice, from 1/36 at 2 and 12 to 6/36 at 7, with the cumulative distribution as a staircase from 0 to 1 overlaid.">
    ${[0, 1, 2, 3, 4, 5, 6].map(k => `<line class="${k ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${yp(k)}" y2="${yp(k)}"/><text class="tick" x="${L - 5}" y="${yp(k) + 4}" text-anchor="end">${k}/36</text>`).join("")}
    ${[0, 0.5, 1].map(f => `<text class="tick" x="${W - R + 5}" y="${yf(f * 36) + 4}">${f}</text>`).join("")}
    <text class="note" x="${L - 30}" y="10">p(x)</text><text class="note" x="${W - R + 2}" y="10">F(x)</text>${bars}<path class="step" d="${step}"/></svg>`;
};
// Density f(x) = 2x on [0, 1] (section 4): the shaded area is P(0.2 ≤ X ≤ 0.5) = 0.21; the CDF x² beside it.
CHARTS.dens = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 300 : 200, two = !narrow, pw = two ? (W - 70) / 2 : W - 50, ph = two ? H - 44 : (H - 70) / 2;
  const panel = (ox, oy, f, fmax, title, area) => { const x = v => ox + 34 + v * (pw - 40), y = v => oy + 14 + (ph - 36) * (1 - v / fmax);
    const pts = Array.from({ length: 51 }, (_, k) => k / 50), path = "M" + pts.map(v => `${x(v).toFixed(1)},${y(f(v)).toFixed(1)}`).join(" L");
    const ar = area ? `<path class="area" d="M${x(0.2)},${y(0)} L${x(0.2)},${y(f(0.2))} L${x(0.5)},${y(f(0.5))} L${x(0.5)},${y(0)} Z"/>` : `<line class="ann" x1="${x(0.2)}" x2="${x(0.2)}" y1="${y(0)}" y2="${y(0.04)}" stroke-dasharray="3 2"/><line class="ann" x1="${x(0.5)}" x2="${x(0.5)}" y1="${y(0)}" y2="${y(0.25)}" stroke-dasharray="3 2"/><line class="ann" x1="${x(0)}" x2="${x(0.5)}" y1="${y(0.25)}" y2="${y(0.25)}" stroke-dasharray="3 2"/><line class="ann" x1="${x(0)}" x2="${x(0.2)}" y1="${y(0.04)}" y2="${y(0.04)}" stroke-dasharray="3 2"/>`;
    return `<text class="note" x="${ox + 34}" y="${oy + 8}">${title}</text><line class="axis" x1="${x(0)}" x2="${x(1)}" y1="${y(0)}" y2="${y(0)}"/><line class="axis" x1="${x(0)}" x2="${x(0)}" y1="${y(0)}" y2="${y(fmax)}"/>

function exercise1() {
  const fam = [["Binomial Bin(n, p)", "number of successes in n independent two-outcome trials", "n p", "n p (1 − p)"], ["Uniform U(a, b)", "every value in [a, b] equally likely", "(a + b)/2", "(b − a)²/12"], ["Normal N(μ, σ²)", "symmetric bell curve around μ", "μ", "σ²"], ["Poisson Poiss(λ)", "number of events at a constant rate", "λ", "λ"], ["Exponential Exp(λ)", "waiting time until the next event", "1/λ", "1/λ²"]];
  return `${head(e)}
    <p class="lead">The first tutorial is a Pluto notebook (Julia) rather than a sheet: "Probability Refresher 2: Random Variables and Distributions", dated 29 October. It picks up where ${lecLink(1, "lecture 1")} stops, with the formulas from the lecture in a box at the top, and then builds the second half of the refresher out of interactive figures and quick checks: sequences and the chain rule, the three types of random variables, PMF and CDF, densities, joint distributions, moments, the common families and the central limit theorem. A block of nine exercises closes it. The notebook reached OPAL (Exercises2026) on 1 November, after the session; the numbers below follow its own questions and reveal cells, recomputed here.</p>
    ${before("Before the session: get Pluto running (OPAL guide, 7 pages)", ["Install Julia once: on Windows through the Microsoft Store command in a terminal, on macOS and Linux with the installer script from julialang.org (not the distribution's package, which is outdated). Open a new terminal afterwards.", "In Julia run the package manager once to add Pluto; the first time takes a few minutes.", "Every time: start julia, run <code>import Pluto; Pluto.run()</code>, paste the path of the downloaded notebook into 'Open a notebook' (strip quotes and a leading file://) and click 'Run notebook code'. Stop Pluto with Ctrl+C in the terminal, and keep that terminal open while working.", "The guide's FAQ covers a blocked store, a missing curl, WSL, slow downloads and the 'file not found' path problems."])}

    <h2>1 · Several events: the screening test, sequences, the chain rule</h2>
    <p>A screening test is applied to 1000 people: 50 are ill, of whom 45 test positive; 950 are healthy, of whom 95 test positive. The notebook lets you condition on "everybody", "ill", "healthy", "positive" or "negative" and watch the table shrink to the condition: that is what P(A | B) means.</p>
    ${chart("screen", leg([[1, "ill, positive"], [3, "ill, negative"], [2, "healthy, positive"], [4, "healthy, negative"]]))}${cap("The notebook's table as one bar. P(ill ∩ positive) = 45/1000 = 0.045 in whichever order it is written; P(positive | ill) = 45/50 = 0.9, but P(ill | positive) = 45/140 = 0.321; P(positive) = 0.9 · 0.05 + 0.1 · 0.95 = 0.14 by total probability. Ill and positive are not independent, because 0.9 ≠ 0.14.")}
    <p><b>Sequences.</b> The weather on two days, each sun or rain: P(X₁ = sun) = 0.7, and given sun, day 2 is sun with 0.8; given rain, day 2 is sun with 0.4. A comma lists values in time order, so P(X₁ = rain, X₂ = sun) = 0.3 · 0.4 = 0.12 is not P(X₁ = sun, X₂ = rain) = 0.7 · 0.2 = 0.14. Three things that look alike and are not: P(A ∩ B) = P(B ∩ A) always; P(A | B) ≠ P(B | A) in general; a sequence changes when its values are swapped.</p>
    ${chart("tree")}${cap("All sequences of two days; hover a leaf for its product. The four probabilities add up to 1. Reading the tree backwards: P(X₁ = rain | X₂ = sun) = 0.12 / (0.56 + 0.12) = 0.176, not the 0.4 of the forward branch.")}
    <p><b>The chain rule</b> is the tree with more levels: P(A₁ ∩ … ∩ A<sub>n</sub>) = P(A₁) P(A₂ | A₁) ⋯ P(A<sub>n</sub> | A₁ ∩ … ∩ A<sub>n−1</sub>), one factor per event, each conditioned on everything before. With three days the third factor is conditioned on both earlier days (0.7 · 0.8 · 0.15 = 0.084 for sun, sun, rain in the notebook's figure). <b>Memory</b> is how far back the conditioning reaches: no memory means P(X₃), memory of the last day means P(X₃ | X₂), full memory means P(X₃ | X₁, X₂). With memory of the last day a ten-day model needs only three conditional distributions (day 1, and one per possible previous weather); with no memory the chain rule collapses to a product of marginals, which is independence. The birthday problem is section 1.5, with a one-room animation and a many-rooms histogram; its curve is in ${lecLink(1, "lecture 1")}.</p>

    <h2>2 · Random variables</h2>
    <p>One die roll, three questions: was it a six (an indicator I with values 0 and 1), which number is on top (a discrete X with values 1 … 6), how long did the die roll before stopping (a continuous T in an interval of times). A random variable is a fixed function X: Ω → ℝ, ω ↦ X(ω); the randomness is in the outcome ω. Capital X is the variable, small x one of its values, and {X = x} is an event. The number of cars in a 500-place car park is discrete (501 listable values); a body temperature is continuous even when the thermometer rounds it. Rolling the die many times gives three different pictures of the same rolls, one per variable.</p>

    <h2>3 · Discrete distributions: the sum of two dice</h2>
    <p>The 36 ordered pairs of faces are equally likely; the sum x occurs in 6 − |x − 7| of them. The probability mass function is p<sub>X</sub>(x) = P(X = x), between 0 and 1 and summing to 1. The cumulative distribution function F<sub>X</sub>(x) = P(X ≤ x) adds the bars up to x: never decreasing, 0 below the smallest value, 1 above the largest, a jump of p<sub>X</sub>(x<sub>i</sub>) at each value and flat in between, so F(4.5) = F(4) = 6/36.</p>
    ${chart("dice", leg([[1, "PMF p(x), left axis"], [2, "CDF F(x), right axis"]]))}${cap("Figure 3.1 and 3.2 of the notebook in one chart, computed here. Intervals come from differences of the CDF: P(3 < X ≤ 6) = F(6) − F(3) = 15/36 − 3/36 = 12/36; P(3 ≤ X < 6) = F(5) − F(2) = 9/36; P(X > 9) = 1 − F(9) = 6/36; P(4 ≤ X ≤ 7) = F(7) − F(3), not F(7) − F(4).")}
    <p><b>Two discrete variables</b> of the same roll, the first die X and the sum Y, are described by a joint table P<sub>X,Y</sub>(x, y). Marginals are row and column sums, conditionals are rescaled rows: P<sub>Y|X</sub>(y | x) = P<sub>X,Y</sub>(x, y) / P<sub>X</sub>(x). Given X = 4 the sum is 9 only if the second die shows 5, so P(Y = 9 | X = 4) = 1/6, while the marginal P<sub>Y</sub>(9) = 4/36 = 1/9: the first die and the sum are not independent, although the two dice are.</p>

    <h2>4 · Continuous distributions</h2>
    <p>Tomorrow's noon temperature takes a different value every day, so values cannot be counted one by one; they are grouped into bins. The notebook's task: with counts the tallest bar changes with the bin width, with relative frequencies it still does, and only "fraction per °C" (count / (N · width)) settles down as the days pile up, towards a curve. That curve is the density: for a narrow bin around x the fraction of days is f<sub>X</sub>(x) Δx. Formally, P(a ≤ X ≤ b) = ∫<sub>a</sub><sup>b</sup> f<sub>X</sub>(x) dx, f ≥ 0, the total area is 1, F<sub>X</sub>(x) = ∫<sub>−∞</sub><sup>x</sup> f, and f = dF/dx.</p>
    ${chart("dens")}${cap("Question 4.2 and 4.3 of the notebook: f(x) = 2x on [0, 1] has total area 1, P(0.2 ≤ X ≤ 0.5) = 0.5² − 0.2² = 0.21, and the CDF is x². Hover a panel for the computation.")}
    <p><b>Height or area.</b> For a discrete variable the height of a bar is a probability. For a continuous one the height f(x) is not: f(1) = 2 for this density, and nothing is wrong, because only areas are probabilities. A single value has width 0, so P(X = 0.5) = 0, which does not mean 0.5 is impossible. The CDF is steepest where the density is largest. <b>Reading the CDF backwards</b>, x = F<sub>X</sub><sup>−1</sup>(u), turns a uniform height u into a value with the distribution of X: random heights land densely where the CDF is steep. This inverse-transform idea is the first sampling algorithm of ${lecLink(2, "lecture 2")}.</p>
    <p><b>Two continuous variables.</b> A penalty kick crosses the goal line at (X, Y); where kicks are dense the joint density f<sub>X,Y</sub> is high, a mountain over the goal. Marginals squash the mountain onto one axis, f<sub>X</sub>(x) = ∫ f<sub>X,Y</sub>(x, y) dy; a conditional density is a slice at height y divided by the slice's area f<sub>Y</sub>(y); the joint CDF F<sub>X,Y</sub>(x, y) is the volume below and to the left of (x, y), and F<sub>X</sub>(x) = F<sub>X,Y</sub>(x, ∞). Independence means f<sub>X,Y</sub> = f<sub>X</sub> f<sub>Y</sub>. For f(x, y) = x + y on the unit square: total volume 1, f<sub>X</sub>(x) = x + ½, and P(X ≤ ½, Y ≤ ½) = 1/8.</p>

    <h2>5 · Moments</h2>
    <p>To compare two distributions, each is summarised by numbers: location, spread, then shape. The moment of order μ is M<sub>μ</sub>[X] = Σ x<sup>μ</sup> p<sub>X</sub>(x) (discrete) or ∫ x<sup>μ</sup> f<sub>X</sub>(x) dx (continuous). M₀ = 1 is the area; M₁ = E[X] is the centroid, where the distribution balances; Var(X) = M₂ − M₁² = E[(X − E[X])²] is the spread, the moment of inertia in mechanics; order 3 (skewness) measures asymmetry and order 4 (kurtosis) the tails. Two distributions with the same mean and variance can still differ, in asymmetry or in the tails; only for families like the normal do the first two moments fix everything.</p>
    ${tiles([["3.5", "E[X] of a fair die"], ["91/6 ≈ 15.17", "M₂ of a fair die"], ["35/12 ≈ 2.92", "Var of a fair die"], ["5 · 100/12", "mean · variance of U(0, 10)"]])}
    <p><b>Covariance</b> Cov(X, Y) = E[(X − E[X])(Y − E[Y])] is positive when X above its mean goes with Y above its mean (temperature and ice-cream sales), negative when one is high while the other is low (temperature and hot-drink sales, sunshine and umbrellas), and zero for two separate dice; independent variables have zero covariance. It enters the variance of a sum: Var(X + Y) = Var(X) + Var(Y) + 2 Cov(X, Y). <b>Distribution versus data:</b> E[X] and Var(X) belong to the distribution and are fixed numbers; x̄ = Σ x<sub>i</sub>/n and s² = Σ (x<sub>i</sub> − x̄)² / (n − 1) are estimates from data. The law of large numbers says the sample mean of i.i.d. variables converges to E[X].</p>
    ${lab("lln", "running means of die rolls, the law of large numbers")}

    <h2>6 · Common distributions and the central limit theorem</h2>
    <div class="tt-wrap"><table class="tt fs"><tr><th>Family</th><th>What it counts or measures</th><th>Mean</th><th>Variance</th></tr>${fam.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div>
    <p>The notebook's quick checks: ten students each choose tea with probability 0.6, so P(exactly 7 tea) = C(10, 7) 0.6⁷ 0.4³ = 0.215 and 6 are expected; four coin tosses give exactly two heads with probability 6/16; five die rolls show no six with probability (5/6)⁵ = 0.402; a machine failing once per 10 hours on average runs more than 20 hours with probability e<sup>−2</sup> = 0.135.</p>
    <p>A Galton board drops balls through n rows of pins; the slot is the sum of n Bernoulli bounces, Bin(n, p), and the pile looks like a bell. The <b>central limit theorem</b> says why: the sum S<sub>k</sub> of k independent variables with the same distribution, mean μ and finite variance σ², is approximately N(kμ, kσ²) for large k, whatever the distribution of each term. Many measured quantities are sums of many small random parts, hence the normal distribution everywhere.</p>
    ${lab("clt", "sum of k uniform numbers against the normal curve")}
    <p><b>Distributions without a scale.</b> Zoom out on a density through the windows [1, 10], [10, 100], [100, 1000], each rescaled to the same axes. A power law f(x) ∝ x<sup>−2.5</sup> looks the same in all three: it has no characteristic scale. The exponential and the normal do not survive the zoom. Scale-free distributions are the last item of ${lecLink(1, "lecture 1")}'s topic list in the OPAL overview.</p>

    <h2>7 and 8 · Why sampling, and a notation check</h2>

// Explorer: the linear congruential generator as jumps on a clock with m positions (section 1.1, Figure 1.1).

      ${xTicks(x, T1 + H1 + 20, xt)}
      ${yAxis(L, W, R, yd, [0])}<text class="note" x="${L + 4}" y="${T2 - 4}">${M} values of F⁻¹(U) against the density f(x)</text>${bars}<path class="line k2" d="${pdf}"/>${xTicks(x, H - 6, xt)}</svg>

function initInv(body) {

// Explorer: Box–Muller, two uniform numbers as a distance and an angle in the plane (section 4.2, Figure 4.2).
const BM = { u1: 0.6, u2: 0.3 };
const BMCLOUD = (() => { const r = mulberry(4242); return Array.from({ length: 1500 }, () => { const u1 = 1 - r(), u2 = r(), R = Math.sqrt(-2 * Math.log(u1)); return [R * Math.cos(2 * Math.PI * u2), R * Math.sin(2 * Math.PI * u2)]; }); })();
function bmOut() {
  const S = 240, c = S / 2, k = S / 8, R = Math.sqrt(-2 * Math.log(BM.u1)), th = 2 * Math.PI * BM.u2, x1 = R * Math.cos(th), x2 = R * Math.sin(th);
  const X = v => c + v * k, Y = v => c - v * k, cl = v => Math.max(-3.9, Math.min(3.9, v));
  return `<div class="pi-wrap"><svg viewBox="0 0 ${S} ${S}" class="pi t2-bm" role="img" aria-label="The plane from −4 to 4 with 1500 Box–Muller points forming a round cloud; u1 = ${BM.u1} gives the distance ${num(R, 2)}, u2 = ${BM.u2} the angle ${num(th * 180 / Math.PI, 0)} degrees, so the point is (${num(x1, 2)}, ${num(x2, 2)}).">
      <rect class="pi-box" x="0" y="0" width="${S}" height="${S}"/>${[-2, 0, 2].map(v => `<line class="g" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${S}"/><line class="g" x1="0" x2="${S}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("")}
      ${BMCLOUD.map(([a, b]) => `<circle class="cl" cx="${X(a).toFixed(1)}" cy="${Y(b).toFixed(1)}" r="1"/>`).join("")}
      <circle class="ring" cx="${c}" cy="${c}" r="${(R * k).toFixed(1)}"/><line class="ray" x1="${c}" y1="${c}" x2="${X(cl(x1)).toFixed(1)}" y2="${Y(cl(x2)).toFixed(1)}"/><circle class="pt-bm" cx="${X(cl(x1)).toFixed(1)}" cy="${Y(cl(x2)).toFixed(1)}" r="5.5"/>
      <text class="tick" x="${X(2) + 3}" y="${S - 4}">2</text><text class="tick" x="${X(-2) + 3}" y="${S - 4}">−2</text></svg>
    <dl class="ro"><dt>Distance</dt><dd>R = √(−2 ln u₁) = √(−2 ln ${BM.u1}) = <b>${num(R, 3)}</b>; P(a normal pair lies farther out than R) = e<sup>−R²/2</sup> = u₁ = ${BM.u1}</dd>
      <dt>Angle</dt><dd>θ = 2π u₂ = ${num(th, 3)} rad = ${num(th * 180 / Math.PI, 1)}°</dd>
      <dt>Pair</dt><dd>X₁ = R cos θ = <b>${num(x1, 3)}</b>, X₂ = R sin θ = <b>${num(x2, 3)}</b></dd>
      <dt>Read it</dt><dd>${BM.u1 < 0.05 ? "u₁ near 0 is the rare far-out point: only a fraction u₁ of pairs gets this far" : BM.u1 > 0.9 ? "u₁ near 1 puts the point close to the centre" : "u₂ only turns the point around the circle; u₁ alone sets how far out it lies"}</dd></dl></div>`;
}
function initBm(body) {
  body.innerHTML = `<div class="ctl"><label>u₁ <input type="range" data-k="u1" min="0.01" max="0.99" step="0.01" value="${BM.u1}"> <output>${BM.u1}</output></label><label>u₂ <input type="range" data-k="u2" min="0.01" max="0.99" step="0.01" value="${BM.u2}"> <output>${BM.u2}</output></label></div><div class="out"></div>`;
  const ins = [...body.querySelectorAll("input")], outs = [...body.querySelectorAll("output")], out = body.querySelector(".out");
  const draw = () => { ins.forEach((el, i) => outs[i].textContent = BM[el.dataset.k]); out.innerHTML = bmOut(); };
  ins.forEach(el => el.addEventListener("input", () => { BM[el.dataset.k] = +el.value; draw(); })); draw();

// Darts under Beta(2, 5): box [0, 1] × [0, 2.4576], kept darts below the curve (sections 5.1 and question 5.1).
const beta25 = x => 30 * x * (1 - x) ** 4;
CHARTS.darts = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 220 : 250, L = narrow ? 30 : 40, R = 12, T = 14, B = 28, PW = W - L - R, PH = H - T - B, fm = 2.4576, top = 2.6;
  const x = v => L + v * PW, y = v => T + PH - v / top * PH, rng = mulberry(77), n = narrow ? 500 : 800; let kept = 0;
  const darts = Array.from({ length: n }, () => { const u = rng(), h = rng() * fm, ok = h <= beta25(u); kept += ok; return `<circle class="${ok ? "keep" : "drop"}" cx="${x(u).toFixed(1)}" cy="${y(h).toFixed(1)}" r="${narrow ? 1.6 : 2}"/>`; }).join("");
  const curve = pathOf(Array.from({ length: 121 }, (_, i) => [i / 120, beta25(i / 120)]), x, y);
  const tip = esc(`<b>${n} darts in the box</b>kept below the curve: ${kept} (${pct(kept / n)})<br>expected: area 1 / box area ${fm} = 40.7 %<br>about ${num(fm, 2)} darts per kept sample`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Accept–reject for the Beta(2, 5) density: ${n} uniform darts in the box from 0 to 1 and up to 2.46; ${kept} fall below the curve and are kept, the rest are thrown away.">
    ${[0, 1, 2].map(v => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${[0, 0.2, 0.4, 0.6, 0.8, 1].map(v => `<text class="tick" x="${x(v)}" y="${H - 10}" text-anchor="middle">${v}</text>`).join("")}
    <g class="pt" tabindex="0" data-tip="${tip}"><rect class="hit" x="${L}" y="${T}" width="${PW}" height="${PH}"/><rect class="dbox" x="${x(0)}" y="${y(fm)}" width="${PW}" height="${y(0) - y(fm)}"/>${darts}<path class="line k2" d="${curve}"/></g>
    <text class="note" x="${W - R - 4}" y="${y(fm) - 4}" text-anchor="end">box height = max f = 2.4576</text></svg>`;
};
// Fraction of uniform darts in the cube [−1, 1]^d that land in the unit ball, on a log axis (questions 5.7 and 5.8).
const gammaHalf = z => { if (Number.isInteger(z)) { let p = 1; for (let i = 2; i < z; i++) p *= i; return p; } let p = Math.sqrt(Math.PI), t = 0.5; while (t < z) { p *= t; t++; } return p; };
const ballFrac = d => Math.PI ** (d / 2) / gammaHalf(d / 2 + 1) / 2 ** d;
const DIMS = [1, 2, 3, 5, 10, 20, 30];
const supx = s => s.replace(/\^(−?\d+)/g, (m, x) => x.replace("−", "⁻").replace(/\d/g, c => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c]));
const expo = v => supx(v.toExponential(1).replace("e+", " · 10^").replace("e-", " · 10^−"));
CHARTS.dims = narrow => {
  const W = narrow ? 340 : 600, L = narrow ? 50 : 64, R = narrow ? 70 : 96, T = 8, RH = 30, H = T + DIMS.length * RH + 24, PW = W - L - R, x = v => L + (Math.log10(v) + 14) / 14 * PW;
  const ticks = [-14, -10, -6, -2, 0].map(e => `<line class="${e ? "grid" : "axis"}" x1="${x(10 ** e)}" x2="${x(10 ** e)}" y1="${T}" y2="${H - 20}"/><text class="tick" x="${x(10 ** e)}" y="${H - 6}" text-anchor="middle">${e ? `10${String(e).replace("-", "⁻").replace(/\d/g, c => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c])}` : "1"}</text>`).join("");
  const rows = DIMS.map((d, i) => { const v = ballFrac(d), y0 = T + i * RH + 15, per = 1 / v;
    const lab = v > 0.01 ? pct(v) : expo(v);
    const tip = `<b>d = ${d}</b>fraction of the cube inside the ball: ${lab}<br>darts per kept point: ${per < 100 ? num(per, 2) : expo(per)}`;
    return `<g class="pt" tabindex="0" data-tip="${esc(tip)}"><rect class="hit" x="0" y="${y0 - 15}" width="${W}" height="${RH}"/><line class="ann" x1="${L}" x2="${x(v)}" y1="${y0}" y2="${y0}" stroke-dasharray="2 3"/><circle class="dot" cx="${x(v)}" cy="${y0}" r="5"/>
      <text class="cat" x="${L - 8}" y="${y0 + 4}" text-anchor="end">d = ${d}</text><text class="val" x="${x(v) + 9}" y="${y0 + 4}">${lab}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dot chart on a logarithmic axis: the fraction of the cube that lies inside the ball falls from 100 % in one dimension to 78.5 % in two, 52.4 % in three, 0.25 % in ten, 2.5 times 10 to the minus 8 in twenty and 2 times 10 to the minus 14 in thirty dimensions.">${ticks}${rows}</svg>`;
};
