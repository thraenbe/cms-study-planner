    <h2>${H.fake} (slides 2–3)</h2>
    ${plain("A simulation needs random numbers, but a computer follows fixed instructions. So it fakes randomness: it computes numbers that behave like random ones in every test that matters. This section names the three kinds of \"random\" numbers and which ones a simulation uses.")}
    <p>One generated value of a random variable is called a <dfn>random variate</dfn>, hence the lecture's title. The lecture sorts sources into three kinds:</p>
    <ul class="cmp three">
      <li><b>Pseudo-random</b><span class="v"><dfn>Pseudo-random numbers</dfn> come from a deterministic algorithm whose output passes statistical tests, for example a <dfn>Kolmogorov–Smirnov test</dfn> (it compares the sample's cumulative fractions with the target's and rejects if the largest gap is too large).</span><span class="muted">Used for simulation.</span></li>
      <li><b>Quasi-random</b><span class="v"><dfn>Quasi-random numbers</dfn> are deterministic too, but built to cover space evenly rather than to look random (low-discrepancy sequences, below).</span><span class="muted">Used for simulation.</span></li>
      <li><b>Truly random</b><span class="v"><dfn>Truly random numbers</dfn> come from hardware, such as cards that time radioactive decays (the gaps between decays are exponentially distributed).</span><span class="muted">Fine for cryptography, too slow for simulation.</span></li>
    </ul>
    <p>Notation for the rest of the course: capital X is the random variable, lowercase x a value it takes, and p(x) its distribution, a density for continuous X and a mass function for discrete X. The basic product of every generator is the <dfn>uniform distribution</dfn> U(0, 1): every number between 0 and 1 is equally likely.</p>
    ${ex("Worked example (added here): what \"passes a test\" means", `<p>Generate 1,000 numbers u<sub>i</sub>. If they are uniform on [0, 1), about 1,000 · 0.25 = 250 should be below 0.25, about 500 below 0.5, about 750 below 0.75. The Kolmogorov–Smirnov test checks this at every threshold at once: it takes the largest gap between "fraction below t" and t. For 1,000 numbers a gap above about 0.043 happens by chance only 5 % of the time, so a larger gap fails the test. A good generator's output passes such tests as often as truly random numbers would.</p>`)}
    ${oops("Thinking pseudo-random means \"bad random\". For simulation it is the better choice: it is reproducible (same seed, same run), fast, and statistically indistinguishable from random for the purpose at hand.")}

    <h2>${H.pre} (slides 4–5)</h2>
    ${plain("Once you have one random variable, you can make new ones by applying a function to it: Y = g(X). Generating random numbers is exactly that, a clever choice of g applied to uniform numbers. This section shows how to get the distribution of Y from the distribution of X.")}
    <p>A <dfn>transformation</dfn> is a function of a random variable, Y = g(X). It only makes sense if g is defined wherever X can land: the <dfn>support</dfn> of X (the values it can actually take) must lie inside the domain of g (the inputs g accepts). To get the distribution of Y you need the <dfn>pre-image</dfn> of a set A of values,</p>
    <div class="formula">${fx(String.raw`g^{-1}(A) = \{x : g(x) \in A\}`, "g⁻¹(A) = {x : g(x) ∈ A}")}</div>
    <p>read "g inverse of A is the set of all x such that g(x) is in A". That set always exists but need not have one element. For g(x) = x³ on the integers each value has exactly one pre-image (only 2 maps to 8); for g(x) = sin x every integer multiple of π maps to 0, a countably infinite pre-image.</p>
    <p>In the discrete case nothing more is needed: the probability of a value y is the total probability of every x that lands on it,</p>
    <div class="formula">${fx(String.raw`p_Y(y) = \sum_{x \,\in\, g^{-1}(y)} p_X(x)`, "p<sub>Y</sub>(y) = Σ<sub>x ∈ g⁻¹(y)</sub> p<sub>X</sub>(x)")}</div>
    <p>where p<sub>X</sub> and p<sub>Y</sub> are the mass functions of X and Y and the sum runs over the pre-image of y. With a unique inverse there is a single term: for g(x) = x³, P(Y = 8) = P(X = 2).</p>
    ${ex("Worked example (slide 5): shifting a die", `<p>X is uniform on {1, …, 6}, so p<sub>X</sub>(x) = 1/6. Let Y = X + 10. Every y has exactly one pre-image x = y − 10, so p<sub>Y</sub>(y) = 1/6 on {11, …, 16}: still uniform, just shifted.</p>`)}
    ${chart("preimg")}${cap("Y = (X − 3)² for a fair die, computed here (not on the slides). Each bar is one value of Y; its height is the sum of the probabilities of the faces that land on it. What to look for: the values 1 and 4 have two faces each in their pre-image, so they get twice the probability of 0 and 9. Hover a bar to see which faces it collects.")}
    ${ex("Worked example (added here): the die squared around 3", `<p>Faces 1 to 6 give (X − 3)² = 4, 1, 0, 1, 4, 9. Pre-images: g⁻¹(0) = {3}, g⁻¹(1) = {2, 4}, g⁻¹(4) = {1, 5}, g⁻¹(9) = {6}. Each face has probability 1/6, so p<sub>Y</sub> = (1/6, 2/6, 2/6, 1/6) on (0, 1, 4, 9), which sums to 1 as it must. Mean: E[Y] = (0 · 1 + 1 · 2 + 4 · 2 + 9 · 1)/6 = 19/6 ≈ 3.17.</p>`)}
    ${oops("Adding up the values instead of the probabilities. p<sub>Y</sub>(1) = p<sub>X</sub>(2) + p<sub>X</sub>(4) = 2/6; the faces 2 and 4 themselves do not enter the sum.")}

    <h2>${H.cdf} (slide 6)</h2>
    ${plain("For continuous random variables you cannot list probabilities value by value, so you work with the CDF, the probability of being at or below a value. Transforming X changes its CDF in a predictable way, and differentiating gives the new density. This is the tool that proves the inversion method works.")}
    <p>The <dfn>CDF</dfn> (cumulative distribution function) of X is F<sub>X</sub>(x) = P(X ≤ x): it rises from 0 to 1. The <dfn>density</dfn> f<sub>X</sub> is its derivative; the area under f<sub>X</sub> between a and b is P(a ≤ X ≤ b). For U(0, 1), F(x) = x and f(x) = 1 on [0, 1].</p>
    <p>The slide assumes g is a <dfn>bijection</dfn>: different x give different g(x), so there is exactly one inverse g⁻¹; on the real line this means g is monotonic (always increasing or always decreasing). Start from F<sub>Y</sub>(y) = P(g(X) ≤ y). If g increases, "g(X) ≤ y" is the same event as "X ≤ g⁻¹(y)", so F<sub>Y</sub>(y) = F<sub>X</sub>(g⁻¹(y)). If g decreases, the inequality flips and F<sub>Y</sub>(y) = 1 − F<sub>X</sub>(g⁻¹(y)). Differentiating either case gives one formula for the density:</p>
    <div class="formula">${fx(String.raw`f_Y(y) = f_X\big(g^{-1}(y)\big)\, \left|\frac{d}{dy} g^{-1}(y)\right|`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) · |d g⁻¹(y) / dy|")}</div>
    <p>In words: look up the density of X at the point that maps to y, and multiply by how much g stretches or squeezes there (the absolute value |…| of the slope of the inverse). The slide's example: if X ~ U(0, 1) (read "X is distributed uniformly on 0 to 1") then 1 − X ~ U(0, 1) as well, because g⁻¹(y) = 1 − y has slope −1 and the absolute value removes the sign. This is used again in the exponential example. Non-unique inverses such as sin need extra care and are not needed for random number generation.</p>
    ${ex("Worked example (added here): stretching a uniform number", `<p>X ~ U(0, 1), Y = 2X + 1. Inverse: x = g⁻¹(y) = (y − 1)/2, slope ½. So f<sub>Y</sub>(y) = f<sub>X</sub>((y − 1)/2) · ½ = 1 · ½ = ½ for 1 &lt; y &lt; 3: Y is uniform on (1, 3). The interval doubled in length, so the density halved, and the area is still 2 · ½ = 1. In general a + (b − a)X is uniform on (a, b).</p>`)}
    ${ex("Worked example (added here): squaring a uniform number", `<p>X ~ U(0, 1), Y = X². On (0, 1) the map is increasing with g⁻¹(y) = √y and d√y/dy = 1/(2√y). Since f<sub>X</sub> = 1 on (0, 1), f<sub>Y</sub>(y) = 1/(2√y) for 0 &lt; y &lt; 1. It piles up near 0 (squaring small numbers makes them smaller) yet still integrates to 1: ∫₀¹ dy/(2√y) = [√y]₀¹ = 1. Check by the CDF: P(Y ≤ 0.25) = P(X ≤ 0.5) = 0.5. ${exeLink(2, "Tutorial 2")} has this transform as a histogram explorer.</p>`)}
    ${oops("Dropping the absolute value. For a decreasing g the slope of g⁻¹ is negative, and without |…| the \"density\" would come out negative.")}

    <h2>${H.inv} (slide 7)</h2>
    ${plain("This is the central trick of the lecture. Put a random variable into its own CDF and the result is always uniform; turned around, putting a uniform number into the inverse CDF produces a sample with exactly that CDF. So one good uniform generator is enough to sample any distribution whose CDF you can invert.")}
    <p>Transform a continuous X by its own CDF, Y = F<sub>X</sub>(X). A CDF is increasing, so the previous section applies with g⁻¹ = F<sub>X</sub><sup>−1</sup> (read "F inverse", the function that undoes F<sub>X</sub>):</p>
    <div class="formula">${fx(String.raw`F_Y(y) = P\big(F_X(X) \le y\big) = P\big(X \le F_X^{-1}(y)\big) = F_X\big(F_X^{-1}(y)\big) = y`, "F<sub>Y</sub>(y) = P(X ≤ F<sub>X</sub>⁻¹(y)) = y")}</div>
    <p>F<sub>Y</sub>(y) = y on [0, 1] is the uniform CDF, whatever X was. Read it backwards and it becomes an algorithm, the <dfn>inversion transform</dfn>: if U ~ U(0, 1), then X = F<sub>X</sub><sup>−1</sup>(U) has CDF F<sub>X</sub>. Draw u, go across to the CDF curve, go down to x. So a computer only needs one good uniform generator, which is why research on random number generators concentrates on U(0, 1).</p>
    ${ex("Worked example (added here): a uniform number on (2, 5)", `<p>Target: uniform on (2, 5), CDF F(x) = (x − 2)/3. Solve F(x) = u: x = 2 + 3u. The generator returns u = 0.4, so x = 2 + 1.2 = <b>3.2</b>. Check: P(X ≤ 3.2) = 1.2/3 = 0.4 = u, as it must.</p>`)}
    ${ex("Worked example (added here): a die roll from one uniform number", `<p>The same idea works for discrete variables: cut [0, 1) into pieces whose lengths are the probabilities. For a die, the pieces [0, 1/6), [1/6, 2/6), …, [5/6, 1) mean face k = ⌈6u⌉ (⌈ ⌉, read "ceiling", rounds up). u = 0.53 gives 6 · 0.53 = 3.18, rounded up <b>4</b>; u = 0.05 gives 0.3, rounded up <b>1</b>. Lecture 3 uses exactly this to pick a Markov chain's next state.</p>`)}
    ${oops("Plugging u into F instead of F⁻¹. F turns values into probabilities; to generate a value you need the reverse direction, F⁻¹ turns a probability u into a value x.")}
    ${tryit([
      ["X takes the values 0, 1, 2 with probabilities 0.5, 0.3, 0.2. What is the distribution of Y = (X − 1)²?", `<p>X = 0 and X = 2 both give Y = 1; X = 1 gives Y = 0. So P(Y = 0) = 0.3 and P(Y = 1) = 0.5 + 0.2 = <b>0.7</b>.</p>`],
      ["X ~ U(0, 1) and Y = 3X. What is the density of Y?", `<p>g⁻¹(y) = y/3 with slope 1/3, so f<sub>Y</sub>(y) = 1 · 1/3 = <b>1/3 on (0, 3)</b>: uniform on (0, 3).</p>`],
      ["Use inversion to turn u = 0.75 into a sample of the uniform distribution on (−1, 1).", `<p>F(x) = (x + 1)/2, so x = 2u − 1 = 2 · 0.75 − 1 = <b>0.5</b>.</p>`],
    ])}

    <h2>${H.lcg} (slides 8–10)</h2>
    ${plain("Here is how the uniform numbers themselves are made. The oldest and simplest method multiplies the previous number by a constant and keeps the remainder; the remainders look random. Its weakness is that it must eventually repeat, so the length of that cycle matters.")}
    <p>Data-driven randomness (time between keystrokes, mouse position, bytes of network packets) is unpredictable and irreproducible, with an unknown distribution: good for cryptographic keys, bad for simulation. Simulations want an algorithmic generator: the same seed gives the same sequence, so a run can be debugged and repeated, and it produces millions of numbers on demand. Every valid generator must make the <dfn>empirical CDF</dfn> of its first n numbers, F̂<sub>n</sub>(u) (read "F hat n": the fraction of them that are at most u), converge to the uniform CDF F(u) = u; generators differ in how fast. The simplest is the <dfn>linear congruential generator</dfn> (LCG):</p>
    <div class="formula"><div class="fl">${fx(String.raw`z_i = a\, z_{i-1} \bmod m, \qquad u_i = \frac{z_i}{m} \in [0, 1)`, "z<sub>i</sub> = a z<sub>i−1</sub> mod m, u<sub>i</sub> = z<sub>i</sub>/m")}</div><div class="fl">${fx(String.raw`\big|\hat F_n(u) - u\big| \le \varepsilon(m), \qquad \varepsilon(m) \to 0 \text{ as } m \to \infty`, "|F̂ₙ(u) − u| ≤ ε(m) → 0 as m → ∞")}<span class="fn">accuracy: choose m large</span></div></div>
    <p>The symbols: the integer <dfn>modulus</dfn> m &gt; 0 is the number you divide by; the <dfn>multiplier</dfn> a (0 &lt; a &lt; m) the number you multiply with; z₀ is the <dfn>seed</dfn>, the starting value (different seeds, different sequences); <dfn>mod</dfn> m keeps the remainder, so z<sub>i</sub> is a whole number from 0 to m − 1 and u<sub>i</sub> = z<sub>i</sub>/m lands in [0, 1). ε(m) (read epsilon of m) is the largest error of the empirical CDF, which shrinks as m grows. C++11's <code>std::minstd_rand</code> uses m = 2³¹ − 1, the largest signed 32-bit integer, and a = 48,271, chosen by experiment for the longest cycle. Because only finitely many values exist, the sequence must eventually revisit one and, being deterministic, repeat from there: the <dfn>cycle length</dfn> T is how many numbers come before the repeat.</p>
    ${ex("Worked example (slide 10): the toy LCG m = 11, a = 7, z₀ = 1", `<p>z₁ = 7 · 1 mod 11 = 7; z₂ = 49 mod 11 = 5 (49 = 4 · 11 + 5); z₃ = 35 mod 11 = 2; z₄ = 14 mod 11 = 3; then 21 → 10, 70 → 4, 28 → 6, 42 → 9, 63 → 8, 56 → 1, and z₁₁ = 7 again. All ten non-zero remainders appear before the repeat: T = 10 = m − 1, the longest possible (0 is a dead end, since 7 · 0 = 0). The uniforms are 7/11, 5/11, 2/11, … ≈ 0.636, 0.455, 0.182, ….</p>`)}
    ${ex("Worked example (added here): a bad multiplier", `<p>Same m = 11, now a = 3, z₀ = 1: z = 3, 9, 27 mod 11 = 5, 15 mod 11 = 4, 12 mod 11 = 1, then 3 again. T = 5: only half of the possible values ever appear, so the uniforms 3/11, 9/11, 5/11, 4/11, 1/11 repeat after five numbers. The choice of a matters as much as the size of m. Try other a and m on the clock in ${exeLink(2, "tutorial 2")}.</p>`)}
    <div class="tt-wrap"><table class="tt prose"><tr><th>Year</th><th>Generator</th><th>Notes on the slide</th></tr>
      <tr><th>1988</th><td>Park–Miller</td><td>the "minimal standard" LCG behind std::minstd_rand; full cycle 2³¹ − 2 ≈ 2.1 · 10⁹</td></tr>
      <tr><th>1998</th><td>Mersenne Twister</td><td>the most widely used, e.g. in Python and MATLAB; cycle 2¹⁹⁹³⁷ − 1</td></tr>
      <tr><th>2003</th><td>XOR-shift</td><td>bitwise XORs and shifts; fast on graphics cards</td></tr>
      <tr><th>2018</th><td>Xoroshiro</td><td>a modern XOR-shift variant</td></tr></table></div>
    <p>The slide notes that the lecture's "repeats after a few hundred thousand numbers" undersells minstd, whose full cycle is 2³¹ − 2 ≈ 2.1 × 10⁹: still far too few for simulations that need billions of numbers.</p>
    ${why("Context, not on the slides: how fast a cycle runs out", "<p>A simulation that draws 10⁹ uniform numbers per second (one core of a modern CPU can) walks through minstd's 2.1 · 10⁹ values in about two seconds. After that it replays the same numbers, and averages stop improving.</p>")}
    ${oops("Reseeding from the clock inside a loop. Every new seed jumps to some other point of the same cycle, so the numbers are no more random, and the run can no longer be reproduced. Seed once, at the start.")}

    <h2>${H.clus} (slides 11–12)</h2>
    ${plain("Random points are not evenly spread: by chance they form clumps and leave gaps. When you want to cover a space evenly, for example to scan a range of parameters, quasi-random sequences do that better. Their regularity has a price, aliasing, and on parallel computers the generator has to give each processor its own stream.")}
    <p>Uniform pseudo-random points form clusters and holes, and this gets worse in higher dimensions. The <dfn>discrepancy</dfn> D<sub>n</sub> measures how strongly n points cluster. Quasi-random generators are low-discrepancy sequences: they fill space evenly at every n. The simplest is the <dfn>additive recurrence sequence</dfn> (ARS):</p>
    <div class="formula"><div class="fl">${fx(String.raw`u_{i+1} = (u_i + \alpha) \bmod 1, \qquad \alpha \text{ irrational}`, "u<sub>i+1</sub> = (u<sub>i</sub> + α) mod 1, α irrational")}</div><div class="fl">${fx(String.raw`D_n \propto n^{-1}`, "Dₙ ∝ n⁻¹")}<span class="fn">up to a log factor; good α: √2 − 1 or (√5 − 1)/2</span></div></div>
    <p>α (alpha) is a fixed step that is irrational (not a fraction of whole numbers), "mod 1" keeps only the part after the decimal point, and ∝ reads "proportional to". Its points lie on a near-lattice of stripes, but visited in an order that looks random. Ten times more points give ten times lower discrepancy, against roughly √10 ≈ 3.2 times for pseudo-random points. There is no free lunch: near-regular patterns cause <dfn>aliasing</dfn>, false patterns where the regular points beat against a regular structure of the problem. The slide's rule of thumb: use quasi-random numbers to explore a parameter space evenly, pseudo-random numbers where regular patterns could bias the physics, such as molecular dynamics, where aliasing could skip energy states. The Sobol sequence is the most used today; Niederreiter, Faure, Halton and van der Corput are others.</p>
    ${ex("Worked example (added here): the first ARS points", `<p>α = (√5 − 1)/2 ≈ 0.618, u₀ = 0. Then u₁ = 0.618, u₂ = 1.236 mod 1 = 0.236, u₃ = 0.854, u₄ = 1.472 mod 1 = 0.472, u₅ = 1.090 mod 1 = 0.090. After five points the gaps in [0, 1) are 0.09, 0.146, 0.236, 0.146, 0.236, 0.146: no gap is more than about twice another, while five random points often leave one gap of 0.4 or more.</p>`)}
    ${ex("Worked example (added here): discrepancy of four points", `<p>The (star) discrepancy is the largest difference, over all t, between the fraction of points below t and t itself. Points 0.1, 0.2, 0.3, 0.4: just above t = 0.4 all four points (fraction 1) lie below t, against an expected 0.4, so D = 0.6. Evenly spread points 0.125, 0.375, 0.625, 0.875: the fraction below t is never further than 0.125 from t, so D = 0.125, the smallest possible for four points.</p>`)}
    ${chart("disc", leg([[1, "pseudo-random"], [2, "additive recurrence, α = (√5 − 1)/2"]]))}${cap("Star discrepancy of the first n points in [0, 1), computed on this page for one seeded pseudo-random run and for the ARS. Both axes are logarithmic, so a power law appears as a straight line. What to look for: the pseudo-random line falls with slope about −½ (100 times more points, 10 times better), the quasi-random one with slope about −1 (100 times more points, 100 times better). The slide shows the same contrast as two scatter plots of 300 points in the square; the square version is in tutorial 2.")}
    <p><b>Parallel streams</b> (slide 12). Each processor needs its own independent stream of numbers. The cheap way seeds each processor differently, z₀ = f(process ID), which only starts each one at a different point of the same cycle, so each gets on average T / #processors numbers before the streams overlap. Dedicated parallel generators give independent, reproducible streams with the full cycle on every process.</p>
    ${ex("Worked example: a million GPU threads on minstd", `<p>T = 2³¹ − 2 ≈ 2.15 · 10⁹ shared by 10⁶ threads leaves about <b>2,150 numbers per thread</b> before one thread's stream runs into the next one's. A Monte Carlo kernel that needs 10,000 numbers per thread would already be reusing other threads' numbers, which correlates results that should be independent. (The slide states the T / #processors rule and that it is far too few for a million threads; the arithmetic is added here.)</p>`)}
    ${oops("Expecting quasi-random numbers to be \"more random\". They are less random and more even; for anything where independence matters (a stochastic process, a physical model) use pseudo-random numbers.")}
    ${tryit([
      ["Run the LCG with m = 7, a = 3, z₀ = 1 until it repeats. What is the cycle length, and what are the first three uniforms?", `<p>z = 3, 9 mod 7 = 2, 6, 18 mod 7 = 4, 12 mod 7 = 5, 15 mod 7 = 1, then 3 again: <b>T = 6 = m − 1</b>, a full cycle. First uniforms: 3/7 ≈ 0.429, 2/7 ≈ 0.286, 6/7 ≈ 0.857.</p>`],
      ["Continue the ARS example: what are u₆ and u₇?", `<p>u₆ = 0.090 + 0.618 = <b>0.708</b>; u₇ = 1.326 mod 1 = <b>0.326</b>.</p>`],
      ["A generator has cycle length 2³² ≈ 4.3 · 10⁹ and 1,000 processors are seeded with different seeds. About how many numbers can each use before streams may overlap?", `<p>T / #processors = 4.3 · 10⁹ / 1,000 ≈ <b>4.3 million</b> per processor, on average.</p>`],
    ])}

    <h2>${H.nonu} (slide 13)</h2>
    ${plain("Now apply inversion to real distributions. For the exponential distribution, the model of waiting times, the CDF can be inverted with a pen: one logarithm turns a uniform number into a waiting time. When no formula exists, a computer solves F(x) = u numerically.")}
    <p>The <dfn>exponential distribution</dfn> with rate λ (read lambda, the average number of events per unit time) has CDF F<sub>X</sub>(x) = 1 − e<sup>−λx</sup> for x ≥ 0 and mean 1/λ. Its inverse CDF has a closed form. Since 1 − U is uniform too (previous section), the "1 −" can be dropped and the uniform simply called R:</p>
    <div class="formula"><div class="fl">${fx(String.raw`F_X(x) = 1 - e^{-\lambda x} = y \;\Rightarrow\; x = -\tfrac{1}{\lambda}\ln(1 - y)`, "F(x) = 1 − e^(−λx) = y ⇒ x = −ln(1 − y)/λ")}</div><div class="fl">${fx(String.raw`X = -\frac{1}{\lambda}\ln R, \qquad R \sim \mathcal U(0, 1)`, "X = −ln(R)/λ, R ~ U(0, 1)")}</div><div class="fl">${fx(String.raw`\text{Rayleigh: } F_X(x) = 1 - e^{-x^2/2\sigma^2} \;\Rightarrow\; X = \sigma\sqrt{-2\ln R}`, "Rayleigh: X = σ √(−2 ln R)")}</div></div>
    <p>The solving step: 1 − e<sup>−λx</sup> = y gives e<sup>−λx</sup> = 1 − y, take ln of both sides: −λx = ln(1 − y), divide by −λ. ln R is negative for R in (0, 1), so −ln(R)/λ is positive, as a waiting time must be. The <dfn>Rayleigh distribution</dfn> (the distance from the origin of a 2-D Gaussian point, with scale σ, read sigma) inverts the same way. The slide's histogram of 10,000 values of −ln R (λ = 1) matches the exact density e<sup>−x</sup> to within 0.03 in every bin, with sample mean 1.007 against the exact 1/λ = 1.</p>
    ${ex("Worked example: two exponential numbers from one uniform", `<p>λ = 2 and the generator returns 0.7. With X = −ln(R)/λ: x = −ln(0.7)/2 = 0.357/2 = <b>0.178</b>. With the "1 −" form: x = −ln(0.3)/2 = 1.204/2 = <b>0.602</b>. Both are correct samples of Exp(2); they are just different samples, paired through R ↔ 1 − R. Over many draws both have mean 1/λ = 0.5.</p>`)}
    ${ex("Worked example (added here): a Rayleigh number", `<p>σ = 1, R = 0.5: X = √(−2 ln 0.5) = √(2 · 0.693) = √1.386 = <b>1.177</b>. The same expression is the radius in Box–Muller below.</p>`)}
    <p>When the CDF has no closed-form inverse, as for the gamma or the normal distribution, solve F<sub>X</sub>(x) = u numerically, by <dfn>regula falsi</dfn> (keep a bracket around the solution and cut it with straight lines) or by <dfn>Newton's method</dfn> (follow the tangent of F to where it reaches u; the slope of F is the density f):</p>
    <div class="formula">${fx(String.raw`x_{k+1} = x_k - \frac{F_X(x_k) - u}{f_X(x_k)}`, "x<sub>k+1</sub> = x<sub>k</sub> − (F(x<sub>k</sub>) − u) / f(x<sub>k</sub>)")}</div>
    ${ex("Worked example (added here): Newton for the standard normal, u = 0.9", `<p>The standard normal CDF is written Φ (capital phi) and its density φ. Start at x₀ = 0, where Φ = 0.5 and φ = 0.399. Step 1: x₁ = 0 − (0.5 − 0.9)/0.399 = <b>1.003</b>. There Φ = 0.842, φ = 0.241: x₂ = 1.003 − (0.842 − 0.9)/0.241 = <b>1.243</b>. There Φ = 0.893, φ = 0.184: x₃ = 1.243 + 0.007/0.184 = <b>1.281</b>. One more step gives 1.2816, correct to four decimals: 90 % of a standard normal lies below 1.2816.</p>`)}
    ${lab("newton", "invert the normal CDF with Newton's method", "Drag <b>u</b> or pick a preset. The curve is Φ, the dashed horizontal line is the target u; each straight segment is one Newton step along the tangent, and the dots are the iterates x₀ = 0, x₁, x₂, …. The table lists them with the remaining error Φ(x<sub>k</sub>) − u. What to look for: three to five steps reach an error below 10⁻⁷, and the steps never overshoot the root.")}
    ${oops("Forgetting the minus sign. ln R is negative, so X = ln(R)/λ would give negative waiting times; the formula is X = −ln(R)/λ.")}

    <h2>${H.gauss} (slides 14–15)</h2>
    ${plain("Gaussian (normal) numbers are the most used non-uniform numbers, but the normal CDF has no inverse formula. Adding up uniform numbers works because of the central limit theorem, but wastes them. Box–Muller instead uses polar coordinates and turns two uniforms into two Gaussians exactly.")}
    <p>The <dfn>normal distribution</dfn> N(μ, σ²) is the bell curve with mean μ (mu) and standard deviation σ (variance σ²); N(0, 1) is the standard normal. One standard normal generator is enough, since shifting and scaling give any other normal: X = μ + σZ. A first idea uses the <dfn>central limit theorem</dfn> (CLT): a sum of many independent, identically distributed (i.i.d.) values with finite variance is approximately normal, whatever the distribution of one value. Each R<sub>i</sub> ~ U(0, 1) has mean ½ and variance 1/12, so their sum is approximately N(n/2, n/12), and standardising (subtract the mean, divide by the standard deviation) gives</p>
    <div class="formula">${fx(String.raw`X = \frac{\sum_{i=1}^{n} R_i - n/2}{\sqrt{n/12}} \;\approx\; \mathcal N(0, 1)`, "X = (Σ R<sub>i</sub> − n/2) / √(n/12) ≈ N(0, 1)")}</div>
    ${ex("Worked example (added here): the 12-uniform trick", `<p>With n = 12 the denominator is √(12/12) = 1, so X = R₁ + … + R₁₂ − 6. If the twelve uniforms add up to 6.9, X = <b>0.9</b>. The sum can never be below 0 or above 12, so X is always between −6 and +6.</p>`)}
    <p>It is inefficient twice over: every Gaussian costs n uniforms, so the generator's cycle is used up n times faster, and the approximation improves only slowly, with |X| never beyond √(3n). With n = 12 no value beyond ±6 can ever occur.</p>
    ${chart("cltsum", leg([[1, "n = 1"], [2, "n = 2"], [3, "n = 12"], ["g", "N(0, 1)", "dash"]]))}${cap("Exact densities of the standardised sum of n uniforms (the Irwin–Hall distribution), computed here; the slide shows the same comparison. What to look for: n = 1 is a flat box, n = 2 a triangle, and n = 12 nearly lies on the dashed normal curve, at the price of 12 uniforms per Gaussian. Hover to compare the heights.")}
    <p>Box–Muller avoids the waste by going polar. Treat two independent N(0, 1) values as a point (X₁, X₂) in the plane, described by its distance r from the origin and its angle θ (theta). The squared radius r² = X₁² + X₂² is a <dfn>χ² variable</dfn> (chi-squared, read "kai") with 2 degrees of freedom (a sum of two squared standard normals), which is the exponential distribution with rate ½, so r² = −2 ln R₁ by the exponential formula; and the 2-D Gaussian looks the same in every direction, so θ = 2πR₂ is plain uniform on a full turn. Converting back with cos and sin gives the <dfn>Box–Muller transform</dfn>: two uniforms in, two independent Gaussians out.</p>
    <div class="formula"><div class="fl">${fx(String.raw`X_1 = \cos(2\pi R_2)\,\sqrt{-2\ln R_1}`, "X₁ = cos(2πR₂) √(−2 ln R₁)")}</div><div class="fl">${fx(String.raw`X_2 = \sin(2\pi R_2)\,\sqrt{-2\ln R_1}`, "X₂ = sin(2πR₂) √(−2 ln R₁)")}</div></div>
    <p>Why polar at all? In Cartesian coordinates inversion fails, because the normal CDF has no closed-form inverse. Faster variants in practice are Marsaglia's polar method and the ziggurat algorithm. The slide adds that Box–Cox and Yeo–Johnson transforms, named in the lecture video, make data look normal; they are not generators.</p>
    ${ex("Worked example: Box–Muller by hand", `<p>R₁ = 0.5, R₂ = 0.125. Radius: √(−2 ln 0.5) = √1.386 = 1.177. Angle: 2π · 0.125 = π/4 (45°), where cos = sin = 0.7071. So X₁ = X₂ = 1.177 · 0.7071 = <b>0.833</b>. A smaller R₁ pushes the point outwards: R₁ = 0.01 gives radius √9.21 = 3.03, a rare three-sigma pair. To get N(5, 2²) instead, use 5 + 2 · 0.833 = 6.67. Drag the two numbers in ${exeLink(2, "tutorial 2's Box–Muller plane")}.</p>`)}
    ${oops("Using the same uniform for R₁ and R₂, or reusing one of them for the next pair. The two Gaussians are independent only if R₁ and R₂ are two independent fresh uniforms.")}

    <h2>${H.ar} (slides 16–18)</h2>
    ${plain("When the CDF cannot be inverted at all, sample by throwing darts: scatter points evenly over a region that contains the graph of the density, and keep the x of every point that lands under the curve. Simple and always correct, but it can waste many darts, so the art is choosing a region that hugs the curve.")}
    <p><dfn>Accept–reject sampling</dfn> with a bounding box on the support [a, b]: draw x uniformly on [a, b] and u uniformly on [0, max f<sub>X</sub>]; accept x if u ≤ f<sub>X</sub>(x), otherwise draw a fresh pair. A point uniform under the graph, projected onto the x-axis, has density f<sub>X</sub>(x), because integrating out the height leaves exactly f<sub>X</sub>(x). The slide's target, a <dfn>Beta distribution</dfn> Beta(2.5, 6) on [0, 1] (a family of densities on [0, 1] with two shape numbers), keeps 38 % of the darts.</p>
    ${ex("Worked example (added here): two darts by hand", `<p>Target f(x) = 2x on [0, 1], so max f = 2 and the box is [0, 1] × [0, 2]. Dart 1: x = 0.3, u = 0.8; f(0.3) = 0.6 &lt; 0.8, so the dart is above the curve: <b>reject</b>. Dart 2: x = 0.7, u = 0.9; f(0.7) = 1.4 ≥ 0.9: <b>accept</b>, the sample is 0.7. The box has area 2 and the curve area 1, so half the darts are kept on average.</p>`)}
    ${ex("Worked example: where the slide's 38 % comes from", `<p>The box has width 1 and height max f; the area under f is 1, so the fraction of darts below the curve is 1 / max f. The Beta(a, b) density peaks at its mode (most likely value) (a − 1)/(a + b − 2) = 1.5/6.5 = 3/13 ≈ 0.231, where f = 2.627. So the acceptance rate is 1/2.627 = <b>38.1 %</b>, as on the slide: on average 2.6 darts per sample.</p>`)}
    <p>Easy to implement, but it can waste almost every dart. Peaked or long-tailed targets leave most of the box above the curve. Infinite support has no bounding box at all: a Gaussian must be truncated wide enough not to lose mass, and every extra bit of width lowers efficiency. And in high dimensions the accepted fraction shrinks exponentially, as the slide shows for a point uniform in a d-dimensional ball drawn from its bounding cube:</p>
    <div class="tt-wrap"><table class="tt"><tr><th>dimension d</th><th>accepted</th><th>darts per point</th></tr>${BALL.map(([d, a, k]) => `<tr><th>${d}</th><td>${a}</td><td>${k}</td></tr>`).join("")}</table></div>
    <p class="muted">Acceptance is the volume of the ball over the volume of the cube: in 2-D a circle of radius 1 (area π) in a square of side 2 (area 4) gives π/4 = 78.5 %. ${exeLink(2, "Tutorial 2")} plots it on a log axis up to d = 30.</p>
    <p>The fix is a <dfn>proposal distribution</dfn> g that hugs the target: anything with an efficient generator (an exponential, a Gaussian), scaled by a constant μ so that the envelope μg(x) ≥ f<sub>X</sub>(x) everywhere. Draw Y ~ g and U ~ U(0, 1) and</p>
    <div class="formula"><div class="fl">${fx(String.raw`\text{accept } Y \text{ if } U \le \frac{f_X(Y)}{\mu\, g(Y)}, \qquad \mu\, g(x) \ge f_X(x)\ \ \forall x`, "accept Y if U ≤ f(Y) / (μ g(Y)), with μg ≥ f everywhere")}</div><div class="fl">${fx(String.raw`P(\text{accept}) = \frac{1}{\mu}`, "P(accept) = 1/μ")}<span class="fn">μ proposals per kept sample on average</span></div></div>
    <p>The ratio f(Y)/(μg(Y)) is between 0 and 1: the fraction of the envelope's height at Y that lies under the target. The closer μg hugs f<sub>X</sub>, the closer μ is to 1. The bounding box is the special case g = uniform.</p>
    ${ex("Worked example (added here, a standard textbook case): half-normal from exponential proposals", `<p>Target: the half-normal f(x) = √(2/π) e<sup>−x²/2</sup> for x ≥ 0 (the absolute value of a standard normal). Proposal: g(x) = e<sup>−x</sup>, sampled by −ln R. The ratio f/g = √(2/π) e<sup>x − x²/2</sup> is largest at x = 1, so μ = √(2e/π) ≈ <b>1.315</b> and 1/μ = 76 % of proposals are kept, against far fewer for any box. One draw: Y = 0.5 gives f(0.5) = 0.704 and μg(0.5) = 1.315 · 0.607 = 0.798, ratio 0.882; with U = 0.6 ≤ 0.882 the sample 0.5 is <b>accepted</b>. Y = 2.5 gives ratio 0.325; U = 0.6 would reject it.</p>`)}
    ${lab("ar", "accept–reject under three envelopes", "Choose a proposal g. The blue curve is the target f (a two-bump density like the slide's), the green curve the envelope μg; each dot is one proposal, placed at its x and a random height under the envelope. Blue dots fall under f and are kept, grey ones are rejected. What to look for: the uniform box wastes most darts, the wide Gaussian fewer, the fitted Gaussian fewest; the kept share matches 1/μ within sampling noise. <b>Throw again</b> draws new darts.")}
    ${why("Context, not on the slides: why P(accept) = 1/μ", "<p>A proposal Y = y is kept with probability f(y)/(μ g(y)). Averaging over Y ~ g: P(accept) = ∫ g(y) · f(y)/(μ g(y)) dy = (1/μ) ∫ f(y) dy = 1/μ. The number of proposals until the first acceptance is geometric with success probability 1/μ, so its mean is μ. The same integral, without the outer ∫, shows that an accepted Y has density f: g(y) · f(y)/(μ g(y)) divided by 1/μ is f(y).</p>")}
    ${oops("An envelope that dips below f somewhere. Where μg &lt; f the ratio exceeds 1, every proposal there is accepted, and that region ends up under-represented: the samples no longer follow f.")}
    ${tryit([
      ["Generate an Exp(0.5) waiting time from R = 0.25.", `<p>X = −ln(0.25)/0.5 = 1.386/0.5 = <b>2.77</b>. (Mean of Exp(0.5) is 1/0.5 = 2.)</p>`],
      ["Box–Muller with R₁ = e<sup>−2</sup> ≈ 0.135 and R₂ = 0.25. What are X₁ and X₂?", `<p>Radius √(−2 · (−2)) = √4 = 2. Angle 2π · 0.25 = π/2 (90°): cos = 0, sin = 1. So <b>X₁ = 0, X₂ = 2</b>.</p>`],
      ["Accept–reject for f(x) = 3x² on [0, 1] with a bounding box. What is the acceptance rate, and is the dart x = 0.5, u = 1.2 kept?", `<p>max f = 3, box area 3, so the rate is <b>1/3</b>. f(0.5) = 0.75 &lt; 1.2: <b>rejected</b>.</p>`],
    ])}

    <h2>Lecture 2 on one page (slides 19–20)</h2>
    <div class="tt-wrap"><table class="tt fs"><tr><th>Topic</th><th>Formula</th></tr>
      <tr><th>Discrete transform</th><td><span class="f">${fx(String.raw`p_Y(y) = \sum_{x \in g^{-1}(y)} p_X(x)`, "p<sub>Y</sub>(y) = Σ p<sub>X</sub>(x) over x ∈ g⁻¹(y)")}</span></td></tr>
      <tr><th>Continuous transform</th><td><span class="f">${fx(String.raw`f_Y(y) = f_X(g^{-1}(y))\,\left|\tfrac{d}{dy}g^{-1}(y)\right|`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) |dg⁻¹/dy|")}</span></td></tr>
      <tr><th>Inversion</th><td><span class="f">${fx(String.raw`X = F_X^{-1}(U) \sim F_X,\quad U \sim \mathcal U(0,1)`, "X = F<sub>X</sub>⁻¹(U) ~ F<sub>X</sub>")}</span></td></tr>
      <tr><th>LCG</th><td><span class="f">${fx(String.raw`z_i = a z_{i-1} \bmod m,\quad u_i = z_i/m`, "z<sub>i</sub> = a z<sub>i−1</sub> mod m, u<sub>i</sub> = z<sub>i</sub>/m")}</span></td></tr>
      <tr><th>Additive recurrence</th><td><span class="f">${fx(String.raw`u_{i+1} = (u_i + \alpha) \bmod 1,\ \ \alpha \text{ irrational}`, "u<sub>i+1</sub> = (u<sub>i</sub> + α) mod 1")}</span></td></tr>
      <tr><th>Exponential</th><td><span class="f">${fx(String.raw`X = -\tfrac{1}{\lambda}\ln R`, "X = −ln(R)/λ")}</span></td></tr>
      <tr><th>Gaussian via the CLT</th><td><span class="f">${fx(String.raw`X = \big(\textstyle\sum_{i=1}^n R_i - n/2\big)/\sqrt{n/12}`, "X = (Σ R<sub>i</sub> − n/2)/√(n/12)")}</span></td></tr>
      <tr><th>Box–Muller</th><td><span class="f">${fx(String.raw`X_1 = \cos(2\pi R_2)\sqrt{-2\ln R_1}`, "X₁ = cos(2πR₂) √(−2 ln R₁)")}</span><span class="f">${fx(String.raw`X_2 = \sin(2\pi R_2)\sqrt{-2\ln R_1}`, "X₂ = sin(2πR₂) √(−2 ln R₁)")}</span></td></tr>
      <tr><th>Accept–reject</th><td><span class="f">${fx(String.raw`\text{accept } Y \sim g \text{ if } U \le f_X(Y)/(\mu g(Y))`, "accept Y ~ g if U ≤ f(Y)/(μ g(Y))")}</span></td></tr></table></div>

    <h2>Take-home (slide 21)</h2>
    <ul>
      <li><b>What does a computer need to sample any distribution?</b> Only a good uniform generator: X = F<sub>X</sub>⁻¹(U) does the rest.</li>
      <li><b>Is pseudo-random random?</b> No, it is deterministic: same seed, same sequence. That makes runs reproducible, and the output is statistically indistinguishable from random.</li>
      <li><b>What limits a generator?</b> Its cycle length, especially when parallel streams share one cycle.</li>
      <li><b>Pseudo or quasi?</b> Quasi-random sequences cover space evenly but bring regular patterns (aliasing); choose per application.</li>
      <li><b>How to get exponentials and Gaussians?</b> Exponential in closed form, X = −ln(R)/λ; Gaussian by Box–Muller, not by the slow CLT sum.</li>
      <li><b>And when there is no inverse?</b> Accept–reject, efficient only with a proposal g that fits f<sub>X</sub> closely: 1/μ of the proposals are kept.</li>
    </ul>
    <p class="muted">Tutorial: ${exeLink(2, "tutorial 2")} (5 Nov) has the calculation problems and programming exercises on this material. Next: ${lecLink(3, "lecture 3")} (9 Nov), discrete-time Markov chains, which the last slides announce together with Metropolis–Hastings, Gibbs sampling and random walks. Previous: ${lecLink(1, "lecture 1")}. Slides: OPAL → Lecture2026 → SMS2 (they may not be republished).</p>`;
}

// ================= Lecture 3 · Discrete-time Markov chains (SMS3, 18 pages, five parts) =================
// The weather chain of slides 7–10 (rows: from Sunny, Cloudy, Rainy) with its stationary distribution 21/46, 13/46, 12/46.
const W3 = [[0.7, 0.2, 0.1], [0.3, 0.4, 0.3], [0.2, 0.3, 0.5]], W3PI = [21 / 46, 13 / 46, 12 / 46];
const W3POW = [[[1, 0, 0], [0, 1, 0], [0, 0, 1]]]; for (let n = 1; n <= 30; n++) W3POW.push(matmul(W3POW[n - 1], W3));
// Chains for the explorers: the weather chain, the period-2 flip chain of slide 13, and a small gambler's ruin with absorbing ends (slide 11's casino picture).
const CHAINS = {
  weather: { name: "weather chain (slide 7)", S: ["Sunny", "Cloudy", "Rainy"], P: W3, start: 0, pi: W3PI, lim: [W3PI, W3PI, W3PI],
    note: "Irreducible and aperiodic: the visit shares settle at π = (0.457, 0.283, 0.261) = (21, 13, 12)/46 from any start." },
  flip: { name: "flip chain (slide 13)", S: ["State 1", "State 2"], P: [[0, 1], [1, 0]], start: 0, pi: [0.5, 0.5], lim: null,
    note: "Periodic with period 2: π = (½, ½) is stationary and the visit shares reach it, but P⁽ⁿ⁾ alternates between the identity and the swap and never converges." },
  ruin: { name: "gambler's ruin, €0 to €3", S: ["€0", "€1", "€2", "€3"], P: [[1, 0, 0, 0], [0.5, 0, 0.5, 0], [0, 0.5, 0, 0.5], [0, 0, 0, 1]], start: 1, pi: null,
    lim: [[1, 0, 0, 0], [2 / 3, 0, 0, 1 / 3], [1 / 3, 0, 0, 2 / 3], [0, 0, 0, 1]],
    note: "€0 and €3 are absorbing: each fair bet moves €1 up or down, and once the chain hits an end it stays. From €1 it ends at €0 with probability 2/3." },
};
const nextState = (P, i, u) => { let c = 0; for (let j = 0; j < P[i].length; j++) { c += P[i][j]; if (u < c) return j; } return P[i].length - 1; };

      `${inL(2, "The inversion transform", "Uniform numbers and the inversion transform")} (lecture 2): a computer gives numbers u spread evenly on [0, 1); cutting [0, 1) into pieces of the right lengths turns u into any discrete distribution.`,
      `Matrix multiplication (school or first-year linear algebra): a short refresher is in ${see(H.ck)} below.`,
    ])}
    ${terms([

      ["Eigenvalue", "A number λ (read lambda) with vP = λv for some non-zero vector v. For a transition matrix the largest is 1; the second largest says how fast the chain forgets its start.", H.stat],

      ["Irreducible", "Every state can be reached from every other state, possibly in several steps; the only closed set is the whole state space.", H.erg],
