  const P2 = W3POW[2], p2t = `<div class="tt-wrap"><table class="tt compact"><tr><th>P² from \\ to</th>${CHAINS.weather.S.map(s => `<th>${s}</th>`).join("")}<th>row sum</th></tr>${P2.map((r, i) => `<tr><th>${CHAINS.weather.S[i]}</th>${r.map(v => `<td>${num(v, 2)}</td>`).join("")}<td>1</td></tr>`).join("")}</table></div>`;
  const H = {
    proc: "Stochastic processes, states and state spaces", iid: "From i.i.d. steps to the Markov property", mat: "The transition matrix",
    rec: "A Markov chain is a recursion driven by i.i.d. noise", ck: "n steps: Chapman–Kolmogorov", abs: "Closed sets and absorbing states",
    erg: "Irreducible, periodic, ergodic", stat: "Stationary distributions", samp: "Sampling with Markov chains", rw: "Random walks",
  };
  return `${head(l)}
    <p class="lead">Lecture 2 produced independent random numbers; real systems remember. A population that is large this year will be large next year, and today's weather says something about tomorrow's. A Markov chain is the smallest step beyond independence: the next state depends on the current state and on nothing earlier. That is enough memory to model correlation in time, yet simple enough to analyse with matrices and to simulate with the uniform numbers of ${lecLink(2, "lecture 2")}. The deck is "SMS3" in OPAL (Lecture2026), an 18-page summary in five parts; it notes in several places where the lecture video is loose and gives the textbook version. Every section below starts with what the idea is for, then the formula with each symbol named, then numbers.</p>
    ${before([
      `${inL(1, "Part 5 · Conditional probability and independence", "Conditional probability")} (lecture 1): P(A | B), read "probability of A given B", is the probability of A once you know that B happened. The Markov property is a statement about such probabilities.`,
      `${inL(1, "Part 7 · Total probability, the chain rule, and the birthday problem", "The law of total probability")} (lecture 1): to get P(A), split into cases B₁, B₂, … and add P(A | B<sub>k</sub>) P(B<sub>k</sub>). Chapman–Kolmogorov is exactly this, with the cases being "where the chain is in between".`,
      `${inL(1, "Part 8 · Random variables", "Random variables and their probability mass function")} (lecture 1): a random variable is a number decided by chance; a pmf lists the probability of each value.`,
      `${inL(1, "Part 4 · Combinatorics and the probability space", "Combinations")} (lecture 1): C(n, k), read "n choose k", the number of ways to pick k of n items. Used for the random walk.`,
      `${inL(2, "The inversion transform", "Uniform numbers and the inversion transform")} (lecture 2): a computer gives numbers u spread evenly on [0, 1); cutting [0, 1) into pieces of the right lengths turns u into any discrete distribution.`,
      `Matrix multiplication (school or first-year linear algebra): a short refresher is in ${see(H.ck)} below.`,
    ])}
    ${terms([
      ["Absorbing state", "A state the chain can enter but never leave: P<sub>ii</sub> = 1. Example: €0 for a gambler who cannot borrow.", H.abs],
      ["Aperiodic", "No state has a fixed return rhythm (every state has period 1). A state with P<sub>ii</sub> &gt; 0 can return in one step, so it is aperiodic.", H.erg],
      ["AR(1) sequence", "Autoregressive of order 1: X<sub>n+1</sub> = a X<sub>n</sub> + fresh noise. Each value is a shrunk copy of the previous one plus new randomness; a simple Markov chain with a continuous state.", H.iid],
      ["Bernoulli variable", "A random variable that is 1 with probability p and 0 otherwise: one coin toss. A binomial variable with a single trial.", H.iid],
      ["Central limit theorem (CLT)", "Sums or averages of many i.i.d. values with finite variance are approximately normally (Gaussian) distributed, whatever the distribution of a single value.", H.iid],
      ["Chapman–Kolmogorov equation", "n + m steps = n steps, then m steps, summed over the state in between. It makes the n-step probabilities the n-th power of P.", H.ck],
      ["Closed set", "A set of states the chain cannot leave once it is inside.", H.abs],
      ["Discrete-time stochastic process", "A sequence X₀, X₁, X₂, … of random variables, one per time step n. \"Stochastic\" means random.", H.proc],
      ["Drift", "The average distance a random walk moves per step; 2p − 1 for steps of +1 (probability p) and −1.", H.rw],
      ["Eigenvalue", "A number λ (read lambda) with vP = λv for some non-zero vector v. For a transition matrix the largest is 1; the second largest says how fast the chain forgets its start.", H.stat],
      ["Ergodic", "Every state is revisited, with a finite average time between visits. Most textbooks also require irreducibility.", H.erg],
      ["i.i.d.", "Independent and identically distributed: every value has the same distribution and tells you nothing about the others, like repeated coin tosses.", H.iid],
      ["Increment", "One step d<sub>i</sub> of a random walk: the amount added to the position.", H.rw],
      ["Irreducible", "Every state can be reached from every other state, possibly in several steps; the only closed set is the whole state space.", H.erg],
      ["Limiting distribution", "The probabilities P(X<sub>n</sub> = k) approach for n → ∞, the same from every start. The lecture's (board) definition of stationary.", H.stat],
      ["Marginalise", "Sum a joint probability over all values of one variable to get rid of it; the law of total probability.", H.ck],
      ["Markov chain", "A stochastic process with the Markov property.", H.iid],
      ["Markov chain Monte Carlo (MCMC)", "Sampling from a distribution by running a Markov chain that has it as its stationary distribution. Lectures 5–6 of the course.", H.samp],
      ["Markov property", "The next state depends only on the current state, not on how the chain got there.", H.iid],
      ["Matrix power Pⁿ", "P multiplied by itself n times. Entry (i, j) is the probability of going from i to j in exactly n steps.", H.ck],
      ["Mean recurrence time", "The average number of steps until the chain returns to the state it started in.", H.erg],
      ["Mixing time", "The number of steps until the chain's distribution is close to its stationary distribution.", H.samp],
      ["Period", "Returns to a state are possible only after multiples of t steps (t ≥ 2): the state has period t. Example: 1 → 2 → 1 → 2 has period 2.", H.erg],
      ["Probability mass function (pmf)", "The list of probabilities of the values of a discrete random variable: each ≥ 0, together 1.", H.mat],
      ["Random walk", "A running sum of i.i.d. steps: X<sub>n</sub> = d₁ + d₂ + … + d<sub>n</sub>.", H.rw],
      ["Realisation", "One concrete outcome of the whole process, for example 3, 6, 1, 4, 4, 2 from six die rolls.", H.proc],
      ["Run-in (burn-in)", "The first states of a simulated chain, thrown away because they still depend on where it started.", H.samp],
      ["Standard deviation", "The typical distance of a random value from its mean: the square root of the variance (the mean squared distance).", H.rw],
      ["State, state space S", "The state is the value X<sub>n</sub> takes at time n; the state space S is the set of all states that can occur.", H.proc],
      ["Stationary distribution π", "π, read pi: a distribution over the states that one step of the chain leaves unchanged, π = πP. In the long run it is the share of time spent in each state.", H.stat],
      ["Time-homogeneous", "The transition probabilities are the same at every time step n (the video says \"time invariant\").", H.iid],
      ["Transition matrix P", "The table of all one-step probabilities P<sub>ij</sub>; row = now, column = next; every row sums to 1. Also called a stochastic matrix.", H.mat],
      ["Transition probability P<sub>ij</sub>", "Read \"P i j\": the probability of moving from state x<sub>i</sub> to state x<sub>j</sub> in one step.", H.iid],
    ])}
    ${tiles([[fx(String.raw`P_{ij}`, "P<sub>ij</sub>"), "one-step transition probability"], [fx(String.raw`\mathbf P^{(n)} = \mathbf P^n`, "P⁽ⁿ⁾ = Pⁿ"), "n steps: a matrix power"], [fx(String.raw`\boldsymbol\pi = \boldsymbol\pi \mathbf P`, "π = πP"), "stationary distribution"], ["√n", "spread of a random walk"]])}

    <h2>${H.proc} (slides 3–4)</h2>
    ${plain("A stochastic process describes something that changes at random, step by step. Instead of one random number you have a whole sequence of them, one per step. You use it whenever the thing you model has a history: the weather day by day, a population year by year, a gambler's money bet by bet.")}
    <p>A <dfn>discrete-time stochastic process</dfn> ("stochastic" means random) is a sequence of random variables X₀, X₁, X₂, … (read "X nought, X one, X two"), one per time step n = 0, 1, 2, …. Any discrete time axis, such as the years 2017, 2018, …, can be relabelled 0, 1, 2, …. The value x<sub>n</sub> that X<sub>n</sub> actually takes is the <dfn>state</dfn> at time n, and the <dfn>state space</dfn> S is the set of all states that can occur. One run of the process written out, all its values in order, is a <dfn>realisation</dfn>. Time here comes in steps; continuous time, with arbitrarily fine resolution as in many physical processes, comes later in the course.</p>
    ${ex("Worked example (slide 3): six rolls of a die", `<p>Roll a die six times and write down X₀ = 3, X₁ = 6, X₂ = 1, X₃ = 4, X₄ = 4, X₅ = 2. That list is one realisation. The state space is S = {1, 2, 3, 4, 5, 6}. Rolling again gives another realisation, say 5, 5, 2, 6, 1, 3; the process is the rule that produces all of them with their probabilities, here 1/6 for each face at every step.</p>`)}
    ${ex("Worked example (added here): a running count of heads", `<p>Toss a fair coin three times and let X<sub>n</sub> be the number of heads so far, with X₀ = 0. The state space is S = {0, 1, 2, 3}. The tosses H, T, H give the realisation X₀ = 0, X₁ = 1, X₂ = 1, X₃ = 2. There are 2³ = 8 equally likely toss sequences; three of them (HHT, HTH, THH) end with two heads, so P(X₃ = 2) = 3/8 = 0.375. Unlike the die, this process remembers: X₃ can only be X₂ or X₂ + 1.</p>`)}
    <p>Time is discrete in this lecture, but the state can be discrete (separate values such as the integers) or continuous (any real value, such as a position):</p>
    <div class="tt-wrap"><table class="tt prose"><tr><th>Process (slide 4)</th><th>State</th><th>Why</th></tr>
      <tr><th>outcome of the nth die roll</th><td>discrete</td><td>S = {1, 2, 3, 4, 5, 6}</td></tr>
      <tr><th>population in year n</th><td>both</td><td>discrete when you count people (45,000, then 45,001), continuous as a density (42.7 people per km²)</td></tr>
      <tr><th>water in the nth rain</th><td>continuous</td><td>time steps need not be evenly spaced: the 1st, 2nd, 3rd rain</td></tr>
      <tr><th>time in hospital of the nth patient</th><td>continuous</td><td>"time" n counts patients, not physical time</td></tr></table></div>
    <p>The slide nests the classes: i.i.d. processes are a special case of Markov chains, which are a special case of discrete-time stochastic processes. The next section explains both words.</p>
    ${oops("Reading n as clock time. n only counts steps: the nth patient, the nth rain. The steps need not be evenly spaced in real time.")}

    <h2>${H.iid} (slides 5–6)</h2>
    ${plain("There are two simple ways a sequence can depend on its past: not at all (i.i.d.), or only through its most recent value (Markov). Markov is the useful middle ground: it allows memory, which real systems have, but only one step of it, so the maths stays manageable.")}
    <p>The simplest process is <dfn>i.i.d.</dfn>, short for <i>independent and identically distributed</i>: every step has the same distribution (identically distributed) and tells you nothing about any other step (independent). The slide's example is a repeated coin toss. Each toss is a <dfn>Bernoulli(½) variable</dfn>, a variable that is 1 (heads) with probability ½ and 0 otherwise; the video calls it binomial with parameter ½, which is the same thing, a binomial with one trial. The slide lists three consequences:</p>
    <ul><li><b>One distribution</b> describes every step, so a single formula defines the whole process.</li>
      <li><b>The <dfn>central limit theorem</dfn></b> (CLT) applies: averages over many steps are approximately Gaussian (bell-shaped, normal), whatever the distribution of one step, as long as its variance is finite.</li>
      <li><b>Probabilities multiply</b>: the probability of a whole sequence is the product of the single-step probabilities.</li></ul>
    ${ex("Worked example (added here): coin tosses as an i.i.d. process", `<p>Probability of the sequence heads, heads, tails: ½ · ½ · ½ = 1/8 = 0.125, by the multiplication rule. Average of 100 tosses (heads = 1, tails = 0): one toss has mean 0.5 and variance 0.5 · 0.5 = 0.25, so the average has mean 0.5 and standard deviation √(0.25 / 100) = 0.05. By the CLT the average is roughly normal, so with about 95 % probability it lies within two standard deviations, between 0.40 and 0.60.</p>`)}
    <p>But i.i.d. models are often too simple, because they have no correlation in time: a country with a large population this year will have a large one next year. A <dfn>Markov chain</dfn> lets X<sub>n+1</sub> depend on X<sub>n</sub>. Formally, {X<sub>n</sub> : n ≥ 0} is a Markov chain if and only if</p>
    <div class="formula">${fx(String.raw`P(X_{n+1} = x_j \mid X_n = x_i,\, X_{n-1} = y_{n-1}, \dots, X_0 = y_0) = P(X_{n+1} = x_j \mid X_n = x_i) = P_{ij}`, "P(X<sub>n+1</sub> = x<sub>j</sub> | X<sub>n</sub> = x<sub>i</sub>, history) = P(X<sub>n+1</sub> = x<sub>j</sub> | X<sub>n</sub> = x<sub>i</sub>) = P<sub>ij</sub>")}</div>
    <p>for all n, all states x<sub>i</sub>, x<sub>j</sub> and every history y₀, …, y<sub>n−1</sub>. Reading the symbols: X<sub>n+1</sub> is the next state, X<sub>n</sub> the current one; x<sub>i</sub> and x<sub>j</sub> are two particular states; the bar "|" reads "given"; y₀, …, y<sub>n−1</sub> are the values the chain had before now. The left side asks for the next state given the whole past, the middle given only the present, and the equation says they are the same: this is the <dfn>Markov property</dfn>, once X<sub>n</sub> is known the history is irrelevant. The number P<sub>ij</sub> (read "P i j") is the <dfn>transition probability</dfn> from x<sub>i</sub> to x<sub>j</sub> in one step. Writing it without an n assumes it does not change over time; such a chain is <dfn>time-homogeneous</dfn> (the video says "time invariant"). The slide calls Markov chains the sweet spot: more expressive than i.i.d. because consecutive steps can be correlated, yet tractable and efficient to simulate, and they recur through the rest of the course.</p>
    ${ex("Worked example (added here, with the weather chain of the next section)", `<p>Today is sunny, yesterday was rainy, the day before cloudy. The Markov property says P(rain tomorrow | sunny today, rainy yesterday, cloudy before) = P(rain tomorrow | sunny today) = P<sub>Sunny→Rainy</sub> = 0.1. Only today counts. Had today been rainy, the answer would be P<sub>Rainy→Rainy</sub> = 0.5: the present matters, and the past matters only through the present.</p>`)}
    ${chart("iidmk", leg([[1, "i.i.d. standard normal"], [2, "Markov chain with the same marginal"]]))}${cap("Top: 50 i.i.d. standard normal numbers (each drawn fresh, mean 0, typical size 1). Bottom: an <dfn>AR(1) sequence</dfn> (autoregressive of order 1), X(n+1) = 0.9 X(n) + √0.19 · fresh noise, where the factor √0.19 keeps the overall spread at 1 so both rows have the same distribution at every single step. What to look for: the top line zig-zags without pattern, the bottom one moves in long swings because each value builds on the last. Hover or tab onto a panel to see the correlation of neighbouring values (0 = unrelated, 1 = identical): near 0 on top, near 0.9 below. Drawn here; the slide shows the same contrast with its own data.")}
    ${oops("Thinking \"Markov\" means \"no memory\". A Markov chain does remember, through its current state, which itself depends on the past. What it forgets is how it reached the current state.")}

    <h2>${H.mat} (slide 7)</h2>
    ${plain("The transition matrix is the whole Markov chain in one table: for each state the chain is in now, it lists the chances of each state it can be in next. Once you have the table, every question about the chain becomes a calculation with it.")}
    <p>With finitely many states the P<sub>ij</sub> form a matrix P: row i is where the chain is now, column j where it goes next. Every row is a <dfn>probability mass function</dfn> (pmf: a list of probabilities that are each at least 0 and add up to 1), because the chain must go somewhere, possibly staying put. P<sub>ij</sub> = 0 means the move is impossible, P<sub>ij</sub> = 1 that it is certain. Such a matrix, non-negative with rows summing to 1, is a <dfn>transition matrix</dfn> or stochastic matrix. Transition probabilities need discrete time; a countably infinite state space, like the random walk's at the end of this page, gives an infinite matrix. The slide's illustrative weather chain (marked there as not from the lecture itself):</p>
    ${wt}
    <div class="formula">${fx(String.raw`0 \le P_{ij} \le 1, \qquad \sum_j P_{ij} = 1`, "0 ≤ P<sub>ij</sub> ≤ 1, Σ<sub>j</sub> P<sub>ij</sub> = 1")}</div>
    <p>Σ<sub>j</sub> (capital sigma, read "sum over j") adds the entries of row i over all columns j.</p>
    ${ex("Worked example (slide 7): reading the matrix", `<p>P(cloudy → rainy) is row Cloudy, column Rainy: <b>0.3</b>. Row check for Sunny: 0.7 + 0.2 + 0.1 = 1.0, as it must be. Columns need not sum to 1: the Sunny column gives 0.7 + 0.3 + 0.2 = 1.2.</p>`)}
    ${ex("Worked example (added here): the probability of a whole path", `<p>Start sunny. The probability that tomorrow is sunny and the day after cloudy is P<sub>SS</sub> · P<sub>SC</sub> = 0.7 · 0.2 = <b>0.14</b>: by the Markov property you multiply the one-step probabilities along the path. The three-day path sunny → cloudy → rainy → rainy has probability P<sub>SC</sub> · P<sub>CR</sub> · P<sub>RR</sub> = 0.2 · 0.3 · 0.5 = <b>0.03</b>.</p>`)}
    ${ex("Worked example (added here): a forecast from an uncertain start", `<p>Suppose today is sunny or cloudy with probability 0.5 each (never rainy). Tomorrow, by total probability over today's weather: sunny 0.5 · 0.7 + 0.5 · 0.3 = 0.50; cloudy 0.5 · 0.2 + 0.5 · 0.4 = 0.30; rainy 0.5 · 0.1 + 0.5 · 0.3 = 0.20. Check: 0.50 + 0.30 + 0.20 = 1. In matrix form this is the row vector (0.5, 0.5, 0) times P. One step of a distribution is always "row vector times P"; the stationary distribution later is the row vector this step leaves unchanged.</p>`)}
    ${oops("Reading the matrix by columns. Row = from, column = to. Rows must sum to 1; columns usually do not. If a row does not sum to 1, the matrix is wrong.")}
    ${tryit([
      ["A chain on two states A and B stays in A with probability 0.9 and stays in B with probability 0.6. Write down P.", `<p>Each row sums to 1, so P<sub>AB</sub> = 1 − 0.9 = 0.1 and P<sub>BA</sub> = 1 − 0.6 = 0.4. Row A: (0.9, 0.1); row B: (0.4, 0.6).</p>`],
      ["Weather chain, today cloudy. What is the probability of cloudy, cloudy, rainy on the next three days?", `<p>Multiply along the path: P<sub>CC</sub> · P<sub>CC</sub> · P<sub>CR</sub> = 0.4 · 0.4 · 0.3 = <b>0.048</b>.</p>`],
      ["Let X<sub>n</sub> be the face of the nth die roll. Is it i.i.d.? Is it a Markov chain? What is its transition matrix?", `<p>It is i.i.d., and every i.i.d. process is a Markov chain: the next roll does not depend on the past at all, so certainly not on more than the present. P is 6 × 6 with every entry 1/6: every row is the same, because the current face does not matter.</p>`],
    ])}

    <h2>${H.rec} (slide 8)</h2>
    ${plain("This is how you simulate a Markov chain on a computer: take the current state and one fresh uniform random number, and a fixed rule f turns them into the next state. The theorem also works backwards: every chain can be simulated this way, so the uniform generators of lecture 2 are all you need.")}
    <p>The theorem: for any real function f(x, u) and i.i.d. random numbers U<sub>n</sub> that are independent of the start X₀, the recursion</p>
    <div class="formula">${fx(String.raw`X_{n+1} = f(X_n, U_n), \qquad \{U_n\} \text{ i.i.d.}`, "X<sub>n+1</sub> = f(X<sub>n</sub>, U<sub>n</sub>), U<sub>n</sub> i.i.d.")}</div>
    <p>is a Markov chain. Here f is a fixed rule (the same at every step), x stands for the current state and u for the random input. It is Markov because X<sub>n+1</sub> depends only on X<sub>n</sub> and a fresh random number, and i.i.d. noise carries no memory of the past. Conversely, every time-homogeneous Markov chain can be written this way for a suitable f, and U<sub>n</sub> can always be chosen uniform on [0, 1) (every value from 0 included to 1 excluded equally likely); only f changes. For a finite chain the f is the ${inL(2, "The inversion transform", "inversion transform of lecture 2")} applied to the current row: lay the row out on [0, 1) as consecutive pieces whose lengths are the probabilities and see where u falls.</p>
    ${ex("Worked example (slide 8): one step from Sunny with u = 0.83", `<p>The Sunny row is (0.7, 0.2, 0.1), so [0, 1) splits into Sunny [0, 0.7), Cloudy [0.7, 0.9) and Rainy [0.9, 1). u = 0.83 falls into [0.7, 0.9): the next state is <b>Cloudy</b>. From Cloudy the split would be [0, 0.3), [0.3, 0.7), [0.7, 1), and the same u would give Rainy: the state decides which row, u decides where in it. The slide's 10,000 simulated days come out 45.7 % sunny, 28.3 % cloudy and 26.0 % rainy.</p>`)}
    ${ex("Worked example (added here): three steps by hand", `<p>Start sunny and draw u = 0.45, 0.95, 0.12. Step 1, Sunny row [0, 0.7) | [0.7, 0.9) | [0.9, 1): 0.45 &lt; 0.7, so <b>Sunny</b>. Step 2, Sunny row again: 0.95 ≥ 0.9, so <b>Rainy</b>. Step 3, now the Rainy row (0.2, 0.3, 0.5), split [0, 0.2) | [0.2, 0.5) | [0.5, 1): 0.12 &lt; 0.2, so <b>Sunny</b>. The realisation is Sunny, Sunny, Rainy, Sunny.</p><p>Other chains in this form: an i.i.d. process is f(x, u) = u (ignore x); the random walk at the end of the page is f(x, u) = x + step(u); the x · u chain below is f(x, u) = x · u.</p>`)}
    ${lab("mc", "walk a Markov chain with uniform numbers", "Pick a chain and press <b>1 step</b>: the coloured bar is the row of P for the current state, laid out on [0, 1); the black line is the drawn u, and the piece it hits is the next state. The strip lists the last 60 states, one colour per state; the table counts visits. Then press <b>10,000 steps</b> and compare the share column with π: they agree to about one percentage point. The flip chain alternates strictly; the gambler's ruin gets stuck at €0 or €3 and stays there.")}
    ${oops("Using one fixed split of [0, 1) for every step. The split must be the row of the state the chain is in now: u = 0.83 gives Cloudy from Sunny but Rainy from Cloudy.")}

    <h2>${H.ck} (slides 9–10)</h2>
    ${plain("Chapman–Kolmogorov answers \"where will the chain be n steps from now?\". Split the journey at an intermediate time, add up over every state the chain could be in at that moment, and this bookkeeping turns out to be matrix multiplication. So n steps ahead is the matrix P multiplied by itself n times.")}
    <p>Write P<sub>ij</sub><sup>(n)</sup> = P(X<sub>n</sub> = x<sub>j</sub> | X₀ = x<sub>i</sub>) (read "P i j in n steps") for the probability of going from x<sub>i</sub> to x<sub>j</sub> in exactly n steps. For a time-homogeneous chain these are the entries of a matrix power. The reason is the <dfn>Chapman–Kolmogorov equation</dfn>, in three steps (slide 9):</p>
    <ol><li>Every path from x<sub>i</sub> at time 0 to x<sub>j</sub> at time n + m passes some state x<sub>k</sub> at time n.</li>
      <li>By the Markov property, the probability of going i → k in n steps and then k → j in m more steps is the product P<sub>ik</sub><sup>(n)</sup> P<sub>kj</sub><sup>(m)</sup>.</li>
      <li><dfn>Marginalise</dfn> over the intermediate state, that is, add these products over all k (the law of total probability):</li></ol>
    <div class="formula"><div class="fl">${fx(String.raw`P_{ij}^{(n+m)} = \sum_{k \in S} P_{ik}^{(n)}\, P_{kj}^{(m)}`, "P<sub>ij</sub><sup>(n+m)</sup> = Σ<sub>k</sub> P<sub>ik</sub><sup>(n)</sup> P<sub>kj</sub><sup>(m)</sup>")}</div><div class="fl">${fx(String.raw`\mathbf P^{(n)} = \mathbf P^n = \underbrace{\mathbf P \cdot \mathbf P \cdots \mathbf P}_{n \text{ times}}`, "P⁽ⁿ⁾ = Pⁿ = P · P ⋯ P (n times)")}</div></div>
    <p>"k ∈ S" reads "k in S": the sum runs over every state. The sum over k is exactly how a matrix product is computed, so P<sup>(n+m)</sup> = P<sup>(n)</sup> P<sup>(m)</sup>, and applying this repeatedly gives the <dfn>matrix power</dfn> Pⁿ. The slide's summary: for i.i.d. processes probabilities multiply, for Markov chains transition matrices multiply.</p>
    ${why("Context, not on the slides: matrix multiplication in one paragraph", `<p>The entry (i, j) of a product AB is row i of A times column j of B: multiply entry by entry and add, (AB)<sub>ij</sub> = Σ<sub>k</sub> A<sub>ik</sub> B<sub>kj</sub>. Example with A = [[1, 2], [3, 4]] and B = [[5, 6], [7, 8]] (rows listed): top left 1 · 5 + 2 · 7 = 19, top right 1 · 6 + 2 · 8 = 22, bottom left 3 · 5 + 4 · 7 = 43, bottom right 3 · 6 + 4 · 8 = 50. Order matters: AB and BA differ in general. P² is just P times P.</p>`)}
    ${ex("Worked example (slide 10): the weather two days ahead", `<p>Sunny today, sunny in two days: sum over tomorrow's weather k of P<sub>Sk</sub> P<sub>kS</sub> = 0.7 · 0.7 + 0.2 · 0.3 + 0.1 · 0.2 = 0.49 + 0.06 + 0.02 = <b>0.57</b>. The other two entries of the first row: sunny → cloudy 0.7 · 0.2 + 0.2 · 0.4 + 0.1 · 0.3 = 0.14 + 0.08 + 0.03 = 0.25; sunny → rainy 0.7 · 0.1 + 0.2 · 0.3 + 0.1 · 0.5 = 0.07 + 0.06 + 0.05 = 0.18. The row (0.57, 0.25, 0.18) still sums to 1. Rainy today, sunny in two days: 0.2 · 0.7 + 0.3 · 0.3 + 0.5 · 0.2 = 0.14 + 0.09 + 0.10 = 0.33. The whole of P², as on the slide:</p>${p2t}`)}
    ${ex("Worked example (added here): three days ahead from P² and P", `<p>Chapman–Kolmogorov with n = 2 and m = 1: P<sup>(3)</sup><sub>SS</sub> = Σ<sub>k</sub> P<sup>(2)</sup><sub>Sk</sub> P<sub>kS</sub> = 0.57 · 0.7 + 0.25 · 0.3 + 0.18 · 0.2 = 0.399 + 0.075 + 0.036 = <b>0.510</b>. Sunny today, sunny in three days: 51 %, down from 70 % (one day) and 57 % (two days), on its way to the long-run 45.7 %.</p>`)}
    ${chart("w3", leg([[1, "start sunny"], [2, "start cloudy"], [3, "start rainy"]]))}${cap("Each curve is one starting weather; its height at day n is the probability of sunshine n days later (the first column of Pⁿ, computed here; the slide plots the same three curves). What to look for: at n = 0 the curves sit at 100 % (sunny start) and 0 %; at n = 1 they are the first column of P, 70 %, 30 %, 20 %; at n = 2 the P² values 57 %, 39 %, 33 %; by day 6 all three lie on the dashed line at 45.7 %. The chain has forgotten where it started. Hover, or focus the chart and use the arrow keys, to read single days.")}
    ${lab("pow", "raise P to the n-th power", "Choose a chain and drag <b>n</b>. The table is Pⁿ, darker cells are larger probabilities, and every row still sums to 1. Below it, the top-left entry is written out as a Chapman–Kolmogorov sum from Pⁿ⁻¹ and P. What to look for: in the weather chain all rows become equal from about n = 6 (the start is forgotten); the flip chain switches between two patterns forever; in the gambler's ruin the rows turn into absorption probabilities (from €1: 2/3 ruin, 1/3 reach €3).")}
    ${oops("Squaring the entries instead of the matrix. P<sup>(2)</sup><sub>SS</sub> is 0.57, not 0.7² = 0.49: the 0.49 counts only the path sunny → sunny → sunny and misses sunny → cloudy → sunny and sunny → rainy → sunny.")}
    ${tryit([
      ["Compute P<sup>(2)</sup><sub>CC</sub> for the weather chain (cloudy today, cloudy in two days).", `<p>Sum over tomorrow's weather: P<sub>CS</sub> P<sub>SC</sub> + P<sub>CC</sub> P<sub>CC</sub> + P<sub>CR</sub> P<sub>RC</sub> = 0.3 · 0.2 + 0.4 · 0.4 + 0.3 · 0.3 = 0.06 + 0.16 + 0.09 = <b>0.31</b>, the middle entry of the P² table.</p>`],
      ["Two-state chain with rows A: (0.9, 0.1) and B: (0.4, 0.6). Probability of A → A in two steps?", `<p>Either stay twice or go to B and come back: 0.9 · 0.9 + 0.1 · 0.4 = 0.81 + 0.04 = <b>0.85</b>.</p>`],
      ["Simulate one step of the weather chain from Rainy with u = 0.42, and again with u = 0.73.", `<p>The Rainy row (0.2, 0.3, 0.5) splits [0, 1) into Sunny [0, 0.2), Cloudy [0.2, 0.5), Rainy [0.5, 1). u = 0.42 gives <b>Cloudy</b>, u = 0.73 gives <b>Rainy</b>.</p>`],
    ])}

    <h2>${H.abs} (slide 11)</h2>
    ${plain("Some states are traps. A closed set is a group of states the chain can never leave once it is inside; an absorbing state is a trap made of a single state. Traps decide the long run: wherever the chain starts, it may end up stuck in one.")}
    <p>A set C of states is <dfn>closed</dfn> if no state outside C can be reached from any start in C: once inside, the chain never leaves. An <dfn>absorbing state</dfn> is a closed set with a single state x<sub>i</sub>, so</p>
    <div class="formula">${fx(String.raw`P_{ii} = 1, \qquad P_{ij} = 0 \ \text{ for all } j \ne i`, "P<sub>ii</sub> = 1, P<sub>ij</sub> = 0 for all j ≠ i")}</div>
    <p>The lecture's picture is casino gambling: once your money is gone you cannot win any back, so 0 is absorbing.</p>
    ${ex("Worked example (added here): a gambler with €1 who stops at €3", `<p>States €0, €1, €2, €3; each fair bet wins or loses €1 with probability ½; the gambler stops at €0 (ruined) or €3 (target). Rows: €0 (1, 0, 0, 0), €1 (½, 0, ½, 0), €2 (0, ½, 0, ½), €3 (0, 0, 0, 1). Closed sets: {€0}, {€3}, {€0, €3} and the whole S. The set {€1, €2} is not closed, because one lost bet from €1 leaves it. €0 and €3 are absorbing.</p>
      <p>Probability of ruin from €1, by <i>first-step analysis</i> (condition on the first bet): write h₁, h₂ for the ruin probabilities from €1 and €2. Then h₁ = ½ · 1 + ½ · h₂ (lose: ruined; win: now at €2) and h₂ = ½ · h₁ + ½ · 0. Substituting: h₁ = ½ + ¼ h₁, so ¾ h₁ = ½ and <b>h₁ = 2/3</b>, h₂ = 1/3. The matrix-power explorer above shows the same numbers in P<sup>(30)</sup>.</p>`)}
    <p>The lecture's continuous example multiplies by a fresh uniform number every step:</p>
    <div class="formula">${fx(String.raw`X_{n+1} = X_n U_n, \qquad U_n \sim \mathcal U(0, 1), \qquad X_0 \in (0, 1)`, "X<sub>n+1</sub> = X<sub>n</sub> U<sub>n</sub>, U<sub>n</sub> ~ U(0, 1)")}</div>
    <p>"U<sub>n</sub> ~ U(0, 1)" reads "U n is distributed uniformly on 0 to 1". Here S = [0, 1] and 0 is absorbing, since 0 · u = 0 forever. Started at X₀ = 2, the chain falls below 1 and stays there, so [0, 1] is closed.</p>
    ${ex("Worked example (added here): a few steps of the x · u chain", `<p>From X₀ = 0.9 with u = 0.5, 0.2, 0.8: X₁ = 0.45, X₂ = 0.09, X₃ = 0.072. Every step multiplies by a number below 1, so the chain can only shrink. From X₀ = 2 with u = 0.4: X₁ = 0.8, and from then on every value stays in [0, 1], which is why [0, 1] is closed.</p>`)}
    ${chart("xu")}${cap("Four runs of X(n+1) = X(n) · U(n) from X₀ = 0.9, simulated here (the slide shows four runs of its own). The vertical axis is log₁₀ X(n), roughly minus the number of zeros after the decimal point: −4 means 0.0001, −12 means 0.000000000001. What to look for: every run falls along the dashed line of slope −0.434 per step, yet none reaches 0, because drawing exactly u = 0 has probability zero. Hover a run to read its value after 30 steps.")}
    ${why("Context, not on the slides: where the 0.434 per step comes from", "<p>Taking logarithms turns the product into a sum: ln X<sub>n</sub> = ln X₀ + Σ ln U<sub>k</sub>, a random walk with i.i.d. steps. Each step has expected value (average) E[ln U] = ∫₀¹ ln u du = [u ln u − u]₀¹ = −1, so ln X<sub>n</sub> falls by about 1 per step, and log₁₀ X<sub>n</sub> by 1/ln 10 = 0.434. After 30 steps a typical run sits near 10<sup>−13</sup>. The slide states the result; the integral is the derivation.</p>")}
    ${oops("Calling every closed set absorbing. Absorbing means closed with a single state. {€0, €3} is closed, but it is not one absorbing state; each of its two states is absorbing on its own.")}

    <h2>${H.erg} (slide 12)</h2>
    ${plain("Three yes-or-no properties tell you whether a chain behaves well in the long run: can it get everywhere (irreducible), does it move in a fixed rhythm (periodic), and does it keep coming back to every state within a finite average time (ergodic). You check them before you trust a long-run answer.")}
    <ul class="cmp three">
      <li><b>Irreducible</b><span class="v"><dfn>Irreducible</dfn>: there is no closed set other than S itself, so every state stays reachable from every other if you wait long enough.</span><span class="muted">Irreducible alone does not guarantee a return: a random walk with p ≠ ½ can drift off for good.</span></li>
      <li><b>Periodic or aperiodic</b><span class="v">A state x<sub>j</sub> has <dfn>period</dfn> t if returns are possible only after multiples of t steps (t ≥ 2). <dfn>Aperiodic</dfn>: no state has such a rhythm.</span><span class="muted">Period 2: 1 → 2 → 1 → 2 → …, the flip chain. The period must be at least 2; with t = 1 every chain would count as periodic.</span></li>
      <li><b>Ergodic</b><span class="v"><dfn>Ergodic</dfn>: every state is revisited, with a finite <dfn>mean recurrence time</dfn> (average number of steps until the chain comes back).</span><span class="muted">Proving ergodicity is usually hard; irreducibility and aperiodicity are much easier to show.</span></li>
    </ul>
    ${ex("Worked example (added here): classify the three chains of the explorers", `<p><b>Weather chain.</b> Every entry of P is positive, so every state reaches every other in one step: irreducible. P<sub>SS</sub> = 0.7 &gt; 0, so the chain can return to Sunny after 1 step, and also after 2, 3, …: no rhythm, aperiodic (likewise for Cloudy and Rainy).</p>
      <p><b>Flip chain</b> (rows (0, 1) and (1, 0)). Irreducible: 1 → 2 → 1. Returns to state 1 happen only at n = 2, 4, 6, …: period 2.</p>
      <p><b>Gambler's ruin.</b> Not irreducible: {€0} is a closed set smaller than S, and from €0 nothing else is reachable.</p>`)}
    ${why("Context, not on the slides: the textbook period and the mean return time", `<p>Textbooks define the period of a state as the greatest common divisor of all n with P<sub>jj</sub><sup>(n)</sup> &gt; 0. If returns are possible after 4, 6 and 8 steps, the period is 2; after 2 and 3 steps, it is 1 (aperiodic), even though a one-step return is impossible.</p>
      <p>For an irreducible chain with stationary distribution π (next section), a standard result (Kac's formula) gives the mean recurrence time of state k as 1/π<sub>k</sub>. Weather chain: back to Sunny after 46/21 ≈ 2.19 days on average, to Cloudy after 46/13 ≈ 3.54, to Rainy after 46/12 ≈ 3.83. All finite, so the chain is ergodic.</p>`)}
    <p>The lecture's example of a chain that cannot get trapped: X<sub>n+1</sub> uniform on (εX<sub>n</sub>, 1), where ε (read epsilon) is a fixed small positive number. It can shrink, but also grow back up to 1, so it never gets stuck at 0. The lecturer wrote it as X<sub>n</sub>U<sub>n</sub> with U<sub>n</sub> ~ U(ε, 1/X<sub>n</sub>); since that U<sub>n</sub> depends on X<sub>n</sub>, the slide rewrites it in the i.i.d. form of slide 8 as X<sub>n+1</sub> = εX<sub>n</sub> + (1 − εX<sub>n</sub>)V<sub>n</sub> with V<sub>n</sub> ~ U(0, 1). (The first version written on the board, U(ε, 1), could only shrink.) Example: ε = 0.5, X<sub>n</sub> = 0.2 and V<sub>n</sub> = 0.5 give X<sub>n+1</sub> = 0.1 + 0.9 · 0.5 = 0.55, larger than before. The slide also notes that the lecture's "ergodic implies irreducible" needs irreducibility built into the definition, as most textbooks do: two absorbing states are each revisited every step, yet cannot reach each other.</p>
    ${oops("Thinking aperiodic means the chain returns every step. Aperiodic only means returns are not locked to a rhythm; the chain may still need several steps to come back.")}

    <h2>${H.stat} (slide 13)</h2>
    ${plain("The stationary distribution π (read pi) is the long-run answer: the share of time the chain spends in each state, and the distribution that no longer changes once reached. You find it by solving π = πP, a small system of linear equations.")}
    <p>Two definitions appear, and the slide keeps them apart. The board's is a limit: after many steps the chance of being in state k no longer depends on the start j. The usual one asks only that one step leaves π unchanged:</p>
    <div class="formula"><div class="fl">${fx(String.raw`p_k = \lim_{n \to \infty} P_{jk}^{(n)}\ \ \forall j, \qquad p_k \ge 0, \quad \sum_{k \in S} p_k = 1`, "p<sub>k</sub> = lim P<sub>jk</sub><sup>(n)</sup> for every start j")}<span class="fn">limiting distribution (board)</span></div><div class="fl">${fx(String.raw`\boldsymbol\pi = \boldsymbol\pi\, \mathbf P`, "π = πP")}<span class="fn">stationary distribution (usual)</span></div></div>
    <p>Reading the symbols: "lim<sub>n→∞</sub>" is the value approached as n grows without bound; "∀ j" reads "for all j"; p<sub>k</sub> is the long-run probability of state k. π = (π₁, …, π<sub>N</sub>) is a row vector with one probability per state, and πP is the distribution one step later (the "row vector times P" step of the forecast example above). The first is a <dfn>limiting distribution</dfn>; the second a <dfn>stationary distribution</dfn>.</p>
    <p>The standard theorem: for an irreducible chain a stationary distribution exists if and only if every state has a finite mean return time; it is then unique, and if the chain is also aperiodic, P<sub>jk</sub><sup>(n)</sup> → π<sub>k</sub> from every start j. The lecture's version ("if and only if aperiodic and ergodic", often abbreviated "iff") holds when ergodic includes irreducibility. A trap does not rule out a stationary distribution either: the x · u chain settles on 0. The flip chain shows the gap between the two definitions: π = (½, ½) satisfies πP = π, yet P<sup>(n)</sup>₁₁ = 1, 0, 1, 0, … never converges. Aperiodicity is what makes P<sup>(n)</sup> converge. The simplest case of all: every i.i.d. process is a Markov chain with f(x, u) = u, and its distribution is stationary.</p>
    ${ex("Worked example: solving π = πP for the weather chain (result on slide 13)", `<p>Write π = (s, c, r). Column by column, π = πP says s = 0.7s + 0.3c + 0.2r and r = 0.1s + 0.3c + 0.5r, and s + c + r = 1 (the cloudy equation is redundant: it follows from the other two). The first gives 0.3s = 0.3c + 0.2r, so s = c + 2r/3. Put this into the second: 0.5r = 0.1c + r/15 + 0.3c, so (13/30) r = 0.4c and c = 13r/12; then s = 13r/12 + 8r/12 = 21r/12. Normalising: r (21 + 13 + 12)/12 = 1 gives r = 12/46. So <b>π = (21, 13, 12)/46 = (0.457, 0.283, 0.261)</b>, matching P<sup>(10)</sup> and the slide's 10,000-day simulation.</p><p>Check one entry: (πP)<sub>Sunny</sub> = (0.7 · 21 + 0.3 · 13 + 0.2 · 12)/46 = (14.7 + 3.9 + 2.4)/46 = 21/46. One step leaves π unchanged.</p>`)}
    ${ex("Worked example (added here): any two-state chain", `<p>Rows A: (0.9, 0.1) and B: (0.4, 0.6). π = πP gives π<sub>A</sub> = 0.9π<sub>A</sub> + 0.4π<sub>B</sub>, so 0.1π<sub>A</sub> = 0.4π<sub>B</sub> and π<sub>A</sub> = 4π<sub>B</sub>. With π<sub>A</sub> + π<sub>B</sub> = 1: 5π<sub>B</sub> = 1, so <b>π = (0.8, 0.2)</b>. In general, with leaving probabilities a (from A) and b (from B), π = (b, a)/(a + b): here (0.4, 0.1)/0.5. Flip chain, a = b = 1: π = (½, ½).</p>`)}
    ${why("Context, not on the slides: how fast the weather chain forgets", "<p>An <dfn>eigenvalue</dfn> λ (read lambda) of P is a number with vP = λv for some non-zero vector v. The eigenvalues of this P are 1, 0.3 + 0.1√3 ≈ 0.473 and 0.3 − 0.1√3 ≈ 0.127. The eigenvalue 1 belongs to π (πP = 1 · π); the distance of Pⁿ from its limit shrinks like the second one, 0.473ⁿ. That is what the matrix-power explorer shows: the largest deviation is 0.127 at n = 2, 0.029 at n = 4, 0.0064 at n = 6, roughly halving each step. Within 0.01 of π after six days, within 0.001 after nine.</p>")}
    ${oops("Forgetting the normalisation. π = πP alone is solved by every multiple of π; only Σπ<sub>k</sub> = 1 pins it down. And π stands to the left of P as a row vector: Pπ with a column vector answers a different question.")}
    ${tryit([
      ["Which of these chains are irreducible, and which are aperiodic? (a) rows (0.5, 0.5), (0.5, 0.5); (b) rows (0, 1), (1, 0); (c) rows (1, 0), (0.3, 0.7).", `<p>(a) Irreducible (each state reaches the other in one step) and aperiodic (self-loops). (b) Irreducible, but period 2. (c) Not irreducible: state 1 is absorbing, state 2 is never reached from it.</p>`],
      ["Find the stationary distribution of the chain with rows A: (0.8, 0.2) and B: (0.5, 0.5).", `<p>0.2π<sub>A</sub> = 0.5π<sub>B</sub>, so π<sub>A</sub> = 2.5π<sub>B</sub>; with the sum 1: 3.5π<sub>B</sub> = 1, <b>π = (5/7, 2/7) ≈ (0.714, 0.286)</b>. Check: 0.714 · 0.8 + 0.286 · 0.5 = 0.571 + 0.143 = 0.714.</p>`],
      ["In the long run, how many rainy days does the weather chain have in a 365-day year, and how long is the average wait from one sunny day to the next?", `<p>365 · 12/46 ≈ <b>95 rainy days</b>. Mean return time to Sunny is 1/π<sub>S</sub> = 46/21 ≈ <b>2.2 days</b> (Kac's formula from the context box).</p>`],
    ])}

    <h2>${H.samp} (slide 14)</h2>
    ${plain("Turn the long run around: if you want random samples from a distribution p that is hard to sample directly, build a chain whose stationary distribution is p, run it long enough, and read off its states. This is the idea behind the MCMC methods later in the course.")}
    <p>If P<sup>(n)</sup> forgets its start, why not draw i.i.d. samples from p directly? Often you can't: there is no inversion formula, no efficient sampler, or p is not even known in closed form, only that it exists. Simulating a chain whose stationary distribution is p still works, and every distribution is the stationary distribution of some aperiodic, ergodic chain. The recipe has three steps:</p>
    <ol>
      <li><b>Run the chain</b> for n ≫ 1 steps (≫ reads "much greater than"). Early states still depend on where it started, because X<sub>n+1</sub> depends on X<sub>n</sub>.</li>
      <li><b>Wait out the <dfn>mixing time</dfn></b>, the number of steps until the chain's distribution is close to p, and discard this <dfn>run-in</dfn> (also called burn-in). The mixing time is usually not known analytically; exact results exist only for simple chains such as coin tosses or simple diffusion.</li>
      <li><b>Test, then record</b>: a statistical test decides when successive values come from one and the same distribution; from then on the states are samples from p. Consecutive states are correlated, not independent draws.</li>
    </ol>
    <p>This is <dfn>Markov chain Monte Carlo</dfn> (MCMC); Metropolis–Hastings and Gibbs sampling, later in the course, are recipes for building such chains.</p>
    ${ex("Worked example (added here): the weather chain as a sampler of π", `<p>Pretend π = (0.457, 0.283, 0.261) were unknown. From the context box above, Pⁿ is within 0.01 of π after 6 steps, so discard the first 10 states as run-in and record the next 10,000: the shares come out near 45.7 %, 28.3 % and 26.0 %, the slide's numbers. The records are correlated: after a sunny day the next is sunny with probability 0.7, not 0.457. So 10,000 chain states carry less information than 10,000 independent draws; the error of the shares is larger than for i.i.d. samples of the same size.</p>`)}
    ${oops("Keeping the run-in. The first states remember the start; averaging them in pulls the estimate towards the starting state.")}

    <h2>${H.rw} (slides 15–16)</h2>
    ${plain("A random walk is the simplest model of something that wanders: each step adds a random jump to the current position. It is the discrete-time picture of diffusion, and the starting point for Brownian motion later in the course.")}
    <p>A <dfn>random walk</dfn> is a running sum of i.i.d. steps d<sub>i</sub>, the <dfn>increments</dfn>, which can be Gaussian, uniform or ±1, in one, two or three dimensions; each choice gives a different walk:</p>
    <div class="formula">${fx(String.raw`X_n = \sum_{i=1}^{n} d_i, \qquad X_0 = 0, \qquad f(x, u) = x + u`, "X<sub>n</sub> = Σ d<sub>i</sub>, X₀ = 0, f(x, u) = x + u")}</div>
    <p>Σ from i = 1 to n adds d₁ + d₂ + … + d<sub>n</sub>. X<sub>n</sub> sums the whole history, so it may not look Markov, but X<sub>n+1</sub> = X<sub>n</sub> + d<sub>n+1</sub> is a recursion with i.i.d. noise, so by slide 8 it is one. Random walks are used across the sciences: Brownian motion of particles in physics, animal movement and population dynamics in biology, asset prices in finance, behaviour without known internals in sociology. The simple random walk steps one to the right with probability p and one to the left with 1 − p, never staying put; each row of its (infinite) transition matrix reads …, 0, 1 − p, 0, p, 0, …. On a finite grid of 8 points it becomes an 8 × 8 matrix once the boundary rows say what happens at the walls.</p>
    ${ex("Worked example (added here): one walk by hand", `<p>Steps +1, +1, −1, +1, −1, −1 give positions X₁ = 1, X₂ = 2, X₃ = 1, X₄ = 2, X₅ = 1, X₆ = 0: back at the start after six steps. With p = ½ this particular sequence has probability (½)⁶ = 1/64.</p>`)}
    ${ex("Worked example: back at the start after four steps", `<p>To be at 0 after 4 steps of ±1 the walk needs two steps up and two down, in any order: C(4, 2) = 6 of the 2⁴ = 16 equally likely sequences (+ + − −, + − + −, + − − +, − + + −, − + − +, − − + +), so P(X₄ = 0) = 6/16 = <b>0.375</b>. As a matrix-power entry it is P<sup>(4)</sup><sub>00</sub>. After one step the probability is 0, after three steps 0 again: every step flips whether X<sub>n</sub> is even or odd, so the walk is periodic with period 2.</p>`)}
    ${ex("Worked example (added here): drift and spread", `<p>One ±1 step has mean p · 1 + (1 − p) · (−1) = 2p − 1, the <dfn>drift</dfn>, and variance 1 − (2p − 1)² = 4p(1 − p). For a sum of i.i.d. steps, means add and variances add: E[X<sub>n</sub>] = n(2p − 1) and Var(X<sub>n</sub>) = 4p(1 − p) n. The <dfn>standard deviation</dfn>, the typical distance from the mean, is the square root of the variance. Symmetric walk, p = ½, n = 100: mean 0, variance 100, standard deviation 10. Biased walk, p = 0.6, n = 100: mean 100 · 0.2 = 20, variance 4 · 0.6 · 0.4 · 100 = 96, standard deviation √96 ≈ 9.8. The drift grows like n, the spread only like √n, which is why a biased walk drifts off for good.</p>`)}
    ${lab("rw", "random walks against their drift and spread", "Drag <b>p</b> (the probability of a step up) and choose the number of walkers; <b>New walks</b> draws fresh ones. Each thin line is one walk of 200 steps, the dashed line is the drift n(2p − 1), and the shaded band is drift ± 2 standard deviations, where about 95 % of walks end. What to look for: at p = 0.5 the band is symmetric around 0 and widens like √n; at p = 0.6 the whole bundle climbs by 0.2 per step on average.")}
    ${chart("rwpmf", leg([[1, "after 10 steps"], [2, "after 50 steps"], [3, "after 200 steps"]]))}${cap("Probability of each position after 10, 50 and 200 steps of the symmetric walk, computed here from the binomial formula (the slide plots the same three curves). After an even number of steps only even positions are reachable, so each probability is spread over a width of 2 (divided by 2) to draw a smooth curve. What to look for: the probability of being back at 0 drops from 24.6 % to 11.2 % to 5.6 %, and the curve widens like √n, four times the steps for twice the width. The mean squared displacement is linear in time, which is why the walk models diffusion, for example of charges in semiconductors. Hover to read single positions.")}
    <p>The slide corrects the video's ending, which calls the Gaussian the walk's stationary distribution: on the infinite line there is none. X<sub>n</sub> ≈ N(0, n) (approximately normal with mean 0 and variance n) keeps widening, as the chart shows, and the walk is periodic besides.</p>
    ${oops("Expecting the spread to grow like n. It grows like √n: after 10,000 steps a symmetric walk is typically about 100 from its start, not thousands.")}

      ["Walk with p = 0.7: mean and standard deviation of the position after 50 steps?", `<p>Mean 50 · (2 · 0.7 − 1) = 50 · 0.4 = <b>20</b>. Variance 4 · 0.7 · 0.3 · 50 = 42, standard deviation √42 ≈ <b>6.5</b>.</p>`],
      ["Why are 10,000 recorded states of a Markov chain sampler usually worth less than 10,000 independent draws?", `<p>Consecutive states are correlated: each one is close to the previous one, so part of every new state repeats information you already have. The estimate fluctuates more than with independent draws, and the run-in has to be discarded on top.</p>`],
    ])}

    <h2>Lecture 3 on one page (slide 17)</h2>
    <div class="tt-wrap"><table class="tt fs"><tr><th>Topic</th><th>Formula</th></tr>
      <tr><th>Markov property</th><td><span class="f">${fx(String.raw`P(X_{n+1} = x_j \mid X_n = x_i, \dots, X_0 = y_0) = P_{ij}`, "P(X<sub>n+1</sub> = x<sub>j</sub> | X<sub>n</sub> = x<sub>i</sub>, …) = P<sub>ij</sub>")}</span></td></tr>
      <tr><th>Transition probabilities</th><td><span class="f">${fx(String.raw`0 \le P_{ij} \le 1, \quad \sum_j P_{ij} = 1`, "0 ≤ P<sub>ij</sub> ≤ 1, Σ<sub>j</sub> P<sub>ij</sub> = 1")}</span></td></tr>
      <tr><th>Recursion form</th><td><span class="f">${fx(String.raw`X_{n+1} = f(X_n, U_n),\ \{U_n\} \text{ i.i.d.}`, "X<sub>n+1</sub> = f(X<sub>n</sub>, U<sub>n</sub>)")}</span></td></tr>
      <tr><th>n-step matrix</th><td><span class="f">${fx(String.raw`\mathbf P^{(n)} = \mathbf P^n`, "P⁽ⁿ⁾ = Pⁿ")}</span></td></tr>
      <tr><th>Chapman–Kolmogorov</th><td><span class="f">${fx(String.raw`P_{ij}^{(n+m)} = \sum_{k \in S} P_{ik}^{(n)} P_{kj}^{(m)}`, "P<sub>ij</sub><sup>(n+m)</sup> = Σ<sub>k</sub> P<sub>ik</sub><sup>(n)</sup> P<sub>kj</sub><sup>(m)</sup>")}</span></td></tr>
      <tr><th>Absorbing state</th><td><span class="f">${fx(String.raw`P_{ii} = 1, \quad P_{ij} = 0\ \ \forall j \ne i`, "P<sub>ii</sub> = 1, P<sub>ij</sub> = 0 for j ≠ i")}</span></td></tr>
      <tr><th>Limiting distribution</th><td><span class="f">${fx(String.raw`p_k = \lim_{n\to\infty} P_{jk}^{(n)}\ \forall k`, "p<sub>k</sub> = lim P<sub>jk</sub><sup>(n)</sup>")}</span></td></tr>
      <tr><th>Stationary distribution</th><td><span class="f">${fx(String.raw`\boldsymbol\pi = \boldsymbol\pi \mathbf P`, "π = πP")}</span></td></tr>
      <tr><th>Random walk</th><td><span class="f">${fx(String.raw`X_n = \sum_{i=1}^n d_i, \quad X_0 = 0`, "X<sub>n</sub> = Σ d<sub>i</sub>, X₀ = 0")}</span></td></tr></table></div>

    <h2>Take-home (slide 18)</h2>
    <ul>
      <li><b>What is a stochastic process?</b> A sequence X₀, X₁, … of random variables; time is discrete here, the states can be discrete or continuous.</li>
      <li><b>What does "Markov" mean?</b> One step of memory: the next state depends only on the current one, with probabilities P<sub>ij</sub>.</li>
      <li><b>How do you get n steps ahead?</b> Multiply matrices: each row of P sums to 1, and n steps are Pⁿ (Chapman–Kolmogorov).</li>
      <li><b>How do you simulate a chain?</b> With uniform numbers: every time-homogeneous chain is X<sub>n+1</sub> = f(X<sub>n</sub>, U<sub>n</sub>), and for a finite chain f cuts [0, 1) by the current row.</li>
      <li><b>What decides the long run?</b> The chain's properties: closed sets trap it, irreducible aperiodic chains with finite return times forget their start and settle at π = πP.</li>
      <li><b>What are chains good for?</b> Run past the mixing time and the states sample the stationary distribution; random walks model diffusion, with a spread growing like √n.</li>
    </ul>
