function lecture2() {
  const BALL = [[1, "100 %", "1.0"], [2, "78.5 %", "1.3"], [3, "52.4 %", "1.9"], [5, "16.4 %", "6.1"], [10, "0.25 %", "402"], [20, "2.5 × 10⁻⁶ %", "41 million"]];
  return `${head(l)}
    <p class="lead">Every stochastic simulation needs numbers drawn from some distribution: exponential waiting times, Gaussian kicks, a next state chosen with given probabilities. A computer only has deterministic arithmetic, and the lecture's answer comes in two halves. First make good uniform numbers on [0, 1); then transform them into anything else. The bridge between the halves is the inversion transform: plug a variable into its own CDF and it comes out uniform, so running the CDF backwards turns uniform numbers into the target distribution. The deck is "SMS2" in OPAL (Lecture2026), a 21-page summary in eight parts; ${exeLink(2, "tutorial 2")} (5 Nov) works through the same material in a Pluto notebook and has explorers for most of it.</p>
    ${tiles([[fx(String.raw`X = F_X^{-1}(U)`, "X = F<sub>X</sub><sup>−1</sup>(U)"), "the inversion transform"], ["2³¹ − 2", "cycle of the minimal-standard LCG"], ["2¹⁹⁹³⁷ − 1", "cycle of the Mersenne Twister"], ["1/μ", "acceptance rate of accept–reject"]])}

    <h2>Faking randomness (slides 2–3)</h2>
    <p>The lecture sorts sources of random numbers into three kinds. <b>Pseudo-random</b> numbers come from a deterministic algorithm whose output passes statistical tests for randomness, for example a Kolmogorov–Smirnov test against the uniform distribution. <b>Quasi-random</b> numbers are deterministic too but are built to cover space evenly rather than to look random. <b>Truly random</b> numbers come from hardware, such as cards that time radioactive decays (the gaps between decays are exponential); they are fine for cryptography but too slow for simulation. Simulations use the first two. Notation for the rest of the course: capital X is the random variable, lowercase x a value it takes, p(x) its density (continuous) or mass function (discrete).</p>

    <h2>Transformations and pre-images (slides 4–5)</h2>
    <p>A transformation is a function of a random variable, Y = g(X). It only makes sense if g is defined wherever X can land: the support of X must lie inside the domain of g. To get the distribution of Y you need the pre-image of a value, g⁻¹(A) = {x : g(x) ∈ A}, the set of all x that g sends into A. That set always exists but need not have one element: for g(x) = x³ on the integers each value has a single pre-image, while for g(x) = sin x every integer multiple of π maps to 0, a countably infinite pre-image.</p>
    <p>In the discrete case nothing more is needed: the probability of a value y is the total probability of every x that lands on it,</p>
    <div class="formula">${fx(String.raw`p_Y(y) = \sum_{x \,\in\, g^{-1}(y)} p_X(x)`, "p<sub>Y</sub>(y) = Σ<sub>x ∈ g⁻¹(y)</sub> p<sub>X</sub>(x)")}</div>
    <p>The slide's example shifts a die, Y = X + a: the inverse x = y − a is unique, so Y is uniform again, just on {1 + a, …, n + a}. A non-unique inverse makes the sum do real work, as in the chart.</p>
    ${chart("preimg")}${cap("Y = (X − 3)² for a fair die, computed here (not on the slides): two faces land on 1 and two on 4, so those values get twice the probability of 0 and 9. Hover a bar for its pre-image sum.")}
    ${ex("Worked example: the die squared around 3", `<p>Faces 1 to 6 give (X − 3)² = 4, 1, 0, 1, 4, 9. Pre-images: g⁻¹(0) = {3}, g⁻¹(1) = {2, 4}, g⁻¹(4) = {1, 5}, g⁻¹(9) = {6}. Each face has probability 1/6, so p<sub>Y</sub> = (1/6, 2/6, 2/6, 1/6) on (0, 1, 4, 9), which sums to 1 as it must. Mean: E[Y] = (0 + 2 + 8 + 9)/6 = 19/6 ≈ 3.17, which also equals Var(X) + (E[X] − 3)² = 35/12 + 1/4 = 19/6, a useful cross-check.</p>`)}

    <h2>Continuous transforms: through the CDF (slide 6)</h2>
    <p>For continuous X the slide assumes g is a bijection, so it is monotonic and g⁻¹ is unique. Start from the CDF of Y. If g increases, "g(X) ≤ y" is the same event as "X ≤ g⁻¹(y)", so F<sub>Y</sub>(y) = F<sub>X</sub>(g⁻¹(y)). If g decreases, the inequality flips and F<sub>Y</sub>(y) = 1 − F<sub>X</sub>(g⁻¹(y)). Differentiating either case gives one formula for the density:</p>
    <div class="formula">${fx(String.raw`f_Y(y) = f_X\big(g^{-1}(y)\big)\, \left|\frac{d}{dy} g^{-1}(y)\right|`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) · |d g⁻¹(y) / dy|")}</div>
    <p>The slide's example: if X ~ U(0, 1) then 1 − X ~ U(0, 1) as well, because g⁻¹(y) = 1 − y has derivative −1 and the absolute value removes the sign. Part 6 uses this to drop a "1 −". Non-unique inverses such as sin need extra care and are not needed for random number generation.</p>
    ${ex("Worked example: squaring a uniform number", `<p>X ~ U(0, 1), Y = X². On (0, 1) the map is increasing with g⁻¹(y) = √y and d√y/dy = 1/(2√y). Since f<sub>X</sub> = 1 on (0, 1), f<sub>Y</sub>(y) = 1/(2√y) for 0 &lt; y &lt; 1. It piles up near 0 (squaring small numbers makes them smaller) yet still integrates to 1: ∫₀¹ dy/(2√y) = [√y]₀¹ = 1. Check by the CDF: P(Y ≤ 0.25) = P(X ≤ 0.5) = 0.5. ${exeLink(2, "Tutorial 2")} has this transform as a histogram explorer.</p>`)}

    <h2>The inversion transform (slide 7)</h2>
    <p>Now transform a continuous X by its own CDF, Y = F<sub>X</sub>(X). A CDF is increasing, so the formula above applies with g⁻¹ = F<sub>X</sub>⁻¹:</p>
    <div class="formula">${fx(String.raw`F_Y(y) = P\big(F_X(X) \le y\big) = P\big(X \le F_X^{-1}(y)\big) = F_X\big(F_X^{-1}(y)\big) = y`, "F<sub>Y</sub>(y) = P(X ≤ F<sub>X</sub>⁻¹(y)) = y")}</div>
    <p>F<sub>Y</sub>(y) = y on [0, 1] is the uniform CDF, whatever X was. Read it backwards and it becomes an algorithm: if U ~ U(0, 1), then X = F<sub>X</sub>⁻¹(U) has CDF F<sub>X</sub>. Draw u, go across to the CDF, go down to x. So a computer only needs one good uniform generator, which is why research on random number generators concentrates on U(0, 1).</p>

    <h2>Uniform generators: the LCG (slides 8–10)</h2>
    <p>Data-driven randomness (time between keystrokes, mouse position, bytes of network packets) is unpredictable and irreproducible, with an unknown distribution: good for cryptographic keys, bad for simulation. Simulations want an algorithmic generator: the same seed gives the same sequence, so a run can be debugged and repeated, and it produces millions of numbers on demand. Every valid generator must make the empirical CDF of its first n numbers converge to F(x) = x; generators differ in how fast. The simplest is the linear congruential generator (LCG):</p>
    <div class="formula"><div class="fl">${fx(String.raw`z_i = a\, z_{i-1} \bmod m, \qquad u_i = \frac{z_i}{m} \in [0, 1)`, "z<sub>i</sub> = a z<sub>i−1</sub> mod m, u<sub>i</sub> = z<sub>i</sub>/m")}</div><div class="fl">${fx(String.raw`\big|\hat F_n(u) - u\big| \le \varepsilon(m), \qquad \varepsilon(m) \to 0 \text{ as } m \to \infty`, "|F̂ₙ(u) − u| ≤ ε(m) → 0 as m → ∞")}<span class="fn">accuracy: choose m large</span></div></div>
    <p>m is the modulus, a the multiplier (0 &lt; a &lt; m), z₀ the seed. C++11's <code>std::minstd_rand</code> uses m = 2³¹ − 1, the largest signed 32-bit integer, and a = 48,271, chosen by experiment for the longest cycle. Because only finitely many values exist, the sequence must eventually revisit one and, being deterministic, repeat from there: T is the cycle length.</p>
    ${ex("Worked example: the toy LCG m = 11, a = 7, z₀ = 1 (slide 10)", `<p>z₁ = 7 · 1 mod 11 = 7; z₂ = 49 mod 11 = 5; z₃ = 35 mod 11 = 2; z₄ = 14 mod 11 = 3; then 21 → 10, 70 → 4, 28 → 6, 42 → 9, 63 → 8, 56 → 1, and z₁₁ = 7 again. All ten non-zero remainders appear before the repeat: T = 10 = m − 1, the longest possible (0 is a dead end, since 7 · 0 = 0). The uniforms are 7/11, 5/11, 2/11, … ≈ 0.636, 0.455, 0.182, …. Try other a and m on the clock in ${exeLink(2, "tutorial 2")}: a = 3 with m = 11 has cycle 5 only.</p>`)}
    <div class="tt-wrap"><table class="tt prose"><tr><th>Year</th><th>Generator</th><th>Notes on the slide</th></tr>
      <tr><th>1988</th><td>Park–Miller</td><td>the "minimal standard" LCG behind std::minstd_rand; full cycle 2³¹ − 2 ≈ 2.1 · 10⁹</td></tr>
      <tr><th>1998</th><td>Mersenne Twister</td><td>the most widely used, e.g. in Python and MATLAB; cycle 2¹⁹⁹³⁷ − 1</td></tr>
      <tr><th>2003</th><td>XOR-shift</td><td>bitwise XORs and shifts; fast on graphics cards</td></tr>
      <tr><th>2018</th><td>Xoroshiro</td><td>a modern XOR-shift variant</td></tr></table></div>
    ${why("Context, not on the slides: how fast a cycle runs out", "<p>A simulation that draws 10⁹ uniform numbers per second (one core of a modern CPU can) walks through minstd's 2.1 · 10⁹ values in about two seconds. After that it replays the same numbers, and averages stop improving. The slide makes the same point: the cycle is far too short for simulations that need billions of numbers.</p>")}

    <h2>Clustering, low discrepancy and aliasing (slides 11–12)</h2>
    <p>Uniform pseudo-random points are not evenly spread: they form clusters and leave holes, and this gets worse in higher dimensions. The discrepancy D<sub>n</sub> measures how strongly n points cluster. Quasi-random generators are low-discrepancy sequences that fill space evenly at every n. The simplest is the additive recurrence sequence (ARS):</p>
    <div class="formula"><div class="fl">${fx(String.raw`u_{i+1} = (u_i + \alpha) \bmod 1, \qquad \alpha \text{ irrational}`, "u<sub>i+1</sub> = (u<sub>i</sub> + α) mod 1, α irrational")}</div><div class="fl">${fx(String.raw`D_n \propto n^{-1}`, "Dₙ ∝ n⁻¹")}<span class="fn">up to a log factor; good α: √2 − 1 or (√5 − 1)/2</span></div></div>
    <p>Its points lie on a near-lattice of stripes, but visited in an order that looks random. Ten times more points give ten times lower discrepancy, against roughly √10 for pseudo-random points. There is no free lunch: near-regular patterns cause aliasing. The slide's rule of thumb: use quasi-random numbers to explore a parameter space evenly, pseudo-random numbers where regular patterns could bias the physics, such as molecular dynamics, where aliasing could skip energy states. The Sobol sequence is the most used today; Niederreiter, Faure, Halton and van der Corput are others.</p>
    ${chart("disc", leg([[1, "pseudo-random"], [2, "additive recurrence, α = (√5 − 1)/2"]]))}${cap("Star discrepancy of n points in [0, 1), computed on this page for one seeded pseudo-random run and for the ARS. On the log-log axes the pseudo-random points fall with slope about −½, the quasi-random ones with slope about −1. The slide shows the same contrast as two scatter plots of 300 points in the square; the square version is in tutorial 2.")}
    <p><b>Parallel streams</b> (slide 12). Each processor needs its own independent stream. The cheap way seeds each processor differently, z₀ = f(process ID), which only starts each one at a different point of the same cycle, so each gets on average T / #processors numbers before the streams overlap. Dedicated parallel generators give independent, reproducible streams with the full cycle on every process.</p>
    ${ex("Worked example: a million GPU threads on minstd", `<p>T = 2³¹ − 2 ≈ 2.15 · 10⁹ shared by 10⁶ threads leaves about <b>2,150 numbers per thread</b> before one thread's stream runs into the next one's. A Monte Carlo kernel that needs 10,000 numbers per thread would already be reusing other threads' numbers, which correlates results that should be independent.</p>`)}

    <h2>Non-uniform numbers: inversion in practice (slide 13)</h2>
    <p>The exponential distribution with rate λ has a closed-form inverse CDF. Since 1 − U is uniform too (slide 6), the "1 −" can be dropped:</p>
    <div class="formula"><div class="fl">${fx(String.raw`F_X(x) = 1 - e^{-\lambda x} = y \;\Rightarrow\; x = -\tfrac{1}{\lambda}\ln(1 - y)`, "F(x) = 1 − e^(−λx) = y ⇒ x = −ln(1 − y)/λ")}</div><div class="fl">${fx(String.raw`X = -\frac{1}{\lambda}\ln R, \qquad R \sim \mathcal U(0, 1)`, "X = −ln(R)/λ, R ~ U(0, 1)")}</div><div class="fl">${fx(String.raw`\text{Rayleigh: } F_X(x) = 1 - e^{-x^2/2\sigma^2} \;\Rightarrow\; X = \sigma\sqrt{-2\ln R}`, "Rayleigh: X = σ √(−2 ln R)")}</div></div>
    <p>The slide's histogram of 10,000 values of −ln R (λ = 1) matches the exact density e<sup>−x</sup> to within 0.03 in every bin, with sample mean 1.007 against the exact 1/λ = 1. When the CDF has no closed-form inverse, as for the gamma or the normal distribution, solve F<sub>X</sub>(x) = u numerically, by regula falsi or by Newton's method:</p>
    <div class="formula">${fx(String.raw`x_{k+1} = x_k - \frac{F_X(x_k) - u}{f_X(x_k)}`, "x<sub>k+1</sub> = x<sub>k</sub> − (F(x<sub>k</sub>) − u) / f(x<sub>k</sub>)")}</div>
    ${ex("Worked example: two exponential numbers from one uniform", `<p>λ = 2 and the generator returns 0.7. With X = −ln(R)/λ: x = −ln(0.7)/2 = 0.357/2 = <b>0.178</b>. With the "1 −" form: x = −ln(0.3)/2 = 1.204/2 = <b>0.602</b>. Both are correct samples of Exp(2); they are just different samples, paired through R ↔ 1 − R. Over many draws both have mean 1/λ = 0.5.</p>`)}
    ${lab("newton", "invert the normal CDF with Newton's method")}

    <h2>Gaussian numbers: why not the CLT, and Box–Muller (slides 14–15)</h2>
    <p>One standard normal generator is enough, since shifting and scaling give any other normal: X = μ + σZ. A first idea uses the central limit theorem: each R<sub>i</sub> ~ U(0, 1) has mean ½ and variance 1/12, so their sum is approximately N(n/2, n/12), and standardising gives</p>
    <div class="formula">${fx(String.raw`X = \frac{\sum_{i=1}^{n} R_i - n/2}{\sqrt{n/12}} \;\approx\; \mathcal N(0, 1)`, "X = (Σ R<sub>i</sub> − n/2) / √(n/12) ≈ N(0, 1)")}</div>
    <p>It is inefficient twice over: every Gaussian costs n uniforms, so the generator's cycle is used up n times faster, and the approximation improves only slowly, with |X| never beyond √(3n). With n = 12 no value beyond ±6 can ever occur.</p>
    ${chart("cltsum", leg([[1, "n = 1"], [2, "n = 2"], [3, "n = 12"], ["g", "N(0, 1)", "dash"]]))}${cap("Exact densities of the standardised sum of n uniforms (Irwin–Hall), computed here; the slide shows the same comparison. At n = 12 the curve nearly lies on N(0, 1), at the price of 12 uniforms per Gaussian.")}
    <p>Box–Muller avoids the waste by going polar. Treat two independent N(0, 1) values as a point (X₁, X₂) with radius r and angle θ. The squared radius r² = X₁² + X₂² is a χ² variable with 2 degrees of freedom, which is the exponential distribution with rate ½, so r² = −2 ln R₁ by the exponential formula; and the 2-D Gaussian is rotationally symmetric, so θ = 2πR₂ is plain uniform. Two uniforms in, two independent Gaussians out:</p>
    <div class="formula"><div class="fl">${fx(String.raw`X_1 = \cos(2\pi R_2)\,\sqrt{-2\ln R_1}`, "X₁ = cos(2πR₂) √(−2 ln R₁)")}</div><div class="fl">${fx(String.raw`X_2 = \sin(2\pi R_2)\,\sqrt{-2\ln R_1}`, "X₂ = sin(2πR₂) √(−2 ln R₁)")}</div></div>
    <p>Why polar at all? In Cartesian coordinates inversion fails, because the normal CDF has no closed-form inverse. Faster variants in practice are Marsaglia's polar method and the ziggurat algorithm. The slide adds that Box–Cox and Yeo–Johnson transforms, named in the lecture video, make data look normal; they are not generators.</p>
    ${ex("Worked example: Box–Muller by hand", `<p>R₁ = 0.5, R₂ = 0.125. Radius: √(−2 ln 0.5) = √1.386 = 1.177. Angle: 2π · 0.125 = π/4, where cos = sin = 0.7071. So X₁ = X₂ = 1.177 · 0.7071 = <b>0.833</b>. A smaller R₁ pushes the point outwards: R₁ = 0.01 gives radius √9.21 = 3.03, a rare three-sigma pair. Drag the two numbers in ${exeLink(2, "tutorial 2's Box–Muller plane")}.</p>`)}

    <h2>Accept–reject sampling (slides 16–18)</h2>
    <p>When no usable inverse exists, throw darts at the graph and keep those under the curve. With a bounding box on the support [a, b]: draw x uniformly on [a, b] and u uniformly on [0, max f<sub>X</sub>]; accept x if u ≤ f<sub>X</sub>(x), otherwise draw a fresh pair. A point uniform under the graph, projected onto the x-axis, has density f<sub>X</sub>(x), because integrating out the height leaves exactly f<sub>X</sub>(x). The slide's target Beta(2.5, 6) on [0, 1] keeps 38 % of the darts.</p>
    ${ex("Worked example: where the 38 % comes from", `<p>The box has width 1 and height max f; the area under f is 1, so the fraction of darts below the curve is 1 / max f. The Beta(a, b) density peaks at its mode (a − 1)/(a + b − 2) = 1.5/6.5 = 3/13 ≈ 0.231, where f = 2.627. So the acceptance rate is 1/2.627 = <b>38.1 %</b>, as on the slide: on average 2.6 darts per sample.</p>`)}
    <p>Easy to implement, but it can waste almost every dart. Peaked or long-tailed targets leave most of the box above the curve. Infinite support has no bounding box at all: a Gaussian must be truncated wide enough not to lose mass, and every extra bit of width lowers efficiency. And in high dimensions the accepted fraction shrinks exponentially, as the slide shows for a point uniform in a d-dimensional ball drawn from its bounding cube:</p>
    <div class="tt-wrap"><table class="tt"><tr><th>dimension d</th><th>accepted</th><th>darts per point</th></tr>${BALL.map(([d, a, k]) => `<tr><th>${d}</th><td>${a}</td><td>${k}</td></tr>`).join("")}</table></div>
    <p class="muted">Acceptance is the volume of the ball over the volume of the cube; ${exeLink(2, "tutorial 2")} plots it on a log axis up to d = 30.</p>
    <p>The fix is a proposal distribution g that hugs the target: anything with an efficient generator (an exponential, a Gaussian), scaled by μ so that μ g(x) ≥ f<sub>X</sub>(x) everywhere. Draw Y ~ g and U ~ U(0, 1) and</p>
    <div class="formula"><div class="fl">${fx(String.raw`\text{accept } Y \text{ if } U \le \frac{f_X(Y)}{\mu\, g(Y)}, \qquad \mu\, g(x) \ge f_X(x)\ \ \forall x`, "accept Y if U ≤ f(Y) / (μ g(Y)), with μg ≥ f everywhere")}</div><div class="fl">${fx(String.raw`P(\text{accept}) = \frac{1}{\mu}`, "P(accept) = 1/μ")}<span class="fn">μ proposals per kept sample on average</span></div></div>
    <p>The closer μg hugs f<sub>X</sub>, the closer μ is to 1. The bounding box is the special case g = uniform. The explorer uses a two-bump target like the slide's and lets you swap the envelope.</p>
    ${lab("ar", "accept–reject under three envelopes")}
    ${why("Context, not on the slides: why P(accept) = 1/μ", "<p>A proposal Y = y is kept with probability f(y)/(μ g(y)). Averaging over Y ~ g: P(accept) = ∫ g(y) · f(y)/(μ g(y)) dy = (1/μ) ∫ f(y) dy = 1/μ. The number of proposals until the first acceptance is geometric with success probability 1/μ, so its mean is μ. The same integral, without the outer ∫, shows that an accepted Y has density f: g(y) · f(y)/(μ g(y)) divided by 1/μ is f(y).</p>")}

    <h2>Lecture 2 on one page (slides 19–20)</h2>
    <div class="tt-wrap"><table class="tt fs"><tr><th>Topic</th><th>Formula</th></tr>
      <tr><th>Discrete transform</th><td><span class="f">${fx(String.raw`p_Y(y) = \sum_{x \in g^{-1}(y)} p_X(x)`, "p<sub>Y</sub>(y) = Σ p<sub>X</sub>(x) over x ∈ g⁻¹(y)")}</span></td></tr>
      <tr><th>Continuous transform</th><td><span class="f">${fx(String.raw`f_Y(y) = f_X(g^{-1}(y))\,\left|\tfrac{d}{dy}g^{-1}(y)\right|`, "f<sub>Y</sub>(y) = f<sub>X</sub>(g⁻¹(y)) |dg⁻¹/dy|")}</span></td></tr>
      <tr><th>Inversion</th><td><span class="f">${fx(String.raw`X = F_X^{-1}(U) \sim F_X,\quad U \sim \mathcal U(0,1)`, "X = F<sub>X</sub>⁻¹(U) ~ F<sub>X</sub>")}</span></td></tr>
      <tr><th>LCG</th><td><span class="f">${fx(String.raw`z_i = a z_{i-1} \bmod m,\quad u_i = z_i/m`, "z<sub>i</sub> = a z<sub>i−1</sub> mod m, u<sub>i</sub> = z<sub>i</sub>/m")}</span></td></tr>
      <tr><th>Additive recurrence</th><td><span class="f">${fx(String.raw`u_{i+1} = (u_i + \alpha) \bmod 1,\ \ \alpha \text{ irrational}`, "u<sub>i+1</sub> = (u<sub>i</sub> + α) mod 1")}</span></td></tr>
      <tr><th>Exponential</th><td><span class="f">${fx(String.raw`X = -\tfrac{1}{\lambda}\ln R`, "X = −ln(R)/λ")}</span></td></tr>
      <tr><th>Gaussian via the CLT</th><td><span class="f">${fx(String.raw`X = \big(\textstyle\sum_{i=1}^n R_i - n/2\big)/\sqrt{n/12}`, "X = (Σ R<sub>i</sub> − n/2)/√(n/12)")}</span></td></tr>
      <tr><th>Box–Muller</th><td><span class="f">${fx(String.raw`X_1 = \cos(2\pi R_2)\sqrt{-2\ln R_1}`, "X₁ = cos(2πR₂) √(−2 ln R₁)")}</span><span class="f">${fx(String.raw`X_2 = \sin(2\pi R_2)\sqrt{-2\ln R_1}`, "X₂ = sin(2πR₂) √(−2 ln R₁)")}</span></td></tr>
      <tr><th>Accept–reject</th><td><span class="f">${fx(String.raw`\text{accept } Y \sim g \text{ if } U \le f_X(Y)/(\mu g(Y))`, "accept Y ~ g if U ≤ f(Y)/(μ g(Y))")}</span></td></tr></table></div>

    <h2>Take-home (slide 21)</h2>
    <ul>
      <li><b>What does a computer need to sample any distribution?</b> Only a good uniform generator: X = F<sub>X</sub>⁻¹(U) does the rest.</li>
      <li><b>Is pseudo-random random?</b> No, it is deterministic: same seed, same sequence. That makes runs reproducible, and the output is statistically indistinguishable from random.</li>
      <li><b>What limits a generator?</b> Its cycle length, especially when parallel streams share one cycle.</li>
      <li><b>Pseudo or quasi?</b> Quasi-random sequences cover space evenly but bring regular patterns; choose per application.</li>
      <li><b>How to get exponentials and Gaussians?</b> Exponential in closed form, Gaussian by Box–Muller, not by the slow CLT sum.</li>
      <li><b>And when there is no inverse?</b> Accept–reject, efficient only with a proposal g that fits f<sub>X</sub> closely.</li>
    </ul>
    <p class="muted">Tutorial: ${exeLink(2, "tutorial 2")} (5 Nov) has the calculation problems and programming exercises on this material. Next: ${lecLink(3, "lecture 3")} (9 Nov), discrete-time Markov chains, which the last slides announce together with Metropolis–Hastings, Gibbs sampling and random walks. Previous: ${lecLink(1, "lecture 1")}. Slides: OPAL → Lecture2026 → SMS2 (they may not be republished).</p>`;
}

// ================= Lecture 3 · Discrete-time Markov chains (SMS3, 18 pages, five parts) =================
// The weather chain of slides 7–10 (rows: from Sunny, Cloudy, Rainy) with its stationary distribution 21/46, 13/46, 12/46.
const W3 = [[0.7, 0.2, 0.1], [0.3, 0.4, 0.3], [0.2, 0.3, 0.5]], W3PI = [21 / 46, 13 / 46, 12 / 46];
const W3POW = [[[1, 0, 0], [0, 1, 0], [0, 0, 1]]]; for (let n = 1; n <= 30; n++) W3POW.push(matmul(W3POW[n - 1], W3));
// Chains for the explorers: the weather chain, the period-2 flip chain of slide 13, and a small gambler's ruin with absorbing ends (slide 11's casino picture).
const CHAINS = {
  weather: { name: "weather chain (slide 7)", S: ["Sunny", "Cloudy", "Rainy"], P: W3, start: 0, pi: W3PI, lim: [W3PI, W3PI, W3PI],
    note: "Irreducible and aperiodic: the visit shares settle at π = (0.457, 0.283, 0.261) = (21, 13, 12)/46 from any start." },
  flip: { name: "flip chain (slide 13)", S: ["State 1", "State 2"], P: [[0, 1], [1, 0]], start: 0, pi: [0.5, 0.5], lim: null,
    note: "Periodic with period 2: π = (½, ½) is stationary and the visit shares reach it, but P⁽ⁿ⁾ alternates between the identity and the swap and never converges." },
  ruin: { name: "gambler's ruin, €0 to €3", S: ["€0", "€1", "€2", "€3"], P: [[1, 0, 0, 0], [0.5, 0, 0.5, 0], [0, 0.5, 0, 0.5], [0, 0, 0, 1]], start: 1, pi: null,
    lim: [[1, 0, 0, 0], [2 / 3, 0, 0, 1 / 3], [1 / 3, 0, 0, 2 / 3], [0, 0, 0, 1]],
    note: "€0 and €3 are absorbing: each fair bet moves €1 up or down, and once the chain hits an end it stays. From €1 it ends at €0 with probability 2/3." },
};
const nextState = (P, i, u) => { let c = 0; for (let j = 0; j < P[i].length; j++) { c += P[i][j]; if (u < c) return j; } return P[i].length - 1; };

// i.i.d. noise against a Markov (AR(1)) sequence with the same N(0, 1) marginal (slide 5).
const IIDMK = (() => { const r = mulberry(37), a = [], b = []; let x = 0; for (let n = 0; n <= 50; n++) { const e = gauss(r); a.push(e); x = n ? 0.9 * x + Math.sqrt(1 - 0.81) * gauss(r) : e; b.push(x); } return [a, b]; })();
const lag1 = s => { const m = s.reduce((p, v) => p + v, 0) / s.length; let nu = 0, de = 0; s.forEach((v, i) => { de += (v - m) ** 2; if (i) nu += (v - m) * (s[i - 1] - m); }); return nu / de; };
CHARTS.iidmk = narrow => {
  const W = narrow ? 340 : 600, PHh = narrow ? 92 : 100, L = narrow ? 28 : 34, R = 12, T = 22, gap = 34, H = T + 2 * PHh + gap + 26, PW = W - L - R;
  const x = n => L + n / 50 * PW;
  const panel = (s, i, title) => { const top = T + i * (PHh + gap), y = v => top + PHh / 2 - Math.max(-3, Math.min(3, v)) / 3 * PHh / 2;
    const d = "M" + s.map((v, n) => `${x(n).toFixed(1)},${y(v).toFixed(1)}`).join(" L"), r1 = lag1(s);

      <g class="pt" tabindex="0" data-tip="${esc(`<b>${title}</b>correlation of neighbouring values: ${num(r1, 2)}`)}"><rect class="hit" x="${L}" y="${top}" width="${PW}" height="${PHh}"/><path class="line" style="stroke:var(--vz-s${i + 1})" d="${d}"/><circle class="dot" style="fill:var(--vz-s${i + 1})" cx="${x(50)}" cy="${y(s[50])}" r="4"/></g>`; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Two sequences of 50 steps with the same standard normal distribution at every step. The i.i.d. one jumps independently from step to step (correlation of neighbours ${num(lag1(IIDMK[0]), 2)}); the Markov one drifts in long swings because each value builds on the last (correlation ${num(lag1(IIDMK[1]), 2)}).">
    ${panel(IIDMK[0], 0, "i.i.d.: each value ignores the last")}${panel(IIDMK[1], 1, "Markov: X(n+1) = 0.9 X(n) + noise")}${[0, 10, 20, 30, 40, 50].map(n => `<text class="tick" x="${x(n)}" y="${H - 8}" text-anchor="middle">${n}</text>`).join("")}</svg>`;
};

// P(sunny after n days) for each starting weather (slide 10): the rows of Pⁿ meet at π(sunny) = 21/46.
line("w3", {
  xlin: true, step: 1, x: [0, 10], y: [0, 1], xTicks: [0, 2, 4, 6, 8, 10], xTicksN: [0, 5, 10], yTicks: [0, 0.25, 0.5, 0.75, 1], yTitle: "P(sunny after n days)",

// The x·u chain X(n+1) = X(n) U(n) on a log scale (slide 11): it creeps towards the absorbing state 0 at about −0.434 decades per step.
const XU = (() => { const r = mulberry(511); return Array.from({ length: 4 }, () => { let v = Math.log10(0.9); const p = [v]; for (let n = 1; n <= 30; n++) { v += Math.log10(1 - r()); p.push(v); } return p; }); })();
CHARTS.xu = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 240 : 260, L = narrow ? 36 : 44, R = 14, T = 20, B = 40, PW = W - L - R, PH = H - T - B;

  const xt = [0, 5, 10, 15, 20, 25, 30].map(n => `<text class="tick" x="${x(n)}" y="${H - 20}" text-anchor="middle">${n}</text>`).join("");
  const paths = XU.map((p, i) => `<g class="pt" tabindex="0" data-tip="${esc(`<b>Run ${i + 1}</b>X₃₀ = 10<sup>${num(p[30], 1)}</sup>, still above 0<br>average fall ${num(-(p[30] - p[0]) / 30, 3)} decades per step`)}"><path class="line thin s1" style="opacity:.8" d="M${p.map((v, n) => `${x(n).toFixed(1)},${y(v).toFixed(1)}`).join(" L")}"/><circle class="dot" style="fill:var(--vz-s1)" cx="${x(30)}" cy="${y(p[30])}" r="4"/></g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart: log10 of X(n) for four runs of the chain X(n+1) = X(n) times a uniform number, from X0 = 0.9. All four fall roughly linearly, ending between 10 to the ${num(Math.min(...XU.map(p => p[30])), 0)} and 10 to the ${num(Math.max(...XU.map(p => p[30])), 0)} after 30 steps, around the expected line with slope −0.434 per step.">

// Exact distribution of the simple symmetric random walk after n steps (slide 16), per unit length: P(Xₙ = k)/2 on the even k.
const LFAC = [0]; for (let i = 1; i <= 400; i++) LFAC.push(LFAC[i - 1] + Math.log(i));
const rwp = (n, k) => (Math.abs(k) > n || (n + k) % 2) ? 0 : Math.exp(LFAC[n] - LFAC[(n + k) / 2] - LFAC[(n - k) / 2] - n * Math.LN2);
const rwf = n => x => { const k0 = 2 * Math.floor(x / 2), t = (x - k0) / 2; return ((1 - t) * rwp(n, k0) + t * rwp(n, k0 + 2)) / 2; };
line("rwpmf", {
  xlin: true, step: 2, x: [-40, 40], y: [0, 0.13], xTicks: [-40, -20, 0, 20, 40], yTicks: [0, 0.04, 0.08, 0.12], yTitle: "probability per unit length",
  series: [{ slot: 1, name: "n = 10 steps", short: "n = 10", f: rwf(10), labelAt: -3, dy: -4 }, { slot: 2, name: "n = 50 steps", short: "n = 50", f: rwf(50), labelAt: -9, dy: -4 }, { slot: 3, name: "n = 200 steps", short: "n = 200", f: rwf(200), labelAt: -21, dy: -4 }],
  tipHead: v => `position ${v}`, fmtY: v => `${num(v * 2 * 100, 2)} % (P(Xₙ = k))`, focusAt: 0, labelW: 16,
  hitLabel: "Read the walk's position probabilities: arrow keys move two positions",
  aria: "Line chart: probability of each position of a symmetric ±1 random walk after 10, 50 and 200 steps. The peak at 0 drops from 24.6 % to 11.2 % to 5.6 % while the spread widens like the square root of n.",
});

// Explorer: walk a chain step by step; the next state is where u falls in the cumulative row (slide 8).
const MC = { k: "weather", x: 0, prev: null, u: null, hist: [], cnt: [], seed: 1, n: 0 };
let mcRng = mulberry(9001);
const mcReset = () => { const ch = CHAINS[MC.k]; MC.x = ch.start; MC.prev = null; MC.u = null; MC.hist = [ch.start]; MC.cnt = ch.S.map((_, i) => +(i === ch.start)); MC.n = 0; mcRng = mulberry(9001 + MC.seed * 31); };
const mcStep = k => { const ch = CHAINS[MC.k]; for (let i = 0; i < k; i++) { const u = mcRng(); MC.prev = MC.x; MC.u = u; MC.x = nextState(ch.P, MC.x, u); MC.cnt[MC.x]++; MC.n++; MC.hist.push(MC.x); } if (MC.hist.length > 200) MC.hist = MC.hist.slice(-200); };
function mcOut() {
  const ch = CHAINS[MC.k], row = MC.prev === null ? MC.x : MC.prev, P = ch.P[row], W = 560, H = 84, L = 8, R = 8, PW = W - L - R, y0 = 22, bh = 26;
  let c = 0; const segs = P.map((p, j) => { const a = c; c += p; return [a, c, j]; }).filter(([a, b]) => b > a);
  const sx = v => L + v * PW;
  const split = `<svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="Row ${ch.S[row]} of the transition matrix laid out on [0, 1)${MC.u === null ? "" : `; u = ${num(MC.u, 3)} falls into ${ch.S[MC.x]}`}.">
      ${segs.map(([a, b, j]) => `<rect class="seg" x="${(sx(a) + (a ? 1 : 0)).toFixed(1)}" y="${y0}" width="${Math.max(0, sx(b) - sx(a) - (a ? 1 : 0) - (b < 0.9999 ? 1 : 0)).toFixed(1)}" height="${bh}" rx="3" style="fill:var(--vz-s${j + 1});opacity:${MC.u !== null && j === MC.x ? 1 : 0.55}"/>${sx(b) - sx(a) > 64 ? `<text class="note" x="${((sx(a) + sx(b)) / 2).toFixed(1)}" y="${y0 + bh + 14}" text-anchor="middle">${ch.S[j]} ${num(b - a, 2)}</text>` : ""}`).join("")}
      ${segs.slice(1).map(([a]) => `<text class="tick" x="${sx(a)}" y="${y0 - 5}" text-anchor="middle">${num(a, 2)}</text>`).join("")}<text class="tick" x="${L}" y="${y0 - 5}">0</text><text class="tick" x="${W - R}" y="${y0 - 5}" text-anchor="end">1</text>
      ${MC.u === null ? "" : `<line class="read" x1="${sx(MC.u)}" x2="${sx(MC.u)}" y1="${y0 - 2}" y2="${y0 + bh + 2}" style="stroke:var(--ink);stroke-dasharray:none;stroke-width:2"/><text class="note" x="${Math.min(W - R - 40, Math.max(L + 40, sx(MC.u)))}" y="${y0 + bh + 34}" text-anchor="middle" style="font-weight:600">u = ${num(MC.u, 3)}</text>`}</svg>`;
  const strip = `<div class="strip" aria-label="Last ${Math.min(60, MC.hist.length)} states, oldest on the left">${MC.hist.slice(-60).map(s => `<i style="--c:var(--vz-s${s + 1})" title="${esc(ch.S[s])}"></i>`).join("")}</div>`;
  const tot = MC.n + 1;
  const tab = `<div class="tt-wrap"><table class="tt compact"><tr><th>state</th><th>visits</th><th>share</th>${ch.pi ? "<th>π</th>" : ""}</tr>${ch.S.map((s, i) => `<tr><th>${key(i + 1)} ${esc(s)}</th><td>${MC.cnt[i].toLocaleString("en-GB")}</td><td>${pct(MC.cnt[i] / tot)}</td>${ch.pi ? `<td>${pct(ch.pi[i])}</td>` : ""}</tr>`).join("")}</table></div>`;
  return `<p class="lab-note">${MC.u === null ? `The chain starts in <b>${esc(ch.S[MC.x])}</b>. The bar is that row of P laid out on [0, 1); press a button to draw u.` : `Step ${MC.n.toLocaleString("en-GB")}: from <b>${esc(ch.S[row])}</b>, u = ${num(MC.u, 3)} falls into <b>${esc(ch.S[MC.x])}</b>. The bar shows the row of P that was used.`}</p>${split}${strip}${tab}<p class="lab-note">${ch.note}</p>`;
}
function initMc(body) {
  body.innerHTML = `<div class="ctl"><label>Chain <select>${Object.entries(CHAINS).map(([k, c]) => `<option value="${k}"${k === MC.k ? " selected" : ""}>${c.name}</option>`).join("")}</select></label>
      <button class="preset" type="button" data-s="1">1 step</button><button class="preset" type="button" data-s="100">100 steps</button><button class="preset" type="button" data-s="10000">10,000 steps</button><button class="preset" type="button" data-s="0">Reset</button></div><div class="out" aria-live="polite"></div>`;
  const sel = body.querySelector("select"), out = body.querySelector(".out"), draw = () => { out.innerHTML = mcOut(); };
  sel.addEventListener("change", () => { MC.k = sel.value; mcReset(); draw(); });
  body.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => { const s = +b.dataset.s; if (s) mcStep(s); else { MC.seed++; mcReset(); } draw(); }));
  mcReset(); draw();
}

// Explorer: the n-step matrix P⁽ⁿ⁾ = Pⁿ as a tinted table, with one Chapman–Kolmogorov sum written out (slides 9–10, 13).
const PW3 = { k: "weather", n: 2 };
const mpow = (P, n) => { let M = P.map((r, i) => r.map((_, j) => +(i === j))); for (let i = 0; i < n; i++) M = matmul(M, P); return M; };
function powOut() {
  const ch = CHAINS[PW3.k], n = PW3.n, M = mpow(ch.P, n), Mp = mpow(ch.P, Math.max(0, n - 1)), S = ch.S;
  const cell = v => `<td style="background:color-mix(in srgb, var(--vz-s1) ${Math.round(v * 55)}%, transparent)">${num(v, 3)}</td>`;
  const table = `<div class="tt-wrap"><table class="tt compact mx"><tr><th>from \\ to</th>${S.map(s => `<th>${esc(s)}</th>`).join("")}<th>row sum</th></tr>${M.map((r, i) => `<tr><th>${esc(S[i])}</th>${r.map(cell).join("")}<td>${num(r.reduce((a, b) => a + b, 0), 3)}</td></tr>`).join("")}</table></div>`;
  const ck = n ? `${S.map((s, k) => `${num(Mp[0][k], 3)} · ${num(ch.P[k][0], 2)}`).join(" + ")} = <b>${num(M[0][0], 3)}</b>` : "P⁽⁰⁾ is the identity: in zero steps the chain stays where it is";
  const dist = ch.lim ? Math.max(...M.map((r, i) => Math.max(...r.map((v, j) => Math.abs(v - ch.lim[i][j]))))) : null;
  return `${table}<dl class="ro"><dt>One entry</dt><dd>${n ? `P⁽${n}⁾(${esc(S[0])} → ${esc(S[0])}) = Σ<sub>k</sub> P⁽${n - 1}⁾(${esc(S[0])} → k) · P(k → ${esc(S[0])}) = ${ck}` : ck}</dd>
      <dt>Long run</dt><dd>${dist === null ? `P⁽ⁿ⁾ is the ${n % 2 ? "swap" : "identity"} for ${n % 2 ? "odd" : "even"} n: it alternates forever ${flag("bad", "no limit")}` : `largest distance to the limit matrix: ${dist < 5e-4 ? "below 0.0005" : num(dist, 4)} ${flag(dist < 0.01 ? "ok" : "bad", dist < 0.01 ? "within 0.01 of the limit" : "not mixed yet")}`}</dd></dl>`;
}
function initPow(body) {
  body.innerHTML = `<div class="ctl"><label>Chain <select>${Object.entries(CHAINS).map(([k, c]) => `<option value="${k}"${k === PW3.k ? " selected" : ""}>${c.name}</option>`).join("")}</select></label>
      <label>Steps n <input type="range" min="0" max="30" step="1" value="${PW3.n}"> <output>${PW3.n}</output></label></div><div class="out"></div>`;
  const sel = body.querySelector("select"), r = body.querySelector("input"), o = body.querySelector("output"), out = body.querySelector(".out");
  const draw = () => { o.textContent = PW3.n; out.innerHTML = powOut(); };
  sel.addEventListener("change", () => { PW3.k = sel.value; draw(); }); r.addEventListener("input", () => { PW3.n = +r.value; draw(); }); draw();
}

// Explorer: simple random walks with step +1 (probability p) or −1, 200 steps, against the drift n(2p − 1) and a ±2 sd band (slides 15–16).
const RW = { p: 0.5, k: 10, seed: 1 };
function rwOut() {
  const { p, k } = RW, N = 200, r = mulberry(RW.seed * 7717 + 3), W = 560, H = 250, L = 36, R = 12, T = 12, B = 26, PW = W - L - R, PH = H - T - B;
  const sd = n => Math.sqrt(4 * p * (1 - p) * n), mu = n => n * (2 * p - 1), lim = Math.max(30, Math.ceil((Math.abs(mu(N)) + 2.6 * sd(N)) / 10) * 10);
  const x = n => L + n / N * PW, y = v => T + PH / 2 - Math.max(-lim, Math.min(lim, v)) / lim * PH / 2;
  const walks = Array.from({ length: k }, () => { let v = 0; const w = [0]; for (let n = 1; n <= N; n++) { v += r() < p ? 1 : -1; w.push(v); } return w; });
  const ends = walks.map(w => w[N]), m = ends.reduce((a, b) => a + b, 0) / k, s = Math.sqrt(ends.reduce((a, b) => a + (b - m) ** 2, 0) / Math.max(1, k - 1));
  const band = `M${Array.from({ length: 41 }, (_, i) => { const n = i * 5; return `${x(n).toFixed(1)},${y(mu(n) + 2 * sd(n)).toFixed(1)}`; }).join(" L")} L${Array.from({ length: 41 }, (_, i) => { const n = N - i * 5; return `${x(n).toFixed(1)},${y(mu(n) - 2 * sd(n)).toFixed(1)}`; }).join(" L")} Z`;
  const tk = [-lim, -lim / 2, 0, lim / 2, lim];
  return `<svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="${k} random walks of 200 steps with p = ${p}; the shaded band is the drift ± 2 standard deviations, ending at ${num(mu(N), 0)} ± ${num(2 * sd(N), 1)}.">
      <path class="band-rw" d="${band}"/>${tk.map(v => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
      ${axX([0, 50, 100, 150, 200], x, H)}<line class="ann" x1="${x(0)}" y1="${y(0)}" x2="${x(N)}" y2="${y(mu(N))}" stroke-dasharray="5 4"/>
      ${walks.map(w => `<path class="line thin-w" d="M${w.map((v, n) => `${x(n).toFixed(1)},${y(v).toFixed(1)}`).join(" L")}"/>`).join("")}<text class="note" x="${W - R}" y="${T + 10}" text-anchor="end">band: drift ± 2√(4p(1 − p)n)</text></svg>
    <dl class="ro"><dt>After 200 steps</dt><dd>mean of the ${k} end points ${num(m, 1)} (theory n(2p − 1) = ${num(mu(N), 0)}); spread ${num(s, 1)} (theory √(4p(1 − p)n) = ${num(sd(N), 1)})</dd>
      <dt>Reading</dt><dd>${p === 0.5 ? "Symmetric: no drift, and the band widens like √n, so the walk spreads without settling: no stationary distribution on the infinite line." : `Biased: the drift ${num(2 * p - 1, 2)} per step grows like n while the spread grows like √n, so the walk drifts off for good (slide 12's remark on p ≠ 1/2).`}</dd></dl>`;
}

      <label>Walkers <select>${[5, 10, 30].map(v => `<option${v === RW.k ? " selected" : ""}>${v}</option>`).join("")}</select></label><button class="preset" type="button">New walks</button></div><div class="out"></div>`;
