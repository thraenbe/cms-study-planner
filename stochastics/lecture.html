function lecture1() {
  const chainHTML = `<div class="defchain">${[["Population", "a collection of objects", "80–90 million people in Germany"], ["Sample", "a subset of the population", "100,000 of them"], ["Experiment", "measuring something about the sample", "their average height"], ["Event", "a concrete outcome", "height = 1.8 m, or > 1.6 m"], ["Sample space Ω", "all possible events", "{0, 1} or a continuous range"], ["Probability P(A)", "the likelihood of an event A in Ω", "P(height > 1.6 m)"]].map(([t, d, e]) => `<div class="dc"><b>${t}</b><span>${d}</span><em>${e}</em></div>`).join("")}</div>`;
  const H = {
    p1: "Part 1 · A stochastic model predicts probabilities", p2: "Part 2 · The chain of definitions", p3: "Part 3 · Kolmogorov's axioms and the rules that follow",
    p4: "Part 4 · Combinatorics and the probability space", p5: "Part 5 · Conditional probability and independence", p6: "Part 6 · Bayes' theorem",
    p7: "Part 7 · Total probability, the chain rule, and the birthday problem", p8: "Part 8 · Random variables", snow: "Numerical practice: John Snow's grand experiment",
  };
  return `${head(l)}
    <p class="lead">Everything in this course is built from probabilities, so the first real lecture rebuilds the foundations in eight parts: what a stochastic model promises, the chain of definitions from population to probability, the three Kolmogorov axioms and the Boolean and counting rules that follow, conditional probability as a renormalisation, Bayes' theorem, the law of total probability and the chain rule (which settle the birthday problem), and finally random variables, the language of the rest of the course. The deck is "SMS1" in OPAL (Lecture2026), a summary of the lecture in 18 pages; the OPAL page for this lecture maps it to sections 1.1 to 1.3 of the lecture notes, with 1.4 and 1.5 for self-study. Every section below starts with what the idea is for, then the formula with each symbol named, then numbers.</p>
    ${before([
      `${lecLink(0, "Lecture 0")} (course introduction): what "stochastic" means (random, described by probabilities) and why simulations need probabilities. Its ${inL(0, "Warm-up: the birthday problem", "birthday problem")} is solved properly in Part 7 here.`,
      `School maths: fractions and percentages (3/6 = 0.5 = 50 %), sets written with braces ({1, 2, 3} is the set of the numbers 1, 2 and 3), and the sum sign Σ (capital sigma, read "sum of": Σ<sub>i=1</sub><sup>3</sup> i = 1 + 2 + 3 = 6).`,
      `For one example: the natural logarithm ln and the exponential e<sup>x</sup>, which undo each other (ln e<sup>x</sup> = x), and ln(a · b) = ln a + ln b, which turns a product into a sum.`,
      `Nothing else: this lecture is the starting point, and every term is explained where it first appears and in the glossary below.`,
    ])}
    ${terms([
      ["Additivity (axiom 3)", "For events that cannot happen together, the probability that one or the other happens is the sum of their probabilities.", H.p3],
      ["Bayes' theorem", "P(A | B) = P(B | A) P(A) / P(B): turns the probability of B given A into the probability of A given B.", H.p6],
      ["Binary (indicator) random variable", "A variable that is 1 if an event happens and 0 if not; written 1<sub>A</sub>.", H.p8],
      ["Chain rule (probability expansion)", "The probability that several events all happen is a product of conditional probabilities, each given all earlier events.", H.p7],
      ["Combination C(n, r)", "Read \"n choose r\": the number of different groups of r objects out of n, order ignored. C(n, r) = n! / (r! (n − r)!).", H.p4],
      ["Complement Ā", "Read \"not A\": the event that A does not happen. P(Ā) = 1 − P(A).", H.p3],
      ["Conditional probability P(A | B)", "Read \"probability of A given B\": the probability of A once you know B happened, P(A ∩ B) / P(B).", H.p5],
      ["Continuous random variable", "A random variable that can take any value in an interval of the real numbers (a height, a time). Single values have probability 0; intervals have positive probability.", H.p8],
      ["Countable", "A set whose elements can be numbered 1, 2, 3, … (finite, or infinite like the whole numbers). The real numbers in an interval are not countable.", H.p8],
      ["Dempster–Shafer theory", "An alternative to classical probability that drops the normalisation axiom; mentioned on the slides, not used in the course.", H.p3],
      ["Discrete random variable", "A random variable with values in a countable set, such as the number of heads in five tosses.", H.p8],
      ["Disjoint (mutually exclusive) events", "Events that cannot happen together: A ∩ B is empty.", H.p3],
      ["Event", "A concrete outcome or set of outcomes of an experiment, such as \"the die shows an even number\".", H.p2],
      ["Expected value E[X]", "The probability-weighted average of a random variable: E[X] = Σ x P(X = x).", H.p8],
      ["Experiment", "Measuring or observing something about a sample (rolling a die, measuring heights).", H.p2],
      ["Factorial n!", "Read \"n factorial\": n · (n − 1) · … · 2 · 1, the number of orderings of n distinct objects. 0! = 1 by convention.", H.p4],
      ["Independent events", "Knowing one tells you nothing about the other: P(A | B) = P(A), equivalently P(A ∩ B) = P(A) P(B).", H.p5],
      ["Intersection A ∩ B", "Read \"A and B\": the event that both A and B happen.", H.p3],
      ["Joint probability", "The probability that two (or more) events happen together, P(A ∩ B).", H.p5],
      ["Kolmogorov axioms", "The three basic rules all probabilities obey: never negative, P(Ω) = 1, and additivity for disjoint events.", H.p3],
      ["Law of total probability", "P(A) = Σ P(A | B<sub>i</sub>) P(B<sub>i</sub>) over cases B<sub>i</sub> that do not overlap and cover everything.", H.p7],
      ["Likelihood, prior, posterior", "In Bayes' theorem with A = model and B = data: P(data | model) is the likelihood, P(model) the prior (belief before the data), P(model | data) the posterior (belief after).", H.p6],
      ["Permutation P(n, r)", "The number of ordered arrangements of r out of n distinct objects: n! / (n − r)!.", H.p4],
      ["Population", "The whole collection of objects you are interested in.", H.p2],
      ["Prevalence, sensitivity, specificity", "For a medical test: the share of people who are ill; the share of ill people the test flags; the share of healthy people it correctly clears.", H.p6],
      ["Probability measure P", "The rule that assigns a probability P(A) to every event A.", H.p4],
      ["Probability space", "A sample space Ω together with a probability measure P; the complete description of a random experiment.", H.p4],
      ["Random variable", "A number attached to the outcome of a random experiment, written with a capital letter such as X.", H.p8],
      ["Sample", "The subset of the population that is actually examined.", H.p2],
      ["Sample space Ω", "Ω, read omega: the set of all possible outcomes of an experiment.", H.p2],
      ["σ-algebra", "σ read sigma: a collection of events closed under union, intersection and complement. Some books include it in the probability space; not used in this course.", H.p4],
      ["Stochastic simulation", "An algorithm that draws one possible random history (trajectory) of a system so that its values follow the model's probabilities.", H.p1],
      ["Trajectory", "One possible sequence of states x₀, x₁, x₂, … of a system over time.", H.p1],
      ["Union A ∪ B", "Read \"A or B\": the event that at least one of A and B happens (inclusive or).", H.p3],
    ])}

    <h2>${H.p1} (slides 3–4)</h2>
    ${plain("A stochastic model does not say what will happen; it says how likely each possible outcome is. A simulation then plays out one possible history that is consistent with those probabilities. Keeping these two apart (probabilities versus one history) is the starting point of the course.")}
    <p>The object of study is the probability that the system is in state x at time t, given that it was in state x₀ at the earlier time t₀. That probability is fed into a <dfn>stochastic simulation</dfn> algorithm, which produces one possible <dfn>trajectory</dfn> x₀, x₁, x₂, … (the sequence of states the system passes through). A trajectory is not a prediction; the simulation is correct only if its values follow the model's probabilities at every step. The slide's everyday version is a weather forecast: "60 % chance of rain tomorrow" is neither yes nor no; if tomorrow could be repeated many times, it would rain in 60 % of them.</p>
    ${ex("Worked example (added here): probabilities versus one trajectory", `<p>Model: each day it rains with probability 0.6, independently. Over the next 5 days the model says: expected number of rainy days 5 · 0.6 = 3, probability of no rain at all 0.4⁵ = 0.01. One simulation might give rain, dry, rain, rain, rain (4 rainy days). That is one trajectory, not the forecast; 1,000 simulated trajectories would show about 3 rainy days on average and about 10 completely dry weeks.</p>`)}
    <p>The four hurdles of ${lecLink(0, "lecture 0")} are restated: the probability is often known only as the solution of a governing equation (studied as master equations, equations for how the probabilities change over time); sampling from it is hard (sampling theory, ${lecLink(2, "lecture 2")}); time may be continuous, so there is no list of states but a function x(t) (stochastic calculus and stochastic differential equations, SDEs, differential equations with a random term); and the right distribution may depend on the whole path so far (non-Markovian processes; the Markov property is ${inL(3, "From i.i.d. steps to the Markov property", "defined in lecture 3")}).</p>
    ${oops("Reading one simulated trajectory as the forecast. A single run is one possible history; only the distribution over many runs is what the model predicts.")}

    <h2>${H.p2} (slide 5)</h2>
    ${plain("Before you can talk about a probability you need to say what you are measuring, on what, and what the possible results are. The slide lines up the words for this as a chain, each one needing the one before.")}
    <p>The chain: a <dfn>population</dfn> (all objects you care about), a <dfn>sample</dfn> (the part you actually examine), an <dfn>experiment</dfn> (measuring something about the sample), an <dfn>event</dfn> (a concrete outcome of the experiment), the <dfn>sample space</dfn> Ω (Ω is the Greek capital omega: the set of all possible outcomes), and finally the probability P(A) of an event A in Ω. No probability without an event, no event without an experiment, no experiment without a sample, no sample without a population.</p>
    ${chainHTML}
    ${ex("Worked example (added here): the chain for a light-bulb test", `<p>Population: the 10,000 bulbs a factory made today. Sample: 200 of them, picked at random. Experiment: run each bulb until it fails and record its lifetime. Sample space: all possible lifetimes, the interval [0, ∞) hours. Event A: "the bulb lasts more than 1,000 hours". If 170 of the 200 sampled bulbs last that long, the estimate is P(A) ≈ 170/200 = <b>0.85</b>.</p>`)}
    ${oops("Mixing up \"sample\" and \"sample space\". The sample is the set of objects examined (200 bulbs); the sample space is the set of possible outcomes of one measurement (all lifetimes).")}

    <h2>${H.p3} (slides 6–7)</h2>
    ${plain("All of probability rests on three simple rules, the Kolmogorov axioms. Everything else you calculate, \"and\", \"or\", \"not\", follows from them. This section states the axioms and the everyday rules derived from them.")}
    <p>Notation first: A ∪ B (read "A union B", or "A or B") is the event that at least one of A and B happens; A ∩ B (read "A intersect B", or "A and B") that both happen; Ā (read "not A") that A does not happen. Two events are <dfn>disjoint</dfn> if they cannot happen together.</p>
    <ul class="cmp three">
      <li><b>Axiom 1 · non-negativity</b><span class="v">P(A) ≥ 0: probabilities are never negative. Undisputed.</span></li>
      <li><b>Axiom 2 · normalisation</b><span class="v">P(Ω) = 1: some outcome in the sample space always happens.</span></li>
      <li><b>Axiom 3 · additivity</b><span class="v">P(A ∪ B) = P(A) + P(B) when A and B are disjoint.</span></li>
    </ul>
    <p>These are the <dfn>Kolmogorov axioms</dfn>. Axiom 2 is the one that can be questioned: <dfn>Dempster–Shafer theory</dfn> (evidence theory) drops it and allows that no event happens, or that neither A nor B does. From the three axioms follow the Boolean rules (named after the logic of and, or, not):</p>
    <div class="formula"><div class="fl">${fx(String.raw`P(A \cap B) = P(A)\,P(B)`, "P(A ∩ B) = P(A) P(B)")}<span class="fn">AND, only for independent A and B (Part 5)</span></div><div class="fl">${fx(String.raw`P(A \cup B) = P(A) + P(B) - P(A \cap B)`, "P(A ∪ B) = P(A) + P(B) − P(A ∩ B)")}<span class="fn">OR: A or B or both; the overlap was counted twice, so subtract it once</span></div><div class="fl">${fx(String.raw`P(\bar A) = 1 - P(A)`, "P(Ā) = 1 − P(A)")}<span class="fn">NOT: A and Ā together make up Ω, so their probabilities add to 1</span></div><div class="fl">${fx(String.raw`P(A) = \frac{|A|}{|\Omega|}`, "P(A) = |A| / |Ω|")}<span class="fn">counting estimate, if all outcomes are equally likely; |A| is the number of outcomes in A</span></div></div>
    ${chart("venn")}${cap("Two events on a fair die, drawn here: A = even (2, 4, 6) and B = at least 4 (4, 5, 6). The overlap holds 4 and 6; 1 and 3 lie outside both. Hover or tab through the regions to read their faces and probabilities. The OR rule counts \"A or B or both\". The deck notes that the board called this rule \"XOR\"; as written it is the inclusive OR. For \"exactly one of the two\" subtract the overlap twice: P(A) + P(B) − 2 P(A ∩ B) = 2/6.")}
    ${ex("Worked example (added here, with the diagram's events)", `<p>Counting on a fair die: P(A) = 3/6, P(B) = 3/6, P(A ∩ B) = |{4, 6}|/6 = 2/6. OR: P(A ∪ B) = 3/6 + 3/6 − 2/6 = <b>4/6</b>; check by counting: A ∪ B = {2, 4, 5, 6}, 4 faces. NOT: P(odd) = 1 − 3/6 = 3/6. AND: for these events the product rule would give 3/6 · 3/6 = 1/4, but the true P(A ∩ B) is 2/6 = 1/3, so A and B are <i>not</i> independent (knowing the roll is at least 4 makes "even" more likely: two of the three faces). For two separate dice, "first die shows 6" and "second die shows 6" are independent: P(both) = 1/6 · 1/6 = 1/36.</p>`)}
    ${oops("Adding probabilities of overlapping events. P(even) + P(at least 4) = 3/6 + 3/6 = 1 would claim the event is certain, yet a roll of 1 or 3 is neither; the overlap must be subtracted.")}
    ${tryit([
      ["Toss two fair coins. What is P(at least one head)? Use the NOT rule.", `<p>The opposite of "at least one head" is "no head", that is, tails twice: 1/2 · 1/2 = 1/4. So P(at least one head) = 1 − 1/4 = <b>3/4</b>.</p>`],
      ["On a fair die let A = {1, 2} and B = {2, 3, 4}. Compute P(A ∪ B) with the OR rule and check by counting.", `<p>P(A) = 2/6, P(B) = 3/6, P(A ∩ B) = P({2}) = 1/6. OR rule: 2/6 + 3/6 − 1/6 = <b>4/6</b>. Counting: A ∪ B = {1, 2, 3, 4}, four faces.</p>`],
      ["P(A) = 0.5, P(B) = 0.4 and P(A ∪ B) = 0.7. Find P(A ∩ B). Are A and B independent?", `<p>From the OR rule: P(A ∩ B) = 0.5 + 0.4 − 0.7 = <b>0.2</b>. Since P(A) P(B) = 0.5 · 0.4 = 0.2 as well, they are <b>independent</b>.</p>`],
    ])}

    <h2>${H.p4} (slides 8–9)</h2>
    ${plain("When all outcomes are equally likely, a probability is \"favourable outcomes divided by all outcomes\", so you need to count. Permutations count arrangements where order matters, combinations count groups where it does not. The probability space then packages outcomes and probabilities into one object.")}
    <p>The <dfn>factorial</dfn> n! (read "n factorial") is n · (n − 1) · … · 2 · 1, the number of ways to put n distinct objects in order; 3! = 6, 5! = 120, and 0! = 1 by convention. <dfn>Permutations</dfn> count orderings: P(n, r) = n! / (n − r)! distinct arrangements of r out of n distinct elements. <dfn>Combinations</dfn> count groups: C(n, r) = n! / (r! (n − r)!), read "n choose r", where the r! orderings of one group are counted once. Coin-toss sequences reuse heads and tails, so neither formula counts them; with repetition allowed there are n<sup>r</sup> sequences, 2⁵ = 32 for five tosses. Every sequence with 3 heads and 2 tails is one group of the 5 positions (the positions of the heads), so there are C(5, 3) = 10 of them.</p>
    ${ex("Worked example (added here): podium versus team", `<p>Five runners. Gold, silver and bronze can be awarded in P(5, 3) = 5 · 4 · 3 = 5!/2! = <b>60</b> ways: 5 choices for gold, then 4 for silver, then 3 for bronze. A team of three, without ranks, can be picked in C(5, 3) = 60 / 3! = 60 / 6 = <b>10</b> ways, because each team appears in 3! = 6 different podium orders. A 4-digit PIN from 10 digits, repetition allowed: 10⁴ = 10,000.</p>`)}
    ${chart("comb")}${cap("C(5, r) for r = 0 … 5, computed here: the number of five-toss sequences with r heads (the bar labels). Hover a bar for the probability r heads has. What to look for: the counts 1, 5, 10, 10, 5, 1 are symmetric (choosing the heads is the same as choosing the tails) and sum to 32 = 2⁵, every sequence counted once.")}
    ${lab("count", "permutations, combinations and sequences for your own n and r", "Drag <b>n</b> (how many distinct objects) and <b>r</b> (how many are chosen). The three read-outs count ordered arrangements, unordered groups and sequences with repetition. What to look for: permutations are always r! times the combinations, and sequences with repetition grow fastest.")}
    ${ex("Worked example (slide 8): exactly three heads in five tosses", "<p>There are 2⁵ = 32 equally likely sequences. Those with exactly three heads are the C(5, 3) = 5! / (3! 2!) = 120 / (6 · 2) = 10 ways to choose which three of the five positions are heads. So P(3 heads) = 10/32 = <b>31.25 %</b>. Counting with the permutation P(5, 3) = 60 instead would be wrong: it counts each choice of three head positions 3! = 6 times, once per order in which the positions could be listed, but all six orders describe the same sequence.</p>")}
    <p>A <dfn>probability space</dfn> pairs a sample space Ω with a <dfn>probability measure</dfn> P, the rule that gives the probability of any event. A fair die is Ω = {1, …, 6} with the uniform measure 1/6 each; a loaded die has the same Ω but a different P, so it is a different probability space. The deck's aside: some books add a <dfn>σ-algebra</dfn> (σ is the Greek letter sigma), a collection of events closed under union, intersection and complement, and write (Ω, P, Σ). It matters in financial and insurance mathematics and for non-Markovian processes, and is not used in this course.</p>
    ${ex("Worked example (added here): a loaded die", `<p>Same Ω = {1, …, 6}, but P(6) = 0.5 and P(k) = 0.1 for k = 1, …, 5. Check the axioms: all values ≥ 0 and 5 · 0.1 + 0.5 = 1. Then P(even) = P(2) + P(4) + P(6) = 0.1 + 0.1 + 0.5 = <b>0.7</b>, not 0.5: the counting estimate |A|/|Ω| does not apply, because the outcomes are no longer equally likely.</p>`)}
    ${oops("Using a permutation where order does not matter. Ask: would swapping two chosen items give a different result? Podium places: yes, permutation. Lottery numbers or a team: no, combination.")}

    <h2>${H.p5} (slides 10–11)</h2>
    ${plain("New information changes probabilities. Conditional probability is the probability of A after you learn that B happened: you throw away every outcome where B did not happen and rescale what is left. Independence is the special case where learning B changes nothing.")}
    <p>The <dfn>conditional probability</dfn> P(A | B) is read "probability of A given B". Conditioning on B renormalises everything to B: once B is known, it becomes the whole space, and dividing by P(B) keeps the probabilities summing to one.</p>
    <div class="formula"><span class="fl">${fx(String.raw`P(A \mid B) = \frac{P(A \cap B)}{P(B)}`, "P(A | B) = P(A ∩ B) / P(B)")}<span class="fn">definition of conditional probability (needs P(B) &gt; 0)</span></span><span class="fl">${fx(String.raw`P(A \cap B) = P(A \mid B)\, P(B)`, "P(A ∩ B) = P(A | B) P(B)")}<span class="fn">the same rule times P(B): the product rule for the joint probability</span></span></div>
    <p>P(A ∩ B), the probability that both happen, is called the <dfn>joint probability</dfn>.</p>
    ${ex("Worked example (slide 10): a 52-card deck", `<p>A standard deck has 52 cards: 26 red, 26 black, 4 kings (2 red). P(ace of hearts | red) = P(ace of hearts and red) / P(red) = (1/52) / (1/2) = <b>1/26</b>, twice the unconditional 1/52, because knowing the card is red halves the candidates. P(king | red) = (2/52) / (1/2) = 2/26 = <b>1/13</b> = P(king): the condition changes nothing, because two of the four kings are red. The deck's weather version: a 60 % forecast, and you wake to cloudless skies, so P(rain | no clouds) is far lower.</p>`)}
    ${chart("cards", leg([[1, "no condition"], [2, "given the card is red"]]))}${cap("The two card examples of the slides, each as a pair of bars: the probability before (blue) and after (orange) learning that the card is red. What to look for: the ace of hearts doubles, the king stays at 1/13. Hover a pair for the fractions.")}
    ${ex("Worked example (added here): a die you cannot see", `<p>A friend rolls a die and says "it's even". P(six | even) = P(six and even) / P(even) = (1/6) / (3/6) = <b>1/3</b>: of the three remaining faces 2, 4, 6, one is a six. P(at least 5 | even) = P({6}) / P(even) = (1/6)/(3/6) = 1/3, while without the information it was 2/6 = 1/3 as well: "at least 5" and "even" happen to be independent.</p>`)}
    <p><b>Independence.</b> A and B are <dfn>independent</dfn> if knowing B tells you nothing about A: P(A | B) = P(A), equivalently P(A ∩ B) = P(A) P(B). "King" and "red" are independent. In the general, dependent case the joint probability is P(A ∩ B) = P(A | B) P(B): first B happens, then A must happen given B.</p>
    ${oops("Swapping the condition. P(A | B) and P(B | A) are different numbers: P(even | six) = 1, but P(six | even) = 1/3. Bayes' theorem in the next part is the rule for converting one into the other.")}

    <h2>${H.p6} (slide 12)</h2>
    ${plain("Bayes' theorem turns a conditional probability around: from \"how likely is this evidence if the hypothesis is true\" to \"how likely is the hypothesis given this evidence\". It is the rule behind medical tests, spam filters and fitting models to data.")}
    <p>Writing the joint probability both ways, P(A ∩ B) = P(A | B) P(B) = P(B | A) P(A), and dividing by P(B) gives <dfn>Bayes' theorem</dfn>:</p>
    <div class="formula">${fx(String.raw`P(A \mid B) = \frac{P(B \mid A)\, P(A)}{P(B)}`, "P(A | B) = P(B | A) P(A) / P(B)")}</div>
    <p>No independence is assumed, so it always holds. Why it matters: in image segmentation, machine learning and inference you want P(model | data), but what you can compute is P(data | model), by running the model many times and counting. Bayes converts one into the other. With A = model and B = data, P(data | model) is the <dfn>likelihood</dfn>, P(model) the <dfn>prior</dfn> (what you believed before seeing the data), P(model | data) the <dfn>posterior</dfn> (what you believe after), and P(data) the normalisation. The deck notes the two schools: frequentists treat the likelihood as the probability of interest; Bayesians work with the posterior, which needs a prior.</p>
    ${ex("Worked example (the numbers of tutorial 1): a positive test", "<p>Three test words: <dfn>prevalence</dfn> is the share of people who are ill (here 5 %), <dfn>sensitivity</dfn> the share of ill people the test flags (90 %), specificity the share of healthy people it clears (90 %, so it wrongly flags 10 %). Of 1000 people, 50 are ill and 45 of them test positive; 950 are healthy and 95 of them test positive. Total probability (Part 7): P(positive) = 0.9 · 0.05 + 0.1 · 0.95 = 0.045 + 0.095 = 0.14. Bayes: P(ill | positive) = 0.9 · 0.05 / 0.14 = <b>0.321</b>. A positive result from a 90 %-accurate test means a one-in-three chance of being ill, because the healthy majority produces more false positives (95) than the sick minority produces true ones (45).</p>")}
    ${lab("bayes", "Bayes' theorem on a screening test, in people per thousand", "Drag the three sliders. The table splits 1000 people into ill or healthy and test-positive or negative; the read-outs apply total probability and Bayes. What to look for: lower the prevalence to 1 % and P(ill | positive) drops below 10 % even with a good test; raise the specificity to 99 % and it climbs again, because false positives become rare.")}
    ${oops("Ignoring the prior (base rate). \"The test is 90 % accurate, so I'm 90 % likely to be ill\" confuses P(positive | ill) with P(ill | positive); with a rare disease the second is much smaller.")}
    ${tryit([
      ["Roll two dice. What is P(sum = 8 | first die shows 3)? Compare with P(sum = 8) without the condition.", `<p>Given a 3, the sum is 8 only if the second die shows 5: probability <b>1/6</b>. Without the condition: the pairs (2,6), (3,5), (4,4), (5,3), (6,2) give 8, so 5/36 ≈ 0.139. The information raised it slightly.</p>`],
      ["A bag holds a fair coin and a coin with heads on both sides. You pick one at random, toss it, and see heads. What is the probability you picked the two-headed coin?", `<p>P(heads) = ½ · ½ + ½ · 1 = 0.75 (total probability). Bayes: P(two-headed | heads) = 1 · ½ / 0.75 = <b>2/3</b>.</p>`],
      ["The screening test above (sensitivity 90 %, 10 % false positives) is used where only 1 % are ill. What is P(ill | positive)?", `<p>P(positive) = 0.9 · 0.01 + 0.1 · 0.99 = 0.009 + 0.099 = 0.108. P(ill | positive) = 0.009 / 0.108 ≈ <b>0.083</b>, about 1 in 12.</p>`],
    ])}

    <h2>${H.p7} (slides 13–14)</h2>
    ${plain("Two tools for building complicated probabilities from simple pieces. The law of total probability splits a question into separate cases and adds them up; the chain rule builds the probability that several things all happen, one step at a time. Together they solve the birthday problem.")}
    <p>The <dfn>law of total probability</dfn> sums over all the ways A can happen:</p>
    <div class="formula">${fx(String.raw`P(A) = \sum_i P(A \mid B_i)\, P(B_i)`, "P(A) = Σ<sub>i</sub> P(A | B<sub>i</sub>) P(B<sub>i</sub>)")}</div>
    <p>where the cases B₁, …, B<sub>n</sub> must not overlap and must together cover every possibility. Example from the slides: P(rain) = P(rain | clouds) P(clouds) + P(rain | no clouds) P(no clouds).</p>
    ${ex("Worked example (added here): rain from two cases", `<p>Say P(clouds) = 0.4, P(rain | clouds) = 0.6 and P(rain | no clouds) = 0.05. Then P(rain) = 0.6 · 0.4 + 0.05 · 0.6 = 0.24 + 0.03 = <b>0.27</b>. The two cases "clouds" and "no clouds" do not overlap and cover everything, as required.</p>`)}
    <p>The probability expansion, or <dfn>chain rule</dfn>, builds a composite event one step at a time, each factor the probability of the next event given all the earlier ones:</p>
    <div class="formula"><span class="fl">${fx(String.raw`\begin{aligned} &P(A_1 \cap A_2 \cap \dots \cap A_n) \\ &\quad = P(A_1)\; P(A_2 \mid A_1)\; P(A_3 \mid A_1 \cap A_2) \\ &\qquad \cdots\; P(A_n \mid A_1 \cap \dots \cap A_{n-1}) \end{aligned}`, "P(A₁ ∩ A₂ ∩ … ∩ A<sub>n</sub>) = P(A₁) P(A₂ | A₁) P(A₃ | A₁ ∩ A₂) ⋯ P(A<sub>n</sub> | A₁ ∩ … ∩ A<sub>n−1</sub>)")}<span class="fn">chain rule (probability expansion)</span></span><span class="fl">${fx(String.raw`P\Big(\bigcap_{i=1}^{n} A_i\Big) = \prod_{i=1}^{n} P\big(A_i \mid A_1 \cap \dots \cap A_{i-1}\big)`, "P(∩ A<sub>i</sub>) = ∏ P(A<sub>i</sub> | A₁ ∩ … ∩ A<sub>i−1</sub>)")}<span class="fn">the same in product notation (∏, capital pi, multiplies the factors as Σ adds them); for i = 1 there is no condition, so the factor is P(A₁)</span></span></div>
    <p><b>How to read it.</b> ${fx(String.raw`A_1, A_2, \dots, A_n`, "A₁, A₂, …, A<sub>n</sub>")} are n events, numbered in the order you think of them happening, and the left side is the probability that <em>all</em> of them happen. The right side builds that up one event at a time: the probability that the first happens, times the probability that the second happens given that the first did, times the probability that the third happens given that the first two did, and so on up to the last event, given all n − 1 before it. The condition ${fx(String.raw`A_1 \cap \dots \cap A_{n-1}`, "A₁ ∩ … ∩ A<sub>n−1</sub>")} in the last factor just means "all the earlier events happened". So every factor is a conditional probability, and the condition grows by one event per step.</p>
    ${why("Context, not on the slides: it is the product rule used again and again", `<p>Take three events and treat ${fx(String.raw`A_1 \cap A_2`, "A₁ ∩ A₂")} as a single event B. The product rule ${fx(String.raw`{P(A \cap B)} = {P(A \mid B)\, P(B)}`, "P(A ∩ B) = P(A | B) P(B)")} gives ${fx(String.raw`{P(A_1 \cap A_2 \cap A_3)} = {P(A_3 \mid A_1 \cap A_2)\, P(A_1 \cap A_2)}`, "P(A₁ ∩ A₂ ∩ A₃) = P(A₃ | A₁ ∩ A₂) P(A₁ ∩ A₂)")}, and the product rule once more on the last factor gives <span class="nobr">${fx(String.raw`{P(A_1 \cap A_2)} = {P(A_2 \mid A_1)\, P(A_1)}`, "P(A₁ ∩ A₂) = P(A₂ | A₁) P(A₁)")}.</span> Together: <span class="nobr">${fx(String.raw`{P(A_1)\, P(A_2 \mid A_1)\, P(A_3 \mid A_1 \cap A_2)}`, "P(A₁) P(A₂ | A₁) P(A₃ | A₁ ∩ A₂)")}.</span> For n events you peel off the last event n − 1 times. If the events are independent, every condition can be dropped and the chain rule shrinks to <span class="nobr">${fx(String.raw`{P(A_1)\, P(A_2) \cdots P(A_n)}`, "P(A₁) P(A₂) ⋯ P(A<sub>n</sub>)")}.</span></p>`)}
    ${ex("Worked example (added here): three aces in a row", `<p>Draw three cards from a shuffled 52-card deck without putting them back, and let ${fx(String.raw`A_i`, "A<sub>i</sub>")} be "card i is an ace". The chain rule takes the draws in order:</p>
      <div class="tt-wrap"><table class="tt compact"><tr><th>Draw</th><th>Factor</th><th>Why</th><th>Product so far</th></tr>
        <tr><td>1</td><td>${fx(String.raw`P(A_1) = \dfrac{4}{52}`, "P(A₁) = 4/52")}</td><td>4 aces among 52 cards</td><td>0.0769</td></tr>
        <tr><td>2</td><td>${fx(String.raw`P(A_2 \mid A_1) = \dfrac{3}{51}`, "P(A₂ | A₁) = 3/51")}</td><td>one ace is gone: 3 aces among 51 cards</td><td>0.00452</td></tr>
        <tr><td>3</td><td>${fx(String.raw`P(A_3 \mid A_1 \cap A_2) = \dfrac{2}{50}`, "P(A₃ | A₁ ∩ A₂) = 2/50")}</td><td>two aces are gone: 2 aces among 50 cards</td><td>0.000181</td></tr></table></div>
      <p>So P(three aces) = 4/52 · 3/51 · 2/50 = 24/132,600 = <b>1/5525 ≈ 0.018 %</b>. With replacement the draws would be independent and the answer (4/52)³ = 1/2197 ≈ 0.046 %, two and a half times larger: the conditions matter because every ace drawn leaves fewer aces in a smaller deck.</p>`)}
    <p>This is what solves the birthday problem (n people, 365 equally likely birthdays, ignoring leap years: how likely is it that two share a birthday?). Let A<sub>i</sub> be the event that person i + 1's birthday differs from everyone before. Given all earlier events, the first i people occupy i different days, so P(A<sub>i</sub> | earlier) = (365 − i) / 365. The chain rule multiplies these, and P(shared) = 1 − P(all different) by the NOT rule.</p>
    ${chart("chain", leg([[2, "factor for person n"], [1, "product so far"]]))}${cap("Orange: the factor (366 − n)/365, the chance that person n avoids all earlier birthdays. Blue: the product of all factors so far, the chance that all n birthdays differ. Computed here from the formula on slide 14. What to look for: every factor stays close to 1, yet the product drops below the dashed one-half line at n = 23 (0.493). Hover, or focus and use the arrow keys, to read single room sizes.")}
    ${ex("Worked example: 23 people", "<p>P(all 23 different) = (365/365) · (364/365) · (363/365) ⋯ (343/365). Taking logarithms to multiply 23 factors sanely: Σ ln((365 − i)/365) for i = 0 … 22 ≈ −0.708, so the product is e<sup>−0.708</sup> ≈ 0.493 and P(shared) = 1 − 0.493 = <b>0.507</b>. For n = 22 the product is 0.524, so 23 is the first room size at which a shared birthday is more likely than not. The approximation (365 − i)/365 ≈ e<sup>−i/365</sup> turns the product into e<sup>−n(n−1)/730</sup>, which gives 0.500 at n = 23: the context box in lecture 0.</p>")}
    ${oops("Cases that overlap or leave gaps in the law of total probability. \"Clouds\" and \"rain\" are not valid cases for P(wind), for example, because they overlap; the cases must split all possibilities into separate pieces.")}

    <h2>${H.p8} (slide 15)</h2>
    ${plain("A random variable turns the outcome of an experiment into a number, so you can calculate with it: average it, add it up, plot its distribution. From the next lecture on, the course talks almost only in random variables.")}
    <p>A <dfn>random variable</dfn> (written with a capital letter, X) is a number attached to the outcome of a random experiment. Three types:</p>
    <ul class="cmp three">
      <li><b>Binary</b><span class="v">A <dfn>binary</dfn> or indicator variable takes the values 0 and 1. It turns any event, even one described in words, into a number: 1<sub>A</sub> = 1 if A happens, else 0.</span><span class="muted">"It rains tomorrow": 1 or 0.</span></li>
      <li><b>Discrete</b><span class="v">A <dfn>discrete</dfn> variable takes values in a <dfn>countable</dfn> set S (one whose elements can be numbered 1, 2, 3, …, finite or infinite). P(X = x) for a single value is a sensible question.</span><span class="muted">The number of heads in 5 tosses: S = {0, …, 5}.</span></li>
      <li><b>Continuous</b><span class="v">A <dfn>continuous</dfn> variable takes values in an interval of the real numbers. Single points have probability 0; one asks about intervals instead.</span><span class="muted">A height, a waiting time.</span></li>
    </ul>
    <p>Because indicators work for any event, the rest of the course talks only about random variables: sampling them, generating them, and their distributions.</p>
    ${ex("Worked example (added here): the three types in one experiment", `<p>Toss a coin five times. X = number of heads is discrete with P(X = r) = C(5, r)/32 from Part 4: 1/32, 5/32, 10/32, 10/32, 5/32, 1/32 for r = 0 … 5. The indicator of "at least four heads" is binary: 1 with probability (5 + 1)/32 = 6/32. The time until the last toss lands, measured with a stopwatch, is continuous: P(exactly 2.000… s) = 0, but P(between 2 and 3 s) can be anything between 0 and 1.</p>`)}
    ${why("Context, not on the slides: the indicator trick", "<p>The <dfn>expected value</dfn> E[X] of a random variable is its probability-weighted average, Σ x P(X = x). For an indicator, E[1<sub>A</sub>] = 1 · P(A) + 0 · P(Ā) = P(A). Every statement about probabilities of events is therefore a statement about expected values of random variables, which is why the law of large numbers (an average of indicators converging to a probability) is the engine behind Monte Carlo: counting the points inside the quarter circle in lecture 0 was averaging an indicator.</p>")}
    ${oops("Asking for P(X = x) of a continuous variable and expecting a positive number. For a height, P(X = 1.8 m exactly) = 0; P(1.75 m ≤ X ≤ 1.85 m) is the meaningful question.")}
    ${tryit([
      ["Machine A makes 60 % of a factory's parts, 2 % of them defective; machine B makes the other 40 %, 5 % defective. What is P(defective)? Given a defective part, what is the probability that A made it?", `<p>Total probability: 0.02 · 0.6 + 0.05 · 0.4 = 0.012 + 0.020 = <b>0.032</b>. Bayes: P(A | defective) = 0.012 / 0.032 = <b>0.375</b>.</p>`],
      ["Three people: what is the probability that all have different birthdays? That at least two share one?", `<p>Chain rule: 365/365 · 364/365 · 363/365 = 0.9918. NOT rule: P(shared) = 1 − 0.9918 = <b>0.0082</b>.</p>`],
      ["Binary, discrete or continuous? (a) The number of e-mails you get tomorrow. (b) The time until the next e-mail. (c) Whether the next e-mail is spam.", `<p>(a) <b>Discrete</b> (0, 1, 2, …: countable). (b) <b>Continuous</b> (any positive time). (c) <b>Binary</b> (1 = spam, 0 = not).</p>`],
    ])}

    <h2>Formula sheet (slide 16)</h2>
    <div class="tt-wrap"><table class="tt fs"><tr><th>Rule</th><th>Formula</th></tr>
      <tr><th>Axioms</th><td><span class="f">${fx(String.raw`P(A) \ge 0`, "P(A) ≥ 0")}</span><span class="f">${fx(String.raw`P(\Omega) = 1`, "P(Ω) = 1")}</span><span class="f">${fx(String.raw`P(A \cup B) = P(A) + P(B)`, "P(A ∪ B) = P(A) + P(B)")} for disjoint A, B</span></td></tr>
      <tr><th>Complement, union</th><td><span class="f">${fx(String.raw`P(\bar A) = 1 - P(A)`, "P(Ā) = 1 − P(A)")}</span><span class="f">${fx(String.raw`P(A \cup B) = P(A) + P(B) - P(A \cap B)`, "P(A ∪ B) = P(A) + P(B) − P(A ∩ B)")}</span></td></tr>
      <tr><th>Counting</th><td><span class="f">${fx(String.raw`P(A) = \dfrac{|A|}{|\Omega|}`, "P(A) = |A| / |Ω|")} for equally likely outcomes</span><span class="f">${fx(String.raw`P(n, r) = \dfrac{n!}{(n - r)!}`, "P(n, r) = n!/(n − r)!")}</span><span class="f">${fx(String.raw`C(n, r) = \dbinom{n}{r} = \dfrac{n!}{r!\,(n - r)!}`, "C(n, r) = n!/(r!(n − r)!)")}</span></td></tr>
      <tr><th>Conditional, joint</th><td><span class="f">${fx(String.raw`P(A \mid B) = \dfrac{P(A \cap B)}{P(B)}`, "P(A | B) = P(A ∩ B) / P(B)")}</span><span class="f">${fx(String.raw`P(A \cap B) = P(A \mid B)\, P(B)`, "P(A ∩ B) = P(A | B) P(B)")}</span></td></tr>
      <tr><th>Bayes</th><td><span class="f">${fx(String.raw`P(A \mid B) = \dfrac{P(B \mid A)\, P(A)}{P(B)}`, "P(A | B) = P(B | A) P(A) / P(B)")}</span></td></tr>
      <tr><th>Total probability</th><td><span class="f">${fx(String.raw`P(A) = \sum_i P(A \mid B_i)\, P(B_i)`, "P(A) = Σ<sub>i</sub> P(A | B<sub>i</sub>) P(B<sub>i</sub>)")}</span></td></tr></table></div>

    <h2>${H.snow} (slide 17)</h2>

    <h2>Take-home (slide 18)</h2>
    <ul>
      <li><b>What does a stochastic model give?</b> The probabilities of states, not the states themselves; a simulation draws one trajectory consistent with them.</li>
      <li><b>Where does probability theory come from?</b> Three Kolmogorov axioms; the Boolean rules (and, or, not), counting rules and everything else follow.</li>
      <li><b>What does conditioning do?</b> It renormalises to what you know: P(A | B) = P(A ∩ B) / P(B).</li>
      <li><b>What is Bayes' theorem for?</b> Turning P(data | model), which you can simulate, into P(model | data), which you want.</li>
      <li><b>How do you build complicated probabilities?</b> Split into cases (total probability) or into steps (chain rule).</li>
      <li><b>Why random variables?</b> Indicators express any event, so random variables are the language for the rest of the course.</li>

// ================= Lecture 2 · Random variate generation (SMS2, 21 pages, eight parts) =================
// Tutorial 2 already has explorers for the LCG clock, pseudo- against quasi-random squares, Y = g(X), inversion,
// Box–Muller and the bounding-box darts; this write-up links to them and adds what the lecture adds on top.
// Axis helpers for the fixed-width explorer SVGs (viewBox 560 wide, scaled down on phones).
const axY = (ticks, y, L, R, W, f = v => v) => ticks.map((v, i) => `<line class="${i ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${f(v)}</text>`).join("");
const axX = (ticks, x, H, f = v => v) => ticks.map(v => `<text class="tick" x="${x(v)}" y="${H - 8}" text-anchor="middle">${f(v)}</text>`).join("");
const npdf = (x, mu = 0, s = 1) => Math.exp(-((x - mu) ** 2) / (2 * s * s)) / (s * Math.sqrt(2 * Math.PI));
// Standard normal CDF through erf (Abramowitz–Stegun 7.1.26, absolute error below 1.5 · 10⁻⁷).
const erf = x => { const s = Math.sign(x), a = Math.abs(x), t = 1 / (1 + 0.3275911 * a); return s * (1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a)); };
const Phi = x => 0.5 * (1 + erf(x / Math.SQRT2));

// Discrete transform Y = (X − 3)² of a fair die: every bar of p_Y stacks the faces of its pre-image (slide 5).
const PRE = [[0, [3]], [1, [2, 4]], [4, [1, 5]], [9, [6]]];
CHARTS.preimg = narrow => {
  const W = narrow ? 340 : 600, H = 236, L = narrow ? 36 : 46, R = 12, T = 16, B = 52, PW = W - L - R, PH = H - T - B, bw = PW / PRE.length;
  const y = v => T + PH - v / 0.4 * PH;
  const ticks = [[0, "0"], [1 / 6, "1/6"], [2 / 6, "2/6"]].map(([v, t]) => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${t}</text>`).join("");
  const bars = PRE.map(([yv, xs], i) => { const x0 = L + i * bw + bw * 0.24, w = bw * 0.52, cx = x0 + w / 2;
    const segs = xs.map((xv, k) => { const top = y((k + 1) / 6), base = y(k / 6) - (k ? 2 : 0);
      return k === xs.length - 1 ? `<path class="bar s1" d="${vbar(x0, w, top, base)}"/>` : `<rect class="bar s1" x="${x0}" y="${top + 1}" width="${w}" height="${base - top - 1}"/>`; }).join("");
    const tip = `<b>Y = ${yv}</b>pre-image {${xs.join(", ")}}<br>p<sub>Y</sub>(${yv}) = ${xs.map(v => `p<sub>X</sub>(${v})`).join(" + ")} = ${xs.length}/6`;
    return `<g class="pt" tabindex="0" data-tip="${esc(tip)}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${PH + B}"/>${segs}
      <text class="val" x="${cx}" y="${y(xs.length / 6) - 6}" text-anchor="middle">${xs.length}/6</text>
      <text class="cat" x="${cx}" y="${T + PH + 18}" text-anchor="middle">y = ${yv}</text><text class="note" x="${cx}" y="${T + PH + 34}" text-anchor="middle">from x = ${xs.join(", ")}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart: the distribution of Y = (X − 3) squared for a fair die X. Y = 0 comes only from x = 3 (1/6), Y = 1 from x = 2 and 4 (2/6), Y = 4 from x = 1 and 5 (2/6), Y = 9 only from x = 6 (1/6).">${ticks}${bars}</svg>`;
};

// Star discrepancy of n points in [0, 1): a seeded pseudo-random generator against the additive recurrence
// with α = (√5 − 1)/2 (slides 11–12). In one dimension D*ₙ = maxᵢ max(i/n − x₍ᵢ₎, x₍ᵢ₎ − (i − 1)/n) of the sorted points.
const dstar = xs => { const s = [...xs].sort((a, b) => a - b), n = s.length; let d = 0; s.forEach((v, i) => { d = Math.max(d, (i + 1) / n - v, v - i / n); }); return d; };
const DISC = (() => { const r = mulberry(2026), g = (Math.sqrt(5) - 1) / 2, out = [];
  for (let k = 4; k <= 14; k++) { const n = 2 ** k; out.push([n, dstar(Array.from({ length: n }, r)), dstar(Array.from({ length: n }, (_, i) => ((i + 1) * g) % 1))]); } return out; })();
CHARTS.disc = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 240 : 260, L = narrow ? 50 : 56, R = narrow ? 14 : 92, T = 22, B = 32, PW = W - L - R, PH = H - T - B;
  const x = n => L + (Math.log2(n) - 4) / 10 * PW, y = v => T - Math.log10(v) / 4 * PH;
  const yt = [0.0001, 0.001, 0.01, 0.1, 1].map((v, i) => `<line class="${i ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const xt = (narrow ? [16, 128, 1024, 8192] : [16, 64, 256, 1024, 4096, 16384]).map(n => `<text class="tick" x="${x(n)}" y="${H - 12}" text-anchor="middle">${n.toLocaleString("en-GB")}</text>`).join("");
  const path = j => "M" + DISC.map(r => `${x(r[0]).toFixed(1)},${y(r[j]).toFixed(1)}`).join(" L");
  const pts = DISC.map(([n, p, qv]) => `<g class="pt" tabindex="0" data-tip="${esc(`<b>n = ${n.toLocaleString("en-GB")} points</b>pseudo-random: D = ${num(p, 4)}<br>additive recurrence: D = ${num(qv, 5)}<br>quasi is ${num(p / qv, 1)} × more even`)}"><rect class="hit" x="${x(n) - PW / 20}" y="${T}" width="${PW / 10}" height="${PH}"/><circle class="dot" style="fill:var(--vz-s1)" cx="${x(n)}" cy="${y(p)}" r="4"/><circle class="dot" style="fill:var(--vz-s2)" cx="${x(n)}" cy="${y(qv)}" r="4"/></g>`).join("");
  const last = DISC[DISC.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Log-log chart: star discrepancy of n points in the unit interval, for n from 16 to 16,384. Pseudo-random points fall from ${num(DISC[0][1], 2)} to ${num(last[1], 4)}, about a factor 2 per factor 4 in n; the additive recurrence falls from ${num(DISC[0][2], 3)} to ${num(last[2], 5)}, about a factor 2 per doubling.">
    ${yt}${xt}<text class="note" x="${L - 44}" y="12">discrepancy D (log scale)</text><text class="note" x="${W - R}" y="${H - 1}" text-anchor="end">number of points n (log scale)</text>
    <path class="line" style="stroke:var(--vz-s1)" d="${path(1)}"/><path class="line" style="stroke:var(--vz-s2)" d="${path(2)}"/>${pts}
    ${narrow ? "" : `<text class="lbl" x="${x(last[0]) + 9}" y="${y(last[1]) + 4}">pseudo</text><text class="lbl" x="${x(last[0]) + 9}" y="${y(last[2]) + 4}">quasi (ARS)</text>`}</svg>`;
};

// Gaussian from a sum of n uniforms (slide 14): exact density of the standardised Irwin–Hall sum against N(0, 1).
const irwin = (n, s) => { if (s <= 0 || s >= n) return 0; let v = 0, f = 1; for (let k = 0; k <= Math.floor(s); k++) v += (-1) ** k * C(n, k) * (s - k) ** (n - 1); for (let i = 2; i < n; i++) f *= i; return v / f; };
const cltz = n => z => { const sd = Math.sqrt(n / 12); return sd * irwin(n, n / 2 + z * sd); };
line("cltsum", {
  xlin: true, step: 0.1, x: [-4, 4], y: [0, 0.45], xTicks: [-4, -3, -2, -1, 0, 1, 2, 3, 4], xTicksN: [-4, -2, 0, 2, 4], yTicks: [0, 0.1, 0.2, 0.3, 0.4], yTitle: "density",
  series: [{ name: "N(0, 1)", short: " ", f: z => npdf(z), dash: true },

    { slot: 3, name: "n = 12", short: "n = 12", f: cltz(12), labelAt: -0.6, dy: -8 }],
  tipHead: v => `z = ${num(v, 1)}`, fmtY: v => num(v, 3), focusAt: 0, labelW: 16,
  hitLabel: "Read the densities: arrow keys move 0.1 along z",
  aria: "Line chart: density of the standardised sum of n uniform numbers. For n = 1 it is flat at 0.29 between −1.73 and 1.73; for n = 2 a triangle peaking at 0.41; for n = 12 it lies almost on the standard normal curve, but is exactly zero beyond ±6.",
});

// Explorer: invert the normal CDF numerically with Newton's method, x_{k+1} = x_k − (Φ(x_k) − u)/φ(x_k), from x₀ = 0 (slide 13).
const NW = { u: 0.9 };
function newtonRun(u) { let x = 0; const it = [[0, x, Phi(x)]]; for (let k = 1; k <= 8; k++) { x = x - (Phi(x) - u) / npdf(x); it.push([k, x, Phi(x)]); if (Math.abs(Phi(x) - u) < 1e-7) break; } return it; }
function newtonOut() {
  const u = NW.u, it = newtonRun(u), W = 560, H = 236, L = 34, R = 12, T = 12, B = 26, PW = W - L - R, PH = H - T - B;
  const x = v => L + (v + 3) / 6 * PW, y = v => T + PH - v * PH;
  const cdf = "M" + Array.from({ length: 121 }, (_, k) => { const v = -3 + k / 20; return `${x(v).toFixed(1)},${y(Phi(v)).toFixed(1)}`; }).join(" L");
  const tang = it.slice(0, -1).map(([, xk, Fk], i) => { const [, xn, Fn] = it[i + 1]; return `<line class="read" x1="${x(xk)}" y1="${y(Fk)}" x2="${x(xn)}" y2="${y(u)}"/><line class="ann" x1="${x(xn)}" y1="${y(u)}" x2="${x(xn)}" y2="${y(Fn)}" stroke-dasharray="2 2"/>`; }).join("");
  const dots = it.map(([k, xk, Fk]) => `<circle class="hit-pt" cx="${x(xk)}" cy="${y(Fk)}" r="${k === it.length - 1 ? 6 : 4.5}"/>`).join("");
  const fin = it[it.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="The standard normal CDF with Newton's iterates for u = ${u}: starting at x = 0 the tangents step to ${it.slice(1).map(r => num(r[1], 3)).join(", ")}.">
      ${axY([0, 0.25, 0.5, 0.75, 1], y, L, R, W)}${axX([-3, -2, -1, 0, 1, 2, 3], x, H)}
      <line class="ann" x1="${L}" x2="${W - R}" y1="${y(u)}" y2="${y(u)}" stroke-dasharray="5 4"/><text class="note" x="${L + 4}" y="${y(u) - 5}">u = ${u}</text>
      <path class="line" d="${cdf}"/>${tang}${dots}<text class="note" x="${W - R}" y="${y(0.08)}" text-anchor="end">Φ(x), the standard normal CDF</text></svg>
    <div class="tt-wrap"><table class="tt compact"><tr><th>k</th><th>x<sub>k</sub></th><th>Φ(x<sub>k</sub>)</th><th>Φ(x<sub>k</sub>) − u</th></tr>${it.map(([k, xk, Fk]) => `<tr><td>${k}</td><td>${xk.toFixed(6)}</td><td>${Fk.toFixed(6)}</td><td>${(Fk - u).toExponential(1)}</td></tr>`).join("")}</table></div>
    <dl class="ro"><dt>Result</dt><dd>x = Φ⁻¹(${u}) ≈ <b>${fin[1].toFixed(4)}</b> after ${it.length - 1} Newton step${it.length === 2 ? "" : "s"} ${flag("ok", "|Φ(x) − u| < 10⁻⁷")}</dd>
      <dt>Why it works</dt><dd>Φ is increasing and bends one way on each side of 0, so from x₀ = 0 every tangent lands between the last iterate and the root: the steps never overshoot.</dd></dl>`;
}
function initNewton(body) {
  body.innerHTML = `<div class="ctl"><label>u <input type="range" min="0.01" max="0.99" step="0.01" value="${NW.u}"> <output>${NW.u}</output></label>${[0.5, 0.9, 0.975, 0.99].map(v => `<button class="preset" type="button" data-u="${v}">u = ${v}</button>`).join("")}</div><div class="out"></div>`;
  const r = body.querySelector("input"), o = body.querySelector("output"), out = body.querySelector(".out");
  const draw = () => { r.value = NW.u; o.textContent = NW.u; out.innerHTML = newtonOut(); };
  r.addEventListener("input", () => { NW.u = +r.value; draw(); });
  body.querySelectorAll("[data-u]").forEach(b => b.addEventListener("click", () => { NW.u = +b.dataset.u; draw(); })); draw();
}

// Explorer: accept–reject with a proposal g scaled by μ so that μg ≥ f (slides 16–18). Target: a two-bump mixture.
const ARf = x => 0.6 * npdf(x, -0.4, 0.35) + 0.4 * npdf(x, 0.8, 0.3);
const ARP = {
  box: { name: "uniform box on [−2.5, 2.5]", g: x => (Math.abs(x) <= 2.5 ? 0.2 : 0), draw: r => -2.5 + 5 * r() },
  wide: { name: "wide Gaussian N(0, 1)", g: x => npdf(x), draw: r => gauss(r) },
  fit: { name: "fitted Gaussian N(0.1, 0.72²)", g: x => npdf(x, 0.1, 0.72), draw: r => 0.1 + 0.72 * gauss(r) },
};
const arMu = g => { let m = 0; for (let x = -4; x <= 4; x += 0.005) { const gv = g(x); if (gv > 0) m = Math.max(m, ARf(x) / gv); } return m * 1.002; };
Object.values(ARP).forEach(p => { p.mu = arMu(p.g); });
const AR = { k: "box", N: 1000, seed: 1 };
function arOut() {
  const p = ARP[AR.k], r = mulberry(AR.seed * 104729), W = 560, H = 252, L = 34, R = 12, T = 24, B = 26, PW = W - L - R, PH = H - T - B;

  const x = v => L + (v + 3) / 6 * PW, y = v => T + PH - v / ymax * PH;
  const pts = []; let acc = 0;
  for (let i = 0; i < AR.N; i++) { const v = p.draw(r), h = r() * p.mu * p.g(v), ok = h <= ARf(v); acc += ok; if (Math.abs(v) < 3) pts.push([v, h, ok]); }
  const curve = f => "M" + Array.from({ length: 241 }, (_, k) => { const v = -3 + k * 0.025; return `${x(v).toFixed(1)},${y(f(v)).toFixed(1)}`; }).join(" L");
  const rate = acc / AR.N;
  return `<svg viewBox="0 0 ${W} ${H}" class="lab-svg" role="img" aria-label="${AR.N} proposals from the ${p.name}, drawn under the envelope μg; ${acc} land below the target density and are kept.">
      ${axY([0, 0.5, 1, 1.5, 2].filter(v => v < ymax), y, L, R, W)}${axX([-3, -2, -1, 0, 1, 2, 3], x, H)}
      ${pts.map(([v, h, ok]) => `<circle cx="${x(v).toFixed(1)}" cy="${y(h).toFixed(1)}" r="${AR.N > 2000 ? 1.3 : 1.9}" class="${ok ? "keep" : "drop"}"/>`).join("")}
      <path class="env" d="${curve(v => p.mu * p.g(v))}"/><path class="curve" d="${curve(ARf)}"/>
      <text class="note" x="${W - R}" y="14" text-anchor="end">envelope μg(x), μ = ${num(p.mu, 2)}</text></svg>
    <div class="legend"><span class="li">${key(3)}<span class="lt">envelope μg</span></span><span class="li">${key(1)}<span class="lt">target f and kept darts</span></span><span class="li">${key("g")}<span class="lt">rejected darts</span></span></div>
    <dl class="ro"><dt>Kept</dt><dd>${acc.toLocaleString("en-GB")} of ${AR.N.toLocaleString("en-GB")} proposals: <b>${pct(rate)}</b> · theory 1/μ = ${pct(1 / p.mu)} ${flag(Math.abs(rate - 1 / p.mu) < 3 * Math.sqrt(rate * (1 - rate) / AR.N) ? "ok" : "bad", Math.abs(rate - 1 / p.mu) < 3 * Math.sqrt(rate * (1 - rate) / AR.N) ? "within sampling noise" : "off by more than 3 standard errors")}</dd>
      <dt>Cost</dt><dd>μ = ${num(p.mu, 2)} proposals and ${num(2 * p.mu, 2)} uniform numbers (one for Y, one for U, more for a Gaussian) per kept sample</dd></dl>`;
}
function initAr(body) {
  body.innerHTML = `<div class="ctl"><label>Proposal g <select data-k>${Object.entries(ARP).map(([k, p]) => `<option value="${k}"${k === AR.k ? " selected" : ""}>${p.name}</option>`).join("")}</select></label>
      <label>Proposals <select data-n>${[300, 1000, 3000].map(n => `<option value="${n}"${n === AR.N ? " selected" : ""}>${n.toLocaleString("en-GB")}</option>`).join("")}</select></label><button class="preset" type="button">Throw again</button></div><div class="out"></div>`;
  const sk = body.querySelector("[data-k]"), sn = body.querySelector("[data-n]"), out = body.querySelector(".out"), draw = () => { out.innerHTML = arOut(); };
  sk.addEventListener("change", () => { AR.k = sk.value; draw(); }); sn.addEventListener("change", () => { AR.N = +sn.value; draw(); });
  body.querySelector("button").addEventListener("click", () => { AR.seed++; draw(); }); draw();
}

function lecture2() {
  const BALL = [[1, "100 %", "1.0"], [2, "78.5 %", "1.3"], [3, "52.4 %", "1.9"], [5, "16.4 %", "6.1"], [10, "0.25 %", "402"], [20, "2.5 × 10⁻⁶ %", "41 million"]];
  const H = {
    fake: "Faking randomness", pre: "Transformations and pre-images", cdf: "Continuous transforms: through the CDF", inv: "The inversion transform",
    lcg: "Uniform generators: the LCG", clus: "Clustering, low discrepancy and aliasing", nonu: "Non-uniform numbers: inversion in practice",
    gauss: "Gaussian numbers: why not the CLT, and Box–Muller", ar: "Accept–reject sampling",
  };
  return `${head(l)}
    <p class="lead">Every stochastic simulation needs numbers drawn from some distribution: exponential waiting times, Gaussian kicks, a next state chosen with given probabilities. A computer only has deterministic arithmetic, and the lecture's answer comes in two halves. First make good uniform numbers on [0, 1); then transform them into anything else. The bridge between the halves is the inversion transform: plug a variable into its own CDF and it comes out uniform, so running the CDF backwards turns uniform numbers into the target distribution. The deck is "SMS2" in OPAL (Lecture2026), a 21-page summary in eight parts; ${exeLink(2, "tutorial 2")} (5 Nov) works through the same material in a Pluto notebook and has explorers for most of it. Every section below starts with what the idea is for, then the formula with each symbol named, then numbers.</p>
