<script>
const { m, c, esc, U, fmt, daysUntil, lec, exe, today } = SAP;
const { key, leg, flag, hbar, vbar, num, pct, col, CHARTS, LINES, place, chart, lab, line, mountCharts, isNarrow } = SAPViz;
const q = new URLSearchParams(location.search).get("n");
const l = q === null ? null : c.lectures.find(x => String(x.n) === q);
const page = document.getElementById("page");
const back = `<a class="back" href="stochastics.html">← All lectures and exercises</a>`;
// Write-up building blocks: a context box (what a lecturer says aloud, not on the slides), a worked example,
// a question box, a table view for a chart (accessibility), and the lecture header.
const why = (t, body) => `<div class="why"><div class="kicker">${t}</div>${body}</div>`;
const ex = (t, body) => `<div class="ex"><div class="kicker">${t}</div>${body}</div>`;
const qbox = (t, items) => `<div class="q"><div class="kicker">${t}</div><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
const tbl = (head, rows) => `<details class="tbl"><summary>Table view of the chart</summary><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map((v, i) => `<td class="${i ? "n" : ""}">${v}</td>`).join("")}</tr>`).join("")}</table></details>`;
function head(l) {
  const meta = `${l.date ? fmt(l.date) : "no fixed date"}${lec ? ` · ${lec.start}–${lec.end} · ${esc(lec.room)} · ${esc(lec.who || "")}` : ""}`;
  return `${back}<div class="big-icon">${l.icon}</div><h1>Lecture ${l.n} – ${esc(l.title)}</h1><p class="meta">${meta}</p>`;
}

// ---------------- Write-ups: one function per lecture, registered in WRITEUPS below ----------------
// Pattern (see .claude/skills/study-dashboard/references/page-pattern.md):
//   CHARTS.name = narrow => `<svg viewBox="0 0 ${narrow ? 340 : 600} …" role="img" aria-label="…">…</svg>`;
//   function lecture1() { return `${head(l)}<p class="lead">…</p><h2>…</h2>${chart("name", leg([[1, "series"]]))}<figcaption>…</figcaption></figure>${why("Context, not on the slides: …", "<p>…</p>")}${ex("Worked example: …", "<p>…</p>")}<h2>Take-home</h2><ul>…</ul>`; }

function placeholder() {
  const d = daysUntil(l.date);
  return `${head(l)}
    <div class="box placeholder">
      <div class="big-icon">${l.icon}</div>
      <h2 style="margin-top:.4rem">Material not yet covered</h2>
      <p class="muted">This lecture is ${d > 0 ? `in ${d} day${d > 1 ? "s" : ""}` : d === 0 ? "today" : "over, but its slides are not read yet"}: ${fmt(l.date)}${lec ? `, ${lec.start}–${lec.end}, ${esc(lec.room)}` : ""}.<br>Planned topic: ${esc(l.blurb)}<br>The summary appears here once the lecture has taken place and its slides are available.</p>
    </div>`;
}
// ---------------- Shared helpers of the write-ups ----------------
const mulberry = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = r => { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const tiles = items => `<div class="tiles">${items.map(([v, l]) => `<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
const cap = t => `<figcaption>${t}</figcaption></figure>`;
// Formulas: TeX source in data-tex, typeset by KaTeX after rendering (display style inside .formula boxes,
// inline style elsewhere); the plain Unicode text is the fallback when KaTeX cannot load.
const fx = (tex, plain) => `<span class="tex" data-tex="${esc(tex)}">${plain}</span>`;
function typeset(root) {
  // After typesetting the page height changes, so a URL hash is scrolled to again.
  const run = () => { root.querySelectorAll(".tex[data-tex]").forEach(el => {
    try { katex.render(el.dataset.tex, el, { displayMode: !!el.closest(".formula"), throwOnError: false }); el.classList.add("is-set"); } catch (e) {}
  }); jumpHash(); };
  if (window.katex) run(); else document.getElementById("katex-js")?.addEventListener("load", run, { once: true });
}
// Heading ids: "s-" + heading text without the slide range, lowercase, a–z0–9 joined by hyphens
// ("The inversion transform (slide 7)" → "s-the-inversion-transform"). Tutorial pages link to them; keep them stable.
const slug = t => "s-" + String(t).normalize("NFKD").replace(/\s*\((?:slides?|pages?)\b[^)]*\)\s*$/i, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
function headingIds(root) {
  const seen = {};
  root.querySelectorAll("h2, h3").forEach(h => { if (h.id) return; let id = slug(h.textContent); seen[id] = (seen[id] || 0) + 1; if (seen[id] > 1) id += "-" + seen[id]; h.id = id; });
}
const jumpHash = () => { if (!location.hash) return; const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); };
// Links to a heading: in(n, "Heading text", "link text") for another lecture, see("Heading text") on this page.
const secHref = (n, title) => `stochastics/lecture.html?n=${n}#${slug(title)}`;
const inL = (n, title, text) => `<a href="${secHref(n, title)}">${text || title}</a>`;
const see = (title, text) => inL(l.n, title, text);
// Self-contained write-ups: what the lecture builds on, the glossary, the plain-words opener of each section,
// the typical mistake, and the try-it tasks with hidden solutions.
const before = items => `<div class="before"><div class="kicker">Before you start</div><p>This lecture builds on:</p><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
const terms = list => { const sorted = [...list].sort((a, b) => a[0].replace(/[^\p{L}\p{N} ]/gu, "").localeCompare(b[0].replace(/[^\p{L}\p{N} ]/gu, ""), "en", { sensitivity: "base" }));
  return `<details class="terms"><summary>Terms used on this page <span class="muted">· ${list.length} terms, A–Z, each with the section where it first appears</span></summary><dl>${sorted.map(([t, d, sec]) => `<dt>${t}</dt><dd>${d}${sec ? ` <a class="sec" href="${secHref(l.n, sec)}">First used in: ${sec.replace(/\s*\((?:slides?|pages?)\b[^)]*\)\s*$/i, "")}</a>` : ""}</dd>`).join("")}</dl></details>`; };
const plain = t => `<p class="plain"><b>In plain words.</b> ${t}</p>`;
const oops = t => `<p class="oops"><b>Common mistake.</b> ${t}</p>`;
const tryit = items => `<div class="try"><div class="kicker">Try it yourself</div><ol>${items.map(([q, a]) => `<li>${q}<details><summary>Show the solution</summary>${a}</details></li>`).join("")}</ol></div>`;
const lecLink = (n, t) => { const x = c.lectures.find(y => y.n === n); return x ? `<a href="stochastics/lecture.html?n=${n}">${t || `lecture ${n}`}</a>` : t || `lecture ${n}`; };
const exeLink = (n, t) => `<a href="stochastics/exercise.html?n=${n}">${t || `tutorial ${n}`}</a>`;
// Birthday problem: P(at least two of n share a birthday), 365 equally likely days.
const bday = n => { let p = 1; for (let i = 0; i < n; i++) p *= (365 - i) / 365; return 1 - p; };
// Continuous versions for drawing: linear interpolation between whole people / whole days.
const smooth = f => n => { const a = Math.floor(n), t = n - a; return t ? (1 - t) * f(a) + t * f(a + 1) : f(a); };
const bdayS = smooth(bday);
// Weather chain of the introduction (rows: from Sunny, Cloudy, Rainy; columns: to Sunny, Cloudy, Rainy).
const WP = [[0.6, 0.3, 0.1], [0.3, 0.4, 0.3], [0.2, 0.4, 0.4]], WN = ["Sunny", "Cloudy", "Rainy"];
const matmul = (A, B) => A.map(r => B[0].map((_, j) => r.reduce((s, v, k) => s + v * B[k][j], 0)));
const WPOW = [[[1, 0, 0], [0, 1, 0], [0, 0, 1]]]; for (let n = 1; n <= 12; n++) WPOW.push(matmul(WPOW[n - 1], WP));
const WPI = [0.3934, 0.3607, 0.2459];

// ================= Lecture 0 · Course introduction (SMS0, 20 slides) =================
// Birthday problem: P(shared) and P(all different) over the room size, with the 50 % level (slide 7).
line("bday", {
  xlin: true, step: 1, x: [1, 60], y: [0, 1], xTicks: [1, 10, 20, 30, 40, 50, 60], xTicksN: [1, 20, 40, 60], yTicks: [0, 0.25, 0.5, 0.75, 1], yTitle: "probability",
  series: [{ slot: 1, name: "at least two share a birthday", short: "shared", f: bdayS }, { slot: 2, name: "all birthdays different", short: "all different", f: n => 1 - bdayS(n) }],
  tipHead: v => `${v} people in the room`, fmtY: v => pct(v), focusAt: 23, labelW: 84,
  extra: (g, narrow) => `<line class="ann" x1="${g.L}" x2="${g.W - g.R}" y1="${g.y(0.5)}" y2="${g.y(0.5)}" stroke-dasharray="4 3"/><line class="ann" x1="${g.x(23)}" x2="${g.x(23)}" y1="${g.y(0.507)}" y2="${g.T + g.PH}" stroke-dasharray="4 3"/><text class="note" x="${g.x(23) + 4}" y="${g.T + g.PH - 6}">n = 23</text>`,
  hitLabel: "Read the birthday probabilities: arrow keys change the room size by one person",
  aria: "Line chart: probability that at least two of n people share a birthday, rising from 0 at n = 1 through 50.7 % at n = 23 to 97 % at n = 50; the complementary curve falls from 1 to 3 %.",
});
// Deterministic logistic growth against stochastic realisations of the same model (slide 8); paths generated here.
CHARTS.logistic = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 230 : 260, L = narrow ? 34 : 44, R = narrow ? 16 : 24, T = 14, B = 30, PW = W - L - R, PH = H - T - B;
  const K = 100, r = 1, x0 = 5, tmax = 10, dt = 0.05, nT = tmax / dt;
  const x = t => L + t / tmax * PW, y = v => T + PH - Math.min(v, 135) / 135 * PH;
  const det = Array.from({ length: nT + 1 }, (_, k) => { const t = k * dt; return [t, K / (1 + (K / x0 - 1) * Math.exp(-r * t))]; });
  const paths = []; const rng = mulberry(7);
  for (let p = 0; p < 14; p++) { let v = x0; const pts = [[0, v]]; for (let k = 1; k <= nT; k++) { v = Math.max(0.5, v + r * v * (1 - v / K) * dt + 0.9 * Math.sqrt(v) * Math.sqrt(dt) * gauss(rng)); pts.push([k * dt, v]); } paths.push(pts); }
  const d = pts => "M" + pts.map(([t, v]) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(" L");
  const ends = paths.map(p => p[nT][1]), lo = Math.min(...ends), hi = Math.max(...ends);
  const yt = [0, 50, 100].map(v => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const xt = [0, 2, 4, 6, 8, 10].map(t => `<text class="tick" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart: logistic population growth from 5 towards the capacity 100 over 10 time units. One smooth deterministic curve and 14 noisy stochastic realisations that scatter around it; at t = 10 the realisations end between ${num(lo, 0)} and ${num(hi, 0)}.">
    ${yt}${xt}<text class="note" x="${L - 30}" y="10">population over time</text>
    ${paths.map(p => `<path class="line thin s1" d="${d(p)}"/>`).join("")}
    <path class="line k2 thick" d="${d(det)}"/>
    <g class="pt" tabindex="0" data-tip="${esc(`<b>States at t = 10</b>deterministic model: ${num(det[nT][1], 1)}<br>14 realisations: ${num(lo, 0)} to ${num(hi, 0)}`)}"><rect class="hit" x="${x(9.4)}" y="${T}" width="${x(10) - x(9.4) + R}" height="${PH}"/><line class="ann" x1="${x(10)}" x2="${x(10)}" y1="${y(hi)}" y2="${y(lo)}"/></g></svg>`;
};
// Convergence of the weather chain: P(sunny on day n) for each starting weather (slide 12).
line("mix", {
  xlin: true, step: 1, x: [0, 10], y: [0, 1], xTicks: [0, 2, 4, 6, 8, 10], xTicksN: [0, 5, 10], yTicks: [0, 0.25, 0.5, 0.75, 1], yTitle: "P(sunny on day n)",
  series: WN.map((w, i) => ({ slot: i + 1, name: `start ${w.toLowerCase()}`, short: w.toLowerCase(), f: smooth(n => WPOW[n][i][0]), labelAt: [1, 2, 1][i], dy: [-6, 14, 14][i] })),
  tipHead: v => `day ${v}`, fmtY: v => pct(v), focusAt: 3, labelW: 70,
  extra: g => `<line class="ann" x1="${g.L}" x2="${g.W - g.R}" y1="${g.y(WPI[0])}" y2="${g.y(WPI[0])}" stroke-dasharray="4 3"/><text class="note" x="${g.W - g.R - 4}" y="${g.y(WPI[0]) - 6}" text-anchor="end">stationary π(sunny) = 39.3 %</text>`,
  hitLabel: "Read the sunny probabilities: arrow keys move one day",
  aria: "Line chart: probability of a sunny day n days ahead, for a start on a sunny, cloudy or rainy day. The three curves start at 100 %, 0 % and 0 % and meet at the stationary value 39.3 % after about six days.",
});
// Monte Carlo π: the typical error 1.64/√N for N points on a log axis (slide 13); the slide's one-run estimates in the tooltips.
const MCPI = [[100, 3.28, 0.16], [1000, 3.12, 0.052], [10000, 3.1324, 0.016], [100000, 3.147, 0.0052], [1000000, 3.1416, 0.0016]];
CHARTS.mcerr = narrow => {
  const W = narrow ? 340 : 600, L = narrow ? 76 : 100, R = narrow ? 50 : 64, T = 8, RH = 36, H = T + MCPI.length * RH + 26, PW = W - L - R;
  const x = v => L + (Math.log10(v) + 3) / 3 * PW;
  const ticks = [0.001, 0.01, 0.1, 1].map(v => `<line class="${v === 0.001 ? "axis" : "grid"}" x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - 22}"/><text class="tick" x="${x(v)}" y="${H - 6}" text-anchor="middle">${v}</text>`).join("");
  const rows = MCPI.map(([N, est, err], i) => { const y0 = T + i * RH + 9, bh = 18;
    const tip = `<b>N = ${N.toLocaleString("en-GB")} points</b>typical error 1.64/√N ≈ ${err}<br>one run on the slide: π ≈ ${est} (off by ${num(Math.abs(est - Math.PI), 4)})`;
    return `<g class="pt" tabindex="0" data-tip="${esc(tip)}"><rect class="hit" x="0" y="${y0 - 9}" width="${W}" height="${RH}"/><path class="bar s1" d="${hbar(x(0.001), x(err), y0, bh)}"/>
      <text class="cat" x="${L - 8}" y="${y0 + 13}" text-anchor="end">${narrow ? "10" : "N = 10"}<tspan baseline-shift="super" font-size="9">${Math.log10(N)}</tspan></text><text class="val" x="${x(err) + 6}" y="${y0 + 13}">${err}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart on a logarithmic axis: typical error of the Monte Carlo estimate of π, 0.16 for 100 points, 0.052 for a thousand, 0.016 for ten thousand, 0.0052 for a hundred thousand and 0.0016 for a million: ten times more points, about three times less error.">${ticks}${rows}</svg>`;
};
// Mean squared displacement over time: Brownian motion (linear) against sub- and superdiffusion (slide 16).
line("msd", {
  xlin: true, step: 0.5, x: [0, 10], y: [0, 40], xTicks: [0, 2, 4, 6, 8, 10], xTicksN: [0, 5, 10], yTicks: [0, 10, 20, 30, 40], yTitle: "MSD = E[|x(t)|²]",
  series: [{ slot: 1, name: "Brownian: 2 D t (α = 1)", short: "α = 1", f: t => 2 * t }, { slot: 2, name: "subdiffusion: 2 t^0.5", short: "α = 0.5", f: t => 2 * Math.sqrt(t) }, { slot: 3, name: "superdiffusion: 2 t^1.5", short: "α = 1.5", f: t => 2 * t ** 1.5, labelAt: 6.5, dy: -8 }],
  tipHead: v => `t = ${v}`, fmtY: v => num(v, 1), focusAt: 4, labelW: 60,
  hitLabel: "Read the mean squared displacement: arrow keys move half a time unit",
  aria: "Line chart: mean squared displacement against time in one dimension with D = 1. Brownian motion grows linearly, 2 t; subdiffusion with exponent 0.5 bends down; superdiffusion with exponent 1.5 bends up and leaves the chart after t ≈ 7.",
});
// Strong error of the SDE schemes against the step size (slide 18): order ½ for Euler–Maruyama, 1 for Milstein.
line("order", {
  x: [1, 1024], y: [0, 1], yTicks: [0, 0.25, 0.5, 0.75, 1], xTicks: [1, 4, 16, 64, 256, 1024], xTicksN: [1, 8, 64, 512], yTitle: "strong error (relative to Δt = 1)",
  series: [{ slot: 1, name: "Euler–Maruyama: ∝ Δt^½", short: "EM, order ½", f: v => v ** -0.5, labelAt: 128, dy: -8 }, { slot: 2, name: "Milstein: ∝ Δt", short: "Milstein, order 1", f: v => 1 / v, labelAt: 8, dy: -8 }],
  tipHead: v => `Δt = 1/${v}`, fmtY: v => num(v, 3), focusAt: 16, labelW: 110,
  hitLabel: "Read the error levels: arrow keys halve or double the step",
  aria: "Line chart: strong error against the number of steps per unit time, on a log axis. Halving the step divides the Euler–Maruyama error by about 1.4 and the Milstein error by 2.",
});
// Explorer: estimate π by throwing N uniform points into the unit square (slide 13).
const PI = { N: 1000, seed: 1 };
function piOut() {
  const rng = mulberry(PI.seed * 7919), S = 240, pts = []; let inside = 0;
  for (let i = 0; i < PI.N; i++) { const u = rng(), v = rng(), inn = u * u + v * v <= 1; inside += inn; if (PI.N <= 4000 || i % Math.ceil(PI.N / 4000) === 0) pts.push([u, v, inn]); }
  const est = 4 * inside / PI.N, typ = 1.64 / Math.sqrt(PI.N);
  return `<div class="pi-wrap"><svg viewBox="0 0 ${S} ${S}" class="pi" role="img" aria-label="${PI.N} random points in the unit square; ${inside} fall inside the quarter circle.">
      <rect x="0" y="0" width="${S}" height="${S}" class="pi-box"/><path class="pi-arc" d="M0,${S} A${S},${S} 0 0 1 ${S},0"/>
      ${pts.map(([u, v, inn]) => `<circle cx="${(u * S).toFixed(1)}" cy="${(S - v * S).toFixed(1)}" r="${PI.N > 2000 ? 1.1 : 1.8}" class="${inn ? "in" : "out"}"/>`).join("")}</svg>
    <dl class="ro">
      <dt>Inside</dt><dd>${inside.toLocaleString("en-GB")} of ${PI.N.toLocaleString("en-GB")} points, a fraction of ${num(inside / PI.N, 4)}</dd>
      <dt>Estimate</dt><dd>π ≈ 4 · ${num(inside / PI.N, 4)} = <b>${num(est, 4)}</b></dd>
      <dt>Error</dt><dd>${num(Math.abs(est - Math.PI), 4)} this run · typical 1.64/√N = ${num(typ, 4)} ${flag(Math.abs(est - Math.PI) <= 2 * typ ? "ok" : "bad", Math.abs(est - Math.PI) <= 2 * typ ? "within two typical errors" : "an unlucky run (outside two typical errors)")}</dd>
    </dl></div>`;
}
function initPi(body) {
  body.innerHTML = `<div class="ctl"><label>Points N <select>${[100, 1000, 10000, 100000].map(n => `<option value="${n}"${n === PI.N ? " selected" : ""}>${n.toLocaleString("en-GB")}</option>`).join("")}</select></label><button class="preset" type="button">Throw again</button></div><div class="out"></div>`;
  const sel = body.querySelector("select"), btn = body.querySelector("button"), out = body.querySelector(".out"), draw = () => { out.innerHTML = piOut(); };
  sel.addEventListener("change", () => { PI.N = +sel.value; draw(); }); btn.addEventListener("click", () => { PI.seed++; draw(); }); draw();
}
// Explorer: Euler–Maruyama paths of an Ornstein–Uhlenbeck process relaxing into the stationary band (slides 17–18).
const OU = { th: 1.5, sg: 1, dt: 0.05 };
function ouOut() {
  const { th, sg, dt } = OU, Tm = 4, n = Math.round(Tm / dt), sd = sg / Math.sqrt(2 * th), W = 560, H = 230, L = 30, R = 10, T = 10, B = 24, PW = W - L - R, PH = H - T - B;
  const x = t => L + t / Tm * PW, y = v => T + PH / 2 - Math.max(-3.6, Math.min(3.6, v)) / 3.6 * PH / 2, rng = mulberry(11);
  const paths = [-3, -1.5, 1.5, 3, -3, 3].map(x0 => { let v = x0; const p = [[0, v]]; for (let k = 1; k <= n; k++) { v = v + th * (0 - v) * dt + sg * Math.sqrt(dt) * gauss(rng); p.push([k * dt, v]); } return p; });
  const d = p => "M" + p.map(([t, v]) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(" L");
  const stable = th * dt < 2;
  return `<svg viewBox="0 0 ${W} ${H}" class="ou" role="img" aria-label="Six Ornstein–Uhlenbeck paths started at ±1.5 and ±3 relax towards 0 and then fluctuate inside the band ±${num(2 * sd, 2)}.">
      <rect class="band" x="${L}" y="${y(2 * sd)}" width="${PW}" height="${y(-2 * sd) - y(2 * sd)}"/>
      ${[-3, -2, -1, 0, 1, 2, 3].map(v => `<line class="${v ? "grid" : "axis"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
      ${[0, 1, 2, 3, 4].map(t => `<text class="tick" x="${x(t)}" y="${H - 8}" text-anchor="middle">${t}</text>`).join("")}
      <line class="ann" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke-dasharray="4 3"/>
      ${paths.map(p => `<path class="line thin s1" d="${d(p)}"/>`).join("")}<text class="note" x="${W - R - 4}" y="${y(2 * sd) - 4}" text-anchor="end">stationary ±2σ band</text></svg>
    <dl class="ro">
      <dt>Stationary sd</dt><dd>σ / √(2θ) = ${num(sg, 2)} / √(2 · ${num(th, 2)}) = ${num(sd, 3)}, so the band is ±${num(2 * sd, 2)}</dd>
      <dt>Relaxation time</dt><dd>1/θ = ${num(1 / th, 2)} time units: the start is forgotten after a few of these</dd>
      <dt>Step</dt><dd>Δt = ${dt}, ${n} steps to t = 4 ${flag(stable ? "ok" : "bad", stable ? "θ·Δt < 2: the explicit scheme stays stable" : "θ·Δt ≥ 2: Euler–Maruyama overshoots and blows up")}</dd>
    </dl>`;
}

function lecture0() {
  const road = [[1, "Probability refresher", "conditional probabilities; normal and scale-free distributions", 1], [2, "Markov chains", "transition matrices, mixing times, Perron–Frobenius, PageRank", 3], [3, "Monte Carlo", "law of large numbers, variance reduction, importance sampling", 4], [4, "MCMC", "Metropolis–Hastings and Gibbs samplers", 6],
    [5, "Random processes", "Brownian motion in 2, 3 and more dimensions; diffusion equation; Lévy processes", 10], [6, "SDEs", "Itô calculus, Ornstein–Uhlenbeck, examples from biology", 11], [7, "Numerical SDEs", "strong and weak error; Euler–Maruyama and Milstein", 12]];
  const roadHTML = `<div class="road">${road.map(([k, t, b, n], i) => `<div class="rd ${i < 4 ? "dt" : "ct"}"><div class="rk">${i < 4 ? "discrete time" : "continuous time"} · ${k}</div><b>${t}</b><p>${b}</p><p class="muted">${lecLink(n, `from lecture ${n}`)}</p></div>`).join("")}</div>`;
  const H = {
    who: "Who, what, how much", bday: "Warm-up: the birthday problem", det: "Deterministic versus stochastic", hur: "Four hurdles, four toolkits", road: "Roadmap of the course",
    mc: "Markov chains: one step of memory", mcint: "Monte Carlo: integrate by sampling", mcmc: "Markov chain Monte Carlo", bm: "Brownian motion and diffusion",
    sde: "Stochastic differential equations", num: "Simulating SDEs numerically", where: "Where these models show up",
  };
  return `${head(l)}
    <p class="lead">The first session says what the course is about and why it is hard: a stochastic model does not predict the state of a system but the probability of every state, and a stochastic simulation draws trajectories that follow that probability. Everything that follows, from Markov chains to numerical schemes for stochastic differential equations, is a way around one of four hurdles that stand between the model and the trajectories. The deck is the "SMS0" file in the OPAL folder Lecture2026; the course overview in OPAL counts this session as lecture 0.</p>
    <p>How to read this page: the first four sections (organisation, the birthday problem, deterministic versus stochastic, the four hurdles) need only school maths. From the roadmap on, the lecture previews the whole course in a few slides. Every term there is explained here in a sentence or two and every formula gets a small worked example, but the full treatment comes in the lecture each section links to; it is fine to read these previews for the big picture only.</p>
    ${before([
      `School probability: probabilities as fractions (a fair die shows a six with probability 1/6), "at least one" via 1 − P(none), and the average (mean) of a list of numbers. ${lecLink(1, "Lecture 1")} rebuilds all of this properly.`,
      `School notation: the sum sign Σ (capital sigma: Σ<sub>i=1</sub><sup>3</sup> i = 1 + 2 + 3) and the product sign ∏ (capital pi: ∏<sub>i=1</sub><sup>3</sup> i = 1 · 2 · 3).`,
      `School calculus: the derivative f′ (slope) and second derivative f″, e<sup>x</sup> and ln, and a square root growing slowly (√100 = 10, √10,000 = 100).`,
      `For the matrix parts (Markov chains): multiplying a row of numbers by a column, as in ${inL(3, "n steps: Chapman–Kolmogorov", "lecture 3's refresher")}.`,
    ])}
    ${terms([
      ["Acceptance probability ρ", "ρ, read rho: in Metropolis–Hastings, the probability of moving to the proposed state; otherwise the chain stays put.", H.mcmc],
      ["Anomalous diffusion", "Spreading whose mean squared displacement grows like t<sup>α</sup> with α ≠ 1: slower (sub-) or faster (super-) than ordinary diffusion.", H.bm],
      ["Brownian motion W<sub>t</sub>", "The random path of a particle kicked by many molecules; the limit of a random walk with ever smaller steps. Its increment over time dt is normal with variance dt.", H.bm],
      ["Central limit theorem", "Sums or averages of many independent random values are approximately normally distributed.", H.mcint],
      ["Credits (ECTS)", "European study credits; one credit stands for about 30 hours of study, so 5 credits are 150 hours.", H.who],
      ["Deterministic model", "A model that returns exactly one future for a given present state.", H.det],
      ["Diffusion coefficient D", "How fast a substance spreads; units area per time, e.g. µm²/s.", H.bm],
      ["Diffusion equation", "∂p/∂t = DΔp: the equation for how the probability density p of a Brownian particle spreads in time; Δ (the Laplacian) adds up the second derivatives in all directions.", H.bm],
      ["Drift a and noise strength b", "In an SDE dX = a dt + b dW: a is the deterministic tendency per unit time, b scales the random kicks.", H.sde],
      ["Ergodic chain", "A Markov chain that can reach every state and returns to each in finite mean time; it forgets its start. Lecture 3 defines it.", H.mc],
      ["Euler–Maruyama scheme", "The simplest SDE solver: X<sub>n+1</sub> = X<sub>n</sub> + a Δt + b ΔW with a normal random increment ΔW.", H.num],
      ["Geometric Brownian motion", "The SDE dX = μX dt + σX dW, whose noise grows with X; the standard model of a stock price.", H.num],
      ["Gibbs sampling", "An MCMC method that updates one coordinate at a time, drawing it from its distribution given all the others.", H.mcmc],
      ["Gumbel distribution", "A distribution for extremes, such as the highest flood of a year; named on the slides as one that needs a sampling algorithm.", H.hur],
      ["Importance sampling", "A Monte Carlo trick: sample more often where the integrand matters and correct with weights.", H.road],
      ["Itô's lemma", "The chain rule for functions of an SDE solution; it has an extra ½ b² f″ term that ordinary calculus lacks.", H.sde],
      ["Law of large numbers", "The average of many independent samples approaches the expected value as their number grows.", H.mcint],
      ["Lévy process", "A random process with heavy-tailed jumps (occasional very long steps), giving anomalous diffusion.", H.bm],
      ["Logistic growth", "Growth that starts exponential and levels off at a carrying capacity K: dx/dt = r x (1 − x/K).", H.det],
      ["Markov chain", "A random process whose next state depends only on the current one. Lecture 3.", H.mc],
      ["Markov chain Monte Carlo (MCMC)", "Sampling a complicated distribution by running a Markov chain that has it as stationary distribution.", H.mcmc],
      ["Master equation", "An equation for how the probabilities of all states change over time.", H.hur],
      ["Mean squared displacement (MSD)", "E[|x(t)|²]: the average squared distance from the start after time t.", H.bm],
      ["Mean, variance, standard deviation", "Mean E[X]: the probability-weighted average. Variance: the mean squared distance from the mean, E[X²] − E[X]². Standard deviation: its square root, the typical spread.", H.who],
      ["Metropolis–Hastings", "An MCMC recipe: propose a move, accept it with probability ρ, otherwise stay.", H.mcmc],
      ["Milstein scheme", "Euler–Maruyama plus a correction term ½ b b′ (ΔW² − Δt); strong order 1.", H.num],
      ["Mixing time", "How many steps a Markov chain needs to forget its start, i.e. to get close to its stationary distribution.", H.mc],
      ["Monte Carlo method", "Computing a number (an area, an integral, an expectation) by averaging over random samples.", H.mcint],
      ["Non-Markovian process", "A process whose next step depends on more of its history than the current state.", H.hur],
      ["Normalising constant", "The constant that makes a density integrate to 1; often unknown for posteriors in Bayesian inference.", H.mcmc],
      ["Ornstein–Uhlenbeck process", "dX = θ(μ − X) dt + σ dW: noise plus a pull of strength θ (theta) back to the level μ (mu); σ (sigma) is the noise strength.", H.sde],
      ["PageRank", "Google's ranking of web pages: the stationary distribution of a surfer who clicks random links.", H.mc],
      ["PDE", "Partial differential equation: an equation with derivatives in several variables, such as time and space.", H.hur],
      ["Perron–Frobenius theorem", "A theorem on matrices with positive entries; for Markov chains it guarantees a unique stationary distribution.", H.mc],
      ["Proposal q(y | x)", "In Metropolis–Hastings: the distribution from which a candidate y is drawn when the chain is at x.", H.mcmc],
      ["Realisation (trajectory)", "One simulated or observed history x₀, x₁, x₂, … of a random process.", H.det],
      ["Scale-free distribution", "A heavy-tailed distribution with no typical size (a power law), such as city sizes; named in the roadmap.", H.road],
      ["Stationary distribution π", "π, read pi: the distribution over states that one step of a Markov chain leaves unchanged, π = πP.", H.mc],
      ["Stochastic differential equation (SDE)", "An ordinary differential equation with an added random term driven by Brownian motion.", H.sde],
      ["Stochastic model", "A model that gives the probability of every possible state rather than one predicted state.", H.det],
      ["Strong and weak error", "Strong: how far a simulated path is from the exact path with the same noise. Weak: how far averages and moments are from the exact ones.", H.num],
      ["Transition matrix P", "The table of one-step probabilities of a Markov chain; row = now, column = next; rows sum to 1.", H.mc],
      ["Variance reduction", "Monte Carlo techniques that lower the spread of the estimate for the same number of samples.", H.road],
    ])}

    <h2>${H.who} (slides 2–5)</h2>
    ${plain("The organisation of the course: who teaches, how much it counts, how it is examined, and what you are expected to know already.")}
    <p>Dr. Nandu Gopan (Chair of Scientific Computing for Systems Biology) gives the lectures; the exercises are run by a student tutor of the CMS programme. The course is the module CMS-COR-SAP of the M.Sc. Computational Modeling and Simulation. Registration for the exam goes through Selma and opens in December; course enrolment is not exam registration.</p>
    ${tiles([["5", "credits"], ["150 h", "workload"], ["2/2/0/0", "lecture / exercise / tutorial / self-study"], ["12 + 12", "lectures + exercises"], ["90 min", "written exam, English"]])}
    <p>The 5 <dfn>credits</dfn> are European study credits (ECTS), about 30 hours each, hence the 150 hours. The text for the course is the lecture notes by Ivo Sbalzarini and Christoph Zechner (TU Dresden), which run from probability basics through Markov chains, Monte Carlo and MCMC to random walks, stochastic calculus, numerical SDEs and stochastic reaction networks. Slides, handouts and exam information live in the OPAL course. What to bring: working knowledge of any programming language, basic classical physics, and solid undergraduate calculus, probability and statistics. Slide 5 ends with a self-check: the mean and variance of a fair die, Bayes' theorem, and whether you have ever written a loop that draws random numbers.</p>
    ${ex("Worked example (the self-check of slide 5): mean and variance of a fair die", `<p>The <dfn>mean</dfn> (expected value) E[X] is the probability-weighted average; the <dfn>variance</dfn> Var(X) is the average squared distance from the mean, computed as E[X²] − E[X]²; the <dfn>standard deviation</dfn> is its square root, the typical spread. Each face has probability 1/6. The mean is E[X] = (1 + 2 + 3 + 4 + 5 + 6) / 6 = 21/6 = <b>3.5</b>. The second moment is E[X²] = (1 + 4 + 9 + 16 + 25 + 36) / 6 = 91/6 ≈ 15.17, so the variance is Var(X) = 91/6 − 3.5² = 91/6 − 49/4 = (182 − 147) / 12 = <b>35/12 ≈ 2.92</b>, and the standard deviation is √(35/12) ≈ 1.71. Bayes' theorem, the second item of the self-check, is ${inL(1, "Part 6 · Bayes' theorem", "Part 6 of lecture 1")}. The same computation reappears in ${exeLink(1, "tutorial 1")}.</p>`)}

    <h2>${H.bday} (slides 6–7)</h2>
    ${plain("A classic puzzle to show that intuition about probability is unreliable, and that a careful calculation beats a guess. The tool, multiplying conditional probabilities, is the chain rule of lecture 1.")}
    <p>How many people must be in a room before the chance that two of them share a birthday reaches one half? Most people guess far too high. The trick is to compute the complement, the opposite event: the probability that <em>all</em> n birthdays differ is a product of conditional probabilities, one per person, each one conditioned on all earlier people having distinct birthdays (person 2 must avoid 1 day, person 3 must avoid 2 days, …). With 365 equally likely days (no 29 February, no twins),</p>
    <div class="formula">${fx(String.raw`P(\text{shared}) = 1 - \prod_{i=1}^{n-1} \frac{365 - i}{365}`, "P(shared) = 1 − ∏<sub>i=1</sub><sup>n−1</sup> (365 − i) / 365")}</div>
    <p>∏ (capital pi) multiplies the factors for i = 1 to n − 1, just as Σ adds; n is the number of people.</p>
    ${ex("Worked example (added here): three people, then ten", `<p>n = 3: all different with probability 365/365 · 364/365 · 363/365 = 1 · 0.99726 · 0.99452 = 0.99180, so P(shared) = 1 − 0.99180 = <b>0.0082</b>, less than 1 %. n = 10: multiplying the nine factors 364/365 down to 356/365 gives 0.883, so P(shared) = <b>0.117</b>. The probability grows fast because the factors keep shrinking and there are ever more of them.</p>`)}
    ${chart("bday", leg([[1, "at least two share a birthday"], [2, "all birthdays different"]]))}${cap("Blue: the chance that at least two of n people share a birthday; orange: the opposite, all different. The two always add to 100 %. What to look for: the blue curve crosses the dashed 50 % line at n = 23 (50.7 %); with 50 people the chance is 97 %. Hover, or focus and use the arrow keys, to read any room size. Values computed here from the product formula; the slide shows the same curve. The chain rule behind the product is lecture 1's topic.")}
    ${tiles([["23", "people for a 50 % chance"], ["50.7 %", "exactly at n = 23"], ["97 %", "with 50 people"], [fx(String.raw`\approx 1 - e^{-n^2/730}`, "≈ 1 − e<sup>−n²/730</sup>"), "handy approximation (context, not on the slides)"]])}
    ${why("Context, not on the slides: why the intuition fails", "<p>People compare n with 365 and expect a number near 180. But the event is about <em>pairs</em>, and 23 people form 23 · 22 / 2 = 253 pairs, each sharing a birthday with probability 1/365. The expected number of sharing pairs is 253/365 ≈ 0.69, which already makes a shared birthday more likely than not. The product formula makes this exact; the pair count makes it believable.</p>")}
    ${oops("Computing the chance that someone shares <em>your</em> birthday. That is 1 − (364/365)<sup>n−1</sup>, only 6 % for 23 people; the puzzle asks about any pair in the room.")}

    <h2>${H.det} (slide 8)</h2>
    ${plain("A deterministic model gives one future; a stochastic model gives the probability of every possible future. Simulating a stochastic model means drawing many possible futures and looking at how they spread.")}
    <p>A <dfn>deterministic model</dfn> takes today's state and returns exactly one future curve. A <dfn>stochastic model</dfn> returns, for every time, the probability of every possible state, and a simulation then draws individual trajectories (<dfn>realisations</dfn>, one possible history each) from it. The slide's phrase: not "it will rain tomorrow" but "a 60 % chance of rain". A 60 % forecast is neither right nor wrong on a single day; if tomorrow could be repeated many times, it would rain in 60 % of them. The slide illustrates this with <dfn>logistic growth</dfn> of a population: growth that starts almost exponential and levels off at a carrying capacity K, dx/dt = r x (1 − x/K) with growth rate r. It shows one deterministic curve and forty stochastic realisations that fan out around it, with the spread of end states at t = 10 drawn as a histogram.</p>
    ${ex("Worked example (added here): the deterministic curve in numbers", `<p>The logistic equation has the solution x(t) = K / (1 + (K/x₀ − 1) e<sup>−rt</sup>). With K = 100, r = 1, x₀ = 5: K/x₀ − 1 = 19, so x(2) = 100 / (1 + 19 e<sup>−2</sup>) = 100 / (1 + 2.57) = <b>28.0</b>; x(5) = 100 / (1 + 19 · 0.0067) = <b>88.7</b>; x(10) = <b>99.9</b>. The deterministic model says "99.9 at t = 10", full stop. The stochastic model says "somewhere around 100, give or take", and for a small start such as x₀ = 2 it could also say "extinct with some probability", which the deterministic curve can never show.</p>`)}
    ${chart("logistic", leg([[2, "deterministic model"], [1, "stochastic realisations"]]))}${cap("Logistic growth dx = r x (1 − x/K) dt plus demographic noise (random births and deaths, whose effect is largest when the population is small), K = 100, r = 1, from x₀ = 5. The thick orange line is the deterministic solution, the thin blue lines are fourteen realisations. What to look for: the realisations spread most during the steep rise and then wobble around 100. They are generated on this page with a simple noise model, so they resemble but do not reproduce the slide's forty; hover the right edge for the spread at t = 10.")}
    ${oops("Taking the average of the realisations as \"the\" answer. The average is one summary; the spread, and rare events such as extinction, are exactly what the stochastic model adds.")}

    <h2>${H.hur} (slide 9)</h2>
    ${plain("Four separate difficulties stand between a stochastic model and a simulation of it. Each part of the course tackles one of them, so this slide is the map of the whole course.")}
    <p>The goal is to predict how the probability over system states evolves in time, x<sub>t</sub> ~ P(X, t | X₀, t₀) (read: the state at time t is distributed according to the probability of each state X at time t, given the state X₀ at the start time t₀), and to generate trajectories x₀, x₁, x₂, … that follow it. Each of four obstacles has a part of the course devoted to it.</p>
    <ul class="cmp two">
      <li><b>Hurdle 1</b><span class="v">P is rarely known in closed form: it is the solution of a governing equation, often a <dfn>PDE</dfn> (partial differential equation, with derivatives in several variables such as time and space).</span><span class="muted">→ master equations: equations for how the probability of every state changes over time</span></li>
      <li><b>Hurdle 2</b><span class="v">Samples from P cannot be drawn directly: uniform numbers are easy, <dfn>Gumbel</dfn> (a distribution for extremes, such as a year's highest flood) or exponential ones need an algorithm.</span><span class="muted">→ sampling algorithms (${lecLink(2, "lecture 2")})</span></li>
      <li><b>Hurdle 3</b><span class="v">Time is continuous: there is no natural list x₁, x₂, …, only a function x(t) known in probability.</span><span class="muted">→ stochastic calculus and SDEs</span></li>
      <li><b>Hurdle 4</b><span class="v">P may depend on the whole history of the system, not only on its current state.</span><span class="muted">→ <dfn>non-Markovian processes</dfn></span></li>
    </ul>
    ${ex("Worked example (added here): one everyday instance per hurdle", `<p><b>1.</b> The chance that an epidemic has exactly k infected people next week follows from a master equation with one unknown per k; nobody writes the answer down in a formula. <b>2.</b> Your computer can give a uniform number in [0, 1), but not directly a Gumbel-distributed flood height; ${lecLink(2, "lecture 2")} shows how to transform one into the other. <b>3.</b> A pollen grain in water moves continuously; there is no "next step", so the step-by-step tools of lecture 3 need a continuous-time version. <b>4.</b> A patient's chance of recovering tomorrow depends on how long they have already been ill, not only on whether they are ill today.</p>`)}
    ${tryit([
      ["Mean and variance of a fair four-sided die (faces 1 to 4)?", `<p>Mean (1 + 2 + 3 + 4)/4 = <b>2.5</b>. E[X²] = (1 + 4 + 9 + 16)/4 = 7.5, so the variance is 7.5 − 2.5² = 7.5 − 6.25 = <b>1.25</b>.</p>`],
      ["Birthday problem with only 2 people: what is P(shared)?", `<p>All different: 365/365 · 364/365 = 0.99726, so P(shared) = <b>1/365 ≈ 0.0027</b>.</p>`],
      ["Is \"tomorrow's maximum temperature will be 14 °C\" a deterministic or a stochastic statement? Rewrite it as the other kind.", `<p>Deterministic: one value. Stochastic version, for example: "tomorrow's maximum will be between 12 and 16 °C with probability 80 %", or a whole distribution over temperatures.</p>`],
    ])}

    <h2>${H.road} (slides 10–11, 15)</h2>
    ${plain("The order in which the course takes the four hurdles: first everything in discrete time (steps n = 0, 1, 2, …), then continuous time.")}
    <p>Part I works in discrete time, part II in continuous time. The lecture numbers below follow the topic list on the OPAL course overview; the dates come from the Monday slots on the ${lecLink(0, "board")}.</p>
    ${roadHTML}
    <p>The words on the cards, in one line each (each is treated properly in its lecture): <dfn>scale-free distributions</dfn> have no typical size, like city populations (a power law); a <dfn>mixing time</dfn> is how long a Markov chain needs to forget its start; <dfn>Perron–Frobenius</dfn> is the theorem that guarantees a unique long-run distribution; <dfn>PageRank</dfn> ranks web pages by that long-run distribution; the <dfn>law of large numbers</dfn> says averages of many samples settle at the expected value; <dfn>variance reduction</dfn> and <dfn>importance sampling</dfn> make Monte Carlo estimates less noisy for the same effort; MCMC, Brownian motion, SDEs and the numerical schemes get their own sections below.</p>

    <h2>${H.mc} (slide 12)</h2>
    ${plain("A Markov chain is the simplest random process with memory: tomorrow depends on today, but not on yesterday. Its whole behaviour is one table of probabilities, and after enough steps it forgets where it started. Lecture 3 covers this in full.")}
    <p>A <dfn>Markov chain</dfn> has the property that the next state depends on the current one and on nothing before it:</p>
    <div class="formula">${fx(String.raw`P(X_{n+1} = x_j \mid X_n = x_i, \dots, X_0) = P(X_{n+1} = x_j \mid X_n = x_i) = P_{ij}`, "P(X<sub>n+1</sub> = x<sub>j</sub> | X<sub>n</sub> = x<sub>i</sub>, …, X₀) = P<sub>ij</sub>")}</div>
    <p>Read "|" as "given": the probability of state x<sub>j</sub> next, given the current state x<sub>i</sub> and the whole past, equals the probability given only x<sub>i</sub>. The numbers P<sub>ij</sub> form the <dfn>transition matrix</dfn> P (row = state now, column = state next); its rows sum to one, and n steps ahead are given by the matrix power P<sup>n</sup>. The slide's weather chain has three states. From a sunny day: 60 % sunny again, 30 % cloudy, 10 % rainy. From a cloudy day: 30 % sunny, 40 % cloudy, 30 % rainy. From a rainy day: 20 % sunny, 40 % cloudy, 40 % rainy. (Lecture 3 uses a slightly different weather matrix; the ideas are the same.)</p>
    <div class="tt-wrap"><table class="tt"><tr><th>from \\ to</th><th>Sunny</th><th>Cloudy</th><th>Rainy</th></tr>${WP.map((r, i) => `<tr><th>${WN[i]}</th>${r.map(v => `<td>${v.toFixed(1)}</td>`).join("")}</tr>`).join("")}</table></div>
    ${ex("Worked example (added here): the weather in two days", `<p>Sunny today. Sunny in two days means sunny–sunny, cloudy–sunny or rainy–sunny for tomorrow–after: 0.6 · 0.6 + 0.3 · 0.3 + 0.1 · 0.2 = 0.36 + 0.09 + 0.02 = <b>0.47</b>. Cloudy in two days: 0.6 · 0.3 + 0.3 · 0.4 + 0.1 · 0.4 = 0.18 + 0.12 + 0.04 = 0.34; rainy: 0.6 · 0.1 + 0.3 · 0.3 + 0.1 · 0.4 = 0.06 + 0.09 + 0.04 = 0.19. The three add to 1. This is the first row of P², the matrix multiplied by itself.</p>`)}
    ${chart("mix", leg(WN.map((w, i) => [i + 1, `start ${w.toLowerCase()}`])))}${cap("The chance of a sunny day n days ahead, one curve per starting weather (the first column of P<sup>n</sup>, computed here). What to look for: the curves start at 100 %, 0 % and 0 %, pass 47 % (from sunny) at day 2 as in the worked example, and meet at the dashed line, 39 %, after about a week: the chain has mixed and forgotten its start. Hover, or focus and use the arrow keys, to read single days.")}
    ${ex("Worked example: the stationary distribution π = πP", `<p>A distribution π (read pi) over the three states is a <dfn>stationary distribution</dfn> if one more step leaves it unchanged, π = πP. Writing π = (s, c, r) and using the columns of the table: s = 0.6 s + 0.3 c + 0.2 r, c = 0.3 s + 0.4 c + 0.4 r, r = 0.1 s + 0.3 c + 0.4 r, with s + c + r = 1. The first equation gives 0.4 s = 0.3 c + 0.2 r, the third 0.6 r = 0.1 s + 0.3 c. Eliminating step by step: from the third, s = 6 r − 3 c; into the first, 2.4 r − 1.2 c = 0.3 c + 0.2 r, so 2.2 r = 1.5 c, c = 22 r / 15 ≈ 1.467 r, and s = 6 r − 4.4 r = 1.6 r. Normalising, r (1.6 + 1.467 + 1) = 1 gives r = 0.246, c = 0.361, s = 0.393: <b>sunny 39 %, cloudy 36 %, rainy 25 %</b>, as on the slide. The powers in the chart above converge to exactly this row.</p>`)}
    <p>The slide's keywords: for an <dfn>ergodic</dfn> chain (one that can reach every state and keeps returning; lecture 3 makes this precise) the stationary distribution is unique, which the <dfn>Perron–Frobenius theorem</dfn> on positive matrices guarantees; the <dfn>mixing time</dfn> measures how fast the start is forgotten; and <dfn>PageRank</dfn>, Google's original ranking, is the stationary distribution of a surfer who keeps clicking random links.</p>
    ${tiles([["π = πP", "stationary distribution"], ["unique", "for an ergodic chain (Perron–Frobenius)"], ["mixing time", "how fast the start is forgotten"], ["PageRank", "stationary distribution of a random web surfer"]])}
    ${oops("Expecting the stationary distribution to depend on today's weather. It does not: that is the point of \"forgetting the start\". Today's weather matters for the next few days only.")}

    <h2>${H.mcint} (slide 13)</h2>
    ${plain("Monte Carlo computes a number by random sampling: to find an area, throw random points and count how many land inside. It is slow to get very precise, but the speed does not depend on the number of dimensions, which makes it the method of choice for high-dimensional problems.")}
    <p>The <dfn>Monte Carlo method</dfn> on the slide: throw N uniform random points into the unit square (side 1, area 1) and count the fraction that lands inside the quarter circle of radius 1 (the points with x² + y² ≤ 1). That fraction estimates the quarter circle's area π/4, so π ≈ 4 · (points inside) / N. The estimate is a random variable: its typical error shrinks like 1/√N, and the constant in front is about 1.64 for this problem. Ten times more points buy only a factor √10 ≈ 3.2 in accuracy. The 1/√N law holds in any dimension, which is why Monte Carlo beats grid-based integration in high dimensions; variance reduction and importance sampling shrink the constant, not the exponent. Behind it are the <dfn>law of large numbers</dfn> (averages of many samples settle at the true value) and the <dfn>central limit theorem</dfn> (their error is approximately normally distributed), both in ${lecLink(4, "lecture 4")}.</p>
    ${ex("Worked example (slide 13): the slide's run", `<p>1,500 points, 1,178 inside. Fraction 1,178 / 1,500 = 0.7853, so π ≈ 4 · 0.7853 = <b>3.141</b>. Expected typical error: 1.64 / √1,500 = 1.64 / 38.7 ≈ <b>0.042</b>, so an estimate anywhere between about 3.06 and 3.22 would have been normal; this run was lucky. For a typical error of 0.005 you would need (1.64 / 0.005)² ≈ 108,000 points.</p>`)}
    ${chart("mcerr")}${cap("Typical error 1.64/√N of the π estimate for N = 100 up to a million points, on a logarithmic axis (each grid step is a factor 10). What to look for: every factor 100 in N removes one factor 10 in error. Hover a bar for the slide's single-run estimate at that N. The 1.64 is 4·√(p(1 − p)) with p = π/4, the standard deviation of a binomial fraction scaled by 4 (derivation added here).")}
    ${lab("pi", "throw points into the square and estimate π", "Choose the number of points N. Blue dots fell inside the quarter circle, grey ones outside; the read-out turns the fraction inside into an estimate of π and compares its error with the typical error 1.64/√N. <b>Throw again</b> draws a new set. What to look for: with 100 points the estimate jumps around by about ±0.16 between throws, with 100,000 by about ±0.005.")}
    ${why("Context, not on the slides: where the 1.64 comes from", "<p>Each point is inside with probability p = π/4 ≈ 0.785, so the count of insiders is binomial (the number of successes in N independent yes/no trials) with variance N p (1 − p). The fraction has standard deviation √(p (1 − p) / N), and the estimate 4 · fraction has 4 · √(0.785 · 0.215) / √N ≈ 1.64 / √N. This is the law of large numbers and the central limit theorem at work; lecture 4 makes both precise.</p>")}
    ${oops("Expecting ten times more points to give ten times more accuracy. The error shrinks like 1/√N: ten times more accuracy costs a hundred times more points.")}

    <h2>${H.mcmc} (slide 14)</h2>
    ${plain("When you cannot sample a complicated distribution directly, build a Markov chain that wanders through the states in the right proportions, and use its states as samples. This combines the two previous sections and is the workhorse of Bayesian statistics. Lectures 6–8 of the course (planned).")}
    <p>The problem: draw samples from a complicated, high-dimensional target π that is known only up to a constant, as posteriors in Bayesian inference typically are (the <dfn>normalising constant</dfn>, which makes the density integrate to 1, is the hard part). The idea of <dfn>Markov chain Monte Carlo</dfn> (MCMC): build a Markov chain whose stationary distribution is exactly π, run it, and use its states as samples. <dfn>Metropolis–Hastings</dfn> proposes a move y from the <dfn>proposal distribution</dfn> q(y | x) (read "q of y given x") at the current state x and accepts it with probability</p>
    <div class="formula">${fx(String.raw`\rho = \min\left\{\, 1,\ \frac{f(y)\, q(x \mid y)}{f(x)\, q(y \mid x)} \right\}`, "ρ = min { 1, f(y) q(x | y) / ( f(x) q(y | x) ) }")}</div>
    <p>otherwise the chain stays at x. Here ρ (read rho) is the <dfn>acceptance probability</dfn>, f the target density up to the constant, and min{1, …} takes the smaller of 1 and the ratio. <dfn>Gibbs sampling</dfn> instead updates one coordinate at a time from its distribution given all the other coordinates. The slide shows a random-walk Metropolis chain on a two-peaked target: the first 150 steps wander from the start into one peak, later samples fill both.</p>
    ${ex("Worked example (added here): three Metropolis decisions", `<p>Take a symmetric proposal, q(x | y) = q(y | x), so the q's cancel and ρ = min{1, f(y)/f(x)}. At x with f(x) = 2: a proposal with f(y) = 3 gives ρ = min{1, 1.5} = <b>1</b>, always accepted (uphill). One with f(y) = 1 gives ρ = <b>0.5</b>: draw u uniform on [0, 1); u = 0.3 accepts, u = 0.8 rejects and the chain stays at x. One with f(y) = 0.02 gives ρ = 0.01: almost always rejected. Downhill moves are allowed, but rarely, in proportion to how much less likely the new state is.</p>`)}
    ${why("Context, not on the slides: why 'up to a constant' is enough", "<p>If f(x) = π(x) · Z with an unknown normalising constant Z, the ratio f(y)/f(x) = π(y)/π(x) does not contain Z. Metropolis–Hastings only ever evaluates ratios, so it never needs the constant, which is exactly the quantity that is intractable for a posterior: Z = ∫ P(data | θ) P(θ) dθ.</p>")}
    ${oops("Rejecting a move and then just drawing again without recording anything. A rejected proposal means the chain stays at x for this step, and x counts again as a sample.")}
    ${tryit([
      ["In the weather chain of this page, it is rainy today. What is the probability of sunshine in two days?", `<p>Rainy row (0.2, 0.4, 0.4) times the Sunny column (0.6, 0.3, 0.2): 0.2 · 0.6 + 0.4 · 0.3 + 0.4 · 0.2 = 0.12 + 0.12 + 0.08 = <b>0.32</b>.</p>`],
      ["A Monte Carlo run with N = 10,000 points finds 7,880 inside the quarter circle. What is the π estimate, and is it within the typical error?", `<p>π ≈ 4 · 0.788 = <b>3.152</b>. Typical error 1.64/√10,000 = 0.0164; the run is off by 3.152 − 3.1416 = 0.0104, <b>within</b> one typical error.</p>`],
      ["Metropolis with a symmetric proposal: f(x) = 4, f(y) = 1. What is ρ? With u = 0.2, does the chain move?", `<p>ρ = min{1, 1/4} = <b>0.25</b>. u = 0.2 ≤ 0.25, so the move is <b>accepted</b>.</p>`],
    ])}

    <h2>${H.bm} (slide 16)</h2>
    ${plain("Part II of the course leaves step-by-step time. Brownian motion is a random walk with infinitely many infinitely small steps: the jittery path of a pollen grain in water. Its key property is that the typical distance travelled grows like the square root of time.")}
    <p><dfn>Brownian motion</dfn> is the continuum limit of a random walk with ever smaller steps. Its <dfn>mean squared displacement</dfn> (MSD, the average squared distance from the start) in d dimensions grows linearly in time,</p>
    <div class="formula"><div class="fl">${fx(String.raw`\mathrm{MSD}(t) = E\big[|x(t)|^2\big] = 2\,d\,D\,t`, "MSD(t) = E[|x(t)|²] = 2 d D t")}</div><div class="fl">${fx(String.raw`\frac{\partial p}{\partial t} = D\,\Delta p`, "∂p/∂t = D Δp")}<span class="fn">diffusion equation for the density p of the position</span></div></div>
    <p>where E[…] is the average over many paths, d the number of dimensions, t the time and D the <dfn>diffusion coefficient</dfn> (how fast the substance spreads, in area per time). The probability density of the position obeys the <dfn>diffusion equation</dfn>: ∂p/∂t (read "partial p by partial t") is the rate of change of p in time, and Δ (the Laplacian) adds up the second derivatives of p in all space directions. <dfn>Lévy processes</dfn> break the linear law: E[|x(t)|²] ∝ t<sup>α</sup> (∝ reads "proportional to", α is alpha) with α ≠ 1, called <dfn>anomalous diffusion</dfn>. The slide contrasts a Brownian path (Gaussian increments, compact and tangled) with a Lévy flight (heavy-tailed jumps, long straight excursions) of the same number of steps.</p>
    ${chart("msd", leg([[1, "Brownian, α = 1"], [2, "subdiffusion, α = 0.5"], [3, "superdiffusion, α = 1.5"]]))}${cap("Mean squared displacement in one dimension with D = 1; the curves are the formulas 2t, 2t<sup>0.5</sup> and 2t<sup>1.5</sup>, drawn here. What to look for: only the Brownian case is a straight line through the origin; subdiffusion bends down (spreading slows, as in a crowded cell), superdiffusion bends up. Hover to read the values at any time.")}
    ${ex("Worked example: how far does a molecule diffuse?", "<p>A small protein in water has D ≈ 100 µm²/s (µm: micrometre, a thousandth of a millimetre). In three dimensions after t = 1 s, E[r²] = 2 · 3 · 100 · 1 = 600 µm², so the root-mean-square distance is √600 ≈ 24.5 µm. After 100 s it is √60,000 ≈ 245 µm: a hundred times longer takes it only ten times farther. That square-root growth is why diffusion works across a cell (10 µm in a fraction of a second) but not along a metre of nerve.</p>")}
    ${oops("Expecting twice the time to give twice the distance. The squared distance doubles; the distance itself grows by √2 ≈ 1.41.")}

    <h2>${H.sde} (slide 17)</h2>
    ${plain("A stochastic differential equation is an ordinary rate equation plus random kicks. It describes systems that follow a trend but are constantly jostled by noise, such as a small population or a molecule in a cell. The noise forces a modified calculus.")}
    <p>An <dfn>SDE</dfn> adds noise to an ordinary differential equation:</p>
    <div class="formula">${fx(String.raw`dX_t = a(X_t, t)\, dt + b(X_t, t)\, dW_t`, "dX<sub>t</sub> = a(X<sub>t</sub>, t) dt + b(X<sub>t</sub>, t) dW<sub>t</sub>")}</div>
    <p>Reading it: over a tiny time step dt the state X changes by dX<sub>t</sub>; a is the <dfn>drift</dfn> (the deterministic tendency per unit time), b the noise strength, and dW<sub>t</sub> the increment of a Brownian motion W over that step, a normal random number with mean 0 and variance dt. Noise changes the chain rule: <dfn>Itô's lemma</dfn> for a function f of the solution reads</p>
    <div class="formula">${fx(String.raw`df(X_t) = \Big(a f' + \tfrac12 b^2 f''\Big)\, dt + b f'\, dW_t`, "df(X<sub>t</sub>) = (a f′ + ½ b² f″) dt + b f′ dW<sub>t</sub>")}</div>
    <p>with an extra second-derivative term ½ b² f″ that ordinary calculus does not have (f′ and f″ are the first and second derivatives of f). The <dfn>Ornstein–Uhlenbeck process</dfn> dX<sub>t</sub> = θ (μ − X<sub>t</sub>) dt + σ dW<sub>t</sub> is solvable and mean-reverting: θ (theta) is how strongly X is pulled back towards the level μ (mu), and σ (sigma) the noise strength; paths from any start relax to the same stationary band around μ. Examples in the course: population dynamics, genetics, protein kinetics.</p>
    ${ex("Worked example (added here, standard result): the Ornstein–Uhlenbeck band", `<p>The stationary spread of the OU process is σ / √(2θ). With θ = 1.5 and σ = 1, as in the explorer's default: 1 / √3 ≈ <b>0.577</b>, so about 95 % of the time a settled path stays within μ ± 2 · 0.577 = μ ± 1.15. The start is forgotten on the time scale 1/θ = 0.67: after a few multiples of it, a path started at 3 is indistinguishable from one started at −3.</p>`)}
    ${lab("ou", "Ornstein–Uhlenbeck paths, simulated with Euler–Maruyama", "Drag <b>θ</b> (pull back to 0), <b>σ</b> (noise) and <b>Δt</b> (time step of the simulation). Six paths start at ±1.5 and ±3; the shaded band is the stationary ±2 standard deviations. What to look for: larger θ pulls the paths in faster and narrows the band; larger σ widens it; a Δt with θ · Δt ≥ 2 makes the simple scheme overshoot and blow up, which the read-out flags.")}
    ${ex("Worked example: Itô's lemma on f(W) = W²", "<p>Take X<sub>t</sub> = W<sub>t</sub> itself (a = 0, b = 1) and f(x) = x², so f′ = 2x and f″ = 2. Itô's lemma gives d(W²) = (0 · 2W + ½ · 1 · 2) dt + 2W dW = <b>dt + 2W dW</b>. Ordinary calculus would say d(W²) = 2W dW and miss the dt. Taking expectations (the dW term averages to 0), E[W<sub>t</sub>²] = t, which is exactly the mean squared displacement E[x²] = 2Dt with D = ½: the extra term is the diffusion.</p>")}

    <h2>${H.num} (slide 18)</h2>
    ${plain("SDEs rarely have a formula solution, so they are simulated in small time steps, each step adding the drift times Δt and a random kick. Two questions measure how good a scheme is: does each simulated path stay close to the true one, and do the averages come out right?")}
    <p>The <dfn>Euler–Maruyama</dfn> scheme is the Euler method with a random increment: X<sub>n+1</sub> = X<sub>n</sub> + a(X<sub>n</sub>) Δt + b(X<sub>n</sub>) ΔW<sub>n</sub>, where ΔW<sub>n</sub> ~ N(0, Δt) (read: normally distributed with mean 0 and variance Δt; in practice √Δt times a standard normal number). <dfn>Milstein</dfn> adds a correction term ½ b b′ (ΔW<sub>n</sub>² − Δt), with b′ the derivative of b. Two kinds of error are distinguished. The <dfn>strong error</dfn> measures how closely a simulated path follows the exact path driven by the same Brownian motion; the <dfn>weak error</dfn> measures how well averages and moments are reproduced. A scheme has order k if its error shrinks like Δt<sup>k</sup>. Euler–Maruyama has strong order ½ and weak order 1; Milstein has strong order 1 and weak order 1. The slide shows <dfn>geometric Brownian motion</dfn> (dX = μX dt + σX dW, noise proportional to X, the standard stock-price model) on one Brownian path: with Δt = 1/64 the Euler–Maruyama path hugs the exact solution much better than with Δt = 1/16.</p>
    ${ex("Worked example (added here): one Euler–Maruyama step by hand", `<p>Ornstein–Uhlenbeck with θ = 1.5, μ = 0, σ = 1, from X₀ = 2 with Δt = 0.1. Drift: a = θ(μ − X₀) = 1.5 · (0 − 2) = −3, times Δt gives −0.3. Noise: ΔW = √0.1 · z with a standard normal z; say z = 0.5, then ΔW = 0.316 · 0.5 = 0.158. So X₁ = 2 − 0.3 + 1 · 0.158 = <b>1.858</b>. The next step starts from 1.858 with a fresh z. (Here b = σ is constant, so b′ = 0 and Milstein gives the same step.)</p>`)}
    ${chart("order", leg([[1, "Euler–Maruyama, strong order ½"], [2, "Milstein, strong order 1"]]))}${cap("The convergence rates as curves: strong error against the number of steps per unit time (1/Δt, logarithmic axis), relative to the error at Δt = 1. What to look for: halving Δt gains a factor √2 ≈ 1.41 for Euler–Maruyama and a factor 2 for Milstein, so at 1,024 steps Milstein's error is 32 times smaller. Hover, or focus and use the arrow keys, to read the values.")}
    <div class="tt-wrap"><table class="tt"><tr><th>Scheme</th><th>Update</th><th>Strong order</th><th>Weak order</th></tr><tr><th>Euler–Maruyama</th><td>X + a Δt + b ΔW</td><td>½</td><td>1</td></tr><tr><th>Milstein</th><td>X + a Δt + b ΔW + ½ b b′ (ΔW² − Δt)</td><td>1</td><td>1</td></tr></table></div>
    ${why("Context, not on the slides: which error matters", "<p>If you want a histogram of end states, a mean first-passage time or any expectation, the weak error is what counts, and Euler–Maruyama is already first order. Only when the individual path matters, for instance when a simulated path is compared with a measured one driven by the same noise, does strong convergence pay for Milstein's extra derivative. The strong-order-½ result is exactly the √Δt scaling of the Brownian increment itself.</p>")}
    ${oops("Drawing ΔW with variance 1 instead of Δt. The kick over a step of length Δt has standard deviation √Δt; with Δt = 0.01 it is 0.1, not 1.")}
    ${tryit([
      ["A molecule has D = 10 µm²/s. In one dimension, what is its root-mean-square distance after 5 s?", `<p>MSD = 2 · 1 · 10 · 5 = 100 µm², so the distance is √100 = <b>10 µm</b>.</p>`],
      ["Euler–Maruyama for dX = −X dt + 0.5 dW from X₀ = 1 with Δt = 0.04 and a standard normal draw z = −1. What is X₁?", `<p>Drift −1 · 0.04 = −0.04. ΔW = √0.04 · (−1) = −0.2, times b = 0.5 gives −0.1. X₁ = 1 − 0.04 − 0.1 = <b>0.86</b>.</p>`],
      ["You want to cut the strong error by a factor 8. How many times more steps does Euler–Maruyama need, and how many Milstein?", `<p>Euler–Maruyama: error ∝ Δt<sup>½</sup>, so Δt must shrink by 8² = <b>64 times</b>. Milstein: error ∝ Δt, so <b>8 times</b> more steps.</p>`],
    ])}

    <h2>${H.where} (slide 19)</h2>
    <ul>
      <li><b>Population dynamics</b>: birth, death and extinction in small populations, where the deterministic curve can be badly wrong.</li>
      <li><b>Genetics</b>: random drift of gene frequencies (by chance, a gene variant becomes more or less common from one generation to the next).</li>
      <li><b>Protein kinetics</b>: reactions among a handful of molecules inside a cell, where "concentration" stops making sense.</li>
      <li><b>Web search</b>: PageRank as the long-run visit frequency of a random surfer.</li>
      <li><b>Bayesian inference</b>: MCMC samples posteriors (updated beliefs about model parameters, lecture 1's Bayes' theorem) that are known only up to a constant.</li>
      <li><b>Diffusion and transport</b>: molecules spreading by Brownian motion.</li>
    </ul>

    <h2>Take-home</h2>
    <ul>
      <li><b>What does a stochastic model predict?</b> The probability of every state at every time, not the state. A simulation draws trajectories from it and is correct only if its values follow P at every step.</li>
      <li><b>Why is stochastic simulation hard?</b> P is rarely known in closed form, it is hard to sample from, time is continuous, and P may depend on history: master equations, sampling algorithms, stochastic calculus and non-Markovian processes answer these in turn.</li>
      <li><b>How many people for a shared birthday?</b> 23, by the chain rule of conditional probabilities.</li>
      <li><b>What does a Markov chain forget?</b> Its start: the rows of P<sup>n</sup> converge to the stationary distribution π = πP.</li>
      <li><b>How fast does Monte Carlo converge?</b> Like 1/√N, in any dimension.</li>
      <li><b>What makes an SDE different from an ODE?</b> The Brownian increment of size √Δt, the extra ½ b² f″ term in Itô's lemma, and the distinction between strong and weak error.</li>
    </ul>
    <p class="muted">Next: ${lecLink(1, "lecture 1")} (26 Oct), the probability refresher the final slide announces: events, conditional probabilities, Bayes' theorem and common distributions. First tutorial: ${exeLink(1, "tutorial 1")} on 29 Oct (Pluto notebook). Slides: OPAL → Lecture2026 → SMS0 (they may not be republished).</p>`;
}

// Venn diagram of two events on a fair die: A = even, B = at least 4 (slide 7).
CHARTS.venn = narrow => {
  const W = narrow ? 340 : 600, H = narrow ? 230 : 250, cx = W / 2, cy = H / 2 - 4, r = narrow ? 78 : 92, off = narrow ? 46 : 54;
  const tip = (t, faces, p) => esc(`<b>${t}</b>faces ${faces}<br>probability ${p}`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Venn diagram of two events on a fair die. A, even numbers, holds 2, 4 and 6; B, at least four, holds 4, 5 and 6. The overlap holds 4 and 6; 1 and 3 lie outside both. P(A or B) is 3/6 plus 3/6 minus 2/6 = 4/6; exactly one of the two has probability 2/6.">
    <defs><clipPath id="vA"><circle cx="${cx - off}" cy="${cy}" r="${r}"/></clipPath></defs>
    <rect x="${narrow ? 10 : 60}" y="14" width="${W - (narrow ? 20 : 120)}" height="${H - 40}" rx="12" class="venn-box"/>
    <g class="pt" tabindex="0" data-tip="${tip("Neither A nor B", "1, 3", "2/6")}"><rect class="hit" x="${narrow ? 10 : 60}" y="14" width="${W - (narrow ? 20 : 120)}" height="${H - 40}" rx="12"/><text class="cat" x="${narrow ? 30 : 84}" y="${H - 40}">1</text><text class="cat" x="${W - (narrow ? 30 : 84)}" y="${H - 40}" text-anchor="end">3</text></g>
    <g class="pt" tabindex="0" data-tip="${tip("A only: even but below 4", "2", "1/6")}"><circle class="venn a" cx="${cx - off}" cy="${cy}" r="${r}"/><text class="cat" x="${cx - off - r / 2 - 6}" y="${cy + 5}" text-anchor="middle">2</text></g>
    <g class="pt" tabindex="0" data-tip="${tip("B only: at least 4 but odd", "5", "1/6")}"><circle class="venn b" cx="${cx + off}" cy="${cy}" r="${r}"/><text class="cat" x="${cx + off + r / 2 + 6}" y="${cy + 5}" text-anchor="middle">5</text></g>
    <g class="pt" tabindex="0" data-tip="${tip("A and B: even and at least 4", "4, 6", "2/6")}"><circle class="venn ab" cx="${cx + off}" cy="${cy}" r="${r}" clip-path="url(#vA)"/><text class="cat" x="${cx}" y="${cy - 8}" text-anchor="middle">4</text><text class="cat" x="${cx}" y="${cy + 16}" text-anchor="middle">6</text></g>
    <text class="lbl" x="${cx - off - r + 8}" y="${cy - r - 4}">A: even</text><text class="lbl" x="${cx + off + r - 8}" y="${cy - r - 4}" text-anchor="end">B: ≥ 4</text>
    <text class="note" x="${cx}" y="${H - 8}" text-anchor="middle">P(A ∪ B) = 3/6 + 3/6 − 2/6 = 4/6 · exactly one: 3/6 + 3/6 − 2 · 2/6 = 2/6</text></svg>`;
};
// Combinations C(5, r): the number of five-toss sequences with r heads (slide 8).
const C = (n, r) => { let v = 1; for (let i = 1; i <= r; i++) v = v * (n - r + i) / i; return Math.round(v); };
const Pn = (n, r) => { let v = 1; for (let i = 0; i < r; i++) v *= n - i; return v; };
CHARTS.comb = narrow => {
