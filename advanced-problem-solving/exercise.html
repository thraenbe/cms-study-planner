<script>
const { m, c, esc, U, fmt, daysUntil, lec, exe, state } = APSS;
const { rng, accept, unsat, gsatStep, isNarrow, key, leg, num, col, CHARTS, LINES, chart, lab, line, vbars, stepBar, wireSteps, mountCharts, nodeSVG } = APSSViz;
const q = new URLSearchParams(location.search).get("n");
const e = q === null ? null : c.exercises.find(x => x.n === Number(q));
const page = document.getElementById("page");
const back = `<a class="back" href="advanced-problem-solving.html">← All lectures</a>`;
const head = e => `${back}<div class="big-icon">${e.icon}</div><h1>Tutorial ${e.n} – ${esc(e.title)}</h1><p class="meta">${fmt(e.date)} · ${exe.start}–${exe.end} · ${esc(exe.room)} · your group 2, Dr. Timothy S. Lyon${e.sheet ? ` · sheet in OPAL since ${U.fmtDate(e.sheet)}` : ""}${e.planned ? " · planned topic, date assumed" : ""}</p>`;
const why = (t, body) => `<div class="why"><div class="kicker">${t}</div>${body}</div>`;
const ex = (t, body) => `<div class="ex"><div class="kicker">${t}</div>${body}</div>`;
// A task: number, title, the question in our words, then our own worked answer behind a toggle (no official solutions exist).
const task = (id, t, body, sol) => `<section class="task" id="t${id}"><div class="task-h"><span class="task-n">${id}</span><h2>${t}</h2><span class="pts">discussed in the tutorial</span></div>${body}
  <details class="sol" open><summary>Our working</summary><div class="sol-body"><span class="own">our own solution, not an official one</span>${sol}</div></details></section>`;
const ans = items => `<div class="ans">${items.map(([v, l]) => `<div class="a"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;

// ---------------- The maze of sheets 1 and 2 (16 × 16, read off the sheet; mouse bottom-left, cheese top-right) ----------------
const MAZE = [".....#.....#....", ".....#.....#....", ".....#.....#....", "...........#....", "...#####...#....", "................", "................", ".....#####..#...", ".....#..#.......", ".....#..#.......", ".....#..#...####", "###.............", ".......###......", "................", "..#.............", "..#............."];
const N = 16, WALL = MAZE.map(r => [...r].map(ch => ch === "#")), START = [15, 0], GOAL = [0, 15];
const FREE = WALL.flat().filter(w => !w).length;
const nbrs = (r, c) => [[-1, 0], [0, 1], [1, 0], [0, -1]].map(([dr, dc]) => [r + dr, c + dc]).filter(([rr, cc]) => rr >= 0 && rr < N && cc >= 0 && cc < N && !WALL[rr][cc]);
const H = { man: ([r, c]) => Math.abs(r - GOAL[0]) + Math.abs(c - GOAL[1]), euc: ([r, c]) => Math.hypot(r - GOAL[0], c - GOAL[1]), zero: () => 0 };
const H_NAME = { man: "Manhattan |Δr| + |Δc|", euc: "Euclidean √(Δr² + Δc²)", zero: "h = 0 (uniform cost, like BFS here)" };
// A* tree/graph search with an explored set: records for every cell the expansion step, the discovery step, g and f.
function astar(hk, tie) {
  const h = H[hk], idx = ([r, c]) => r * N + c, g = Array(N * N).fill(Infinity), disc = Array(N * N).fill(Infinity), expd = Array(N * N).fill(Infinity), par = Array(N * N).fill(-1);
  const open = []; let seq = 0; const push = (cell, gg, p, step) => { const i = idx(cell); g[i] = gg; par[i] = p; if (disc[i] === Infinity) disc[i] = step; open.push({ i, cell, f: gg + h(cell), g: gg, seq: seq++ }); };
  push(START, 0, -1, 0);
  const order = []; let k = 0, goalStep = -1;
  while (open.length) {
    open.sort((a, b) => a.f - b.f || (tie === "g" ? b.g - a.g : tie === "h" ? a.g - b.g : 0) || a.seq - b.seq);
    const n = open.shift(); if (expd[n.i] !== Infinity) continue;
    expd[n.i] = k; order.push(n.cell); k++;
    if (n.i === idx(GOAL)) { goalStep = k; break; }
    for (const m of nbrs(...n.cell)) { const i = idx(m); if (expd[i] === Infinity && n.g + 1 < g[i]) push(m, n.g + 1, n.i, k); }
  }
  const path = []; for (let i = idx(GOAL); i >= 0 && goalStep > 0; i = par[i]) path.push([Math.floor(i / N), i % N]);
  return { h, g, disc, expd, order, path: path.reverse(), goalStep, hk };
}
// Maze as SVG: cls(r, c) gives the cell class, txt(r, c) a small label, extra draws on top.
function mazeSVG(cls, txt, extra = "", narrow = false, aria = "") {
  const S = narrow ? 20 : 28, W = N * S + 2;
  const cells = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = c * S + 1, y = r * S + 1, w = WALL[r][c];
    cells.push(`<rect class="${w ? "wall" : cls(r, c) || "free"}" x="${x}" y="${y}" width="${S}" height="${S}"/>`);
    const t = w ? "" : txt(r, c); if (t) cells.push(`<text class="fv ${narrow ? "sm" : ""}" x="${x + S / 2}" y="${y + S / 2 + 3}" text-anchor="middle">${t}</text>`);
  }
  const mark = ([r, c], ch) => `<text class="mark" x="${c * S + 1 + S / 2}" y="${r * S + 1 + S / 2 + 5}" text-anchor="middle">${ch}</text>`;
  return `<svg class="maze" viewBox="0 0 ${W} ${W}" role="img" aria-label="${esc(aria)}">${cells.join("")}${extra(S)}${mark(START, "🐭")}${mark(GOAL, "🧀")}</svg>`;
}
const trail = (cells, S, cls = "trail") => cells.length > 1 ? `<path class="${cls}" d="M${cells.map(([r, c]) => `${c * S + 1 + S / 2},${r * S + 1 + S / 2}`).join(" L")}"/>` : "";
// True distances g* from the mouse (BFS) and the number of shortest paths through each cell, for the contour chart.
const GSTAR = (() => { const d = Array(N * N).fill(Infinity), ways = Array(N * N).fill(0), q = [START]; d[15 * N] = 0; ways[15 * N] = 1;
  while (q.length) { const [r, c] = q.shift(); for (const [rr, cc] of nbrs(r, c)) { const i = rr * N + cc; if (d[i] === Infinity) { d[i] = d[r * N + c] + 1; q.push([rr, cc]); } if (d[i] === d[r * N + c] + 1) ways[i] += ways[r * N + c]; } }
  return { d, ways }; })();
const ON_SHORTEST = GSTAR.d.map((d, i) => d + H.man([Math.floor(i / N), i % N]) === 30).filter(Boolean).length;
CHARTS.fstar = narrow => mazeSVG((r, c) => GSTAR.d[r * N + c] + H.man([r, c]) === 30 ? "onpath" : "free", (r, c) => GSTAR.d[r * N + c] + H.man([r, c]), () => "", narrow,
  `The maze with f* = g* + h in every free cell: ${ON_SHORTEST} cells have f* = 30 and lie on a shortest path, every other cell has f* at least 32`);

// ---------------- Tutorial 1, task 1: A* explorer ----------------
function initAstar(body) {
  const st = { hk: "man", tie: "g", i: 0, n: 1 }; let run = null;
  body.innerHTML = `<div class="ctl"><label>heuristic <select data-h>${Object.keys(H).map(k => `<option value="${k}">${H_NAME[k]}</option>`).join("")}</select></label>
      <label>ties on f <select data-tie><option value="g">prefer larger g (deeper first)</option><option value="h">prefer smaller g</option><option value="fifo">first inserted first</option></select></label></div>
    ${leg([[1, "expanded (taken out of the frontier)"], [4, "in the frontier"], [2, "just expanded"], [3, "the path found"]])}
    <div class="steps"><button class="preset" data-s="reset">↺ Reset</button><button class="preset" data-s="prev">← Back</button><button class="preset" data-s="next">Step →</button><button class="preset" data-s="p10">+10</button><button class="preset" data-s="end">⇥ Run to goal</button><span class="scount">expansion <output>0</output> of <span class="tot"></span></span></div><div class="out"></div>`;
  const out = body.querySelector(".out"), cnt = body.querySelector(".scount output"), tot = body.querySelector(".tot");
  const build = () => { run = astar(st.hk, st.tie); st.n = run.goalStep; st.i = 0; tot.textContent = run.goalStep; render(); };
  const render = () => {
    const k = st.i, cur = k > 0 ? run.order[k - 1] : null, done = k === run.goalStep;
    const cls = (r, c) => { const i = r * N + c; return cur && cur[0] === r && cur[1] === c ? "cur" : done && run.path.some(([pr, pc]) => pr === r && pc === c) ? "onpath" : run.expd[i] < k ? "exp" : run.disc[i] < k || (k === 0 && i === 15 * N) ? "fr" : ""; };
    const txt = (r, c) => { const i = r * N + c; return run.disc[i] < k || (run.expd[i] < k) ? `${run.g[i] + run.h([r, c]) === Math.round(run.g[i] + run.h([r, c])) ? run.g[i] + run.h([r, c]) : num(run.g[i] + run.h([r, c]), 1)}` : ""; };
    cnt.value = k;
    const fr = run.disc.filter((d, i) => d < k && run.expd[i] >= k).length;
    out.innerHTML = `${mazeSVG(cls, txt, S => done ? trail(run.path, S, "trail best") : "", isNarrow(), `A* on the sheet's maze after ${k} expansions with the ${H_NAME[st.hk]} heuristic`)}
      <dl class="ro"><dt>expanded</dt><dd>${k} cell${k === 1 ? "" : "s"}${done ? ` · goal taken out of the frontier, path of ${run.path.length - 1} steps` : ""}</dd><dt>frontier</dt><dd>${fr} cell${fr === 1 ? "" : "s"}</dd><dt>just expanded</dt><dd>${cur ? `row ${cur[0]}, column ${cur[1]}: g = ${run.g[cur[0] * N + cur[1]]}, h = ${num(run.h(cur), 1)}, f = ${num(run.g[cur[0] * N + cur[1]] + run.h(cur), 1)}` : "nothing yet; the mouse's cell is the whole frontier"}</dd></dl>`;
  };
  body.querySelector("[data-h]").addEventListener("change", ev => { st.hk = ev.target.value; build(); });
  body.querySelector("[data-tie]").addEventListener("change", ev => { st.tie = ev.target.value; build(); });
  body.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => { const s = b.dataset.s; st.i = s === "reset" ? 0 : s === "prev" ? Math.max(0, st.i - 1) : s === "next" ? Math.min(st.n, st.i + 1) : s === "p10" ? Math.min(st.n, st.i + 10) : st.n; render(); }));
  build(); body.dataset.rerender = "astar";
}
const ASTAR_COUNTS = Object.fromEntries(["man", "euc", "zero"].map(hk => [hk, Object.fromEntries(["g", "h", "fifo"].map(t => [t, astar(hk, t).goalStep]))]));

// ---------------- Tutorial 1, task 2: coin change ----------------
const COINS = [1, 4, 6], AMT = 8;
const DP = (() => { const dp = [0], from = [null]; for (let a = 1; a <= AMT; a++) { dp[a] = Infinity; for (const cn of COINS) if (cn <= a && dp[a - cn] + 1 < dp[a]) { dp[a] = dp[a - cn] + 1; from[a] = cn; } } return { dp, from }; })();
const greedy = a => { let k = 0; for (const cn of [...COINS].sort((x, y) => y - x)) { k += Math.floor(a / cn); a %= cn; } return k; };
vbars("coins", {
  cats: Array.from({ length: AMT + 1 }, (_, a) => String(a)), y: [0, 4], yTicks: [0, 1, 2, 3, 4], yTitle: "coins",
  series: [{ slot: 1, name: "dp[a], optimal", vals: DP.dp }, { slot: 2, name: "greedy (largest coin first)", vals: Array.from({ length: AMT + 1 }, (_, a) => greedy(a)) }],
  tipHead: a => `amount ${a}`, fmtY: v => `${v}`, aria: "Bars for amounts 0 to 8: the optimal coin count and the greedy count agree everywhere except at 8, where greedy needs 3 coins and the optimum is 2.",
});

// ---------------- Tutorial 1, task 3: bridge crossing as a shortest path over 32 states ----------------
const PEOPLE = [["A", 1], ["B", 2], ["C", 5], ["D", 10]], ALL = 15;
const subsets = mask => { const r = []; for (let s = mask; s; s = (s - 1) & mask) r.push(s); return r; };
const grpCost = s => Math.max(...PEOPLE.filter((_, i) => s >> i & 1).map(p => p[1]));
const grpName = s => PEOPLE.filter((_, i) => s >> i & 1).map(p => p[0]).join("") || "–";
const popc = s => PEOPLE.filter((_, i) => s >> i & 1).length;
// V[far][torchFar] = minimal remaining time; computed by Dijkstra from the goal because the state graph has cycles.
const BRIDGE = (() => {
  const V = {}, key = (f, t) => `${f}${t ? "f" : "n"}`;
  const moves = (far, tf) => { const src = tf ? far : ALL & ~far; return subsets(src).filter(s => popc(s) <= 2).map(s => ({ to: [tf ? far & ~s : far | s, !tf], cost: grpCost(s), who: s })); };
  const states = []; for (let f = 0; f <= ALL; f++) for (const t of [false, true]) states.push([f, t]);
  const rev = {}; states.forEach(([f, t]) => { rev[key(f, t)] = []; }); states.forEach(([f, t]) => moves(f, t).forEach(mv => rev[key(...mv.to)].push({ from: [f, t], cost: mv.cost })));
  const dist = {}; states.forEach(([f, t]) => { dist[key(f, t)] = Infinity; }); dist[key(ALL, true)] = 0;
  const todo = states.slice();
  while (todo.length) { todo.sort((a, b) => dist[key(...a)] - dist[key(...b)]); const s = todo.shift(); const d = dist[key(...s)]; if (d === Infinity) break; for (const p of rev[key(...s)]) if (d + p.cost < dist[key(...p.from)]) dist[key(...p.from)] = d + p.cost; }
  // the optimal plan from the start: always take a move whose cost + V(next) equals V(now)
  const plan = []; let f = 0, t = false;
  while (f !== ALL) { const mv = moves(f, t).find(mv => mv.cost + dist[key(...mv.to)] === dist[key(f, t)]); plan.push({ who: grpName(mv.who), cost: mv.cost, back: t, far: mv.to[0] }); [f, t] = mv.to; }
  return { V: dist, key, plan, total: dist[key(0, false)] };
})();
const ESCORT = [{ who: "AD", cost: 10, back: false, far: 9 }, { who: "A", cost: 1, back: true, far: 8 }, { who: "AC", cost: 5, back: false, far: 13 }, { who: "A", cost: 1, back: true, far: 12 }, { who: "AB", cost: 2, back: false, far: 15 }];
const bridgeRow = (label, plan) => { const tot = plan.reduce((s, p) => s + p.cost, 0); return `<div class="row"><div class="rl">${label}</div><div style="display:flex;align-items:center"><div class="track" style="flex:1">${plan.map(p => `<div class="seg ${p.back ? "back" : ""}" style="flex:${p.cost}" title="${p.who} ${p.back ? "back" : "across"}, ${p.cost} min">${p.who} ${p.back ? "←" : "→"} ${p.cost}</div>`).join("")}</div><span class="sum">${tot} min</span></div></div>`; };
function initBridge(body) {
  const st = { i: 0, n: BRIDGE.plan.length };
  body.innerHTML = `${leg([[1, "crossing to the far side"], [2, "bringing the torch back"], [4, "ring: who holds the torch"]])}${stepBar(BRIDGE.plan.length, "one crossing per step")}<div class="out"></div>`;
  const out = body.querySelector(".out"), cnt = body.querySelector(".scount output");
  const render = () => {
    let far = 0, tf = false, spent = 0; for (let k = 0; k < st.i; k++) { const p = BRIDGE.plan[k]; far = p.far; tf = !p.back; spent += p.cost; }
    const V = BRIDGE.V[BRIDGE.key(far, tf)], bank = (mask, torch) => PEOPLE.map((p, i) => mask >> i & 1 ? `<span class="p ${torch ? "torch" : ""}">${p[0]}</span>` : "").join("");
    const last = st.i ? BRIDGE.plan[st.i - 1] : null; cnt.value = st.i;
    out.innerHTML = `<div class="banks"><div class="bank"><div class="kicker">near side</div>${bank(ALL & ~far, !tf) || "<span class='muted'>empty</span>"}</div><div class="arrow">${last ? (last.back ? "←" : "→") : "⇄"}</div><div class="bank"><div class="kicker">far side</div>${bank(far, tf) || "<span class='muted'>empty</span>"}</div></div>
      <dl class="ro"><dt>state</dt><dd>far side {${grpName(far)}}, torch ${tf ? "far" : "near"}</dd><dt>time so far</dt><dd>${spent} min</dd><dt>V(state)</dt><dd>${V} min still needed, so ${spent} + ${V} = ${spent + V}</dd><dt>last crossing</dt><dd>${last ? `${last.who} ${last.back ? "returned with the torch" : "crossed"}, ${last.cost} min (the slower one sets the pace)` : "none yet"}</dd></dl>`;
  };
  wireSteps(body, st, render); render();
}

// ---------------- Tutorial 2, task 1: simulated annealing on the maze ----------------
const DIRS = { U: [-1, 0], R: [0, 1], D: [1, 0], L: [0, -1] }, DK = "URDL", SA_L = 44;
function decode(moves) { let r = 15, c = 0, steps = 0, bumps = 0; const cells = [[15, 0]]; for (const mv of moves) { const [dr, dc] = DIRS[mv]; const nr = r + dr, nc = c + dc; if (nr < 0 || nr >= N || nc < 0 || nc >= N || WALL[nr][nc]) { bumps++; continue; } r = nr; c = nc; steps++; cells.push([r, c]); if (r === GOAL[0] && c === GOAL[1]) break; } return { r, c, steps, bumps, cells, done: r === GOAL[0] && c === GOAL[1] }; }
const evalSol = d => d.steps + 3 * (d.r + (N - 1 - d.c)) + d.bumps;
function saRun(T0, alpha, seed) {
  const rand = rng(seed); let cur = Array.from({ length: SA_L }, () => DK[Math.floor(rand() * 4)]); let ce = evalSol(decode(cur)), best = cur.slice(), be = ce, T = T0; const hist = []; let it = 0, worse = 0;
  const init = cur.slice();
  while (T > 0.05 && it < 60000) {
    for (let k = 0; k < 100; k++, it++) {
      const nb = cur.slice(), i = Math.floor(rand() * SA_L);
      if (rand() < 0.5) nb[i] = DK[Math.floor(rand() * 4)]; else { const j = Math.floor(rand() * SA_L); [nb[i], nb[j]] = [nb[j], nb[i]]; }
      const ne = evalSol(decode(nb)), d = ne - ce;
      if (d <= 0 || rand() < Math.exp(-d / T)) { if (d > 0) worse++; cur = nb; ce = ne; if (ce < be) { be = ce; best = cur.slice(); } }
      if (it % 100 === 0) hist.push([it, ce, be]);
    }
    T *= alpha;
  }
  return { init, best, be, it, hist, worse, levels: Math.round(Math.log(0.05 / T0) / Math.log(alpha)) };
}
function sparkSVG(hist, narrow) {
  const W = narrow ? 340 : 600, Hh = 120, L = 34, R = 10, T = 10, B = 22, PW = W - L - R, PH = Hh - T - B, x1 = hist[hist.length - 1][0] || 1, ymax = Math.max(...hist.map(h => h[1]));
  const X = v => L + v / x1 * PW, Y = v => T + PH - v / ymax * PH;
  const pth = k => "M" + hist.map(h => `${X(h[0]).toFixed(1)},${Y(h[k]).toFixed(1)}`).join(" L");
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Evaluation of the current and the best solution over the iterations of the annealing run"><line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/><line class="grid" x1="${L}" x2="${W - R}" y1="${Y(30)}" y2="${Y(30)}"/><text class="tick" x="${L - 5}" y="${Y(30) + 4}" text-anchor="end">30</text><text class="tick" x="${L - 5}" y="${Y(ymax) + 4}" text-anchor="end">${ymax}</text><text class="tick" x="${W - R}" y="${Hh - 6}" text-anchor="end">${x1} iterations</text><path class="spark" d="${pth(1)}"/><path class="spark best" d="${pth(2)}"/></svg>`;
}
const SA_T0 = [["0.01", "T₀ = 0.01 (a hill-climber)"], ["1", "T₀ = 1"], ["5", "T₀ = 5"], ["20", "T₀ = 20"]], SA_A = [["0.8", "α = 0.8 (fast)"], ["0.95", "α = 0.95"], ["0.99", "α = 0.99 (slow)"]];
function initSa(body) {
  const st = { T0: "5", a: "0.95", seed: 1 };
  body.innerHTML = `<p class="lab-note">Representation: a string of ${SA_L} moves (U, R, D, L); a move into a wall or off the grid is skipped and counted as a bump, the walk stops when it reaches the cheese. Evaluation to minimise: steps walked + 3 × (Manhattan distance of the end point to the cheese) + bumps. Neighbour: change one move, or swap two. Geometric cooling with 100 steps per temperature level until T &lt; 0.05; worse neighbours are accepted with e<sup>−Δ/T</sup>.</p>
    <div class="presets" role="group" aria-label="Start temperature">${SA_T0.map(([v, l]) => `<button class="preset" data-t="${v}" aria-pressed="${v === st.T0}">${l}</button>`).join("")}</div>
    <div class="presets" role="group" aria-label="Cooling rate">${SA_A.map(([v, l]) => `<button class="preset" data-a="${v}" aria-pressed="${v === st.a}">${l}</button>`).join("")}</div>
    <div class="steps"><button class="preset" data-s="run">▶ Run with a new seed</button><span class="scount">seed <output>1</output></span></div>
    ${leg([[3, "best walk found"], [1, "current eval over the run"], [3, "best eval over the run"]])}<div class="out"></div>`;
  const out = body.querySelector(".out"), cnt = body.querySelector(".scount output");
  const render = () => {
    const r = saRun(+st.T0, +st.a, st.seed), d = decode(r.best); cnt.value = st.seed;
    out.innerHTML = `${mazeSVG(() => "", () => "", S => trail(d.cells, S, "trail best"), isNarrow(), `The best walk found by the annealing run drawn on the maze`)}
      <dl class="ro"><dt>best found</dt><dd>eval ${r.be}: ${d.done ? `reaches the cheese in ${d.steps} steps${d.steps === 30 ? " (optimal)" : ` (${d.steps - 30} more than optimal)`}` : `does not reach the cheese (ends ${d.r + (N - 1 - d.c)} cells away)`}, ${d.bumps} bump${d.bumps === 1 ? "" : "s"}</dd><dt>run</dt><dd>${r.it} iterations over ${r.levels} temperature levels, ${r.worse} worse moves accepted</dd><dt>moves</dt><dd class="mono">${r.best.join("")}</dd></dl>${sparkSVG(r.hist, isNarrow())}`;
  };
  body.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { st.T0 = b.dataset.t; body.querySelectorAll("[data-t]").forEach(o => o.setAttribute("aria-pressed", o === b)); render(); }));
  body.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { st.a = b.dataset.a; body.querySelectorAll("[data-a]").forEach(o => o.setAttribute("aria-pressed", o === b)); render(); }));
  body.querySelector("[data-s]").addEventListener("click", () => { st.seed++; render(); });
  render(); body.dataset.rerender = "sa";
}

const PHI = [[[1, true], [2, true]], [[1, false], [3, true]], [[2, false], [3, false]], [[1, true], [2, false], [3, true]]], PHI_TXT = ["x₁ ∨ x₂", "¬x₁ ∨ x₃", "¬x₂ ∨ ¬x₃", "x₁ ∨ ¬x₂ ∨ x₃"];
const tfs = b => b ? "T" : "F", asg = a => `(${a.map(tfs).join(", ")})`;
const A0 = [false, true, false];
function gsatTrace(a0, tie, steps) {
  const rand = rng(3); let a = a0.slice(), prev = -1; const rows = [];
  for (let k = 0; k < steps; k++) { const u = unsat(PHI, a); if (u === 0) break; const { flips, pick } = gsatStep(PHI, a, tie, prev, rand); rows.push({ k: k + 1, a: a.slice(), u, flips, pick }); a = pick.a; prev = pick.i; }
  return { rows, final: a, u: unsat(PHI, a) };
}

// ---------------- Tutorial 1 ----------------
function tutorial1() {
  const run = astar("man", "g"), cnt = ASTAR_COUNTS;
  return `${head(e)}
    <p class="lead">Sheet 1 is lecture 2 turned into three hand exercises: run A* through a maze and defend the heuristic, write and trace a dynamic programme for coin change, and define the state space of the bridge-crossing puzzle so that dynamic programming applies. The sheet has no official solutions (the course never hands any out), so everything below is our own working, checked by code where that is possible. The tutorial is about discussing exactly these choices, so the arguments matter more than the numbers.</p>
    <div class="tiles">
      <div class="tile"><div class="v">30</div><div class="l">steps from the mouse to the cheese, equal to the Manhattan distance: the walls never force a detour</div></div>
      <div class="tile"><div class="v">${cnt.man.g} of ${FREE}</div><div class="l">free cells A* expands with the Manhattan heuristic (ties towards larger g); h = 0 expands all ${cnt.zero.g}</div></div>
      <div class="tile"><div class="v">2 coins</div><div class="l">for amount 8 from {1, 4, 6}: 4 + 4; greedy takes 6 + 1 + 1 = 3</div></div>
      <div class="tile"><div class="v">17 min</div><div class="l">to get A, B, C, D over the bridge; the escort strategy needs 19</div></div>
    </div>

    ${task(1, "A* in the maze", `<p>A 16 × 16 grid, the mouse in the bottom-left corner, the cheese in the top-right, ${N * N - FREE} wall cells, moves only up, down, left, right. (a) Which heuristic? (b) Which cells does A* explore and which not? (c) Which path does it return, and is it optimal? (d) How long is the shortest path?</p>`, `
      <h3>(a) The heuristic</h3>
      <p>Take the <b>Manhattan distance</b> h(r, c) = |r − 0| + |c − 15|. Without diagonal moves every step changes exactly one coordinate by one, so any path from a cell to the cheese needs at least that many steps: h never overestimates, it is admissible, and A* with it is optimal (lecture 2). It is also consistent (a neighbour's h differs by at most 1, the step cost), so the graph-search version with an explored set is safe too. The <b>Euclidean distance</b> is admissible as well but smaller everywhere, and a smaller admissible heuristic makes A* expand more cells; <b>h = 0</b> turns A* into uniform-cost search (breadth-first here, all costs being 1) and explores everything. Chebyshev distance max(|Δr|, |Δc|) would be the right choice if diagonal moves were allowed; here it is admissible but weak. The ranking Manhattan ≥ Euclidean ≥ Chebyshev ≥ 0 (all ≤ h*) is the dominance argument: the bigger admissible heuristic wins.</p>
      <h3>(b) and (c) The run</h3>
      <p>Step through A* below. The number in a cell is its f = g + h; the frontier is the set of discovered, not yet expanded cells. Change the heuristic and the tie rule to see how much they matter.</p>
      ${lab("astar", "A* on the sheet's maze, cell by cell")}
      <p>With the Manhattan heuristic the mouse's cell has f = 0 + 30 = 30, and every cell on a shortest path keeps f = 30, because g grows by one exactly as h shrinks by one. A* expands nodes in order of f, so it <b>never expands a cell with f &gt; 30</b> (lecture 2: all nodes with f &lt; C* are expanded, some with f = C*, none above). Which of the f = 30 cells it touches is decided by the tie-break. Preferring the larger g (the deeper node) makes A* walk straight: up the left column, right along row 12, up column 3, right along row 5, up column 12, and right to the cheese, expanding only the cells it passes plus the small detour in rows 0 to 5 of columns 8 to 10 that the tie rule tries first. Preferring the smaller g, or first-in-first-out, expands many more f = 30 cells before the goal comes out of the frontier.</p>
      ${chart("fstar", leg([[3, "f* = 30: on at least one shortest path"], ["g", "f* ≥ 32: A* never expands these with the Manhattan heuristic"]]))}
        <figcaption>Every free cell labelled with f* = g*(cell) + h(cell), where g* is the true distance from the mouse (computed by breadth-first search). ${ON_SHORTEST} cells lie on some shortest path; A* can expand only those, whatever the tie rule.</figcaption>
      </figure>
      <div class="tt-wrap"><table class="tt memo"><thead><tr><th>heuristic</th><th>ties: larger g first</th><th>ties: smaller g first</th><th>ties: first inserted</th></tr></thead><tbody>${["man", "euc", "zero"].map(hk => `<tr><td>${H_NAME[hk]}</td>${["g", "h", "fifo"].map(t => `<td class="n">${cnt[hk][t]} expansions</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <p>The path A* returns with our tie rule is the one drawn after the last expansion: ${run.path.length - 1} steps, ${run.path.filter((p, i) => i && p[0] !== run.path[i - 1][0]).length} of them vertical and ${run.path.filter((p, i) => i && p[1] !== run.path[i - 1][1]).length} horizontal. It is optimal for two independent reasons: the A* theorem (admissible h), and the direct bound: any path needs at least 15 moves up and 15 moves right, so 30 steps cannot be beaten, and this path uses no other moves.</p>
      <h3>(d) The length</h3>
      ${ans([["30 steps", "shortest path, equal to the Manhattan distance of mouse and cheese"], [`${cnt.man.g} cells`, "expanded by A* with Manhattan distance and larger-g ties"], [`${ON_SHORTEST} cells`, "lie on some shortest path (f* = 30); the other free cells are never expanded"], [`${GSTAR.ways[15].toLocaleString("en-GB")}`, "distinct shortest paths, counted by dynamic programming over g* (context, not asked)"]])}
      ${why("What the tutorial will probably discuss", `<p>Expect the questions “why is Manhattan admissible?” (one coordinate per step), “what happens with Euclidean distance?” (still optimal, more expansions, since it is dominated) and “is the path unique?” (no: ${GSTAR.ways[15].toLocaleString("en-GB")} paths of length 30 exist, so your explored set and path may differ from the neighbour's without either being wrong). The honest answer to (b) is therefore a rule, not a list: A* expands cells in increasing f and stops when the cheese is taken out of the frontier; with ties resolved towards the goal it expands about ${cnt.man.g} cells.</p>`)}`)}

    ${task(2, "Coin change by dynamic programming", `<p>Unlimited coins of denominations C = {1, 4, 6}, target n = 8. (a) Design a dynamic programme for the minimum number of coins. (b) Trace the full table, give the optimum and the coins. (c) Time and space complexity. (d) Compare with greedy.</p>`, `
      <h3>(a) The programme</h3>
      <p>Subproblem: <b>dp[a]</b> = fewest coins that make exactly amount a, for a = 0 … n. Base case dp[0] = 0 (nothing to pay). Recurrence: the last coin of an optimal solution for a is some c ∈ C with c ≤ a, and the rest is an optimal solution for a − c, so</p>
      <p class="formula">dp[a] = 1 + min { dp[a − c] : c ∈ C, c ≤ a },  dp[a] = ∞ if no such c gives a finite value</p>
      <p>Optimal substructure by cut-and-paste: remove the last coin of an optimal solution; if the remainder were not optimal for a − c, swapping in the optimum would give fewer coins for a. Overlapping subproblems: dp[2] is needed by dp[3], dp[6] and dp[8]. Fill the table bottom-up from 0 to n and keep, per amount, which coin achieved the minimum, to reconstruct the solution. Reporting “impossible” means dp[n] = ∞, which cannot happen here because 1 ∈ C.</p>
      <h3>(b) The table</h3>
      <div class="tt-wrap"><table class="tt memo"><thead><tr><th>a</th>${DP.dp.map((_, a) => `<th>${a}</th>`).join("")}</tr></thead><tbody>
        <tr><td class="rl">candidates 1 + dp[a − c]</td>${DP.dp.map((_, a) => `<td class="n">${a === 0 ? "–" : COINS.filter(cn => cn <= a).map(cn => `${1 + DP.dp[a - cn]}<small> (${cn})</small>`).join(", ")}</td>`).join("")}</tr>
        <tr><td class="rl">dp[a]</td>${DP.dp.map(v => `<td class="n"><b>${v}</b></td>`).join("")}</tr>
        <tr><td class="rl">last coin</td>${DP.from.map(v => `<td class="n">${v ?? "–"}</td>`).join("")}</tr>
      </tbody></table></div>
      <p>Reconstruction from a = 8: last coin 4 → a = 4: last coin 4 → a = 0. The optimum is <b>two coins, 4 + 4</b>. (dp[8] also has the candidate 1 + dp[7] = 3 via coin 1 and 1 + dp[2] = 3 via coin 6; both lose.)</p>
      ${chart("coins", leg([[1, "dp[a], optimal"], [2, "greedy (largest coin first)"]]))}
        <figcaption>Optimal and greedy coin counts for every amount up to 8. They agree up to 7; at 8 greedy's first choice of 6 leaves a remainder of 2 that needs two 1-coins.</figcaption>
      </figure>
      <h3>(c) Complexity</h3>
      <p>n + 1 table cells, each taking the minimum over at most |C| coins: <b>O(n · |C|) time</b>, here 9 × 3 = 27 candidate evaluations (24 after the base case), and <b>O(n) space</b> for the table plus the “last coin” row. That is the lecture-2 formula: number of distinct subproblems × work per subproblem. Note the running time is polynomial in n but exponential in the <em>number of bits</em> of n, which is why coin change is pseudo-polynomial.</p>
      <h3>(d) Greedy</h3>
      <p>Greedy (take the largest coin that fits, repeat) pays 8 as 6 + 1 + 1: three coins, one more than the optimum. It works for canonical coin systems such as 1, 2, 5, 10, 20, 50 because every larger coin is a multiple-friendly combination of the smaller ones; {1, 4, 6} is not canonical, since 6 is not a “better” way to cover 4 + 4. Greedy is O(|C| log |C| + n) and needs no table, but it is only a heuristic; dynamic programming is exact.</p>
      ${ans([["dp[8] = 2", "coins 4 + 4"], ["O(n · |C|)", "time; O(n) space"], ["greedy: 3", "6 + 1 + 1, suboptimal for this system"]])}`)}

    ${task(3, "Bridge crossing by dynamic programming", `<p>Four people (A: 1 min, B: 2, C: 5, D: 10) must cross a bridge at night with one torch. At most two cross at once, a pair walks at the slower one's speed, and the torch must be carried back for the others. Design a dynamic programme for the minimal total time.</p>`, `
      <h3>The state space</h3>
      <p>The lecture's warning was that the hard part of DP is choosing the subproblems. Here a state must capture everything that matters for the future: <b>who is on the far side</b> (a subset of {A, B, C, D}, 16 possibilities) and <b>where the torch is</b> (2 possibilities): 32 states. Define <b>V(S, t)</b> = minimal remaining time to get everyone across from the state with far-side set S and torch side t. Goal: V({A, B, C, D}, far) = 0. Answer wanted: V(∅, near).</p>
      <p class="formula">V(S, near) = min over one or two people P ⊆ near side: max(time of P) + V(S ∪ P, far)<br>V(S, far) = min over one or two people P ⊆ S: max(time of P) + V(S ∖ P, near)</p>
      <p>Optimal substructure holds by the same cut-and-paste argument as always: after the first crossing the remaining plan must be optimal for the new state, or it could be improved. Overlapping subproblems: the state {C, D} far, torch near is reached by several different first moves. One subtlety for the tutorial: the recurrence as written is <em>circular</em> (a pair can cross and come straight back), so a plain memoised recursion loops. Two fixes: (1) compute the values in order of increasing V, which is Dijkstra on the 32-state graph with crossing times as edge weights, or (2) add the crossing index as a stage and note that a useful plan has exactly 2n − 3 = 5 crossings (every return trip carries one person back, so n people need n − 1 forward trips of two plus n − 2 returns), which makes the state graph a DAG over stages. Either way the table has at most 32 states × a handful of moves, trivial to fill.</p>
      <h3>The table (values V, in minutes)</h3>
      <div class="tt-wrap"><table class="tt memo"><thead><tr><th>far side S</th><th>torch near</th><th>torch far</th></tr></thead><tbody>${Array.from({ length: 16 }, (_, s) => s).sort((a, b) => popc(a) - popc(b) || a - b).map(s => `<tr><td>{${grpName(s)}}</td><td class="n">${BRIDGE.V[BRIDGE.key(s, false)] === Infinity ? "–" : BRIDGE.V[BRIDGE.key(s, false)]}</td><td class="n">${BRIDGE.V[BRIDGE.key(s, true)] === Infinity ? "–" : BRIDGE.V[BRIDGE.key(s, true)]}</td></tr>`).join("")}</tbody></table></div>
      <p>Reading the table: from the start, V(∅, near) = 17. The first move AB → (2 min) leads to V({A, B}, far) = 15, and 2 + 15 = 17 is the minimum over all first moves (AD → costs 10 and leaves V({A, D}, far) = 9, total 19). Follow the equalities down and you get the plan:</p>
      ${lab("bridge", "the optimal plan, crossing by crossing, with V of every state")}
      <div class="bridge">${bridgeRow("optimal: pair the slow ones", BRIDGE.plan)}${bridgeRow("escort: A ferries everyone", ESCORT)}</div>
      <p>The trick the DP discovers by itself: send C and D <em>together</em> (10 min, not 10 + 5) while the fast pair A, B does the torch shuttling. The intuitive escort plan, A walking everybody over one by one, costs 10 + 1 + 5 + 1 + 2 = 19.</p>
      ${ans([["17 min", "AB → 2, A ← 1, CD → 10, B ← 2, AB → 2"], ["32 states", "16 subsets × torch side; V computed in order of increasing value"], ["5 crossings", "2n − 3 for n people: 3 forward trips of two, 2 returns of one"]])}
      ${why("Context, not on the sheet", `<p>This is the general shape of “DP on a puzzle”: state = everything the future depends on, value = cost-to-go, transitions = legal moves, answer at the start state. When transitions can go back and forth the “DP” is a shortest-path problem and Dijkstra is the DP (the lecture named it as the prominent example of dynamic programming). For n people the state space is 2ⁿ · 2, so the method scales to maybe 20 people, while the known closed-form strategy (alternate “two fastest shuttle” and “fastest escorts the slowest” steps) is O(n log n). Expect a variant of the puzzle with different times or a three-person bridge in an exam.</p>`)}`)}

    <h2>Before the session</h2>
    <ul>
      <li>Run A* by hand on a copy of the maze far enough to see the f = 30 corridor; decide and write down your tie rule.</li>
      <li>Fill the coin table on paper without the chart; practise the “last coin” reconstruction and the complexity sentence.</li>
      <li>For the bridge, write the state definition and the recurrence in your own words; be ready to explain why the plain recursion loops and what fixes it.</li>
      <li>Reread the A* optimality proof and the DP applicability checklist in <a href="advanced-problem-solving/lecture.html?n=2">lecture 2</a>.</li>
    </ul>
    <p class="muted">Next sheet: <a href="advanced-problem-solving/exercise.html?n=2">tutorial 2</a> (local search and simulated annealing, after <a href="advanced-problem-solving/lecture.html?n=3">lecture 3</a>). The sheet is in OPAL → Tutorials → Tutorial 1; it is not republished here.</p>`;
}

// ---------------- Tutorial 2 ----------------
function tutorial2() {
  const p53 = accept(3, 5);
  return `${head(e)}
    <p class="lead">Sheet 2 belongs to lecture 3. Task 1 asks for a design, not a run: how would simulated annealing attack the maze of sheet 1, and when is that a worse idea than A*? Task 2 is arithmetic you should be able to do without a calculator in an exam: three GSAT steps on a four-clause formula, a local-optimum check, and the stochastic hill-climber's acceptance probability for a few temperatures. The sheet has no official solutions; the working below is ours.</p>
    <div class="tiles">
      <div class="tile"><div class="v">4 questions</div><div class="l">every SA design answers: solution, neighbours, cost, initial solution (lecture 3, slide 32)</div></div>
      <div class="tile"><div class="v">${num(p53, 3)}</div><div class="l">acceptance probability for Δ = 3 at T = 5; the draw r = 0.61 is above it, so the move is rejected</div></div>
      <div class="tile"><div class="v">(T, F, T)</div><div class="l">the only model of φ; reachable in three GSAT flips from (F, T, F) with a sensible tie rule</div></div>
      <div class="tile"><div class="v">→ 0.5</div><div class="l">p for any fixed Δ as T grows: the hill-climber turns into a random walk</div></div>
    </div>

    ${task(1, "Simulated annealing for the maze", `<p>Design a simulated annealing algorithm that finds the shortest path from the mouse to the cheese in the maze of sheet 1. (a) How is a solution represented, with pros and cons of the options? (b) How is the initial solution generated and feasibility ensured? (c) What is the neighbourhood? (d) What is the evaluation function? (e) Compare with A*: completeness and optimality of each, and which to prefer here.</p>`, `
      <h3>(a) Representation</h3>
      <p>A* searched partial solutions; SA needs a <em>complete</em> candidate that can be evaluated and perturbed. Three natural encodings:</p>
      <div class="tt-wrap"><table class="tt memo"><thead><tr><th>encoding</th><th>for</th><th>against</th></tr></thead><tbody>
        <tr><td class="rl">move string</td><td>a string over {U, D, L, R} of fixed maximum length L; decoded by walking from the mouse. Tiny neighbourhood operators (change one letter), every string decodes to something, no bookkeeping.</td><td>most strings do not reach the cheese and bump into walls, so feasibility must be handled by the decoder or by penalties; the length L has to be chosen (too short: no solution exists, too long: a huge space of junk).</td></tr>
        <tr><td class="rl">cell sequence (a walk)</td><td>a list of adjacent free cells from the mouse to the cheese: always feasible by construction, evaluation is just the length.</td><td>neighbourhood operators are awkward: changing one cell breaks adjacency, so moves must splice in whole detours or re-route a segment, which is a small search problem of its own.</td></tr>
        <tr><td class="rl">waypoints</td><td>a short list of intermediate cells; a deterministic router (say, greedy or BFS) connects consecutive waypoints. Few variables, every candidate is a valid path.</td><td>the router does most of the work; with BFS between waypoints the “SA” is really A* in disguise, and the quality depends on where waypoints may lie.</td></tr>
      </tbody></table></div>
      <p>For the discussion we take the <b>move string</b>: it is the one the lecture's SAT and TSP examples resemble (a fixed-length vector with a cheap flip operator), and its weaknesses are exactly what questions (b) to (d) are about.</p>
      <h3>(b) Initial solution and feasibility</h3>
      <p>Initial solution: a uniformly random string of L moves (L = 44 below, a little more than the 30 an optimal path needs so that detours fit). Feasibility has two layers. <b>Hard constraints</b> (no walls, stay on the grid) are enforced by the <em>decoder</em>: a move into a wall is skipped and counted as a bump, so every string decodes to a legal walk. The <b>goal constraint</b> (end at the cheese) is not enforced but priced into the evaluation function, which is the standard way to let the search start from garbage and improve. The alternative, repairing or rejecting infeasible strings, would make the initial solution a search problem in itself.</p>
      <h3>(c) Neighbourhood</h3>
      <p>Two single-string operators, chosen at random: <b>change one move</b> at a random position to a random direction, and <b>swap two moves</b>. Both keep the length, both change the decoded walk from the edited position onward (a small edit early in the string moves the whole tail, which is what lets the search escape dead ends). The neighbourhood of a string therefore has 3L + L(L − 1)/2 members; one random neighbour is sampled per step, as in the stochastic hill-climber. Insertion and deletion of a move would be natural additions.</p>
      <h3>(d) Evaluation function (to minimise)</h3>
      <p class="formula">eval(s) = steps walked + 3 · Manhattan distance from the end cell to the cheese + number of bumps</p>
      <p>The three terms rank what we want: reaching the cheese is worth more than saving steps (the factor 3 means one cell of distance costs more than three extra steps, so the search first heads for the cheese, then shortens), and bumps are discouraged so that strings stay clean. A walk that reaches the cheese has eval = its length, so the global minimum is 30, the known shortest path. Here is the whole design running:</p>
      ${lab("sa", "anneal a move string on the sheet's maze")}
      <p>What the explorer shows: with a start temperature around 5 and α = 0.95 the run finds a 30-step walk in a few thousand evaluations most of the time; cooling fast (α = 0.8) often freezes at 31 or 32; T₀ = 0.01 is a hill-climber and depends on the seed; a high T₀ wastes the early iterations on random walks. Nothing here is guaranteed, which is the point of (e).</p>
      <h3>(e) SA against A*</h3>
      <ul class="cmp two">
        <li><b>A* with Manhattan distance</b><span class="v"><span class="sw t"></span><b>Complete</b> (finite grid, every edge costs 1, so it terminates with a solution if one exists) and <b>optimal</b> (admissible heuristic). On this maze: ${ASTAR_COUNTS.man.g} expansions, exact answer 30, no parameters.</span></li>
        <li><b>Simulated annealing</b><span class="v"><span class="sw v"></span><b>Not complete</b> in any bounded number of iterations: it may stop with a walk that never reaches the cheese. <b>Not optimal</b>: the convergence theorem needs a logarithmically slow cooling, so in practice the result is a good walk, not provably the shortest. Several parameters (L, T₀, α, steps per level, penalty weights) and thousands of evaluations even on a 16 × 16 grid.</span></li>
      </ul>
      <p><b>Prefer A* here.</b> The maze is a small graph with unit costs and a cheap admissible heuristic, which is precisely the setting where an exact best-first search is both fast and certain. Simulated annealing earns its place where no admissible heuristic or no tractable state graph exists (the TSP, timetabling, the SAT instances of task 2), or where the evaluation is noisy and changes over time (lecture 1), none of which applies to a fixed maze.</p>
      ${ans([["move string", "fixed length L over {U, D, L, R}, decoded by walking; walls handled by the decoder"], ["eval", "steps + 3 · distance to cheese + bumps, minimum 30"], ["A* preferred", "complete and optimal here; SA is neither"]])}`)}

    ${task(2, "GSAT and stochastic acceptance", `<p>φ = (x₁ ∨ x₂) ∧ (¬x₁ ∨ x₃) ∧ (¬x₂ ∨ ¬x₃) ∧ (x₁ ∨ ¬x₂ ∨ x₃). (a) From A₀ = (x₁ = F, x₂ = T, x₃ = F) run three GSAT steps, listing the unsatisfied count of every single flip, the chosen flip and the resulting assignment. (b) Is the assignment after three steps a local optimum under the one-flip neighbourhood? (c) With eval(v<sub>c</sub>) = 107 (satisfied clauses, larger instance) at a local optimum and the only available flip giving eval(v<sub>n</sub>) = 104, compute the acceptance probability at T = 5 and decide the move for a draw r = 0.61. (d) Same Δ = 3 for T ∈ {1, 10, 100}: what happens as T grows?</p>`, `
      <h3>(a) Three GSAT steps</h3>
      <p>At A₀ = (F, T, F): C₁ holds through x₂, C₂ through ¬x₁, C₃ through ¬x₃, and C₄ = x₁ ∨ ¬x₂ ∨ x₃ = F ∨ F ∨ F fails: <b>one unsatisfied clause</b>. The three single flips are listed in the first table below; every one of them leaves exactly one clause unsatisfied (flipping x₁ breaks C₂, flipping x₂ breaks C₁, flipping x₃ breaks C₃, each while fixing C₄). GSAT's rule, “the flip with the largest decrease”, is a three-way tie at a decrease of 0, so the sheet silently requires a tie-break. We use the simplest reasonable one: <b>lowest variable index, but never undo the previous flip</b>. Change it in the explorer to see the alternatives.</p>
      ${lab("gsat2", "the three steps with every flip evaluated")}
      <p>With that rule the trace is A₀ = (F, T, F) → flip x₁ → A₁ = (T, T, F) → flip x₂ → A₂ = (T, F, F) → flip x₃ → <b>A₃ = (T, F, T)</b>, and A₃ satisfies all four clauses: GSAT would return it at the start of the next round. With the plain “lowest index” rule GSAT flips x₁ back at step 2 and oscillates between A₀ and A₁ forever: that is the plateau behaviour of slide 12. With random ties the outcome varies between the two. Whatever rule you choose, the tutorial wants the per-flip table, the stated rule and the resulting assignment.</p>
      <h3>(b) Local optimum?</h3>
      <p>Under our trace, A₃ = (T, F, T) has 0 unsatisfied clauses. No flip can reduce the count below zero, so it is trivially a local optimum, and since 0 is the global minimum it is the <b>global optimum</b> (a model of φ; checking all eight assignments shows it is the only one). Under the oscillating trace the assignment after three steps is A₁ = (T, T, F) with one unsatisfied clause; all three flips give one as well, so no flip <em>reduces</em> the count and A₁ is a local optimum in the sense of the question, more precisely a point on a plateau: not better than its neighbours, only not worse. Say which case you are in.</p>
      <h3>(c) Stochastic acceptance at T = 5</h3>
      <p>The evaluation counts satisfied clauses, so it is maximised and the lecture's formula applies directly with Δ = eval(v<sub>c</sub>) − eval(v<sub>n</sub>) = 107 − 104 = 3 (the neighbour is worse):</p>
      <p class="formula">p = 1 / (1 + e<sup>3/5</sup>) = 1 / (1 + e<sup>0.6</sup>) = 1 / (1 + ${num(Math.exp(0.6), 4)}) = ${num(p53, 4)}</p>
      <p>The move is accepted when the uniform draw is below p. r = 0.61 &gt; ${num(p53, 3)}, so the move is <b>rejected</b> and the climber stays at the local optimum this time. (Had the draw been 0.3 it would have gone downhill.) A sanity check on the sign: a worse neighbour must have p &lt; 0.5, and it does.</p>
      ${lab("pcalc", "p for any Δ, T and draw")}
      <h3>(d) The role of T</h3>
      <div class="tt-wrap"><table class="tt memo"><thead><tr><th>T</th><th>e<sup>3/T</sup></th><th>p = 1 / (1 + e<sup>3/T</sup>)</th><th>behaviour</th></tr></thead><tbody>${[[1, "almost never accepts the worse move: a hill-climber"], [5, "the sheet's case: roughly one in three"], [10, "accepts the worse move more often than not… nearly"], [100, "indistinguishable from a coin flip: random search"]].map(([T, b]) => `<tr><td class="n">${T}</td><td class="n">${num(Math.exp(3 / T), 4)}</td><td class="n"><b>${num(accept(3, T), 4)}</b></td><td>${b}</td></tr>`).join("")}</tbody></table></div>
      ${chart("pT", "")}
        <figcaption>Acceptance probability of the same worse move (Δ = 3) as a function of T. It rises monotonically towards 0.5 and never crosses it: a worse move is never more likely than not, however hot the search.</figcaption>
      </figure>
      <p>Observation: as T increases, the merit difference matters less and less; p approaches 0.5 from below, the climber accepts worse moves almost as readily as better ones, and the search degenerates into a random walk through the neighbourhood (slide 22: “the search becomes random”). Small T makes it an ordinary hill-climber that cannot leave the local optimum. Simulated annealing exploits exactly this by starting hot and ending cold.</p>
      ${ans([[num(p53, 3), "p at T = 5; r = 0.61 ≥ p → rejected"], [`${num(accept(3, 1), 3)} / ${num(accept(3, 10), 3)} / ${num(accept(3, 100), 3)}`, "p at T = 1, 10, 100"], ["(T, F, T)", "after three steps with our tie rule: the model of φ"]])}
      ${why("Context, not on the sheet", `<p>Three things the tutor may probe. First, GSAT's tie-break is not part of the algorithm on the slides, so stating yours is part of the answer. Second, the acceptance formula on the sheet is the stochastic hill-climber's sigmoid, not the Metropolis rule e<sup>−Δ/T</sup> used inside simulated annealing on slide 27; for Δ = 3, T = 5 the latter would give e<sup>−0.6</sup> = ${num(Math.exp(-0.6), 3)}, still below 0.61. Third, “local optimum” on a plateau is a matter of definition (no strictly better neighbour versus no equally good neighbour); the sheet's wording, “no single flip reduces the number of unsatisfied clauses”, uses the weak one.</p>`)}`)}

    <h2>Before the session</h2>
    <ul>
      <li>Write the four design answers for the maze in your own words first, then compare with the table above; the representation choice is the one to be ready to defend.</li>
      <li>Redo the three GSAT tables on paper with a tie rule of your own and check them against the explorer.</li>
      <li>Compute the four probabilities by hand (e<sup>0.6</sup> ≈ 1.82, e<sup>3</sup> ≈ 20.1, e<sup>0.3</sup> ≈ 1.35, e<sup>0.03</sup> ≈ 1.03) so that the exam version holds no surprises.</li>
      <li>Reread the stochastic hill-climber and the SA design questions in <a href="advanced-problem-solving/lecture.html?n=3">lecture 3</a>, and the A* optimality argument in <a href="advanced-problem-solving/lecture.html?n=2">lecture 2</a> for (e).</li>
    </ul>
    <p class="muted">Previous sheet: <a href="advanced-problem-solving/exercise.html?n=1">tutorial 1</a>. Next: tutorial 3 on tabu search, after <a href="advanced-problem-solving/lecture.html?n=4">lecture 4</a>. The sheet is in OPAL → Tutorials → Tutorial 2; it is not republished here.</p>`;
}
