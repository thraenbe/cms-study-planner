// ---------------- Lecture 1: introduction ----------------
// The "three sons" puzzle: the eight ways to factor 36 into three ages, filtered by each clue.
const SONS = [[36, 1, 1], [18, 2, 1], [12, 3, 1], [9, 4, 1], [9, 2, 2], [6, 6, 1], [6, 3, 2], [4, 3, 3]];
const SONS_STEPS = [
  { t: "Clue 1 · “the product of their ages is 36”", d: "Eight triples of whole numbers multiply to 36. The search space is already finite and tiny, yet B cannot answer: the clue leaves eight candidates." },
  { t: "Clue 2 · “their sum is the number of windows”", d: "B can see the building and count the windows, so B knows the sum. Seven of the sums are unique: had the sum been any of those, B would have answered at once. B still needs a hint, so the sum must be the one that appears twice: 13." },
  { t: "Clue 3 · “my oldest son has blue eyes”", d: "The clue sounds useless, but “my oldest son” means there is exactly one oldest. 6, 6, 1 has two oldest sons; 9, 2, 2 has one. Answer: 9, 2 and 2. The information was in what the listener could not do, not in the numbers." },
];
function sonsOut(i) {
  const sums = SONS.map(s => s[0] + s[1] + s[2]), dup = sums.filter((v, k) => sums.indexOf(v) !== k);
  const rows = SONS.map((s, k) => {
    const sum = sums[k], alive = i < 1 || (i >= 1 && dup.includes(sum) && (i < 2 || s[0] !== s[1]));
    const tag = i === 1 ? (dup.includes(sum) ? "tie" : "unique → B would have known") : i === 2 ? (dup.includes(sum) ? (s[0] !== s[1] ? "one oldest ✓" : "two oldest") : "") : "";
    return `<tr class="${alive ? "alive" : "dead"}${i === 2 && alive ? " win" : ""}"><td class="n">${s.join(", ")}</td><td class="n">${i >= 1 ? sum : ""}</td><td>${tag}</td></tr>`; }).join("");
  return `<div class="tt-wrap"><table class="tt sons"><thead><tr><th>ages</th><th>sum</th><th>status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="lab-note" style="margin:8px 0 0"><b>${SONS_STEPS[Math.max(0, i - 1)].t}</b><br>${i === 0 ? "Press Step to apply the first clue." : SONS_STEPS[i - 1].d}</p>`;
}
function initSons(body) {

// Search-space sizes: SAT with n variables vs symmetric TSP with n cities, on a log axis.
const fact = n => { let r = 1; for (let k = 2; k <= n; k++) r *= k; return r; };
line("space", {
  x: [2, 20], y: [1, 1e18], log: true, yTicks: [1, 1e3, 1e6, 1e9, 1e12, 1e15, 1e18], fmtTick: v => v === 1 ? "1" : `10${String(Math.log10(v)).split("").map(ch => "⁰¹²³⁴⁵⁶⁷⁸⁹"[ch]).join("")}`,

  tipHead: n => `n = ${n}`, fmtY: v => sciH(v), focusAt: 7, labelW: 110, labelAt: 20,
  extra: g => `<line class="ann dash" x1="${g.x(7)}" x2="${g.x(7)}" y1="${g.y(1e18)}" y2="${g.y(128)}"/><text class="vl2" x="${g.x(7) + 5}" y="${g.y(1e13)}">n = 7: TSP overtakes SAT</text>`,
  hitLabel: "Read the search-space sizes: arrow keys change n", aria: "Line chart on a logarithmic axis: 2 to the n for SAT and (n minus 1) factorial over 2 for the TSP, n from 2 to 20. The TSP curve crosses above SAT at n = 7 and reaches 10 to the 17 at n = 20.",
});
// The handshake puzzle: five couples, nine different answers 0…8, pairing the extremes step by step.
const HS_NAMES = ["Mr Smith", "Mrs Smith", "A", "A′", "B", "B′", "C", "C′", "D", "D′"];
function hsState(i) {
  // After step k (1..4): the person with 8−(k−1) handshakes is identified with their spouse (who has k−1).
  const edges = [], count = Array(10).fill(0), info = [];
  for (let k = 1; k <= i; k++) {
    const hi = 2 * k, lo = 2 * k + 1; // couple k: hi shook hands with everyone still unassigned except lo
    for (let p = 0; p < 10; p++) if (p !== hi && p !== lo && !info.find(c => c.hi === p || c.lo === p)) { edges.push([hi, p]); count[hi]++; count[p]++; }
    info.push({ hi, lo });
  }
  return { edges, count, info };
}
function hsOut(i, narrow) {
  const W = narrow ? 320 : 420, H = narrow ? 300 : 330, cx = W / 2, cy = H / 2 + 6, R = narrow ? 112 : 128;
  const pos = HS_NAMES.map((_, k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / 10; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  const { edges, count, info } = hsState(i);
  const couples = [0, 1, 2, 3, 4].map(k => `<line class="spouse" x1="${pos[2 * k][0]}" y1="${pos[2 * k][1]}" x2="${pos[2 * k + 1][0]}" y2="${pos[2 * k + 1][1]}"/>`).join("");
  const es = edges.map(([a, b]) => `<line class="edge hs" x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}"/>`).join("");
  const solved = p => info.find(c => c.hi === p || c.lo === p);
  const ns = HS_NAMES.map((nm, p) => { const c = solved(p), cls = c ? (c.hi === p ? "expanded" : "frontier") : i === 4 && p < 2 ? "goal" : "";
    const lbl = c || i === 4 ? count[p] : "?"; const a = -Math.PI / 2 + p * 2 * Math.PI / 10, lx = cx + (R + 26) * Math.cos(a), ly = cy + (R + 26) * Math.sin(a);
    return `${nodeSVG(pos[p][0], pos[p][1], lbl, cls, 14)}<text class="tick" x="${lx}" y="${ly + 4}" text-anchor="middle">${nm}</text>`; }).join("");
  const notes = ["Ten people, five couples (spouses joined by the thin line). Mr Smith asked the other nine and got nine different answers. Nobody shakes their own or their spouse's hand, so an answer is at most 8: the answers are exactly 0, 1, 2, …, 8.",
    "Whoever answered 8 shook hands with everyone except their spouse. So everyone else has at least 1, and the only person who can have answered 0 is that spouse: the couple A, A′ answered 8 and 0.",
    "Remove couple A. Whoever answered 7 shook hands with all remaining people except their spouse (one of the seven was A). Everyone else now has at least 2, so the person with 1 is their spouse: couple B answered 7 and 1.",
    "Same argument once more: the person with 6 is married to the person with 2 (couple C).",
    "And 5 goes with 3 (couple D). The only answer left is 4, and the only person left who answered is Mrs Smith: she shook 4 hands. Mr Smith also has 4 but he asked, he did not answer."];
  return `<div class="hs-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ten people on a circle; handshake edges are added couple by couple">${couples}${es}${ns}</svg>
    <div><p class="lab-note">${notes[i]}</p><table class="tt hs"><thead><tr><th>couple</th><th>answers</th></tr></thead><tbody>${info.map((c, k) => `<tr><td>${HS_NAMES[c.hi][0]}, ${HS_NAMES[c.hi][0]}′</td><td class="n">${count[c.hi]} and ${count[c.lo]}</td></tr>`).join("")}${i === 4 ? `<tr class="win"><td>Mrs Smith</td><td class="n">4</td></tr>` : ""}</tbody></table></div></div>`;
}
function initHs(body) {
  const st = { i: 0, n: 4 };
  body.innerHTML = `${leg([[1, "answered the high number"], [2, "their spouse, the low number"], [3, "the Smiths"], ["g", "not yet placed"]])}${stepBar(4, "one couple per step")}<div class="out"></div>`;
  const out = body.querySelector(".out"), cnt = body.querySelector(".scount output");
  const render = () => { out.innerHTML = hsOut(st.i, isNarrow()); cnt.value = st.i; };
  wireSteps(body, st, render); render(); body.dataset.rerender = "hs";
}
// Course map: the eight topic blocks of the agenda on the twelve lectures.
const BLOCKS = [["Introduction", [1]], ["Uninformed vs informed search", [2]], ["Local search, hill climbing, annealing", [3]], ["Tabu search", [4]], ["Evolutionary algorithms", [5]], ["Answer set programming", [6, 7, 8]], ["Constraint satisfaction", [9]], ["Tree and hypertree decompositions", [10, 11]]];
function courseMap() {
  const cells = c.lectures.map(x => { const s = state(x); const b = BLOCKS.findIndex(bk => bk[1].includes(x.n));
    return `<a class="cm ${s}" href="advanced-problem-solving/lecture.html?n=${x.n}" title="${esc(x.title)}"><b>${x.n}</b><small>${U.fmtDate(x.date)}</small>${b >= 0 && BLOCKS[b][1][0] === x.n ? `<i>${b + 1}</i>` : ""}</a>`; }).join("");
  return `<div class="cmap">${cells}</div><ol class="cm-blocks">${BLOCKS.map(b => `<li>${b[0]}</li>`).join("")}</ol>`;
}

function lecture1() {
  const tests = 1000 * 15e9 * 365.25 * 86400, frac = tests / 2 ** 100;
  return `${head(l)}
    <p class="lead">The first lecture is half organisation and half a warning. The organisation: 12 lectures, 10 tutorials, slides in OPAL, every question in the forum. The warning: the problems of this course are hard for reasons that stay the same whatever algorithm you use, and the lecture spends its time on those reasons, with two puzzles that are solved by thinking about the search rather than by searching.</p>
    <div class="tiles">
      <div class="tile"><div class="v">12 + 10</div><div class="l">lectures and tutorials; one tutorial group per week</div></div>
      <div class="tile"><div class="v">8</div><div class="l">topic blocks, from traditional search to hypertree decompositions</div></div>
      <div class="tile"><div class="v">90 min</div><div class="l">written exam, in person; no sample solutions are handed out</div></div>
      <div class="tile"><div class="v">forum</div><div class="l">the only channel for questions; answering others' questions is encouraged</div></div>
    </div>

    <h2>How the course runs</h2>
    <p>Lectures are on Tuesdays in the second double period in the Görges-Bau; the schedule is on the ICCL course page and everything else is in OPAL. There are four tutorial groups and you register in OPAL for the one you attend (yours is group 2 on Friday afternoons). The recommended rhythm: solve the sheet at home as far as you get, then the tutorial discusses problems, questions and solutions. Two sentences from the slides are worth remembering before the first sheet: sample solutions are not shared, and copying solutions from the internet or an AI will not help at the exam. The exam tests whether you can run the algorithms by hand and argue about them, which is exactly what the sheets train.</p>
    <p class="muted">Context, not on the slides: the course was called “Problem Solving and Search in Artificial Intelligence” until last year; the content is identical, so only one of the two can be credited. Machine learning and neural networks are explicitly out of scope.</p>

    <h2>The whole semester on one strip</h2>
    <p>The agenda names eight blocks. Mapped onto the twelve lecture Tuesdays they look like this (lectures from 3 on follow last year's order and are not announced yet):</p>
    ${courseMap()}

    <h2>Puzzle 1: the ages of the three sons</h2>
    <p>Two men meet in the street. One says all three of his sons have their birthday today and gives three clues: the product of their ages is 36, their sum equals the number of windows in the building opposite, and his oldest son has blue eyes. After the third clue the other man knows the ages. Step through the clues: each one shrinks the candidate set, and the second clue only works because of what the listener could <em>not</em> conclude from it.</p>
    ${lab("sons", "apply the three clues to the eight candidate triples")}
    <div class="why"><div class="kicker">What was difficult here</div><p>The slides ask “what was difficult on this problem?” and answer with four habits: decide where to begin, make a plan for generating a solution, always use all of the available data (including the fact that B needed another hint), and connect the goal to what is given. The puzzle is small enough to enumerate, so the difficulty is not the search space. It is noticing that “B still needs a hint” is data.</p></div>

    <h2>Why some problems are hard</h2>
    <p>The lecture gives five reasons, and the rest of the course is organised around the first four:</p>
    <ol>
      <li><b>The search space is too large</b> for exhaustive search (lectures 2 to 5 are about searching it anyway).</li>
      <li><b>The problem is too complicated</b> and simplified models are useless (modelling, below).</li>
      <li><b>The evaluation function is noisy or changes over time</b>, so you need a series of solutions, not one.</li>
      <li><b>There are so many constraints</b> that finding one feasible answer is hard, never mind an optimal one (lectures 6 to 11: ASP, CSP, decompositions).</li>
      <li>The person solving the problem is inadequately prepared.</li>
    </ol>

    <h3>How fast the search space grows</h3>
    <p>Two running examples recur all semester. <b>SAT</b>: find a truth assignment for 100 Boolean variables that makes a CNF formula true. Every binary string of length 100 is a candidate, so there are 2<sup>100</sup> ≈ 10<sup>30</sup> of them. <b>TSP</b>: visit n cities exactly once and return home on the shortest tour. A tour is a permutation of the cities, each tour can be written 2n ways (n starting points, two directions), so the symmetric TSP has n!/(2n) = (n−1)!/2 distinct tours. The factorial wins: for n ≤ 6 SAT has more candidates (64 vs 60), from n = 7 on the TSP does (360 vs 128).</p>
    ${chart("space", leg([[1, "SAT with n variables: 2ⁿ"], [2, "symmetric TSP with n cities: (n−1)!/2"]]))}
      <figcaption>Candidate solutions for n variables or cities, on a logarithmic axis. Hover or focus the plot and use the arrow keys to read exact values.</figcaption>
    </figure>
    <details class="tbl"><summary>Table view</summary><table><tr><th>n</th><th>SAT 2ⁿ</th><th>TSP (n−1)!/2</th></tr>${[4, 5, 6, 7, 8, 10, 12, 15, 20].map(n => `<tr><td class="n">${n}</td><td class="n">${sciH(2 ** n)}</td><td class="n">${sciH(fact(n - 1) / 2)}</td></tr>`).join("")}</table></details>
    <div class="tiles">
      <div class="tile"><div class="v">10<sup>30</sup></div><div class="l">candidates for SAT with 100 variables; about as many as bacterial cells on Earth (5 × 10<sup>30</sup>)</div></div>
      <div class="tile"><div class="v">${(frac * 100).toExponential(1).replace(/e-(\d+)/, " × 10<sup>−$1</sup>")} %</div><div class="l">of them checked by a machine testing 1,000 strings per second since the Big Bang (the slides say “fewer than 1 %”)</div></div>
      <div class="tile"><div class="v">3 × 10<sup>62</sup></div><div class="l">tours of a 50-city TSP; more than there are litres of water on the planet</div></div>
      <div class="tile"><div class="v">n additions</div><div class="l">to evaluate one TSP tour from the distance table, so evaluation is cheap even when search is not</div></div>
    </div>
    <p>The two problems differ in a second way that matters more than their size. A TSP tour has a natural quality: its length, computed with n additions from the distance table, and a shorter tour is a better tour. SAT only says true or false. If F(x) is false, how far from a solution is x? Finding an evaluation function that gives more than “right or wrong”, so that candidates closer to a solution score better, is the first design decision of every search method in this course.</p>

    <h3>Models</h3>
    <p>We never solve the problem, we solve a model of it, and every model simplifies the world. That leaves two routes, and the lecture takes a side:</p>
    <ul class="cmp two">
      <li><b>Approximate model, precise solution</b><span class="v"><span class="sw v"></span>Problem → Model<sub>a</sub> → Solution<sub>p</sub>(Model<sub>a</sub>). Simplify until an exact algorithm applies; the exact answer may be an answer to the wrong question.</span></li>
      <li><b>Precise model, approximate solution</b><span class="v"><span class="sw t"></span>Problem → Model<sub>p</sub> → Solution<sub>a</sub>(Model<sub>p</sub>). Keep the problem honest and accept a heuristic answer. The slides' verdict: this one is better.</span></li>
    </ul>
    <p class="muted">Context, not on the slides: this preference is the thesis of the Michalewicz &amp; Fogel textbook the first lectures follow, and it is why the course spends more time on local search, annealing, tabu and evolutionary methods (approximate solvers for precise models) than on exact algorithms.</p>

    <h3>Change over time</h3>
    <p>Problems change before you model them, while you solve them and after you execute the solution. The TSP example: travel time between two cities depends on traffic lights, slow trucks, a flat tyre, the weather. A solution that was optimal for the model may be useless for the road, which is the case for approach 2 again: a method that can produce a new good solution quickly beats one that produces the perfect solution slowly.</p>

    <h3>Constraints</h3>
    <p>Almost every practical problem has constraints, of two kinds. <b>Hard constraints</b> decide feasibility: a solution that violates one is no solution. <b>Soft constraints</b> decide quality among feasible solutions; each has to be quantified so that two candidates can be compared. The slides' example is a semester timetable:</p>
    <div class="cons">
      <div class="con hard"><div class="kicker">Hard · defines feasible</div><ul><li>every class gets a room with enough seats and the right facilities</li><li>a student's classes never overlap</li><li>a professor's classes never overlap</li></ul></div>
      <div class="con soft"><div class="kicker">Soft · ranks the feasible</div><ul><li>twice-a-week courses on Mon/Wed or Tue/Thu, three times a week on Mon/Wed/Fri</li><li>no back-to-back final exams for a student</li><li>among fitting rooms, the one closest to the class size</li></ul></div>
    </div>
    <p>Constraints shrink the search space, which sounds helpful, but they make its geometry awkward: an operator that turns one feasible timetable into a better feasible one is hard to write, and a tiny change often breaks a hard constraint. Much of lectures 6 to 9 (ASP, CSP) is about handling constraints declaratively instead of by hand-written operators.</p>
    <figure class="viz"><svg viewBox="0 0 600 170" role="img" aria-label="Nested regions: all candidate timetables, inside them the feasible ones, inside them the best by soft constraints">
      <rect x="10" y="10" width="580" height="150" rx="14" class="reg all"/><text class="cat" x="24" y="34">all candidate timetables (the search space)</text>
      <path d="M150,40 C260,20 420,30 520,60 C570,80 540,140 440,150 C330,160 200,150 150,120 C120,100 110,55 150,40 Z" class="reg feas"/><text class="cat" x="230" y="70">feasible: all hard constraints hold</text>
      <ellipse cx="400" cy="112" rx="70" ry="26" class="reg best"/><text class="cat" x="400" y="116" text-anchor="middle">best by soft constraints</text>
    </svg><figcaption>Hard constraints cut the space down to the feasible region; soft constraints, once quantified, rank what is left. The regions are schematic.</figcaption></figure>

    <h2>Puzzle 2: the handshake party</h2>
    <p>Mr and Mrs Smith invite four other couples. Some people shake hands; nobody shakes their own spouse's hand or the same hand twice. Mr Smith then asks everyone how many hands they shook and gets nine different answers. How many hands did Mrs Smith shake? The slides leave it open (“solve the problem!”); the solution below is context, not from the slides, but it is the standard argument and a good warm-up for the exam style of reasoning.</p>
    ${lab("hs", "pair the extremes until only the Smiths are left")}
    <div class="ex"><div class="kicker">Why this is a search problem in disguise</div><p>Enumerating handshake graphs on ten people is hopeless by hand, but one observation (an answer of 8 forces an answer of 0 in the same couple) collapses the search to four forced steps. That is the pattern of the whole course: a good constraint or heuristic does not speed up the enumeration, it replaces it.</p></div>

    <h2>Take-home</h2>
    <ul>
      <li><b>Four reasons problems are hard:</b> huge search spaces, models that must simplify, evaluations that are noisy or change over time, and constraints that make feasibility itself hard.</li>
      <li><b>Know the two sizes:</b> SAT with n variables has 2ⁿ candidates, the symmetric TSP with n cities has (n−1)!/2 tours; TSP is bigger from n = 7 on.</li>
      <li><b>Evaluation functions</b> matter as much as search spaces: TSP has a natural one, SAT needs one to be invented.</li>
      <li><b>Prefer a precise model with an approximate solution</b> to an approximate model with a precise solution.</li>
      <li><b>Hard constraints define feasibility, soft constraints define quality</b>, and soft constraints must be quantified before two solutions can be compared.</li>
    </ul>
    <h2>Exam relevance</h2>
    <p class="muted">Context, not on the slides: introduction material tends to appear as short definition and reasoning questions (hard vs soft constraints, why exhaustive search fails, the size of a search space for a given encoding) rather than as computations. Be able to derive (n−1)!/2 and 2ⁿ from the representation, and to argue a puzzle like the handshakes in a few lines.</p>
    <p class="muted">Next: <a href="advanced-problem-solving/lecture.html?n=2">lecture 2</a>, uninformed vs informed search and dynamic programming. Slides: OPAL → Lectures → Lesson 1 (intro).</p>`;
}

// ---------------- Lecture 2: uninformed vs informed search, dynamic programming ----------------
// Backtracking on the SAT tree: a partial assignment is dead once a selected clause has every literal false.
const CLAUSES = [["x₁ ∨ x₂", [[1, true], [2, true]]], ["¬x₁ ∨ x₃", [[1, false], [3, true]]], ["¬x₂ ∨ ¬x₃", [[2, false], [3, false]]], ["x₁ ∨ ¬x₃", [[1, true], [3, false]]]];
function satOut(sel, narrow) {
  const W = narrow ? 340 : 600, H = narrow ? 230 : 250, tr = binTree(3, W, H, 26);
  const assign = id => { const a = {}; let k = id; while (k > 0) { const p = Math.floor((k - 1) / 2), d = Math.floor(Math.log2(p + 1)) + 1; a[d] = k === 2 * p + 2; k = p; } return a; };

    <p class="lead">Lecture 2 covers the classic search algorithms in one sitting: how to enumerate a search space and prune it by backtracking, the four uninformed strategies with their complete/optimal/time/space profile, the two informed ones (greedy best-first and A*) on the Romania map, and dynamic programming as the third member of the best-first family. Three explorers below let you run each algorithm step by step, which is exactly what the tutorial and the exam ask for.</p>
    <div class="tiles">
      <div class="tile"><div class="v">b, d, m</div><div class="l">branching factor, depth of the cheapest solution, maximum depth of the space</div></div>
      <div class="tile"><div class="v">f = g + h</div><div class="l">A*: cost so far plus an estimate that never overestimates</div></div>
      <div class="tile"><div class="v">O(b·d)</div><div class="l">memory of iterative deepening, against O(b<sup>d+1</sup>) for breadth-first</div></div>
      <div class="tile"><div class="v">once</div><div class="l">how often dynamic programming solves each subproblem</div></div>
    </div>

    <h2>Complete and partial solutions</h2>
    <p>Classic search algorithms split into two families by what they evaluate. Interrupt one of the first kind and you still have an answer; interrupt one of the second kind and you may have nothing.</p>
    <ul class="cmp two">
      <li><b>Complete solutions</b><span class="v"><span class="sw t"></span>Every decision variable is set: a binary string of length n for SAT, a permutation of the cities for the TSP. Two solutions are compared with the evaluation function and the better one replaces the current one. Exhaustive search, local search, hill climbing, simulated annealing, tabu search and evolutionary algorithms all work this way (lectures 3 to 5).</span></li>
      <li><b>Partial solutions</b><span class="v"><span class="sw v"></span>Either an incomplete solution to the original problem (all SAT strings whose first two bits are 1; all tours containing 7–11–2–16) or a complete solution to a reduced problem (the shortest route through k of the n cities, as a building block). You then need a way to organise the sub-spaces and a second evaluation function for partial solutions. Tree search, A* and dynamic programming live here (this lecture, plus CSP in lecture 9).</span></li>
    </ul>

    <h2>Exhaustive search and backtracking</h2>
    <p>Exhaustive (enumerative) search checks every point of the space until the best global solution has been found. It is simple, works only on small instances, and the order of enumeration does not matter because everything gets evaluated. The one question is how to generate every candidate exactly once, and the answer depends on the representation. For SAT: all binary strings of length n correspond one-to-one to the integers 0 … 2ⁿ−1, so count and convert.</p>
    <div class="tt-wrap"><table class="tt enum"><tbody>${[0, 1, 2, 3].map(r => `<tr>${[0, 4, 8, 12].map(cb => { const v = cb + r; return `<td class="mono">${v.toString(2).padStart(4, "0")}</td><td class="n muted">${v}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <p>The same strings organise into a binary tree: split on x₁, then on x₂, and so on. That tree is where <b>backtracking</b> pays off. If φ contains the clause (x₁ ∨ x₂), every assignment with x₁ = f and x₂ = f falsifies it, so the whole subtree below that node is a dead end and the search backs up without visiting its leaves. Branch and bound and A* are refinements of this idea: an exhaustive search with a reason to skip subtrees.</p>
    ${lab("sat", "prune the SAT tree with the clauses of φ")}

    <h2>How to judge a search strategy</h2>
    <p>A strategy is defined by the order in which it expands nodes, and every strategy in this lecture is scored on the same four questions: is it <b>complete</b> (finds a solution whenever one exists), is it <b>optimal</b> (finds a least-cost one), and what are its <b>time</b> (nodes generated) and <b>space</b> (nodes held in memory at once) complexities, written in terms of the branching factor b, the depth d of the cheapest solution and the maximum depth m of the state space, which may be infinite. Keep these four lines in your head for every algorithm; the exam asks for them.</p>

    <h2>Uninformed search</h2>
    <p>Uninformed strategies use nothing but the problem definition: they cannot tell a promising node from a hopeless one, only a shallow one from a deep one. The four in the lecture differ only in which frontier node they take next.</p>
    <ul>
      <li><b>Breadth-first:</b> expand the shallowest unexpanded node. The frontier is a FIFO queue: new nodes go to the back, old ones are expanded first.</li>
      <li><b>Depth-first:</b> expand the deepest unexpanded node. The frontier is a LIFO stack: the most recently generated node is expanded next.</li>
      <li><b>Depth-limited:</b> depth-first with a limit L; nodes at depth L are not expanded. Solves the infinite-path problem, but a bad L means a cutoff (no solution within the limit) rather than a solution, and how to pick L is unclear.</li>
      <li><b>Iterative deepening:</b> run depth-limited search with L = 0, 1, 2, … until a solution appears.</li>
    </ul>
    ${lab("tree", "run the four strategies on the same tree")}
    <p class="muted">Conventions in the explorer: the goal test happens when a node is taken from the frontier (as in the slides' “expand”), children are generated left to right, and depth-first pushes them so that the left child is taken first. Pick a deep goal such as M or O to see depth-first beat breadth-first, and a shallow one such as C to see the opposite.</p>
    <h3>The four profiles</h3>
    <div class="tt-wrap"><table class="tt props"><thead><tr><th></th><th>complete</th><th>optimal</th><th>time</th><th>space</th></tr></thead><tbody>${PROPS.map(r => `<tr><td class="rl">${r[0]}</td><td class="stt ${r[1][0]}">${r[1][0] === "ok" ? "✓" : "✗"} ${r[1][1]}</td><td class="stt ${r[2][0]}">${r[2][0] === "ok" ? "✓" : "✗"} ${r[2][1]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("")}</tbody></table></div>
    <p>Space is the problem for breadth-first: it keeps every generated node, and a machine generating nodes at 100 MB/s fills 8,640 GB in a day (the slides' number). Depth-first needs only the current path plus the siblings along it, O(b·m), but is neither complete nor optimal. Iterative deepening gets the best of both: linear memory, completeness, optimality for unit step costs, and a time bound of O(b<sup>d</sup>) because re-generating the shallow levels is cheap compared with the deepest one.</p>
    ${chart("ids", leg([[1, "breadth-first, each level once"], [2, "iterative deepening, level k generated d + 1 − k times"]]))}
      <figcaption>Nodes generated per level in the worst case for b = 10, d = 5 (solution at the far right leaf). Totals: breadth-first 111,100, iterative deepening 123,450, 11 % more. Hover a level for both counts.</figcaption>
    </figure>
    <div class="ex"><div class="kicker">Worked example · the slide's count, and the general ratio</div>
      <p>Iterative deepening with limit L generates the levels 0 … L, so level k is generated once for each L ≥ k, that is (d + 1 − k) times: 5·10 + 4·100 + 3·1,000 + 2·10,000 + 1·100,000 = 123,450 against 10 + 100 + 1,000 + 10,000 + 100,000 = 111,100 for breadth-first. Context, not on the slides: for large d the ratio tends to b/(b − 1), so the overhead is about 11 % for b = 10 and 100 % for a binary tree, still a constant factor. The slides' conclusion: IDS is the preferred uninformed method when the space is large and the solution depth is unknown; a hybrid runs breadth-first until memory is nearly full and then iterative deepening from every frontier node.</p></div>

    <h2>Informed search</h2>
    <p>Informed (heuristic) strategies add an evaluation function per node, an estimate of how desirable it is, and expand the most desirable unexpanded node: <b>best-first search</b>. The lecture names three special cases, greedy search, A* and dynamic programming, and runs the first two on the textbook map of Romania, driving from Arad to Bucharest with road lengths as step costs and the straight-line distance to Bucharest as heuristic.</p>
    <h3>Greedy best-first search</h3>
    <p>Greedy search uses h(n) alone, the estimated cost from n to the closest goal, here h<sub>SLD</sub>(n), the straight-line distance to Bucharest. It expands whatever looks closest to the goal. From Arad it goes Sibiu (253), then Fagaras (176), then Bucharest (0): three expansions, a path of 450 km. Fast, but not optimal (the Rimnicu Vilcea route is 418 km) and not complete: with Iasi as start and Fagaras as goal it bounces Iasi → Neamt → Iasi → Neamt forever unless repeated states are checked. Time and space are O(b<sup>m</sup>) in the worst case, with a good heuristic dramatically less.</p>
    <h3>A* search</h3>
    <p>A* avoids expanding paths that are already expensive by adding the cost so far: f(n) = g(n) + h(n), the estimated total cost of the cheapest path through n. The one condition is that h is <b>admissible</b>: h(n) ≤ h*(n), the true cost from n to the goal, and h(n) ≥ 0 so that h(G) = 0 at every goal. Straight-line distance never overestimates a road distance, so it qualifies. Theorem of the lecture: A* with an admissible heuristic is optimal.</p>
    ${lab("ro", "greedy and A* from Arad to Bucharest, one expansion per step")}
    <p class="muted">The explorer reproduces the slides' trees exactly, including the tree-search quirk that Sibiu regenerates Arad with f = 646: the slides check no repeated states. Two values on the slide's distance table differ from the trees drawn next to it (Fagaras 178 vs 176, Pitesti 98 vs 100); the trees and this page use the textbook values 176 and 100. The frontier table is sorted best first, so the top row is the next expansion.</p>
    <div class="ex"><div class="kicker">Worked example · A* on the slides, step by step</div>
      <ol>
        <li>Arad: f = 0 + 366 = 366. Expand: Sibiu 393 = 140 + 253, Timisoara 447 = 118 + 329, Zerind 449 = 75 + 374.</li>
        <li>Sibiu (393): Arad 646, Fagaras 415 = 239 + 176, Oradea 671, Rimnicu Vilcea 413 = 220 + 193.</li>
        <li>Rimnicu Vilcea (413): Craiova 526, Pitesti 417 = 317 + 100, Sibiu 553.</li>
        <li>Fagaras (415): Sibiu 591, Bucharest 450 = 450 + 0. Bucharest is in the frontier but not the cheapest node, so A* keeps going.</li>
        <li>Pitesti (417): Bucharest 418 = 418 + 0, Craiova 615, Rimnicu Vilcea 607.</li>
        <li>Bucharest (418) is now the cheapest frontier node and passes the goal test: Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest, 418 km. The 450 km Bucharest node is still in the frontier and never expanded.</li>
      </ol>
      <p>Step 4 is the one to remember: a goal appearing in the frontier is not a solution yet. A* only stops when the goal is <em>taken out</em> of the frontier, because a cheaper path to it may still be waiting.</p></div>
    <h3>Why A* is optimal</h3>
    <p>The standard proof on the slides: suppose a suboptimal goal G₂ sits in the frontier and let n be an unexpanded node on a cheapest path to an optimal goal G. Then f(G₂) = g(G₂) because h(G₂) = 0; g(G₂) &gt; g(G) because G₂ is suboptimal; and g(G) ≥ f(n) because h is admissible (f(n) can at most reach the true cost through n, which is g(G)). So f(G₂) &gt; f(n) and A* expands n before it would ever expand G₂. The more useful version: A* expands nodes in order of increasing f, adding “f-contours” the way breadth-first adds layers. With C* the optimal cost, A* expands every node with f &lt; C*, some with f = C*, and none with f &gt; C*. It is complete unless infinitely many nodes have f ≤ f(G), its time is exponential in the relative error of h times the solution length, and it keeps all nodes in memory.</p>
    ${chart("contours", `<div class="legend"><span class="li"><span class="key" style="--c:color-mix(in srgb, var(--vz-s1) 30%, var(--surface-2))"></span><span class="lt">f* ≤ 400</span></span><span class="li"><span class="key" style="--c:color-mix(in srgb, var(--vz-s1) 55%, var(--surface-2))"></span><span class="lt">≤ 420</span></span><span class="li"><span class="key" style="--c:color-mix(in srgb, var(--vz-s1) 80%, var(--surface-2))"></span><span class="lt">≤ 450</span></span><span class="li"><span class="key" style="--c:var(--vz-s1)"></span><span class="lt">&gt; 450</span></span><span class="li"><span class="key ring"></span><span class="lt">expanded by A* (f* ≤ C* = 418)</span></span></div>`)}
      <figcaption>Each city coloured by f* = g*(city) + h(city), with g* the true shortest distance from Arad: the contours of the slide, computed. Darker is more expensive. Hover a city for its numbers. The six ringed cities are exactly the ones A* expands.</figcaption>
    </figure>
    <details class="tbl"><summary>Table view</summary><table><tr><th>city</th><th>g* from Arad</th><th>h</th><th>f*</th></tr>${gstarRows.map(r => `<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td></tr>`).join("")}</table></details>
    <p class="muted">Context, not on the slides: the textbook also asks for h to be <em>consistent</em> (h(n) ≤ c(n, n′) + h(n′)) when A* is run as a graph search with an explored set; with tree search, as here, admissibility alone suffices. Expect a tutorial problem that asks whether a given heuristic is admissible: check h(n) ≤ h*(n) for every node, and remember h = 0 is always admissible but useless (it turns A* into uniform-cost search).</p>

    <h2>Dynamic programming</h2>
    <p>The third best-first special case gets the second half of the lecture. The starting point is the problem with naive recursion: definitions like Fibonacci, F<sub>n</sub> = F<sub>n−1</sub> + F<sub>n−2</sub> with F₁ = F₂ = 1, are easy to write and exponential to run, because the recursion tree recomputes the same subproblems over and over. F(3) is computed twice inside F(5), F(2) three times, and the tree has O(φⁿ) nodes with φ ≈ 1.618.</p>
    ${chart("fib", leg([[1, "naive recursion"], [3, "with memoisation"]]))}
      <figcaption>How often each F(k) is called while computing F(10). The naive counts are themselves Fibonacci numbers; memoisation flattens them to one call each.</figcaption>
    </figure>
    <div class="tiles">
      <div class="tile"><div class="v">${num(totalCalls(30), 0)}</div><div class="l">calls to compute F(30) naively</div></div>
      <div class="tile"><div class="v">31</div><div class="l">calls with memoisation, one per subproblem</div></div>
      <div class="tile"><div class="v">O(1)</div><div class="l">extra space of the bottom-up version: two variables rolling forward</div></div>
    </div>
    <p><b>Definition.</b> Dynamic programming (Bellman, 1950s, from optimal control; now everywhere from graph algorithms to bioinformatics, with Dijkstra's shortest-path algorithm as the prominent example) solves optimisation and counting problems by decomposing them into simpler subproblems, solving each subproblem exactly once, and storing the results so nothing is recomputed. The slides place it between greedy algorithms (O(n log n), fast but not always correct) and brute force (O(cⁿ), correct but hopeless): exact and efficient when it applies.</p>
    <h3>When it applies: two conditions, both required</h3>
    <ul class="cmp two">
      <li><b>Optimal substructure</b><span class="v"><span class="sw t"></span>OPT(x) = f(OPT(x₁), …, OPT(x<sub>k</sub>)) for strictly smaller instances x<sub>i</sub>. Verify by cut-and-paste: take an optimal solution, replace the sub-solution it uses for x<sub>i</sub> by the true optimum for x<sub>i</sub>; if the result stays feasible and no worse, the property holds. Holds for shortest paths in a DAG (any subpath of a shortest path is shortest) and for 0/1 knapsack (item n is in or out, the rest is an optimal choice for the remaining capacity). Fails for the longest simple path: the sub-solution u → v → w blocks w, so subpaths of longest simple paths are not longest simple paths; the problem is NP-complete.</span></li>
      <li><b>Overlapping subproblems</b><span class="v"><span class="sw v"></span>A naive recursion visits the same subproblem instance more than once. Rule of thumb from the slides: draw the recursion DAG; shared nodes (reachable from several parents) mean overlap. Fibonacci overlaps massively. Merge sort does not: each half appears exactly once, so memoisation would add overhead without benefit and DP does not apply, even though the substructure is optimal.</span></li>
    </ul>
    <h3>Two ways to implement it</h3>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th></th><th>memoisation (top-down)</th><th>tabulation (bottom-up)</th></tr></thead><tbody>
      <tr><td class="rl">how</td><td>keep the recursive definition; before solving a subproblem look it up in a table, after solving it store it</td><td>fill the table from the smallest subproblems upward in an explicit order</td></tr>
      <tr><td class="rl">subproblems solved</td><td>only the reachable ones</td><td>all in the defined space</td></tr>
      <tr><td class="rl">stack</td><td>O(depth)</td><td>O(1) extra</td></tr>
      <tr><td class="rl">space optimisation</td><td>harder</td><td>straightforward (rolling array, as in the O(1) Fibonacci)</td></tr>
      <tr><td class="rl">prefer when</td><td>the state space is sparse</td><td>the state space is dense and the order is known</td></tr>
    </tbody></table></div>
    <p>The asymptotic complexity is the same either way, because both visit each subproblem once: <span class="formula">T<sub>DP</sub> = number of distinct subproblems × work per subproblem</span>, the size of the state space times the cost of one recurrence step. That formula is the fastest way to answer “what is the complexity of your DP?” on a sheet.</p>
    <h3>Worked example: coin change, bottom-up</h3>
    <p>Minimum number of coins from a set C to pay exactly n. Subproblem: dp[a] = fewest coins for amount a; recurrence dp[a] = 1 + min<sub>c ∈ C, c ≤ a</sub> dp[a − c], base dp[0] = 0, impossible amounts stay at ∞. Optimal substructure by cut-and-paste (remove the last coin, the rest must be optimal for a − c); overlapping subproblems because dp[a − c] is needed by every larger amount. The default instance is the classic case where greedy fails:</p>
    ${lab("coins", "fill the dp table and compare with greedy")}
    <p class="muted">The tutorial sheet's instance uses other coins; typing them in shows the table, but do the trace by hand first, since that is what the exam asks for. The second sheet problem of this kind (the bridge crossing) wants you to define the state yourself: which people are on each side, and where the torch is.</p>
    <h3>The applicability checklist</h3>
    <ol>
      <li>Optimal substructure? Argue by cut-and-paste.</li>
      <li>Overlapping subproblems? Draw the recursion DAG and look for shared nodes.</li>
      <li>A finite, manageable state space? Count the distinct subproblems; that number times the work per step is your running time.</li>
      <li>Well-defined base cases?</li>
    </ol>
    <p>The summary slide is honest about the cost: dynamic programming is complete and optimal, but time and space consuming, and the hard part is choosing the subproblems.</p>

    <h2>Take-home</h2>
    <ul>
      <li><b>Two families:</b> algorithms on complete solutions (interruptible) and on partial solutions (tree search, A*, DP), which need an organisation of the sub-spaces and an evaluation for partial solutions.</li>
      <li><b>Four questions per strategy:</b> complete, optimal, time, space, in terms of b, d, m. Breadth-first is complete and optimal for unit costs but needs O(b<sup>d+1</sup>) memory; depth-first needs O(b·m) memory but is neither; iterative deepening is complete, optimal for unit costs, O(b·d) memory and O(b<sup>d</sup>) time.</li>
      <li><b>Greedy uses h, A* uses g + h.</b> With an admissible h (never overestimates, zero at goals) A* is optimal; it expands all nodes with f &lt; C* and stops only when a goal is taken out of the frontier.</li>
      <li><b>Dynamic programming</b> needs optimal substructure and overlapping subproblems; solve each subproblem once, top-down with a memo or bottom-up with a table; running time = distinct subproblems × work per subproblem.</li>
    </ul>
    <h2>Tutorial 1 and exam relevance</h2>
    <p>Sheet 1 (OPAL, in your group on <b>Fri 30 Oct</b>) is built from this lecture: an A* run in a maze (choose a heuristic, say which cells are explored, give the path and argue it is optimal), a coin-change dynamic programme (recurrence, full table, complexity, comparison with greedy) and the bridge-crossing puzzle as a DP (define the state space first). See <a href="advanced-problem-solving/exercise.html?n=1">tutorial 1</a>.</p>
    <p class="muted">Context, not on the slides: the exam-style questions this lecture generates are hand traces (expansion order and frontier for BFS/DFS/IDS/greedy/A* on a small graph), the four-line profile of a strategy, an admissibility check for a given heuristic, and a DP where you must state subproblem, recurrence, base case and complexity. The explorers above are practice for the traces.</p>
    <p class="muted">Next: Local search, stochastic hill climbing and simulated annealing (<a href="advanced-problem-solving/lecture.html?n=3">lecture 3</a>). Slides: OPAL → Lectures → Lesson 2 (trad search); the three extra PDFs there are scanned textbook chapters (Russell &amp; Norvig 3.4 and 3.5, Michalewicz &amp; Fogel 4.3 on dynamic programming and the stagecoach problem) for reading, not slides.</p>`;
}

function lecture3() {
  const pT = (d, T) => accept(d, T);
  return `${head(l)}
    <p class="lead">Lecture 2 searched through partial solutions with a frontier. This lecture switches to the other family from lecture 1: algorithms that hold one <em>complete</em> candidate and move to a neighbour. The simplest version, hill climbing, stops at the first local optimum. The rest of the lecture is about getting out again: GSAT for SAT, 2-opt for the TSP, then a temperature parameter that makes worse moves acceptable with a probability (the stochastic hill-climber) and finally lets that probability fall over the run (simulated annealing). All of it comes from the Michalewicz &amp; Fogel textbook, chapter 5.</p>
    <div class="tiles">
      <div class="tile"><div class="v">1 / (1 + e<sup>Δ/T</sup>)</div><div class="l">acceptance probability of the stochastic hill-climber, Δ = eval(v<sub>c</sub>) − eval(v<sub>n</sub>) when eval is maximised</div></div>
      <div class="tile"><div class="v">0.5</div><div class="l">p for an equally good neighbour, at every T; T → ∞ makes every move a coin flip</div></div>
      <div class="tile"><div class="v">T ← α T</div><div class="l">geometric cooling, the usual schedule; α between 0.8 and 0.99, start with 0.95</div></div>
      <div class="tile"><div class="v">n(n − 3)/2</div><div class="l">2-opt neighbours of an n-city tour; k-opt neighbourhoods grow exponentially in k</div></div>
    </div>

    <h2>Hill climbing and where it stops <small>(slides 4–7)</small></h2>
    <p>A hill-climbing method keeps a single current point and iteratively improves it: look at the neighbourhood of v<sub>c</sub>, take the best neighbour v<sub>n</sub>, and if it beats v<sub>c</sub> make it the new current point; otherwise stop. The <b>iterated hill-climber</b> of slide 5 wraps that in an outer loop of MAX random restarts and remembers the best local optimum seen. Four weaknesses, all on slide 6: it usually ends in a local optimum; it tells you nothing about how far that is from the global optimum or from other local optima; the result depends on the start point; and there is no useful bound on the running time. What makes it attractive anyway is how little it needs: a representation, an evaluation function and a neighbourhood.</p>
    ${lab("land", "walk a hill-climber and its stochastic cousins over one landscape")}
    <p>The energy-landscape slide (7) names the three shapes that matter: a <b>local optimum</b> (better than all neighbours, not globally best), the <b>global optimum</b>, and a <b>plateau</b>, where no neighbour is better but the current point is not optimal either. With T = 0.1 the explorer climbs the first hill, reaches position 6 and never leaves: every downhill proposal has p ≈ 0. With T = 2 it escapes to the second hill at 16 and gets stuck there; with T = 8 it crosses the plateau at 28 to 34 and finds the global optimum at ${LAND_BEST}; with T = 30 it finds it as well but accepts nearly everything, so it does not stay. Annealing starts hot, finds the optimum, and is cold enough at the end to stay there, which is the whole idea of the second half.</p>

    <h2>Exploration against exploitation <small>(slide 8)</small></h2>
    <ul class="cmp two">
      <li><b>Hill climbing: all exploitation</b><span class="v"><span class="sw t"></span>Squeezes the best solution found so far for improvements and never looks at most of the search space.</span></li>
      <li><b>Random search: all exploration</b><span class="v"><span class="sw v"></span>Samples every point with equal probability, so it covers the space but never builds on a promising region.</span></li>
    </ul>
    <p>Every effective method has some mechanism for balancing the two, and the slide is explicit that no single method serves well in every case (the no-free-lunch idea, in plain words).</p>

    <h2>Local search and the size of the neighbourhood <small>(slides 9–10)</small></h2>
    <p>The generic loop: pick a solution, apply a transformation to get a new one, keep it if it is better, repeat until no transformation improves the current solution. Everything hinges on the transformation. Two extremes bracket the design space: returning a uniformly random point ignores the current solution entirely (the search degenerates to enumeration, possibly resampling old points), and returning the current solution itself gets you nowhere. Searching a <em>local neighbourhood</em> is the compromise: the current solution biases where you look next and improvements are retained.</p>
    <ul class="cmp two">
      <li><b>Small neighbourhood</b><span class="v"><span class="sw t"></span>Quick to scan, but easy to get trapped in a local optimum.</span></li>
      <li><b>Large neighbourhood</b><span class="v"><span class="sw v"></span>Fewer traps, but scanning it costs so much that efficiency suffers.</span></li>
    </ul>
    <p>Two variants recur in every later algorithm: <b>best improvement</b> scans the whole neighbourhood and takes the best neighbour; <b>first improvement</b> moves as soon as any better neighbour turns up. The 2-opt explorer below has both.</p>

    <h2>GSAT: local search for SAT <small>(slides 11–12)</small></h2>
    <p>GSAT starts from a random truth assignment and, for MAX-FLIPS rounds, flips one variable; after MAX-FLIPS without success it restarts with a new random assignment, MAX-TRIES times. The flip is chosen greedily: try every single-variable flip, count the unsatisfied clauses, take the largest decrease. Note what the evaluation function is: for SAT the lecture-1 problem of “true or false tells you nothing” is solved by counting unsatisfied clauses, which turns SAT into an optimisation problem with a gradient to follow.</p>
    ${lab("gsat", "run GSAT on a four-clause formula with a plateau")}
    <p>The feature worth remembering (slide 12): the best available flip may <em>increase</em> the number of unsatisfied clauses, because the choice is made only among the one-flip neighbours. GSAT therefore takes the least bad move when every neighbour is worse, and so it can escape a local optimum, but only one backward step at a time (a backward move implies the reverse flip is an improving move, so two backward moves in a row cannot happen). On plateaus it may oscillate between points forever. One remedy on the slide: give each clause a weight and raise the weights of clauses that stay unsatisfied, so the landscape itself changes under the search.</p>
    ${why("Context, not on the slides", `<p>From (F, F, F) every flip leaves exactly one clause of ψ unsatisfied, a three-way tie at a decrease of 0, and the slides do not say how to break ties. With the plain “lowest index” rule the explorer bounces between (F, F, F) and (T, F, F) forever, which is the oscillation the slide warns about; refusing to undo the last flip walks (F, F, F) → (T, F, F) → (T, T, F) → (T, T, T) and satisfies ψ in three flips. The “never undo the last flip” rule is the simplest of the tabu ideas of lecture 4, and “random” is what the original GSAT paper does. Tutorial 2 asks for exactly this kind of trace on a four-clause formula, with the tie-break left to you.</p>`)}

    <h2>2-opt: local search for the TSP <small>(slides 13–14)</small></h2>
    <p>Start from a random permutation of the cities, tour T. A <b>2-interchange</b> removes two non-adjacent edges and reconnects the two pieces the only other possible way, which reverses one segment. The neighbourhood of T is every tour reachable by one 2-interchange; 2-opt replaces T by the first better neighbour it finds (first improvement, as the slide stresses), and stops when no neighbour is better: T is then <b>2-optimal</b>. Like GSAT it is restarted from several random permutations.</p>
    ${lab("twoopt", "untangle a crossing tour one 2-interchange at a time")}
    <p>Generalising to <b>k-opt</b> (change k, or up to k, edges) is the same trade-off as above: small k scans fast but accepts worse tours, and the neighbourhood size grows exponentially in k, so k &gt; 3 is seldom used. A geometric fact that is not on the slides but explains the explorer: in the plane, a tour that crosses itself is never 2-optimal, because uncrossing two edges always shortens it (triangle inequality).</p>

    <h2>Escaping local optima <small>(slides 15–18)</small></h2>
    <p>Traditional strategies either guarantee the global optimum and are too expensive, or get stuck. Since the problems are NP-hard there is no realistic hope of speeding up the exact methods, so the remaining option is to design algorithms that can leave a local optimum. The lecture names the two mechanisms it will treat: <b>simulated annealing</b> adds a temperature that changes the probability of moving between points, <b>tabu search</b> (lecture 4) adds memory that forces the search into new areas.</p>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th></th><th>local search</th><th>simulated annealing</th></tr></thead><tbody>
      <tr><td class="rl">loop</td><td>while improve(x) ≠ “no”: x = improve(x)</td><td>while not termination-condition: x = improve?(x, T); update(T)</td></tr>
      <tr><td class="rl">halts when</td><td>no neighbour improves x (x is a local optimum)</td><td>an external termination condition is met</td></tr>
      <tr><td class="rl">improve returns</td><td>a better y ∈ N(x), or “no”</td><td>an <em>accepted</em> y ∈ N(x), acceptance depending on T; y need not be better</td></tr>
      <tr><td class="rl">parameter</td><td>none</td><td>T, updated periodically; its value shapes what improve? accepts</td></tr>
    </tbody></table></div>

    <h2>The stochastic hill-climber <small>(slides 19–25)</small></h2>
    <p>Two changes turn the iterated hill-climber into the stochastic one (slide 20, highlighted): sample <b>one random neighbour</b> per step instead of scanning the whole neighbourhood, and <b>accept it with a probability</b> instead of only when it is better. There is one loop and no restarts; T stays constant during the run. With eval to be maximised and Δ = eval(v<sub>c</sub>) − eval(v<sub>n</sub>):</p>
    <p class="formula">p = 1 / (1 + e<sup>Δ / T</sup>)</p>
    ${ex("Worked example: the slide-22 table, recomputed", `<p>eval(v<sub>c</sub>) = 107, eval(v<sub>n</sub>) = 120, so Δ = −13 and v<sub>n</sub> is better. For T = 5: e<sup>−13/5</sup> = e<sup>−2.6</sup> = ${num(Math.exp(-2.6), 4)}, p = 1 / (1 + ${num(Math.exp(-2.6), 4)}) = ${num(pT(-13, 5), 3)}. The same for the other rows: T = 1 → ${num(pT(-13, 1), 3)}, T = 10 → ${num(pT(-13, 10), 2)}, T = 20 → ${num(pT(-13, 20), 2)}, T = 50 → ${num(pT(-13, 50), 2)}, T = 10<sup>10</sup> → 0.5. The better the temperature hides the difference, the closer p sits to a coin flip.</p>`)}
    ${chart("roleT", leg([[3, "vn better by 13 (Δ = −13)"], [2, "vn worse by 13 (Δ = +13)"]]))}
      <figcaption>The role of T (slide 22) with its mirror image: p(−Δ) = 1 − p(Δ). Huge T accepts a 13-point improvement and a 13-point deterioration equally often; tiny T is an ordinary hill-climber.</figcaption>
    </figure>
    <details class="tbl"><summary>Table view</summary><table><tr><th>T</th><th>e<sup>−13/T</sup></th><th>p, Δ = −13</th><th>p, Δ = +13</th></tr>${[1, 5, 10, 20, 50].map(T => `<tr><td class="n">${T}</td><td class="n">${num(Math.exp(-13 / T), 4)}</td><td class="n">${num(pT(-13, T), 3)}</td><td class="n">${num(pT(13, T), 3)}</td></tr>`).join("")}</table></details>
    <p>Slide 23 fixes T = 10 and eval(v<sub>c</sub>) = 107 and varies the new string instead: eval(v<sub>n</sub>) = 80 gives Δ = 27 and p = ${num(pT(27, 10), 2)}; 100 gives ${num(pT(7, 10), 2)}; 107 gives exactly 0.5; 120 gives ${num(pT(-13, 10), 2)}; 150 gives ${num(pT(-43, 10), 2)}. Three rules fall out: an equal neighbour is accepted with probability one half, a better one with more than one half, and p grows with the (negative) difference.</p>
    ${chart("accept", leg([[1, "T = 2 (steep: almost a hill-climber)"], [2, "T = 8"], [3, "T = 30 (flat: almost random)"]]))}
      <figcaption>Acceptance probability as a function of Δ (slide 24). T controls the steepness of the sigmoid; every curve passes through p = 0.5 at Δ = 0. Hover or focus the plot and use the arrow keys.</figcaption>
    </figure>
    <ul class="cmp two">
      <li><b>Small T, steep curve</b><span class="v"><span class="sw t"></span>Only clearly better moves pass, worsening moves are rejected almost surely: a hill-climber that gets trapped.</span></li>
      <li><b>Large T, flat curve</b><span class="v"><span class="sw v"></span>Almost any neighbour passes with p ≈ 0.5, quality barely matters: random search with no exploitation.</span></li>
    </ul>

    <h2>Simulated annealing <small>(slides 26–32)</small></h2>
    <p>Simulated annealing is the stochastic hill-climber with one change: <b>T decreases during the run</b>. It starts hot (nearly random search), cools gradually, and ends cold (an ordinary hill-climber fine-tuning the best region found). In addition, better points are always accepted; a worse point is accepted if a random number is below e<sup>−Δ/T</sup> (slide 27 writes the test as rand &lt; e<sup>(eval(v<sub>c</sub>) − eval(v<sub>n</sub>))/T</sup> for a maximisation with Δ ≥ 0, which is the Metropolis rule rather than the sigmoid of the stochastic hill-climber). The temperature schedule therefore trades exploration against exploitation <em>within one run</em> instead of choosing one of them, and under a sufficiently slow cooling schedule the method provably converges to the global optimum.</p>
    ${chart("cool", leg([[1, "geometric: T ← α T"], [2, "linear: T ← T − c"], [3, "logarithmic: T ← T₀ / ln(1 + t)"]]))}
      <figcaption>The three cooling schedules of slide 28 from T₀ = 10 (α = 0.95, c = 0.1). Geometric is what practice uses; linear cools too fast at low T; logarithmic is the schedule of the convergence theorem and far too slow to use.</figcaption>
    </figure>
    <h3>Choosing the parameters (slide 29)</h3>
    <ul>
      <li><b>T<sub>max</sub></b>: run a short pilot, measure the average cost increase Δ̄ of worsening moves, and choose T<sub>max</sub> ≈ −Δ̄ / ln 0.8, so that about 80 % of bad moves are accepted at the start.</li>
      <li><b>T<sub>min</sub></b> close to 0: there the algorithm is a hill-climber and is ready to stop.</li>
      <li><b>α</b> = 0.95 to start, down to 0.80 for a faster, coarser search; the number of steps per temperature level matters too (longer means better equilibration at higher cost).</li>
      <li>Rule of thumb for a new problem: α = 0.95, run until T &lt; 0.01 · T<sub>max</sub>, then tune on solution quality against runtime.</li>
    </ul>
    ${ex("Worked example: a starting temperature from a pilot run", `<p>Suppose the pilot run shows that worsening moves cost 4 points on average. Then T<sub>max</sub> ≈ −4 / ln 0.8 = 4 / 0.2231 = ${num(-4 / Math.log(0.8), 1)}. Check: a typical bad move is then accepted with e<sup>−4/${num(-4 / Math.log(0.8), 1)}</sup> = 0.80. With α = 0.95 and the stop rule T &lt; 0.01 · T<sub>max</sub>, the run needs ln(0.01) / ln(0.95) = ${num(Math.log(0.01) / Math.log(0.95), 0)} temperature levels.</p>`)}
    <h3>The physical analogy (slides 30–31)</h3>
    <p>The name comes from growing crystals: melt the raw material, then lower the temperature slowly until the structure freezes in; cool too quickly and irregularities get locked in. The same method goes by Monte Carlo annealing, statistical cooling, probabilistic hill-climbing, stochastic relaxation and probabilistic exchange algorithm.</p>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th>physical system</th><th>optimisation problem</th></tr></thead><tbody>
      <tr><td>state</td><td>feasible solution</td></tr><tr><td>energy</td><td>evaluation function</td></tr><tr><td>ground state</td><td>optimal solution</td></tr><tr><td>rapid quenching</td><td>local search</td></tr><tr><td>temperature</td><td>control parameter T</td></tr><tr><td>careful annealing</td><td>simulated annealing</td></tr>
    </tbody></table></div>
    <h3>The questions every SA design must answer (slide 32)</h3>
    <ol>
      <li>What is a solution? (the representation, hence the search space)</li>
      <li>What are the neighbours of a solution? (the neighbourhood)</li>
      <li>What is the cost of a solution? (the evaluation function)</li>
      <li>How is the initial solution determined?</li>
    </ol>
    <p>And then the annealing-specific ones: the initial temperature, the cooling ratio g(T, t), the termination condition of the inner loop and the halting criterion of the outer one. Tutorial 2 asks the first four for the maze; keep this list as the template for any “design an SA for …” question.</p>

    <h2>SA for SAT <small>(slides 33–35)</small></h2>
    <p>SA-SAT runs MAX-TRIES independent attempts. Each starts from a random assignment with T = T<sub>max</sub> and j = 0; in the inner loop, if the assignment satisfies the formula it is returned, otherwise the temperature is set to T = T<sub>max</sub> · e<sup>−j·r</sup>, every variable is considered in turn, the gain δ in satisfied clauses of flipping it is computed, and the flip is made with probability (1 + e<sup>−δ/T</sup>)<sup>−1</sup>; then j is incremented, which is what lowers T. The attempt ends when T drops below T<sub>min</sub>; r is the decay rate from T<sub>max</sub> to T<sub>min</sub>. A flip that would hurt (δ &lt; 0) is unlikely but possible, a flip that helps is likely.</p>
    <ul class="cmp two">
      <li><b>GSAT</b><span class="v"><span class="sw t"></span>Picks the best flip deterministically; can make one backward move when nothing improves, never two in a row; weights or restarts needed for plateaus.</span></li>
      <li><b>SA-SAT</b><span class="v"><span class="sw v"></span>Flips each variable probabilistically; can make an arbitrary sequence of backward moves and so escape local optima. On the slides' comparison it satisfied at least as many formulas as GSAT with less work.</span></li>
    </ul>
    <p>Applications named on slide 35: the TSP, production scheduling, timetabling, image processing.</p>

    <h2>Take-home</h2>
    <ul>
      <li><b>Hill climbing</b> (best neighbour, stop when none is better) ends in local optima, depends on the start and needs restarts; it works on complete solutions and needs only a representation, an evaluation function and a neighbourhood.</li>
      <li><b>Local search can make one backward move</b> (GSAT); the size of the neighbourhood trades speed against the risk of getting trapped (2-opt vs k-opt).</li>
      <li><b>Stochastic hill-climber:</b> one random neighbour per step, accepted with p = 1/(1 + e<sup>Δ/T</sup>); T constant; Δ = 0 gives 0.5, small T is a hill-climber, huge T is random search.</li>
      <li><b>Simulated annealing:</b> the same with T falling over the run (geometric cooling, α ≈ 0.95), better moves always accepted; it can make uphill moves at any time and converges to the global optimum if cooled slowly enough, at the price of many parameters.</li>
      <li><b>Designing an SA</b> means answering: solution, neighbours, cost, initial solution, plus T<sub>max</sub>, cooling, termination and halting.</li>
    </ul>
    <h2>Tutorial 2 and exam relevance</h2>
    <p>Sheet 2 (in OPAL since 30 Oct, your group on <b>Fri 13 Nov</b>) is this lecture turned into tasks: design a simulated annealing algorithm for the maze of sheet 1 and compare it with A*, trace three GSAT steps on a four-clause formula, then compute acceptance probabilities for Δ = 3 at T = 5 and at T = 1, 10, 100. See <a href="advanced-problem-solving/exercise.html?n=2">tutorial 2</a>.</p>
    ${why("Context, not on the slides", `<p>The hand computations this lecture makes possible are exactly the ones on the sheet: evaluate p for given Δ and T (watch the sign convention: Δ = eval(v<sub>c</sub>) − eval(v<sub>n</sub>) with eval maximised, so a worse neighbour has Δ &gt; 0 and p &lt; 0.5), decide a move from a random draw r (accept if r &lt; p), run GSAT by listing all flips with their unsatisfied counts, and argue the four design questions for a given problem. For a written exam, also be able to state the three differences between local search and simulated annealing and the one difference between the stochastic hill-climber and simulated annealing.</p>`)}
    <p class="muted">Next: <a href="advanced-problem-solving/lecture.html?n=4">lecture 4</a>, tabu search. Previous: <a href="advanced-problem-solving/lecture.html?n=2">lecture 2</a>. Slides: OPAL → Lectures → Lesson 3 (local search); the page numbers above are the slide numbers of the 37-slide deck (the PDF has 56 pages because of overlays).</p>`;

// ---------------- Lecture 4: tabu search ----------------
// Tabu search on the lecture-3 landscape: neighbours are the positions up to three steps left or right; the search always
// moves to the best admissible neighbour (not visited in the last `tenure` steps, or better than the best so far), even
// downhill. Ties go to the nearer position, then to the right. Deterministic, so step k is always the same state.
const TABU_MODES = [0, 2, 4, 5, 10, 15];
function tabuRun(tenure, steps, byDefault) {
  let x = 2, best = 2, stuck = false, last = null; const hist = [2];
  for (let k = 0; k < steps; k++) {
    const cand = []; for (let y = x - 3; y <= x + 3; y++) if (y >= 0 && y <= 60 && y !== x) cand.push(y);
    const recent = tenure ? hist.slice(-tenure) : [];
    const isTabu = y => recent.includes(y), asp = y => LAND[y] > LAND[best];
    let adm = cand.filter(y => !isTabu(y) || asp(y)), how = "best admissible";
    if (!adm.length) {
      if (!byDefault) { stuck = true; break; }
      // Aspiration by default: take the neighbour that became tabu longest ago.
      const age = y => recent.length - 1 - recent.lastIndexOf(y);
      adm = [cand.reduce((a, b) => age(b) > age(a) ? b : a)]; how = "aspiration by default (oldest tabu)";
    }
    const y = adm.reduce((a, b) => LAND[b] > LAND[a] || (LAND[b] === LAND[a] && (Math.abs(b - x) < Math.abs(a - x) || (Math.abs(b - x) === Math.abs(a - x) && b > a))) ? b : a);
    if (how === "best admissible" && isTabu(y)) how = "aspiration (tabu, but better than the best so far)";
    last = { from: x, to: y, d: LAND[y] - LAND[x], how, nTabu: cand.filter(isTabu).length, nCand: cand.length };
    x = y; hist.push(x); if (LAND[x] > LAND[best]) best = x;
  }
  return { x, best, hist, stuck, last, tabu: tenure ? hist.slice(-tenure) : [] };
}
function tabuOut(s, narrow) {
  const W = narrow ? 340 : 600, H = narrow ? 220 : 250, L = 36, R = 12, T = 16, B = 28, PW = W - L - R, PH = H - T - B;

  const path = "M" + LAND.map((v, x) => `${X(x).toFixed(1)},${Y(v).toFixed(1)}`).join(" L");
  const yt = [10, 20, 30, 40, 50].map(v => `<line class="${v === 10 ? "axis" : "grid"}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const xt = [0, 10, 20, 30, 40, 50].map(x => `<text class="tick" x="${X(x)}" y="${H - 10}" text-anchor="middle">${x}</text>`).join("");
  const seen = [...new Set(s.hist)].map(x => `<circle class="visit" cx="${X(x)}" cy="${Y(LAND[x])}" r="3"/>`).join("");
  const tabu = s.tabu.map(x => `<rect class="tabu" x="${X(x) - 5}" y="${Y(LAND[x]) - 5}" width="10" height="10" rx="2"/>`).join("");
  const trail = s.hist.length > 1 ? `<path class="trailx" d="M${s.hist.slice(-12).map(x => `${X(x).toFixed(1)},${Y(LAND[x]).toFixed(1)}`).join(" L")}"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Landscape over positions 0 to 60 with the tabu search's current point, its tabu positions as squares and the best point so far as a ring">${yt}${xt}
    <text class="note" x="${L - 30}" y="10">eval</text><text class="note" x="${W - R}" y="${H - 10}" text-anchor="end">position</text>
    <line class="ann dash" x1="${X(LAND_BEST)}" x2="${X(LAND_BEST)}" y1="${T}" y2="${Y(LAND[LAND_BEST])}"/><text class="vl2" x="${X(LAND_BEST) - 5}" y="${T + 10}" text-anchor="end">global optimum</text>
    <path class="land" d="${path}"/>${seen}${trail}${tabu}
    <circle class="bestpt" cx="${X(s.best)}" cy="${Y(LAND[s.best])}" r="9"/>
    <circle class="curpt" cx="${X(s.x)}" cy="${Y(LAND[s.x])}" r="6"/></svg>`;
}

// The SAT example of slides 7–12: x = (0,1,1,1,0,0,0,1); the flips 3, 7, 1, 6, 4 (read back from M on slide 12), then 5.
// Evaluations are only those on the slides (27, 31, 33, 32); the steps in between have none on the slides.
const MEM_FLIPS = [3, 7, 1, 6, 4, 5], MEM_EVAL = { 0: 27, 1: 31, 5: 33, 6: 32 };
function memState(k) {
  const x = [0, 1, 1, 1, 0, 0, 0, 1], m1 = Array(8).fill(0), m2 = Array(8).fill(0);
  for (let t = 1; t <= k; t++) { const b = MEM_FLIPS[t - 1] - 1; x[b] ^= 1; for (let i = 0; i < 8; i++) if (m2[i]) m2[i]--; m2[b] = 5; m1[b] = t; }
  return { x, m1, m2 };
}
function memRow(label, vals, tabuOf, sub = "") {

}

// Slide 19: raw evaluation against penalised score eval − 0.7 · H(i) for the three non-tabu flips (slope chart: the ranking flips).

  return `<svg class="slopes" viewBox="0 0 ${W} ${H}" role="img" aria-label="Slope chart: raw evaluations 30, 33 and 31 for flipping bits 2, 3 and 7 become 25.1, 25.3 and 30.3 after the frequency penalty; bit 3 drops from first to second, bit 7 rises to first">${yt}
    <text class="note" x="${xa}" y="${H - 8}" text-anchor="middle">eval(x′)</text><text class="note" x="${xb}" y="${H - 8}" text-anchor="middle">eval(x′) − 0.7 · H(i)</text>${rows}</svg>`;

// Slide 22: recency (remaining tabu iterations) and frequency (swaps in the last 50 iterations) as upper-triangular matrices.
const TSP_REC = { "1-4": 1, "2-6": 5, "3-7": 4, "4-5": 3, "5-8": 2 };

line("evals", {

  xTicks: [10, 200, 400, 600, 800, 1000], xTicksN: [10, 500, 1000], yTitle: "evaluations per step", xTitle: "n",
