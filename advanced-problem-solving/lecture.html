function lecture4() {
  const pen = p => num(p.ev - 0.7 * p.h, 1);
  return `${head(l)}
    <p class="lead">Lecture 3 ended with two ways out of a local optimum: accept a worse neighbour by chance (the stochastic hill-climber, simulated annealing) or remember where you have been. This lecture is the second way. Tabu search keeps a short list of recent moves that it refuses to undo, and always moves to the best neighbour it is still allowed to take, even when that neighbour is worse. Everything else in the deck refines that idea: what exactly goes on the list and for how long, when a forbidden move may be taken anyway, and how a second, long-term memory steers the search into regions it has neglected. The examples are SAT and the TSP again, so the numbers carry over from lecture 3; the material follows Michalewicz &amp; Fogel, How to Solve It, chapter 5.</p>
    <div class="tiles">
      <div class="tile"><div class="v">N*(x)</div><div class="l">admissible neighbours: not tabu, or tabu but passing the aspiration test; the search moves to the best of them</div></div>
      <div class="tile"><div class="v">t − M(i) ≤ tenure</div><div class="l">bit i is tabu when its last flip lies within the tenure window (variant 1 of the memory)</div></div>
      <div class="tile"><div class="v">eval − 0.7 · H(i)</div><div class="l">frequency penalty when every non-tabu move is worse: over-used moves lose, rare ones win</div></div>
      <div class="tile"><div class="v">n(n − 1)/2</div><div class="l">swap neighbours of an n-city tour: 28 for n = 8, 499 500 for n = 1000, all scanned in every step</div></div>
    </div>

    <h2>Where lecture 3 left off <small>(slides 2–3)</small></h2>
    <p>The agenda puts tabu search fourth, after uninformed and informed search and local search. The recap slide lines up what is already known: hill climbing moves to a better neighbour and stops at a local optimum, and random restarts help without a guarantee. The stochastic hill-climber samples one neighbour and accepts it with p = 1 / (1 + e<sup>(eval(v<sub>c</sub>) − eval(v<sub>n</sub>))/T</sup>) at a fixed T, and simulated annealing lowers T over the run: high T explores, low T exploits. The limitation all three share is the bridge to today: they are <b>memoryless</b>. Each step depends only on the current point (and T), never on the path that led there, so nothing stops them from walking back into a local optimum they just left.</p>

    <h2>The idea and the algorithm <small>(slides 4–6)</small></h2>
    <p>Tabu search adds a memory of recently examined solutions, or of the moves that produced them, and declares them <b>tabu</b> for the next few steps. The memory forces the search into new parts of the search space. Unlike simulated annealing, the method is <b>deterministic</b>: the same start and the same (empty) tabu list always produce the same sequence of moves.</p>
    <p class="formula pre">init x; best ← x; T ← ∅
repeat
  N*(x) ← { y ∈ N(x) | y ∉ T or aspiration(y) }
  x ← argmax over y ∈ N*(x) of eval(y)
  if eval(x) &gt; eval(best) then best ← x
  update T (add the move, expire old entries)
until halting criterion
return best</p>
    <ul>
      <li><b>Admissible neighbourhood N*(x):</b> the neighbours that are not tabu, plus the tabu ones that pass the aspiration criterion.</li>
      <li><b>Best admissible move:</b> always move to the best of them, even if it is worse than the current solution. This is the escape mechanism: at a local optimum the search does not stop, it steps down.</li>
      <li><b>Aspiration criterion:</b> lift the ban for a move that leads to a solution better than the best found so far.</li>
    </ul>
    ${lab("tabu", "walk tabu search over the lecture-3 landscape")}
    <p>The energy-landscape slide (6) shows the one picture to keep in mind: at a local optimum no improving move exists, but tabu search must still move, so it takes the best non-tabu neighbour; the tabu list blocks the way straight back, and the search is forced uphill (in cost) and onwards into new regions. The explorer makes the role of the list length visible. With <b>tenure 0</b> there is no memory, and best-admissible search oscillates between positions 6 and 7 forever: step down, step back up. <b>Tenure 2</b> cycles over three positions, <b>4</b> gets over the first valley but cycles around the second peak at 16. From <b>tenure 5</b> on, the list is long enough to push the search through the valley at 22 and across the plateau, and it reaches the global optimum at ${LAND_BEST} in step 28. Push it to <b>15</b> and the search reaches the optimum just the same, then walks into the right end of the landscape and stops at step 42: every neighbour has been visited recently and none beats the best, so no admissible move is left. Tick “aspiration by default” and it carries on.</p>
    ${why("Context, not on the slides: what this explorer simplifies", `<p>Here the tabu list holds <em>positions</em> (whole solutions). The slides' SAT and TSP examples store <em>moves</em> (which bit was flipped, which pair of cities was swapped), which is the usual choice in practice: a move attribute is cheap to store and compare, and forbidding the reverse move is what stops cycling. Storing solutions is more precise but means comparing whole solutions in every step. The tie-break (nearer position first) is our own choice; the slides do not need one because their evaluations differ. Note also what the explorer cannot show: with a single run per tenure, “5 works and 4 does not” is a fact about this landscape, not a rule.</p>`)}
    <ul class="cmp two">
      <li><b>Simulated annealing</b><span class="v"><span class="sw t"></span>Escapes probabilistically, through the temperature. Uphill moves (in cost) can happen at any time.</span></li>
      <li><b>Tabu search</b><span class="v"><span class="sw v"></span>Escapes deterministically, through memory. Worse moves happen only when no improving admissible move exists. Neither guarantees the global optimum.</span></li>
    </ul>

    <h2>Tabu search on SAT: recency-based memory <small>(slides 7–12)</small></h2>
    <p>The running example is a SAT instance with n = 8 variables and a weighted evaluation: the weighted sum of satisfied clauses, where a clause's weight depends on how many variables it has. It is maximised. The random start x = (0, 1, 1, 1, 0, 0, 0, 1) has eval(x) = 27. The neighbourhood is the eight single-bit flips; all eight are evaluated and the best is taken. At this point it is exactly hill climbing: flipping bit 3 gives the best value, 31.</p>
    <p>The memory records which bit was flipped and when, so that recent flips can be told apart from older ones. For SAT this is a vector M of eight time stamps, all zero at the start, and information is kept for at most five iterations. The slides give two ways to read the same vector:</p>
    <ul class="cmp two">
      <li><b>Variant 1: time stamp</b><span class="v"><span class="sw t"></span>M(i) = j means bit i was last flipped in iteration j. Needs a current iteration counter t; the entry is forgotten when t − M(i) &gt; 5. Each iteration updates one entry and the counter, which is why most implementations use it.</span></li>
      <li><b>Variant 2: countdown</b><span class="v"><span class="sw v"></span>M(i) = j means bit i stays unavailable for j more iterations (it was flipped 5 − j iterations ago). Every non-zero entry is decreased by one in each iteration.</span></li>
    </ul>
    ${lab("mem", "step through the SAT example with both memory variants")}
    ${ex("Worked example: the decision on slide 12", `<p>After the first flip and four more iterations, M = (3, 0, 1, 5, 0, 4, 2, 0) and x = (1, 1, 0, 0, 0, 1, 1, 1) with eval(x) = 33. Reading M as a countdown: bit 4 was flipped most recently (5 iterations left), bit 3 longest ago (1 left). Every non-zero entry is tabu, so bits 1, 3, 4, 6 and 7 cannot be flipped. Of the eight neighbours x<sup>1</sup> … x<sup>8</sup>, only x<sup>2</sup> = (1, 0, 0, 0, 0, 1, 1, 1), x<sup>5</sup> = (1, 1, 0, 0, 1, 1, 1, 1) and x<sup>8</sup> = (1, 1, 0, 0, 0, 1, 1, 0) are admissible. The best of them is x<sup>5</sup> with eval 32, a <b>decrease</b> from 33, and tabu search takes it. The memory becomes (2, 0, 0, 4, 5, 3, 1, 0): all old entries minus one, the new flip at 5. Bit 3 is free again.</p>`)}
    <p>The slide ends with the obvious objection: what if a tabu neighbour, say x<sup>6</sup>, had an excellent value? Refusing it would be too restrictive. That is what the aspiration criterion is for (below).</p>

    <h2>The tabu list as a sliding window, and the tenure <small>(slides 10–11)</small></h2>
    ${chart("window", leg([[4, "on the tabu list (blocked)"], ["g", "expired"], [1, "current solution"]]))}
      <figcaption>Slide 10 redrawn: with tenure 4 at t = 9, the moves of steps 5 to 8 are tabu (t − M(i) ≤ 4) and those of steps 1 to 4 have expired. Each step the window slides one to the right: the newest move enters, the oldest leaves.</figcaption>
    </figure>
    <p>The <b>tabu tenure</b> is the number of iterations a move stays forbidden after it is made, the width of the window. It is the main parameter of the method:</p>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th></th><th>short tenure</th><th>long tenure</th></tr></thead><tbody>
      <tr><td class="rl">risk of cycling</td><td>higher</td><td>lower</td></tr>
      <tr><td class="rl">exploration</td><td>local</td><td>broad</td></tr>
      <tr><td class="rl">exploitation</td><td>strong</td><td>weak</td></tr>
    </tbody></table></div>
    <p>Practical guidance from the slide: start with a tenure between √n and n, where n is the problem size. A <b>dynamic tenure</b>, drawn at random from a range in every step, can beat a fixed value because it makes cycles unpredictable. For the TSP, 3n has been found to work well empirically for n ≤ 100.</p>
    ${ex("Worked example: tenure ranges", `<p>The SAT example has n = 8: √8 ≈ 2.8, so a tenure between 3 and 8; the slides' 5 sits in the middle. With a tenure of 8 or more, eight iterations would make every bit tabu (each iteration must flip a bit that is not yet on the list), and from then on only aspiration could move the search: for a flip neighbourhood the upper end of the range is a hard ceiling, because the list must never cover the whole neighbourhood. For a 100-city TSP the 3n rule gives a list of 300 entries.</p>`)}

    <h2>Aspiration criteria <small>(slides 13–14)</small></h2>
    <p>A tabu move is admissible despite being tabu if it satisfies an aspiration criterion, a condition that marks the move as outstanding. The common one, used in all of the lecture's examples: accept a tabu move to y if <b>eval(y) &gt; eval(best)</b>, strictly better than anything found so far. The reasoning is short: the tabu list exists to stop the search from revisiting explored regions, and a solution better than everything seen so far cannot have been visited, so the ban has no purpose there.</p>
    <ul>
      <li><b>Aspiration by default:</b> if all moves are tabu, take the least-recently-tabu one (the oldest), instead of getting stuck. Without it, tabu search can end up with no admissible move at all, as the tenure-15 run in the explorer does; this criterion guarantees the search can always continue.</li>
      <li><b>Aspiration by search direction:</b> accept a tabu move if the direction it represents has kept improving over the last iterations.</li>
      <li><b>Aspiration by influence:</b> accept a move that produces a solution structurally very different from the current one (a large distance), which diversifies the search.</li>
    </ul>

    <h2>Long-term memory <small>(slides 15–20)</small></h2>
    <p>Slide 15 asks two questions to think about before reading on: what would a long-term memory store for SAT, and how would it help to escape local optima? The answer: count. The recency memory M answers “when was bit i last flipped?” and forgets after the tenure; a <b>frequency memory</b> H answers “how often was bit i flipped in the last h iterations?” over a much longer horizon. On slide 16's small example (flips of bit 2, bit 5 and bit 2 again within six iterations), M at t = 6 holds 5 and 3 for bits 2 and 5, while H holds 2 and 1.</p>
    ${chart("hvec", leg([[1, "flips of each bit"], [3, "under-represented (3 or fewer)"]]))}
      <figcaption>Slide 17: after 100 iterations with horizon h = 50, H = (5, 7, 11, 3, 9, 8, 1, 6), which adds up to the 50 flips of the horizon. Bit 3 took more than a fifth of all moves; bits 7 and 4 hardly any. Those are the directions a diversification step should try.</figcaption>
    </figure>
    <p>When is the long-term memory used? In special circumstances, typically when <b>all non-tabu moves lead to a worse solution</b> and a meaningful choice of direction is needed. The rule of thumb: frequent moves are less attractive. The evaluation of each candidate is reduced by a penalty that grows with its frequency, and the adjusted score decides.</p>
    ${ex("Worked example: the frequency penalty on slide 19", `<p>The current solution has eval(x) = 35 and the best so far is 37. The non-tabu flips of bits 2, 3 and 7 give 30, 33 and 31: all worse than 35. No tabu move reaches more than 37, so aspiration does not apply either. The frequency memory takes over with score(x′) = eval(x′) − 0.7 · H(i), using H(2) = 7, H(3) = 11, H(7) = 1 from slide 17:</p>
      <p class="formula pre">bit 2: 30 − 0.7 · 7 = 30 − 4.9 = ${pen(PEN[0])}
bit 3: 33 − 0.7 · 11 = 33 − 7.7 = ${pen(PEN[1])}
bit 7: 31 − 0.7 · 1 = 31 − 0.7 = ${pen(PEN[2])}</p>
      <p>Without the penalty bit 3 would win (33), the bit that has already been flipped 11 times in 50 iterations. With it, bit 7 wins clearly: a move that is barely worse than the best raw candidate (31 against 33) but takes the search somewhere it has almost never been.</p>`)}
    ${chart("penalty", leg([[1, "flip bit 2 (H = 7)"], [2, "flip bit 3 (H = 11)"], [3, "flip bit 7 (H = 1)"]]))}
      <figcaption>The same three candidates before and after the penalty (slide 19). The order changes from 3, 7, 2 to 7, 3, 2: the frequency term is large enough to overturn a 2-point difference.</figcaption>
    </figure>
    <p>Slide 20 collects the ways to <b>diversify</b>: include frequency values in a penalty, as above, or add rules of the aspiration kind: by default (select the oldest), by search direction (remember whether recent moves improved anything), by influence (measured as the distance between old and new solution, or, for a constrained problem, the change in feasibility). The intuition behind influence: a move has more influence the larger the step it makes.</p>

    <h2>Tabu search and the TSP <small>(slides 21–24)</small></h2>
    <p>For the TSP the move is a <b>swap of two cities</b> in the tour. From the current tour (2, 4, 7, 5, 1, 8, 3, 6) there are C(8, 2) = 8 · 7 / 2 = 28 neighbours. Both memories become upper-triangular matrices: the entry in row i, column j (i &lt; j) belongs to the swap of cities i and j. The recency matrix holds the number of iterations for which that swap is still tabu; the frequency matrix holds how often it was made within the horizon h = 50.</p>
    ${chart("tspmem", leg([[4, "recency: darker = tabu longer"], [1, "frequency: darker = swapped more often"]]))}
      <figcaption>Slide 22 after 500 iterations: current tour (7, 3, 5, 6, 1, 2, 4, 8) of length 173, best so far 171. Hover a cell for its swap. (The slide's frequency entries add up to 52, slightly more than h = 50; the figure shows them as printed.)</figcaption>
    </figure>
    ${ex("Worked example: reading the two matrices", `<p><b>Recency.</b> Five swaps are tabu: 2–6 for 5 more iterations (the most recent), 3–7 for 4, 4–5 for 3, 5–8 for 2 and 1–4 for 1. The tenure is therefore 5, the same as in the SAT example. Of the 28 neighbours, 23 are admissible without aspiration. Since the tour is minimised, a tabu swap passes the aspiration test only if it yields a tour shorter than 171.</p>
      <p><b>Frequency.</b> The swap 7–8 was made 6 times, 5–6 and 3–7 four times each; 1–2, 1–6, 2–8 and 3–8 never. If every admissible swap makes the tour longer than 173, a penalty on these counts pushes the search towards the four unused swaps.</p>`)}
    <h3>A particular implementation (slides 23–24)</h3>
    <p>The deck closes the TSP part with the implementation studied by Knox (1994). It uses <b>2-interchange</b> moves (the 2-opt move of lecture 3) and two nested loops: the outer loop runs MAX-TRIES times, each from a newly generated tour; the inner loop identifies the set of 2-interchange moves, makes the best admissible one, updates the tabu list, and counts iterations without a new best tour for this try, stopping at ITER. The best tour of all tries is the result. Its details:</p>
    <ul>
      <li>A tour is tabu if <b>both</b> edges added by the interchange are on the tabu list; the list is updated with the added edges, and when it is full the oldest entry is replaced. The algorithm examines all 2-interchange neighbours in every step.</li>
      <li>The best results came with a tabu list of length <b>3n</b>, and an aspiration test per edge: a candidate tour may override the tabu status if its length beats the aspiration values of both added edges, where those values are the tour costs before the interchange. All aspiration values start large, and the list starts empty.</li>
      <li>For up to 100 cities, MAX-TRIES = 4 and ITER = 0.0003 · n<sup>4</sup>.</li>
    </ul>
    ${ex("Worked example: Knox's parameters for 100 and 50 cities", `<p>n = 100: tabu list of 3 · 100 = 300 edges; ITER = 0.0003 · 100<sup>4</sup> = 0.0003 · 10<sup>8</sup> = 30 000 interchanges without improvement per try, with 4 tries. Each interchange scans the 100 · 97 / 2 = 4 850 two-interchange neighbours, so one try that runs to ITER needs at least 30 000 · 4 850 ≈ 1.5 · 10<sup>8</sup> tour evaluations. n = 50: ITER = 0.0003 · 6.25 · 10<sup>6</sup> = 1 875 and 1 175 neighbours per step. The n<sup>4</sup> grows quickly: halving n cuts ITER by a factor of 16.</p>`)}
    ${why("Context, not on the slides: two details worth checking", `<p>Slide 24 says the list holds the <em>added</em> edges (deleted ones are ignored) and, one line later, that a full list replaces its oldest element by the new <em>deleted</em> edge; the first reading is the one the tabu test (“both added edges are on the list”) needs. And the ITER formula is a count of interchanges without improvement per try, not a total, so a try that keeps improving runs longer.</p>`)}

    <h2>Simulated annealing against tabu search <small>(slides 25–29)</small></h2>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th></th><th>simulated annealing</th><th>tabu search</th></tr></thead><tbody>
      <tr><td class="rl">escape</td><td>accepts worse moves with a probability that falls as T cools</td><td>accepts worse moves deterministically, when no improving admissible move exists</td></tr>
      <tr><td class="rl">determinism</td><td>stochastic: runs from the same start differ</td><td>deterministic: the same start gives the same trajectory</td></tr>
      <tr><td class="rl">memory</td><td>none; a step depends on the current solution and T</td><td>explicit tabu list, optionally a frequency memory</td></tr>
      <tr><td class="rl">uphill moves</td><td>at any time, controlled by T</td><td>only when stuck</td></tr>
      <tr><td class="rl">parameters</td><td>T<sub>max</sub>, T<sub>min</sub>, cooling schedule, inner-loop length</td><td>tenure, neighbourhood, aspiration criterion, penalty coefficient</td></tr>

    <p>Common ground: both work on complete solutions, can be stopped at any iteration with a feasible answer, have many parameters, and guarantee nothing about the global optimum. The cost driver is the size of the neighbourhood. For SAT, |N(x)| = n and a full scan is cheap. For the TSP under swaps or 2-opt, |N(x)| = C(n, 2) = O(n²): at n = 1000 tabu search evaluates about 500 000 neighbours per iteration where SA evaluates one.</p>

    </figure>
    <p>The rule of thumb on slide 27: if |N(x)| is small or moderate, the full scan pays off in solution quality per iteration; if it grows as O(n²) or faster, SA's cheap iterations are preferable, unless the neighbourhood can be pruned to a promising subset (a common remedy for tabu search).</p>
    <ul class="cmp two">
      <li><b>Prefer tabu search when …</b><span class="v"><span class="sw t"></span>the neighbourhood is small to moderate and can be scanned fully (SAT, TSP with moderate n); reproducibility matters (debugging, certification, fair comparison); problem structure can be exploited through memory; there is a natural move set (scheduling, graph colouring, routing).</span></li>
      <li><b>Prefer simulated annealing when …</b><span class="v"><span class="sw v"></span>the neighbourhood is O(n²) or larger; the space is continuous or high-dimensional, where a tabu list is hard to define; several independent runs with different outcomes are wanted; simplicity counts (an evaluation function and a perturbation, no bookkeeping).</span></li>
    </ul>
    <p>Hybrids (slide 29) borrow from both. SA with memory: restart from the best solution found instead of a random one, or penalise frequently visited regions in the acceptance test. Tabu search with randomness: a randomised tenure drawn from [t<sub>min</sub>, t<sub>max</sub>] in each step, or periodic random restarts. The slide's key takeaway: neither method is universally better; when in doubt, try both and compare.</p>

    <h2>Take-home</h2>
    <ul>
      <li><b>Tabu search</b> moves to the best admissible neighbour in every step, even a worse one, and keeps a memory of recent moves that may not be undone. It is deterministic and escapes local optima through memory, not chance.</li>
      <li><b>Recency memory:</b> for SAT a vector M, read as time stamps (tabu if t − M(i) ≤ tenure) or as countdowns (tabu while M(i) &gt; 0); for the TSP an upper-triangular matrix over city pairs.</li>
      <li><b>Tenure:</b> short means cycling and local search, long means broad search but possibly no admissible move; start between √n and n, randomise it, 3n for the TSP with n ≤ 100.</li>
      <li><b>Aspiration:</b> a tabu move is allowed if it beats the best so far; aspiration by default (take the oldest tabu move) keeps the search alive when everything is tabu.</li>
      <li><b>Frequency memory:</b> H counts moves over a long horizon; when all admissible moves are worse, score = eval − c · H(i) favours rare moves and diversifies the search.</li>
      <li><b>SA or tabu search:</b> SA samples one neighbour (cheap steps, stochastic, uphill at any time); tabu search scans all of them (O(|N(x)|) per step, deterministic, uphill only when stuck). The neighbourhood size decides.</li>
    </ul>

function lecture5() {
  const P = g => qPenalty(g.map(v => v - 1));
  return `${head(l)}
    <p class="lead">Simulated annealing and tabu search improve one solution at a time; when its neighbourhood offers no way out, they need luck or memory. Evolutionary algorithms keep a whole <b>population</b> of solutions instead, let the better ones reproduce, and create new solutions by recombining parents and mutating the result. This lecture builds the general loop, takes each of its components in turn on the running 8-queens example, spends most of its time on crossover (one-point and uniform for bit strings, OX, PMX and CX for permutations), and ends by placing EAs next to the two single-solution methods of lectures 3 and 4. The general schema, the 8-queens example and the run figures are the standard ones of Eiben &amp; Smith's <em>Introduction to Evolutionary Computing</em>, which is on the course reading list.</p>
    <div class="tiles">
      <div class="tile"><div class="v">p<sub>i</sub> = f<sub>i</sub> / Σ f<sub>j</sub></div><div class="l">roulette-wheel selection: the chance to become a parent is the share of total fitness</div></div>
      <div class="tile"><div class="v">k = 2 or 3</div><div class="l">typical tournament size: the fittest of k random individuals becomes a parent; k = 1 is random choice</div></div>
      <div class="tile"><div class="v">OX · PMX · CX</div><div class="l">permutation crossovers: they keep relative order, (mostly) absolute position, or the exact locus of every gene</div></div>
      <div class="tile"><div class="v">7 components</div><div class="l">representation, fitness, population, parent selection, variation, survivor selection, termination</div></div>
    </div>

    <h2>From one solution to a population <small>(slides 3–9)</small></h2>
    <p>The recap slide sets the scene. Simulated annealing keeps one solution and accepts a worse move with probability 1 / (1 + e<sup>Δ/T</sup>), exploring while T is high and exploiting as it cools; it is stochastic and memoryless. Tabu search keeps one solution too, escapes through its tabu list, is deterministic given the memory, and diversifies through the frequency memory. Their shared limitation: <b>one solution at a time</b>. If the neighbourhood of the current solution offers no good escape route, the search is stuck there.</p>
    <p>The new idea has three parts: work on a <b>population</b> of solutions, let them <b>compete</b> against each other, and use <b>random variation</b> to search for new ones. The slides tell it as rabbits and foxes: the faster and smarter rabbits are not eaten and have more offspring, breeding mixes their genes, now and then a mutation adds something new, and over the generations the rabbits get faster; the foxes, meanwhile, have to get better at catching them.</p>
    <p>As an algorithm (slide 8): a population lives in an environment with limited resources; competition selects the fitter individuals; they seed new individuals through recombination and mutation; the new ones are evaluated and compete, possibly with their parents, for survival; over time the fitness of the population rises. Four facts to keep:</p>
    <ul>
      <li>EAs are <b>generate-and-test</b> algorithms: make candidates, evaluate them, keep the good ones.</li>
      <li>They are <b>stochastic</b> and <b>population-based</b>.</li>
      <li>The <b>variation operators</b> (recombination, mutation) create the diversity the search needs.</li>
      <li><b>Selection</b> reduces diversity, and that is the force pushing quality up. The two pull in opposite directions, and tuning an EA is largely tuning that balance.</li>
    </ul>
    <p>Slide 9 draws the difference on a cost landscape with several local optima. SA and tabu search follow one trajectory, and getting stuck means restarting or relying on memory. An EA's eight individuals sit in several valleys at once; selection keeps the population near the promising regions, recombination can combine two solutions that sit near <em>different</em> local optima into offspring that may land near the global one, and mutation explores locally and keeps the population from collapsing onto a single point.</p>

    <h2>The loop <small>(slides 10–13)</small></h2>
    ${chart("easchema", leg([[1, "selection: reduces diversity", "ln"], [2, "variation: creates diversity", "ln"], ["g", "start and stop", "ln"]]))}
      <figcaption>Slide 10's general schema redrawn. The colours are our addition: they mark which steps select and which vary, the two forces of slide 8.</figcaption>
    </figure>
    <p class="formula pre">INITIALISE population with random candidate solutions
EVALUATE each candidate
while not TERMINATION-CONDITION do
  SELECT parents
  RECOMBINE pairs of parents
  MUTATE the resulting offspring
  EVALUATE new candidates
  SELECT individuals for the next generation
end while</p>
    <p>Historically, the different kinds of EA came with different representations (slide 12): <b>genetic algorithms</b> with binary strings, <b>evolution strategies</b> with real-valued vectors, <b>evolutionary programming</b> with finite state machines, <b>genetic programming</b> with trees. Technically the order is: choose the representation to suit the problem, then the variation operators to suit the representation. The selection operators only look at fitness values, so they are independent of the representation and can be reused everywhere.</p>
    <p>The components (slide 13): representation, evaluation (fitness) function, population, parent selection, variation operators (recombination and mutation), survivor selection, plus an initialisation procedure and a termination condition. The rest of the lecture takes them one by one.</p>

    <h2>Representation, fitness, population: the 8-queens example <small>(slides 14–16)</small></h2>
    <p>The candidate solutions as the problem sees them are <b>phenotypes</b>; inside the algorithm they are encoded as <b>chromosomes</b> (genotypes). Encoding maps phenotype to genotype; decoding maps a genotype back to exactly one phenotype. A chromosome consists of <b>genes</b> at fixed positions (<b>loci</b>, singular locus), each with a value (an <b>allele</b>). One requirement is non-negotiable: to be able to find the global optimum, every feasible solution must be representable in genotype space.</p>
    <p>The running example is the <b>8-queens problem</b>: place eight queens on a chessboard so that none can capture another. The phenotype is a board; the genotype is a <b>permutation of 1 … 8</b>, read as “the queen in column i stands on row g(i)”. Because every value appears once, no two queens share a row or a column; only diagonals remain to be checked. The fitness (slide 15) is built from a penalty: the penalty of a queen is the number of queens she can check, the penalty of a configuration is the sum over all queens and is minimised, and the fitness is the inverse penalty, maximised (EAs usually talk about maximising fitness).</p>
    ${lab("queens", "the 8-queens genotype, its board and its penalty")}
    ${ex("Worked example: the penalty of slide 14's genotype", `<p>g = (1, 3, 5, 7, 2, 4, 6, 8). Two queens share a diagonal when their row difference equals their column difference. The queens in columns 1 and 8 stand on rows 1 and 8: |8 − 1| = |8 − 1|, the long diagonal. No other pair qualifies (columns 1 and 2: rows 1 and 3, differences 2 against 1; and so on). So queens 1 and 8 each have penalty 1 and the configuration has penalty <b>${P([1, 3, 5, 7, 2, 4, 6, 8])}</b>, one checking pair. Slide 21's mutation swaps the third and the seventh value and gives (1, 3, 6, 7, 2, 4, 5, 8): now columns 3 and 4 (rows 6 and 7) and columns 6 and 7 (rows 4 and 5) touch diagonally as well, penalty <b>${P([1, 3, 6, 7, 2, 4, 5, 8])}</b>. A mutation is a random step, and most random steps from a good solution make it worse.</p>`)}
    ${why("Context, not on the slides: why a permutation is the right genotype", `<p>Placing eight queens on any eight of the 64 squares gives C(64, 8) = 4 426 165 368 phenotypes. The permutation encoding keeps only boards with one queen per row and column: 8! = 40 320 genotypes, a hundred-thousand-fold smaller space, and it still contains every solution, so the requirement of slide 14 holds. Enumerating all 40 320 permutations (our own count) gives exactly 92 solutions and an average penalty of 10. A random permutation is a solution with probability 92 / 40 320 ≈ 0.23 %, which is why a population of 100 random permutations already contains one in about one run out of five (you will see that in the run explorer below). We count “can check” without blocking: two queens on a diagonal check each other even with a third queen between them, the usual convention for this example.</p>`)}
    <p>The <b>population</b> (slide 16) holds the current genotypes: usually a fixed number, as a multiset (duplicates allowed). Some EAs give it a spatial structure, such as a grid where individuals only mate with neighbours. Selection usually looks at the whole population: reproductive chances are relative to the current generation. <b>Diversity</b> means the number of different solutions present; there is no single measure, and in practice one counts distinct fitness values, phenotypes or genotypes.</p>

    <h2>Parent selection <small>(slides 17–19)</small></h2>
    <p>Parent selection decides which individuals may create offspring. It is responsible for pushing quality up, and it is usually <b>probabilistic</b>: better individuals are more likely to become parents, but not guaranteed to, and even the worst one has a non-zero chance. That randomness is a feature; it can help the search out of local optima. In the 8-queens EA, five individuals are picked at random and the best two become the parents.</p>
    <ul class="cmp two">
      <li><b>Roulette wheel (fitness-proportionate)</b><span class="v"><span class="sw t"></span>Individual i is picked with probability p<sub>i</sub> = f<sub>i</sub> / Σ<sub>j</sub> f<sub>j</sub>, each individual gets a slice of the wheel the size of its fitness. Sensitive to how fitness is scaled: if one individual dominates, it fills the wheel, and the population converges prematurely.</span></li>
      <li><b>Tournament</b><span class="v"><span class="sw v"></span>Pick k individuals at random, the fittest of them becomes a parent; repeat for every parent. k = 1 is random selection (no pressure), a large k always takes the best (too greedy); k = 2 or 3 is typical. Easy to implement and immune to scaling, because it only compares.</span></li>
    </ul>
    ${ex("Worked example: the two pictures of slide 18", `<p><b>Roulette.</b> Four individuals with f = 8, 6, 4, 2 and Σf = 20 get 8/20 = 40 %, 30 %, 20 % and 10 % of the wheel. <b>Tournament.</b> From the pool f = 12, 7, 15, 9, 5, a tournament of size 2 happens to draw 7 and 15; the 15 wins and becomes a parent. How likely is each individual to win one such tournament? Rank them from worst (r = 1, f = 5) to best (r = 5, f = 15). With replacement, the individual of rank r wins exactly when all k draws have rank ≤ r and not all have rank ≤ r − 1:</p>
      <p class="formula">P(rank r wins) = (r<sup>k</sup> − (r − 1)<sup>k</sup>) / N<sup>k</sup> &nbsp;&nbsp;→&nbsp;&nbsp; k = 2, N = 5: 1/25, 3/25, 5/25, 7/25, 9/25 = 4 %, 12 %, 20 %, 28 %, 36 %</p>
      <p>For k = 3 the best individual's share grows to 61/125 = 48.8 % and the worst one's falls to 1/125 = 0.8 %: a larger tournament means more selection pressure.</p>`)}
    ${lab("sel", "roulette wheel against tournament")}
    ${why("Context, not on the slides: with or without replacement", `<p>Slide 18 draws two different individuals for its tournament. If the k individuals are drawn <em>without</em> replacement, the worst individual can never win (it loses to whoever it meets), so the slide-17 property “even the worst has a non-zero chance” no longer holds; the best individual wins whenever it is drawn, which happens with probability k / N (40 % for k = 2, N = 5). With replacement, the worst wins only if it is drawn k times in a row: 1 / N<sup>k</sup>. Both versions are common; for exam calculations, say which one you use.</p>`)}
    <p>Slide 19 turns selection pressure into the central trade-off. <b>Exploitation</b> focuses on the best solutions found so far: fast improvement, but other good regions may be missed. <b>Exploration</b> samples new, diverse regions: slower, but it avoids getting stuck. Each component of an EA leans one way:</p>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th></th><th>more exploitation</th><th>more exploration</th></tr></thead><tbody>
      <tr><td class="rl">parent selection</td><td>strong pressure (large k)</td><td>weak pressure (small k)</td></tr>
      <tr><td class="rl">survivor selection</td><td>elitism (keep the best)</td><td>age-based (replace the parents)</td></tr>
      <tr><td class="rl">population size</td><td>small</td><td>large</td></tr>
      <tr><td class="rl">mutation rate</td><td>low</td><td>high</td></tr>
    </tbody></table></div>
    <p><b>Premature convergence</b>: when selection is too strong, the population converges to a local optimum before the global one is found. All individuals become alike, diversity is gone, and recombination of near-identical parents produces nothing new. The slide's sketch shows a healthy run whose best fitness keeps climbing towards the global optimum and a premature one that flattens out below it. Remedies: raise the mutation rate, reduce the selection pressure, or restart with injected diversity.</p>

    <h2>Variation: mutation and recombination <small>(slides 20–22)</small></h2>
    <p>Variation operators generate new candidate solutions and are told apart by their arity: arity 1 is <b>mutation</b>, arity 2 or more is <b>recombination</b> (with two parents usually called <b>crossover</b>). There was a long debate about which of the two matters more; most EAs today use both, and the concrete operator always depends on the representation.</p>
    <ul class="cmp two">
      <li><b>Mutation</b><span class="v"><span class="sw t"></span>Acts on one genotype and returns another. The randomness is essential: it is what distinguishes mutation from other unary heuristic operators. Each child is a step to a new point in the search space, so mutation can guarantee that the whole space is reachable (connectedness). For 8-queens: swap the values at two random positions, which keeps the genotype a permutation.</span></li>
      <li><b>Recombination</b><span class="v"><span class="sw v"></span>Merges information from the parents into the offspring; which parts are merged is chosen at random. Most offspring will be worse than or as good as their parents; the hope is that some combine the good traits of both and are better.</span></li>
    </ul>

    <h2>Crossover operators <small>(slides 23–28)</small></h2>
    <p>For <b>binary strings</b> two operators cover most uses (slide 23). <b>One-point crossover</b> chooses one random cut point and swaps the tails: from P1 = 1010110 and P2 = 0101001 with the cut after the third bit come O1 = 101 1001 and O2 = 010 0110. <b>Uniform crossover</b> flips a coin for every position: with the mask 1010101 (1 = take P1), O1 = 1111100. Uniform mixes more, because every gene is inherited independently.</p>
    <p>For <b>permutations</b> (8-queens, the TSP, schedules) these operators break: a one-point child of two permutations can contain a value twice and another not at all. Slides 24–26 give three operators that always return a valid permutation, each keeping a different property of the parents.</p>
    ${lab("xover", "all five crossover operators of the lecture, step by step")}
    ${ex("Worked example: order crossover, slide 24", `<p>P1 = (1, 3, 5 | 7, 2, 4, 6, 8), P2 = (8, 7, 6 | 5, 4, 3, 2, 1), crossover point after the third position. O1 keeps P1's first part 1 3 5. Then walk through P2 starting after the crossover point and wrapping round: 5 (already there, skip), 4, 3 (skip), 2, 1 (skip), 8, 7, 6. Appending the new values gives <b>O1 = (1, 3, 5, 4, 2, 8, 7, 6)</b>. Symmetrically, O2 keeps 8 7 6 and walks P1 from position 3: 7 (skip), 2, 4, 6 (skip), 8 (skip), 1, 3, 5, so <b>O2 = (8, 7, 6, 2, 4, 1, 3, 5)</b>. What OX preserves: the <em>relative order</em> of the values taken from the other parent. As 8-queens boards the children score penalties ${P([1, 3, 5, 4, 2, 8, 7, 6])} and ${P([8, 7, 6, 2, 4, 1, 3, 5])}, between the parents' ${P([1, 3, 5, 7, 2, 4, 6, 8])} and ${P([8, 7, 6, 5, 4, 3, 2, 1])} (P2 puts all eight queens on one diagonal): no improvement on the better parent, the normal case for a single crossover.</p>`)}
    ${ex("Worked example: partially mapped crossover, slide 25", `<p>P1 = (1, 3, 5, 7, 2, 4, 6, 8), P2 = (4, 6, 1, 2, 8, 5, 3, 7), segment positions 3–5 (counting from 0). <b>Step 1:</b> copy P1's segment, O1 = (?, ?, ?, 7, 2, 4, ?, ?); the segment pairs up 7↔2, 2↔8, 4↔5. <b>Step 2:</b> place P2's segment values that are missing. P2[3] = 2 is already in. P2[4] = 8: its position 4 is taken by 2; 2 sits at position 3 in P2, inside the segment, taken by 7; 7 sits at position 7 in P2, outside, so 8 goes to position 7. P2[5] = 5: position 5 is taken by 4, which sits at position 0 in P2, so 5 goes to position 0. <b>Step 3:</b> copy the remaining positions 1, 2, 6 from P2: <b>O1 = (5, 6, 1, 7, 2, 4, 3, 8)</b>. With the roles swapped, <b>O2 = (1, 3, 4, 2, 8, 5, 6, 7)</b>. The chain always ends outside the segment, because it can never cycle inside it.</p>`)}
    ${ex("Worked example: cycle crossover, slide 26", `<p>P1 = (1, 3, 5, 7, 2, 4, 6, 8), P2 = (3, 5, 1, 8, 6, 2, 4, 7). Trace cycles: start at position 0, take P2's value there (3), find it in P1 (position 1), take P2's value there (5), find it in P1 (position 2), take P2[2] = 1, which is at position 0 in P1: the cycle closes. Cycle 1 = positions {0, 1, 2}. The next unvisited position 3 gives P2[3] = 8 → position 7, P2[7] = 7 → position 3: cycle 2 = {3, 7}. Position 4 gives 6 → 6, 4 → 5, 2 → 4: cycle 3 = {4, 5, 6}. O1 takes cycles 1 and 3 from P1 and cycle 2 from P2: <b>O1 = (1, 3, 5, 8, 2, 4, 6, 7)</b>, and O2 the opposite: <b>(3, 5, 1, 7, 6, 2, 4, 8)</b>. Every value sits at exactly the position it had in one of the parents.</p>`)}
    ${why("Context, not on the slides: two details checked against the slides' own examples", `<p><b>PMX and positions.</b> Slide 25 says that every gene of a PMX child sits where it was in P1 or P2. That holds for the copied segment and for every gene taken straight from P2, but not for the genes placed by the mapping chain: in the slide's own O1 = (5, 6, 1, 7, 2, 4, 3, 8), the 5 stands at position 0, while P1 has 1 and P2 has 4 there. (The 8 at position 7 is fine only because P1 happens to have it there.) The guarantee for <em>every</em> gene is the property of CX, which is why the overview calls CX the stronger position-preserving operator.</p>
      <p><b>CX: which cycles come from P1.</b> Slide 26 writes “odd-length cycles from P1”. The standard rule (Oliver, Smith and Holland 1987; Eiben &amp; Smith) alternates by the cycle's <em>number</em>: first, third, fifth cycle from P1, second, fourth from P2. In the slide's example the cycles have lengths 3, 2, 3, so both readings give the same children; tutorial 4 and an exam question would only differ for an example where they do not.</p>`)}
    <p>Slide 27 collects the design principles:</p>
    <ol>
      <li><b>Match the representation.</b> The operator must always produce valid offspring, without a repair step: one-point or uniform for bit strings, OX, PMX or CX for permutations.</li>
      <li><b>Preserve what matters.</b> Pick the operator whose children inherit the property the problem cares about: OX the relative order, PMX the absolute positions, CX the exact locus.</li>
      <li><b>Control the amount of mixing.</b> Uniform mixes more than one-point; OX keeps less positional information than PMX or CX. More mixing means more diversity but can break up well-adapted building blocks.</li>
      <li><b>One or two offspring.</b> Most operators make two complementary children per crossover; some make one. Each child must be evaluated.</li>
      <li><b>Recombination alone is not enough.</b> Crossover only rearranges alleles that are already present; new genetic material comes from mutation, so mutation is always needed as well.</li>
    </ol>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th>operator</th><th>representation</th><th>preserves</th><th>typical use</th></tr></thead><tbody>
      <tr><td class="rl">one-point</td><td>binary</td><td>contiguous segments</td><td>general binary GA</td></tr>
      <tr><td class="rl">uniform</td><td>binary</td><td>each gene independently</td><td>high-mixing binary GA</td></tr>
      <tr><td class="rl">order (OX)</td><td>permutation</td><td>relative order</td><td>TSP: the order matters</td></tr>
      <tr><td class="rl">PMX</td><td>permutation</td><td>absolute position</td><td>scheduling: the slot matters</td></tr>
      <tr><td class="rl">cycle (CX)</td><td>permutation</td><td>exact locus</td><td>strong position constraints</td></tr>
    </tbody></table></div>
    <p class="muted">Slide 28's overview; all five produce two offspring.</p>

    <h2>Self-study: crossover for the TSP <small>(slide 29)</small></h2>
    <p>Representation and recombination depend on the problem above all. The self-study assignment is sections 4 and 5 of Potvin, <em>Genetic algorithms for the traveling salesman problem</em> (Annals of Operations Research 63, 1996): the <b>ordinal</b> and the <b>path</b> representation of a tour and the crossover operators that belong to each. The paper is in the Lesson 5 folder in OPAL and publicly on Springer.</p>
    ${why("Context, not on the slides: the ordinal representation in one example", `<p>The path representation is the tour itself, a permutation of the cities, so OX, PMX and CX apply directly. The ordinal representation encodes each city by its position in a reference list from which the visited cities are removed one by one. Take cities (1, 2, 3, 4, 5) and the tour 1 3 5 2 4: city 1 is at position 1 of (1 2 3 4 5); remove it, 3 is at position 2 of (2 3 4 5); then 5 is at position 3 of (2 4 5); 2 at position 1 of (2 4); 4 at position 1 of (4). The code is (1, 2, 3, 1, 1). Any string whose i-th entry lies between 1 and n − i + 1 decodes to a valid tour, so plain one-point crossover works without repair. The price is that a tail exchanged by crossover means a different set of cities in each child, so little of a good partial tour survives. Section 5 of the paper discusses this trade-off.</p>`)}

    <h2>Survivor selection, initialisation, termination <small>(slides 30–32)</small></h2>
    <p><b>Survivor selection</b>, also called replacement, decides who enters the next generation. Most EAs keep the population size fixed, and this step is often deterministic: <b>fitness-based</b> (rank parents and offspring together and keep the best), <b>age-based</b> (make as many offspring as there are parents and replace all parents), or a combination (<b>elitism</b>: age-based, but the best individual always survives). The 8-queens EA merges population and offspring, ranks by fitness, and deletes the worst two.</p>
    <p><b>Initialisation</b> is usually random, with an even spread and mixture of allele values; it may include existing solutions or use problem-specific heuristics to seed the population. The <b>termination condition</b> is checked in every iteration: a known or hoped-for fitness is reached, a maximum number of generations (or evaluations) is used up, the diversity falls below a threshold, or a given number of generations passes without improvement.</p>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th>8-queens EA (slide 32)</th><th></th></tr></thead><tbody>
      <tr><td class="rl">representation</td><td>permutation of 1 … 8</td></tr>
      <tr><td class="rl">fitness</td><td>inverse penalty (checking queens)</td></tr>
      <tr><td class="rl">initial population</td><td>100 random permutations</td></tr>
      <tr><td class="rl">parent selection</td><td>best two of five random individuals</td></tr>
      <tr><td class="rl">recombination</td><td>order crossover (slide 24), probability 100 %</td></tr>
      <tr><td class="rl">mutation</td><td>swap two values, probability 80 %</td></tr>
      <tr><td class="rl">survivor selection</td><td>merge, rank, delete the worst two</td></tr>
      <tr><td class="rl">termination</td><td>a solution, or 10 000 fitness evaluations</td></tr>
    </tbody></table></div>
    <p>That is a complete specification, so it can be run. The explorer does exactly that, with the order crossover as the recombination: the slides give the crossover probability, not the operator, and slide 24 demonstrates OX on exactly these genotypes.</p>
    ${lab("ea", "the 8-queens EA of slide 32, run in your browser")}
    <p>What the runs show. With the slide's settings, run A finds a solution after <b>${num(EA_A.ev, 0)}</b> evaluations, with ${EA_A.d1} of 100 genotypes still distinct at the end. Switch mutation to <b>0 %</b> and pick run B: the population converges to near-copies of one board, ${EA_B0.d1} distinct genotypes remain, and after ${num(EA_B0.ev, 0)} evaluations the best penalty is still ${EA_B0.best}. That is premature convergence in its plainest form: crossover can only rearrange what is there (principle 5 of slide 27). With 80 % mutation the same run B ${EA_B8.sol ? `solves the problem after ${num(EA_B8.ev, 0)} evaluations` : `ends at penalty ${EA_B8.best}`}. On 16 queens the effect is stronger and the curves take the shape of slide 34.</p>
    ${why("Context, not on the slides: our own measurements with this explorer's code", `<p>100 runs on 8 queens with the slide's settings (seeds 1000–1099) all found a solution, after 232 evaluations in the median. Without mutation, 86 of 100 did; the other 14 froze with a handful of distinct genotypes. On 16 queens (30 runs each), 28 of 30 runs with 80 % mutation found a solution within 10 000 evaluations (median about 2 800), but only 2 of 30 without mutation, most of them ending with fewer than ten distinct genotypes. Parent pools of 2, 5 and 20 change the median less than mutation does, because survivor selection (delete the worst two) already supplies most of the selection pressure here.</p>`)}

    <h2>How a run behaves <small>(slides 33–37)</small></h2>
    <p><b>Population distribution</b> (slide 33): at the beginning the individuals are spread over the whole landscape; halfway, most sit on the hills; at the end they cluster on one or a few peaks. The histograms in the explorer above are the same picture for the 8-queens run, with penalty instead of position. <b>Best fitness over time</b> (slide 34) rises steeply at first and then flattens out: most of the progress happens early.</p>
    <p>Two consequences. <b>Heuristic initialisation</b> rarely pays (slide 35): if a random population starts at best fitness a and a heuristically seeded one at b &gt; a, the random run reaches level b after k generations anyway, so the effort only saves those k generations. <b>When to stop</b> (slide 36): divide a run into two equally long halves; if the fitness gained in the first half, X, is much larger than the gain Y in the second, further time buys little. EAs have <b>anytime behaviour</b>: they can be stopped at any moment and return the best solution so far, and after a certain point extra effort hardly improves it.</p>
    <p><b>Performance from a global perspective</b> (slide 37) is drawn over a range of problems. A problem-tailored method peaks on the problems it was made for and does poorly elsewhere; random search is uniformly weak; an EA is evenly good across the range. EAs are robust, general tools: on most single problems a specialised method beats them, but the specialised method has limited reach and may not do well on every instance.</p>

    <h2>Simulated annealing, tabu search and EAs <small>(slides 38–39)</small></h2>
    <div class="tt-wrap"><table class="tt memo"><thead><tr><th></th><th>simulated annealing</th><th>tabu search</th><th>evolutionary algorithm</th></tr></thead><tbody>
      <tr><td class="rl">solutions</td><td>one</td><td>one</td><td>a population</td></tr>
      <tr><td class="rl">memory</td><td>none</td><td>explicit (tabu list)</td><td>implicit in the population</td></tr>
      <tr><td class="rl">escape</td><td>random acceptance</td><td>forced moves</td><td>recombination and mutation</td></tr>
      <tr><td class="rl">determinism</td><td>stochastic</td><td>deterministic</td><td>stochastic</td></tr>
      <tr><td class="rl">parameters</td><td>T<sub>0</sub>, cooling schedule</td><td>tenure, horizon</td><td>population size, mutation rate, crossover probability</td></tr>
      <tr><td class="rl">diversity</td><td>none</td><td>via frequency memory</td><td>built in through the population</td></tr>
      <tr><td class="rl">prefer when</td><td>large neighbourhood; simplicity needed</td><td>combinatorial structure; reproducibility needed</td><td>many local optima; parallelism available</td></tr>
      <tr><td class="rl">avoid when</td><td>structure could be exploited by memory</td><td>neighbourhood too large to scan</td><td>very tight time budget; a small population converges fast</td></tr>
    </tbody></table></div>
    <p>All three are <b>metaheuristics</b>: general frameworks that apply to any problem once a representation and an evaluation function are given, and none guarantees the global optimum. In practice hybrids often beat each pure method: SA with restarts, tabu search with a randomised tenure, EAs with a local search step for each offspring.</p>
    ${why("Context, not on the slides: what to be able to do by hand", `<p>The hand calculations of this lecture are small and exact, the kind a written exam can ask for and the kind tutorial 4 drills: selection probabilities for a given fitness list (roulette shares, tournament probabilities), one-point and uniform children from two bit strings, OX, PMX and CX children from two permutations with every intermediate step, the fitness of individuals under a penalty function, and one full generation of a small GA. The design side matters as much: given a problem, name a representation, a fitness function, operators that keep offspring valid, and the selection scheme, with one sentence of justification each. OPAL now also has a “Mock Exam” node with an earlier exam paper.</p>`)}

    <h2>Take-home</h2>
    <ul>
      <li><b>EAs</b> evolve a population: parent selection, recombination, mutation, evaluation and survivor selection in a loop until a termination condition holds. Variation creates diversity; selection removes it and pushes quality.</li>
      <li><b>Representation</b> first: every feasible solution must be encodable; for 8-queens a permutation (8! genotypes) instead of any 8 squares (4.4 billion).</li>
      <li><b>Parent selection</b>: roulette wheel p<sub>i</sub> = f<sub>i</sub> / Σf<sub>j</sub> (sensitive to scaling and to a dominant individual) or tournament of size k (k = 2–3, only compares). Too much pressure leads to premature convergence.</li>
      <li><b>Crossover</b> must match the representation: one-point or uniform for bit strings; OX (relative order), PMX (positions of the segment and most other genes) or CX (every gene's locus) for permutations. Crossover cannot create new alleles; mutation can.</li>
      <li><b>Survivor selection</b>: fitness-based, age-based or elitist. <b>Initialisation</b> is usually random (heuristic seeding saves only the first few generations); <b>termination</b> by target fitness, budget, diversity or stagnation.</li>
      <li><b>Compared with SA and tabu search</b>: a population instead of one solution, implicit instead of explicit memory, stochastic, naturally parallel; preferred on landscapes with many local optima.</li>
    </ul>
    <h2>Tutorial 4 and what comes next</h2>
    <p>Sheet 4 (in OPAL since 23 Nov) applies this lecture three ways: design an EA for graph colouring, compute OX and PMX children by hand on two schedules, and run one full generation of a GA on a 0/1 knapsack problem with a penalty function. See <a href="advanced-problem-solving/exercise.html?n=4">tutorial 4</a>.</p>

}
