<style>
/* Chart colours: the dataviz reference palette as on the other proposal page, validated on the chart surfaces.
   Slot 1 blue = generation, slot 2 orange = reuse. Light-mode contrast of slot 2 is below 3:1, so the two series
   also differ by shape and every chart has a table view. */
:root { --vz-s1: #2a78d6; --vz-s2: #eb6834; --vz-s3: #1baf7a; --vz-gray: #898781; --vz-grid: #e1e0d9; --vz-axis: #c3c2b7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --vz-s1: #3987e5; --vz-s2: #d95926; --vz-s3: #199e70; --vz-grid: #2c2c2a; --vz-axis: #383835; } }
:root[data-theme="dark"] { --vz-s1: #3987e5; --vz-s2: #d95926; --vz-s3: #199e70; --vz-grid: #2c2c2a; --vz-axis: #383835; }

.rs .viz .ci { stroke-width: 2.5; stroke-linecap: round; }
.rs .viz .ci.s1 { stroke: var(--vz-s1); } .rs .viz .ci.s2 { stroke: var(--vz-s2); }
.rs .viz .dia { stroke: var(--surface-2); stroke-width: 2; }
.rs .viz .ln { fill: none; stroke: var(--vz-s1); stroke-width: 2; }

/* The hero is a build log: the failure on the left, what the model gets back on the right. */
.rs .repair { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 18px; margin: 18px 0 8px; }
.rs .repair .ctrl { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.rs .repair .grp { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 13px; color: var(--ink-2); }
.rs .repair .grp > span { min-width: 92px; }
.rs .tg { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.rs .tg[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rs .tg:focus-visible { outline: 2px solid var(--vz-s1); outline-offset: 2px; }
.rs .log { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rs .log h4 { margin: 0 0 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.rs .log pre, .rs .log .txt { margin: 0; min-height: 124px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13.5px; line-height: 1.5; }
.rs .log pre { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.rs .log .fail pre { border-left: 4px solid var(--bad); }
.rs .log .fail.silent pre { border-left-color: var(--warn); }
.rs .why { margin: 11px 0 0; font-size: 14.5px; }

.rs .stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.rs .stage { border: 1px solid var(--line); border-top: 3px solid var(--rp-accent); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.rs .stage h3 { margin: 0 0 7px; font: 600 1.08rem/1.25 var(--rp-serif); }
.rs .stage dl { margin: 0; font-size: 14px; }
.rs .stage dt { color: var(--ink-3); font-size: 12.5px; margin-top: 7px; }
.rs .stage dd { margin: 0; }
.rs .plain { overflow-x: auto; margin: 10px 0; }
.rs .plain table { border-collapse: collapse; width: 100%; font-size: 14px; }
.rs .plain th, .rs .plain td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.rs .plain th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.rs .plain td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rs .plain tr.sum td { font-weight: 600; }
.rs .hyp { display: grid; grid-template-columns: 38px 1fr; gap: 3px 8px; margin: 10px 0; font-size: 15px; }
.rs .hyp b { font-weight: 600; color: var(--ink-2); }
.rs .hyp span { margin-bottom: 5px; }
@media (max-width: 760px) {
  .rs .stages, .rs .log { grid-template-columns: 1fr; }
  .rs .log pre, .rs .log .txt { min-height: 0; }
  .rs .repair { padding: 12px 12px 14px; }
}

<body class="rp rs">
<header class="sitebar" data-page="course"></header>
<div class="wrap"><article class="paper" id="page"></article></div>
<script>
const { c, esc, fmt } = RP;
const { chart, mountCharts, watch, leg } = RPViz;
const { FAIL, ARMS, ciTable, powerTable, need } = RS;
const sec = (n, t, id) => `<h2 id="${id}"><span class="sec">§ ${n}</span>${t}</h2>`;
const note = (html, tag, mn) => `<div class="note">${html}<aside class="mn"><span class="tag">${tag}</span>${mn}</aside></div>`;
const ax = id => `<a href="https://arxiv.org/abs/${id}" target="_blank" rel="noopener">arXiv ${id}</a>`;
const state = { fail: "ref", arm: "l" };
const hyp = rows => `<div class="hyp">${rows.map(([k, t]) => `<b>${k}</b><span>${t}</span>`).join("")}</div>`;

const log = () => {
  const f = FAIL.find(x => x.id === state.fail), a = ARMS.find(x => x.id === state.arm), text = esc(a.get(f));
  return `<div class="log">
    <div class="fail ${f.silent ? "silent" : ""}"><h4>What the build reports</h4><pre>${esc(f.build)}</pre></div>
    <div><h4>What the model gets: ${esc(a.label.toLowerCase())}</h4>${a.mono ? `<pre>${text}</pre>` : `<div class="txt">${text}</div>`}</div>
  </div><p class="why">${esc(f.why)}</p>`;
};
const toggles = (name, label, items) => `<div class="grp" role="group" aria-label="${label}"><span>${label}</span>${items.map(x => `<button class="tg" type="button" data-${name}="${x.id}" aria-pressed="${state[name] === x.id}">${x.label}</button>`).join("")}</div>`;

document.getElementById("page").innerHTML = `
  <a class="back" href="research-project-board.html">← Papers and project</a>
  <header class="titlepage">
    <p class="muted" style="margin:0;font-size:.9rem">Proposal · drafted ${fmt("2026-10-30")} for ${esc(c.project)} with ${esc(c.supervisor)}</p>
    <h1>When the build fails, which context fixes it?</h1>
    <p class="authors">Replicating a study of context in LLM-written code with AST extraction, adding an error-driven repair round, and testing the result on a second dataset</p>
    <div class="kw">${["context engineering", "software reuse", "automated repair", "call graphs", "replication"].map(k => `<span>${k}</span>`).join("")}</div>
  </header>

  <div class="abstract"><span class="h">The proposal in one paragraph.</span>Reinhartz-Berger et al. (2026) found that only 40 % of LLM-written features compile once placed into an existing Java game, while those that compile pass 72 % of their tests. Getting code to fit the project is the hard part. They ask three things in their outlook: does AST-based extraction give better context, what actually breaks, and do repair or iterative approaches do better than typed context alone? We propose to answer them in three stages. <b>Replicate</b> the study with AST extraction in place of regex. <b>Repair</b> failed builds in one round, where the compile error decides which small piece of call-graph context to fetch. <b>Generalise</b> the result on a second dataset with real compiler errors. All numbers below are plans; no experiment has run yet.</div>

  <section class="repair" aria-label="Interactive example of one repair round">
    <div class="ctrl">${toggles("fail", "Failure", FAIL)}${toggles("arm", "Repair arm", ARMS)}</div>
    <div id="log">${log()}</div>
  </section>
  <p class="muted" style="font-size:13.5px">An illustration with invented class names, not a result. Choose a failure and a repair arm to see what each arm hands the model.</p>

  ${sec(1, "Starting point", "start")}
  <p class="lead">The paper asked which type of context helps an LLM add a feature to an existing system. Its results raise the question of what is really causing them.</p>
  <p>Gemini 3.1 Flash Lite ran 240 times: three features, generation or reuse, eight mixes of structural (S), behavioural (B) and functional (F) context, five runs each, with one attempt and no repair. Two of the headline patterns are that lean context helps generation and rich context helps reuse. We see two reasons to test them again.</p>
  ${note(`<p><b>The cells are small.</b> Each strategy-by-context rate rests on 15 runs. The intervals below overlap for most pairs. Structural vs. behavioural context for generation is 10 of 15 against 4 of 15 (Fisher’s exact test, p = 0.07), and full context vs. none for reuse is 8 of 15 against 4 of 15 (p = 0.26). The authors say themselves that their percentages are descriptive, so this extends their caution and doesn’t contradict it.</p>`, "Our own check", "The tests and intervals on this page are ours, computed from Table 2 of the paper. They ignore task effects, so they’re a first reading.")}
  ${chart("ci", leg([["1", "Generation (circle)"], ["2", "Reuse (diamond)"]]), "", "Compile success with 95 % Wilson intervals, from the paper’s Table 2. Hover or tab through a mark for its count.")}
  ${ciTable()}
  <p><b>Two causes may be mixed.</b> As we read section 3.2, feature-level slicing narrows the context for reuse only. If so, “reuse likes rich context and generation likes lean context” could partly mean that reuse received filtered context. The published material should settle this.</p>
  <p>Behavioural context matters most for us. It already lists each method’s outgoing calls, so it is the paper’s closest relative of a call graph, and it was the weakest context for generation (27 % alone, 13 % with S). We want to know whether it failed because regex made it noisy, because it was unfiltered, or because it was given at the wrong moment. Related evidence points the same way: in the RepoGraph figures on our <a href="research-project/papers-agentic-context.html">paper ranking</a>, one hop of graph context beat no graph and two hops fell below it.</p>

  ${sec(2, "The three stages", "stages")}
  <p class="lead">Each stage changes one thing, so that a change in results has one explanation.</p>
  <div class="stages">
    <section class="stage"><h3>1. Replicate</h3><dl>
      <dt>Question</dt><dd>Is behavioural context bad, or badly extracted and unfiltered?</dd>
      <dt>Changes</dt><dd>Regex to AST, then slicing on or off</dd>
      <dt>Stays fixed</dt><dd>apo-games, prompts, single attempt</dd>
      <dt>Move on when</dt><dd>The original pattern is reproduced, or the difference is explained</dd></dl></section>
    <section class="stage"><h3>2. Repair</h3><dl>
      <dt>Question</dt><dd>Does the error-selected lookup repair as much as full context, with far less text?</dd>
      <dt>Changes</dt><dd>One repair round with three arms</dd>
      <dt>Stays fixed</dt><dd>The failed attempts from stage 1</dd>
      <dt>Move on when</dt><dd>Failure types are stable and the arms are compared on enough failures</dd></dl></section>
    <section class="stage"><h3>3. Generalise</h3><dl>
      <dt>Question</dt><dd>Does the result hold outside game code?</dd>
      <dt>Changes</dt><dd>The dataset</dd>
      <dt>Stays fixed</dt><dd>Stage 2’s repair design</dd>
      <dt>Done when</dt><dd>The stage 2 comparison is repeated on real repositories</dd></dl></section>
  </div>

  ${sec(3, "Stage 1: Replicate", "replicate")}
  <p class="lead">First reproduce the paper, then swap the extractor, then separate noise from amount.</p>
  <ol>
    <li><b>Audit the extraction.</b> Run regex and AST extraction on the same games and compare both with a hand-checked sample of classes, fields and calls. This needs no LLM and shows how much noise regex really adds.</li>
    <li><b>Replicate exactly.</b> Rerun the 240 runs with the authors’ prompts and model. Without this baseline, later differences mean little.</li>
    <li><b>Swap only the extractor.</b> Rerun the same 240 with AST context.</li>
    <li><b>Widen the study.</b> Use about 12 features, four contexts (none, S, B, S+B), both strategies, both extractors, with and without slicing, and four runs per setting. That gives about ${12 * 4} runs per cell.</li>
  </ol>
  ${note(`<p><b>Calls need type resolution.</b> A parser alone cannot tell which class <code>x.save()</code> belongs to. Without symbol resolution, the behavioural context would only be a cleaner version of the same list, so the AST arm must resolve calls to their targets.</p>`, "Tool", "CoGraph is the extraction tool of one team member. Its Java analyser has to be checked for type resolution, and its edges are cross-checked against a second extractor so it doesn’t decide alone what is correct.")}
  ${chart("power", "", "", `Runs per arm for 80 % power at α = .05 against a 40 % baseline, by normal approximation. Task effects raise these numbers, so the extra runs must come from more tasks, not more repeats of the same three.`)}
  ${powerTable()}
  ${hyp([["H1", "AST extraction raises compile success for B and S+B more than for S, because calls suffer most from regex noise."], ["H2", "Slicing removes most of the penalty of behavioural context in generation."], ["H3", "With slicing equal in both strategies, the difference between generation and reuse in how they respond to context shrinks."]])}

  ${sec(4, "Stage 2: Repair", "repair")}
  <p class="lead">Instead of guessing the right context before generating, let the compile error select it.</p>
  <ol>
    <li><b>Classify the failures.</b> Sort failed builds into the paper’s categories: unresolved references, contract violations and misplaced wiring. Two people code a shared sample so that we can report their agreement.</li>
    <li><b>Run one repair round.</b> Every failed attempt enters all three arms: error alone, error plus lookup, and error plus full context. Because each arm sees the same failures, differences come from the arm.</li>
    <li><b>Look up on the original project,</b> not on the broken attempt, so that a failed build can’t break the lookup.</li>
    <li><b>Keep hidden tests hidden.</b> The model sees compiler output only. Tests score the result at the end.</li>
  </ol>
  <div class="plain"><table><thead><tr><th>Measure</th><th>What it tells us</th></tr></thead><tbody>
    <tr><td>Recovered builds</td><td>Share of failures that compile after repair, per arm and failure type</td></tr>
    <tr><td>Test pass rate</td><td>Reported over all attempts as well as compiled ones, so that it doesn’t only describe the survivors</td></tr>
    <tr><td>Context cost</td><td>Tokens of context per recovered build</td></tr>
    <tr><td>Silent wiring failures</td><td>New code that compiles but has no caller, read from the call-graph diff</td></tr>
    <tr><td>New errors</td><td>Whether a repair removes one error and introduces another</td></tr>
  </tbody></table></div>
  ${hyp([["H4", "Error plus lookup recovers about as many builds as error plus full context (within 5 points), with far less context."], ["H5", "The gain from the lookup over the error alone differs by failure type: smallest where the compiler already names the fix."], ["H6", "A share of compiled code is silently unwired, and no compile-triggered repair can reach it."]])}
  <p>As an exploratory extension, a call-graph check could raise wiring failures that the compiler cannot see (“new method has no callers”), which would give those cases a repair trigger too.</p>

  ${sec(5, "Stage 3: Generalise", "generalise")}
  <p class="lead">Game code is one domain. The result needs to survive real repositories without losing what the study is about.</p>
  <p>We rule out plain SWE-bench as the main dataset, despite its scale and ready harness. It is Python-only, so there’s no compile step to trigger repairs. It mostly tests issue fixing, not fitting new features into a project, and audits have questioned its Verified subset (see the <a href="research-project/benchmarks-ai-coding.html">benchmark survey</a>).</p>
  <p>The provisional choice is the Java feature tasks of <b>SWE-PolyBench</b>, with real repositories, real compiler errors and feature work. Multi-SWE-bench’s Java tasks are the fallback, although they are issue resolution. A separate dataset comparison is checking how many tasks are usable and whether they build; this section will follow its result.</p>
  <p>Generation against reuse won’t transfer directly, because these datasets have no sibling projects. Stage 3 therefore tests the repair question only, and says so.</p>

  ${sec(6, "Runs and analysis", "runs")}
  <div class="plain"><table><thead><tr><th>Step</th><th>Setup</th><th style="text-align:right">Runs</th></tr></thead><tbody>
    <tr><td>Exact replication</td><td>3 tasks × 2 strategies × 8 contexts × 5 runs</td><td class="n">240</td></tr>
    <tr><td>AST swap</td><td>Same setup with AST context</td><td class="n">240</td></tr>
    <tr><td>Widened study</td><td>12 tasks × 2 strategies × 4 contexts × 2 extractors × 2 slicing × 4 runs</td><td class="n">768</td></tr>
    <tr><td>Repair</td><td>Up to 300 failed builds × 3 arms</td><td class="n">900</td></tr>
    <tr><td>Generalise</td><td>100 tasks × 3 attempts, then up to 200 failures × 3 arms</td><td class="n">900</td></tr>
    <tr class="sum"><td>Total</td><td>Planned, to be adjusted after a pilot</td><td class="n">3,048</td></tr>
  </tbody></table></div>
  <p>We would fix the hypotheses and analysis before running the widened study. Compile success is modelled by logistic regression with task as a random effect. The paired repair arms are compared per failed attempt, with a correction for the number of tests. A short pilot with Flash Lite and one stronger model comes first: a frontier model might compile almost everything, which would leave little to repair.</p>

  ${sec(7, "What each result would mean", "outcomes")}
  <p class="lead">The plan is useful whichever way the results fall, including the ones that don’t favour call graphs.</p>
  <div class="plain"><table><thead><tr><th>If we find</th><th>Then</th></tr></thead><tbody>
    <tr><td>AST rescues behavioural context</td><td>The paper’s result was partly an extraction artifact.</td></tr>
    <tr><td>Only slicing rescues it</td><td>The amount of context was the problem, not its quality.</td></tr>
    <tr><td>Neither rescues it</td><td>Call information handed over up front is doubtful, which makes the on-demand route more interesting.</td></tr>
    <tr><td>Lookup matches full context at far lower cost</td><td>Targeted context is enough, which is the result we hope for.</td></tr>
    <tr><td>The error alone matches the lookup</td><td>The compiler already says enough, and the call graph adds little at repair time.</td></tr>
    <tr><td>Full context beats the lookup</td><td>The lookup misses something, and the failures it missed show what.</td></tr>
    <tr><td>Stage 3 disagrees with stage 2</td><td>The result doesn’t travel beyond apo-games.</td></tr>
  </tbody></table></div>

  ${sec(8, "Team and open questions", "team")}
  <p>The work divides into four packages for the team of four: <b>extraction</b> (AST pipeline and audit), <b>repair</b> (lookup and loop), <b>data</b> (tasks, builds and harness), and <b>analysis</b> (failure coding, statistics and write-up). Who takes which is for the team to decide.</p>
  <p><b>Questions for the supervisor:</b></p>
  <ul>
    <li>Are the prompts, slicing code and raw run outputs available? The roughly 145 failed builds from the original study would be a direct start for stage 2.</li>
    <li>Did slicing apply to reuse only, as we read it?</li>
    <li>Is a stronger model than Flash Lite in scope?</li>
    <li>Does apo-games offer about 12 shared features with usable tests?</li>
    <li>Does three stages fit the project’s scope, or should stage 3 be a smaller check?</li>
  </ul>
  <p>This proposal builds on the <a href="research-project/benchmark-proposal.html">WireBench draft</a>: it keeps the call-graph diff as a measure and leaves the full benchmark for later.</p>

  ${sec(9, "References", "refs")}
  <ol class="refs">
    <li>Reinhartz-Berger, I., Gal-Oz, N., Litvak, M., Morad, A. (2026): LLM-assisted Code Generation and Reuse: An Exploratory Study on Contextual Information. Manuscript, LNCS format.</li>
    <li>Krüger, J. et al. (2018): Apo-Games: A Case Study for Reverse Engineering Variability from Cloned Java Variants. SPLC 2018.</li>
    <li>Rashid, M. S. et al. (2025): SWE-PolyBench: A multi-language benchmark for repository level evaluation of coding agents. ${ax("2504.08703")}</li>
    <li>Zan, D. et al. (2025): Multi-SWE-bench: A Multilingual Benchmark for Issue Resolving. ${ax("2504.02605")}</li>
    <li>Ouyang, S. et al. (2024): RepoGraph. ICLR 2025. ${ax("2410.14684")}</li>
    <li>Jimenez, C. E. et al. (2024): SWE-bench: Can Language Models Resolve Real-World GitHub Issues? ICLR 2024. ${ax("2310.06770")}</li>
  </ol>
  <p class="foot">A draft for the meeting with the supervisor, not an agreed plan. The run counts aim at about ${need(27)} runs per cell and will change after the pilot.</p>`;

const box = document.querySelector(".repair");
box.addEventListener("click", e => {
  const b = e.target.closest("button.tg"); if (!b) return;
  if (b.dataset.fail) state.fail = b.dataset.fail; else state.arm = b.dataset.arm;
  box.querySelectorAll("button[data-fail]").forEach(x => x.setAttribute("aria-pressed", x.dataset.fail === state.fail));
  box.querySelectorAll("button[data-arm]").forEach(x => x.setAttribute("aria-pressed", x.dataset.arm === state.arm));
  document.getElementById("log").innerHTML = log();
});
mountCharts(); watch();
</script>
</body>
</html>
